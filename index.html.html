<style>
/* Layout: a single study column with a tab rail; cards and question panels sit on a quiet "chart paper" ground. */
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --ink:#18233A; --muted:#55627A; --line:#D7DDE7;
  --navy:#1F3864; --teal:#00727A; --gold:#B7791F; --gold-soft:#FFF4D6; --teal-soft:#E3F2F2;
  --ok:#2E7D32; --ok-soft:#E5F3E6; --bad:#B00020; --bad-soft:#FBE6E9; --purple:#5B2C83;
  --skin:#F6E3D3; --diagram-ink:#3A4A5C; --zone-fill:#FFFFFF; --zone-ink:#1F3864; --chip:#EEF2F8;
  --display:'Newsreader', 'Times New Roman', Georgia, serif; --body:'Atkinson Hyperlegible', 'Segoe UI', Arial, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11161F; --surface:#1A212D; --ink:#E7EBF2; --muted:#A3AEC2; --line:#2E3849;
  --navy:#9DB8EA; --teal:#5CC4C8; --gold:#E2B55C; --gold-soft:#3A2F17; --teal-soft:#16302F;
  --ok:#7FCB83; --ok-soft:#183020; --bad:#F08A97; --bad-soft:#3A1A20; --purple:#C7A6EC;
  --skin:#5A4A40; --diagram-ink:#C9D3E2; --zone-fill:#1A212D; --zone-ink:#9DB8EA; --chip:#232C3B; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#11161F; --surface:#1A212D; --ink:#E7EBF2; --muted:#A3AEC2; --line:#2E3849;
  --navy:#9DB8EA; --teal:#5CC4C8; --gold:#E2B55C; --gold-soft:#3A2F17; --teal-soft:#16302F;
  --ok:#7FCB83; --ok-soft:#183020; --bad:#F08A97; --bad-soft:#3A1A20; --purple:#C7A6EC;
  --skin:#5A4A40; --diagram-ink:#C9D3E2; --zone-fill:#1A212D; --zone-ink:#9DB8EA; --chip:#232C3B; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:1rem;line-height:1.55;margin:0}
.wrap{max-width:860px;margin:0 auto;padding-inline:16px;padding-block:20px 48px}
header.brand{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 16px;border-bottom:3px solid var(--gold);padding-bottom:10px}
.brand h1{font-family:var(--display);font-weight:700;font-size:clamp(1.6rem,4vw,2.2rem);margin:0;color:var(--navy);text-wrap:balance}
.brand .by{font-size:.82rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sample{display:inline-block;margin-top:10px;font-size:.85rem;color:var(--muted)}
nav.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:18px 0 20px}
nav.tabs button{font:inherit;font-weight:700;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 16px;border-radius:999px;cursor:pointer}
nav.tabs button[aria-selected="true"]{background:var(--navy);border-color:var(--navy);color:var(--bg)}
button:focus-visible,[tabindex]:focus-visible,input:focus-visible+span{outline:3px solid var(--gold);outline-offset:2px}
h2{font-family:var(--display);font-size:1.5rem;color:var(--navy);margin:0 0 6px;text-wrap:balance}
.lede{color:var(--muted);margin:0 0 16px;max-width:65ch}
/* flashcards */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.chip{font:inherit;font-size:.85rem;border:1px solid var(--line);background:var(--chip);color:var(--ink);padding:4px 12px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--teal);color:var(--bg);border-color:var(--teal)}
.stage{perspective:1400px}
.card{position:relative;width:100%;min-height:250px;cursor:pointer;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px 22px;display:flex;flex-direction:column;justify-content:center;gap:12px;text-align:center;box-shadow:0 1px 0 var(--line)}
.face.back{transform:rotateY(180deg);border-top:5px solid var(--gold)}
.face.front{border-top:5px solid var(--teal)}
.face .tag{font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;color:var(--teal)}
.face .q{font-family:var(--display);font-size:clamp(1.25rem,3.2vw,1.6rem);font-weight:700;color:var(--navy);text-wrap:balance}
.face .a{font-size:1.15rem;max-width:56ch;margin:0 auto}
.face .hint{font-size:.8rem;color:var(--muted)}
.deckbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-top:14px}
.btn{font:inherit;font-weight:700;border:1.5px solid var(--navy);background:transparent;color:var(--navy);padding:8px 14px;border-radius:10px;cursor:pointer}
.btn.solid{background:var(--navy);color:var(--bg)}
.btn.good{border-color:var(--ok);color:var(--ok)} .btn.again{border-color:var(--bad);color:var(--bad)}
.btn:disabled{opacity:.45;cursor:default}
.count{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.9rem}
.tally{display:flex;gap:14px;font-variant-numeric:tabular-nums;font-size:.9rem}
.tally b{color:var(--ok)} .tally i{font-style:normal;color:var(--bad);font-weight:700}
/* cheat sheet */
.cs-head{background:var(--navy);color:var(--bg);padding:10px 14px;border-radius:10px 10px 0 0;font-family:var(--display);font-weight:700;font-size:1.15rem;border-bottom:3px solid var(--gold)}
.cs{display:grid;grid-template-columns:1fr 1fr;gap:16px;background:var(--surface);border:1px solid var(--line);border-top:0;border-radius:0 0 10px 10px;padding:14px}
.cs>div{min-width:0;display:flex;flex-direction:column;gap:12px}
.cs h3{margin:0 0 4px;font-size:.95rem;letter-spacing:.02em}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{border:1px solid var(--line);padding:5px 7px;text-align:left;vertical-align:top}
th{color:var(--bg);font-weight:700}
td:first-child{font-weight:700;color:var(--navy)}
tbody tr:nth-child(even) td{background:var(--chip)}
.cs ul{margin:0;padding-left:18px;font-size:.9rem}
@media (max-width:640px){.cs{grid-template-columns:1fr}}
/* case */
.case-intro{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--teal);border-radius:10px;padding:14px 16px;margin-bottom:16px}
.case-intro .meta{font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:var(--teal);margin-bottom:6px}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.step{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-weight:700;font-variant-numeric:tabular-nums;background:var(--surface);color:var(--muted)}
.step.cur{border-color:var(--navy);color:var(--navy)} .step.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)} .step.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.qpanel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.visit{display:inline-block;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--bg);background:var(--teal);padding:2px 10px;border-radius:999px}
.fmt{font-size:.85rem;color:var(--purple);margin-left:8px;font-style:italic}
.stem{font-size:1.06rem;margin:10px 0 14px;max-width:70ch}
.stem strong{color:var(--bad)}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;background:var(--surface)}
.opt input{margin-top:4px;accent-color:var(--navy)}
.opt.sel{border-color:var(--navy)} .opt.right{border-color:var(--ok);background:var(--ok-soft)} .opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.letter{font-weight:700;color:var(--navy);min-width:1.2em}
.match{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.match>div{min-width:0}
.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:48px;border:1.5px dashed var(--line);border-radius:10px;padding:8px}
.dchip{font:inherit;font-size:.92rem;border:1.5px solid var(--purple);background:var(--surface);color:var(--ink);padding:6px 10px;border-radius:8px;cursor:grab;touch-action:none}
.dchip.picked{background:var(--purple);color:var(--bg)}
.row{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.row .drug{font-weight:700;min-width:7.5em;color:var(--navy)}
.slot{flex:1;min-width:160px;min-height:42px;border:1.5px dashed var(--navy);border-radius:8px;padding:4px;display:flex;align-items:center;cursor:pointer}
.slot.over{background:var(--teal-soft)} .slot.right{border-style:solid;border-color:var(--ok);background:var(--ok-soft)} .slot.wrong{border-style:solid;border-color:var(--bad);background:var(--bad-soft)}
.slot .empty{color:var(--muted);font-size:.85rem;padding-left:6px}
@media (max-width:640px){.match{grid-template-columns:1fr}}
.hot{max-width:420px;margin:0 auto}
.hot svg{width:100%;height:auto;display:block}
.hot .zone{cursor:pointer}
.hot .zone.sel circle{fill:var(--gold-soft);stroke:var(--gold);stroke-width:4}
.hot .zone.right circle{fill:var(--ok-soft);stroke:var(--ok);stroke-width:4}
.hot .zone.wrong circle{fill:var(--bad-soft);stroke:var(--bad);stroke-width:4}
.hotsel{text-align:center;color:var(--muted);font-size:.9rem;margin-top:6px;min-height:1.5em}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;align-items:center}
.verdict{font-weight:700;font-size:1.05rem} .verdict.ok{color:var(--ok)} .verdict.bad{color:var(--bad)}
.feedback{margin-top:16px;border-top:2px solid var(--gold);padding-top:12px;display:flex;flex-direction:column;gap:10px}
.feedback h4{margin:0;font-family:var(--display);font-size:1.08rem;color:var(--navy)}
.feedback p,.feedback ul{margin:0;max-width:72ch}
.feedback ul{padding-left:20px}
.ans{background:var(--gold-soft);border-radius:8px;padding:8px 12px;font-weight:700}
.result{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;text-align:center}
.result .big{font-family:var(--display);font-size:2.4rem;color:var(--navy);font-variant-numeric:tabular-nums}
footer{margin-top:28px;font-size:.8rem;color:var(--muted);text-align:center}
@media (prefers-reduced-motion:reduce){.card{transition:none}}
.pick{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;margin:16px 0 18px}.pick label{font-weight:700;font-size:.9rem;color:var(--muted)}.pick select{font:inherit;max-width:100%;min-width:0;padding:7px 10px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}#selCase{flex:1 1 260px}.qnav{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:12px}.qnav .steps{margin:0}button.step{cursor:pointer;font:inherit;font-weight:700;padding:0}button.step:focus-visible{outline:2px solid var(--navy);outline-offset:2px}.qnav .btn{padding:7px 14px}</style>

<script>
const CASES = [{"no":1,"batch":1,"title":"Mr. Okafor: Hypertension, Diabetes and a New Murmur","setting":"Primary care clinic • Middle adult • Cardiovascular / Endocrine","scenario":"Mr. Okafor is a 56-year-old Black man with type 2 diabetes for 8 years, treated with metformin 1,000 mg twice daily. His office BP was 154/96 and 150/94 at two visits, and his home log averages 148/92. A1c is 7.2%, eGFR 74 mL/min/1.73 m², potassium 4.3 mEq/L, and the urine albumin-to-creatinine ratio is 180 mg/g on two of three samples. He does not smoke and has no history of heart failure or angioedema.","qs":[{"n":1,"t":"mc","visit":"Visit 1","s":"Based on these findings, which antihypertensive is the **most appropriate initial** choice for Mr. Okafor?","opts":["Amlodipine, a calcium channel blocker","Metoprolol, a beta-adrenergic blocker","Hydrochlorothiazide, a thiazide diuretic","Lisinopril, an ACE inhibitor"],"correctIdx":[3],"answer":"D","c":"Mr. Okafor has hypertension, type 2 diabetes and moderately increased albuminuria (UACR 30–300 mg/g). When albuminuria or CKD is present, an ACE inhibitor or ARB is the preferred first agent in every racial group because it lowers intraglomerular pressure, reduces albuminuria and slows diabetic kidney disease. This compelling indication overrides the race-based choice of a thiazide or calcium channel blocker, which do not protect the kidney in this way."},{"n":2,"t":"sata","visit":"Visit 1 (continued)","s":"The FNP starts lisinopril 10 mg daily. Which tests should be checked **1–2 weeks after starting** the medication? **Select all that apply.**","opts":["Complete blood count","Thyroid-stimulating hormone","Liver transaminases (ALT/AST)","Serum creatinine with eGFR","Serum potassium"],"correctIdx":[3,4],"answer":"D, E","c":"ACE inhibitors lower aldosterone, which raises serum potassium, and dilate the efferent arteriole, which lowers glomerular filtration pressure. Potassium detects hyperkalemia (higher risk with diabetes and CKD), and creatinine with eGFR detects an excessive fall in kidney function. A creatinine rise of up to 30% from baseline is expected and acceptable; a larger rise suggests renal artery stenosis or volume depletion. Both tests are repeated after every dose increase."},{"n":3,"t":"hot","visit":"Visit 3 (2 years later)","s":"Mr. Okafor now reports dyspnea when climbing stairs. The FNP hears a harsh, crescendo–decrescendo systolic murmur that radiates to both carotid arteries. **Click the area on the chest where this murmur is best heard.**","answer":"A","c":"A harsh crescendo–decrescendo systolic ejection murmur that radiates to the carotids is the classic sign of aortic stenosis, usually calcific in an older adult with hypertension. It is loudest over the aortic area, the 2nd right intercostal space at the right sternal border. New exertional dyspnea is a cardinal symptom (with angina and syncope), so the next step is echocardiography and cardiology referral.","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 400 320\" width=\"100%\" height=\"auto\"><rect width=\"400\" height=\"320\" fill=\"none\"/><path d=\"M 120 40 Q 200 20 280 40 L 330 70 Q 352 160 330 300 L 70 300 Q 48 160 70 70 Z\" fill=\"var(--skin)\" stroke=\"var(--diagram-ink)\" stroke-width=\"2.5\"/>\n<path d=\"M 172 40 Q 200 58 228 40\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-width=\"2\"/>\n<path d=\"M 196 62 Q 150 64 86 74\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-width=\"5\" stroke-linecap=\"round\"/>\n<path d=\"M 204 62 Q 250 64 314 74\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-width=\"5\" stroke-linecap=\"round\"/>\n<rect x=\"186\" y=\"66\" width=\"28\" height=\"170\" rx=\"10\" fill=\"var(--diagram-ink)\" fill-opacity=\"0.14\" stroke=\"var(--diagram-ink)\" stroke-width=\"2\"/>\n<path d=\"M 184 96 Q 120 102 86 126\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-opacity=\"0.35\" stroke-width=\"2\"/><path d=\"M 216 96 Q 280 102 314 126\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-opacity=\"0.35\" stroke-width=\"2\"/><path d=\"M 184 122 Q 120 128 90 152\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-opacity=\"0.35\" stroke-width=\"2\"/><path d=\"M 216 122 Q 280 128 310 152\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-opacity=\"0.35\" stroke-width=\"2\"/><path d=\"M 184 148 Q 120 154 94 178\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-opacity=\"0.35\" stroke-width=\"2\"/><path d=\"M 216 148 Q 280 154 306 178\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-opacity=\"0.35\" stroke-width=\"2\"/><path d=\"M 184 174 Q 120 180 98 204\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-opacity=\"0.35\" stroke-width=\"2\"/><path d=\"M 216 174 Q 280 180 302 204\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-opacity=\"0.35\" stroke-width=\"2\"/><path d=\"M 184 200 Q 120 206 102 230\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-opacity=\"0.35\" stroke-width=\"2\"/><path d=\"M 216 200 Q 280 206 298 230\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-opacity=\"0.35\" stroke-width=\"2\"/><path d=\"M 184 226 Q 120 232 106 256\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-opacity=\"0.35\" stroke-width=\"2\"/><path d=\"M 216 226 Q 280 232 294 256\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-opacity=\"0.35\" stroke-width=\"2\"/>\n<line x1=\"288\" y1=\"70\" x2=\"288\" y2=\"290\" stroke=\"var(--diagram-ink)\" stroke-width=\"1.5\" stroke-dasharray=\"5 5\" stroke-opacity=\"0.6\"/>\n<text x=\"292\" y=\"286\" font-family=\"Arial, sans-serif\" font-size=\"11\" font-weight=\"400\" fill=\"var(--diagram-ink)\" text-anchor=\"start\">MCL</text><text x=\"40\" y=\"20\" font-family=\"Arial, sans-serif\" font-size=\"12\" font-weight=\"700\" fill=\"var(--diagram-ink)\" text-anchor=\"start\">Patient's RIGHT</text><text x=\"268\" y=\"20\" font-family=\"Arial, sans-serif\" font-size=\"12\" font-weight=\"700\" fill=\"var(--diagram-ink)\" text-anchor=\"start\">Patient's LEFT</text><g class=\"zone\" data-id=\"A\" tabindex=\"0\" role=\"button\" aria-label=\"Area A\">\n<circle cx=\"168\" cy=\"118\" r=\"15\" fill=\"var(--zone-fill)\" stroke=\"var(--zone-ink)\" stroke-width=\"2.5\"/>\n<text x=\"168\" y=\"123.5\" text-anchor=\"middle\" font-family=\"Georgia, 'Times New Roman', serif\" font-size=\"16\" font-weight=\"700\" fill=\"var(--zone-ink)\">A</text></g><g class=\"zone\" data-id=\"B\" tabindex=\"0\" role=\"button\" aria-label=\"Area B\">\n<circle cx=\"232\" cy=\"118\" r=\"15\" fill=\"var(--zone-fill)\" stroke=\"var(--zone-ink)\" stroke-width=\"2.5\"/>\n<text x=\"232\" y=\"123.5\" text-anchor=\"middle\" font-family=\"Georgia, 'Times New Roman', serif\" font-size=\"16\" font-weight=\"700\" fill=\"var(--zone-ink)\">B</text></g><g class=\"zone\" data-id=\"C\" tabindex=\"0\" role=\"button\" aria-label=\"Area C\">\n<circle cx=\"236\" cy=\"160\" r=\"15\" fill=\"var(--zone-fill)\" stroke=\"var(--zone-ink)\" stroke-width=\"2.5\"/>\n<text x=\"236\" y=\"165.5\" text-anchor=\"middle\" font-family=\"Georgia, 'Times New Roman', serif\" font-size=\"16\" font-weight=\"700\" fill=\"var(--zone-ink)\">C</text></g><g class=\"zone\" data-id=\"D\" tabindex=\"0\" role=\"button\" aria-label=\"Area D\">\n<circle cx=\"234\" cy=\"206\" r=\"15\" fill=\"var(--zone-fill)\" stroke=\"var(--zone-ink)\" stroke-width=\"2.5\"/>\n<text x=\"234\" y=\"211.5\" text-anchor=\"middle\" font-family=\"Georgia, 'Times New Roman', serif\" font-size=\"16\" font-weight=\"700\" fill=\"var(--zone-ink)\">D</text></g><g class=\"zone\" data-id=\"E\" tabindex=\"0\" role=\"button\" aria-label=\"Area E\">\n<circle cx=\"288\" cy=\"222\" r=\"15\" fill=\"var(--zone-fill)\" stroke=\"var(--zone-ink)\" stroke-width=\"2.5\"/>\n<text x=\"288\" y=\"227.5\" text-anchor=\"middle\" font-family=\"Georgia, 'Times New Roman', serif\" font-size=\"16\" font-weight=\"700\" fill=\"var(--zone-ink)\">E</text></g></svg>"}]},{"no":2,"batch":1,"title":"Mrs. Reyes: Sudden Confusion","setting":"Primary care clinic • Older adult • Neurocognitive / Pharmacology","scenario":"Mrs. Reyes is a 78-year-old woman brought in by her daughter, who reports that for the past 2 days her mother has been confused, worse at night, picking at the bed sheets, and drowsy at times but alert at others. At baseline she is independent and manages her own finances; her MoCA score last year was 27. Her medications are amlodipine 10 mg daily, oxybutynin 5 mg twice daily (started 3 weeks ago for urge incontinence), ibuprofen 400 mg three times daily for knee osteoarthritis, and over-the-counter diphenhydramine 50 mg at bedtime (started 1 week ago for sleep). Temperature is 37.2 °C, HR 88, BP 132/76 and SpO₂ 96%. She is oriented to person only and cannot recite the months of the year backward.","qs":[{"n":4,"t":"sata","visit":"Visit 1","s":"The FNP applies the Confusion Assessment Method (CAM). Which features **must be present** to support a diagnosis of delirium? **Select all that apply.**","opts":["Inattention","Clear consciousness with word-finding difficulty","Acute onset with a fluctuating course","Disorganized thinking or an altered level of consciousness","Gradual memory decline over months to years"],"correctIdx":[0,2,3],"answer":"A, C, D","c":"The CAM requires (1) acute onset and fluctuating course AND (2) inattention, PLUS either (3) disorganized thinking or (4) an altered level of consciousness. Mrs. Reyes shows all of these: symptoms began 2 days ago and fluctuate, she cannot recite the months backward (inattention), and she alternates between drowsiness and alertness while picking at the sheets. Inattention is the hallmark that separates delirium from dementia."},{"n":5,"t":"mc","visit":"Visit 1 (continued)","s":"Urinalysis, CBC, glucose, sodium and calcium are normal, and the neurological examination shows no focal deficit. What is the **most appropriate next step**?","opts":["Order an urgent head CT without contrast","Stop diphenhydramine and oxybutynin now","Start low-dose quetiapine at bedtime","Begin donepezil for probable dementia"],"correctIdx":[1],"answer":"B","c":"Medications are the most common reversible cause of delirium in older adults. Diphenhydramine and oxybutynin are both strongly anticholinergic, both are on the AGS Beers Criteria list, and both were started within the past 3 weeks, matching the timing of her confusion. With normal labs and no focal deficit, removing the offending drugs is the priority, together with non-drug measures (reorientation, glasses and hearing aids, family presence, sleep routine) and close follow-up."},{"n":6,"t":"match","visit":"Visit 2 (10 days later)","s":"Mrs. Reyes's confusion has resolved. She still wants help with sleep, bladder urgency and knee pain. **Drag each medication she was taking to the safer alternative the FNP should recommend.** One option will not be used.","items":["Diphenhydramine for sleep","Oxybutynin for urge incontinence","Oral ibuprofen for knee osteoarthritis"],"tgts":["Topical diclofenac gel","CBT for insomnia and sleep hygiene","Zolpidem 10 mg at bedtime","Mirabegron with bladder training"],"map":[1,3,0],"answer":"1–B, 2–D, 3–A","c":"CBT for insomnia is first-line for chronic insomnia and avoids the anticholinergic confusion and falls caused by diphenhydramine. Mirabegron, a beta-3 agonist, treats overactive bladder without anticholinergic effects and is preferred over oxybutynin in older adults; bladder training is first-line behavioral therapy. Topical diclofenac relieves knee osteoarthritis pain with far less GI bleeding, kidney injury and blood pressure effect than long-term oral NSAIDs. Zolpidem is the unused option because Z-drugs are on the Beers list (confusion, falls, fractures)."}]},{"no":3,"batch":1,"title":"Mr. Lindqvist: Worsening Breathlessness","setting":"Primary care clinic • Older adult • Respiratory","scenario":"Mr. Lindqvist is a 71-year-old retired welder with a 50 pack-year smoking history who quit 3 years ago. He reports progressive breathlessness when walking up one flight of stairs and a morning cough with clear sputum. He uses an albuterol inhaler about four times a week. Post-bronchodilator spirometry shows FEV₁/FVC of 0.61 and FEV₁ of 58% predicted. His mMRC dyspnea grade is 2, and he has had no exacerbations or hospital stays in the past year.","qs":[{"n":7,"t":"mc","visit":"Visit 1","s":"Which maintenance regimen is **most appropriate** to start for Mr. Lindqvist?","opts":["Albuterol as needed with no change","An inhaled corticosteroid used alone","A daily oral theophylline tablet","A LAMA plus LABA combination inhaler"],"correctIdx":[3],"answer":"D","c":"Mr. Lindqvist has confirmed COPD (post-bronchodilator FEV₁/FVC < 0.70) with moderate airflow limitation (GOLD 2) and significant symptoms (mMRC ≥ 2) but no exacerbations, placing him in GOLD group B. GOLD recommends starting a LAMA plus LABA combination for group B because dual bronchodilation improves symptoms and lung function more than either alone. Inhaled corticosteroids are never used alone in COPD and raise pneumonia risk."},{"n":8,"t":"sata","visit":"Visit 1 (continued)","s":"Which additional interventions are recommended for Mr. Lindqvist's COPD care? **Select all that apply.**","opts":["Referral to pulmonary rehabilitation","Long-term oxygen with SpO₂ 95% at rest","Long-term oral prednisone","RSV vaccination","Pneumococcal vaccination"],"correctIdx":[0,3,4],"answer":"A, D, E","c":"Pulmonary rehabilitation improves dyspnea, exercise tolerance and quality of life in symptomatic COPD. Pneumococcal vaccination is recommended for all adults ≥ 50 and for anyone with chronic lung disease, and RSV vaccination is recommended for adults ≥ 75 and for adults 50–74 at increased risk, which includes chronic lung disease. Long-term oral steroids cause harm without benefit, and oxygen is indicated only for resting hypoxemia (PaO₂ ≤ 55 mm Hg or SpO₂ ≤ 88%)."},{"n":9,"t":"mc","visit":"Visit 2 (5 months later)","s":"Mr. Lindqvist reports 3 days of increased breathlessness and more sputum that is now green. He is alert, RR 22, SpO₂ 91% on room air, and he can speak in full sentences. Which outpatient treatment is **most appropriate**?","opts":["A 3-week tapering course of prednisone","An inhaled corticosteroid added as monotherapy","Oxygen titrated to an SpO₂ above 98%","Prednisone 40 mg for 5 days plus an antibiotic"],"correctIdx":[3],"answer":"D","c":"He has an acute COPD exacerbation with all three Anthonisen features (more dyspnea, more sputum, purulence), so he benefits from both a short course of systemic corticosteroids (prednisone 40 mg daily for 5 days) and an antibiotic such as amoxicillin–clavulanate, doxycycline or azithromycin, plus increased short-acting bronchodilator use. Longer steroid courses add harm without benefit, and in COPD the oxygen target is 88–92% to avoid CO₂ retention."}]},{"no":4,"batch":1,"title":"Mrs. Castillo: An Irregular Pulse","setting":"Primary care clinic • Older adult • Cardiovascular","scenario":"Mrs. Castillo is a 77-year-old woman with hypertension and type 2 diabetes who reports intermittent palpitations and fatigue for 2 weeks. Her pulse is 112 and irregularly irregular, BP is 138/82, and she is in no distress. An ECG shows atrial fibrillation with no P waves and a narrow QRS. She takes lisinopril and metformin. She has no history of valve disease, mechanical valves or bleeding.","qs":[{"n":10,"t":"sata","visit":"Visit 1","s":"Which tests are part of the **initial evaluation** of Mrs. Castillo's new atrial fibrillation? **Select all that apply.**","opts":["Basic metabolic panel","Cardiac catheterization","Serum lipase","Transthoracic echocardiogram","Thyroid-stimulating hormone"],"correctIdx":[0,3,4],"answer":"A, D, E","c":"New atrial fibrillation is evaluated for reversible causes and structural heart disease. TSH detects hyperthyroidism, a classic and treatable cause; echocardiography assesses valve disease, left atrial size and ventricular function, which guide therapy; and a basic metabolic panel checks electrolytes and kidney function, which also affect anticoagulant dosing. Lipase and cardiac catheterization are not part of the routine work-up without specific symptoms."},{"n":11,"t":"mc","visit":"Visit 1 (continued)","s":"Mrs. Castillo's age, sex, hypertension and diabetes give her a high stroke risk. Which therapy is **most appropriate** for stroke prevention?","opts":["No therapy until a stroke occurs","Aspirin 81 mg taken once daily","Apixaban, a direct oral anticoagulant","Clopidogrel 75 mg taken once daily"],"correctIdx":[2],"answer":"C","c":"Her CHA₂DS₂-VASc risk factors (age ≥ 75, female sex, hypertension, diabetes) place her well above the threshold for anticoagulation. Direct oral anticoagulants such as apixaban are preferred over warfarin for non-valvular atrial fibrillation because they cause less intracranial bleeding and need no INR monitoring. Aspirin and clopidogrel are not adequate stroke prevention in atrial fibrillation."},{"n":12,"t":"mc","visit":"Visit 1 (continued)","s":"Her heart rate remains 108–115 at rest and she has no heart failure. Which medication is the **best choice** for rate control?","opts":["Digoxin as the first and only agent","Metoprolol succinate, a beta-blocker","Amiodarone, an antiarrhythmic agent","Hydralazine, a direct vasodilator"],"correctIdx":[1],"answer":"B","c":"Beta-blockers (or the non-dihydropyridine calcium channel blockers diltiazem and verapamil) are first-line for rate control in atrial fibrillation when ejection fraction is preserved. Digoxin is less effective during activity and is reserved for heart failure or sedentary patients, and on the Beers list it should not be first-line. Amiodarone is a rhythm-control drug with significant toxicity, and hydralazine does not slow AV-node conduction."}]},{"no":5,"batch":1,"title":"Mrs. Thompson: Bones and Balance","setting":"Primary care clinic • Older adult • Musculoskeletal","scenario":"Mrs. Thompson is a 69-year-old white woman who has lost 1.5 inches in height. Her mother had a hip fracture at age 75. She smokes half a pack a day and drinks one glass of wine daily. She has never had a bone density test. Her medications are omeprazole for 6 years and levothyroxine. Her TSH is in the normal range.","qs":[{"n":13,"t":"mc","visit":"Visit 1","s":"DXA shows a T-score of −2.8 at the femoral neck. How should the FNP **interpret** this result?","opts":["A result that needs a Z-score first","Osteoporosis requiring drug treatment","Osteopenia needing lifestyle change only","Normal bone density for her age group"],"correctIdx":[1],"answer":"B","c":"In postmenopausal women and men ≥ 50, the T-score compares bone density with that of a young healthy adult. A T-score of −2.5 or lower defines osteoporosis, and drug therapy is recommended. Osteopenia is −1.0 to −2.5. Z-scores (comparison with age-matched peers) are used for premenopausal women, men under 50 and children, not for this patient."},{"n":14,"t":"sata","visit":"Visit 1 (continued)","s":"The FNP prescribes alendronate 70 mg weekly. Which instructions should Mrs. Thompson receive? **Select all that apply.**","opts":["Lie down for 30 minutes if she feels nauseated","Stay upright for at least 30 minutes after the dose","Take it first thing in the morning on an empty stomach","Swallow it with a full glass (8 oz) of plain water","Take it with her morning calcium supplement"],"correctIdx":[1,2,3],"answer":"B, C, D","c":"Oral bisphosphonates are poorly absorbed and can cause esophagitis. They must be taken on waking with a full glass of plain water, at least 30 minutes before food, drinks or other medicines, and the patient must remain upright for at least 30 minutes (60 minutes for ibandronate). Calcium binds the drug and blocks absorption, so it is taken later in the day, and lying down increases the risk of esophageal injury."},{"n":15,"t":"sata","visit":"Visit 2 (3 months later)","s":"Which factors in Mrs. Thompson's history **increase her fracture risk** and should be addressed? **Select all that apply.**","opts":["One glass of wine daily","Long-term proton pump inhibitor use","Levothyroxine with a normal TSH","Parental history of hip fracture","Current cigarette smoking"],"correctIdx":[1,3,4],"answer":"B, D, E","c":"Smoking, long-term PPI use and a parent with a hip fracture are recognized osteoporosis and fracture risk factors (the last is a FRAX input). Smoking cessation and reassessing the need for long-term omeprazole are modifiable steps. Alcohol increases risk at three or more drinks a day, not one, and levothyroxine raises fracture risk only when over-replaced, which her normal TSH rules out."}]},{"no":6,"batch":1,"title":"Mr. Adebayo: Aching Shoulders and a New Headache","setting":"Primary care clinic • Older adult • Rheumatology / Neurology","scenario":"Mr. Adebayo is a 72-year-old man with 6 weeks of aching and morning stiffness in both shoulders and hips lasting about 2 hours. He has trouble getting out of a chair and combing his hair because of stiffness, but strength is 5/5 on testing. ESR is 78 mm/h and CRP is elevated. CK is normal.","qs":[{"n":16,"t":"mc","visit":"Visit 1","s":"What is the **most likely** diagnosis?","opts":["Polymyalgia rheumatica","Fibromyalgia syndrome","Rheumatoid arthritis","Statin-induced myopathy"],"correctIdx":[0],"answer":"A","c":"Polymyalgia rheumatica affects adults over 50 and causes bilateral shoulder and hip girdle aching with prolonged morning stiffness, functional difficulty without true weakness, and markedly raised ESR and CRP. A normal CK and normal strength argue against myopathy. Rheumatoid arthritis involves the small joints of the hands and feet, and fibromyalgia has normal inflammatory markers."},{"n":17,"t":"mc","visit":"Visit 1 (continued)","s":"Which treatment is **most appropriate** for Mr. Adebayo's condition?","opts":["Prednisone 60 mg daily for 2 days only","Naproxen 500 mg twice daily long term","Methotrexate weekly as the first drug","Prednisone 15 mg daily with a slow taper"],"correctIdx":[3],"answer":"D","c":"Polymyalgia rheumatica responds dramatically, often within days, to low-dose prednisone (12.5–25 mg daily), which is then tapered slowly over 1–2 years. A lack of rapid response should prompt reconsideration of the diagnosis. NSAIDs are inadequate, and methotrexate is a steroid-sparing add-on, not first-line."},{"n":18,"t":"sata","visit":"Visit 2 (4 weeks later)","s":"Mr. Adebayo calls about a new right temporal headache. Which findings would require **same-day high-dose steroids** for suspected giant cell arteritis? **Select all that apply.**","opts":["Pain relieved by acetaminophen","Scalp tenderness when combing hair","Transient blurred vision in one eye","Bilateral band-like headache with stress","Jaw pain when chewing"],"correctIdx":[1,2,4],"answer":"B, C, E","c":"Giant cell arteritis is closely linked to polymyalgia rheumatica. Jaw claudication, scalp tenderness and visual symptoms (amaurosis, blurring, diplopia) with a new temporal headache in an older adult are red flags. High-dose prednisone (40–60 mg) is started immediately, before temporal artery biopsy or ultrasound, to prevent irreversible blindness. Band-like stress headache describes tension-type headache."}]},{"no":7,"batch":1,"title":"Mr. Chukwu: Getting Up at Night","setting":"Primary care clinic • Older adult • Genitourinary / Men's health","scenario":"Mr. Chukwu is a 68-year-old man with 1 year of weak urinary stream, hesitancy, dribbling and nocturia three times a night. His IPSS score is 17 (moderate). On digital rectal examination the prostate is smooth, rubbery, symmetrically enlarged and non-tender, with no nodules. Urinalysis is normal. He has a cataract operation scheduled in 2 months.","qs":[{"n":19,"t":"mc","visit":"Visit 1","s":"Which medication provides the **fastest symptom relief** for Mr. Chukwu's condition?","opts":["Finasteride, a 5-alpha-reductase inhibitor","Tamsulosin, an alpha-1 blocker","Pseudoephedrine, a decongestant","Oxybutynin, an antimuscarinic agent"],"correctIdx":[1],"answer":"B","c":"Benign prostatic hyperplasia with moderate symptoms is treated first with an alpha-1 blocker such as tamsulosin, which relaxes prostatic and bladder-neck smooth muscle and improves symptoms within days to weeks. Finasteride shrinks the prostate but takes 6–12 months to work. Antimuscarinics can cause retention when outlet obstruction predominates, and decongestants worsen obstruction."},{"n":20,"t":"mc","visit":"Visit 1 (continued)","s":"Because of his upcoming surgery, what is the **most important** teaching point about tamsulosin?","opts":["Take it every morning with breakfast","Double the dose on the day of surgery","Tell the eye surgeon he takes tamsulosin","Stop the drug 1 day before the surgery"],"correctIdx":[2],"answer":"C","c":"Alpha-1 blockers, especially tamsulosin, can cause intraoperative floppy iris syndrome, which complicates cataract surgery. The ophthalmologist must know so that surgical technique can be adjusted; stopping the drug shortly before surgery does not reliably prevent the problem. Alpha-blockers are usually taken at bedtime to limit orthostatic dizziness."},{"n":21,"t":"mc","visit":"Visit 2 (6 weeks later)","s":"Mr. Chukwu calls because he has been unable to void for 10 hours and has lower abdominal pain. He started an over-the-counter cold medicine 2 days ago. What is the **best action**?","opts":["Send him for urgent bladder catheterization","Add finasteride and review him in 1 week","Advise more fluids and a warm bath tonight","Start oxybutynin to relax the bladder now"],"correctIdx":[0],"answer":"A","c":"Inability to void with suprapubic pain is acute urinary retention, a urologic urgency that requires prompt bladder decompression by catheter. Decongestants (pseudoephedrine) and first-generation antihistamines in cold medicines commonly precipitate retention in men with BPH. Waiting, adding fluids or starting an antimuscarinic would worsen the obstruction."}]},{"no":8,"batch":1,"title":"Mrs. Washington: Swollen Ankles and Shortness of Breath","setting":"Primary care clinic • Older adult • Cardiovascular","scenario":"Mrs. Washington is a 74-year-old Black woman with a history of myocardial infarction 3 years ago. She reports dyspnea after walking one block, two-pillow orthopnea and ankle swelling for a month. She has bibasilar crackles, JVD at 6 cm above the sternal angle, an S3, and 2+ pitting edema. Echocardiography shows an ejection fraction of 30%. BP is 128/76, HR 84, potassium 4.4 mEq/L and eGFR 62.","qs":[{"n":22,"t":"match","visit":"Visit 1","s":"The FNP plans guideline-directed therapy for heart failure with reduced ejection fraction. **Drag each therapy class to the medication that fulfils it.** One option will not be used.","items":["Angiotensin receptor–neprilysin inhibitor","Evidence-based beta-blocker","Mineralocorticoid receptor antagonist","SGLT2 inhibitor"],"tgts":["Carvedilol","Diltiazem","Spironolactone","Sacubitril–valsartan","Dapagliflozin"],"map":[3,0,2,4],"answer":"1–D, 2–A, 3–C, 4–E","c":"The four pillars of HFrEF therapy each reduce mortality: an ARNI (sacubitril–valsartan, preferred over an ACE inhibitor or ARB), an evidence-based beta-blocker (carvedilol, metoprolol succinate or bisoprolol), a mineralocorticoid receptor antagonist (spironolactone or eplerenone) and an SGLT2 inhibitor (dapagliflozin or empagliflozin). Diltiazem is the unused option because non-dihydropyridine calcium channel blockers worsen HFrEF."},{"n":23,"t":"mc","visit":"Visit 1 (continued)","s":"Which medication relieves Mrs. Washington's **congestion symptoms** but does **not** reduce mortality?","opts":["Furosemide, a loop diuretic","Spironolactone, an aldosterone blocker","Carvedilol, a beta-blocker","Dapagliflozin, an SGLT2 inhibitor"],"correctIdx":[0],"answer":"A","c":"Loop diuretics such as furosemide remove excess fluid and relieve dyspnea, orthopnea and edema, but they have not been shown to lower mortality in heart failure. The beta-blocker, MRA and SGLT2 inhibitor are guideline-directed therapies with proven survival benefit and should be started and titrated even after the patient feels better."},{"n":24,"t":"sata","visit":"Visit 2 (2 weeks later)","s":"Which teaching points should the FNP give Mrs. Washington about self-care? **Select all that apply.**","opts":["Stop carvedilol when your ankles feel better","Weigh yourself every morning after voiding","Avoid over-the-counter ibuprofen and naproxen","Call if you gain 2–3 lb in a day or 5 lb in a week","Use a salt substitute freely with spironolactone"],"correctIdx":[1,2,3],"answer":"B, C, D","c":"Daily morning weights detect fluid retention early, and a gain of 2–3 lb in a day or 5 lb in a week should be reported. NSAIDs cause sodium and fluid retention and can precipitate decompensation. Beta-blockers must not be stopped abruptly or when symptoms improve, and potassium-based salt substitutes with spironolactone risk dangerous hyperkalemia."}]},{"no":9,"batch":1,"title":"Mr. Nwosu: A New Diagnosis of Diabetes","setting":"Primary care clinic • Middle adult • Endocrine / Cardiovascular","scenario":"Mr. Nwosu is a 58-year-old man with obesity (BMI 34) and a stent placed for coronary artery disease 2 years ago. Routine labs show fasting glucose of 148 mg/dL and an A1c of 7.6%; a repeat A1c is 7.5%. eGFR is 82 and the urine albumin-to-creatinine ratio is normal. He takes aspirin, atorvastatin 80 mg and metoprolol.","qs":[{"n":25,"t":"mc","visit":"Visit 1","s":"In addition to metformin and lifestyle change, which medication class is **preferred** for Mr. Nwosu because of proven cardiovascular benefit?","opts":["A DPP-4 inhibitor such as sitagliptin","A sulfonylurea such as glipizide","A thiazolidinedione such as pioglitazone","A GLP-1 receptor agonist such as semaglutide"],"correctIdx":[3],"answer":"D","c":"The ADA recommends a GLP-1 receptor agonist (or SGLT2 inhibitor) with proven cardiovascular benefit for patients with established ASCVD, independent of A1c or metformin use. Semaglutide, liraglutide and dulaglutide reduce major adverse cardiovascular events and also promote weight loss, which helps Mr. Nwosu. Sulfonylureas and DPP-4 inhibitors have no CV benefit, and pioglitazone causes weight gain and fluid retention."},{"n":26,"t":"mc","visit":"Visit 1 (continued)","s":"Which history must the FNP **rule out** before prescribing semaglutide?","opts":["Personal or family medullary thyroid cancer","A personal history of kidney stones","A family history of type 2 diabetes","A history of seasonal allergic rhinitis"],"correctIdx":[0],"answer":"A","c":"GLP-1 receptor agonists carry a boxed warning for thyroid C-cell tumors and are contraindicated in patients with a personal or family history of medullary thyroid carcinoma or multiple endocrine neoplasia type 2. Other cautions include a history of pancreatitis and gallbladder disease. Kidney stones, family history of diabetes and allergic rhinitis are not contraindications."},{"n":27,"t":"sata","visit":"Visit 2 (3 months later)","s":"The FNP performs Mr. Nwosu's diabetes foot examination. Which elements belong in the **annual comprehensive** foot examination? **Select all that apply.**","opts":["Vibration sense with a 128-Hz tuning fork","10-g monofilament testing","Plain x-ray of both feet","Inspection of skin, nails and deformities","Nerve conduction studies"],"correctIdx":[0,1,3],"answer":"A, B, D","c":"The annual comprehensive diabetic foot examination includes inspection of the skin, nails and foot structure, assessment of pedal pulses, and testing for loss of protective sensation with a 10-g monofilament plus at least one other test such as 128-Hz vibration, pinprick or ankle reflexes. Feet are also inspected at every visit. Imaging and nerve conduction studies are not routine screening tests."}]},{"no":10,"batch":1,"title":"Ms. Haddad: Tired and Cold","setting":"Primary care clinic • Middle adult • Endocrine","scenario":"Ms. Haddad is a 47-year-old woman with 4 months of fatigue, constipation, cold intolerance, dry skin, weight gain of 8 lb and heavier periods. She has a firm, non-tender, diffusely enlarged thyroid. Her mother has vitiligo. She has no cardiac history.","qs":[{"n":28,"t":"mc","visit":"Visit 1","s":"TSH is 14.2 mIU/L and free T4 is low. Which result would **confirm the most likely cause**?","opts":["Positive anti-thyroid peroxidase antibodies","An elevated serum calcitonin concentration","Positive TSH receptor-stimulating antibodies","Diffusely increased radioactive iodine uptake"],"correctIdx":[0],"answer":"A","c":"High TSH with low free T4 is primary hypothyroidism, and in the U.S. the most common cause is Hashimoto (autoimmune) thyroiditis, confirmed by anti-TPO antibodies. A firm goiter and a family history of autoimmune disease fit this picture. TSH receptor antibodies and increased uptake indicate Graves disease, and calcitonin is a marker of medullary thyroid cancer."},{"n":29,"t":"sata","visit":"Visit 1 (continued)","s":"The FNP starts levothyroxine. Which instructions are correct? **Select all that apply.**","opts":["Stop it once your energy improves","Separate it from calcium and iron by about 4 hours","Take it on an empty stomach 30–60 minutes before breakfast","Take it with your morning coffee and calcium","Expect a repeat TSH in about 6–8 weeks"],"correctIdx":[1,2,4],"answer":"B, C, E","c":"Levothyroxine absorption is reduced by food, coffee, calcium, iron, antacids and PPIs, so it is taken on an empty stomach with water and separated from those agents by about 4 hours. Because its half-life is about 7 days, a steady state takes about 6 weeks, so TSH is rechecked 6–8 weeks after starting or changing the dose. Treatment of Hashimoto hypothyroidism is usually lifelong."},{"n":30,"t":"mc","visit":"Visit 2 (5 months later)","s":"Ms. Haddad is now euthyroid and tells the FNP she has just had a positive home pregnancy test. What is the **most appropriate** action?","opts":["Keep the dose and recheck TSH after delivery","Increase levothyroxine by about 25–30% now","Switch levothyroxine to propylthiouracil","Stop levothyroxine for the first trimester"],"correctIdx":[1],"answer":"B","c":"Thyroid hormone requirements rise early in pregnancy, and maternal hypothyroidism harms fetal neurodevelopment. Women on levothyroxine should increase the dose by about 25–30% (for example two extra tablets a week) as soon as pregnancy is confirmed, with TSH checked about every 4 weeks in the first half of pregnancy. Stopping or keeping the dose unchanged risks hypothyroidism, and PTU treats hyperthyroidism."}]},{"no":11,"batch":1,"title":"Mrs. Bello: Heavy, Irregular Periods","setting":"Primary care clinic • Middle adult • Women's health","scenario":"Mrs. Bello is a 48-year-old woman (G3P3) with 6 months of irregular, heavy menstrual bleeding with clots and occasional bleeding between periods. She has obesity (BMI 38) and hypertension. Her urine pregnancy test is negative and hemoglobin is 10.9 g/dL. Pelvic examination is normal, and cervical screening is up to date and normal.","qs":[{"n":31,"t":"mc","visit":"Visit 1","s":"In addition to transvaginal ultrasound, which test is **most important** to evaluate Mrs. Bello's bleeding?","opts":["Repeat Pap test now","Endometrial biopsy","Serum CA-125 level","Serum FSH level only"],"correctIdx":[1],"answer":"B","c":"Endometrial sampling is indicated for abnormal uterine bleeding in women aged 45 and older and in younger women with unopposed estrogen exposure. Mrs. Bello has both age and obesity (peripheral estrogen production) as risk factors for endometrial hyperplasia and cancer. CA-125 is not a diagnostic test for bleeding, her cervical screening is current, and FSH does not exclude malignancy."},{"n":32,"t":"sata","visit":"Visit 1 (continued)","s":"Which factors **increase** Mrs. Bello's risk of endometrial cancer? **Select all that apply.**","opts":["Use of tamoxifen","Multiple previous pregnancies","Past use of combined oral contraceptives","Chronic anovulation with unopposed estrogen","Obesity"],"correctIdx":[0,3,4],"answer":"A, D, E","c":"Endometrial cancer is driven by unopposed estrogen. Obesity is the most important modifiable risk factor because adipose tissue converts androgens to estrogen; chronic anovulation (as in PCOS and perimenopause) leaves estrogen unopposed by progesterone; and tamoxifen acts as an estrogen agonist on the endometrium. Pregnancy and combined oral contraceptives are protective."},{"n":33,"t":"mc","visit":"Visit 2 (2 years later)","s":"Mrs. Bello's biopsy was benign. She is now 50, has had no period for 14 months and has disabling hot flashes. She still has her uterus. Which hormone therapy is **appropriate** if she has no contraindications?","opts":["Estrogen alone at the lowest dose","Testosterone gel applied daily","Estrogen combined with a progestogen","Progestogen-only vaginal cream"],"correctIdx":[2],"answer":"C","c":"Menopausal hormone therapy is the most effective treatment for vasomotor symptoms in women under 60 or within 10 years of menopause. A woman with a uterus must receive a progestogen with estrogen to prevent endometrial hyperplasia and cancer from unopposed estrogen. Estrogen alone is used only after hysterectomy; transdermal estrogen carries less VTE risk and may suit her hypertension and obesity."}]},{"no":12,"batch":1,"title":"Mr. Kowalski: Back Pain After Lifting","setting":"Primary care clinic • Middle adult • Musculoskeletal / Neurology","scenario":"Mr. Kowalski is a 44-year-old warehouse worker who developed low back pain 5 days ago after lifting a heavy box. The pain radiates down the back of his left leg to the lateral foot. He has no fever, weight loss, cancer history or bowel or bladder change. The straight-leg raise reproduces leg pain at 40°, the left Achilles reflex is reduced, and plantar flexion is mildly weak.","qs":[{"n":34,"t":"mc","visit":"Visit 1","s":"Mr. Kowalski's findings indicate compression of which nerve root?","opts":["S1 nerve root","L4 nerve root","L2 nerve root","L5 nerve root"],"correctIdx":[0],"answer":"A","c":"S1 radiculopathy causes pain and numbness in the posterior calf, lateral foot and sole, weakness of plantar flexion (difficulty toe walking) and a reduced Achilles reflex. L5 affects the dorsum of the foot and great toe extension with no reliable reflex change, and L4 reduces the patellar reflex and weakens knee extension."},{"n":35,"t":"mc","visit":"Visit 1 (continued)","s":"What is the **most appropriate** initial management?","opts":["Prescribe strict bed rest for one week","Start oxycodone for at least 2 weeks","Stay active, use heat and take an NSAID","Order lumbar MRI before any treatment"],"correctIdx":[2],"answer":"C","c":"Acute low back pain with radiculopathy and no red flags is managed conservatively: remaining active, superficial heat and NSAIDs (or a short course of muscle relaxant). About 90% of cases improve within 6 weeks. Imaging is not recommended in the first 6 weeks without red flags, bed rest delays recovery, and opioids are avoided except for severe pain unresponsive to other therapy."},{"n":36,"t":"ord","visit":"Visit 2 (3 days later)","s":"Mr. Kowalski calls to say that since this morning he cannot urinate, his buttocks and inner thighs feel numb, and both legs are weak. **Place the FNP's actions in priority order.**","items":["Step 1","Step 2","Step 3","Step 4"],"tgts":["Document the assessment and plan in his record","Communicate findings in a structured handoff (SBAR)","Arrange immediate emergency department transfer","Recognize possible cauda equina syndrome"],"map":[3,2,1,0],"answer":"D, C, B, A","c":"Urinary retention, saddle anesthesia and bilateral leg weakness are red flags for cauda equina syndrome, a surgical emergency. The FNP first recognizes the emergency, then arranges immediate transfer for emergency MRI and surgical decompression, communicates a clear SBAR handoff to the receiving team, and documents the encounter. Delay in decompression risks permanent bladder, bowel and sexual dysfunction."}]},{"no":13,"batch":1,"title":"Mr. Ferreira: A Hot, Swollen Toe","setting":"Urgent visit • Middle adult • Musculoskeletal / Metabolic","scenario":"Mr. Ferreira is a 52-year-old man who woke at 3 a.m. with excruciating pain in his right big toe. The first metatarsophalangeal joint is red, hot and exquisitely swollen; he cannot tolerate a sheet touching it. He had several beers and a large steak dinner last night. He takes hydrochlorothiazide for hypertension. Temperature is 37.4 °C. His eGFR is 88.","qs":[{"n":37,"t":"mc","visit":"Visit 1","s":"Which test is the **gold standard** for confirming the diagnosis?","opts":["Joint aspiration for crystal analysis","ESR and C-reactive protein levels","Serum uric acid during the attack","Plain x-ray of the right foot"],"correctIdx":[0],"answer":"A","c":"Gout is confirmed by aspirating synovial fluid and finding needle-shaped, negatively birefringent monosodium urate crystals under polarized microscopy; the fluid can also be sent for Gram stain and culture to exclude septic arthritis. Serum uric acid may be normal during an acute attack, early x-rays are often normal, and inflammatory markers are non-specific."},{"n":38,"t":"mc","visit":"Visit 1 (continued)","s":"Which treatment is **appropriate** for the acute attack?","opts":["Low-dose aspirin for pain and swelling","Probenecid 500 mg twice daily today","Colchicine 1.2 mg, then 0.6 mg an hour later","Start allopurinol 300 mg daily right away"],"correctIdx":[2],"answer":"C","c":"Acute gout is treated within 24 hours with an NSAID, low-dose colchicine (1.2 mg then 0.6 mg one hour later) or a corticosteroid. Urate-lowering therapy is not started during the attack because sudden shifts in uric acid can prolong the flare. Low-dose aspirin raises uric acid, and probenecid is a urate-lowering drug, not acute therapy."},{"n":39,"t":"sata","visit":"Visit 2 (3 weeks later)","s":"The attack has resolved. Which changes will **reduce** Mr. Ferreira's risk of future attacks? **Select all that apply.**","opts":["Limit beer and spirits","Increase fructose-sweetened sodas","Reduce red meat and shellfish","Switch hydrochlorothiazide to losartan","Add low-dose aspirin daily"],"correctIdx":[0,2,3],"answer":"A, C, D","c":"Thiazide diuretics raise uric acid, while losartan has a mild uricosuric effect, making it a good antihypertensive choice in gout. Beer and spirits, purine-rich red meat and shellfish, and fructose-sweetened drinks all raise uric acid. Low-dose aspirin also reduces uric acid excretion. If he has two or more attacks a year, allopurinol to a target urate below 6 mg/dL is indicated."}]},{"no":14,"batch":1,"title":"Mr. Petrov: Drinking to Cope","setting":"Primary care clinic • Middle adult • Mental health / Substance use","scenario":"Mr. Petrov is a 50-year-old man who drinks 8–10 beers daily since losing his job. His wife says he has tried to cut down but becomes shaky and sweaty by mid-morning and takes a drink to steady himself. AUDIT-C is 11. Labs show GGT 182 U/L, AST 96 U/L, ALT 44 U/L and MCV 104 fL. He wants to stop drinking.","qs":[{"n":40,"t":"mc","visit":"Visit 1","s":"What does the AST:ALT pattern in Mr. Petrov's labs **most likely** indicate?","opts":["Metabolic fatty liver from obesity","Alcohol-related liver injury","Biliary obstruction from a stone","Acute viral hepatitis A infection"],"correctIdx":[1],"answer":"B","c":"An AST:ALT ratio of 2:1 or greater, with AST usually below 300–400 U/L and a raised GGT, is characteristic of alcohol-related liver disease. Macrocytosis (MCV > 100) also supports heavy alcohol use. Viral hepatitis causes much higher transaminases with ALT > AST, biliary obstruction raises ALP and bilirubin, and MASLD typically shows ALT > AST."},{"n":41,"t":"mc","visit":"Visit 1 (continued)","s":"Mr. Petrov has morning tremor and sweating but no history of withdrawal seizures or delirium tremens. Before he stops drinking, which medication is used to **prevent and treat withdrawal**?","opts":["A benzodiazepine such as chlordiazepoxide","Disulfiram started on the first day","Haloperidol as needed for any tremor","Naltrexone at the time of the last drink"],"correctIdx":[0],"answer":"A","c":"Benzodiazepines are first-line for alcohol withdrawal because they prevent seizures and delirium tremens; long-acting agents such as chlordiazepoxide or diazepam are typical, with lorazepam or oxazepam preferred in significant liver disease or older adults. Outpatient detoxification is suitable only for mild withdrawal without prior seizures or DTs. Thiamine is given before any glucose to prevent Wernicke encephalopathy."},{"n":42,"t":"match","visit":"Visit 2 (2 weeks later)","s":"Mr. Petrov has completed withdrawal and wants medication to help him stay sober. **Drag each medication to its key prescribing consideration.** One option will not be used.","items":["Naltrexone","Acamprosate","Disulfiram"],"tgts":["Causes flushing and vomiting with any alcohol","Must be given IV in a hospital","Contraindicated if he is taking opioids","Dose adjusted for kidney function"],"map":[2,3,0],"answer":"1–C, 2–D, 3–A","c":"Naltrexone is an opioid antagonist that reduces craving; it precipitates withdrawal in patients taking opioids and is avoided in acute hepatitis or liver failure. Acamprosate is renally cleared, needs dose reduction in kidney impairment and is safe in liver disease. Disulfiram blocks aldehyde dehydrogenase, causing flushing, nausea, vomiting and tachycardia with any alcohol, including mouthwash. None of these drugs requires IV hospital administration."}]},{"no":15,"batch":1,"title":"Ms. Okonkwo: Low Mood and Little Sleep","setting":"Primary care clinic • Young adult • Mental health","scenario":"Ms. Okonkwo is a 26-year-old graduate student with 5 weeks of low mood, loss of interest in her hobbies, poor concentration, waking at 4 a.m., poor appetite and feelings of worthlessness. Her PHQ-9 score is 17 and item 9 is scored 0. She has no history of elevated mood or decreased need for sleep, and no family history of bipolar disorder. She has no substance use.","qs":[{"n":43,"t":"mc","visit":"Visit 1","s":"Which treatment plan is **most appropriate** for Ms. Okonkwo?","opts":["An SSRI combined with psychotherapy","Watchful waiting for 3 more months","A benzodiazepine for sleep and mood","Lithium as the first medication"],"correctIdx":[0],"answer":"A","c":"A PHQ-9 of 17 indicates moderately severe major depression. Combining an antidepressant (an SSRI such as sertraline or escitalopram) with psychotherapy such as CBT is more effective than either alone for moderate to severe depression. Benzodiazepines do not treat depression and carry dependence risk, and lithium is a mood stabilizer for bipolar disorder."},{"n":44,"t":"sata","visit":"Visit 1 (continued)","s":"The FNP starts sertraline. Which teaching points are correct? **Select all that apply.**","opts":["Stop it once mood improves for a week","Full benefit may take 4–8 weeks","Report any new or worsening suicidal thoughts","Do not stop the medication abruptly","Expect full benefit within 3 days"],"correctIdx":[1,2,3],"answer":"B, C, D","c":"Antidepressants take 4–8 weeks at an adequate dose for full effect, although sleep and energy may improve sooner. All antidepressants carry a boxed warning for increased suicidal thoughts in people under 25, so close follow-up (within 1–2 weeks) and instructions to report suicidal thinking are essential. Stopping abruptly can cause discontinuation symptoms, and treatment continues for 6–12 months after remission."},{"n":45,"t":"mc","visit":"Visit 2 (8 weeks later)","s":"Ms. Okonkwo's mood has improved and her PHQ-9 is 4. How long should she continue sertraline?","opts":["Stop it now that she feels better","At least 6–12 months after remission","For the rest of her life without review","Continue it for exactly 4 more weeks"],"correctIdx":[1],"answer":"B","c":"After a first episode of major depression, antidepressant therapy is continued for at least 6–12 months after remission to prevent relapse, then tapered gradually. Patients with three or more episodes may need maintenance for 2 years or longer. Stopping immediately after improvement carries a high relapse risk."}]},{"no":16,"batch":1,"title":"Mrs. Mensah: First Prenatal Visit","setting":"Primary care clinic • Young adult (prenatal) • Women's health","scenario":"Mrs. Mensah is a 29-year-old woman (G1P0) at 9 weeks' gestation by her last menstrual period. She has no chronic illness, takes no medications, and her BMI is 31. Her mother had type 2 diabetes. BP is 118/72. She asks what she should do to have a healthy pregnancy.","qs":[{"n":46,"t":"sata","visit":"Visit 1","s":"Which tests are recommended at Mrs. Mensah's **first prenatal visit**? **Select all that apply.**","opts":["Routine chest x-ray","Urine culture for asymptomatic bacteriuria","HIV, syphilis and hepatitis B screening","Group B streptococcus rectovaginal culture","Blood type with Rh(D) antibody screen"],"correctIdx":[1,2,4],"answer":"B, C, E","c":"First-visit prenatal labs include blood type and Rh antibody screen, CBC, rubella immunity, HIV, syphilis, hepatitis B and hepatitis C, and a urine culture, because asymptomatic bacteriuria is treated in pregnancy to prevent pyelonephritis and preterm birth. Group B strep culture is done at 36 0/7–37 6/7 weeks, and chest x-ray is not a screening test."},{"n":47,"t":"mc","visit":"Visit 1 (continued)","s":"Because of her BMI and family history, when should Mrs. Mensah be screened for diabetes?","opts":["Early in pregnancy, then again at 24–28 weeks","Only at 36 weeks with the GBS culture","Only after delivery at the 6-week visit","Screening is unnecessary at her age"],"correctIdx":[0],"answer":"A","c":"Pregnant people with obesity and additional risk factors such as a first-degree relative with diabetes should be screened early in pregnancy to detect pre-existing diabetes. If the early test is normal, they are screened again at 24–28 weeks, when insulin resistance rises and gestational diabetes typically appears."},{"n":48,"t":"mc","visit":"Visit 3 (31 weeks)","s":"Mrs. Mensah has a new headache, sees spots before her eyes and has swelling of her face and hands. BP is 162/108 and urine protein is 2+. What is the **most appropriate** action?","opts":["Start oral labetalol and review in a week","Advise rest on her left side at home","Send her to labor and delivery immediately","Order a 24-hour urine collection at home"],"correctIdx":[2],"answer":"C","c":"New hypertension after 20 weeks with proteinuria, BP ≥ 160/110, headache and visual disturbances indicates preeclampsia with severe features. This is an obstetric emergency requiring immediate hospital evaluation for magnesium sulfate seizure prophylaxis, urgent BP control and planning for delivery, which is the definitive treatment. Outpatient management is unsafe."}]},{"no":17,"batch":1,"title":"Mr. Alvarez: Burning With Urination","setting":"Primary care clinic • Young adult • Infectious disease / Sexual health","scenario":"Mr. Alvarez is a 23-year-old man with 4 days of dysuria and a purulent yellow urethral discharge. He has had two female partners in the past 2 months and does not use condoms consistently. He has no known drug allergies. A urine NAAT for gonorrhea and chlamydia is collected, and the FNP decides to treat today.","qs":[{"n":49,"t":"mc","visit":"Visit 1","s":"Which regimen is **recommended** to treat Mr. Alvarez today, before results return?","opts":["Ceftriaxone 500 mg IM plus doxycycline for 7 days","Ciprofloxacin 500 mg orally as a single dose","Penicillin G benzathine 2.4 million units IM","Azithromycin 1 g orally as a single dose only"],"correctIdx":[0],"answer":"A","c":"CDC guidelines treat gonorrhea with a single dose of ceftriaxone 500 mg IM (1 g if ≥ 150 kg). Because chlamydia has not been excluded, doxycycline 100 mg twice daily for 7 days is added. Azithromycin alone is not adequate for gonorrhea, fluoroquinolone resistance is widespread, and benzathine penicillin treats syphilis."},{"n":50,"t":"sata","visit":"Visit 1 (continued)","s":"Which additional actions are **recommended** for Mr. Alvarez? **Select all that apply.**","opts":["Repeat a test of cure for urethral infection in 1 week","Avoid all testing until symptoms resolve","Abstain from sex until 7 days after he and his partners are treated","Arrange evaluation or treatment of his partners","Test for HIV and syphilis"],"correctIdx":[2,3,4],"answer":"C, D, E","c":"Anyone diagnosed with one STI should be tested for HIV and syphilis (and offered hepatitis testing and HPV vaccination). Partners from the past 60 days need evaluation and treatment, and expedited partner therapy is legal in most states for heterosexual partners. Patients abstain until 7 days after everyone is treated. A test of cure is not routine for urethral gonorrhea treated with ceftriaxone, but retesting at 3 months is recommended because reinfection is common."},{"n":51,"t":"mc","visit":"Visit 2 (3 months later)","s":"At his follow-up, Mr. Alvarez asks how to lower his future HIV risk. He reports inconsistent condom use with new partners. What should the FNP **offer**?","opts":["HIV post-exposure prophylaxis monthly","HIV pre-exposure prophylaxis (PrEP)","Annual azithromycin as prophylaxis","Nothing until he has symptoms again"],"correctIdx":[1],"answer":"B","c":"PrEP (for example daily emtricitabine–tenofovir or long-acting injectable cabotegravir) is a USPSTF grade A recommendation for people at increased risk of HIV, including those with a recent bacterial STI and inconsistent condom use. It requires a negative HIV test before starting and every 2–3 months. PEP is for a single high-risk exposure within 72 hours, not ongoing prevention."}]},{"no":18,"batch":1,"title":"Ms. Lee: Night-Time Cough","setting":"Primary care clinic • Young adult • Respiratory","scenario":"Ms. Lee is a 22-year-old college student with a dry cough at night, chest tightness and wheezing with exercise and in cold air for 6 months. She wakes at night with cough about twice a month and uses a friend's albuterol inhaler about three days a week. She has allergic rhinitis and eczema. Spirometry shows FEV₁/FVC 0.74 with a 15% (300 mL) increase in FEV₁ after bronchodilator.","qs":[{"n":52,"t":"mc","visit":"Visit 1","s":"What does the spirometry result **demonstrate**?","opts":["A restrictive pattern of lung disease","Normal lung function with no reversibility","Reversible airflow obstruction typical of asthma","Fixed airflow obstruction typical of COPD"],"correctIdx":[2],"answer":"C","c":"An increase in FEV₁ of at least 12% and 200 mL after a bronchodilator shows significant reversibility, which supports asthma in a young atopic patient with variable symptoms. COPD shows persistent obstruction (post-bronchodilator FEV₁/FVC < 0.70) that is not fully reversible, and restrictive disease reduces lung volumes with a normal or high ratio."},{"n":53,"t":"mc","visit":"Visit 1 (continued)","s":"According to GINA, which regimen is **preferred** for Ms. Lee's mild asthma?","opts":["Daily oral montelukast as the only drug","As-needed low-dose budesonide–formoterol","Daily salmeterol (LABA) used by itself","As-needed albuterol alone with no controller"],"correctIdx":[1],"answer":"B","c":"GINA no longer recommends SABA-only treatment for adolescents and adults because it increases the risk of severe exacerbations. The preferred Track 1 approach for mild asthma is as-needed low-dose ICS–formoterol, which delivers an anti-inflammatory dose every time she relieves symptoms. LABA monotherapy is dangerous in asthma, and montelukast is a less effective alternative with a neuropsychiatric boxed warning."},{"n":54,"t":"sata","visit":"Visit 2 (3 months later)","s":"Ms. Lee still has symptoms several days a week. **Before stepping up** therapy, what should the FNP assess? **Select all that apply.**","opts":["Medication adherence","A repeat chest x-ray","Exposure to triggers such as smoke or allergens","Her serum IgE level","Inhaler technique"],"correctIdx":[0,2,4],"answer":"A, C, E","c":"Before stepping up asthma therapy, the clinician checks inhaler technique, adherence, environmental triggers and comorbidities such as rhinitis and GERD, because these are the most common reasons for poor control. Stepping up without fixing them exposes the patient to higher doses without benefit. IgE and imaging are reserved for severe or atypical asthma."}]},{"no":19,"batch":1,"title":"Mr. Johnson: A Fall on an Outstretched Hand","setting":"Urgent visit • Young adult • Musculoskeletal","scenario":"Mr. Johnson is a 25-year-old who fell on his outstretched right hand while skateboarding yesterday. He has pain at the base of the thumb and mild swelling of the radial wrist. He can move all fingers, and capillary refill and sensation are normal. Wrist x-rays taken this morning show no fracture.","qs":[{"n":55,"t":"hot","visit":"Visit 1","s":"The FNP suspects a scaphoid fracture. **Click the area where tenderness would most strongly support this diagnosis.**","answer":"D","c":"The anatomical snuffbox, on the radial side of the wrist just distal to the radial styloid and between the thumb extensor tendons, lies directly over the scaphoid. Tenderness here after a fall on an outstretched hand strongly suggests scaphoid fracture, even when initial x-rays are normal. Tenderness over the 5th metacarpal suggests a boxer's fracture.","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 400 320\" width=\"100%\" height=\"auto\"><rect width=\"400\" height=\"320\" fill=\"none\"/><rect x=\"112\" y=\"64\" width=\"30\" height=\"132\" rx=\"14\" fill=\"var(--skin)\" stroke=\"var(--diagram-ink)\" stroke-width=\"2.2\"/><rect x=\"152\" y=\"38\" width=\"30\" height=\"158\" rx=\"14\" fill=\"var(--skin)\" stroke=\"var(--diagram-ink)\" stroke-width=\"2.2\"/><rect x=\"192\" y=\"46\" width=\"30\" height=\"150\" rx=\"14\" fill=\"var(--skin)\" stroke=\"var(--diagram-ink)\" stroke-width=\"2.2\"/><rect x=\"232\" y=\"76\" width=\"30\" height=\"120\" rx=\"14\" fill=\"var(--skin)\" stroke=\"var(--diagram-ink)\" stroke-width=\"2.2\"/><path d=\"M 104 180 L 270 180 Q 282 250 262 300 L 128 300 Q 100 250 104 180 Z\" fill=\"var(--skin)\" stroke=\"var(--diagram-ink)\" stroke-width=\"2.2\"/>\n<line x1=\"116\" y1=\"98\" x2=\"138\" y2=\"98\" stroke=\"var(--diagram-ink)\" stroke-width=\"1.5\" stroke-opacity=\"0.6\"/><line x1=\"116\" y1=\"140\" x2=\"138\" y2=\"140\" stroke=\"var(--diagram-ink)\" stroke-width=\"1.5\" stroke-opacity=\"0.6\"/><line x1=\"156\" y1=\"72\" x2=\"178\" y2=\"72\" stroke=\"var(--diagram-ink)\" stroke-width=\"1.5\" stroke-opacity=\"0.6\"/><line x1=\"156\" y1=\"114\" x2=\"178\" y2=\"114\" stroke=\"var(--diagram-ink)\" stroke-width=\"1.5\" stroke-opacity=\"0.6\"/><line x1=\"196\" y1=\"80\" x2=\"218\" y2=\"80\" stroke=\"var(--diagram-ink)\" stroke-width=\"1.5\" stroke-opacity=\"0.6\"/><line x1=\"196\" y1=\"122\" x2=\"218\" y2=\"122\" stroke=\"var(--diagram-ink)\" stroke-width=\"1.5\" stroke-opacity=\"0.6\"/><line x1=\"236\" y1=\"110\" x2=\"258\" y2=\"110\" stroke=\"var(--diagram-ink)\" stroke-width=\"1.5\" stroke-opacity=\"0.6\"/><line x1=\"236\" y1=\"152\" x2=\"258\" y2=\"152\" stroke=\"var(--diagram-ink)\" stroke-width=\"1.5\" stroke-opacity=\"0.6\"/>\n<path d=\"M 106 214 Q 70 196 52 150 Q 44 128 62 122 Q 80 120 92 150 Q 100 170 114 186\" fill=\"var(--skin)\" stroke=\"var(--diagram-ink)\" stroke-width=\"2.2\"/>\n<line x1=\"134\" y1=\"300\" x2=\"132\" y2=\"316\" stroke=\"var(--diagram-ink)\" stroke-width=\"2\"/><line x1=\"258\" y1=\"300\" x2=\"262\" y2=\"316\" stroke=\"var(--diagram-ink)\" stroke-width=\"2\"/>\n<text x=\"200\" y=\"22\" font-family=\"Arial, sans-serif\" font-size=\"12\" font-weight=\"700\" fill=\"var(--diagram-ink)\" text-anchor=\"middle\">Right hand — dorsal (back) view</text><g class=\"zone\" data-id=\"A\" tabindex=\"0\" role=\"button\" aria-label=\"Area A\">\n<circle cx=\"167\" cy=\"72\" r=\"15\" fill=\"var(--zone-fill)\" stroke=\"var(--zone-ink)\" stroke-width=\"2.5\"/>\n<text x=\"167\" y=\"77.5\" text-anchor=\"middle\" font-family=\"Georgia, 'Times New Roman', serif\" font-size=\"16\" font-weight=\"700\" fill=\"var(--zone-ink)\">A</text></g><g class=\"zone\" data-id=\"B\" tabindex=\"0\" role=\"button\" aria-label=\"Area B\">\n<circle cx=\"167\" cy=\"116\" r=\"15\" fill=\"var(--zone-fill)\" stroke=\"var(--zone-ink)\" stroke-width=\"2.5\"/>\n<text x=\"167\" y=\"121.5\" text-anchor=\"middle\" font-family=\"Georgia, 'Times New Roman', serif\" font-size=\"16\" font-weight=\"700\" fill=\"var(--zone-ink)\">B</text></g><g class=\"zone\" data-id=\"C\" tabindex=\"0\" role=\"button\" aria-label=\"Area C\">\n<circle cx=\"207\" cy=\"184\" r=\"15\" fill=\"var(--zone-fill)\" stroke=\"var(--zone-ink)\" stroke-width=\"2.5\"/>\n<text x=\"207\" y=\"189.5\" text-anchor=\"middle\" font-family=\"Georgia, 'Times New Roman', serif\" font-size=\"16\" font-weight=\"700\" fill=\"var(--zone-ink)\">C</text></g><g class=\"zone\" data-id=\"D\" tabindex=\"0\" role=\"button\" aria-label=\"Area D\">\n<circle cx=\"120\" cy=\"262\" r=\"15\" fill=\"var(--zone-fill)\" stroke=\"var(--zone-ink)\" stroke-width=\"2.5\"/>\n<text x=\"120\" y=\"267.5\" text-anchor=\"middle\" font-family=\"Georgia, 'Times New Roman', serif\" font-size=\"16\" font-weight=\"700\" fill=\"var(--zone-ink)\">D</text></g><g class=\"zone\" data-id=\"E\" tabindex=\"0\" role=\"button\" aria-label=\"Area E\">\n<circle cx=\"252\" cy=\"230\" r=\"15\" fill=\"var(--zone-fill)\" stroke=\"var(--zone-ink)\" stroke-width=\"2.5\"/>\n<text x=\"252\" y=\"235.5\" text-anchor=\"middle\" font-family=\"Georgia, 'Times New Roman', serif\" font-size=\"16\" font-weight=\"700\" fill=\"var(--zone-ink)\">E</text></g></svg>"},{"n":56,"t":"mc","visit":"Visit 1 (continued)","s":"Snuffbox tenderness is present. What is the **most appropriate** management?","opts":["Apply an ulnar gutter splint for 2 weeks","Reassure him and allow full use of the wrist","Thumb spica splint and repeat imaging in 10–14 days","Buddy-tape the thumb to the index finger"],"correctIdx":[2],"answer":"C","c":"Scaphoid fractures are often invisible on initial x-rays. When the snuffbox is tender, the wrist is immobilized in a thumb spica splint and imaging is repeated in 10–14 days, or MRI is obtained sooner. The scaphoid has a retrograde blood supply, so a missed fracture risks non-union and avascular necrosis. An ulnar gutter splint is used for 4th/5th metacarpal fractures."},{"n":57,"t":"mc","visit":"Visit 2 (12 days later)","s":"A repeat x-ray confirms a non-displaced scaphoid waist fracture. Which complication is Mr. Johnson **most at risk** for?","opts":["Compartment syndrome of the forearm","Carpal tunnel syndrome within days","Dupuytren contracture of the palm","Avascular necrosis of the proximal pole"],"correctIdx":[3],"answer":"D","c":"The scaphoid's blood supply enters distally and flows backward to the proximal pole, so fractures through the waist or proximal portion can interrupt blood flow, leading to avascular necrosis and non-union. This is why suspected fractures are immobilized promptly and confirmed fractures are referred to orthopedics. The other options are not typical complications of a non-displaced scaphoid fracture."}]},{"no":20,"batch":1,"title":"Aisha: A Confidential Visit","setting":"Primary care clinic • Adolescent • Reproductive health / Professional role","scenario":"Aisha is a 16-year-old girl at a well visit with her mother. When the FNP speaks with her alone, she says she has been sexually active with one male partner for 3 months, uses condoms \"most of the time,\" and wants birth control but does not want her mother to know. She has no medical problems, does not smoke and has no migraines.","qs":[{"n":58,"t":"mc","visit":"Visit 1","s":"Which statement **best explains** confidentiality to Aisha?","opts":["\"Nothing you say can ever be shared with anyone for any reason.\"","\"I will keep it private only if your mother agrees to that first.\"","\"What we discuss stays private unless you are at risk of serious harm.\"","\"I must tell your mother everything we discuss because you are a minor.\""],"correctIdx":[2],"answer":"C","c":"Adolescents should be told at the start of the private interview that their information is confidential, with clear limits: the clinician must act if there is a risk of serious harm to themselves or others or if abuse is disclosed. Minors may consent to confidential contraception and STI care in most states. Promising absolute confidentiality is inaccurate, and requiring parental agreement undermines access to care."},{"n":59,"t":"mc","visit":"Visit 1 (continued)","s":"Which contraceptive method should the FNP present as the **most effective** first-line option for Aisha?","opts":["Condoms alone used more consistently","A combined oral contraceptive pill each day","A long-acting implant or an intrauterine device","Fertility awareness-based methods only"],"correctIdx":[2],"answer":"C","c":"Long-acting reversible contraception (the etonogestrel implant and IUDs) has a typical-use failure rate below 1% a year and is recommended by ACOG and the AAP as first-line for adolescents. Pills, condoms and fertility awareness methods have much higher typical-use failure rates. A pelvic examination is not required before starting contraception."},{"n":60,"t":"sata","visit":"Visit 1 (continued)","s":"Aisha chooses an implant. Which additional care is **recommended** today? **Select all that apply.**","opts":["Chlamydia and gonorrhea screening","Telling her mother about the implant","A cervical Pap test today","Confirming her HPV vaccine series is complete","Counseling to keep using condoms for STI protection"],"correctIdx":[0,3,4],"answer":"A, D, E","c":"Sexually active females 24 and younger are screened annually for chlamydia and gonorrhea. Dual protection (a highly effective method plus condoms) is encouraged because LARC does not prevent STIs. HPV vaccination is recommended through age 26 and should be checked. Cervical cancer screening begins at 21 regardless of sexual activity, and disclosure to her parent would breach her confidential care."}]},{"no":21,"batch":1,"title":"Daniel: Sports Physical and a Sore Throat","setting":"Primary care clinic • Adolescent • Cardiovascular / Infectious disease","scenario":"Daniel is a 15-year-old boy who wants clearance for the basketball team. He says he nearly fainted twice during sprints last season. His uncle died suddenly at age 32 while jogging. On examination he has a grade II/VI systolic murmur at the left sternal border.","qs":[{"n":61,"t":"mc","visit":"Visit 1","s":"The murmur becomes **louder** when Daniel stands from a squat and during the Valsalva maneuver. What is the **most likely** cause?","opts":["Hypertrophic cardiomyopathy","An innocent Still murmur","Mitral valve prolapse alone","Aortic regurgitation murmur"],"correctIdx":[0],"answer":"A","c":"Hypertrophic cardiomyopathy causes a systolic ejection murmur at the left sternal border that increases with maneuvers that reduce preload (standing, Valsalva) and decreases with squatting or handgrip. Combined with exertional near-syncope and a family history of sudden death, it is the leading cause of sudden cardiac death in young U.S. athletes. Innocent murmurs get softer when standing."},{"n":62,"t":"mc","visit":"Visit 1 (continued)","s":"What is the **most appropriate** decision about sports participation?","opts":["Clear him fully because the murmur is only grade II","Restrict play pending ECG, echo and cardiology review","Clear him if he drinks more fluids during games","Allow practice but not competitive games for now"],"correctIdx":[1],"answer":"B","c":"Exertional syncope or near-syncope, a family history of sudden cardiac death before 50, and a murmur that increases with Valsalva are red flags in the pre-participation evaluation. The athlete should not participate until ECG, echocardiography a

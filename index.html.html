on drug monitoring programs. They are contraindicated with MAO inhibitors."}]},{"no":290,"batch":12,"title":"Mrs. Aguilar: Bleeding at 9 Weeks","setting":"Prenatal visit • Young adult • Women's health","scenario":"Mrs. Aguilar is a 30-year-old woman at 9 weeks of gestation by dates who has had light vaginal bleeding and mild cramping since yesterday. Earlier ultrasound at 7 weeks showed an intrauterine pregnancy with cardiac activity. Her vital signs are stable. On speculum examination there is a small amount of blood in the vault and the cervical os is closed. Transvaginal ultrasound again shows a live intrauterine pregnancy.","qs":[{"n":868,"t":"mc","visit":"Visit 1","s":"How should this be **classified**?","opts":["Threatened miscarriage","Incomplete miscarriage","Missed miscarriage","Inevitable miscarriage"],"correctIdx":[0],"answer":"A","c":"Threatened miscarriage is vaginal bleeding before 20 weeks with a closed cervical os and a viable intrauterine pregnancy. Most continue normally, especially when cardiac activity is present. Inevitable miscarriage has an open os without tissue passage, incomplete miscarriage has an open os with some tissue passed, and missed miscarriage is a non-viable pregnancy with a closed os and no bleeding."},{"n":869,"t":"match","visit":"Visit 1 (continued)","s":"**Drag each type of early pregnancy loss to its findings.** One option will not be used.","items":["Incomplete miscarriage","Complete miscarriage","Missed miscarriage"],"tgts":["Closed os with a non-viable embryo and no symptoms","Closed os, light bleeding and a live embryo on ultrasound","Closed os, bleeding settling and an empty uterus after passing tissue","Open os with some products of conception still in the uterus"],"map":[3,2,0],"answer":"1–D, 2–C, 3–A","c":"An incomplete miscarriage has an open cervical os and retained tissue and may be managed expectantly, medically (misoprostol) or surgically (uterine aspiration). A complete miscarriage has passed all tissue, with a closed os and an empty uterus; hCG is followed if an intrauterine pregnancy was never confirmed, to exclude ectopic pregnancy. A missed miscarriage is a non-viable pregnancy retained without symptoms. A live embryo with a closed os and light bleeding is a threatened miscarriage."},{"n":870,"t":"mc","visit":"Visit 1 (continued)","s":"Her blood type is A-negative. What should she receive?","opts":["A blood transfusion of A-negative cells","Rh(D) immune globulin per guidelines","No treatment is needed for her blood type","Hepatitis B immune globulin today"],"correctIdx":[1],"answer":"B","c":"Rh(D)-negative patients with bleeding in pregnancy are generally given Rh(D) immune globulin to prevent alloimmunization. Recent guidance allows omission before 12 weeks in some situations, but practice varies and it remains standard after 12 weeks and in many settings for threatened miscarriage. She should be counseled about warning signs: heavy bleeding (soaking 2 pads an hour), severe pain, fever or dizziness."}]},{"no":291,"batch":12,"title":"Ms. Kariuki: Fever and a Sunburn-Like Rash","setting":"Urgent visit • Young adult • Infectious disease / Emergency","scenario":"Ms. Kariuki is a 22-year-old woman on day 4 of her period who has used super-absorbent tampons, sometimes leaving one in overnight. Since this morning she has had a fever of 39.8 °C, vomiting, watery diarrhea, muscle aches and dizziness. She has a diffuse red rash like a sunburn, including her palms, and red eyes. BP is 82/48 and HR 128. A tampon is still in place.","qs":[{"n":871,"t":"mc","visit":"Visit 1","s":"What is the **most likely** diagnosis?","opts":["Scarlet fever from group A strep","Viral gastroenteritis with a rash","Staphylococcal toxic shock syndrome","Meningococcal disease with petechiae"],"correctIdx":[2],"answer":"C","c":"Staphylococcal toxic shock syndrome is caused by toxins such as TSST-1 produced by Staphylococcus aureus, classically associated with prolonged use of super-absorbent tampons, as well as nasal packing, wounds and postpartum infections. It causes high fever, hypotension, a diffuse macular erythroderma (\"sunburn rash\") that later desquamates on the palms and soles, and involvement of multiple organs (vomiting, diarrhea, myalgia, conjunctival injection, confusion)."},{"n":872,"t":"sata","visit":"Visit 1 (continued)","s":"Which actions are **appropriate** now? **Select all that apply.**","opts":["Start IV fluids if access is available","Wait for blood cultures before any action","Call 911 for emergency transfer","Remove the tampon","Give oral antibiotics and send her home"],"correctIdx":[0,2,3],"answer":"A, C, D","c":"Toxic shock syndrome is a medical emergency. The source (tampon, packing or infected wound) is removed immediately, and the patient is transferred urgently for aggressive IV fluid resuscitation, vasopressors if needed, and IV antibiotics, typically an anti-staphylococcal agent (vancomycin for possible MRSA, plus an antistaphylococcal beta-lactam) combined with clindamycin to suppress toxin production."},{"n":873,"t":"mc","visit":"Visit 2 (after recovery)","s":"Which advice helps **prevent** a recurrence?","opts":["No precautions are needed once she has recovered","Use only the highest-absorbency tampons available","Leave tampons in overnight for at least 12 hours","Use the lowest-absorbency tampon and change it every 4–8 hours"],"correctIdx":[3],"answer":"D","c":"To reduce the risk of tampon-associated toxic shock syndrome, use the lowest-absorbency tampon needed, change it every 4–8 hours, alternate with pads (especially overnight) and remove it promptly at the end of the period. Menstrual cups should also be emptied and cleaned regularly. People who have had TSS may be advised to avoid tampons because recurrence is possible."}]},{"no":292,"batch":12,"title":"Mr. Delgado-Ruiz: A Pop While Pivoting","setting":"Urgent visit • Young adult • Musculoskeletal","scenario":"Mr. Delgado-Ruiz is a 24-year-old soccer player who planted his foot and pivoted sharply yesterday, felt a \"pop\" in his left knee and fell. He could not continue playing, and his knee swelled within 2 hours. Today the knee is swollen with a large effusion and feels unstable when he walks. He was not hit by another player. X-rays show no fracture.","qs":[{"n":874,"t":"mc","visit":"Visit 1","s":"Which test is the **most sensitive** physical exam test for his likely injury?","opts":["Lachman test","Posterior drawer","McMurray test","Valgus stress"],"correctIdx":[0],"answer":"A","c":"A non-contact pivoting injury with an audible pop, inability to continue playing and rapid swelling (hemarthrosis within hours) suggests an anterior cruciate ligament (ACL) tear. The Lachman test (anterior translation of the tibia with the knee at 20–30° of flexion) is the most sensitive exam for ACL tears. McMurray assesses the meniscus, valgus stress the MCL, and the posterior drawer the PCL."},{"n":875,"t":"mc","visit":"Visit 1 (continued)","s":"Which imaging test **confirms** the injury and associated damage?","opts":["A repeat plain x-ray in 2 weeks","A CT scan of the left leg","An MRI of the left knee","A bone scan of both knees"],"correctIdx":[2],"answer":"C","c":"MRI is the best imaging test to confirm an ACL tear and identify associated injuries such as meniscal tears, MCL injury and bone bruises. Plain x-rays exclude fractures, including a Segond fracture (a small avulsion of the lateral tibial plateau strongly associated with ACL tears)."},{"n":876,"t":"mc","visit":"Visit 2 (MRI confirms ACL tear)","s":"He wants to return to competitive soccer. What is the **usual** recommendation?","opts":["Repeated steroid injections into the knee joint","ACL reconstruction followed by structured rehabilitation","Permanent avoidance of all physical activity","Return to soccer next week with a knee brace only"],"correctIdx":[1],"answer":"B","c":"Young, active patients who want to return to pivoting and cutting sports are usually offered ACL reconstruction followed by 9–12 months of structured rehabilitation, which restores stability and reduces further meniscal and cartilage damage. Less active patients may do well with rehabilitation alone. Early rehabilitation (reducing swelling and restoring range of motion and quadriceps strength) begins before surgery. Injury prevention programs reduce ACL injuries."}]},{"no":293,"batch":12,"title":"Ms. Fitzgerald: Flushing Cheeks","setting":"Primary care clinic • Young adult • Dermatology","scenario":"Ms. Fitzgerald is a 34-year-old fair-skinned woman with 2 years of persistent redness of her central face, visible small blood vessels and episodes of flushing triggered by hot drinks, wine, spicy food and sun. She has small red papules and pustules on her cheeks and nose but no blackheads. Her eyes often feel gritty and her eyelids are red. She has no joint pain or photosensitive rash elsewhere.","qs":[{"n":877,"t":"mc","visit":"Visit 1","s":"What is the **most likely** diagnosis?","opts":["Adult acne vulgaris","Cutaneous lupus malar rash","Seborrheic dermatitis","Papulopustular rosacea"],"correctIdx":[3],"answer":"D","c":"Rosacea is a chronic inflammatory condition of the central face, most common in fair-skinned women aged 30–50. Features include persistent central facial erythema, flushing triggered by heat, alcohol, spicy food, sun and stress, telangiectasias, and papules and pustules. Unlike acne, there are no comedones. Ocular rosacea causes gritty eyes, blepharitis and conjunctival redness. A lupus malar rash spares the nasolabial folds and has no pustules."},{"n":878,"t":"mc","visit":"Visit 1 (continued)","s":"Which topical treatment is **appropriate** for her papules and pustules?","opts":["Topical tretinoin at the highest strength nightly","Metronidazole, azelaic acid or ivermectin cream","Benzoyl peroxide 10% scrubbed in twice a day","A high-potency topical steroid applied daily"],"correctIdx":[1],"answer":"B","c":"Papulopustular rosacea is treated with topical metronidazole, azelaic acid or ivermectin; oral sub-antimicrobial doxycycline is added for moderate to severe disease. Persistent redness may respond to topical brimonidine or oxymetazoline, and telangiectasias to laser therapy. Topical steroids worsen rosacea and can cause steroid-induced rosacea. Harsh products, including strong retinoids and benzoyl peroxide, often irritate rosacea skin."},{"n":879,"t":"sata","visit":"Visit 1 (continued)","s":"Which self-care measures help **control** her rosacea? **Select all that apply.**","opts":["Alcohol-based astringent toners","Hot showers and saunas for her face","Daily broad-spectrum sunscreen","Identifying and avoiding her triggers","Gentle, non-irritating cleansers"],"correctIdx":[2,3,4],"answer":"C, D, E","c":"Rosacea care includes daily sun protection (mineral sunscreens are often better tolerated), identifying and avoiding triggers (heat, alcohol, spicy food, hot drinks, stress), gentle cleansers and moisturizers, and avoiding astringents, alcohol-based products and abrasive scrubs. Ocular symptoms are treated with lid hygiene and artificial tears, with ophthalmology referral if severe."}]},{"no":294,"batch":12,"title":"Ms. Hallström: High Blood Pressure at 26","setting":"Primary care clinic • Young adult • Cardiovascular / Renal","scenario":"Ms. Hallström is a 26-year-old non-smoking woman of normal weight with new hypertension (average 164/102 on home and office readings). She has no family history of hypertension, takes no oral contraceptives, decongestants or supplements, and does not use stimulants. Her potassium and TSH are normal, and urinalysis is normal. A high-pitched bruit is heard in the right upper abdomen.","qs":[{"n":880,"t":"mc","visit":"Visit 1","s":"Which cause of **secondary hypertension** is most likely?","opts":["Coarctation of the aorta with weak leg pulses","Primary hyperaldosteronism with low potassium","Fibromuscular dysplasia of the renal artery","Atherosclerotic renal artery stenosis"],"correctIdx":[2],"answer":"C","c":"Fibromuscular dysplasia (FMD) is a non-atherosclerotic disease of medium-sized arteries, most common in young and middle-aged women, and is the leading cause of renovascular hypertension in young women. An abdominal bruit and severe or resistant hypertension at a young age suggest it. Atherosclerotic renal artery stenosis occurs in older adults with vascular risk factors. Her normal potassium makes hyperaldosteronism less likely."},{"n":881,"t":"sata","visit":"Visit 1 (continued)","s":"Which findings should prompt evaluation for **secondary hypertension**? **Select all that apply.**","opts":["Stage 1 BP that responds to one drug","Unprovoked or diuretic-induced hypokalemia","Severe or resistant hypertension","Onset of hypertension before age 30","Gradual BP rise at 60 with obesity"],"correctIdx":[1,2,3],"answer":"B, C, D","c":"Secondary hypertension should be considered with onset before 30 (especially without risk factors), resistant hypertension, a sudden rise in previously controlled BP, severe hypertension or target-organ damage out of proportion, unprovoked or excessive diuretic-induced hypokalemia, an abdominal bruit, or features of specific causes (sleep apnea, pheochromocytoma, Cushing syndrome, thyroid disease). Primary hypertension develops gradually with age and obesity."},{"n":882,"t":"mc","visit":"Visit 1 (continued)","s":"Which imaging test is a **reasonable** first step to evaluate the renal arteries?","opts":["A plain abdominal x-ray in two views","Renal artery duplex ultrasound or CT angiography","A nuclear thyroid scan with iodine uptake","An echocardiogram looking for valve disease"],"correctIdx":[1],"answer":"B","c":"Renal artery duplex ultrasound, CT angiography or MR angiography is used to evaluate suspected renovascular hypertension. FMD shows a characteristic \"string of beads\" appearance. Patients with FMD should also have imaging of other arterial beds (head to pelvis) for aneurysms and dissections. Percutaneous angioplasty without stenting is often effective for FMD-related renal artery stenosis."}]},{"no":295,"batch":12,"title":"Chloe: Sudden Pelvic Pain With Vomiting","setting":"Urgent visit • Adolescent • Gynecology / Emergency","scenario":"Chloe is a 14-year-old girl who developed sudden, severe, right-sided lower abdominal pain 3 hours ago while playing volleyball, with nausea and repeated vomiting. The pain comes in waves. She is afebrile. Her last period was 2 weeks ago, and she says she is not sexually active; her urine pregnancy test is negative. She has right lower quadrant and adnexal tenderness. A pelvic ultrasound last month showed a 6-cm right ovarian cyst.","qs":[{"n":883,"t":"mc","visit":"Visit 1","s":"Which diagnosis is the **most urgent** concern?","opts":["Dysmenorrhea","Constipation","Ovarian torsion","Mittelschmerz"],"correctIdx":[2],"answer":"C","c":"Ovarian torsion is twisting of the ovary on its vascular pedicle, often due to an enlarged ovary from a cyst or mass (especially 5 cm or larger). It causes sudden, severe, often intermittent unilateral pelvic pain with nausea and vomiting, sometimes after exercise. It is a surgical emergency because delay can cause loss of the ovary. Mittelschmerz is mild mid-cycle ovulation pain."},{"n":884,"t":"hot","visit":"Visit 1 (continued)","s":"**Click the region where pain from her right ovarian torsion is most likely felt.**","answer":"D","c":"Pain from torsion of the right ovary is felt in the right lower quadrant and right pelvis, which is why it can be confused with appendicitis. Torsion is more common on the right, possibly because the sigmoid colon limits movement of the left ovary. Pelvic ultrasound with Doppler is the first imaging test, but normal Doppler flow does not rule out torsion.","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 400 320\" width=\"100%\" height=\"auto\"><rect width=\"400\" height=\"320\" fill=\"none\"/><path d=\"M 90 30 Q 200 10 310 30 Q 330 160 310 300 L 90 300 Q 70 160 90 30 Z\" fill=\"var(--skin)\" stroke=\"var(--diagram-ink)\" stroke-width=\"2.5\"/>\n<path d=\"M 90 70 Q 200 120 310 70\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-width=\"2\" stroke-opacity=\"0.5\"/>\n<line x1=\"200\" y1=\"40\" x2=\"200\" y2=\"296\" stroke=\"var(--diagram-ink)\" stroke-width=\"1.5\" stroke-dasharray=\"6 5\" stroke-opacity=\"0.55\"/>\n<line x1=\"84\" y1=\"170\" x2=\"316\" y2=\"170\" stroke=\"var(--diagram-ink)\" stroke-width=\"1.5\" stroke-dasharray=\"6 5\" stroke-opacity=\"0.55\"/>\n<circle cx=\"200\" cy=\"170\" r=\"6\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-width=\"2\"/>\n<path d=\"M 108 262 Q 150 285 196 296\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-width=\"2\" stroke-opacity=\"0.5\"/>\n<path d=\"M 292 262 Q 250 285 204 296\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-width=\"2\" stroke-opacity=\"0.5\"/>\n<text x=\"40\" y=\"20\" font-family=\"Arial, sans-serif\" font-size=\"12\" font-weight=\"700\" fill=\"var(--diagram-ink)\" text-anchor=\"start\">Patient's RIGHT</text><text x=\"268\" y=\"20\" font-family=\"Arial, sans-serif\" font-size=\"12\" font-weight=\"700\" fill=\"var(--diagram-ink)\" text-anchor=\"start\">Patient's LEFT</text><text x=\"206\" y=\"186\" font-family=\"Arial, sans-serif\" font-size=\"10\" font-weight=\"400\" fill=\"var(--diagram-ink)\" text-anchor=\"start\">umbilicus</text><g class=\"zone\" data-id=\"A\" tabindex=\"0\" role=\"button\" aria-label=\"Area A\">\n<circle cx=\"140\" cy=\"112\" r=\"15\" fill=\"var(--zone-fill)\" stroke=\"var(--zone-ink)\" stroke-width=\"2.5\"/>\n<text x=\"140\" y=\"117.5\" text-anchor=\"middle\" font-family=\"Georgia, 'Times New Roman', serif\" font-size=\"16\" font-weight=\"700\" fill=\"var(--zone-ink)\">A</text></g><g class=\"zone\" data-id=\"B\" tabindex=\"0\" role=\"button\" aria-label=\"Area B\">\n<circle cx=\"200\" cy=\"92\" r=\"15\" fill=\"var(--zone-fill)\" stroke=\"var(--zone-ink)\" stroke-width=\"2.5\"/>\n<text x=\"200\" y=\"97.5\" text-anchor=\"middle\" font-family=\"Georgia, 'Times New Roman', serif\" font-size=\"16\" font-weight=\"700\" fill=\"var(--zone-ink)\">B</text></g><g class=\"zone\" data-id=\"C\" tabindex=\"0\" role=\"button\" aria-label=\"Area C\">\n<circle cx=\"168\" cy=\"150\" r=\"15\" fill=\"var(--zone-fill)\" stroke=\"var(--zone-ink)\" stroke-width=\"2.5\"/>\n<text x=\"168\" y=\"155.5\" text-anchor=\"middle\" font-family=\"Georgia, 'Times New Roman', serif\" font-size=\"16\" font-weight=\"700\" fill=\"var(--zone-ink)\">C</text></g><g class=\"zone\" data-id=\"D\" tabindex=\"0\" role=\"button\" aria-label=\"Area D\">\n<circle cx=\"136\" cy=\"228\" r=\"15\" fill=\"var(--zone-fill)\" stroke=\"var(--zone-ink)\" stroke-width=\"2.5\"/>\n<text x=\"136\" y=\"233.5\" text-anchor=\"middle\" font-family=\"Georgia, 'Times New Roman', serif\" font-size=\"16\" font-weight=\"700\" fill=\"var(--zone-ink)\">D</text></g><g class=\"zone\" data-id=\"E\" tabindex=\"0\" role=\"button\" aria-label=\"Area E\">\n<circle cx=\"264\" cy=\"228\" r=\"15\" fill=\"var(--zone-fill)\" stroke=\"var(--zone-ink)\" stroke-width=\"2.5\"/>\n<text x=\"264\" y=\"233.5\" text-anchor=\"middle\" font-family=\"Georgia, 'Times New Roman', serif\" font-size=\"16\" font-weight=\"700\" fill=\"var(--zone-ink)\">E</text></g></svg>"},{"n":885,"t":"mc","visit":"Visit 1 (continued)","s":"What is the **definitive** management?","opts":["IV antibiotics alone for presumed infection","Removal of both ovaries to prevent recurrence","Emergency laparoscopy with detorsion of the ovary","Oral contraceptives and a recheck in one month"],"correctIdx":[2],"answer":"C","c":"Suspected ovarian torsion requires emergency gynecologic surgery, usually laparoscopy with detorsion to preserve the ovary, even if it appears dark, because most ovaries recover function. The cyst may be removed (cystectomy). Oophorectomy is reserved for clearly necrotic ovaries or suspected malignancy, especially in adolescents, to preserve fertility."}]},{"no":296,"batch":12,"title":"Sofia: The 16-Year Vaccine Visit","setting":"Well visit • Adolescent • Health promotion / Immunization","scenario":"Sofia is a 16-year-old girl at a well visit before starting a summer job at a daycare. Her records show Tdap and one dose of MenACWY at age 11 and two doses of HPV vaccine given 8 months apart starting at age 11. She is healthy and has no asplenia or complement deficiency. Influenza season is beginning.","qs":[{"n":886,"t":"mc","visit":"Visit 1","s":"Which vaccine is **routinely due** for Sofia at this visit?","opts":["A MenACWY booster dose","A third HPV vaccine dose","Another Tdap booster now","A hepatitis A booster dose"],"correctIdx":[0],"answer":"A","c":"MenACWY is given at 11–12 years with a booster at 16 years because protection wanes and risk of meningococcal disease peaks in late adolescence. Two HPV doses given at least 5 months apart before age 15 complete the series (three doses are needed if started at 15 or older or if immunocompromised). Tdap is given once in adolescence, then Td or Tdap every 10 years. She should also receive an annual influenza vaccine."},{"n":887,"t":"match","visit":"Visit 1 (continued)","s":"**Drag each adolescent vaccine to its correct recommendation.** One option will not be used.","items":["HPV vaccine","MenB vaccine","Tdap vaccine"],"tgts":["Shared clinical decision-making for ages 16–23, preferably 16–18","One dose every year in early adolescence","Two doses if started before age 15; three doses if started at 15 or older","One dose at 11–12 years, then Td or Tdap every 10 years"],"map":[2,0,3],"answer":"1–C, 2–A, 3–D","c":"HPV vaccine requires two doses 6–12 months apart if started at ages 9–14, and three doses if started at 15 or older or in immunocompromised people. MenB vaccine is given by shared clinical decision-making to healthy adolescents and young adults aged 16–23 (preferably 16–18), and routinely for those at increased risk, such as asplenia or outbreaks. Tdap is given once at 11–12 years, with Td or Tdap boosters every 10 years. Influenza vaccine, not these, is given yearly."},{"n":888,"t":"sata","visit":"Visit 1 (continued)","s":"Which **other** recommendations apply to Sofia at this visit? **Select all that apply.**","opts":["A pneumococcal vaccine for all healthy teens","A BCG vaccine before working at a daycare","Annual influenza vaccine","Confirm two doses of MMR and varicella","Discuss MenB vaccination with her and her parent"],"correctIdx":[2,3,4],"answer":"C, D, E","c":"Adolescents should receive annual influenza vaccine and have catch-up vaccination for any missed doses, such as MMR, varicella and hepatitis B. Working in childcare makes verification of immunity to measles, varicella and pertussis especially important. MenB is discussed through shared decision-making. Pneumococcal vaccines are only for teens with specific risk conditions, and BCG is not used in the U.S."}]},{"no":297,"batch":12,"title":"Liam: A Shoulder That Popped Out","setting":"Sports clinic • Adolescent • Musculoskeletal","scenario":"Liam is a 17-year-old wrestler whose right arm was forced backward while raised to the side yesterday. He felt his shoulder \"pop out,\" and a trainer reduced it on the mat. Today he has pain and is anxious when his arm is placed in abduction and external rotation. He has normal sensation over the outer upper arm and normal distal pulses. Post-reduction x-rays show a reduced joint.","qs":[{"n":889,"t":"mc","visit":"Visit 1","s":"Which type of shoulder dislocation is **most common**?","opts":["Anterior dislocation","Superior dislocation","Inferior dislocation","Posterior dislocation"],"correctIdx":[0],"answer":"A","c":"More than 95% of shoulder dislocations are anterior, usually from a force on an abducted, externally rotated arm. Posterior dislocations are associated with seizures and electric shocks, and inferior dislocation (luxatio erecta) is rare. After an anterior dislocation, the apprehension test (fear when the arm is placed in abduction and external rotation) is positive."},{"n":890,"t":"mc","visit":"Visit 1 (continued)","s":"Which nerve must be **checked** after an anterior shoulder dislocation?","opts":["The facial nerve","The median nerve","The axillary nerve","The sciatic nerve"],"correctIdx":[2],"answer":"C","c":"The axillary nerve is the most commonly injured nerve in anterior shoulder dislocation. It is assessed by testing sensation over the lateral shoulder (\"regimental badge\" area) and deltoid function, before and after reduction. Vascular status (axillary artery) should also be checked. Associated injuries include Hill–Sachs and Bankart lesions and, in older patients, rotator cuff tears."},{"n":891,"t":"mc","visit":"Visit 1 (continued)","s":"Why is **orthopedic referral** especially important for Liam?","opts":["All shoulder dislocations need immediate fusion","Young contact athletes have a high risk of recurrence","He needs a sling for 6 months without movement","The joint will never be stable again for anyone"],"correctIdx":[1],"answer":"B","c":"Recurrence after a first anterior shoulder dislocation is very common in adolescents and young adults, especially those in contact or overhead sports (rates can exceed 50–90%). Orthopedic referral is recommended to discuss early arthroscopic stabilization versus rehabilitation. Initial care includes a short period of sling immobilization for comfort, followed by physical therapy focused on rotator cuff and scapular strength."}]},{"no":298,"batch":12,"title":"Baby Kofi-Mensah: No Stool After Two Days","setting":"Newborn nursery • Newborn • Gastrointestinal","scenario":"Kofi-Mensah is a 3-day-old term boy with Down syndrome who has not passed meconium since birth. He has a swollen, distended abdomen and has begun vomiting green-tinged fluid. On rectal examination the rectum is tight and empty, and withdrawing the finger is followed by an explosive release of stool and gas. He is feeding poorly.","qs":[{"n":892,"t":"mc","visit":"Visit 1","s":"What is the **most likely** diagnosis?","opts":["Hirschsprung disease","Physiologic constipation","Infant pyloric stenosis","Meconium plug syndrome"],"correctIdx":[0],"answer":"A","c":"Hirschsprung disease is the absence of ganglion cells in a segment of distal colon, which cannot relax, causing functional obstruction. Classic features are failure to pass meconium within 48 hours, abdominal distension, bilious vomiting and a tight rectum with explosive stool release after rectal examination (\"squirt sign\"). It is more common in boys and in children with Down syndrome. Pyloric stenosis causes non-bilious projectile vomiting at 3–6 weeks."},{"n":893,"t":"mc","visit":"Visit 1 (continued)","s":"Which test **confirms** the diagnosis?","opts":["An abdominal ultrasound of the pylorus","A sweat chloride test at 2 weeks of age","A stool culture for bacterial infection","Rectal suction biopsy showing no ganglion cells"],"correctIdx":[3],"answer":"D","c":"Rectal suction biopsy showing absent ganglion cells (with hypertrophied nerve fibers) is the gold standard for diagnosing Hirschsprung disease. A contrast enema may show a transition zone between narrow aganglionic and dilated normal bowel, and anorectal manometry may support the diagnosis. Treatment is surgical resection of the aganglionic segment (pull-through procedure). Meconium ileus prompts a sweat test for cystic fibrosis."},{"n":894,"t":"mc","visit":"Visit 1 (continued)","s":"Which serious complication should parents **watch for** even after surgery?","opts":["Projectile vomiting of milk at 6 weeks","Enterocolitis with fever, distension and diarrhea","Excessive weight gain in the first year","A red rash on both cheeks after a cold"],"correctIdx":[1],"answer":"B","c":"Hirschsprung-associated enterocolitis is a potentially life-threatening complication that can occur before or after surgery. It presents with fever, abdominal distension, explosive foul-smelling diarrhea, vomiting and lethargy, and requires urgent care with fluids, antibiotics and rectal decompression. Families should be taught these warning signs."}]},{"no":299,"batch":12,"title":"Baby Amaka: When to Start Peanuts","setting":"Well-child visit • Infant • Allergy / Nutrition","scenario":"Amaka is a 5-month-old girl with severe eczema that has needed prescription steroid creams. She is exclusively breastfed and developmentally ready for solid foods. Her older brother has a peanut allergy. Her parents are afraid to give her peanut products and ask whether they should wait until she is 3 years old.","qs":[{"n":895,"t":"mc","visit":"Visit 1","s":"What is the **current** recommendation about introducing peanut for Amaka?","opts":["Delay peanut until at least 3 years of age","Avoid peanut for life because her brother is allergic","Avoid peanut until she outgrows her eczema","Introduce peanut early, around 4–6 months, after evaluation"],"correctIdx":[3],"answer":"D","c":"Early introduction of peanut reduces the risk of peanut allergy. Infants with severe eczema and/or egg allergy are at highest risk and should have peanut-containing foods introduced around 4–6 months; current guidance supports introduction without routine testing in most settings, though some clinicians may evaluate first with an allergist. Delaying introduction increases the risk of allergy."},{"n":896,"t":"sata","visit":"Visit 1 (continued)","s":"Which are **safe ways** to give peanut to an infant? **Select all that apply.**","opts":["Peanut powder mixed into a puree","Peanut butter thinned with water or breast milk","Whole peanuts given as finger food","A spoonful of thick, sticky peanut butter","Peanut puffs softened with water"],"correctIdx":[0,1,4],"answer":"A, B, E","c":"Peanut should be given in age-appropriate forms: smooth peanut butter thinned with water, breast milk or formula, peanut powder or flour mixed into purees, or peanut puffs softened with water. Whole or chopped peanuts and thick spoonfuls of peanut butter are choking hazards and should not be given to children under 4. Once introduced, peanut should be given regularly (about 2 g of peanut protein a few times a week)."},{"n":897,"t":"mc","visit":"Visit 1 (continued)","s":"Which reaction after a first peanut feeding should prompt the parents to **call 911**?","opts":["A slightly messy face from the puree","A few hives around the mouth that fade quickly","Spitting out the food because of the taste","Trouble breathing, repetitive vomiting or lethargy"],"correctIdx":[3],"answer":"D","c":"Signs of anaphylaxis in infants include difficulty breathing, wheeze, persistent cough, hoarse cry, widespread hives, swelling of the face or tongue, repetitive vomiting, sudden lethargy or floppiness and pallor. These require emergency treatment with epinephrine and a 911 call. A few hives around the mouth that fade can occur from contact irritation, but any reaction should be reported to the clinician before giving more."}]},{"no":300,"batch":12,"title":"Elijah: Growing Faster Than His Height","setting":"Well-child visit • School-age child • Nutrition / Metabolic","scenario":"Elijah is a 9-year-old boy whose BMI is at the 97th percentile for age and sex. He drinks three cans of soda and two juice boxes daily, plays video games for 5 hours most days and rarely plays outside. He snores loudly at night. His father has type 2 diabetes. His BP is at the 90th percentile and he has dark, velvety skin on the back of his neck.","qs":[{"n":898,"t":"mc","visit":"Visit 1","s":"How is Elijah's weight status **classified**?","opts":["Healthy weight (5th to below the 85th percentile)","Obesity (BMI at or above the 95th percentile)","Overweight (85th to below the 95th percentile)","Severe obesity (BMI at least 120% of the 95th)"],"correctIdx":[1],"answer":"B","c":"In children aged 2 and older, BMI is interpreted using sex-specific BMI-for-age percentiles: healthy weight is the 5th to below the 85th percentile, overweight is the 85th to below the 95th, obesity is the 95th percentile or above, and severe obesity is 120% of the 95th percentile or more. Elijah has obesity."},{"n":899,"t":"sata","visit":"Visit 1 (continued)","s":"Which evaluations are **recommended** for Elijah? **Select all that apply.**","opts":["A routine head CT scan","A bone marrow examination","ALT to screen for fatty liver disease","Screening for type 2 diabetes such as an A1c","A fasting lipid panel"],"correctIdx":[2,3,4],"answer":"C, D, E","c":"The AAP recommends that children aged 10 and older with obesity (and considered at 9 with risk factors such as acanthosis and family history) be screened with a lipid panel, glucose or A1c and ALT. Snoring should prompt evaluation for obstructive sleep apnea, and BP should be monitored. Comorbidities are assessed regardless of age when risk factors are present."},{"n":900,"t":"mc","visit":"Visit 1 (continued)","s":"What is the **cornerstone** of treatment?","opts":["Weight-loss medication as the only treatment","Watchful waiting until he finishes puberty","A strict 800-calorie diet that he follows alone","Intensive family-based lifestyle treatment"],"correctIdx":[3],"answer":"D","c":"The 2023 AAP guideline recommends prompt, intensive health behavior and lifestyle treatment that is family-centered (ideally 26 or more contact hours over 3–12 months), addressing nutrition (such as eliminating sugary drinks), physical activity, screen time and sleep. Watchful waiting is not recommended. Pharmacotherapy may be offered for children 12 and older, and metabolic surgery for adolescents 13 and older with severe obesity."}]}];

    body = '<div class="opts">' + q.opts.map((o, j) => '<label class="opt"><input type="' + type + '" name="q' + q.n + '" id="in' + q.n + '_' + j + '" value="' + j + '"><span class="letter">' + L(j) + '.</span><span>' + esc(o) + '</span></label>').join('') + '</div>';
  } else if (q.t === 'match' || q.t === 'ord') {
    body = '<div class="match"><div><div class="count" style="margin-bottom:6px">' + (q.t === 'ord' ? 'Actions' : 'Options') + ' (drag, or tap one then tap a box)</div><div class="pool" id="pool">'
      + q.tgts.map((t, j) => '<button class="dchip" draggable="true" data-j="' + j + '">' + esc(t) + '</button>').join('') + '</div></div><div>'
      + q.items.map((it, i) => '<div class="row"><span class="drug">' + (i + 1) + '. ' + esc(it) + '</span><div class="slot" data-i="' + i + '"><span class="empty">Drop here</span></div></div>').join('') + '</div></div>';
  } else body = '<div class="hot" id="hot"></div><div class="hotsel" id="hotsel">No area selected</div>';
  W.innerHTML = '<div class="qpanel"><span class="visit">' + esc(q.visit) + '</span><span class="fmt">' + fmtName[q.t] + '</span>'
    + '<div class="stem"><b>Question ' + q.n + '.</b> ' + md(q.s) + '</div>' + body
    + '<div class="actions"><button class="btn solid" id="submit">Check answer</button><span class="verdict" id="verdict"></span></div><div id="fb"></div></div>';
  let answered = false, pick = null, selChip = null;
  if (q.t === 'mc' || q.t === 'sata') W.querySelectorAll('.opt input').forEach(inp => inp.onchange = () => W.querySelectorAll('.opt').forEach(o => o.classList.toggle('sel', o.querySelector('input').checked)));
  if (q.t === 'match' || q.t === 'ord') {
    const place = (chip, slot) => { if (answered) return; const prev = slot.querySelector('.dchip'); if (prev) $('#pool').append(prev); slot.innerHTML = ''; slot.append(chip); chip.classList.remove('picked'); };
    W.querySelectorAll('.dchip').forEach(ch => {
      ch.ondragstart = e => e.dataTransfer.setData('text/plain', ch.dataset.j);
      ch.onclick = e => { e.stopPropagation(); if (answered) return;
        if (ch.parentElement.classList.contains('slot')) { const sl = ch.parentElement; $('#pool').append(ch); sl.innerHTML = '<span class="empty">Drop here</span>'; return; }
        W.querySelectorAll('.dchip').forEach(x => x.classList.remove('picked')); selChip = ch; ch.classList.add('picked'); };
    });
    W.querySelectorAll('.slot').forEach(sl => {
      sl.ondragover = e => { e.preventDefault(); sl.classList.add('over'); };
      sl.ondragleave = () => sl.classList.remove('over');
      sl.ondrop = e => { e.preventDefault(); sl.classList.remove('over'); const ch = W.querySelector('.dchip[data-j="' + e.dataTransfer.getData('text/plain') + '"]'); if (ch) place(ch, sl); };
      sl.onclick = () => { if (selChip) { place(selChip, sl); selChip = null; } };
    });
  }
  if (q.t === 'hot') {
    $('#hot').innerHTML = q.svg;
    const choose = g => { if (answered) return; pick = g.dataset.id; $('#hot').querySelectorAll('.zone').forEach(z => z.classList.toggle('sel', z === g)); $('#hotsel').textContent = 'Selected: area ' + pick; };
    $('#hot').querySelectorAll('.zone').forEach(g => { g.onclick = () => choose(g); g.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); choose(g); } }; });
  }
  const need = m => { $('#verdict').textContent = m; $('#verdict').className = 'verdict'; };
  $('#submit').onclick = () => {
    if (answered) { qi++; renderQ(); return; }
    let ok;
    if (q.t === 'mc' || q.t === 'sata') {
      const chosen = [...W.querySelectorAll('.opt input')].filter(i => i.checked).map(i => +i.value);
      if (!chosen.length) return need('Choose an answer first.');
      ok = chosen.length === q.correctIdx.length && chosen.every(c => q.correctIdx.includes(c));
      W.querySelectorAll('.opt').forEach((o, j) => { o.classList.remove('sel'); if (q.correctIdx.includes(j)) o.classList.add('right'); else if (chosen.includes(j)) o.classList.add('wrong'); o.querySelector('input').disabled = true; });
    } else if (q.t === 'match' || q.t === 'ord') {
      const slots = [...W.querySelectorAll('.slot')];
      if (slots.some(s => !s.querySelector('.dchip'))) return need('Fill every box first.');
      ok = true; slots.forEach((s, i) => { const r = +s.querySelector('.dchip').dataset.j === q.map[i]; s.classList.add(r ? 'right' : 'wrong'); if (!r) ok = false; });
    } else {
      if (!pick) return need('Click an area first.');
      ok = pick === q.answer;
      $('#hot').querySelectorAll('.zone').forEach(z => { z.classList.remove('sel'); if (z.dataset.id === q.answer) z.classList.add('right'); else if (z.dataset.id === pick) z.classList.add('wrong'); });
    }
    answered = true; results[qi] = ok; steps();
    $('#verdict').textContent = ok ? 'Correct' : 'Not quite'; $('#verdict').className = 'verdict ' + (ok ? 'ok' : 'bad');
    $('#submit').textContent = qi === qs.length - 1 ? 'See case score' : 'Next question';
    $('#fb').innerHTML = '<div class="feedback"><div class="ans">Correct answer: ' + esc(q.answer) + '</div>'
      + '<h4>Rationale for correct answer</h4><p>' + esc(q.c) + '</p>'
      + '</div>';
  };
}
let start = 0; try { start = +(localStorage.getItem('fnpCase') || 0); } catch (e) {}
openCase(start >= 0 && start < CASES.length ? start : 0);
</script>

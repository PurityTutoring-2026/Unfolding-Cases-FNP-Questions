achnoid hemorrhage, meningitis or head trauma. It is important to recognize because it is potentially reversible."},{"n":545,"t":"mc","visit":"Visit 1 (continued)","s":"Which imaging finding **supports** this diagnosis?","opts":["A ring-enhancing lesion in the frontal lobe","Severe hippocampal atrophy on both sides","Enlarged ventricles out of proportion to atrophy","A crescent-shaped collection over the brain"],"correctIdx":[2],"answer":"C","c":"Brain MRI or CT in NPH shows ventriculomegaly that is out of proportion to cortical atrophy, often with narrowing of the high convexity sulci. Ring-enhancing lesions suggest abscess or tumor, a crescent-shaped collection suggests subdural hematoma, and disproportionate hippocampal atrophy suggests Alzheimer disease."},{"n":546,"t":"mc","visit":"Visit 2 (neurology plan)","s":"Which treatment can **improve** his symptoms if he responds to a lumbar tap test?","opts":["Carbidopa–levodopa three times daily","A ventriculoperitoneal shunt","Donepezil increased to the maximum dose","Oxybutynin for his urinary symptoms"],"correctIdx":[1],"answer":"B","c":"A high-volume lumbar puncture (tap test) or temporary lumbar drain that improves gait predicts response to a ventriculoperitoneal shunt, which can improve gait most reliably, followed by continence and cognition. Earlier treatment gives better results. NPH does not respond to levodopa, and anticholinergics such as oxybutynin can worsen cognition in older adults."}]},{"no":183,"batch":8,"title":"Mrs. Grant: A Fall and a Shortened Leg","setting":"Home visit • Older adult • Musculoskeletal","scenario":"Mrs. Grant is an 85-year-old woman with osteoporosis who tripped on a rug at home this morning and landed on her right side. She cannot bear weight and has pain in her right groin. Her right leg is shortened and rotated outward. She is alert and her pedal pulses are normal. She takes no anticoagulants.","qs":[{"n":547,"t":"mc","visit":"Visit 1","s":"What is the **most likely** diagnosis?","opts":["Trochanteric bursitis","Medial knee sprain","Proximal femur fracture","Sciatica from a disc"],"correctIdx":[2],"answer":"C","c":"A hip (proximal femur) fracture after a fall in an older adult typically causes groin or hip pain, inability to bear weight, and a shortened, externally rotated leg on the affected side. Most hip fractures in older adults result from a fall from standing height in people with osteoporosis. She needs emergency transfer for imaging and orthopedic care."},{"n":548,"t":"mc","visit":"Visit 2 (emergency department)","s":"Her hip x-rays are normal, but she still cannot bear weight. What is the **next** step?","opts":["A repeat x-ray in 3 months at her clinic visit","Physical therapy with full weight-bearing today","An MRI of the hip to look for an occult fracture","Discharge home with a walker and acetaminophen"],"correctIdx":[2],"answer":"C","c":"Up to 10% of hip fractures are not visible on initial x-rays. When clinical suspicion remains high, MRI is the test of choice to detect an occult fracture (CT if MRI is contraindicated). Missing a non-displaced fracture can lead to displacement and avascular necrosis."},{"n":549,"t":"sata","visit":"Visit 3 (after surgery)","s":"Mrs. Grant had surgery within 24 hours. Which elements of her care plan are **recommended**? **Select all that apply.**","opts":["Stopping vitamin D because of the surgery","Early mobilization with physical therapy","Osteoporosis treatment to prevent another fracture","Strict bed rest for 3 weeks after surgery","Thromboprophylaxis to prevent VTE"],"correctIdx":[1,2,4],"answer":"B, C, E","c":"After hip fracture surgery (ideally within 24–48 hours), care includes VTE prophylaxis, early mobilization and rehabilitation, delirium prevention, pain control, nutrition and fall-risk reduction. Every patient with a fragility hip fracture should be started on osteoporosis treatment (such as zoledronic acid) with calcium and vitamin D, because the risk of another fracture is high. Bed rest increases complications."}]},{"no":184,"batch":8,"title":"Ms. Herrera: Itching Without a Rash","setting":"Primary care clinic • Middle adult • Hepatic","scenario":"Ms. Herrera is a 50-year-old woman with 6 months of fatigue and generalized itching, worse at night, without a rash. She also has dry eyes and dry mouth. She does not drink alcohol. Alkaline phosphatase is 3 times the upper limit of normal, with a high GGT and mildly raised ALT. Bilirubin is normal. Antimitochondrial antibody (AMA) is positive. Ultrasound shows normal bile ducts.","qs":[{"n":550,"t":"mc","visit":"Visit 1","s":"What is the **most likely** diagnosis?","opts":["Acute viral hepatitis A infection","Primary biliary cholangitis","Choledocholithiasis with obstruction","Primary sclerosing cholangitis"],"correctIdx":[1],"answer":"B","c":"Primary biliary cholangitis (PBC) is an autoimmune destruction of small intrahepatic bile ducts, most common in middle-aged women. It causes fatigue and pruritus with a cholestatic pattern (high ALP and GGT). A positive antimitochondrial antibody is the hallmark. Primary sclerosing cholangitis affects larger ducts, is more common in men with ulcerative colitis, and shows beading on cholangiography."},{"n":551,"t":"mc","visit":"Visit 1 (continued)","s":"What is the **first-line** treatment?","opts":["Prednisone each day","Ursodeoxycholic acid","Methotrexate weekly","Interferon injections"],"correctIdx":[1],"answer":"B","c":"Ursodeoxycholic acid (ursodiol) is first-line therapy for PBC; it slows progression and improves survival. Obeticholic acid or newer PPAR agonists (elafibranor, seladelpar) are added for an inadequate response. Pruritus is treated with cholestyramine, rifampin or sertraline. Liver transplant is considered for end-stage disease."},{"n":552,"t":"sata","visit":"Visit 2 (follow-up)","s":"Which conditions are **associated** with her disease and need monitoring? **Select all that apply.**","opts":["Hypothyroidism","Hemochromatosis","Sjögren syndrome","Ulcerative colitis","Osteoporosis"],"correctIdx":[0,2,4],"answer":"A, C, E","c":"PBC is associated with other autoimmune conditions, especially Sjögren syndrome (dry eyes and mouth), autoimmune thyroid disease and scleroderma. Cholestasis causes fat-soluble vitamin (A, D, E, K) malabsorption and osteoporosis, so bone density is monitored. Hyperlipidemia with xanthelasma is common. Ulcerative colitis is associated with primary sclerosing cholangitis."}]},{"no":185,"batch":8,"title":"Mr. Nguyen: Spinning With a Full Ear","setting":"Primary care clinic • Middle adult • ENT","scenario":"Mr. Nguyen is a 52-year-old man with repeated attacks of spinning vertigo lasting 1–3 hours, with nausea and vomiting, over the past 6 months. Before each attack his right ear feels full and he hears roaring tinnitus. His hearing in that ear seems to come and go and has worsened over time. Between attacks he feels well. His neurological examination is normal.","qs":[{"n":553,"t":"mc","visit":"Visit 1","s":"What is the **most likely** diagnosis?","opts":["Positional vertigo (BPPV)","Acute vestibular neuritis","Vestibular migraine attacks","Ménière disease of the ear"],"correctIdx":[3],"answer":"D","c":"Ménière disease causes episodes of vertigo lasting 20 minutes to 12 hours, with fluctuating low-frequency sensorineural hearing loss, tinnitus and aural fullness in the affected ear, caused by endolymphatic hydrops. BPPV causes brief positional vertigo without hearing changes, and vestibular neuritis causes a single prolonged episode of vertigo lasting days without hearing loss."},{"n":554,"t":"mc","visit":"Visit 1 (continued)","s":"His right ear has sensorineural hearing loss. On the **Weber test**, where will the sound lateralize?","opts":["To neither ear at all","To the left (unaffected) ear","Equally to both ears","To the right (affected) ear"],"correctIdx":[1],"answer":"B","c":"In the Weber test, a vibrating tuning fork is placed on the midline of the head. With sensorineural hearing loss, sound lateralizes to the better (unaffected) ear. With conductive hearing loss, sound lateralizes to the affected ear. An audiogram confirms the low-frequency sensorineural loss typical of Ménière disease, and MRI excludes a vestibular schwannoma."},{"n":555,"t":"mc","visit":"Visit 1 (continued)","s":"Which lifestyle change is **recommended** to reduce his attacks?","opts":["A low-sodium diet with less caffeine and alcohol","A high-salt diet to keep fluid in the ear","Drinking 5 liters of water every single day","Avoiding all physical activity long term"],"correctIdx":[0],"answer":"A","c":"Ménière disease is managed with sodium restriction (about 1.5–2 g/day), limiting caffeine and alcohol, and sometimes a diuretic or betahistine. Vestibular suppressants and antiemetics are used briefly during attacks. Intratympanic steroids or gentamicin, or surgery, are options for refractory disease. ENT and audiology follow-up is needed."}]},{"no":186,"batch":8,"title":"Mr. Akinyemi: Black Stools on Pain Pills","setting":"Urgent visit • Middle adult • Gastrointestinal","scenario":"Mr. Akinyemi is a 55-year-old man who has taken naproxen twice daily for knee arthritis for 6 months. For 3 weeks he has had burning upper abdominal pain that is better with food and wakes him at night. Today he had two black, tarry stools and feels light-headed when standing. HR is 108 and BP 102/64. Hemoglobin is 9.1 g/dL (13.8 last year). He smokes.","qs":[{"n":556,"t":"hot","visit":"Visit 1","s":"**Click the region where peptic ulcer pain is classically located.**","answer":"B","c":"Peptic ulcer pain is classically epigastric, burning or gnawing. Duodenal ulcer pain often improves with food and recurs 2–3 hours after meals and at night, whereas gastric ulcer pain is often worse with food. Many ulcers, especially NSAID-related ones, are painless until they bleed or perforate.","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 400 320\" width=\"100%\" height=\"auto\"><rect width=\"400\" height=\"320\" fill=\"none\"/><path d=\"M 90 30 Q 200 10 310 30 Q 330 160 310 300 L 90 300 Q 70 160 90 30 Z\" fill=\"var(--skin)\" stroke=\"var(--diagram-ink)\" stroke-width=\"2.5\"/>\n<path d=\"M 90 70 Q 200 120 310 70\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-width=\"2\" stroke-opacity=\"0.5\"/>\n<line x1=\"200\" y1=\"40\" x2=\"200\" y2=\"296\" stroke=\"var(--diagram-ink)\" stroke-width=\"1.5\" stroke-dasharray=\"6 5\" stroke-opacity=\"0.55\"/>\n<line x1=\"84\" y1=\"170\" x2=\"316\" y2=\"170\" stroke=\"var(--diagram-ink)\" stroke-width=\"1.5\" stroke-dasharray=\"6 5\" stroke-opacity=\"0.55\"/>\n<circle cx=\"200\" cy=\"170\" r=\"6\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-width=\"2\"/>\n<path d=\"M 108 262 Q 150 285 196 296\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-width=\"2\" stroke-opacity=\"0.5\"/>\n<path d=\"M 292 262 Q 250 285 204 296\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-width=\"2\" stroke-opacity=\"0.5\"/>\n<text x=\"40\" y=\"20\" font-family=\"Arial, sans-serif\" font-size=\"12\" font-weight=\"700\" fill=\"var(--diagram-ink)\" text-anchor=\"start\">Patient's RIGHT</text><text x=\"268\" y=\"20\" font-family=\"Arial, sans-serif\" font-size=\"12\" font-weight=\"700\" fill=\"var(--diagram-ink)\" text-anchor=\"start\">Patient's LEFT</text><text x=\"206\" y=\"186\" font-family=\"Arial, sans-serif\" font-size=\"10\" font-weight=\"400\" fill=\"var(--diagram-ink)\" text-anchor=\"start\">umbilicus</text><g class=\"zone\" data-id=\"A\" tabindex=\"0\" role=\"button\" aria-label=\"Area A\">\n<circle cx=\"140\" cy=\"112\" r=\"15\" fill=\"var(--zone-fill)\" stroke=\"var(--zone-ink)\" stroke-width=\"2.5\"/>\n<text x=\"140\" y=\"117.5\" text-anchor=\"middle\" font-family=\"Georgia, 'Times New Roman', serif\" font-size=\"16\" font-weight=\"700\" fill=\"var(--zone-ink)\">A</text></g><g class=\"zone\" data-id=\"B\" tabindex=\"0\" role=\"button\" aria-label=\"Area B\">\n<circle cx=\"200\" cy=\"92\" r=\"15\" fill=\"var(--zone-fill)\" stroke=\"var(--zone-ink)\" stroke-width=\"2.5\"/>\n<text x=\"200\" y=\"97.5\" text-anchor=\"middle\" font-family=\"Georgia, 'Times New Roman', serif\" font-size=\"16\" font-weight=\"700\" fill=\"var(--zone-ink)\">B</text></g><g class=\"zone\" data-id=\"C\" tabindex=\"0\" role=\"button\" aria-label=\"Area C\">\n<circle cx=\"262\" cy=\"112\" r=\"15\" fill=\"var(--zone-fill)\" stroke=\"var(--zone-ink)\" stroke-width=\"2.5\"/>\n<text x=\"262\" y=\"117.5\" text-anchor=\"middle\" font-family=\"Georgia, 'Times New Roman', serif\" font-size=\"16\" font-weight=\"700\" fill=\"var(--zone-ink)\">C</text></g><g class=\"zone\" data-id=\"D\" tabindex=\"0\" role=\"button\" aria-label=\"Area D\">\n<circle cx=\"168\" cy=\"150\" r=\"15\" fill=\"var(--zone-fill)\" stroke=\"var(--zone-ink)\" stroke-width=\"2.5\"/>\n<text x=\"168\" y=\"155.5\" text-anchor=\"middle\" font-family=\"Georgia, 'Times New Roman', serif\" font-size=\"16\" font-weight=\"700\" fill=\"var(--zone-ink)\">D</text></g><g class=\"zone\" data-id=\"E\" tabindex=\"0\" role=\"button\" aria-label=\"Area E\">\n<circle cx=\"264\" cy=\"228\" r=\"15\" fill=\"var(--zone-fill)\" stroke=\"var(--zone-ink)\" stroke-width=\"2.5\"/>\n<text x=\"264\" y=\"233.5\" text-anchor=\"middle\" font-family=\"Georgia, 'Times New Roman', serif\" font-size=\"16\" font-weight=\"700\" fill=\"var(--zone-ink)\">E</text></g></svg>"},{"n":557,"t":"mc","visit":"Visit 1 (continued)","s":"What is the **most appropriate** action?","opts":["Order a stool guaiac test and wait for results","Emergency referral for IV access and urgent endoscopy","Start omeprazole and see him again in 4 weeks","Increase naproxen and add an antacid tablet"],"correctIdx":[1],"answer":"B","c":"Melena with tachycardia, orthostatic symptoms and a significant hemoglobin drop indicates an upper GI bleed that needs emergency care: IV access, fluid resuscitation, transfusion if needed, IV proton pump inhibitor and upper endoscopy within 24 hours. Naproxen must be stopped. The Glasgow-Blatchford score helps decide who needs hospital care."},{"n":558,"t":"sata","visit":"Visit 2 (after discharge)","s":"Which factors **increase** the risk of peptic ulcer disease? **Select all that apply.**","opts":["NSAID use","Eating spicy food","Cigarette smoking","Drinking milk every day","Helicobacter pylori infection"],"correctIdx":[0,2,4],"answer":"A, C, E","c":"The two main causes of peptic ulcers are NSAIDs (including low-dose aspirin) and H. pylori infection, so H. pylori should be tested for and treated. Smoking, older age, corticosteroids or anticoagulants combined with NSAIDs, and a prior ulcer increase risk. Spicy food and stress do not cause ulcers, and milk does not heal them."}]},{"no":187,"batch":8,"title":"Ms. Thompson: Asking About Weight-Loss Medicine","setting":"Primary care clinic • Middle adult • Metabolic","scenario":"Ms. Thompson is a 48-year-old woman with a BMI of 34, hypertension and prediabetes. Despite 2 years of a structured diet and exercise program, she has lost only 3% of her body weight. She asks about weight-loss medication. Her sister had medullary thyroid cancer, and genetic testing showed MEN2 in the family. She uses an IUD for contraception.","qs":[{"n":559,"t":"mc","visit":"Visit 1","s":"Which BMI criteria make an adult **eligible** for anti-obesity medication?","opts":["BMI ≥ 25 in any adult who asks for it","BMI ≥ 30, or ≥ 27 with a related condition","BMI ≥ 35 only if surgery was refused","BMI ≥ 40 only, with no exceptions at all"],"correctIdx":[1],"answer":"B","c":"Anti-obesity medications are indicated, together with lifestyle therapy, for adults with a BMI of 30 or more, or 27 or more with at least one weight-related condition such as hypertension, type 2 diabetes, dyslipidemia or sleep apnea. Bariatric surgery is considered for a BMI of 35 or more (or 30 or more with metabolic disease in some guidance)."},{"n":560,"t":"mc","visit":"Visit 1 (continued)","s":"Why should GLP-1 receptor agonists such as semaglutide be **avoided** for her?","opts":["Family history of medullary thyroid cancer and MEN2","They are only approved for people with diabetes","They cannot be used with an IUD in place","Her hypertension makes them unsafe to use"],"correctIdx":[0],"answer":"A","c":"GLP-1 receptor agonists and tirzepatide carry a boxed warning and are contraindicated in people with a personal or family history of medullary thyroid carcinoma or multiple endocrine neoplasia type 2, because of thyroid C-cell tumors in rodents. They are also avoided in pregnancy and used cautiously with a history of pancreatitis. Other options include phentermine–topiramate (if not contraindicated) or naltrexone–bupropion."},{"n":561,"t":"sata","visit":"Visit 1 (continued)","s":"Which statements about anti-obesity medications are **correct**? **Select all that apply.**","opts":["They are meant only for short use of a few weeks","Weight is often regained when they are stopped","They should be continued even with no weight loss","They work best combined with lifestyle changes","Phentermine–topiramate requires contraception counseling"],"correctIdx":[1,3,4],"answer":"B, D, E","c":"Anti-obesity medications are used with diet, physical activity and behavioral therapy, and obesity is treated as a chronic disease, so weight is often regained when medication stops. Phentermine–topiramate is teratogenic and requires pregnancy prevention. If a patient has not lost at least about 5% of body weight after 12–16 weeks at a maintenance dose, the medication should be changed."}]},{"no":188,"batch":8,"title":"Ms. Chukwu: A Needle-Stick Injury","setting":"Occupational health • Middle adult • Infectious disease","scenario":"Ms. Chukwu is a 44-year-old nurse who sustained a deep needle-stick injury 30 minutes ago with a hollow-bore needle used to draw blood from a patient whose HIV status is unknown. The patient has a history of injection drug use. Ms. Chukwu completed the hepatitis B vaccine series years ago, but her antibody response was never checked.","qs":[{"n":562,"t":"ord","visit":"Visit 1","s":"**Place the steps after this needle-stick injury in the correct order.**","items":["Step 1","Step 2","Step 3","Step 4"],"tgts":["Wash the wound with soap and water right away","Report the injury to the supervisor and occupational health","Start HIV post-exposure prophylaxis, ideally within 2 hours","Draw baseline tests and request source-patient testing"],"map":[0,1,3,2],"answer":"A, B, D, C","c":"After a needle-stick, the wound is washed immediately with soap and water (squeezing and caustic agents such as bleach are not recommended). The injury is reported promptly. Baseline HIV, hepatitis B and hepatitis C testing of the worker is drawn and the source patient is tested with consent. HIV PEP should begin as soon as possible, ideally within 2 hours and no later than 72 hours, without waiting for results when the source is high risk or unknown."},{"n":563,"t":"mc","visit":"Visit 1 (continued)","s":"What is the **recommended** HIV post-exposure prophylaxis regimen?","opts":["A single drug taken for 3 days","A two-drug regimen for 7 days","A three-drug regimen for 28 days","A single injection on day one only"],"correctIdx":[2],"answer":"C","c":"HIV PEP is a three-drug antiretroviral regimen taken for 28 days, such as bictegravir–emtricitabine–tenofovir alafenamide, or dolutegravir with tenofovir and emtricitabine. Follow-up HIV testing is done at about 6 weeks and 3 months (or 12 weeks with a combined antigen/antibody test). PEP can be stopped if the source tests HIV negative."},{"n":564,"t":"sata","visit":"Visit 1 (continued)","s":"Which other actions are **appropriate** for Ms. Chukwu? **Select all that apply.**","opts":["Squeeze the wound and soak it in bleach","Repeat HIV testing during follow-up","Wait for the source result before starting PEP","Use condoms until follow-up testing is negative","Check her hepatitis B surface antibody level"],"correctIdx":[1,3,4],"answer":"B, D, E","c":"A vaccinated worker with unknown antibody response should have anti-HBs checked; if it is low, hepatitis B immune globulin and vaccine boosters may be needed depending on the source status. Follow-up HIV and HCV testing are done. Until follow-up testing is negative, she should use condoms, avoid donating blood and discuss breastfeeding. Bleach and squeezing are not recommended, and PEP should not be delayed."}]},{"no":189,"batch":8,"title":"Ms. Bergström: Blurred Vision and Tingling","setting":"Primary care clinic • Middle adult • Neurology","scenario":"Ms. Bergström is a 41-year-old woman with 4 days of blurred vision and pain on moving her left eye; colors look washed out in that eye. Two years ago she had numbness in both legs for 6 weeks that resolved. She reports an electric sensation down her spine when she bends her neck forward. Her symptoms worsen after a hot shower.","qs":[{"n":565,"t":"mc","visit":"Visit 1","s":"What is the **most likely** diagnosis?","opts":["Multiple sclerosis with optic neuritis","Migraine with a typical visual aura","Myasthenia gravis with ptosis","Acute angle-closure glaucoma attack"],"correctIdx":[0],"answer":"A","c":"Optic neuritis (painful monocular vision loss, pain with eye movement and reduced color vision) is a common first presentation of multiple sclerosis (MS). MS is more common in women aged 20–40 and causes neurological episodes separated in time and location, such as her earlier leg numbness. Lhermitte sign and heat sensitivity (Uhthoff phenomenon) are typical."},{"n":566,"t":"mc","visit":"Visit 1 (continued)","s":"Which test is **most useful** to support the diagnosis?","opts":["A CT scan of the head without contrast","A nerve conduction study of the legs","MRI of the brain and spine with gadolinium","An EEG during a symptomatic episode"],"correctIdx":[2],"answer":"C","c":"MRI of the brain and spinal cord with gadolinium shows white matter lesions in typical locations (periventricular, juxtacortical, infratentorial, spinal cord) and can show dissemination in time and space. Cerebrospinal fluid oligoclonal bands support the diagnosis. Acute relapses are treated with high-dose corticosteroids, and disease-modifying therapy reduces relapses."},{"n":567,"t":"sata","visit":"Visit 1 (continued)","s":"Which findings are **typical** of multiple sclerosis? **Select all that apply.**","opts":["Internuclear ophthalmoplegia","Lhermitte sign with neck flexion","Heberden nodes of the fingers","Symptoms that worsen with heat","A resting pill-rolling tremor"],"correctIdx":[0,1,3],"answer":"A, B, D","c":"MS features include optic neuritis, Lhermitte sign, Uhthoff phenomenon (worsening with heat), internuclear ophthalmoplegia (impaired adduction of one eye with nystagmus of the other), sensory changes, weakness, spasticity, ataxia, bladder dysfunction and fatigue. A pill-rolling resting tremor suggests Parkinson disease, and Heberden nodes indicate osteoarthritis."}]},{"no":190,"batch":8,"title":"Mr. Larsen: Sudden Chest Pain at Rest","setting":"Urgent visit • Young adult • Respiratory","scenario":"Mr. Larsen is a 22-year-old tall, thin man who smokes. While watching television 2 hours ago he developed sudden sharp left-sided chest pain and shortness of breath. HR is 104, RR 22, BP 124/78 and SpO₂ 95%. Breath sounds are decreased on the left with hyperresonance to percussion. His trachea is midline.","qs":[{"n":568,"t":"mc","visit":"Visit 1","s":"What is the **most likely** diagnosis?","opts":["Acute asthma exacerbation","Primary spontaneous pneumothorax","Community-acquired pneumonia","Acute pericarditis attack"],"correctIdx":[1],"answer":"B","c":"Primary spontaneous pneumothorax typically occurs in tall, thin young men, often smokers, from rupture of apical blebs. It causes sudden pleuritic chest pain and dyspnea, with decreased breath sounds, hyperresonance and reduced tactile fremitus on the affected side. A chest x-ray confirms the diagnosis."},{"n":569,"t":"mc","visit":"Visit 1 (continued)","s":"Which finding would indicate a **tension** pneumothorax needing immediate decompression?","opts":["Decreased breath sounds with a midline trachea","Hyperresonance with an oxygen saturation of 95%","Hypotension with tracheal deviation away from the side","Mild pleuritic pain with a normal blood pressure"],"correctIdx":[2],"answer":"C","c":"Tension pneumothorax occurs when air enters the pleural space but cannot escape, compressing the heart and great vessels. Signs include severe respiratory distress, hypotension, tachycardia, distended neck veins and tracheal deviation away from the affected side. It is a clinical diagnosis requiring immediate needle decompression before imaging, followed by chest tube placement."},{"n":570,"t":"sata","visit":"Visit 2 (after recovery)","s":"Which advice is **appropriate** after his pneumothorax? **Select all that apply.**","opts":["Avoid scuba diving unless definitive surgery is done","Avoid air travel until it has fully resolved","Recurrence is impossible after the first episode","Resume scuba diving right away once he feels well","Stop smoking to reduce the risk of recurrence"],"correctIdx":[0,1,4],"answer":"A, B, E","c":"Recurrence after a primary spontaneous pneumothorax is common (about 30% or more), and smoking cessation is the most important modifiable factor. Patients should avoid flying until the pneumothorax has resolved on imaging, and scuba diving is permanently discouraged unless a definitive surgical procedure (pleurodesis) has been done. New chest pain or dyspnea needs prompt evaluation."}]},{"no":191,"batch":8,"title":"Mrs. Eze: Nausea in Early Pregnancy","setting":"Prenatal visit • Young adult • Women's health","scenario":"Mrs. Eze is a 24-year-old woman at 9 weeks of gestation with daily nausea and vomiting two or three times a day. She has tried small, frequent meals, crackers and ginger with partial relief. She is keeping fluids down, her weight is stable and her urine shows no ketones. Her vital signs are normal.","qs":[{"n":571,"t":"mc","visit":"Visit 1","s":"What is the **first-line** medication for her nausea and vomiting of pregnancy?","opts":["Doxylamine with pyridoxine (vitamin B6)","Ondansetron IV every 8 hours at home","Oral prednisone for 2 weeks to start","Promethazine injection every 4 hours"],"correctIdx":[0],"answer":"A","c":"ACOG recommends pyridoxine (vitamin B6) alone or combined with doxylamine as first-line pharmacologic therapy for nausea and vomiting of pregnancy after dietary changes and ginger. Antihistamines, dopamine antagonists (metoclopramide, promethazine) and ondansetron are second-line options. Corticosteroids are reserved for refractory hyperemesis after the first trimester."},{"n":572,"t":"sata","visit":"Visit 2 (3 weeks later)","s":"Which findings would suggest **hyperemesis gravidarum**? **Select all that apply.**","opts":["Dislike of strong food smells","Ketones in the urine","Mild nausea that is worse in the morning","Loss of more than 5% of pre-pregnancy weight","Electrolyte abnormalities such as low potassium"],"correctIdx":[1,3,4],"answer":"B, D, E","c":"Hyperemesis gravidarum is severe, persistent vomiting in pregnancy with weight loss of more than 5% of pre-pregnancy weight, ketonuria, dehydration and electrolyte or acid–base disturbances. It may need hospitalization for IV fluids. Mild morning nausea and food aversions are common and normal. Thyroid tests and ultrasound (to check for multiple or molar pregnancy) are part of the evaluation."},{"n":573,"t":"mc","visit":"Visit 2 (continued)","s":"If she needs IV fluids after weeks of vomiting, what should be given **before** dextrose?","opts":["Calcium gluconate IV","Thiamine (vitamin B1)","Vitamin K by injection","Iron by IV infusion"],"correctIdx":[1],"answer":"B","c":"Prolonged vomiting can deplete thiamine, and giving dextrose to a thiamine-deficient patient can precipitate Wernicke encephalopathy (confusion, ataxia and ophthalmoplegia). Thiamine should be given before or with dextrose-containing fluids in patients with prolonged vomiting. Electrolytes, including potassium and magnesium, should also be replaced."}]},{"no":192,"batch":8,"title":"Mr. Pryor: An Overdose and a Second Chance","setting":"Primary care clinic • Young adult • Substance use","scenario":"Mr. Pryor is a 29-year-old man who has used heroin and fentanyl daily for 3 years. Last month his girlfriend found him unresponsive with slow, shallow breathing and pinpoint pupils; EMS revived him with naloxone. He now wants treatment. He last used 18 hours ago and has yawning, sweating, runny nose, goosebumps, cramps and dilated pupils. His COWS score is 14.","qs":[{"n":574,"t":"ord","visit":"Visit 1","s":"The FNP teaches his girlfriend overdose response. **Place the steps in the correct order.**","items":["Step 1","Step 2","Step 3","Step 4"],"tgts":["Give naloxone nasal spray into one nostril","Start rescue breathing if he is not breathing","Check for response and call 911","Give a second dose in 2–3 minutes if no response"],"map":[2,0,1,3],"answer":"C, A, B, D","c":"For a suspected opioid overdose, the bystander checks responsiveness and calls 911, gives naloxone (4 mg nasal spray) promptly, supports breathing with rescue breaths, and gives another dose in 2–3 minutes if there is no response; high-potency fentanyl may need repeated doses. If breathing resumes, the person is placed in the recovery position and watched until EMS arrives, because naloxone wears off sooner than many opioids."},{"n":575,"t":"match","visit":"Visit 1 (continued)","s":"**Drag each medication for opioid use disorder to its description.** One option will not be used.","items":["Methadone","Buprenorphine","Extended-release naltrexone"],"tgts":["Full agonist given through an opioid treatment program; can prolong QT","Nicotine patch to reduce cravings for heroin","Monthly antagonist injection that requires 7–10 days without opioids first","Partial agonist that can be prescribed in the office; can cause withdrawal if started too early"],"map":[0,3,2],"answer":"1–A, 2–D, 3–C","c":"Methadone is a full mu-opioid agonist dispensed through certified opioid treatment programs; it can prolong the QT interval. Buprenorphine is a high-affinity partial agonist with a ceiling effect on respiratory depression; any clinician with a DEA registration can now prescribe it. Extended-release naltrexone is a monthly antagonist injection that requires 7–10 days opioid-free to avoid precipitated withdrawal. Methadone and buprenorphine reduce overdose deaths. A nicotine patch treats tobacco dependence."},{"n":576,"t":"mc","visit":"Visit 1 (continued)","s":"Why is now an **appropriate** time to start buprenorphine?","opts":["He is in moderate withdrawal, so it will not cause precipitated withdrawal","Buprenorphine works only after 30 days without any opioids","He used opioids recently, so buprenorphine will work faster","Buprenorphine must be started while he is still intoxicated"],"correctIdx":[0],"answer":"A","c":"Because buprenorphine binds opioid receptors very tightly but activates them only partially, starting it while full agonists still occupy receptors can cause abrupt precipitated withdrawal. It is started once the patient has objective moderate withdrawal (COWS about 8–12 or higher). With fentanyl, low-dose (\"micro\") induction strategies may be used. He should also receive naloxone to take home."}]},{"no":193,"batch":8,"title":"Ms. Rahman: Reliving the Crash","setting":"Primary care clinic • Young adult • Mental health","scenario":"Ms. Rahman is a 30-year-old woman who was in a serious car crash 5 months ago in which her friend died. She has intrusive memories, flashbacks and nightmares about the crash, avoids driving and the road where it happened, feels detached and guilty, startles easily and has trouble sleeping and concentrating. She has missed many days of work. She denies suicidal thoughts.","qs":[{"n":577,"t":"mc","visit":"Visit 1","s":"What is the **most likely** diagnosis?","opts":["Acute stress disorder","Posttraumatic stress disorder","Generalized anxiety disorder","Adjustment disorder, anxious"],"correctIdx":[1],"answer":"B","c":"PTSD follows exposure to actual or threatened death or serious injury and involves intrusion symptoms, avoidance, negative changes in mood and thinking, and arousal and reactivity symptoms lasting more than 1 month with functional impairment. Acute stress disorder has similar symptoms lasting 3 days to 1 month after the trauma. The PC-PTSD-5 is a useful screening tool."},{"n":578,"t":"mc","visit":"Visit 1 (continued)","s":"What is the **first-line** treatment for her PTSD?","opts":["Alprazolam taken as needed for flashbacks","An antipsychotic such as haloperidol daily","Avoiding all reminders of the trauma for life","Trauma-focused psychotherapy with or without an SSRI"],"correctIdx":[3],"answer":"D","c":"Trauma-focused psychotherapies such as cognitive processing therapy, prolonged exposure and EMDR are first-line treatments for PTSD. SSRIs (sertraline, paroxetine) and the SNRI venlafaxine are first-line medications. Benzodiazepines are not recommended because they do not treat PTSD, can worsen outcomes and carry dependence risk. Avoidance maintains PTSD."},{"n":579,"t":"mc","visit":"Visit 2 (2 months later)","s":"Her nightmares persist despite therapy. Which medication may **help**?","opts":["Diazepam each evening","Prazosin at bedtime","Bupropion in the evening","Zolpidem every night"],"correctIdx":[1],"answer":"B","c":"Prazosin, an alpha-1 blocker, can reduce trauma-related nightmares in some patients. It is started at a low dose at bedtime because of orthostatic hypotension, especially with the first dose. Image rehearsal therapy is a psychological treatment for nightmares. Benzodiazepines and Z-drugs are not recommended, and bupropion can worsen insomnia."}]},{"no":194,"batch":8,"title":"Mr. Sandoval: Tiny Red Spots and Bleeding Gums","setting":"Primary care clinic • Young adult • Hematology","scenario":"Mr. Sandoval is a 27-year-old man who recovered from a viral illness 2 weeks ago. He now has tiny red dots on his legs, easy bruising and gum bleeding when brushing his teeth. He takes no medications. He has no fever, weight loss, lymphadenopathy or splenomegaly. Platelets are 18,000/mm³; hemoglobin and WBC count are normal, and the blood smear shows few, large platelets with no other abnormalities.","qs":[{"n":580,"t":"mc","visit":"Visit 1","s":"What is the **most likely** diagnosis?","opts":["Disseminated intravascular clotting","Acute myeloid leukemia (AML)","Hemophilia A (factor VIII lack)","Immune thrombocytopenia (ITP)"],"correctIdx":[3],"answer":"D","c":"Immune thrombocytopenia (ITP) is isolated thrombocytopenia (platelets below 100,000/mm³) caused by antibody-mediated platelet destruction, often after a viral illness. Patients have petechiae, bruising and mucosal bleeding with an otherwise normal CBC and smear (large platelets may be seen). Leukemia causes other cytopenias or blasts, DIC causes abnormal clotting tests, and hemophilia causes joint and deep tissue bleeding."},{"n":581,"t":"sata","visit":"Visit 1 (continued)","s":"Which tests are **recommended** for adults with newly suspected ITP? **Select all that apply.**","opts":["A head CT for every patient","Review of the peripheral blood smear","Hepatitis C testing","A routine bone marrow biopsy","HIV testing"],"correctIdx":[1,2,4],"answer":"B, C, E","c":"ITP is a diagnosis of exclusion. Adults should have a CBC with peripheral smear review to exclude pseudothrombocytopenia and other disorders, and testing for HIV and hepatitis C (and often H. pylori), which can cause secondary ITP. Bone marrow examination is not routinely needed in typical cases. Head imaging is only for symptoms of intracranial bleeding."},{"n":582,"t":"mc","visit":"Visit 1 (continued)","s":"His platelets are 18,000/mm³ with mucosal bleeding. What is the **first-line** treatment?","opts":["A course of oral corticosteroids","Platelet transfusion each week","Daily ibuprofen for gum discomfort","Immediate splenectomy this week"],"correctIdx":[0],"answer":"A","c":"Adults with newly diagnosed ITP and a platelet count below 30,000/mm³ (or with bleeding) are treated first with corticosteroids such as prednisone or dexamethasone; IVIG is added when a rapid rise is needed. Thrombopoietin receptor agonists, rituximab or splenectomy are options for persistent disease. NSAIDs, aspirin and contact sports should be avoided."}]},{"no":195,"batch":8,"title":"Jayden: Dark Velvety Skin on the Neck","setting":"Primary care clinic • Adolescent • Endocrine / Metabolic","scenario":"Jayden is a 15-year-old boy with a BMI above the 97th percentile who comes for a sports physical. He has dark, velvety, thickened skin on the back of his neck and in his armpits. His mother and grandmother have type 2 diabetes. He reports increased thirst. His A1c is 7.1% and a repeat is 7.0%. He has no ketones.","qs":[{"n":583,"t":"mc","visit":"Visit 1","s":"What does the dark, velvety skin on his neck **indicate**?","opts":["Acanthosis nigricans from insulin resistance","Poor hygiene that needs better washing","A fungal infection that needs a cream","An allergic reaction to his sports gear"],"correctIdx":[0],"answer":"A","c":"Acanthosis nigricans is dark, velvety thickening of the skin in body folds (neck, axillae, groin) and is a marker of insulin resistance and hyperinsulinemia. In youth with overweight or obesity, it is a risk factor that prompts diabetes screening, along with family history, high-risk ethnicity, maternal gestational diabetes and signs such as PCOS or hypertension."},{"n":584,"t":"mc","visit":"Visit 1 (continued)","s":"Jayden has type 2 diabetes. What is the **first-line** medication along with lifestyle change?","opts":["Oral glipizide","Oral acarbose","Oral pioglitazone","Oral metformin"],"correctIdx":[3],"answer":"D","c":"For youth with type 2 diabetes, an A1c below 8.5% and no ketosis, metformin is first-line along with lifestyle change. GLP-1 receptor agonists (such as liraglutide or semaglutide) and some SGLT2 inhibitors are approved for youth aged 10 and older. Insulin is started for ketosis, DKA, or an A1c of 8.5% or more with symptoms."},{"n":585,"t":"sata","visit":"Visit 1 (continued)","s":"Which evaluations should be done at the time of his diagnosis? **Select all that apply.**","opts":["Blood pressure and fasting lipids","Urine albumin-to-creatinine ratio","A bone marrow biopsy","An echocardiogram for all youth","A dilated eye exam for retinopathy"],"correctIdx":[0,1,4],"answer":"A, B, E","c":"Unlike type 1 diabetes, complications can be present at diagnosis in youth-onset type 2 diabetes. At diagnosis, youth should be screened for hypertension, dyslipidemia, albuminuria, retinopathy, MASLD (liver enzymes), obstructive sleep apnea, PCOS in girls, and depression and disordered eating. Bone marrow biopsy and routine echocardiography are not indicated."}]},{"no":196,"batch":8,"title":"Lily: A Gymnast With Back Pain","setting":"Sports clinic • Adolescent • Musculoskeletal","scenario":"Lily is a 14-year-old competitive gymnast with 6 weeks of low back pain that worsens with back walkovers and arching and eases with rest. There was no single injury. She has no leg numbness, weakness or bladder changes. Pain is reproduced when she stands on her right leg and leans backward. Her neurological examination is normal.","qs":[{"n":586,"t":"mc","visit":"Visit 1","s":"What is the **most likely** diagnosis?","opts":["Ankylosing spondylitis of the spine","Simple muscle strain of the lower back","Lumbar disc herniation with sciatica","Spondylolysis (a pars stress fracture)"],"correctIdx":[3],"answer":"D","c":"Spondylolysis is a stress fracture of the pars interarticularis, usually at L5, and is the most common identifiable cause of low back pain in adolescent athletes who repeatedly hyperextend, such as gymnasts, dancers, football linemen and divers. It causes activity-related low back pain worse with extension. Bilateral defects can progress to spondylolisthesis (forward slippage)."},{"n":587,"t":"mc","visit":"Visit 1 (continued)","s":"Which examination maneuver reproduced her pain?","opts":["The FABER test for the sacroiliac joint","The straight-leg raise test while lying","The single-leg hyperextension (stork) test","The Adams forward-bend test for curves"],"correctIdx":[2],"answer":"C","c":"In the single-leg hyperextension (stork) test, the patient stands on one leg and leans backward; pain on the standing side suggests a pars stress injury, though the test is not very specific. Imaging begins with lumbar x-rays, and MRI (or CT) can detect early stress reactions. The Adams forward-bend test screens for scoliosis."},{"n":588,"t":"mc","visit":"Visit 1 (continued)","s":"What is the **most appropriate** management?","opts":["Strict bed rest for 3 months with opioids","Continue full gymnastics training with NSAIDs","Immediate spinal fusion surgery this month","Rest from extension activities and physical therapy"],"correctIdx":[3],"answer":"D","c":"Spondylolysis is managed with relative rest from sports and hyperextension activities (often 6–12 weeks), followed by physical therapy focusing on core stabilization and flexibility, with gradual return when pain-free; a brace may be used. Most adolescents return to sport. Surgery is rarely needed, mainly for high-grade spondylolisthesis or failure of conservative care."}]},{"no":197,"batch":8,"title":"Baby Noor: A Stubborn Diaper Rash","setting":"Primary care clinic • Infant • Dermatology","scenario":"Noor is an 8-month-old girl with a diaper rash for 5 days that has not improved with zinc oxide. She finished a course of amoxicillin for an ear infection last week. The rash is bright, beefy red, involves the skin folds of the groin, and has small red papules and pustules scattered beyond the edge. She is feeding well and is afebrile.","qs":[{"n":589,"t":"mc","visit":"Visit 1","s":"What is the **most likely** diagnosis?","opts":["Bullous impetigo rash","Irritant contact dermatitis","Seborrheic dermatitis","Candidal diaper dermatitis"],"correctIdx":[3],"answer":"D","c":"Candidal diaper dermatitis causes a beefy-red rash that involves the inguinal skin folds, with satellite papules and pustules beyond the main border. It often follows antibiotic use or a persistent irritant rash. Irritant diaper dermatitis affects the convex surfaces in contact with the diaper and spares the folds."},{"n":590,"t":"match","visit":"Visit 1 (continued)","s":"**Drag each type of diaper rash to its description.** One option will not be used.","items":["Irritant contact dermatitis","Candidal dermatitis","Seborrheic dermatitis"],"tgts":["Beefy-red rash in the folds with satellite papules and pustules","Painful vesicles in a band along one dermatome","Red, shiny skin on convex surfaces that spares the skin folds","Salmon-colored patches with greasy yellow scale, also on the scalp"],"map":[2,0,3],"answer":"1–C, 2–A, 3–D","c":"Irritant diaper dermatitis, caused by prolonged contact with urine and stool, involves the convex skin under the diaper and spares the creases; it is treated with frequent changes and barrier creams. Candidal dermatitis involves the folds with satellite lesions and is treated with topical nystatin, clotrimazole or miconazole. Seborrheic dermatitis causes salmon-colored, greasy-scaled patches in folds and often on the scalp (cradle cap). The unused option describes herpes zoster."},{"n":591,"t":"mc","visit":"Visit 1 (continued)","s":"What is the **most appropriate** treatment?","opts":["A high-potency topical steroid for 4 weeks","Talcum powder applied at each diaper change","Topical nystatin with a zinc barrier cream","Oral amoxicillin for another 10 days"],"correctIdx":[2],"answer":"C","c":"Candidal diaper dermatitis is treated with a topical antifungal (nystatin, clotrimazole or miconazole) applied several times a day, with a zinc oxide barrier over it, frequent diaper changes and air exposure. High-potency steroids are avoided in the diaper area because of skin atrophy and absorption. Talc can be inhaled and is not recommended. Oral thrush should be checked and treated if present."}]},{"no":198,"batch":8,"title":"Baby Kofi: Coughing Fits and Turning Blue","setting":"Urgent visit • Infant • Respiratory / Infectious disease","scenario":"Kofi is a 6-week-old boy who has had a runny nose for a week and, for 3 days, fits of rapid coughing that end with gagging and vomiting. During two episodes he turned blue and briefly stopped breathing. Between fits he looks well. He has not yet received any DTaP doses. His mother has had a lingering cough for 3 weeks and did not receive Tdap during pregnancy.","qs":[{"n":592,"t":"mc","visit":"Visit 1","s":"What is the **most likely** diagnosis?","opts":["Pertussis (whooping cough)","RSV bronchiolitis alone","Gastroesophageal reflux","Croup from parainfluenza"],"correctIdx":[0],"answer":"A","c":"Pertussis (Bordetella pertussis) progresses from a catarrhal stage to a paroxysmal stage with coughing fits, post-tussive vomiting and, in older children, an inspiratory \"whoop.\" Young infants may not whoop but often have apnea and cyanosis, and they have the highest risk of death. Adults and adolescents with prolonged cough are common sources."},{"n":593,"t":"mc","visit":"Visit 1 (continued)","s":"What is the **most appropriate** management for Kofi?","opts":["Oral amoxicillin and a recheck in a week","Home care with honey for the cough","Hospital admission and azithromycin","Wait for the PCR result before treatment"],"correctIdx":[2],"answer":"C","c":"Infants under 3–4 months with suspected pertussis, especially with apnea or cyanosis, should be hospitalized for monitoring. Azithromycin is the preferred antibiotic for infants (including those under 1 month, with monitoring for pyloric stenosis) and should be started without waiting for PCR results. Honey is unsafe under 12 months because of botulism risk."},{"n":594,"t":"sata","visit":"Visit 1 (continued)","s":"Which measures **prevent** pertussis in infants? **Select all that apply.**","opts":["DTaP for the infant at 2, 4 and 6 months","Delaying DTaP until the infant is 1 year old","Tdap for the mother during each pregnancy","Antibiotics only for contacts who develop a cough","Antibiotic prophylaxis for all household contacts"],"correctIdx":[0,2,4],"answer":"A, C, E","c":"Maternal Tdap at 27–36 weeks of each pregnancy passes antibodies that protect infants before they can be vaccinated. Infants receive DTaP at 2, 4, 6 and 15–18 months, then 4–6 years. Post-exposure antibiotic prophylaxis (azithromycin) is recommended for all household contacts and high-risk contacts regardless of vaccination status. His mother should be tested and treated."}]},{"no":199,"batch":8,"title":"Ella: Fever and Refusing to Walk","setting":"Urgent visit • Preschool child • Musculoskeletal / Infectious disease","scenario":"Ella is a 5-year-old girl who has refused to walk since yesterday and cries when her right hip is moved. She has a fever of 39.2 °C. She holds her right hip flexed, abducted and externally rotated. WBC is 15,800/mm³, ESR 52 mm/hr and CRP 6.4 mg/dL. She had a mild cold 2 weeks ago.","qs":[{"n":595,"t":"mc","visit":"Visit 1","s":"Which diagnosis is the **most important** concern?","opts":["Growing pains of childhood","Septic arthritis of the hip","Transient synovitis of the hip","Legg–Calvé–Perthes disease"],"correctIdx":[1],"answer":"B","c":"Septic arthritis of the hip is an orthopedic emergency that can destroy the joint within hours to days. It typically causes fever, a toxic appearance, refusal to bear weight, a hip held in flexion, abduction and external rotation, severe pain with movement and high inflammatory markers. Transient synovitis is milder, with low-grade or no fever and near-normal labs. Perthes disease causes a painless or mildly painful limp without fever."},{"n":596,"t":"sata","visit":"Visit 1 (continued)","s":"Which findings are part of the **Kocher criteria** for septic arthritis of the hip? **Select all that apply.**","opts":["Inability to bear weight","A positive Ortolani maneuver","Temperature above 38.5 °C","A recent upper respiratory infection","ESR above 40 mm/hr"],"correctIdx":[0,2,4],"answer":"A, C, E","c":"The Kocher criteria are non-weight-bearing, fever above 38.5 °C, ESR above 40 mm/hr and WBC above 12,000/mm³ (a CRP above 2.0 mg/dL is often added). The probability of septic arthritis rises sharply with each criterion and exceeds 90% with all four. A recent viral illness is more typical of transient synovitis. Ortolani tests infant hip dysplasia."},{"n":597,"t":"mc","visit":"Visit 1 (continued)","s":"What is the **most appropriate** next step?","opts":["Emergency referral for hip ultrasound and aspiration","An outpatient MRI scheduled for next month","Oral antibiotics at home with no further tests","NSAIDs and a recheck in one week at the clinic"],"correctIdx":[0],"answer":"A","c":"Suspected septic arthritis requires emergency orthopedic evaluation: ultrasound to detect a joint effusion, followed by joint aspiration for cell count, Gram stain and culture, blood cultures, IV antibiotics covering Staphylococcus aureus (and Kingella kingae in young children) and usually surgical drainage. Delay can cause avascular necrosis and permanent joint damage."}]},{"no":200,"batch":8,"title":"Baby Ruby: Bruises That Don't Add Up","setting":"Primary care clinic • Infant • Child protection","scenario":"Ruby is a 4-month-old girl brought for a routine visit. The FNP notices bruises on her left ear and on her chest and back. Her father says she \"rolled off the couch\" yesterday. She cannot yet roll over or crawl. She is fussy but consolable, and her fontanelle is flat. There is a small frenulum tear in her upper lip.","qs":[{"n":598,"t":"mc","visit":"Visit 1","s":"Why are Ruby's findings **concerning** for physical abuse?","opts":["Bruises are common in all 4-month-olds","Her father described a fall from a couch","She cried during the physical examination","Bruising in an infant who is not yet mobile"],"correctIdx":[3],"answer":"D","c":"Any bruise in an infant under 4 months, or in a non-mobile infant, is a red flag for abuse (\"those who don't cruise rarely bruise\"). The TEN-4-FACESp rule flags bruising of the Torso, Ears or Neck in children under 4 years, any bruising under 4 months, and bruising of the Frenulum, Angle of the jaw, Cheeks, Eyelids, Subconjunctivae and Patterned bruises. A history inconsistent with the infant's development is also concerning."},{"n":599,"t":"sata","visit":"Visit 1 (continued)","s":"Which actions are **required or recommended** now? **Select all that apply.**","opts":["Confront the father and demand a confession","Arrange a skeletal survey and head imaging","Document findings objectively with photos","Wait to see if more bruises appear next visit","Report the concern to child protective services"],"correctIdx":[1,2,4],"answer":"B, C, E","c":"Clinicians are mandated reporters and must report reasonable suspicion of abuse; proof is not required. Infants with suspected physical abuse need a skeletal survey (and often head imaging and labs to exclude bleeding disorders) to detect occult fractures and intracranial injury. Findings should be documented objectively with photographs, using the caregiver's own words. Accusing caregivers can endanger the child and is not the clinician's role."},{"n":600,"t":"mc","visit":"Visit 1 (continued)","s":"Which minor injury in an infant is considered a **\"sentinel injury\"** that warrants evaluation?","opts":["A bruise on the shin of a walker","A small scab on a toddler's knee","A scratch from the infant's own nail","A torn frenulum of the upper lip"],"correctIdx":[3],"answer":"D","c":"Sentinel injuries are minor, visible injuries in young infants, such as bruises, oral injuries (including a torn labial frenulum) or petechiae, that are poorly explained and may precede more serious abuse. Recognizing them and evaluating thoroughly can prevent severe injury or death. Bruises on the shins of walking children and self-inflicted scratches are common and usually accidental."}]},{"no":201,"batch":9,"title":"Mr. Adeyemi: Extremely High Sugar and Confusion","setting":"Home visit → emergency • Older adult • Endocrine","scenario":"Mr. Adeyemi is an 81-year-old man with type 2 diabetes treated with metformin. For a week he has had a urinary tract infection, drunk very little and urinated frequently. Today he is confused and very weak. His mucous membranes are dry, BP 92/56, HR 118. Fingerstick glucose reads \"HI.\" In the emergency department, glucose is 980 mg/dL, serum osmolality 360 mOsm/kg, bicarbonate 22 mEq/L, pH 7.36 and ketones are trace.","qs":[{"n":601,"t":"mc","visit":"Visit 1","s":"What is the **most likely** diagnosis?","opts":["Diabetic ketoacidosis (DKA)","Hypoglycemic coma from insulin","Metformin lactic acidosis","Hyperosmolar hyperglycemic state"],"correctIdx":[3],"answer":"D","c":"Hyperosmolar hyperglycemic state (HHS) occurs mainly in older adults with type 2 diabetes, often triggered by infection and poor fluid intake. It develops over days and causes extreme hyperglycemia (often above 600 mg/dL), high serum osmolality (above 320 mOsm/kg), profound dehydration and altered mental status, with little or no ketosis or acidosis. DKA has significant ketones and a pH below 7.30."},{"n":602,"t":"ord","visit":"Visit 1 (continued)","s":"**Place the main steps of HHS treatment in the correct order.**","items":["Step 1","Step 2","Step 3","Step 4"],"tgts":["Check potassium and replace it if low before insulin","Give IV isotonic saline to restore circulating volume","Start an IV insulin infusion","Add dextrose to IV fluids as glucose falls to about 300 mg/dL"],"map":[1,0,2,3],"answer":"B, A, C, D","c":"Fluid replacement is the first and most important step in HHS, because patients are severely dehydrated (often 8–10 liters); fluids alone lower glucose substantially. Potassium is checked and replaced before insulin, since insulin drives potassium into cells and can cause dangerous hypokalemia. An insulin infusion is then started. Dextrose is added when glucose reaches about 300 mg/dL to allow continued fluid and insulin therapy while avoiding a rapid fall in osmolality."},{"n":603,"t":"sata","visit":"Visit 2 (after recovery)","s":"Which factors **contributed** to his HHS? **Select all that apply.**","opts":["An untreated infection","An impaired thirst response with aging","Taking a daily multivitamin","Regular blood glucose checks","Poor fluid intake"],"correctIdx":[0,1,4],"answer":"A, B, E","c":"Common triggers of HHS include infections (pneumonia, UTI), poor fluid intake, impaired thirst in older adults, new or untreated diabetes, myocardial infarction or stroke, and medications such as corticosteroids, thiazides and some antipsychotics. Sick-day rules (fluids, glucose checks, early contact with the care team) help prevent it."}]},{"no":202,"batch":9,"title":"Mr. Becker: Rough Spots on a Bald Scalp","setting":"Primary care clinic • Older adult • Dermatology","scenario":"Mr. Becker is a 73-year-old fair-skinned man who worked outdoors as a mail carrier for 35 years. He has several rough, sandpaper-like, red, scaly patches on his bald scalp, forehead and the backs of his hands. They are easier to feel than to see. One patch on his hand has become thick, tender and raised over the past 2 months.","qs":[{"n":604,"t":"mc","visit":"Visit 1","s":"What are the rough, scaly patches **most likely** to be?","opts":["Actinic keratoses","Tinea corporis","Psoriasis plaques","Seborrheic keratoses"],"correctIdx":[0],"answer":"A","c":"Actinic keratoses are precancerous lesions caused by cumulative sun exposure, appearing as rough, sandpaper-like, scaly red or skin-colored patches on sun-exposed areas such as the scalp, face, ears and backs of the hands. They are often easier to feel than to see. A small percentage progress to squamous cell carcinoma. Seborrheic keratoses are benign, waxy, \"stuck-on\" lesions."},{"n":605,"t":"mc","visit":"Visit 1 (continued)","s":"What should be done about the **thick, tender, growing** lesion on his hand?","opts":["Biopsy it to exclude squamous cell carcinoma","Freeze it with cryotherapy without biopsy","Apply moisturizer and recheck in a year","Treat it with an antifungal cream for 4 weeks"],"correctIdx":[0],"answer":"A","c":"Signs that an actinic keratosis may have become squamous cell carcinoma include thickening, induration, tenderness, rapid growth, ulceration or bleeding. Such lesions should be biopsied (shave or punch biopsy to adequate depth) rather than destroyed without a diagnosis. Typical actinic keratoses can be treated without biopsy."},{"n":606,"t":"sata","visit":"Visit 1 (continued)","s":"Which treatments are **appropriate** for his typical actinic keratoses? **Select all that apply.**","opts":["Topical high-potency steroids","Cryotherapy with liquid nitrogen","Topical 5-fluorouracil cream","Photodynamic therapy","Oral antibiotics for 2 weeks"],"correctIdx":[1,2,3],"answer":"B, C, D","c":"Isolated actinic keratoses are commonly treated with cryotherapy. Field therapy for multiple lesions includes topical 5-fluorouracil, imiquimod, tirbanibulin or photodynamic therapy; 5-FU causes expected redness and crusting during treatment. Daily sunscreen and sun protection reduce new lesions, and patients need regular skin examinations. Steroids and antibiotics are not effective."}]},{"no":203,"batch":9,"title":"Mrs. Lindholm: Fainting With a Very Slow Pulse","setting":"Urgent visit • Older adult • Cardiovascular","scenario":"Mrs. Lindholm is a 79-year-old woman who fainted twice this week without warning, once while sitting. She has had fatigue and dizziness for a month. She takes lisinopril only. HR is 36 and regular, BP 118/64. Her ECG shows P waves at a rate of 80 that have no relationship to the QRS complexes, which are occurring at a rate of 36.","qs":[{"n":607,"t":"mc","visit":"Visit 1","s":"What does Mrs. Lindholm's ECG show?","opts":["Second-degree Mobitz I (Wenckebach)","Sinus bradycardia with normal conduction","Third-degree (complete) heart block","First-degree atrioventricular block"],"correctIdx":[2],"answer":"C","c":"In third-degree (complete) heart block, no atrial impulses reach the ventricles, so P waves and QRS complexes occur independently (AV dissociation), with a slow ventricular escape rhythm. First-degree block is a PR interval over 200 ms with every P conducted. Mobitz I shows progressive PR lengthening until a beat is dropped. Sinus bradycardia has a P wave before every QRS."},{"n":608,"t":"mc","visit":"Visit 1 (continued)","s":"What is the **most appropriate** next step?","opts":["Emergency transfer for monitoring and pacing","Start metoprolol to steady her heart rate","A Holter monitor and a recheck in a month","Reassurance because she is now asymptomatic"],"correctIdx":[0],"answer":"A","c":"Complete heart block with syncope is a medical emergency. She needs transfer with cardiac monitoring, transcutaneous pacing or atropine available (atropine is often ineffective in infranodal block), and a permanent pacemaker. AV-nodal blocking drugs such as beta-blockers, nondihydropyridine calcium blockers and digoxin must be avoided."},{"n":609,"t":"mc","visit":"Visit 2 (after pacemaker)","s":"Which instruction about her new pacemaker is **correct**?","opts":["Keep cell phones at least 6 inches from the device","Avoid all household appliances at home for life","Raise the arm on that side above the head often","Walk through security scanners slowly and stop inside"],"correctIdx":[0],"answer":"A","c":"Patients with pacemakers should keep cell phones and magnets at least 6 inches from the device (use the ear on the opposite side), avoid lifting the arm on the device side above shoulder height and heavy lifting for several weeks after implantation, carry a device ID card, walk through security scanners without stopping, and attend remote and in-person device checks. Normal household appliances are safe."}]},{"no":204,"batch":9,"title":"Mrs. Duarte: A Hot, Swollen Knee","setting":"Urgent visit • Older adult • Rheumatology","scenario":"Mrs. Duarte is a 78-year-old woman with osteoarthritis and hypothyroidism who developed sudden pain, warmth and swelling of her right knee 2 days after hospital discharge for pneumonia. Temperature is 37.8 °C. Knee x-ray shows linear calcification of the cartilage. Joint aspiration shows 22,000 WBC/mm³, a negative Gram stain, and rhomboid-shaped, weakly positively birefringent crystals.","qs":[{"n":610,"t":"mc","visit":"Visit 1","s":"What is the **most likely** diagnosis?","opts":["Acute gout from monosodium urate crystals","Calcium pyrophosphate deposition (pseudogout)","Bacterial septic arthritis of the knee joint","Flare of osteoarthritis without crystals"],"correctIdx":[1],"answer":"B","c":"Acute calcium pyrophosphate (CPP) crystal arthritis, or pseudogout, most often affects the knees or wrists of older adults and can be triggered by illness, surgery or hospitalization. Synovial fluid shows rhomboid, weakly positively birefringent crystals, and x-rays often show chondrocalcinosis. It is associated with hyperparathyroidism, hemochromatosis, hypomagnesemia and hypothyroidism."},{"n":611,"t":"match","visit":"Visit 1 (continued)","s":"**Drag each type of acute arthritis to its synovial fluid finding.** One option will not be used.","items":["Gout","Pseudogout (CPPD)","Septic arthritis"],"tgts":["Rhomboid, weakly positively birefringent crystals","Clear fluid with fewer than 200 WBC/mm³","WBC often above 50,000 with organisms on Gram stain","Needle-shaped, negatively birefringent crystals"],"map":[3,0,2],"answer":"1–D, 2–A, 3–C","c":"Gout shows needle-shaped, strongly negatively birefringent monosodium urate crystals. Pseudogout shows rhomboid, weakly positively birefringent calcium pyrophosphate crystals. Septic arthritis typically has a very high WBC count (often above 50,000/mm³) with neutrophils and organisms on Gram stain or culture; crystals and infection can coexist. Clear fluid with fewer than 200 WBC/mm³ is normal synovial fluid."},{"n":612,"t":"mc","visit":"Visit 1 (continued)","s":"Infection has been excluded. Which treatment is **most appropriate** for her single affected knee?","opts":["Long-term high-dose oral NSAIDs daily","Allopurinol started today to lower urate","Surgical washout of the knee in theatre","Joint aspiration with an intra-articular steroid"],"correctIdx":[3],"answer":"D","c":"Acute pseudogout in one or two large joints is often best treated with joint aspiration and an intra-articular corticosteroid once infection is excluded, especially in older adults at risk from NSAIDs. Oral colchicine, a short course of oral steroids or NSAIDs (if safe) are alternatives. Allopurinol lowers urate and has no role in CPPD."}]},{"no":205,"batch":9,"title":"Mr. Petrov: Food Sticking in His Chest","setting":"Primary care clinic • Older adult • Gastrointestinal / Oncology","scenario":"Mr. Petrov is a 71-year-old man who smokes and drinks heavily. For 3 months, solid foods such as meat and bread have felt stuck behind his breastbone, and in the past few weeks soft foods have also become hard to swallow. He has lost 15 lb. He has had heartburn for many years treated with antacids.","qs":[{"n":613,"t":"mc","visit":"Visit 1","s":"Which feature of his dysphagia **most** suggests a mechanical obstruction such as a tumor?","opts":["Coughing and choking as soon as he swallows","Trouble with solids and liquids from the start","Food coming back undigested days after meals","Progressive trouble with solids, then soft foods"],"correctIdx":[3],"answer":"D","c":"Esophageal dysphagia that starts with solids and progresses to softer foods and liquids suggests a mechanical obstruction, such as cancer or a peptic stricture; rapid progression with weight loss strongly suggests malignancy. Dysphagia to both solids and liquids from the start suggests a motility disorder such as achalasia. Coughing and choking on swallowing suggest oropharyngeal dysphagia, and regurgitating old food suggests a Zenker diverticulum."},{"n":614,"t":"mc","visit":"Visit 1 (continued)","s":"What is the **most appropriate** next test?","opts":["A chest x-ray and recheck later","Upper endoscopy with biopsy","Esophageal manometry first","A trial of a PPI for 3 months"],"correctIdx":[1],"answer":"B","c":"Progressive dysphagia with weight loss is an alarm feature requiring prompt upper endoscopy (EGD) with biopsy. Endoscopy also identifies strictures, Barrett esophagus and esophagitis. A barium swallow may be helpful in some cases, but empiric PPI therapy should not delay endoscopy, and manometry is for suspected motility disorders after endoscopy."},{"n":615,"t":"sata","visit":"Visit 2 (results)","s":"Which are **risk factors** for esophageal cancer? **Select all that apply.**","opts":["Regular moderate exercise","Low-dose aspirin use","Smoking","Long-standing GERD with Barrett esophagus","Heavy alcohol use"],"correctIdx":[2,3,4],"answer":"C, D, E","c":"Squamous cell carcinoma of the esophagus is strongly associated with smoking and alcohol use. Adenocarcinoma, now more common in Western countries, is associated with chronic GERD, Barrett esophagus, obesity and smoking, and usually arises in the distal esophagus. Patients with Barrett esophagus need endoscopic surveillance."}]},{"no":206,"batch":9,"title":"Mr. Tanaka: Thick, Yellow Toenails","setting":"Primary care clinic • Older adult • Dermatology","scenario":"Mr. Tanaka is a 70-year-old man with type 2 diabetes and peripheral neuropathy. Several toenails have become thick, yellow-brown, crumbly and lifted from the nail bed over 2 years. They are hard to trim and press on his shoes. He has scaling between his toes. He takes metformin and atorvastatin. His liver tests are normal.","qs":[{"n":616,"t":"mc","visit":"Visit 1","s":"What should be done **before** starting oral antifungal therapy?","opts":["Remove all of the toenails surgically first","Confirm the infection with KOH, culture or PCR","Order an MRI of both feet before treatment","Start treatment based on appearance alone"],"correctIdx":[1],"answer":"B","c":"Onychomycosis is usually caused by dermatophytes such as Trichophyton rubrum, but psoriasis, trauma and other conditions can look similar. Because oral therapy is long and has side effects, the diagnosis should be confirmed with KOH microscopy, fungal culture, PCR or nail clipping histology (PAS stain) before treatment."},{"n":617,"t":"mc","visit":"Visit 2 (results positive)","s":"Which oral medication is **most effective** for dermatophyte toenail onychomycosis?","opts":["Fluconazole for 3 days","Griseofulvin for 1 week","Terbinafine for 12 weeks","Nystatin for 2 weeks"],"correctIdx":[2],"answer":"C","c":"Oral terbinafine for 12 weeks (6 weeks for fingernails) is the most effective treatment for dermatophyte onychomycosis. Baseline liver function tests are recommended, and patients should report symptoms of liver injury, taste or smell changes, or depressed mood. Itraconazole is an alternative but has more drug interactions. Topical efinaconazole or ciclopirox are options for mild disease. Nails take 12–18 months to grow out."},{"n":618,"t":"sata","visit":"Visit 2 (continued)","s":"Why is treating his toenail infection **important** given his diabetes? **Select all that apply.**","opts":["It will lower his A1c level substantially","Neuropathy may hide injuries from thick nails","It will cure his peripheral neuropathy","Thick nails can injure the skin and cause ulcers","Skin breaks can lead to cellulitis"],"correctIdx":[1,3,4],"answer":"B, D, E","c":"In people with diabetes, thick dystrophic nails can cause pressure, ulceration and skin breakdown, and fungal infection with interdigital tinea can provide an entry point for bacterial cellulitis. Neuropathy reduces protective sensation, so injuries go unnoticed. Regular foot examinations, podiatry for nail care and proper footwear are important. Treatment does not cure neuropathy or lower A1c."}]},{"no":207,"batch":9,"title":"Mrs. Holloway: Ten Years on a PPI","setting":"Annual wellness visit • Older adult • Pharmacology / Gastrointestinal","scenario":"Mrs. Holloway is a 76-year-old woman who has taken omeprazole 40 mg daily for 10 years since a bout of heartburn after a stressful move. She has had no heartburn for years. She has no history of Barrett esophagus, GI bleeding or ulcers, and she does not take NSAIDs or anticoagulants. She has osteopenia and had a C. difficile infection last year.","qs":[{"n":619,"t":"sata","visit":"Visit 1","s":"Which risks are **associated** with long-term PPI use? **Select all that apply.**","opts":["Improved calcium absorption","Fractures","Vitamin B12 and magnesium deficiency","Clostridioides difficile infection","Lower risk of pneumonia"],"correctIdx":[1,2,3],"answer":"B, C, D","c":"Long-term PPI use is associated with C. difficile infection, community-acquired pneumonia, hip and spine fractures, vitamin B12, iron and magnesium deficiency, and possibly chronic kidney disease. The Beers Criteria advise avoiding PPIs for more than 8 weeks in older adults unless there is a clear indication, such as Barrett esophagus, severe erosive esophagitis, GI bleeding risk or chronic NSAID use. PPIs reduce, not improve, calcium carbonate absorption."},{"n":620,"t":"mc","visit":"Visit 1 (continued)","s":"What is the **most appropriate** plan for her omeprazole?","opts":["Continue it indefinitely at the current dose","Double the dose to protect her stomach better","Deprescribe by tapering, with as-needed rescue","Stop it suddenly today with no follow-up plan"],"correctIdx":[2],"answer":"C","c":"She has no ongoing indication, so the PPI should be deprescribed. Tapering (halving the dose or taking it every other day for 2–4 weeks) or stepping down to an H2 blocker reduces rebound acid hypersecretion, which can cause temporary heartburn after abrupt stopping. On-demand antacids or H2 blockers can be used for occasional symptoms."},{"n":621,"t":"mc","visit":"Visit 1 (continued)","s":"Which patient **should** continue long-term PPI therapy?","opts":["A patient taking acetaminophen only","A patient who had nausea last month","A patient with one heartburn episode","A patient with Barrett esophagus"],"correctIdx":[3],"answer":"D","c":"Indications for long-term PPI therapy include Barrett esophagus, severe erosive esophagitis, a history of bleeding ulcers, ongoing need for gastroprotection with NSAIDs, antiplatelets or anticoagulants in high-risk patients, and Zollinger–Ellison syndrome. Occasional heartburn or nausea is not an indication for long-term therapy."}]},{"no":208,"batch":9,"title":"Mr. Okonjo: Visiting Family in Lagos","setting":"Travel clinic • Middle adult • Infectious disease / Health promotion","scenario":"Mr. Okonjo is a 54-year-old man who moved to the United States 20 years ago and is traveling to Lagos, Nigeria, for 3 weeks to visit relatives. He plans to stay in homes in the city and in a rural village. He has not taken malaria prevention before because he grew up there and \"never got sick.\" He has hypertension and takes amlodipine.","qs":[{"n":622,"t":"mc","visit":"Visit 1","s":"What should the FNP explain about his **malaria risk**?","opts":["Prevention is needed only in the dry season","His immunity has faded, so he is at high risk","He is immune because he grew up in Nigeria","Malaria is not present in cities like Lagos"],"correctIdx":[1],"answer":"B","c":"People who grew up in malaria-endemic regions lose partial immunity after living elsewhere for some time. Travelers visiting friends and relatives are at the highest risk of malaria because they often stay longer, visit rural areas, and are less likely to take prophylaxis. Nigeria has year-round transmission of Plasmodium falciparum, including in urban areas."},{"n":623,"t":"mc","visit":"Visit 1 (continued)","s":"Which malaria prophylaxis is **appropriate** for travel to Nigeria?","opts":["Atovaquone–proguanil daily during and 7 days after","Primaquine alone for 1 day before the trip","Chloroquine weekly because it works everywhere","No drug, only insect repellent at night"],"correctIdx":[0],"answer":"A","c":"For areas with chloroquine-resistant P. falciparum such as Nigeria, recommended options include atovaquone–proguanil (start 1–2 days before, daily during, and for 7 days after travel), doxycycline (daily, continued 4 weeks after) or mefloquine (weekly). Chloroquine is ineffective because of resistance. Bite prevention with DEET repellent, long sleeves and insecticide-treated nets is also essential."},{"n":624,"t":"sata","visit":"Visit 1 (continued)","s":"Which other recommendations apply to his trip? **Select all that apply.**","opts":["Yellow fever vaccine at least 10 days before travel","Drink tap water freely in rural areas","Malaria cannot occur once he returns home","Typhoid vaccine and safe food and water practices","Seek care for any fever within a year of return"],"correctIdx":[0,3,4],"answer":"A, D, E","c":"Nigeria requires proof of yellow fever vaccination, which must be given at least 10 days before arrival. Typhoid vaccination, hepatitis A vaccination and food and water precautions are recommended. Malaria can appear weeks to months after return, so any fever within a year of travel should prompt immediate care and the traveler should mention the trip; falciparum malaria can be fatal within days."}]},{"no":209,"batch":9,"title":"Mr. Weber: Bright Red Blood on the Paper","setting":"Primary care clinic • Middle adult • Gastrointestinal","scenario":"Mr. Weber is a 47-year-old man who sits at a desk all day and strains during bowel movements. For a month he has seen bright red blood on the toilet paper and dripping into the toilet after bowel movements, with mild itching but no pain. He has no weight loss or change in bowel habits. His father had colon cancer at 58. Anoscopy shows enlarged internal hemorrhoids that bulge out with straining and return on their own.","qs":[{"n":625,"t":"mc","visit":"Visit 1","s":"What **grade** are his internal hemorrhoids?","opts":["Grade IV","Grade I","Grade III","Grade II"],"correctIdx":[3],"answer":"D","c":"Internal hemorrhoids are graded by prolapse: grade I bleed but do not prolapse; grade II prolapse with straining and reduce spontaneously; grade III prolapse and need manual reduction; grade IV are prolapsed and cannot be reduced. Internal hemorrhoids arise above the dentate line and are usually painless, while external hemorrhoids are below it and painful when thrombosed."},{"n":626,"t":"mc","visit":"Visit 1 (continued)","s":"What is the **first-line** management of his hemorrhoids?","opts":["Long-term topical steroid cream daily","High-fiber diet, fluids and avoiding straining","Oral antibiotics for 10 days or more","Immediate surgical hemorrhoidectomy"],"correctIdx":[1],"answer":"B","c":"First-line treatment for hemorrhoids is increased dietary fiber (25–35 g/day) or fiber supplements, adequate fluids, avoiding straining and prolonged sitting on the toilet, and sitz baths. Office procedures such as rubber band ligation are used for persistent grade I–III internal hemorrhoids, and surgery for grade III–IV or failed treatment. Topical steroids should be limited to short courses."},{"n":627,"t":"mc","visit":"Visit 1 (continued)","s":"Given his family history, what else is **needed** for his rectal bleeding?","opts":["Nothing more, since hemorrhoids explain it","A colonoscopy to exclude colorectal neoplasia","A CT scan of the pelvis in 5 years","A fecal occult blood test next year only"],"correctIdx":[1],"answer":"B","c":"Rectal bleeding should not be attributed to hemorrhoids without considering other causes. With a first-degree relative diagnosed with colorectal cancer before 60, he should have had colonoscopy screening beginning at 40 (or 10 years before the relative's diagnosis) every 5 years, and rectal bleeding at his age warrants colonoscopy now. Stool-based tests are not appropriate for evaluating visible bleeding."}]},{"no":210,"batch":9,"title":"Ms. Carvalho: Spells of Pounding Headache","setting":"Primary care clinic • Middle adult • Endocrine / Cardiovascular","scenario":"Ms. Carvalho is a 45-year-old woman with episodes over the past 6 months of severe pounding headache, heavy sweating, palpitations, tremor and pallor lasting 15–30 minutes. During one episode her BP was 220/120. Between episodes her BP is 150/95. She has lost weight and her fasting glucose is 118 mg/dL. Plasma free metanephrines are markedly elevated, and CT shows a 4-cm left adrenal mass.","qs":[{"n":628,"t":"mc","visit":"Visit 1","s":"What is the **most likely** diagnosis?","opts":["Panic disorder","Carcinoid syndrome","Pheochromocytoma","Hyperthyroidism"],"correctIdx":[2],"answer":"C","c":"Pheochromocytoma is a catecholamine-secreting tumor of the adrenal medulla. The classic triad is episodic headache, sweating and palpitations (tachycardia), with paroxysmal or sustained hypertension, pallor, tremor, anxiety, weight loss and hyperglycemia. Plasma free metanephrines (or 24-hour urine fractionated metanephrines) are the best initial test, followed by imaging. Some cases are hereditary (MEN2, VHL, NF1)."},{"n":629,"t":"ord","visit":"Visit 1 (continued)","s":"**Place the steps of preparing her for surgery in the correct order.**","items":["Step 1","Step 2","Step 3","Step 4"],"tgts":["Add a beta-blocker once alpha-blockade is established","Liberalize salt and fluid intake to expand blood volume","Start an alpha-blocker such as phenoxybenzamine or doxazosin","Proceed to laparoscopic adrenalectomy"],"map":[2,1,0,3],"answer":"C, B, A, D","c":"Before surgery, alpha-adrenergic blockade is started 1–2 weeks in advance to control BP and prevent a hypertensive crisis. A high-salt diet and fluids restore the contracted blood volume and reduce postoperative hypotension. A beta-blocker is added only after adequate alpha-blockade to control tachycardia. Starting a beta-blocker first can cause unopposed alpha stimulation and a dangerous rise in BP. Surgical removal is then performed."},{"n":630,"t":"mc","visit":"Visit 2 (after surgery)","s":"Which follow-up is **recommended** after her surgery?","opts":["Genetic testing and lifelong metanephrine checks","No follow-up because the tumor was removed","Lifelong daily beta-blocker therapy for all","A repeat CT scan every month for life"],"correctIdx":[0],"answer":"A","c":"Genetic testing is recommended for all patients with pheochromocytoma or paraganglioma because up to 40% have a germline mutation. Plasma or urine metanephrines are checked a few weeks after surgery and then yearly for life, because recurrence or metastasis can occur years later."}]},{"no":211,"batch":9,"title":"Mrs. Byrne: Tanned in Winter","setting":"Primary care clinic • Middle adult • Endocrine","scenario":"Mrs. Byrne is a 46-year-old woman with Hashimoto thyroiditis who has had 4 months of fatigue, weakness, nausea, abdominal pain, salt craving, light-headedness on standing and a 12-lb weight loss. Her skin looks darker, especially in her palm creases and gums, although it is winter. BP is 92/58 lying down. Sodium is 129 mEq/L, potassium 5.6 mEq/L and glucose 68 mg/dL.","qs":[{"n":631,"t":"mc","visit":"Visit 1","s":"What is the **most likely** diagnosis?","opts":["Primary adrenal insufficiency (Addison disease)","Secondary adrenal insufficiency from the pituitary","Cushing syndrome from an adrenal adenoma","Primary hyperaldosteronism with low renin"],"correctIdx":[0],"answer":"A","c":"Primary adrenal insufficiency (Addison disease), most often autoimmune in high-income countries, causes deficiency of cortisol and aldosterone. Features include fatigue, weight loss, GI symptoms, salt craving, orthostatic hypotension, hyponatremia, hyperkalemia, hy

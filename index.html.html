nd cardiology evaluation are complete. Murmur grade does not determine safety."},{"n":63,"t":"mc","visit":"Visit 2 (6 months later)","s":"Daniel's cardiac work-up was normal. He now has fever, exudative pharyngitis, posterior cervical lymphadenopathy, fatigue and a palpable spleen. A Monospot test is positive. What is the **most important** advice?","opts":["Start amoxicillin to treat the infection","Return to basketball once the fever ends","Avoid contact sports for at least 3–4 weeks","Take a 10-day course of oral prednisone"],"correctIdx":[2],"answer":"C","c":"Infectious mononucleosis causes splenomegaly in about half of patients, and splenic rupture is most likely in the first weeks. Patients avoid contact sports and heavy lifting for at least 3–4 weeks and longer if the spleen remains enlarged. Treatment is supportive. Amoxicillin causes a rash in most patients with mono, and steroids are reserved for airway obstruction or severe hematologic complications."}]},{"no":22,"batch":1,"title":"Mateo: Fever and Ear Pulling","setting":"Primary care clinic • Toddler • HEENT / Infectious disease","scenario":"Mateo is an 18-month-old with 2 days of fever up to 39.2 °C, irritability and tugging at his left ear. He attends daycare and has had no antibiotics in the past 3 months. Otoscopy shows a red, moderately bulging left tympanic membrane with poor mobility; the right ear is normal. He has no drug allergies.","qs":[{"n":64,"t":"mc","visit":"Visit 1","s":"What is the **most appropriate** treatment for Mateo?","opts":["Azithromycin for 5 days as first choice","Observation without antibiotics for 1 week","Ciprofloxacin–dexamethasone ear drops","High-dose amoxicillin for 10 days"],"correctIdx":[3],"answer":"D","c":"Mateo has acute otitis media (a bulging tympanic membrane) with severe features (temperature ≥ 39 °C). At 6–23 months, AAP recommends antibiotics for severe or bilateral AOM. High-dose amoxicillin (80–90 mg/kg/day) is first-line, and children under 2 are treated for 10 days. Azithromycin has poor coverage of the usual pathogens, and ear drops treat otitis externa or otorrhea through tubes."},{"n":65,"t":"mc","visit":"Visit 2 (3 days later)","s":"After 72 hours of amoxicillin, Mateo still has a fever of 39 °C and a bulging tympanic membrane. What is the **next step**?","opts":["Refer him today for tympanostomy tubes","Continue amoxicillin for 7 more days","Switch to amoxicillin–clavulanate","Add an oral decongestant for drainage"],"correctIdx":[2],"answer":"C","c":"When AOM fails to improve after 48–72 hours of amoxicillin, the likely cause is a beta-lactamase–producing organism such as non-typeable H. influenzae or Moraxella catarrhalis. Treatment is switched to high-dose amoxicillin–clavulanate, and IM ceftriaxone is the next option if that also fails. Decongestants are not recommended for children, and tubes are not used for a single episode."},{"n":66,"t":"sata","visit":"Visit 3 (6 weeks later)","s":"Mateo is well, but the left tympanic membrane is dull and retracted with an air–fluid level and no signs of acute infection. What is **appropriate** management? **Select all that apply.**","opts":["Another 10-day course of antibiotics now","Daily oral corticosteroids for 2 weeks","Recheck the ear at follow-up","Watchful waiting for up to 3 months","Hearing evaluation if fluid persists 3 months"],"correctIdx":[2,3,4],"answer":"C, D, E","c":"This is otitis media with effusion, which commonly follows AOM and resolves on its own in most children within 3 months. Management is watchful waiting with re-examination; antibiotics, steroids, antihistamines and decongestants are not recommended. If the effusion lasts 3 months or more, a hearing evaluation is done, and tubes are considered for persistent bilateral effusion with hearing loss or speech delay."}]},{"no":23,"batch":1,"title":"Baby Sofia: Fever at Three Weeks Old","setting":"Primary care clinic • Newborn / Infant • Infectious disease","scenario":"Sofia is a 21-day-old full-term infant whose mother reports she has felt warm and has been feeding less for 12 hours. Her rectal temperature in the clinic is 38.3 °C. She is sleepy but rouses, has a normal fontanelle and has no obvious source of infection. Pregnancy and delivery were uncomplicated.","qs":[{"n":67,"t":"mc","visit":"Visit 1","s":"What is the **most appropriate** next step for Sofia?","opts":["Order a urinalysis and send her home today","Give acetaminophen and recheck in 24 hours","Prescribe oral amoxicillin and see her daily","Immediate transfer for a full sepsis work-up"],"correctIdx":[3],"answer":"D","c":"Any infant 28 days old or younger with a temperature of 38.0 °C or higher needs a full sepsis evaluation (CBC, blood culture, catheterized urinalysis and culture, and lumbar puncture) and admission for empiric IV antibiotics, even when well-appearing. Young infants cannot localize infection and can deteriorate rapidly. Antipyretics or oral antibiotics at home would delay diagnosis of bacteremia or meningitis."},{"n":68,"t":"sata","visit":"Visit 1 (continued)","s":"Which organisms are **common causes** of serious bacterial infection in infants under 1 month? **Select all that apply.**","opts":["Escherichia coli","Mycoplasma pneumoniae","Listeria monocytogenes","Group B Streptococcus","Group A Streptococcus pharyngitis"],"correctIdx":[0,2,3],"answer":"A, C, D","c":"In the first month of life, the major bacterial pathogens are acquired from the maternal genital tract: group B Streptococcus, E. coli and other gram-negative rods, and, less commonly, Listeria monocytogenes. Empiric IV therapy covers these organisms. Mycoplasma and group A strep pharyngitis are infections of older children."},{"n":69,"t":"mc","visit":"Visit 2 (2 weeks later)","s":"Sofia was treated for a urinary tract infection and is well. Which follow-up study is **recommended** after a first febrile UTI in an infant?","opts":["CT scan of the abdomen and pelvis","No imaging is ever needed in infants","Repeat lumbar puncture in one month","Renal and bladder ultrasound"],"correctIdx":[3],"answer":"D","c":"After a first febrile UTI in an infant or young child, the AAP recommends a renal and bladder ultrasound to look for structural anomalies, hydronephrosis or signs of reflux. A voiding cystourethrogram is reserved for abnormal ultrasound findings or recurrent febrile UTIs. CT exposes the child to radiation without added benefit."}]},{"no":24,"batch":1,"title":"Jamal: Belly Pain That Moved","setting":"Urgent visit • School-age child • Gastrointestinal","scenario":"Jamal is a 9-year-old boy with 14 hours of abdominal pain that began around his umbilicus and has moved to the right lower abdomen. He has lost his appetite and vomited twice after the pain began. Temperature is 38.1 °C. He walks bent forward and winces when he hops.","qs":[{"n":70,"t":"hot","visit":"Visit 1","s":"The FNP suspects acute appendicitis. **Click the location of McBurney point.**","answer":"D","c":"McBurney point lies one-third of the way from the right anterior superior iliac spine to the umbilicus in the right lower quadrant. Maximal tenderness here is a classic sign of appendicitis. Pain that begins periumbilically (visceral pain) and migrates to the RLQ as the parietal peritoneum becomes inflamed, with anorexia and vomiting after pain onset, is the typical sequence.","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 400 320\" width=\"100%\" height=\"auto\"><rect width=\"400\" height=\"320\" fill=\"none\"/><path d=\"M 90 30 Q 200 10 310 30 Q 330 160 310 300 L 90 300 Q 70 160 90 30 Z\" fill=\"var(--skin)\" stroke=\"var(--diagram-ink)\" stroke-width=\"2.5\"/>\n<path d=\"M 90 70 Q 200 120 310 70\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-width=\"2\" stroke-opacity=\"0.5\"/>\n<line x1=\"200\" y1=\"40\" x2=\"200\" y2=\"296\" stroke=\"var(--diagram-ink)\" stroke-width=\"1.5\" stroke-dasharray=\"6 5\" stroke-opacity=\"0.55\"/>\n<line x1=\"84\" y1=\"170\" x2=\"316\" y2=\"170\" stroke=\"var(--diagram-ink)\" stroke-width=\"1.5\" stroke-dasharray=\"6 5\" stroke-opacity=\"0.55\"/>\n<circle cx=\"200\" cy=\"170\" r=\"6\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-width=\"2\"/>\n<path d=\"M 108 262 Q 150 285 196 296\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-width=\"2\" stroke-opacity=\"0.5\"/>\n<path d=\"M 292 262 Q 250 285 204 296\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-width=\"2\" stroke-opacity=\"0.5\"/>\n<text x=\"40\" y=\"20\" font-family=\"Arial, sans-serif\" font-size=\"12\" font-weight=\"700\" fill=\"var(--diagram-ink)\" text-anchor=\"start\">Patient's RIGHT</text><text x=\"268\" y=\"20\" font-family=\"Arial, sans-serif\" font-size=\"12\" font-weight=\"700\" fill=\"var(--diagram-ink)\" text-anchor=\"start\">Patient's LEFT</text><text x=\"206\" y=\"186\" font-family=\"Arial, sans-serif\" font-size=\"10\" font-weight=\"400\" fill=\"var(--diagram-ink)\" text-anchor=\"start\">umbilicus</text><g class=\"zone\" data-id=\"A\" tabindex=\"0\" role=\"button\" aria-label=\"Area A\">\n<circle cx=\"140\" cy=\"112\" r=\"15\" fill=\"var(--zone-fill)\" stroke=\"var(--zone-ink)\" stroke-width=\"2.5\"/>\n<text x=\"140\" y=\"117.5\" text-anchor=\"middle\" font-family=\"Georgia, 'Times New Roman', serif\" font-size=\"16\" font-weight=\"700\" fill=\"var(--zone-ink)\">A</text></g><g class=\"zone\" data-id=\"B\" tabindex=\"0\" role=\"button\" aria-label=\"Area B\">\n<circle cx=\"200\" cy=\"92\" r=\"15\" fill=\"var(--zone-fill)\" stroke=\"var(--zone-ink)\" stroke-width=\"2.5\"/>\n<text x=\"200\" y=\"97.5\" text-anchor=\"middle\" font-family=\"Georgia, 'Times New Roman', serif\" font-size=\"16\" font-weight=\"700\" fill=\"var(--zone-ink)\">B</text></g><g class=\"zone\" data-id=\"C\" tabindex=\"0\" role=\"button\" aria-label=\"Area C\">\n<circle cx=\"168\" cy=\"150\" r=\"15\" fill=\"var(--zone-fill)\" stroke=\"var(--zone-ink)\" stroke-width=\"2.5\"/>\n<text x=\"168\" y=\"155.5\" text-anchor=\"middle\" font-family=\"Georgia, 'Times New Roman', serif\" font-size=\"16\" font-weight=\"700\" fill=\"var(--zone-ink)\">C</text></g><g class=\"zone\" data-id=\"D\" tabindex=\"0\" role=\"button\" aria-label=\"Area D\">\n<circle cx=\"146\" cy=\"232\" r=\"15\" fill=\"var(--zone-fill)\" stroke=\"var(--zone-ink)\" stroke-width=\"2.5\"/>\n<text x=\"146\" y=\"237.5\" text-anchor=\"middle\" font-family=\"Georgia, 'Times New Roman', serif\" font-size=\"16\" font-weight=\"700\" fill=\"var(--zone-ink)\">D</text></g><g class=\"zone\" data-id=\"E\" tabindex=\"0\" role=\"button\" aria-label=\"Area E\">\n<circle cx=\"264\" cy=\"228\" r=\"15\" fill=\"var(--zone-fill)\" stroke=\"var(--zone-ink)\" stroke-width=\"2.5\"/>\n<text x=\"264\" y=\"233.5\" text-anchor=\"middle\" font-family=\"Georgia, 'Times New Roman', serif\" font-size=\"16\" font-weight=\"700\" fill=\"var(--zone-ink)\">E</text></g></svg>"},{"n":71,"t":"sata","visit":"Visit 1 (continued)","s":"Which examination findings would **support** appendicitis? **Select all that apply.**","opts":["Inspiratory arrest with RUQ palpation","RLQ pain when the LLQ is pressed (Rovsing sign)","Pain with right hip extension (psoas sign)","Flank bruising (Grey Turner sign)","Pain with internal rotation of the flexed right hip"],"correctIdx":[1,2,4],"answer":"B, C, E","c":"The Rovsing sign (RLQ pain when the LLQ is pressed), the psoas sign (retrocecal appendix) and the obturator sign (pelvic appendix) all support appendicitis, as do rebound tenderness and pain with hopping. The Murphy sign (inspiratory arrest with RUQ palpation) suggests cholecystitis, and Grey Turner sign suggests retroperitoneal hemorrhage such as hemorrhagic pancreatitis."},{"n":72,"t":"mc","visit":"Visit 1 (continued)","s":"Which imaging study is **preferred first** for suspected appendicitis in Jamal?","opts":["CT scan with IV contrast","Abdominal ultrasound","MRI of the abdomen","Plain abdominal x-ray"],"correctIdx":[1],"answer":"B","c":"In children, ultrasound is the first-line imaging study for suspected appendicitis because it avoids ionizing radiation and is accurate in experienced hands. CT is used in adults or when ultrasound is non-diagnostic, and MRI is preferred in pregnancy when ultrasound is inconclusive. Plain films have little diagnostic value. Surgical consultation should not be delayed for imaging when the diagnosis is clear."}]},{"no":25,"batch":1,"title":"Baby Kwame: Yellow Skin on Day One","setting":"Newborn visit • Newborn • Hematology / Gastrointestinal","scenario":"Kwame is an 18-hour-old full-term newborn being breastfed. The nurse notes yellow skin on his face and chest. His mother is blood type O, Rh-positive, and Kwame is type A. He is feeding every 3 hours and has had one wet diaper and one meconium stool. He is active and well-appearing.","qs":[{"n":73,"t":"mc","visit":"Hospital day 1","s":"Why is Kwame's jaundice **concerning**?","opts":["Jaundice is only concerning after 2 weeks","Facial jaundice always means a high level","Breastfed infants never develop jaundice","Jaundice in the first 24 hours is pathologic"],"correctIdx":[3],"answer":"D","c":"Physiologic jaundice appears after 24 hours and peaks on days 3–5. Jaundice within the first 24 hours is pathologic until proven otherwise and is most often due to hemolysis. Kwame's ABO incompatibility (type O mother, type A infant) is a classic cause. A total serum bilirubin is measured and plotted on the AAP nomogram by hours of life and risk factors to guide phototherapy."},{"n":74,"t":"sata","visit":"Hospital day 1 (continued)","s":"Which tests help evaluate the cause of Kwame's early jaundice? **Select all that apply.**","opts":["Direct antiglobulin (Coombs) test","Hemoglobin and reticulocyte count","Serum lipase","Head ultrasound","Total serum bilirubin"],"correctIdx":[0,1,4],"answer":"A, B, E","c":"Early jaundice is evaluated with a total serum bilirubin (and direct fraction), a direct antiglobulin (Coombs) test to detect antibody-mediated hemolysis such as ABO or Rh disease, and hemoglobin with reticulocyte count to assess hemolysis. G6PD testing is added when indicated. Lipase and head ultrasound do not assess the cause of hyperbilirubinemia."},{"n":75,"t":"mc","visit":"Visit at 2 weeks","s":"Kwame was treated with phototherapy and is now 2 weeks old, feeding well and gaining weight. His mother notices that his stools have become pale clay-colored and his urine is dark. What should the FNP do?","opts":["Switch him to a soy-based infant formula","Reassure her that this is breast milk jaundice","Advise placing him in indirect sunlight daily","Order a direct (conjugated) bilirubin urgently"],"correctIdx":[3],"answer":"D","c":"Pale (acholic) stools and dark urine in an infant with jaundice suggest conjugated hyperbilirubinemia and possible biliary atresia. A direct bilirubin above 1 mg/dL is always abnormal and needs urgent evaluation, because the Kasai procedure has the best outcome when performed before about 60 days of age. Breast milk jaundice is unconjugated with normal stool color."}]},{"no":26,"batch":2,"title":"Mr. Sato: A Tremor at Rest","setting":"Primary care clinic • Older adult • Neurology","scenario":"Mr. Sato is a 70-year-old man whose wife noticed a tremor in his right hand when it rests in his lap. Over a year he has become slower, his handwriting has become small, and his face looks less expressive. On examination he has a 4-Hz pill-rolling tremor of the right hand that lessens when he reaches for an object, cogwheel rigidity of the right wrist, and a shuffling gait with reduced arm swing. He has had constipation and has lost his sense of smell.","qs":[{"n":76,"t":"mc","visit":"Visit 1","s":"Which feature is **required** for the clinical diagnosis of Parkinson disease?","opts":["Bradykinesia, meaning slowness of movement","A family history of Parkinson disease","Postural instability with frequent falls","An abnormal finding on a brain MRI"],"correctIdx":[0],"answer":"A","c":"Parkinson disease is a clinical diagnosis. Bradykinesia is required, plus resting tremor or rigidity (the TRAP features: Tremor, Rigidity, Akinesia/bradykinesia, Postural instability). Postural instability appears late, most patients have no family history, and routine MRI is normal; a good response to levodopa supports the diagnosis."},{"n":77,"t":"mc","visit":"Visit 1 (continued)","s":"Mr. Sato's symptoms now limit his daily activities. Which medication is the **most effective** for his motor symptoms?","opts":["Primidone, an anticonvulsant drug","Propranolol, a beta-adrenergic blocker","Haloperidol, a dopamine antagonist","Carbidopa–levodopa, a dopamine precursor"],"correctIdx":[3],"answer":"D","c":"Carbidopa–levodopa is the most effective symptomatic treatment for the motor features of Parkinson disease. Carbidopa blocks peripheral conversion of levodopa, reducing nausea. Long-term use can cause motor fluctuations (\"wearing off\") and dyskinesias. Propranolol and primidone treat essential tremor, and haloperidol, a dopamine blocker, worsens parkinsonism."},{"n":78,"t":"sata","visit":"Visit 2 (4 months later)","s":"Mr. Sato develops nausea. Which medications should the FNP **avoid** because they can worsen his Parkinson disease? **Select all that apply.**","opts":["Domperidone-free ginger tea","Metoclopramide","Prochlorperazine","Ondansetron","Haloperidol"],"correctIdx":[1,2,4],"answer":"B, C, E","c":"Metoclopramide, prochlorperazine and haloperidol block central dopamine D2 receptors and can markedly worsen parkinsonism. Ondansetron, a serotonin 5-HT3 antagonist, does not block dopamine and is a safer antiemetic in Parkinson disease. For psychosis, quetiapine, clozapine or pimavanserin are used instead of typical antipsychotics."}]},{"no":27,"batch":2,"title":"Mrs. Abubakar: Declining Kidney Function","setting":"Primary care clinic • Older adult • Renal / Endocrine","scenario":"Mrs. Abubakar is a 73-year-old woman with type 2 diabetes and hypertension. Over 6 months her eGFR has been 38–41 mL/min/1.73 m² on three occasions, and her urine albumin-to-creatinine ratio is 420 mg/g. She takes metformin 1,000 mg twice daily, losartan 100 mg daily, amlodipine and over-the-counter naproxen for knee pain. Potassium is 4.6 mEq/L.","qs":[{"n":79,"t":"mc","visit":"Visit 1","s":"How should the FNP **classify** Mrs. Abubakar's kidney disease?","opts":["CKD stage G2 with mildly increased albuminuria","CKD stage G3b with severely increased albuminuria (A3)","Normal kidney function for a woman of her age","Acute kidney injury that needs emergency referral"],"correctIdx":[1],"answer":"B","c":"CKD is defined by reduced eGFR (< 60) or kidney damage such as albuminuria lasting more than 3 months. An eGFR of 30–44 is stage G3b, and a UACR above 300 mg/g is category A3 (severely increased). Stable values over 6 months indicate chronic, not acute, disease. Albuminuria is never a normal part of aging."},{"n":80,"t":"sata","visit":"Visit 1 (continued)","s":"Which changes to Mrs. Abubakar's regimen are **appropriate**? **Select all that apply.**","opts":["Stop losartan because her eGFR is below 60","Add a second ARB to lower albuminuria further","Stop the over-the-counter naproxen","Reduce the metformin dose to a lower maximum","Add an SGLT2 inhibitor such as empagliflozin"],"correctIdx":[2,3,4],"answer":"C, D, E","c":"SGLT2 inhibitors slow CKD progression and reduce cardiovascular events in patients with eGFR ≥ 20, with or without diabetes. NSAIDs are nephrotoxic and should be avoided in CKD. Metformin is continued at a reduced dose (generally a maximum of 1,000 mg daily) when eGFR is 30–45 and stopped below 30. ARBs are continued at the maximum tolerated dose for albuminuria, and dual RAS blockade is harmful."},{"n":81,"t":"mc","visit":"Visit 2 (3 months later)","s":"Mrs. Abubakar has a stomach virus with vomiting and diarrhea and cannot keep fluids down. Which \"sick-day\" advice is **correct**?","opts":["Temporarily hold losartan, metformin and the SGLT2 inhibitor","Continue every medication exactly as prescribed for now","Double her losartan dose until the vomiting settles down","Take naproxen regularly to control the abdominal cramps"],"correctIdx":[0],"answer":"A","c":"During dehydrating illness, ACE inhibitors/ARBs, diuretics, NSAIDs, metformin and SGLT2 inhibitors are temporarily held because they raise the risk of acute kidney injury, lactic acidosis or euglycemic ketoacidosis. They are restarted 24–48 hours after she is eating and drinking normally. She should seek care if she cannot maintain fluids."}]},{"no":28,"batch":2,"title":"Mr. Gallagher: Two Falls This Year","setting":"Primary care clinic • Older adult • Geriatric syndromes","scenario":"Mr. Gallagher is an 81-year-old man who has fallen twice in 6 months, once when getting out of bed at night. He takes doxazosin 4 mg for hypertension and BPH, lorazepam 1 mg at bedtime for sleep, and hydrochlorothiazide. Lying BP is 136/80 with HR 72; after 3 minutes of standing, BP is 112/70 with HR 78 and he feels light-headed. His Timed Up and Go test takes 16 seconds.","qs":[{"n":82,"t":"mc","visit":"Visit 1","s":"How should the FNP **interpret** Mr. Gallagher's standing blood pressure?","opts":["The test must be repeated lying down","Orthostatic hypotension is present","White-coat hypertension is present","A normal postural change for his age"],"correctIdx":[1],"answer":"B","c":"Orthostatic hypotension is a fall in systolic BP of 20 mm Hg or more, or diastolic BP of 10 mm Hg or more, within 3 minutes of standing. His systolic drop of 24 mm Hg with light-headedness meets the definition. It is common in older adults but is never \"normal\" and is a major, treatable fall risk factor, often caused by medications."},{"n":83,"t":"sata","visit":"Visit 1 (continued)","s":"Which interventions will **reduce** Mr. Gallagher's fall risk? **Select all that apply.**","opts":["Review the need for doxazosin and the diuretic","Taper and stop the lorazepam","Advise him to restrict his daily fluid intake","Add zolpidem in place of the lorazepam","Refer to a strength and balance exercise program"],"correctIdx":[0,1,4],"answer":"A, B, E","c":"Benzodiazepines, alpha-blockers used for hypertension and diuretics are high-risk medications for falls in older adults (AGS Beers Criteria), so deprescribing is a key step. Exercise programs with strength and balance training, such as tai chi or physical therapy, carry a USPSTF grade B recommendation. Z-drugs carry the same fall risk as benzodiazepines, and fluid restriction worsens orthostasis."},{"n":84,"t":"mc","visit":"Visit 1 (continued)","s":"What does Mr. Gallagher's Timed Up and Go result of 16 seconds **indicate**?","opts":["Increased risk of falling","A need for a hip x-ray now","Normal mobility for his age","Early dementia is present"],"correctIdx":[0],"answer":"A","c":"In the Timed Up and Go test, the patient rises from a chair, walks 10 feet (3 m), turns, returns and sits. A time of 12 seconds or longer indicates increased fall risk and the need for a full fall-risk assessment (CDC STEADI). It is a mobility test, not a cognitive screen."}]},{"no":29,"batch":2,"title":"Mrs. Rossi: Forgetting More Than Usual","setting":"Primary care clinic • Older adult • Neurocognitive / Ethics","scenario":"Mrs. Rossi is a 79-year-old widow whose son says that over 2 years she has repeated the same questions, missed bill payments and got lost driving to a familiar store. She is alert, attentive and pleasant. Her MoCA score is 18/30 with poor delayed recall. She has hypertension and takes lisinopril.","qs":[{"n":85,"t":"sata","visit":"Visit 1","s":"Which tests help exclude **reversible causes** of Mrs. Rossi's cognitive decline? **Select all that apply.**","opts":["Pulmonary function tests","Brain CT or MRI","Vitamin B12 level","Thyroid-stimulating hormone","Serum amylase level"],"correctIdx":[1,2,3],"answer":"B, C, D","c":"The standard evaluation of dementia excludes treatable contributors: vitamin B12 deficiency, hypothyroidism, depression, medication effects, metabolic disturbances (calcium, sodium, glucose, kidney and liver function) and structural lesions such as subdural hematoma, tumor or normal pressure hydrocephalus on neuroimaging. Amylase and pulmonary function tests are not part of the work-up."},{"n":86,"t":"match","visit":"Visit 1 (continued)","s":"The FNP reviews the main types of dementia with Mrs. Rossi's son. **Drag each type of dementia to its characteristic feature.** One feature will not be used.","items":["Alzheimer disease","Vascular dementia","Lewy body dementia","Frontotemporal dementia"],"tgts":["Early short-term memory loss with gradual decline","Incontinence, magnetic gait and confusion","Early personality change and disinhibition","Visual hallucinations and fluctuating attention","Stepwise decline after strokes"],"map":[0,4,3,2],"answer":"1–A, 2–E, 3–D, 4–C","c":"Alzheimer disease begins with short-term memory loss and progresses gradually, as in Mrs. Rossi. Vascular dementia declines stepwise after strokes, with focal signs. Lewy body dementia causes fluctuating cognition, well-formed visual hallucinations, parkinsonism and severe sensitivity to antipsychotics. Frontotemporal dementia presents earlier (45–65) with personality and behavior change. The unused feature describes normal pressure hydrocephalus (\"wet, wobbly, wacky\")."},{"n":87,"t":"mc","visit":"Visit 2 (1 month later)","s":"Mrs. Rossi is diagnosed with mild Alzheimer disease. She can still understand and discuss her choices. What is the **most important** step to take now?","opts":["Wait to discuss her wishes until she is worse","Ask a court to appoint a guardian right away","Let her son make her medical decisions now","Discuss advance directives and a health-care proxy"],"correctIdx":[3],"answer":"D","c":"Advance care planning should happen early, while the patient still has decision-making capacity, so that she can name a health-care proxy, complete advance directives and express her values. Capacity is decision-specific and she retains it now; a diagnosis of mild dementia does not transfer decisions to family or require guardianship. Driving safety and financial protection should also be addressed."}]},{"no":30,"batch":2,"title":"Mr. Dlamini: Not Himself","setting":"Primary care clinic • Older adult • Respiratory / Infectious disease","scenario":"Mr. Dlamini is an 84-year-old man with heart failure and type 2 diabetes. His daughter says he has been \"not himself\" for 2 days: more confused, eating little, and he fell once. He has a mild cough. Temperature is 37.6 °C, RR 26, BP 118/70, HR 98 and SpO₂ 91% on room air. Crackles are heard at the right base. His BUN is 26 mg/dL.","qs":[{"n":88,"t":"mc","visit":"Visit 1","s":"What does Mr. Dlamini's presentation **best illustrate** about pneumonia in older adults?","opts":["A productive cough is always present","Confusion and falls may be the main signs","Pneumonia rarely causes any confusion","Older adults always have a high fever"],"correctIdx":[1],"answer":"B","c":"Older adults frequently present atypically, with delirium, falls, functional decline or poor intake rather than high fever and productive cough, because of a blunted immune and febrile response. New confusion with tachypnea, low oxygen saturation and focal crackles in an 84-year-old strongly suggests pneumonia and needs prompt chest imaging and evaluation."},{"n":89,"t":"mc","visit":"Visit 1 (continued)","s":"Mr. Dlamini is confused, his BUN is above 19 mg/dL and he is over 65. Based on CURB-65, what is the **most appropriate** site of care?","opts":["Home oxygen with no antibiotics","Hospital admission for inpatient treatment","A follow-up phone call in 3 days","Outpatient oral antibiotics at home"],"correctIdx":[1],"answer":"B","c":"CURB-65 assigns one point each for Confusion, Urea (BUN > 19 mg/dL), Respiratory rate ≥ 30, low Blood pressure and age ≥ 65. Mr. Dlamini has confusion, raised BUN and age, which places him in the group that should be hospitalized (≥ 3, with ICU consideration at 4–5). His hypoxemia and comorbidities also support admission."},{"n":90,"t":"mc","visit":"Visit 2 (after discharge)","s":"Mr. Dlamini recovered. He received PCV13 years ago but no other pneumococcal vaccine. Which plan follows **current** adult guidance?","opts":["Give a live pneumococcal vaccine dose","He needs no further pneumococcal vaccine","Give one dose of PCV20 or PCV21 now","Give PPSV23 every year from now on"],"correctIdx":[2],"answer":"C","c":"Adults 50 and older (and younger adults with risk conditions) who have received only PCV13 should complete their series with PCV20 or PCV21 at least 1 year later, or PPSV23. A single dose of PCV20 or PCV21 completes the series. Pneumococcal vaccines are not given yearly and are not live vaccines."}]},{"no":31,"batch":2,"title":"Mrs. Kim: Burning Pain on One Side","setting":"Primary care clinic • Older adult • Dermatology / Infectious disease","scenario":"Mrs. Kim is a 72-year-old woman who had burning, tingling pain over the left side of her chest wrapping to her back for 3 days. Yesterday grouped vesicles on a red base appeared in a band along the same area; they do not cross the midline. She has never had the shingles vaccine. Her eGFR is 70.","qs":[{"n":91,"t":"mc","visit":"Visit 1","s":"What is the **most appropriate** treatment for Mrs. Kim?","opts":["Valacyclovir 1 g three times daily for 7 days","Oral prednisone alone for three weeks","Shingrix vaccine given today as treatment","Topical acyclovir cream five times a day"],"correctIdx":[0],"answer":"A","c":"Herpes zoster is treated with an oral antiviral (valacyclovir, famciclovir or acyclovir) started within 72 hours of rash onset, which speeds healing and reduces acute pain, especially in adults over 50. Topical antivirals are ineffective for zoster, steroids alone are not recommended, and the recombinant zoster vaccine is used for prevention, not treatment of active disease."},{"n":92,"t":"mc","visit":"Visit 1 (continued)","s":"Mrs. Kim's granddaughter is 4 months old and has not had the varicella vaccine. What should the FNP advise?","opts":["The baby must receive the Shingrix vaccine","The infant will develop shingles from contact","Zoster cannot spread to anyone in any form","Keep the rash covered and avoid contact until it crusts"],"correctIdx":[3],"answer":"D","c":"The fluid in zoster vesicles contains varicella-zoster virus, which can cause chickenpox (not shingles) in people who are not immune, including infants, pregnant people and the immunocompromised. The rash is contagious until all lesions crust, so it should be covered and close contact with susceptible people avoided. Shingrix is not used in infants."},{"n":93,"t":"mc","visit":"Visit 2 (6 months later)","s":"Mrs. Kim's rash healed but she had pain for 2 months afterward. She asks about the shingles vaccine. What is **correct**?","opts":["Give the 2-dose recombinant vaccine despite the past episode","She is now immune and never needs the vaccine","She should wait at least 5 years before vaccination","Only the live zoster vaccine can be given to her"],"correctIdx":[0],"answer":"A","c":"The recombinant zoster vaccine (Shingrix) is recommended as 2 doses, 2–6 months apart, for all adults 50 and older, including those who have had shingles, because recurrence is possible. It can be given once the acute rash has resolved. The live zoster vaccine is no longer available in the U.S. Her persistent pain after healing was post-herpetic neuralgia, which vaccination helps prevent."}]},{"no":32,"batch":2,"title":"Mr. Okeke: A Wound on the Sacrum","setting":"Home visit • Frail older adult • Integumentary / Professional role","scenario":"Mr. Okeke is an 88-year-old man with advanced dementia who lives with his nephew, his paid caregiver. On a home visit the FNP finds him in soiled bedding, thin and dehydrated, with an open wound over the sacrum. The wound is a shallow crater exposing subcutaneous fat; no bone, tendon or muscle is visible. The nephew answers every question for him and says he \"doesn't have time\" to turn him.","qs":[{"n":94,"t":"mc","visit":"Visit 1","s":"How should the FNP **stage** this pressure injury?","opts":["An unstageable pressure injury","Stage 3 pressure injury","Stage 4 pressure injury","Stage 2 pressure injury"],"correctIdx":[1],"answer":"B","c":"A stage 3 pressure injury is full-thickness skin loss in which subcutaneous fat is visible but bone, tendon and muscle are not. Stage 2 is partial-thickness loss with exposed dermis or a serum-filled blister; stage 4 exposes bone, tendon or muscle; and an unstageable injury has a base obscured by slough or eschar."},{"n":95,"t":"mc","visit":"Visit 1 (continued)","s":"The FNP suspects neglect. What is the FNP's **legal and ethical** obligation?","opts":["Discuss it only with the nephew who cares for him","Document it but take no further action today","Report the suspicion to Adult Protective Services","Wait until there is proof before reporting it"],"correctIdx":[2],"answer":"C","c":"Elder neglect, the most common form of elder mistreatment, includes failure to provide food, hygiene, repositioning and medical care. Most states mandate that health-care professionals report reasonable suspicion of elder abuse or neglect to Adult Protective Services; proof is not required, and good-faith reporters are protected. Findings should be documented objectively."},{"n":96,"t":"sata","visit":"Visit 1 (continued)","s":"Which measures help **prevent** new pressure injuries for Mr. Okeke? **Select all that apply.**","opts":["Massage reddened bony prominences firmly","Reposition him at least every 2 hours","Manage incontinence and keep skin dry","Raise the head of the bed to 60° at all times","Use a pressure-redistributing mattress"],"correctIdx":[1,2,4],"answer":"B, C, E","c":"Prevention includes regular repositioning (at least every 2 hours), pressure-redistributing surfaces, prompt management of incontinence and moisture, and adequate nutrition and protein. Keeping the head of the bed at or below 30° reduces shear; raising it higher increases sacral shear. Massaging reddened bony areas damages tissue. The Braden Scale identifies risk."}]},{"no":33,"batch":2,"title":"Mr. Brennan: Calf Pain When Walking","setting":"Primary care clinic • Older adult • Peripheral vascular","scenario":"Mr. Brennan is a 67-year-old man who smokes a pack a day and has diabetes. He gets cramping pain in his right calf after walking two blocks, relieved within minutes by standing still. His right foot is cool and hairless with shiny skin, and the dorsalis pedis and posterior tibial pulses are faint. His ankle–brachial index on the right is 0.68.","qs":[{"n":97,"t":"mc","visit":"Visit 1","s":"What does Mr. Brennan's ABI of 0.68 **indicate**?","opts":["Peripheral artery disease","Chronic venous insufficiency","Normal arterial blood flow","Non-compressible calcified arteries"],"correctIdx":[0],"answer":"A","c":"A normal ankle–brachial index is 1.0–1.4. An ABI of 0.90 or less confirms peripheral artery disease, and 0.40 or less indicates critical ischemia. An ABI above 1.4 suggests non-compressible, calcified vessels (common in diabetes and CKD). Venous insufficiency is diagnosed with duplex ultrasound and does not lower the ABI."},{"n":98,"t":"mc","visit":"Visit 1 (continued)","s":"Which intervention will do the **most** to improve Mr. Brennan's claudication and outcomes?","opts":["Smoking cessation plus a supervised walking program","Strict leg elevation whenever he is sitting","Compression stockings worn every day","Daily warfarin to keep the INR at 2–3"],"correctIdx":[0],"answer":"A","c":"Smoking cessation is the single most important intervention for PAD, and supervised exercise therapy improves walking distance. He also needs antiplatelet therapy, a high-intensity statin and diabetes and BP control; cilostazol can help claudication if there is no heart failure. Compression stockings and elevation treat venous disease and can worsen arterial flow."},{"n":99,"t":"mc","visit":"Visit 2 (8 months later)","s":"Mr. Brennan develops a painful, deep, punched-out ulcer with a pale base on the tip of his right great toe. What is the **most likely** type of ulcer?","opts":["Venous stasis ulcer from reflux","Arterial ulcer from ischemia","Neuropathic ulcer from diabetes","Pressure ulcer from his bed"],"correctIdx":[1],"answer":"B","c":"Arterial ulcers occur at the toes, lateral malleolus and pressure points; they are painful, deep and punched-out with a pale base, in a cool limb with weak pulses. Venous ulcers are shallow and moist over the medial malleolus. Neuropathic diabetic ulcers are typically painless and occur on the plantar surface under pressure points such as the metatarsal heads."}]},{"no":34,"batch":2,"title":"Mr. Ibrahim: High Cholesterol","setting":"Primary care clinic • Middle adult • Cardiovascular","scenario":"Mr. Ibrahim is a 48-year-old man with no known heart disease. His LDL is 204 mg/dL, HDL 44 mg/dL and triglycerides 140 mg/dL. He has tendon xanthomas on his Achilles tendons, and his father had a myocardial infarction at 46. He does not smoke and has normal BP and glucose.","qs":[{"n":100,"t":"mc","visit":"Visit 1","s":"What is the **most appropriate** treatment for Mr. Ibrahim?","opts":["A low-intensity statin such as pravastatin 10 mg","Lifestyle changes alone for the next 12 months","A high-intensity statin such as atorvastatin 40–80 mg","Niacin as his first lipid-lowering medication"],"correctIdx":[2],"answer":"C","c":"An LDL of 190 mg/dL or higher in adults 20–75 is a statin benefit group that calls for a high-intensity statin without calculating 10-year risk. Tendon xanthomas and premature family CAD suggest familial hypercholesterolemia. High-intensity statins (atorvastatin 40–80 mg, rosuvastatin 20–40 mg) lower LDL by at least 50%; ezetimibe or a PCSK9 inhibitor may be added if needed."},{"n":101,"t":"mc","visit":"Visit 2 (6 weeks later)","s":"Mr. Ibrahim reports mild, symmetric thigh aching since starting the statin, with no weakness or dark urine. What is the **best next step**?","opts":["Add gemfibrozil to the current statin dose","Reassure him that statins never cause pain","Stop all lipid therapy permanently today","Check a CK level and evaluate the symptoms"],"correctIdx":[3],"answer":"D","c":"Statin-associated muscle symptoms are evaluated with a CK level and a search for contributors such as hypothyroidism, interacting drugs and vitamin D deficiency. If CK is normal or only mildly raised, options include temporarily stopping the statin, then rechallenging with a lower dose or a different statin. Gemfibrozil plus a statin has the highest risk of myopathy and rhabdomyolysis."},{"n":102,"t":"mc","visit":"Visit 2 (continued)","s":"Which drug or food interaction **increases** the risk of statin myopathy with simvastatin or lovastatin?","opts":["Clarithromycin or large amounts of grapefruit juice","Acetaminophen 650 mg as needed for pain","Azithromycin taken for a 5-day course","Loratadine 10 mg daily for allergies"],"correctIdx":[0],"answer":"A","c":"Simvastatin and lovastatin are metabolized by CYP3A4. Strong CYP3A4 inhibitors such as clarithromycin, erythromycin, itraconazole, ketoconazole, protease inhibitors and large amounts of grapefruit juice raise statin levels and the risk of myopathy and rhabdomyolysis. Azithromycin is not a significant CYP3A4 inhibitor."}]},{"no":35,"batch":2,"title":"Mrs. Osei: Burning in the Upper Abdomen","setting":"Primary care clinic • Middle adult • Gastrointestinal","scenario":"Mrs. Osei is a 46-year-old woman with 2 months of gnawing epigastric pain that wakes her at night and improves when she eats. She takes ibuprofen several times a week for headaches. She has no weight loss, vomiting, black stools, dysphagia or anemia. A urea breath test is positive for Helicobacter pylori.","qs":[{"n":103,"t":"mc","visit":"Visit 1","s":"Which regimen is **preferred** first-line treatment when clarithromycin susceptibility is unknown?","opts":["Bismuth quadruple therapy for 14 days","A proton pump inhibitor alone for 8 weeks","Clarithromycin triple therapy for 7 days","Amoxicillin alone for seven days"],"correctIdx":[0],"answer":"A","c":"Because clarithromycin resistance is high in the U.S., bismuth quadruple therapy (PPI, bismuth subsalicylate, tetracycline and metronidazole for 14 days) is preferred when susceptibility is unknown. Clarithromycin triple therapy is used only when the organism is known to be susceptible. A PPI alone or a single antibiotic does not eradicate H. pylori."},{"n":104,"t":"mc","visit":"Visit 1 (continued)","s":"Mrs. Osei will take bismuth. Which side effect should the FNP **warn** her about so she is not alarmed?","opts":["Severe watery diarrhea every hour","Yellow discoloration of the eyes","Black stools and a dark tongue","Bright red blood in the urine"],"correctIdx":[2],"answer":"C","c":"Bismuth subsalicylate commonly turns the stool and tongue black, which is harmless but can be mistaken for melena. Patients should be told to expect it. Metronidazole in the regimen may cause a metallic taste and nausea. True melena is tarry, foul-smelling and accompanied by other signs of bleeding."},{"n":105,"t":"mc","visit":"Visit 2 (6 weeks later)","s":"Mrs. Osei finished treatment 4 weeks ago and feels well. She stopped her PPI 2 weeks ago. Which follow-up is **recommended**?","opts":["No testing if her symptoms have resolved","H. pylori serology to confirm eradication","A urea breath test or stool antigen to confirm cure","Upper endoscopy for every treated patient"],"correctIdx":[2],"answer":"C","c":"Eradication should be confirmed with a urea breath test, stool antigen or biopsy-based test at least 4 weeks after finishing antibiotics and after holding PPIs for 2 weeks, because these drugs can cause false-negative results. Serology stays positive after cure and cannot confirm eradication. She should also avoid NSAIDs."}]},{"no":36,"batch":2,"title":"Ms. Ogunleye: Racing Heart and Weight Loss","setting":"Primary care clinic • Middle adult • Endocrine","scenario":"Ms. Ogunleye is a 38-year-old woman with 3 months of palpitations, heat intolerance, anxiety, frequent stools and a 12-lb weight loss despite a good appetite. HR is 112, BP 138/64. She has a diffuse, non-tender goiter with a bruit, lid lag, mild proptosis and a fine tremor. TSH is undetectable and free T4 is high. She is not pregnant.","qs":[{"n":106,"t":"mc","visit":"Visit 1","s":"Which finding is **specific** to Graves disease rather than other causes of hyperthyroidism?","opts":["Fine tremor of the hands","A resting tachycardia","Weight loss with good appetite","Proptosis (ophthalmopathy)"],"correctIdx":[3],"answer":"D","c":"Graves ophthalmopathy (proptosis, periorbital edema) and pretibial myxedema are specific to Graves disease, caused by TSH receptor–stimulating antibodies. Tachycardia, weight loss, tremor, heat intolerance and lid lag can occur with any cause of thyrotoxicosis, including toxic nodules and thyroiditis."},{"n":107,"t":"mc","visit":"Visit 1 (continued)","s":"The FNP starts methimazole and propranolol. Which instruction is **most important**?","opts":["Take methimazole only on days you feel jittery","Expect your eyes to bulge less within 1 week","Stop the propranolol as soon as you feel calm","Stop it and call at once if you get a sore throat and fever"],"correctIdx":[3],"answer":"D","c":"Methimazole can cause agranulocytosis, a rare but life-threatening drop in neutrophils that usually appears in the first months. Patients must stop the drug and get a CBC immediately if they develop fever, sore throat or mouth ulcers. Methimazole is taken daily, and ophthalmopathy does not reliably improve with antithyroid drugs. Beta-blockers are tapered, not stopped abruptly."},{"n":108,"t":"mc","visit":"Visit 2 (1 year later)","s":"Ms. Ogunleye chooses radioactive iodine ablation. Which outcome should the FNP tell her to **expect** afterward?","opts":["Lifelong methimazole after the ablation dose","No further thyroid monitoring will be needed","Permanent hypothyroidism needing levothyroxine","Immediate improvement in her eye proptosis"],"correctIdx":[2],"answer":"C","c":"Radioactive iodine destroys thyroid tissue and usually results in permanent hypothyroidism within months, requiring lifelong levothyroxine and regular TSH monitoring. It is contraindicated in pregnancy and breastfeeding, and pregnancy should be avoided for at least 6 months afterward. It may worsen Graves ophthalmopathy, particularly in smokers."}]},{"no":37,"batch":2,"title":"Mrs. Patel: Numb Fingers at Night","setting":"Primary care clinic • Middle adult • Musculoskeletal / Neurology","scenario":"Mrs. Patel is a 52-year-old data-entry clerk with 3 months of numbness and tingling in her right thumb, index and middle fingers that wakes her at night; shaking her hand helps. She has hypothyroidism and obesity. Sensation is reduced over the radial three and a half fingers, and the little finger is normal. There is no thenar atrophy.","qs":[{"n":109,"t":"sata","visit":"Visit 1","s":"Which examination findings would **support** carpal tunnel syndrome? **Select all that apply.**","opts":["Weakness of thumb abduction","Pain at the radial styloid with ulnar deviation and the thumb tucked","Tingling when the wrists are held flexed for 60 seconds","Tingling when the median nerve at the wrist is tapped","Numbness limited to the little finger"],"correctIdx":[0,2,3],"answer":"A, C, D","c":"Carpal tunnel syndrome is median nerve compression at the wrist. The Phalen test (wrist flexion for 60 seconds) and Tinel sign (tapping over the median nerve) reproduce symptoms, and advanced cases cause weakness of thumb abduction and thenar atrophy. Pain with the Finkelstein maneuver indicates de Quervain tenosynovitis, and isolated little-finger numbness suggests ulnar neuropathy."},{"n":110,"t":"mc","visit":"Visit 1 (continued)","s":"What is the **most appropriate** initial treatment for Mrs. Patel?","opts":["Immediate surgical carpal tunnel release","A thumb spica cast for 6 weeks","Long-term opioids for nerve pain","A wrist splint in neutral position at night"],"correctIdx":[3],"answer":"D","c":"Mild to moderate carpal tunnel syndrome without thenar atrophy is treated first with a neutral-position wrist splint at night, activity modification, ergonomic changes and treatment of contributing conditions such as hypothyroidism. A corticosteroid injection may help. Surgery is considered for thenar atrophy, severe nerve conduction findings or failure of conservative care."},{"n":111,"t":"mc","visit":"Visit 2 (4 months later)","s":"Despite treatment, Mrs. Patel now has wasting of the thenar eminence. What is the **next step**?","opts":["Reassure her that the wasting will reverse","Switch to a daytime-only wrist splint","Nerve conduction studies and surgical referral","Continue night splinting for another year"],"correctIdx":[2],"answer":"C","c":"Thenar muscle atrophy signals significant, potentially permanent median nerve damage. Electrodiagnostic studies confirm the severity, and referral for surgical carpal tunnel release is indicated to prevent further loss of function. Continued conservative care risks irreversible weakness."}]},{"no":38,"batch":2,"title":"Ms. Herrera: Stiff, Swollen Hands","setting":"Primary care clinic • Middle adult • Rheumatology","scenario":"Ms. Herrera is a 41-year-old woman with 4 months of pain and swelling in both hands and wrists, with morning stiffness lasting about 2 hours. The MCP and PIP joints of both hands are warm, boggy and tender; the DIP joints are spared. ESR and CRP are elevated, rheumatoid factor is positive and anti-CCP antibodies are strongly positive. She is not planning pregnancy.","qs":[{"n":112,"t":"mc","visit":"Visit 1","s":"Which feature **best distinguishes** Ms. Herrera's condition from osteoarthritis?","opts":["Bony enlargement of the DIP joints","Pain that worsens at the end of the day","Morning stiffness lasting more than 1 hour","Asymmetric pain in weight-bearing joints"],"correctIdx":[2],"answer":"C","c":"Rheumatoid arthritis causes inflammatory symmetric polyarthritis of the small joints of the hands (MCP, PIP, wrists) with morning stiffness lasting more than an hour, warm boggy synovitis and raised inflammatory markers. Osteoarthritis causes stiffness under 30 minutes, bony Heberden (DIP) and Bouchard (PIP) nodes, pain worse with use and asymmetric weight-bearing joint involvement."},{"n":113,"t":"mc","visit":"Visit 1 (continued)","s":"Which medication is the **first-line** disease-modifying drug for Ms. Herrera?","opts":["Prednisone 40 mg daily as long-term therapy","Naproxen alone without any DMARD therapy","Hydroxychloroquine as the only drug forever","Methotrexate taken weekly with folic acid"],"correctIdx":[3],"answer":"D","c":"Methotrexate is the anchor DMARD for rheumatoid arthritis and should be started early, ideally within 3 months of diagnosis, to prevent joint erosion. It is taken once weekly with folic acid to reduce side effects, with CBC, liver tests and creatinine monitored regularly. NSAIDs and short-term steroids relieve symptoms but do not prevent joint damage."},{"n":114,"t":"sata","visit":"Visit 2 (6 months later)","s":"Ms. Herrera needs a TNF inhibitor. What must be done **before** starting it? **Select all that apply.**","opts":["Update inactivated vaccines as needed","Give the live MMR vaccine during therapy","Screen for hepatitis B infection","Stop all folic acid supplements first","Screen for latent tuberculosis"],"correctIdx":[0,2,4],"answer":"A, C, E","c":"TNF inhibitors and other biologics suppress immunity, so latent tuberculosis (IGRA or TST) and hepatitis B must be screened for and treated before starting, because reactivation can be severe. Inactivated vaccines (influenza, pneumococcal, recombinant zoster) should be brought up to date. Live vaccines are avoided during biologic therapy."}]},{"no":39,"batch":2,"title":"Mr. Torres: Sudden Severe Flank Pain","setting":"Urgent visit • Middle adult • Renal / Genitourinary","scenario":"Mr. Torres is a 39-year-old man with 3 hours of sudden, severe, colicky left flank pain radiating to his groin, with nausea. He cannot sit still and keeps pacing. Urinalysis shows microscopic hematuria with no leukocytes or nitrites. He is afebrile with normal kidney function. A non-contrast CT shows a 5-mm stone in the distal left ureter with mild hydronephrosis.","qs":[{"n":115,"t":"mc","visit":"Visit 1","s":"Which medication is **first-line** for Mr. Torres's pain?","opts":["An NSAID such as ketorolac or ibuprofen","Oral prednisone daily for five days","Codeine with acetaminophen every hour","Meperidine by intramuscular injection"],"correctIdx":[0],"answer":"A","c":"NSAIDs are first-line for renal colic because they reduce ureteral spasm and renal capsular pressure as well as pain, and they reduce the need for opioids. Meperidine is avoided because of its neurotoxic metabolite. Opioids are reserved for pain not controlled by NSAIDs or when NSAIDs are contraindicated, such as in kidney impairment."},{"n":116,"t":"mc","visit":"Visit 1 (continued)","s":"Which medication can help Mr. Torres **pass the stone** more quickly?","opts":["Furosemide, a potent loop diuretic","Tamsulosin, an alpha-1 adrenergic blocker","Oxybutynin, an antimuscarinic agent","Allopurinol, a xanthine oxidase inhibitor"],"correctIdx":[1],"answer":"B","c":"Medical expulsive therapy with tamsulosin relaxes ureteral smooth muscle and increases the passage rate of distal ureteral stones 5–10 mm. Most stones under 5 mm pass spontaneously. The urine should be strained so the stone can be analyzed. Allopurinol prevents uric acid stones but does not help a stone pass."},{"n":117,"t":"sata","visit":"Visit 2 (2 days later)","s":"Which findings would make Mr. Torres's situation an **emergency** requiring urgent urology referral? **Select all that apply.**","opts":["Pain or vomiting not controlled by oral medicines","Rising serum creatinine","Mild ache that improves with ibuprofen","Passing a small stone in the strainer","Fever and chills with the obstructing stone"],"correctIdx":[0,1,4],"answer":"A, B, E","c":"An infected, obstructed kidney (fever with an obstructing stone) is a urologic emergency that needs urgent decompression and antibiotics because it can rapidly progress to sepsis. Acute kidney injury, a solitary kidney, intractable pain or vomiting, and large stones also require urgent referral. Passing the stone and mild controlled pain are expected."}]},{"no":40,"batch":2,"title":"Mrs. Adeyemi: Pain After a Fatty Meal","setting":"Urgent visit • Middle adult • Gastrointestinal","scenario":"Mrs. Adeyemi is a 44-year-old woman with obesity (BMI 36) and four children. Eight hours ago, after a fried dinner, she developed constant right upper abdominal pain radiating to her right shoulder blade, with nausea and vomiting. Temperature is 38.4 °C and WBC is 14,200/µL. She stops breathing in mid-inspiration when the FNP presses deeply under the right costal margin.","qs":[{"n":118,"t":"hot","visit":"Visit 1","s":"Mrs. Adeyemi has a positive Murphy sign. **Click the area of the abdomen where the FNP palpated to elicit this sign.**","answer":"A","c":"The Murphy sign is elicited by palpating deeply under the right costal margin in the right upper quadrant while the patient inhales; inspiration stops abruptly as the inflamed gallbladder descends against the examiner's fingers. It supports acute cholecystitis, as do constant RUQ pain lasting more than 6 hours, fever and leukocytosis.","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 400 320\" width=\"100%\" height=\"auto\"><rect width=\"400\" height=\"320\" fill=\"none\"/><path d=\"M 90 30 Q 200 10 310 30 Q 330 160 310 300 L 90 300 Q 70 160 90 30 Z\" fill=\"var(--skin)\" stroke=\"var(--diagram-ink)\" stroke-width=\"2.5\"/>\n<path d=\"M 90 70 Q 200 120 310 70\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-width=\"2\" stroke-opacity=\"0.5\"/>\n<line x1=\"200\" y1=\"40\" x2=\"200\" y2=\"296\" stroke=\"var(--diagram-ink)\" stroke-width=\"1.5\" stroke-dasharray=\"6 5\" stroke-opacity=\"0.55\"/>\n<line x1=\"84\" y1=\"170\" x2=\"316\" y2=\"170\" stroke=\"var(--diagram-ink)\" stroke-width=\"1.5\" stroke-dasharray=\"6 5\" stroke-opacity=\"0.55\"/>\n<circle cx=\"200\" cy=\"170\" r=\"6\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-width=\"2\"/>\n<path d=\"M 108 262 Q 150 285 196 296\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-width=\"2\" stroke-opacity=\"0.5\"/>\n<path d=\"M 292 262 Q 250 285 204 296\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-width=\"2\" stroke-opacity=\"0.5\"/>\n<text x=\"40\" y=\"20\" font-family=\"Arial, sans-serif\" font-size=\"12\" font-weight=\"700\" fill=\"var(--diagram-ink)\" text-anchor=\"start\">Patient's RIGHT</text><text x=\"268\" y=\"20\" font-family=\"Arial, sans-serif\" font-size=\"12\" font-weight=\"700\" fill=\"var(--diagram-ink)\" text-anchor=\"start\">Patient's LEFT</text><text x=\"206\" y=\"186\" font-family=\"Arial, sans-serif\" font-size=\"10\" font-weight=\"400\" fill=\"var(--diagram-ink)\" text-anchor=\"start\">umbilicus</text><g class=\"zone\" data-id=\"A\" tabindex=\"0\" role=\"button\" aria-label=\"Area A\">\n<circle cx=\"140\" cy=\"112\" r=\"15\" fill=\"var(--zone-fill)\" stroke=\"var(--zone-ink)\" stroke-width=\"2.5\"/>\n<text x=\"140\" y=\"117.5\" text-anchor=\"middle\" font-family=\"Georgia, 'Times New Roman', serif\" font-size=\"16\" font-weight=\"700\" fill=\"var(--zone-ink)\">A</text></g><g class=\"zone\" data-id=\"B\" tabindex=\"0\" role=\"button\" aria-label=\"Area B\">\n<circle cx=\"200\" cy=\"92\" r=\"15\" fill=\"var(--zone-fill)\" stroke=\"var(--zone-ink)\" stroke-width=\"2.5\"/>\n<text x=\"200\" y=\"97.5\" text-anchor=\"middle\" font-family=\"Georgia, 'Times New Roman', serif\" font-size=\"16\" font-weight=\"700\" fill=\"var(--zone-ink)\">B</text></g><g class=\"zone\" data-id=\"C\" tabindex=\"0\" role=\"button\" aria-label=\"Area C\">\n<circle cx=\"262\" cy=\"112\" r=\"15\" fill=\"var(--zone-fill)\" stroke=\"var(--zone-ink)\" stroke-width=\"2.5\"/>\n<text x=\"262\" y=\"117.5\" text-anchor=\"middle\" font-family=\"Georgia, 'Times New Roman', serif\" font-size=\"16\" font-weight=\"700\" fill=\"var(--zone-ink)\">C</text></g><g class=\"zone\" data-id=\"D\" tabindex=\"0\" role=\"button\" aria-label=\"Area D\">\n<circle cx=\"168\" cy=\"150\" r=\"15\" fill=\"var(--zone-fill)\" stroke=\"var(--zone-ink)\" stroke-width=\"2.5\"/>\n<text x=\"168\" y=\"155.5\" text-anchor=\"middle\" font-family=\"Georgia, 'Times New Roman', serif\" font-size=\"16\" font-weight=\"700\" fill=\"var(--zone-ink)\">D</text></g><g class=\"zone\" data-id=\"E\" tabindex=\"0\" role=\"button\" aria-label=\"Area E\">\n<circle cx=\"136\" cy=\"228\" r=\"15\" fill=\"var(--zone-fill)\" stroke=\"var(--zone-ink)\" stroke-width=\"2.5\"/>\n<text x=\"136\" y=\"233.5\" text-anchor=\"middle\" font-family=\"Georgia, 'Times New Roman', serif\" font-size=\"16\" font-weight=\"700\" fill=\"var(--zone-ink)\">E</text></g></svg>"},{"n":119,"t":"mc","visit":"Visit 1 (continued)","s":"Which imaging study is **first-line** to evaluate suspected acute cholecystitis?","opts":["Upper GI barium swallow study","Plain upright abdominal x-ray","Non-contrast CT of the abdomen","Right upper quadrant ultrasound"],"correctIdx":[3],"answer":"D","c":"RUQ ultrasound is the first-line test for suspected gallbladder disease: it shows gallstones, gallbladder wall thickening, pericholecystic fluid and a sonographic Murphy sign, without radiation. A HIDA scan is used if ultrasound is equivocal. Most gallstones are not visible on plain x-ray, and CT is less sensitive for stones."},{"n":120,"t":"sata","visit":"Visit 1 (continued)","s":"Which factors in Mrs. Adeyemi's history **increase** her risk of gallstones? **Select all that apply.**","opts":["A diet very high in fiber","Female sex","Male sex and age under 20","Multiple pregnancies","Obesity"],"correctIdx":[1,3,4],"answer":"B, D, E","c":"Classic gallstone risk factors are summarized as the \"5 Fs\": female, fertile (multiparity), fat (obesity), forty and fair. Estrogen increases cholesterol secretion into bile, and pregnancy slows gallbladder emptying. Other risks include rapid weight loss, Native American ancestry, Crohn disease and hemolysis. A high-fiber diet is protective."}]},{"no":41,"batch":2,"title":"Ms. Nnamdi: Irregular Periods and Acne","setting":"Primary care clinic • Young adult • Women's health / Endocrine","scenario":"Ms. Nnamdi is a 24-year-old woman with periods every 2–4 months since menarche, worsening acne, and coarse dark hair on her chin and lower abdomen. BMI is 32 and she has dark velvety skin on the back of her neck. Pregnancy test, TSH, prolactin and 17-hydroxyprogesterone are normal. Total testosterone is mildly elevated. She does not want pregnancy now.","qs":[{"n":121,"t":"mc","visit":"Visit 1","s":"Which criteria **establish** the diagnosis of polycystic ovary syndrome in Ms. Nnamdi?","opts":["An ultrasound showing polycystic ovaries alone","A raised testosterone level with no other findings","Oligo-ovulation plus hyperandrogenism, other causes excluded","Obesity together with acanthosis nigricans on the neck"],"correctIdx":[2],"answer":"C","c":"By the Rotterdam criteria, PCOS requires two of three features: oligo- or anovulation, clinical or biochemical hyperandrogenism, and polycystic ovaries on ultrasound, after excluding thyroid disease, hyperprolactinemia and non-classic congenital adrenal hyperplasia. Ms. Nnamdi has irregular cycles and hirsutism, acne and raised testosterone, so ultrasound is not required."},{"n":122,"t":"mc","visit":"Visit 1 (continued)","s":"Which medication is **first-line** to regulate Ms. Nnamdi's cycles and improve her acne and hirsutism?","opts":["Medroxyprogesterone every 3 months","Letrozole taken on cycle days 3–7","Testosterone gel applied daily","A combined hormonal contraceptive"],"correctIdx":[3],"answer":"D","c":"Combined hormonal contraceptives are first-line for menstrual irregularity and hyperandrogenism in PCOS when pregnancy is not desired. They suppress ovarian androgen production, raise sex hormone–binding globulin, regulate cycles and protect the endometrium from unopposed estrogen. Letrozole is used for ovulation induction when pregnancy is desired."},{"n":123,"t":"sata","visit":"Visit 1 (continued)","s":"PCOS raises Ms. Nnamdi's long-term health risks. Which screening is **recommended**? **Select all that apply.**","opts":["Fasting lipid panel","Annual pelvic CT scan","Serum CA-125 level every year","Oral glucose tolerance test or A1c","Depression and anxiety screening"],"correctIdx":[0,3,4],"answer":"A, D, E","c":"PCOS is associated with insulin resistance, type 2 diabetes, dyslipidemia, MASLD, obstructive sleep apnea, depression and anxiety, and endometrial hyperplasia. Recommended screening includes glucose tolerance (OGTT or A1c), a lipid panel, BP and mood screening. Weight loss of 5–10% can restore ovulation. CT and CA-125 have no role."}]},{"no":42,"batch":2,"title":"Mr. Bakare: Episodes of Terror","setting":"Primary care clinic • Young adult • Mental health","scenario":"Mr. Bakare is a 27-year-old accountant who has had six sudden episodes in 2 months of pounding heart, chest tightness, shortness of breath, tingling hands and a fear that he is dying, each peaking within 10 minutes. He now avoids driving on the highway in case an attack happens. ECG, TSH and CBC are normal, and he uses no stimulants or drugs.","qs":[{"n":124,"t":"mc","visit":"Visit 1","s":"What is the **most likely** diagnosis?","opts":["Panic disorder with avoidance behavior","Social anxiety (social phobia) disorder","Hyperthyroidism with thyrotoxicosis","Generalized anxiety disorder"],"correctIdx":[0],"answer":"A","c":"Panic disorder is recurrent, unexpected panic attacks (abrupt surges of intense fear peaking within minutes, with physical symptoms) followed by at least a month of worry about further attacks or avoidance behavior. Generalized anxiety disorder is persistent worry about many things for 6 months, social anxiety is fear of scrutiny, and his normal TSH excludes hyperthyroidism."},{"n":125,"t":"mc","visit":"Visit 1 (continued)","s":"Which long-term treatment plan is **most appropriate**?","opts":["Daily alprazolam as the main treatment","An SSRI started at a low dose plus CBT","Bupropion started at the full dose","Propranolol before each expected attack"],"correctIdx":[1],"answer":"B","c":"SSRIs (or SNRIs) and cognitive behavioral therapy are first-line for panic disorder. SSRIs are started at a low dose because patients with panic disorder are sensitive to initial jitteriness, then titrated. Benzodiazepines are reserved for short-term bridging because of dependence and withdrawal risk. Bupropion is not effective for anxiety disorders."},{"n":126,"t":"sata","visit":"Visit 2 (4 weeks later)","s":"Which statements about benzodiazepines are **correct** to share with Mr. Bakare? **Select all that apply.**","opts":["They should be tapered, not stopped abruptly","They are safe to use when driving on highways","They are the best long-term treatment for panic","Combining them with alcohol or opioids is dangerous","They can cause dependence and withdrawal"],"correctIdx":[0,3,4],"answer":"A, D, E","c":"Benzodiazepines cause sedation, impaired driving and cognition, tolerance, dependence and withdrawal, which can include seizures if stopped abruptly after regular use. Combining them with alcohol or opioids causes dangerous respiratory depression (boxed warning). They are not first-line for long-term management of panic disorder."}]},{"no":43,"batch":2,"title":"Ms. Ferguson: Headaches With Flashing Lights","setting":"Primary care clinic • Young adult • Neurology / Women's health","scenario":"Ms. Ferguson is a 23-year-old woman with throbbing one-sided headaches with nausea and light sensitivity, lasting about a day, three or four times a month. About 20 minutes before each headache she sees zigzag flashing lights that spread across her vision and then fade. Neurological examination is normal. She takes a combined estrogen–progestin oral contraceptive.","qs":[{"n":127,"t":"mc","visit":"Visit 1","s":"What is the **most important** change to Ms. Ferguson's medications?","opts":["Add a daily aspirin to her current pill","Stop the estrogen-containing contraceptive","Switch to a continuous combined pill","Increase the estrogen dose in her pill"],"correctIdx":[1],"answer":"B","c":"Migraine with aura is a US MEC category 4 (unacceptable risk) condition for estrogen-containing contraceptives at any age because estrogen further increases the risk of ischemic stroke. She should switch to a progestin-only method or a copper or levonorgestrel IUD. Continuous combined pills still contain estrogen."},{"n":128,"t":"mc","visit":"Visit 1 (continued)","s":"Which medication is **appropriate** for Ms. Ferguson's moderate-to-severe acute attacks?","opts":["Butalbital combination tablets every day","Ergotamine taken with a triptan together","Oxycodone at the first sign of an aura","Sumatriptan at the start of the headache"],"correctIdx":[3],"answer":"D","c":"Triptans such as sumatriptan are first-line for moderate to severe migraine and work best taken early in the headache phase. Butalbital combinations and opioids cause medication-overuse headache and dependence and are not recommended. Triptans and ergotamines must not be taken within 24 hours of each other because of vasoconstriction."},{"n":129,"t":"sata","visit":"Visit 2 (2 months later)","s":"Ms. Ferguson now has 6 migraine days a month. Which medications are **options for prevention**? **Select all that apply.**","opts":["Topiramate","Sumatriptan taken every day","Amitriptyline","Daily acetaminophen with caffeine","Propranolol"],"correctIdx":[0,2,4],"answer":"A, C, E","c":"Preventive therapy is indicated for 4 or more migraine days a month or disabling attacks. Options include beta-blockers (propranolol, metoprolol), topiramate, amitriptyline, venlafaxine, candesartan and CGRP-targeting agents. Topiramate reduces hormonal contraceptive efficacy at higher doses and is teratogenic, so effective contraception is essential. Daily acute medicines cause medication-overuse headache."}]},{"no":44,"batch":2,"title":"Mr. Owusu: Hepatitis B Results","setting":"Primary care clinic • Young adult • Infectious disease / Hepatic","scenario":"Mr. Owusu is a 30-year-old man born in Ghana who moved to the U.S. 2 years ago. He feels well. As part of routine screening, his hepatitis B tests show: HBsAg positive, total anti-HBc positive, IgM anti-HBc negative and anti-HBs negative. A repeat HBsAg 7 months later is still positive. ALT is mildly elevated.","qs":[{"n":130,"t":"mc","visit":"Visit 1","s":"How should the FNP **interpret** Mr. Owusu's hepatitis B results?","opts":["Acute hepatitis B infection","Chronic hepatitis B infection","Immunity from past vaccination","Resolved past hepatitis B infection"],"correctIdx":[1],"answer":"B","c":"A positive HBsAg for more than 6 months with positive total anti-HBc and negative IgM anti-HBc indicates chronic hepatitis B infection. Acute infection shows positive IgM anti-HBc; resolved infection shows negative HBsAg with positive anti-HBc and anti-HBs; and vaccine immunity shows only a positive anti-HBs. People born in sub-Saharan Africa and Asia have a high prevalence of chronic HBV."},{"n":131,"t":"sata","visit":"Visit 1 (continued)","s":"Which steps are **recommended** in Mr. Owusu's care? **Select all that apply.**","opts":["Vaccinate susceptible contacts","Refer for HBV DNA testing and treatment evaluation","Give him the hepatitis B vaccine series now","Test his household and sexual contacts","Reassure him that no follow-up is needed"],"correctIdx":[0,1,3],"answer":"A, B, D","c":"Household and sexual contacts of a person with chronic HBV should be tested and vaccinated if susceptible. Mr. Owusu needs HBV DNA, liver tests and assessment for fibrosis and antiviral treatment. People with chronic HBV are not vaccinated against hepatitis B because they are already infected, but they should be vaccinated against hepatitis A."},{"n":132,"t":"mc","visit":"Visit 2 (6 months later)","s":"Because of his chronic hepatitis B, which **ongoing surveillance** does Mr. Owusu need?","opts":["Monthly blood cultures for bacteremia","Annual colonoscopy from this year on","Liver ultrasound for hepatocellular carcinoma","Yearly chest CT for lung cancer screening"],"correctIdx":[2],"answer":"C","c":"Chronic hepatitis B increases the risk of hepatocellular carcinoma, even without cirrhosis in some groups such as African-born adults. Surveillance with liver ultrasound, with or without alpha-fetoprotein, about every 6 months is recommended for high-risk patients. Colonoscopy and lung CT follow standard screening criteria unrelated to HBV."}]},{"no":45,"batch":2,"title":"Mr. Delgado: A Painful Lump on the Thigh","setting":"Urgent visit • Young adult • Dermatology / Infectious disease","scenario":"Mr. Delgado is a 21-year-old college wrestler with 3 days of a painful, red, swollen lump on his left thigh. It is 3 cm across, warm and fluctuant, with a small area of surrounding redness. He is afebrile and otherwise well. Two teammates recently had \"spider bites\" that needed drainage.","qs":[{"n":133,"t":"ord","visit":"Visit 1","s":"Incision and drainage is the primary treatment for this fluctuant abscess. **Place the steps of the procedure in the correct order.**","items":["Step 1","Step 2","Step 3","Step 4","Step 5"],"tgts":["Express the pus and break up loculations","Incise the abscess along the skin tension lines","Clean the skin and infiltrate local anesthetic","Irrigate the cavity with sterile saline","Apply a dressing and arrange recheck in 24–48 hours"],"map":[2,1,0,3,4],"answer":"C, B, A, D, E","c":"A fluctuant abscess is treated primarily with incision and drainage. The skin is cleaned and anesthetized, the abscess is incised along skin tension lines, pus is expressed and loculations are broken up with a hemostat, the cavity is irrigated, and a dressing is applied with follow-up in 24–48 hours (packing is optional for small abscesses). Community-acquired MRSA is the likely cause given his close-contact sport and affected teammates."},{"n":134,"t":"mc","visit":"Visit 1 (continued)","s":"The abscess is larger than 2 cm and the FNP adds an antibiotic. Which choice covers **community-acquired MRSA**?","opts":["Cephalexin taken four times a day","Amoxicillin taken twice a day","Trimethoprim–sulfamethoxazole","Penicillin V taken four times a day"],"correctIdx":[2],"answer":"C","c":"Oral options for community-acquired MRSA skin infections include trimethoprim–sulfamethoxazole, doxycycline and clindamycin (depending on local resistance), and linezolid. Cephalexin, amoxicillin and penicillin do not cover MRSA; cephalexin is appropriate for non-purulent cellulitis caused by streptococci and MSSA."},{"n":135,"t":"sata","visit":"Visit 2 (2 months later)","s":"Mr. Delgado has had a second abscess. Which measures can **reduce recurrence**? **Select all that apply.**","opts":["Cover lesions only during competition","Shower promptly after practice","Do not share towels, razors or equipment","Take daily antibiotics for the whole season","Use intranasal mupirocin and chlorhexidine washes"],"correctIdx":[1,2,4],"answer":"B, C, E","c":"Recurrent MRSA infections are reduced by personal hygiene, not sharing towels, razors or athletic equipment, showering after practice, cleaning shared surfaces and keeping wounds covered at all times. Decolonization with intranasal mupirocin and chlorhexidine body washes may be used for recurrences. Long-term prophylactic antibiotics promote resistance."}]},{"no":46,"batch":2,"title":"Chloe: Thirsty and Losing Weight","setting":"Primary care clinic • Adolescent • Endocrine","scenario":"Chloe is a 13-year-old girl with 3 weeks of excessive thirst, frequent urination including at night and a 9-lb weight loss despite eating more. Today she has had abdominal pain and vomiting since morning. She is breathing deeply and rapidly, and her breath has a fruity smell. Point-of-care glucose reads 486 mg/dL and urine ketones are large.","qs":[{"n":136,"t":"mc","visit":"Visit 1","s":"What is the **most appropriate** action?","opts":["Send her immediately to the emergency department","Give subcutaneous insulin and send her home","Start metformin and recheck in one week","Advise oral fluids and recheck tomorrow"],"correctIdx":[0],"answer":"A","c":"Hyperglycemia with large ketones, vomiting, abdominal pain and Kussmaul respirations indicate diabetic ketoacidosis, a medical emergency in new-onset type 1 diabetes. She needs emergency care for IV fluids, IV insulin and potassium replacement with close monitoring for complications such as cerebral edema. Outpatient treatment is unsafe."},{"n":137,"t":"mc","visit":"Visit 1 (continued)","s":"What is the **underlying** problem in Chloe's type of diabetes?","opts":["Insulin resistance from obesity and inactivity","Autoimmune destruction of the thyroid gland","Excess cortisol from an adrenal tumor","Autoimmune destruction of pancreatic beta cells"],"correctIdx":[3],"answer":"D","c":"Type 1 diabetes results from autoimmune destruction of pancreatic beta cells, causing absolute insulin deficiency; autoantibodies such as GAD65, IA-2, insulin and ZnT8 support the diagnosis. Without insulin, fat breakdown produces ketones, leading to DKA. Type 2 diabetes is driven by insulin resistance with relative insulin deficiency."},{"n":138,"t":"sata","visit":"Visit 2 (2 weeks after discharge)","s":"Chloe now uses basal–bolus insulin. Which teaching points about **hypoglycemia** are correct? **Select all that apply.**","opts":["Skip meals after taking her mealtime insulin","Treat a low with 15 g of fast-acting glucose and recheck in 15 minutes","Exercise right after insulin with no snack","Tell school staff and coaches how to recognize lows","Keep glucagon available for severe lows"],"correctIdx":[1,3,4],"answer":"B, D, E","c":"The \"rule of 15\" treats hypoglycemia with 15 g of fast-acting carbohydrate, rechecking glucose after 15 minutes and repeating if it is still below 70 mg/dL. Glucagon (intranasal or injected) should be prescribed for severe hypoglycemia, and school staff and coaches need a diabetes care plan. Skipping meals after insulin or exercising without adjusting food or insulin causes lows."}]},{"no":47,"batch":2,"title":"Ethan: Trouble Focusing in Class","setting":"Primary care clinic • Adolescent (early) • Mental health / Neurodevelopment","scenario":"Ethan is a 12-year-old boy whose teachers and parents report that, since early elementary school, he is easily distracted, loses his belongings, does not finish assignments, fidgets and interrupts others. Vanderbilt rating scales from both his parents and his teacher are positive for combined-type ADHD. Hearing and vision screens are normal.","qs":[{"n":139,"t":"mc","visit":"Visit 1","s":"Which question is **most important** to ask before starting a stimulant?","opts":["How many hours he spends on video games","Whether he prefers liquid or tablet medicine","Any family history of sudden cardiac death","Whether he has had chickenpox in the past"],"correctIdx":[2],"answer":"C","c":"Before starting a stimulant, the clinician asks about personal history of syncope, chest pain with exercise, palpitations or structural heart disease, and family history of sudden cardiac death, cardiomyopathy, long QT or arrhythmias. A positive history warrants an ECG and cardiology evaluation before treatment. A cardiac examination and baseline BP and HR are also needed."},{"n":140,"t":"mc","visit":"Visit 1 (continued)","s":"What is the **recommended** treatment for Ethan according to the AAP?","opts":["Dietary changes alone, avoiding all added sugar","A stimulant plus behavioral therapy and school supports","Parent training only, without any medication","A benzodiazepine taken each morning before school"],"correctIdx":[1],"answer":"B","c":"For school-aged children and adolescents with ADHD, the AAP recommends FDA-approved medication (stimulants are first-line and most effective) combined with behavioral therapy and school supports such as an IEP or 504 plan. Parent training alone is first-line only for preschool children aged 4–5. Diet changes and sedatives are not effective treatments."},{"n":141,"t":"sata","visit":"Visit 2 (3 months later)","s":"Ethan is taking methylphenidate. What should the FNP **monitor** at follow-up visits? **Select all that apply.**","opts":["Fasting lipid panel every month","Blood pressure and heart rate","Height and weight","Sleep and appetite","Serum lithium level"],"correctIdx":[1,2,3],"answer":"B, C, D","c":"Stimulants commonly suppress appetite and cause weight loss, insomnia, headache and abdominal pain, and they can raise heart rate and BP and slightly slow growth. Height, weight (plotted on growth charts), BP, HR, sleep, appetite and symptom response are monitored. Schedule II prescribing also requires checking the prescription drug monitoring program and counseling about diversion."}]},{"no":48,"batch":2,"title":"Lily: A Barking Cough at Night","setting":"Urgent visit • Preschool child • Respiratory","scenario":"Lily is a 2-year-old who had a runny nose for 2 days and woke tonight with a loud, barking \"seal-like\" cough, a hoarse cry and noisy breathing on inspiration when she cries. Temperature is 38.0 °C. At rest she is playful, drinking well and has no drooling. She has mild suprasternal retractions only when crying, and SpO₂ is 98%.","qs":[{"n":142,"t":"mc","visit":"Visit 1","s":"What is the **most likely** diagnosis?","opts":["Viral croup (laryngotracheobronchitis)","Epiglottitis caused by bacteria","Bronchiolitis caused by RSV","Inhaled foreign body in a bronchus"],"correctIdx":[0],"answer":"A","c":"Croup is a viral (most often parainfluenza) infection of the larynx and trachea in children 6 months to 3 years. It causes a barking cough, hoarseness and inspiratory stridor that is often worse at night, with a low-grade fever after a URI prodrome. Epiglottitis causes a toxic appearance, drooling and tripod positioning, and bronchiolitis causes wheezing and crackles."},{"n":143,"t":"mc","visit":"Visit 1 (continued)","s":"What is the **most appropriate** treatment for Lily's mild croup?","opts":["Nebulized albuterol every 4 hours","An oral cough suppressant at night","A single oral dose of dexamethasone","Oral amoxicillin for 10 days"],"correctIdx":[2],"answer":"C","c":"A single dose of oral dexamethasone (0.15–0.6 mg/kg) is recommended for croup of every severity because it reduces airway swelling, return visits and hospitalization. Nebulized racemic epinephrine is added for moderate to severe croup with stridor at rest, followed by observation for 2–4 hours. Croup is viral, so antibiotics do not help, and albuterol treats lower-airway wheeze."},{"n":144,"t":"sata","visit":"Visit 2 (phone call that night)","s":"Lily's mother calls back. Which findings mean Lily needs **emergency** care now? **Select all that apply.**","opts":["Stridor while she is calm and resting","A temperature of 37.9 °C","Drooling and inability to swallow","Retractions with bluish lips","A barking cough when she wakes up"],"correctIdx":[0,2,3],"answer":"A, C, D","c":"Stridor at rest, marked retractions, cyanosis, lethargy or agitation indicate moderate to severe airway obstruction requiring emergency care. Drooling, inability to swallow, a toxic appearance or the tripod position raise concern for epiglottitis or bacterial tracheitis, which are airway emergencies. A barking cough on waking and low-grade fever are expected in mild croup."}]},{"no":49,"batch":2,"title":"Baby Noah: Forceful Vomiting","setting":"Primary care clinic • Infant • Gastrointestinal","scenario":"Noah is a 5-week-old

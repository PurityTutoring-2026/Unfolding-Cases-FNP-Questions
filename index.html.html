r her fibroids? **Select all that apply.**","opts":["Total abdominal hysterectomy","High-dose estrogen therapy","Levonorgestrel IUD or tranexamic acid for bleeding","GnRH antagonist combination therapy","Uterine artery embolization or myomectomy"],"correctIdx":[2,3,4],"answer":"C, D, E","c":"Uterus-sparing treatments for symptomatic fibroids include tranexamic acid, NSAIDs, hormonal contraceptives and the levonorgestrel IUD for bleeding (the IUD may be less effective with a distorted cavity), oral GnRH antagonist combinations (relugolix or elagolix with add-back hormone therapy), uterine artery embolization, MRI-guided focused ultrasound, radiofrequency ablation and myomectomy. Hysterectomy is definitive but removes the uterus. Iron replacement treats her anemia."}]},{"no":264,"batch":11,"title":"Mr. Kaplan: Bitten by a Stray Dog","setting":"Urgent visit • Middle adult • Infectious disease / Wound care","scenario":"Mr. Kaplan is a 50-year-old man with diabetes who was bitten on the back of his right hand by an unknown stray dog 3 hours ago while jogging. He has several puncture wounds and a 2-cm laceration. The dog ran away and cannot be found. His last tetanus booster was 12 years ago. He has no drug allergies.","qs":[{"n":790,"t":"mc","visit":"Visit 1","s":"Which antibiotic is **preferred** for prophylaxis after this bite?","opts":["Ciprofloxacin alone","Amoxicillin–clavulanate","Clindamycin alone","Cephalexin alone"],"correctIdx":[1],"answer":"B","c":"Amoxicillin–clavulanate is the first-line antibiotic for dog, cat and human bites because it covers Pasteurella, streptococci, staphylococci and anaerobes (and Capnocytophaga in dog bites). Prophylaxis for 3–5 days is recommended for high-risk wounds: hand bites, puncture wounds, deep wounds, immunocompromise or diabetes. Cephalexin and clindamycin alone miss Pasteurella. For penicillin allergy, doxycycline or TMP-SMX plus metronidazole or clindamycin are options."},{"n":791,"t":"sata","visit":"Visit 1 (continued)","s":"Which steps are **appropriate** for Mr. Kaplan? **Select all that apply.**","opts":["Start rabies post-exposure prophylaxis and report the bite","Wait 10 days to see if the dog becomes ill","Give a Tdap booster","Thoroughly irrigate the wounds","Close the hand wounds tightly with sutures"],"correctIdx":[0,2,3],"answer":"A, C, D","c":"Bite wounds should be thoroughly irrigated and debrided. Hand wounds and punctures are generally left open or loosely approximated because of infection risk. Tdap is given if more than 5 years have passed since the last tetanus dose for a contaminated wound. Because the dog cannot be observed, rabies PEP is indicated: human rabies immune globulin infiltrated around the wounds plus rabies vaccine on days 0, 3, 7 and 14. Bites are reported to public health."},{"n":792,"t":"match","visit":"Visit 2 (teaching)","s":"**Drag each bite type to its key feature.** One option will not be used.","items":["Cat bite","Human \"fight bite\"","Bat contact"],"tgts":["Knuckle laceration that can seed the joint with Eikenella","Deep puncture wounds with high infection risk from Pasteurella","Rabies prophylaxis even without a visible bite wound","Low risk of infection; can always be sutured tightly"],"map":[1,0,2],"answer":"1–B, 2–A, 3–C","c":"Cat bites cause deep punctures with a high infection rate (often Pasteurella multocida, which can cause rapid cellulitis within 24 hours). Human bites, especially clenched-fist injuries, can infect joints and tendons with Eikenella corrodens and oral anaerobes. Bats are the leading cause of human rabies in the U.S., and bites may be unnoticed, so PEP is recommended after direct contact or waking with a bat in the room. No mammal bite is so low risk that it should always be sutured tightly."}]},{"no":265,"batch":11,"title":"Ms. Yilmaz: Walking Pneumonia","setting":"Primary care clinic • Young adult • Respiratory / Infectious disease","scenario":"Ms. Yilmaz is a 22-year-old college student with 10 days of gradually worsening dry cough, low-grade fever, headache, sore throat and fatigue. Several dorm-mates have had similar symptoms. She looks well. Temperature is 37.9 °C, RR 18, SpO₂ 97%. Scattered crackles are heard. Chest x-ray shows patchy interstitial infiltrates. She is healthy with no antibiotic use in the past 3 months and no allergies.","qs":[{"n":793,"t":"mc","visit":"Visit 1","s":"Which organism is the **most likely** cause?","opts":["Pseudomonas aeruginosa","Klebsiella pneumoniae","Mycoplasma pneumoniae","Staphylococcus aureus"],"correctIdx":[2],"answer":"C","c":"Mycoplasma pneumoniae is a common cause of \"atypical\" or \"walking\" pneumonia in adolescents and young adults, especially in close-contact settings such as dormitories and military barracks. It causes gradual onset of dry cough, headache, sore throat, low-grade fever and malaise, with x-ray findings often worse than the examination suggests. Extrapulmonary features include bullous myringitis and cold agglutinin hemolysis."},{"n":794,"t":"mc","visit":"Visit 1 (continued)","s":"Which outpatient antibiotic is **appropriate** for her?","opts":["Doxycycline or a macrolide","Nitrofurantoin for 7 days","Amoxicillin alone for 5 days","Cephalexin twice a day"],"correctIdx":[0],"answer":"A","c":"Mycoplasma lacks a cell wall, so beta-lactams such as amoxicillin and cephalosporins are ineffective. For healthy outpatients with community-acquired pneumonia, ATS/IDSA guidelines recommend amoxicillin, doxycycline, or a macrolide (only where pneumococcal macrolide resistance is below 25%). When atypical pathogens such as Mycoplasma are suspected, doxycycline or azithromycin is appropriate."},{"n":795,"t":"sata","visit":"Visit 1 (continued)","s":"Which findings would indicate the need for a **higher level of care**? **Select all that apply.**","opts":["A temperature of 37.9 °C","A dry cough lasting 10 days","Oxygen saturation below 92% on room air","Confusion","Respiratory rate of 30 or more"],"correctIdx":[2,3,4],"answer":"C, D, E","c":"Hospital evaluation is needed for confusion, respiratory rate of 30 or more, hypotension, hypoxemia (SpO₂ below about 92%), multilobar infiltrates, inability to take oral medications or significant comorbidities. Tools such as CURB-65 and the Pneumonia Severity Index help guide site-of-care decisions. Persistent cough and low-grade fever are typical of mild atypical pneumonia."}]},{"no":266,"batch":11,"title":"Mrs. Adeleke: Contraception While Breastfeeding","setting":"Postpartum visit • Young adult • Women's health","scenario":"Mrs. Adeleke is a 29-year-old woman 4 weeks after an uncomplicated vaginal delivery. She is exclusively breastfeeding her son day and night and has not had a period. She wants reliable contraception because she does not want another pregnancy for at least 2 years. She has no history of blood clots, migraine with aura or hypertension.","qs":[{"n":796,"t":"mc","visit":"Visit 1","s":"Which method has the **best** effectiveness and no effect on breastfeeding?","opts":["Withdrawal method alone","Spermicide used alone","An implant or IUD placed now","Fertility awareness alone"],"correctIdx":[2],"answer":"C","c":"Long-acting reversible contraceptives (the etonogestrel implant, levonorgestrel IUDs and the copper IUD) are the most effective reversible methods (over 99%) and can be placed postpartum without affecting breastfeeding. Progestin-only methods do not reduce milk supply. Withdrawal, fertility awareness and spermicide alone have much higher failure rates."},{"n":797,"t":"mc","visit":"Visit 1 (continued)","s":"When can she rely on the **lactational amenorrhea method (LAM)**?","opts":["Up to 2 years if she mostly breastfeeds at night","Any time she is breastfeeding at least once a day","Under 6 months, exclusive breastfeeding and no menses","Only after her periods have returned to normal"],"correctIdx":[2],"answer":"C","c":"LAM is more than 98% effective only when all three criteria are met: the infant is under 6 months old, the mother is fully or nearly fully breastfeeding (no long intervals between feeds, including at night) and her periods have not returned. If any criterion changes, another method must be started."},{"n":798,"t":"mc","visit":"Visit 1 (continued)","s":"According to the CDC criteria, why are **combined hormonal** methods usually avoided in the first 3 weeks postpartum?","opts":["Estrogen always stops breast milk production entirely","Combined pills cause the uterus to bleed heavily","Combined pills cannot be started until the baby weans","Estrogen increases the risk of blood clots after birth"],"correctIdx":[3],"answer":"D","c":"The postpartum period carries an increased risk of venous thromboembolism, and estrogen adds to it. The CDC Medical Eligibility Criteria classify combined hormonal contraception as unacceptable (category 4) in the first 21 days postpartum and generally not recommended until 30–42 days when other VTE risk factors are present. Estrogen may also reduce milk supply in some women, so progestin-only methods are often preferred while breastfeeding."}]},{"no":267,"batch":11,"title":"Mr. Cruz: Vomiting Relieved by Hot Showers","setting":"Urgent visit • Young adult • Gastrointestinal / Substance use","scenario":"Mr. Cruz is a 25-year-old man with his fourth episode this year of severe nausea, repeated vomiting and diffuse abdominal pain lasting several days. He says the only thing that helps is taking long, hot showers many times a day. He has used high-potency cannabis several times daily for 4 years. Between episodes he feels well. His labs show mild hypokalemia; lipase, liver tests, imaging and endoscopy have been normal.","qs":[{"n":799,"t":"mc","visit":"Visit 1","s":"What is the **most likely** diagnosis?","opts":["Diabetic gastroparesis in a young adult","Small bowel obstruction from adhesions","Cannabinoid hyperemesis syndrome","Acute pancreatitis from alcohol use"],"correctIdx":[2],"answer":"C","c":"Cannabinoid hyperemesis syndrome occurs in people with long-term, frequent cannabis use. It causes recurrent episodes of severe nausea, vomiting and abdominal pain, with relief from hot showers or baths, and well periods between episodes. It is a diagnosis made after excluding other causes, and it resolves with sustained cannabis cessation."},{"n":800,"t":"mc","visit":"Visit 1 (continued)","s":"Which treatment is the **definitive** therapy?","opts":["Stopping cannabis use completely","Long-term opioids for the pain","Daily ondansetron indefinitely","Switching to a lower-THC product"],"correctIdx":[0],"answer":"A","c":"Complete cannabis cessation is the only definitive treatment; symptoms typically resolve within weeks to months. Acute episodes are treated with IV fluids and electrolyte replacement, and topical capsaicin cream on the abdomen, haloperidol or droperidol are often more effective than standard antiemetics. Opioids should be avoided. Counseling and treatment for cannabis use disorder support cessation."},{"n":801,"t":"sata","visit":"Visit 1 (continued)","s":"Which complications can occur with **repeated vomiting** in this syndrome? **Select all that apply.**","opts":["Hyperkalemia from cell breakdown","Esophageal tears (Mallory–Weiss)","Polycythemia vera","Hypokalemia","Dehydration and acute kidney injury"],"correctIdx":[1,3,4],"answer":"B, D, E","c":"Repeated vomiting can cause dehydration with prerenal acute kidney injury, hypokalemia, hypochloremic metabolic alkalosis, Mallory–Weiss tears and, rarely, esophageal rupture. Severe hypokalemia can cause arrhythmias, so electrolytes should be checked and replaced. Vomiting does not cause hyperkalemia or polycythemia vera."}]},{"no":268,"batch":11,"title":"Ms. Nakato: Hives That Keep Coming Back","setting":"Primary care clinic • Young adult • Allergy / Dermatology","scenario":"Ms. Nakato is a 27-year-old woman with itchy, raised, red wheals that appear on different parts of her body almost every day for the past 4 months. Each wheal fades within 24 hours without bruising or a mark. Sometimes her lips swell. She has no throat tightness, breathing difficulty or fever. She has not found any food or drug trigger. Her examination is otherwise normal.","qs":[{"n":802,"t":"mc","visit":"Visit 1","s":"How is her condition **classified**?","opts":["Chronic spontaneous urticaria","Hereditary angioedema","Acute allergic urticaria","Urticarial vasculitis"],"correctIdx":[0],"answer":"A","c":"Urticaria lasting more than 6 weeks is chronic; when there is no consistent external trigger it is called chronic spontaneous urticaria, often autoimmune. Individual wheals last less than 24 hours and leave no mark, and angioedema occurs in about 40%. Wheals lasting more than 24 hours, painful lesions or residual bruising suggest urticarial vasculitis. Hereditary angioedema causes swelling without hives."},{"n":803,"t":"mc","visit":"Visit 1 (continued)","s":"What is the **first-line** treatment?","opts":["An epinephrine autoinjector used daily","A long course of oral prednisone","Extensive food allergy panels first","A daily second-generation antihistamine"],"correctIdx":[3],"answer":"D","c":"A daily non-sedating second-generation H1 antihistamine (cetirizine, loratadine, fexofenadine) is first-line for chronic urticaria; the dose can be increased up to fourfold if needed. Omalizumab, dupilumab or cyclosporine are used for refractory cases. Systemic steroids are only for short flares. Extensive allergy testing is not recommended because chronic urticaria is rarely caused by food allergy."},{"n":804,"t":"sata","visit":"Visit 1 (continued)","s":"Which factors can **worsen** her urticaria? **Select all that apply.**","opts":["Stress","NSAIDs such as ibuprofen","Cool, loose cotton clothing","Heat and tight clothing","Second-generation antihistamines"],"correctIdx":[0,1,3],"answer":"A, B, D","c":"Chronic urticaria can be aggravated by NSAIDs and aspirin, alcohol, heat, pressure from tight clothing, infections and stress. ACE inhibitors can worsen angioedema. Avoiding aggravating factors and wearing loose, cool clothing can help. She should seek emergency care for throat swelling, difficulty breathing or dizziness."}]},{"no":269,"batch":11,"title":"Mr. Orji: A Drooping Fingertip","setting":"Urgent visit • Young adult • Musculoskeletal","scenario":"Mr. Orji is a 30-year-old man who jammed his right middle finger on a basketball yesterday. The tip of the finger now droops and he cannot actively straighten it, although it can be straightened passively. The joint near the fingernail is swollen and tender on the back. The rest of the finger moves normally.","qs":[{"n":805,"t":"hot","visit":"Visit 1","s":"The FNP suspects a mallet finger. **Click the joint that is injured.**","answer":"A","c":"Mallet finger is an injury to the terminal extensor tendon at the distal interphalangeal (DIP) joint, either a tendon rupture or an avulsion fracture of the distal phalanx, caused by forced flexion of an extended fingertip (often from a ball). The fingertip droops and cannot be actively extended. An x-ray checks for an avulsion fracture or joint subluxation.","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 400 320\" width=\"100%\" height=\"auto\"><rect width=\"400\" height=\"320\" fill=\"none\"/><rect x=\"112\" y=\"64\" width=\"30\" height=\"132\" rx=\"14\" fill=\"var(--skin)\" stroke=\"var(--diagram-ink)\" stroke-width=\"2.2\"/><rect x=\"152\" y=\"38\" width=\"30\" height=\"158\" rx=\"14\" fill=\"var(--skin)\" stroke=\"var(--diagram-ink)\" stroke-width=\"2.2\"/><rect x=\"192\" y=\"46\" width=\"30\" height=\"150\" rx=\"14\" fill=\"var(--skin)\" stroke=\"var(--diagram-ink)\" stroke-width=\"2.2\"/><rect x=\"232\" y=\"76\" width=\"30\" height=\"120\" rx=\"14\" fill=\"var(--skin)\" stroke=\"var(--diagram-ink)\" stroke-width=\"2.2\"/><path d=\"M 104 180 L 270 180 Q 282 250 262 300 L 128 300 Q 100 250 104 180 Z\" fill=\"var(--skin)\" stroke=\"var(--diagram-ink)\" stroke-width=\"2.2\"/>\n<line x1=\"116\" y1=\"98\" x2=\"138\" y2=\"98\" stroke=\"var(--diagram-ink)\" stroke-width=\"1.5\" stroke-opacity=\"0.6\"/><line x1=\"116\" y1=\"140\" x2=\"138\" y2=\"140\" stroke=\"var(--diagram-ink)\" stroke-width=\"1.5\" stroke-opacity=\"0.6\"/><line x1=\"156\" y1=\"72\" x2=\"178\" y2=\"72\" stroke=\"var(--diagram-ink)\" stroke-width=\"1.5\" stroke-opacity=\"0.6\"/><line x1=\"156\" y1=\"114\" x2=\"178\" y2=\"114\" stroke=\"var(--diagram-ink)\" stroke-width=\"1.5\" stroke-opacity=\"0.6\"/><line x1=\"196\" y1=\"80\" x2=\"218\" y2=\"80\" stroke=\"var(--diagram-ink)\" stroke-width=\"1.5\" stroke-opacity=\"0.6\"/><line x1=\"196\" y1=\"122\" x2=\"218\" y2=\"122\" stroke=\"var(--diagram-ink)\" stroke-width=\"1.5\" stroke-opacity=\"0.6\"/><line x1=\"236\" y1=\"110\" x2=\"258\" y2=\"110\" stroke=\"var(--diagram-ink)\" stroke-width=\"1.5\" stroke-opacity=\"0.6\"/><line x1=\"236\" y1=\"152\" x2=\"258\" y2=\"152\" stroke=\"var(--diagram-ink)\" stroke-width=\"1.5\" stroke-opacity=\"0.6\"/>\n<path d=\"M 106 214 Q 70 196 52 150 Q 44 128 62 122 Q 80 120 92 150 Q 100 170 114 186\" fill=\"var(--skin)\" stroke=\"var(--diagram-ink)\" stroke-width=\"2.2\"/>\n<line x1=\"134\" y1=\"300\" x2=\"132\" y2=\"316\" stroke=\"var(--diagram-ink)\" stroke-width=\"2\"/><line x1=\"258\" y1=\"300\" x2=\"262\" y2=\"316\" stroke=\"var(--diagram-ink)\" stroke-width=\"2\"/>\n<text x=\"200\" y=\"22\" font-family=\"Arial, sans-serif\" font-size=\"12\" font-weight=\"700\" fill=\"var(--diagram-ink)\" text-anchor=\"middle\">Right hand — dorsal (back) view</text><g class=\"zone\" data-id=\"A\" tabindex=\"0\" role=\"button\" aria-label=\"Area A\">\n<circle cx=\"167\" cy=\"72\" r=\"15\" fill=\"var(--zone-fill)\" stroke=\"var(--zone-ink)\" stroke-width=\"2.5\"/>\n<text x=\"167\" y=\"77.5\" text-anchor=\"middle\" font-family=\"Georgia, 'Times New Roman', serif\" font-size=\"16\" font-weight=\"700\" fill=\"var(--zone-ink)\">A</text></g><g class=\"zone\" data-id=\"B\" tabindex=\"0\" role=\"button\" aria-label=\"Area B\">\n<circle cx=\"167\" cy=\"116\" r=\"15\" fill=\"var(--zone-fill)\" stroke=\"var(--zone-ink)\" stroke-width=\"2.5\"/>\n<text x=\"167\" y=\"121.5\" text-anchor=\"middle\" font-family=\"Georgia, 'Times New Roman', serif\" font-size=\"16\" font-weight=\"700\" fill=\"var(--zone-ink)\">B</text></g><g class=\"zone\" data-id=\"C\" tabindex=\"0\" role=\"button\" aria-label=\"Area C\">\n<circle cx=\"207\" cy=\"184\" r=\"15\" fill=\"var(--zone-fill)\" stroke=\"var(--zone-ink)\" stroke-width=\"2.5\"/>\n<text x=\"207\" y=\"189.5\" text-anchor=\"middle\" font-family=\"Georgia, 'Times New Roman', serif\" font-size=\"16\" font-weight=\"700\" fill=\"var(--zone-ink)\">C</text></g><g class=\"zone\" data-id=\"D\" tabindex=\"0\" role=\"button\" aria-label=\"Area D\">\n<circle cx=\"196\" cy=\"288\" r=\"15\" fill=\"var(--zone-fill)\" stroke=\"var(--zone-ink)\" stroke-width=\"2.5\"/>\n<text x=\"196\" y=\"293.5\" text-anchor=\"middle\" font-family=\"Georgia, 'Times New Roman', serif\" font-size=\"16\" font-weight=\"700\" fill=\"var(--zone-ink)\">D</text></g><g class=\"zone\" data-id=\"E\" tabindex=\"0\" role=\"button\" aria-label=\"Area E\">\n<circle cx=\"252\" cy=\"230\" r=\"15\" fill=\"var(--zone-fill)\" stroke=\"var(--zone-ink)\" stroke-width=\"2.5\"/>\n<text x=\"252\" y=\"235.5\" text-anchor=\"middle\" font-family=\"Georgia, 'Times New Roman', serif\" font-size=\"16\" font-weight=\"700\" fill=\"var(--zone-ink)\">E</text></g></svg>"},{"n":806,"t":"mc","visit":"Visit 1 (continued)","s":"What is the **standard** treatment for his closed mallet finger?","opts":["Splint the whole hand in a fist for 1 week","Splint the DIP joint in extension for 6–8 weeks","Begin bending exercises immediately","Buddy-tape the finger for 3 days only"],"correctIdx":[1],"answer":"B","c":"Most closed mallet injuries are treated with continuous splinting of the DIP joint in full extension (or slight hyperextension) for 6–8 weeks, followed by night splinting for several more weeks, leaving the PIP joint free. The DIP must stay straight at all times, even when changing the splint; any flexion restarts the healing period. Large fractures or subluxation need hand surgery referral."},{"n":807,"t":"mc","visit":"Visit 2 (2 months later)","s":"His friend jammed a finger and now has a **flexed PIP joint with a hyperextended DIP** joint. What injury is this?","opts":["A jersey finger from deep flexor avulsion","A boutonnière deformity from central slip injury","A mallet finger from terminal tendon injury","A gamekeeper thumb from ligament injury"],"correctIdx":[1],"answer":"B","c":"A boutonnière deformity (PIP flexion with DIP hyperextension) results from injury to the central slip of the extensor tendon at the PIP joint, often after a jammed finger. It needs splinting of the PIP joint in extension and referral. Jersey finger (avulsion of the flexor digitorum profundus, often the ring finger) causes inability to flex the DIP and needs prompt surgical repair. Gamekeeper thumb is an ulnar collateral ligament injury."}]},{"no":270,"batch":11,"title":"Ava: Breathless During Soccer","setting":"Sports physical • Adolescent • Respiratory","scenario":"Ava is a 15-year-old soccer player who develops coughing, chest tightness and wheezing 5–10 minutes into hard running, especially on cold days. Symptoms peak about 10 minutes after she stops and resolve within an hour. She has no symptoms at rest, at night or with colds. Her lung examination and resting spirometry are normal.","qs":[{"n":808,"t":"mc","visit":"Visit 1","s":"What is the **most likely** diagnosis?","opts":["Vocal cord dysfunction with stridor","Being out of shape (deconditioning)","Exercise-induced bronchoconstriction","Hypertrophic cardiomyopathy symptoms"],"correctIdx":[2],"answer":"C","c":"Exercise-induced bronchoconstriction causes cough, wheeze, chest tightness and dyspnea that begin during or shortly after vigorous exercise, peak 5–15 minutes after stopping and resolve within an hour, often worse in cold, dry air. Resting spirometry may be normal; an exercise challenge or bronchoprovocation test can confirm it. Vocal cord dysfunction causes inspiratory stridor that resolves quickly after stopping exercise."},{"n":809,"t":"mc","visit":"Visit 1 (continued)","s":"What is the **recommended** preventive treatment?","opts":["A daily oral antibiotic during the season","Albuterol 1 hour after exercise is finished","An oral steroid burst before each game","Albuterol 2 puffs about 15 minutes before exercise"],"correctIdx":[3],"answer":"D","c":"A short-acting beta-agonist (albuterol) taken 5–20 minutes before exercise prevents symptoms for 2–4 hours. As-needed ICS–formoterol before exercise is an alternative in current guidelines. A gradual warm-up and covering the mouth in cold weather help. If she needs pre-treatment daily, or has symptoms at other times, she should be evaluated for underlying asthma and daily controller therapy."},{"n":810,"t":"sata","visit":"Visit 1 (continued)","s":"Which signs during exercise mean she should **stop and seek urgent care**? **Select all that apply.**","opts":["Bluish lips or fingernails","Feeling tired after a long game","Mild cough that settles with rest","No relief after using her rescue inhaler","Difficulty speaking in full sentences"],"correctIdx":[0,3,4],"answer":"A, D, E","c":"Signs of a severe asthma attack include difficulty speaking, retractions, cyanosis, severe breathlessness, drowsiness or confusion, and lack of response to a rescue inhaler. These need emergency care. She should have an asthma action plan and her coach should know where her inhaler is kept. Mild cough that resolves with rest and tiredness after a game are expected."}]},{"no":271,"batch":11,"title":"Kwame: Not Growing Like His Friends","setting":"Primary care clinic • Adolescent • Endocrine / Development","scenario":"Kwame is a 14-year-old boy who is upset that he is shorter than his friends and has no pubic hair or voice change. His height has tracked along the 10th percentile with a normal growth rate. Testicular volume is 3 mL (prepubertal). His father did not start puberty until age 16 and is now of average height. Bone age is 12 years. He has normal sense of smell and no chronic symptoms.","qs":[{"n":811,"t":"mc","visit":"Visit 1","s":"When is male puberty considered **delayed**?","opts":["No testicular enlargement by age 14","No facial hair by the age of 12","No voice change by the age of 11","No growth spurt by the age of 10"],"correctIdx":[0],"answer":"A","c":"Puberty in boys is considered delayed if there is no testicular enlargement (volume of 4 mL or more, or length of 2.5 cm or more) by age 14. In girls, it is delayed if there is no breast development by age 13. Testicular enlargement is the first sign of male puberty, followed by pubic hair, penile growth, the growth spurt and voice change."},{"n":812,"t":"mc","visit":"Visit 1 (continued)","s":"What is the **most likely** cause of Kwame's delayed puberty?","opts":["Constitutional delay of growth and puberty","Klinefelter syndrome (47,XXY)","Kallmann syndrome with anosmia","A pituitary tumor pressing on the gland"],"correctIdx":[0],"answer":"A","c":"Constitutional delay of growth and puberty is the most common cause of delayed puberty, especially in boys. It features short stature with a normal growth rate, a delayed bone age, a family history of \"late bloomers,\" and eventual normal puberty and adult height. Kallmann syndrome causes hypogonadotropic hypogonadism with anosmia, and Klinefelter syndrome causes small firm testes with tall stature."},{"n":813,"t":"mc","visit":"Visit 1 (continued)","s":"Kwame is distressed about his appearance. What can be **offered**?","opts":["Anabolic steroids from the gym to build muscle","High-dose growth hormone injections for 5 years","Reassurance, plus brief low-dose testosterone if needed","Surgery to place testicular implants this year"],"correctIdx":[2],"answer":"C","c":"Most boys with constitutional delay need only reassurance and monitoring. For those with significant psychosocial distress, a pediatric endocrinologist may offer a short course (3–6 months) of low-dose testosterone, which jump-starts puberty without compromising adult height. Psychosocial support is important, and anabolic steroid misuse should be discouraged."}]},{"no":272,"batch":11,"title":"Jordan: A Painful Lump Above the Tailbone","setting":"Urgent visit • Adolescent • Dermatology / Surgery","scenario":"Jordan is a 17-year-old hairy, overweight boy who sits for long hours gaming. For 3 days he has had a painful, red, warm, fluctuant swelling at the top of the buttock crease, slightly off the midline, with small pits in the midline of the crease. He has a low-grade fever. He had a similar but smaller episode 6 months ago that drained on its own.","qs":[{"n":814,"t":"mc","visit":"Visit 1","s":"What is the **most likely** diagnosis?","opts":["Pilonidal abscess","Hidradenitis flare","Perianal abscess","Spina bifida cyst"],"correctIdx":[0],"answer":"A","c":"Pilonidal disease is an infection of the skin and subcutaneous tissue in the natal (gluteal) cleft, often caused by hair penetrating the skin. It is most common in young men who are hairy, overweight or sit for long periods. Midline pits are characteristic, and an acute abscess presents as a painful, fluctuant swelling, often just off the midline. A perianal abscess is next to the anus."},{"n":815,"t":"mc","visit":"Visit 1 (continued)","s":"What is the **most appropriate** treatment of his acute abscess?","opts":["Oral antibiotics alone without any drainage","Incision and drainage, placed off the midline","Immediate wide surgical excision in clinic","Warm compresses only for another 2 weeks"],"correctIdx":[1],"answer":"B","c":"An acute pilonidal abscess is treated with incision and drainage, ideally with the incision placed off the midline to promote healing. Antibiotics are added only for surrounding cellulitis, systemic signs or immunocompromise. Definitive surgery (excision of the sinus tracts) is considered for chronic or recurrent disease once the acute infection has settled."},{"n":816,"t":"sata","visit":"Visit 2 (after healing)","s":"Which measures help **prevent recurrence**? **Select all that apply.**","opts":["Shaving the area with a dull blade daily","Wearing tight synthetic underwear","Keeping the cleft clean and dry","Regular hair removal in the area","Avoiding prolonged sitting"],"correctIdx":[2,3,4],"answer":"C, D, E","c":"Recurrence of pilonidal disease is common. Prevention includes regular hair removal in the natal cleft (laser hair removal or clipping; shaving can irritate the skin), keeping the area clean and dry, weight loss, and avoiding prolonged sitting. Tight synthetic clothing increases moisture and friction."}]},{"no":273,"batch":11,"title":"Maya: Won't Use Her Arm After a Tug","setting":"Urgent visit • Toddler • Musculoskeletal","scenario":"Maya is a 2-year-old girl who started crying and stopped using her left arm after her father pulled her up by the hand to stop her from falling at a curb. She holds the arm close to her body with the elbow slightly bent and the forearm turned palm down. There is no swelling, bruising or deformity, and she is not tender over the bones. She will not reach for a toy with that arm.","qs":[{"n":817,"t":"mc","visit":"Visit 1","s":"What is the **most likely** diagnosis?","opts":["Supracondylar fracture of the humerus","Clavicle fracture from a fall on the arm","Septic arthritis of the left elbow joint","Radial head subluxation (nursemaid elbow)"],"correctIdx":[3],"answer":"D","c":"Radial head subluxation (nursemaid elbow) occurs in children aged 1–4 years when a sudden pull on an extended, pronated arm causes the annular ligament to slip over the radial head. The child refuses to use the arm and holds it slightly flexed and pronated, without swelling or deformity. A supracondylar fracture follows a fall on an outstretched hand and causes swelling and tenderness; it needs x-rays."},{"n":818,"t":"ord","visit":"Visit 1 (continued)","s":"**Place the steps of the supination–flexion reduction maneuver in the correct order.**","items":["Step 1","Step 2","Step 3","Step 4"],"tgts":["Hold the elbow with your thumb over the radial head","Fully flex the elbow while keeping it supinated","Supinate the forearm (turn the palm up)","Feel for a click and watch her use the arm within minutes"],"map":[0,2,1,3],"answer":"A, C, B, D","c":"In the supination–flexion technique, the examiner supports the elbow with a thumb over the radial head, supinates the forearm and then fully flexes the elbow; a click is often felt as the ligament returns to place. The hyperpronation technique (pronating the forearm while holding the elbow) is equally or more successful. Most children begin using the arm normally within 5–15 minutes. No imaging is needed for a typical history and examination."},{"n":819,"t":"mc","visit":"Visit 1 (continued)","s":"What should the FNP teach her parents about **prevention**?","opts":["Avoid all playground activity until age 5","Avoid lifting or swinging her by the hands or wrists","Keep her arm in a sling for the next 6 weeks","Give her calcium supplements to strengthen it"],"correctIdx":[1],"answer":"B","c":"Nursemaid elbow often recurs, so parents should avoid lifting, pulling or swinging the child by the hands or wrists and instead lift under the arms. No sling is needed after a successful reduction. The risk decreases as the child grows and the annular ligament strengthens, usually by age 5."}]},{"no":274,"batch":11,"title":"Darnell: Patchy Hair Loss With Scaling","setting":"Primary care clinic • School-age child • Dermatology","scenario":"Darnell is a 6-year-old Black boy with 6 weeks of round, scaly patches of hair loss on his scalp with broken hairs that look like \"black dots.\" He has tender, enlarged lymph nodes at the back of his neck. His younger brother has a similar patch. Antifungal shampoo bought at the pharmacy has not helped. A KOH prep of plucked hairs shows fungal spores.","qs":[{"n":820,"t":"mc","visit":"Visit 1","s":"What is the **most likely** diagnosis?","opts":["Seborrheic dermatitis","Tinea capitis (scalp)","Alopecia areata patches","Hair-pulling disorder"],"correctIdx":[1],"answer":"B","c":"Tinea capitis, a dermatophyte infection of the scalp and hair (most often Trichophyton tonsurans), is most common in school-age children, especially Black children. It causes scaly patches of hair loss, broken hairs (\"black dots\") and often occipital or posterior cervical lymphadenopathy; a boggy, inflamed kerion can develop. Alopecia areata causes smooth patches without scale."},{"n":821,"t":"mc","visit":"Visit 1 (continued)","s":"What is the **appropriate** treatment?","opts":["A topical steroid lotion applied twice daily","Oral amoxicillin for 10 days as first choice","Oral terbinafine or griseofulvin for several weeks","Topical clotrimazole cream alone for 2 weeks"],"correctIdx":[2],"answer":"C","c":"Tinea capitis requires oral antifungal therapy because topical agents do not penetrate the hair follicle. Griseofulvin (6–8 weeks or longer, taken with fatty food) or terbinafine (4–6 weeks, often preferred for Trichophyton) are used. Selenium sulfide or ketoconazole shampoo reduces spread. Household contacts should be examined and treated if infected. Children can attend school once treatment starts."},{"n":822,"t":"match","visit":"Visit 2 (teaching)","s":"**Drag each fungal infection to its correct treatment.** One option will not be used.","items":["Tinea capitis","Tinea corporis","Tinea versicolor"],"tgts":["Selenium sulfide shampoo or ketoconazole applied to the skin","Topical azole or terbinafine cream for 2–4 weeks","Oral nystatin swished and swallowed","Oral terbinafine or griseofulvin for weeks"],"map":[3,1,0],"answer":"1–D, 2–B, 3–A","c":"Tinea capitis needs oral antifungals. Tinea corporis (ringworm of the body) usually responds to topical azoles or terbinafine continued for 1–2 weeks after clearing. Tinea versicolor (Malassezia) is treated with selenium sulfide or ketoconazole shampoo or cream, and pigment changes may take months to fade. Oral nystatin treats oral thrush (Candida)."}]},{"no":275,"batch":11,"title":"Baby Jamal: Crying Every Evening","setting":"Well-child visit • Infant • Development / Behavior","scenario":"Jamal is a 6-week-old boy whose mother says he cries inconsolably for 3–4 hours most evenings, pulling up his legs and clenching his fists. Between episodes he feeds well, is content and has gained weight along the 50th percentile. He has no fever, vomiting, diarrhea or blood in his stools, and his examination is normal. His mother is exhausted and says she \"feels like she could snap.\"","qs":[{"n":823,"t":"mc","visit":"Visit 1","s":"What is the **most likely** diagnosis?","opts":["Infantile colic","Milk protein allergy","Intussusception","Pyloric stenosis"],"correctIdx":[0],"answer":"A","c":"Infantile colic is recurrent, prolonged crying or fussiness without an obvious cause in a healthy, thriving infant under 5 months, classically more than 3 hours a day, 3 days a week, for 3 weeks (the \"rule of threes\"). It typically peaks around 6 weeks and resolves by 3–4 months. Red flags such as fever, vomiting, blood in stool or poor weight gain point to other causes."},{"n":824,"t":"mc","visit":"Visit 1 (continued)","s":"What is the **most important** response to his mother's statement?","opts":["Advise her to shake him gently to stop the crying","Make a plan for safe breaks, including walking away briefly","Tell her that every mother feels like this sometimes","Suggest she give him diphenhydramine at bedtime"],"correctIdx":[1],"answer":"B","c":"Inconsolable crying is the most common trigger for abusive head trauma (shaken baby syndrome). Parents should be told it is normal to feel frustrated and taught that if they feel overwhelmed they can place the baby safely on his back in the crib, walk away for a few minutes and call someone for support. Postpartum depression screening and support resources are also important. Never shake a baby, and sedating medicines are unsafe for infants."},{"n":825,"t":"sata","visit":"Visit 1 (continued)","s":"Which strategies may help **soothe** a colicky infant? **Select all that apply.**","opts":["Adding cereal to his bottle","Rhythmic rocking or a car ride","White noise or shushing sounds","Swaddling for comfort while awake","Simethicone proven to cure colic"],"correctIdx":[1,2,3],"answer":"B, C, D","c":"Soothing measures include rhythmic motion (rocking, walking, car rides), white noise, swaddling while awake (always placed on the back to sleep with hips free to move), pacifiers and skin-to-skin contact. A probiotic (Lactobacillus reuteri) may help breastfed infants. Simethicone has not been shown to be effective, and cereal in a bottle is not recommended. Reassurance that colic resolves is important."}]},{"no":276,"batch":12,"title":"Mrs. Hartley: White, Itchy Vulvar Patches","setting":"Women's health visit • Older adult • Gynecology / Dermatology","scenario":"Mrs. Hartley is a 69-year-old woman with intense vulvar itching for a year, worse at night, and pain with intercourse. She has used several over-the-counter yeast creams without relief. On examination there are thin, white, crinkled, shiny plaques around the vulva and anus in a figure-of-eight pattern, with some loss of the labia minora and small fissures. There is no discrete mass or ulcer.","qs":[{"n":826,"t":"mc","visit":"Visit 1","s":"What is the **most likely** diagnosis?","opts":["Vulvovaginal candidiasis","Vulvar lichen sclerosus","Allergic contact dermatitis","Atrophic vaginitis alone"],"correctIdx":[1],"answer":"B","c":"Lichen sclerosus is a chronic inflammatory skin disease most common in postmenopausal women. It causes intense vulvar itching and pain, with thin, white, crinkled (\"cigarette paper\") plaques, often in a figure-of-eight pattern around the vulva and anus, and can lead to scarring, loss of the labia minora and narrowing of the introitus. It is often misdiagnosed as a yeast infection."},{"n":827,"t":"mc","visit":"Visit 1 (continued)","s":"What is the **first-line** treatment?","opts":["A super-potent topical steroid such as clobetasol","Topical estrogen cream alone applied each night","A low-potency hydrocortisone cream as needed","An oral antifungal taken once a week for a year"],"correctIdx":[0],"answer":"A","c":"Super-potent topical corticosteroids such as clobetasol propionate 0.05% ointment are first-line for lichen sclerosus, applied daily until remission (often 6–12 weeks), then tapered to maintenance. They relieve symptoms and reduce scarring and possibly cancer risk. A biopsy is recommended if the diagnosis is uncertain or there are atypical features."},{"n":828,"t":"mc","visit":"Visit 1 (continued)","s":"Why does Mrs. Hartley need **long-term** follow-up?","opts":["The condition always spreads to the internal organs","There is an increased risk of vulvar squamous cell cancer","The condition is contagious to her partner","The steroid will cause permanent diabetes in her"],"correctIdx":[1],"answer":"B","c":"Lichen sclerosus carries a small increased risk (about 2–5%) of vulvar squamous cell carcinoma. Patients need lifelong follow-up, at least yearly, and any persistent ulcer, thickened area, nodule or lesion not responding to treatment should be biopsied. Lichen sclerosus is not contagious."}]},{"no":277,"batch":12,"title":"Mr. Garrido: Restless, Sweaty and Twitching","setting":"Urgent visit • Older adult • Pharmacology / Neurology","scenario":"Mr. Garrido is a 70-year-old man taking sertraline 150 mg daily for depression. Two days ago an urgent care clinic prescribed tramadol for back pain, and he also takes dextromethorphan cough syrup. Today he is agitated and confused, with sweating, diarrhea, tremor, dilated pupils and HR 118. Temperature is 38.6 °C. Reflexes are brisk with inducible clonus, most marked in the legs.","qs":[{"n":829,"t":"mc","visit":"Visit 1","s":"What is the **most likely** diagnosis?","opts":["Serotonin syndrome (toxicity)","Alcohol withdrawal syndrome","Neuroleptic malignant syndrome","Anticholinergic toxicity"],"correctIdx":[0],"answer":"A","c":"Serotonin syndrome results from excess serotonergic activity, often when serotonergic drugs are combined (SSRIs, SNRIs, tramadol, dextromethorphan, triptans, linezolid, MAOIs). It develops within hours to a day and causes altered mental status, autonomic instability (fever, tachycardia, sweating, diarrhea, mydriasis) and neuromuscular hyperactivity, especially clonus and hyperreflexia, worse in the lower limbs (Hunter criteria)."},{"n":830,"t":"match","visit":"Visit 1 (continued)","s":"**Drag each toxic syndrome to its distinguishing feature.** One option will not be used.","items":["Serotonin syndrome","Neuroleptic malignant syndrome","Anticholinergic toxicity"],"tgts":["Hot, dry, flushed skin with urinary retention and no bowel sounds","Pinpoint pupils with slow, shallow breathing","Slow onset with \"lead-pipe\" rigidity after an antipsychotic","Rapid onset with clonus, hyperreflexia and diarrhea"],"map":[3,2,0],"answer":"1–D, 2–C, 3–A","c":"Serotonin syndrome develops rapidly (within 24 hours) with clonus, hyperreflexia, sweating and diarrhea. Neuroleptic malignant syndrome develops over days after a dopamine antagonist, with lead-pipe rigidity, bradyreflexia, fever and very high CK. Anticholinergic toxicity causes \"hot as a hare, dry as a bone, red as a beet, blind as a bat, mad as a hatter,\" with dry skin, urinary retention and decreased bowel sounds. Pinpoint pupils with respiratory depression suggest opioid toxicity."},{"n":831,"t":"mc","visit":"Visit 1 (continued)","s":"What is the **most important** initial management?","opts":["Add a triptan to help his headache and tremor","Stop all serotonergic drugs and send him for urgent care","Give haloperidol to calm him and send him home","Increase sertraline to treat his agitation quickly"],"correctIdx":[1],"answer":"B","c":"Treatment of serotonin syndrome begins with stopping all serotonergic agents and supportive care (IV fluids, cooling, cardiac monitoring), often in hospital. Benzodiazepines treat agitation and muscle activity, and cyproheptadine, a serotonin antagonist, is used for moderate to severe cases. Severe hyperthermia requires ICU care. Antipsychotics and physical restraints should be avoided."}]},{"no":278,"batch":12,"title":"Mr. Nwachukwu: A Cough With Night Sweats","setting":"Primary care clinic • Older adult • Respiratory / Infectious disease","scenario":"Mr. Nwachukwu is a 74-year-old man with diabetes who emigrated from Nigeria 30 years ago and was never treated for a positive TB skin test. For 2 months he has had a productive cough, occasional blood-streaked sputum, fevers, drenching night sweats and a 15-lb weight loss. A chest x-ray shows an upper lobe infiltrate with a cavity. He lives with his wife and grandson.","qs":[{"n":832,"t":"hot","visit":"Visit 1","s":"Reactivation TB typically involves the upper lung zones. **Click the lobe in which his cavity is most likely located.**","answer":"A","c":"Reactivation (post-primary) pulmonary tuberculosis characteristically involves the apical and posterior segments of the upper lobes, more often on the right, where high oxygen tension favors Mycobacterium tuberculosis, and it frequently forms cavities. Risk factors for reactivation include untreated latent TB, diabetes, older age, HIV, immunosuppression and malnutrition.","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 400 320\" width=\"100%\" height=\"auto\"><rect width=\"400\" height=\"320\" fill=\"none\"/><path d=\"M 120 40 Q 200 20 280 40 L 330 70 Q 352 160 330 300 L 70 300 Q 48 160 70 70 Z\" fill=\"var(--skin)\" stroke=\"var(--diagram-ink)\" stroke-width=\"2.5\"/>\n<path d=\"M 172 40 Q 200 58 228 40\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-width=\"2\"/>\n<path d=\"M 196 62 Q 150 64 86 74\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-width=\"5\" stroke-linecap=\"round\"/>\n<path d=\"M 204 62 Q 250 64 314 74\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-width=\"5\" stroke-linecap=\"round\"/>\n<rect x=\"186\" y=\"66\" width=\"28\" height=\"170\" rx=\"10\" fill=\"var(--diagram-ink)\" fill-opacity=\"0.14\" stroke=\"var(--diagram-ink)\" stroke-width=\"2\"/>\n<path d=\"M 184 96 Q 120 102 86 126\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-opacity=\"0.35\" stroke-width=\"2\"/><path d=\"M 216 96 Q 280 102 314 126\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-opacity=\"0.35\" stroke-width=\"2\"/><path d=\"M 184 122 Q 120 128 90 152\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-opacity=\"0.35\" stroke-width=\"2\"/><path d=\"M 216 122 Q 280 128 310 152\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-opacity=\"0.35\" stroke-width=\"2\"/><path d=\"M 184 148 Q 120 154 94 178\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-opacity=\"0.35\" stroke-width=\"2\"/><path d=\"M 216 148 Q 280 154 306 178\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-opacity=\"0.35\" stroke-width=\"2\"/><path d=\"M 184 174 Q 120 180 98 204\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-opacity=\"0.35\" stroke-width=\"2\"/><path d=\"M 216 174 Q 280 180 302 204\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-opacity=\"0.35\" stroke-width=\"2\"/><path d=\"M 184 200 Q 120 206 102 230\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-opacity=\"0.35\" stroke-width=\"2\"/><path d=\"M 216 200 Q 280 206 298 230\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-opacity=\"0.35\" stroke-width=\"2\"/><path d=\"M 184 226 Q 120 232 106 256\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-opacity=\"0.35\" stroke-width=\"2\"/><path d=\"M 216 226 Q 280 232 294 256\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-opacity=\"0.35\" stroke-width=\"2\"/>\n<line x1=\"288\" y1=\"70\" x2=\"288\" y2=\"290\" stroke=\"var(--diagram-ink)\" stroke-width=\"1.5\" stroke-dasharray=\"5 5\" stroke-opacity=\"0.6\"/>\n<text x=\"292\" y=\"286\" font-family=\"Arial, sans-serif\" font-size=\"11\" font-weight=\"400\" fill=\"var(--diagram-ink)\" text-anchor=\"start\">MCL</text><text x=\"40\" y=\"20\" font-family=\"Arial, sans-serif\" font-size=\"12\" font-weight=\"700\" fill=\"var(--diagram-ink)\" text-anchor=\"start\">Patient's RIGHT</text><text x=\"268\" y=\"20\" font-family=\"Arial, sans-serif\" font-size=\"12\" font-weight=\"700\" fill=\"var(--diagram-ink)\" text-anchor=\"start\">Patient's LEFT</text><g class=\"zone\" data-id=\"A\" tabindex=\"0\" role=\"button\" aria-label=\"Area A\">\n<circle cx=\"120\" cy=\"112\" r=\"15\" fill=\"var(--zone-fill)\" stroke=\"var(--zone-ink)\" stroke-width=\"2.5\"/>\n<text x=\"120\" y=\"117.5\" text-anchor=\"middle\" font-family=\"Georgia, 'Times New Roman', serif\" font-size=\"16\" font-weight=\"700\" fill=\"var(--zone-ink)\">A</text></g><g class=\"zone\" data-id=\"B\" tabindex=\"0\" role=\"button\" aria-label=\"Area B\">\n<circle cx=\"280\" cy=\"104\" r=\"15\" fill=\"var(--zone-fill)\" stroke=\"var(--zone-ink)\" stroke-width=\"2.5\"/>\n<text x=\"280\" y=\"109.5\" text-anchor=\"middle\" font-family=\"Georgia, 'Times New Roman', serif\" font-size=\"16\" font-weight=\"700\" fill=\"var(--zone-ink)\">B</text></g><g class=\"zone\" data-id=\"C\" tabindex=\"0\" role=\"button\" aria-label=\"Area C\">\n<circle cx=\"120\" cy=\"190\" r=\"15\" fill=\"var(--zone-fill)\" stroke=\"var(--zone-ink)\" stroke-width=\"2.5\"/>\n<text x=\"120\" y=\"195.5\" text-anchor=\"middle\" font-family=\"Georgia, 'Times New Roman', serif\" font-size=\"16\" font-weight=\"700\" fill=\"var(--zone-ink)\">C</text></g><g class=\"zone\" data-id=\"D\" tabindex=\"0\" role=\"button\" aria-label=\"Area D\">\n<circle cx=\"300\" cy=\"260\" r=\"15\" fill=\"var(--zone-fill)\" stroke=\"var(--zone-ink)\" stroke-width=\"2.5\"/>\n<text x=\"300\" y=\"265.5\" text-anchor=\"middle\" font-family=\"Georgia, 'Times New Roman', serif\" font-size=\"16\" font-weight=\"700\" fill=\"var(--zone-ink)\">D</text></g><g class=\"zone\" data-id=\"E\" tabindex=\"0\" role=\"button\" aria-label=\"Area E\">\n<circle cx=\"100\" cy=\"260\" r=\"15\" fill=\"var(--zone-fill)\" stroke=\"var(--zone-ink)\" stroke-width=\"2.5\"/>\n<text x=\"100\" y=\"265.5\" text-anchor=\"middle\" font-family=\"Georgia, 'Times New Roman', serif\" font-size=\"16\" font-weight=\"700\" fill=\"var(--zone-ink)\">E</text></g></svg>"},{"n":833,"t":"sata","visit":"Visit 1 (continued)","s":"Which actions are **appropriate** now? **Select all that apply.**","opts":["Report the suspected case to the health department","Delay all testing until he finishes antibiotics","Send him home without telling his household","Place a mask on him and use airborne precautions","Collect three sputum samples for AFB smear, culture and NAAT"],"correctIdx":[0,3,4],"answer":"A, D, E","c":"A patient with suspected active pulmonary TB should wear a surgical mask and be placed in an airborne infection isolation room, with staff using N95 respirators. Three sputum specimens (at least 8 hours apart, one early morning) are sent for AFB smear, culture and nucleic acid amplification testing. TB is reportable, and the health department leads contact investigation of household members. HIV testing is also recommended."},{"n":834,"t":"mc","visit":"Visit 2 (diagnosis confirmed)","s":"What is the **standard** initial treatment for drug-susceptible pulmonary TB?","opts":["A single dose of azithromycin then a recheck","Isoniazid alone taken daily for 9 months","Amoxicillin–clavulanate for 14 days total","Rifampin, isoniazid, pyrazinamide and ethambutol"],"correctIdx":[3],"answer":"D","c":"Drug-susceptible active TB is treated with a 2-month intensive phase of rifampin, isoniazid, pyrazinamide and ethambutol (RIPE), followed by 4 months of rifampin and isoniazid, usually with directly observed therapy. Pyridoxine is given with isoniazid to prevent neuropathy, especially with diabetes. Liver tests are monitored, and ethambutol requires visual acuity and color vision checks. Isoniazid alone is a latent TB regimen."}]},{"no":279,"batch":12,"title":"Mrs. Bassey: Found Confused on a Hot Day","setting":"Home visit → emergency • Older adult • Environmental emergency","scenario":"Mrs. Bassey is an 82-year-old woman who lives alone in a top-floor apartment without air conditioning. During a heat wave her neighbor found her confused and lethargic. Her skin is hot and dry, temperature 40.6 °C, HR 124, BP 96/58, RR 26. She takes hydrochlorothiazide, metoprolol and benztropine for drug-induced tremor.","qs":[{"n":835,"t":"mc","visit":"Visit 1","s":"What is the **most likely** diagnosis?","opts":["Classic (nonexertional) heat stroke","Mild heat exhaustion that resolves with rest","Heat cramps from loss of salt in sweat","Simple dehydration from not drinking water"],"correctIdx":[0],"answer":"A","c":"Heat stroke is a core temperature above 40 °C with central nervous system dysfunction (confusion, seizures, coma). Classic heat stroke occurs during heat waves in older adults, people with chronic illness, people living alone and those taking medications that impair heat loss; the skin is often hot and dry. Heat exhaustion causes weakness, nausea and heavy sweating with a temperature below 40 °C and normal mental status."},{"n":836,"t":"ord","visit":"Visit 1 (continued)","s":"**Place the actions for suspected heat stroke in the correct order.**","items":["Step 1","Step 2","Step 3","Step 4"],"tgts":["Begin rapid cooling with ice packs, wet sheets and fanning","Check airway, breathing and circulation and monitor","Call 911 and move her to a cooler area","Continue cooling during transport to the hospital"],"map":[2,0,1,3],"answer":"C, A, B, D","c":"Heat stroke is a medical emergency; mortality rises with each minute of hyperthermia. After calling 911 and moving the patient out of the heat, rapid cooling begins immediately (cold-water immersion is most effective for exertional heat stroke; evaporative cooling with misting and fanning, plus ice packs to the neck, axillae and groin, are often used for older adults). Airway and circulation are supported, and cooling continues until the temperature reaches about 39 °C. Antipyretics are ineffective."},{"n":837,"t":"sata","visit":"Visit 2 (after recovery)","s":"Which of her medications **increase** the risk of heat illness? **Select all that apply.**","opts":["Metoprolol","Acetaminophen as needed","Benztropine","Hydrochlorothiazide","A daily multivitamin"],"correctIdx":[0,2,3],"answer":"A, C, D","c":"Diuretics cause volume depletion, beta-blockers limit the heart's ability to increase output and reduce skin blood flow, and anticholinergics such as benztropine reduce sweating. Antipsychotics, antihistamines, tricyclic antidepressants and stimulants also increase risk. Heat-health plans include access to air-conditioned spaces, regular check-ins on isolated older adults, adequate fluids and reviewing medications during heat waves."}]},{"no":280,"batch":12,"title":"Mr. Oyelowo: Sudden Weakness at Breakfast","setting":"Primary care clinic → emergency • Older adult • Neurology","scenario":"Mr. Oyelowo is a 71-year-old man with hypertension and atrial fibrillation who is waiting in the clinic for a routine visit. At 9:10 a.m. his wife notices his speech is suddenly slurred, the left side of his face droops and he cannot lift his left arm. He was normal at 9:00 a.m. when they arrived. His fingerstick glucose is 112 mg/dL.","qs":[{"n":838,"t":"mc","visit":"Visit 1","s":"Which signs make up the **BE-FAST** stroke recognition tool?","opts":["Breathing, Energy, Fever, Appetite, Sleep, Thirst","Bleeding, Edema, Fatigue, Anemia, Skin, Temperature","Bowels, Eating, Feelings, Activity, Sleep, Taste","Balance, Eyes, Face, Arms, Speech, Time to call 911"],"correctIdx":[3],"answer":"D","c":"BE-FAST stands for Balance (sudden loss of balance), Eyes (sudden vision loss), Face (facial droop), Arms (arm weakness), Speech (slurred or abnormal speech) and Time to call 911. Recording the exact time the patient was last known well is essential because it determines eligibility for thrombolysis and thrombectomy."},{"n":839,"t":"ord","visit":"Visit 1 (continued)","s":"**Place the steps of acute stroke care in the correct order.**","items":["Step 1","Step 2","Step 3","Step 4"],"tgts":["Check blood glucose to exclude hypoglycemia","Call 911 and note the time last known well","Give IV thrombolysis if eligible and no bleed is seen","Obtain an emergency non-contrast head CT"],"map":[1,0,3,2],"answer":"B, A, D, C","c":"Suspected stroke requires immediate EMS activation and documentation of last known well time. Hypoglycemia, which can mimic stroke, is excluded with a fingerstick glucose. An emergency non-contrast head CT (often with CT angiography) excludes hemorrhage before IV thrombolysis (alteplase or tenecteplase), usually within 4.5 hours of last known well. Patients with large-vessel occlusion may receive mechanical thrombectomy up to 24 hours in selected cases."},{"n":840,"t":"mc","visit":"Visit 2 (after discharge)","s":"His stroke was caused by an embolism from atrial fibrillation. Which **secondary prevention** is most appropriate?","opts":["No medication if he stays in normal rhythm","Long-term anticoagulation such as apixaban","Aspirin 81 mg alone for the long term","Clopidogrel alone at a higher dose"],"correctIdx":[1],"answer":"B","c":"For cardioembolic stroke from atrial fibrillation, oral anticoagulation (a direct oral anticoagulant such as apixaban is preferred over warfarin) is recommended for secondary prevention, usually started within days depending on stroke size and bleeding risk. Antiplatelet therapy alone is much less effective for AF-related stroke. BP control, a statin and other risk-factor management are also needed."}]},{"no":281,"batch":12,"title":"Mrs. Lindqvist: Diarrhea After Antibiotics","setting":"Primary care clinic • Older adult • Gastrointestinal / Infectious disease","scenario":"Mrs. Lindqvist is a 78-year-old woman who finished a 10-day course of clindamycin for a dental infection a week ago. She now has 6–8 watery, foul-smelling stools a day, crampy lower abdominal pain and a low-grade fever. WBC is 13,500/mm³ and creatinine is at baseline. A stool test for Clostridioides difficile toxin is positive. She takes omeprazole daily.","qs":[{"n":841,"t":"mc","visit":"Visit 1","s":"What is the **recommended** first-line treatment for her non-severe C. difficile infection?","opts":["Loperamide to slow the diarrhea","Oral clindamycin for 10 days","Oral fidaxomicin or oral vancomycin","IV vancomycin for 10 days"],"correctIdx":[2],"answer":"C","c":"IDSA/SHEA guidelines recommend oral fidaxomicin (preferred) or oral vancomycin for 10 days for an initial episode of C. difficile infection. Oral metronidazole is an alternative only when these are unavailable for non-severe cases. IV vancomycin does not reach the colon. Antimotility drugs should be avoided, and the inciting antibiotic should be stopped."},{"n":842,"t":"sata","visit":"Visit 1 (continued)","s":"Which **infection control** measures apply? **Select all that apply.**","opts":["No special precautions are needed at home","Alcohol hand gel alone is enough to kill the spores","Use contact precautions with gowns and gloves","Wash hands with soap and water rather than alcohol gel","Clean surfaces with a sporicidal agent such as bleach"],"correctIdx":[2,3,4],"answer":"C, D, E","c":"C. difficile spores are resistant to alcohol, so handwashing with soap and water is needed to physically remove them. In health care settings, contact precautions (gowns and gloves) and cleaning with sporicidal agents such as diluted bleach are used. At home, household members should wash hands with soap and water and clean bathrooms with bleach-based cleaners."},{"n":843,"t":"mc","visit":"Visit 1 (continued)","s":"Which change could **reduce** her risk of recurrence?","opts":["Starting a long-term proton pump inhibitor","Taking clindamycin again for future dental work","Stopping omeprazole if there is no clear need","Adding a daily broad-spectrum antibiotic"],"correctIdx":[2],"answer":"C","c":"Risk factors for C. difficile and recurrence include antibiotic exposure (especially clindamycin, fluoroquinolones and cephalosporins), older age, hospitalization and proton pump inhibitor use. Stopping unnecessary PPIs and avoiding unnecessary antibiotics reduce risk. Bezlotoxumab, fecal microbiota-based products or a vancomycin taper are options for recurrence."}]},{"no":282,"batch":12,"title":"Mr. Delacroix: Fever and a Tender Prostate","setting":"Urgent visit • Older adult • Genitourinary / Infectious disease","scenario":"Mr. Delacroix is a 66-year-old man with 2 days of fever of 39.2 °C, chills, painful and frequent urination, a weak stream and pain between the scrotum and rectum. He feels unwell but is drinking fluids, and his BP is 132/78. On gentle rectal examination the prostate is warm, swollen and extremely tender. Urinalysis shows many white blood cells and nitrites. He can empty his bladder.","qs":[{"n":844,"t":"mc","visit":"Visit 1","s":"What is the **most likely** diagnosis?","opts":["Acute bacterial prostatitis","Benign prostatic hyperplasia","Chronic pelvic pain syndrome","Uncomplicated cystitis only"],"correctIdx":[0],"answer":"A","c":"Acute bacterial prostatitis causes sudden fever, chills, malaise, dysuria, frequency, obstructive voiding symptoms and perineal or rectal pain, with a warm, boggy, very tender prostate. It is usually caused by gram-negative enteric bacteria such as E. coli. Blood and urine cultures are obtained. Chronic pelvic pain syndrome causes pelvic pain for at least 3 months without infection."},{"n":845,"t":"mc","visit":"Visit 1 (continued)","s":"What should be **avoided** during the examination?","opts":["A gentle digital rectal exam","A bladder scan for residual","Checking his vital signs","Vigorous prostatic massage"],"correctIdx":[3],"answer":"D","c":"In acute bacterial prostatitis, only a gentle digital rectal examination should be done; vigorous prostatic massage is avoided because it is very painful and may cause bacteremia and sepsis. A bladder scan checks for urinary retention, which may need suprapubic rather than urethral catheter drainage in some cases."},{"n":846,"t":"mc","visit":"Visit 1 (continued)","s":"He is stable for outpatient care. Which treatment is **appropriate**?","opts":["Oral amoxicillin for 3 days in total","A single dose of oral fosfomycin today","Nitrofurantoin twice a day for 5 days","A fluoroquinolone or TMP-SMX for 2–6 weeks"],"correctIdx":[3],"answer":"D","c":"Outpatient acute bacterial prostatitis is treated with antibiotics that penetrate prostatic tissue, such as a fluoroquinolone (ciprofloxacin or levofloxacin) or TMP-SMX, guided by culture results and local resistance, typically for 2–4 weeks and up to 6 weeks. Nitrofurantoin and fosfomycin do not reach adequate prostatic tissue levels. Patients with sepsis, retention or inability to take oral medication are hospitalized."}]},{"no":283,"batch":12,"title":"Ms. Moretti: A Tender Thyroid After a Cold","setting":"Primary care clinic • Middle adult • Endocrine","scenario":"Ms. Moretti is a 43-year-old woman who had an upper respiratory infection 3 weeks ago. She now has severe pain in the front of her neck that radiates to her jaw and ears, fever, palpitations, tremor and anxiety. Her thyroid is diffusely enlarged and very tender. TSH is suppressed, free T4 is elevated, ESR is 82 mm/hr, and radioactive iodine uptake is very low.","qs":[{"n":847,"t":"mc","visit":"Visit 1","s":"What is the **most likely** diagnosis?","opts":["Graves disease with a diffuse goiter","Subacute (de Quervain) thyroiditis","Acute suppurative thyroiditis","Toxic multinodular goiter (Plummer)"],"correctIdx":[1],"answer":"B","c":"Subacute granulomatous (de Quervain) thyroiditis typically follows a viral illness and causes a painful, tender thyroid, fever and a high ESR. Inflammation releases stored hormone, causing transient thyrotoxicosis with a low radioactive iodine uptake. Graves disease and toxic nodular goiter cause painless thyrotoxicosis with high uptake. Acute suppurative thyroiditis is a rare bacterial infection, usually with a focal fluctuant mass."},{"n":848,"t":"mc","visit":"Visit 1 (continued)","s":"What is the **most appropriate** treatment?","opts":["Methimazole to block hormone production","Radioactive iodine ablation this month","NSAIDs and a beta-blocker for symptoms","Total thyroidectomy as soon as possible"],"correctIdx":[2],"answer":"C","c":"Subacute thyroiditis is self-limited. NSAIDs (or prednisone for severe pain) treat the inflammation, and a beta-blocker such as propranolol controls adrenergic symptoms. Antithyroid drugs are ineffective because the thyrotoxicosis comes from release of preformed hormone, not increased synthesis. Radioactive iodine and surgery are not indicated."},{"n":849,"t":"mc","visit":"Visit 2 (2 months later)","s":"What is the **usual** course of thyroid function in this condition?","opts":["Hyperthyroid, then hypothyroid, then usually normal","Hypothyroid for life starting immediately","Permanently hyperthyroid without any treatment","Normal throughout the course of the illness"],"correctIdx":[0],"answer":"A","c":"Subacute thyroiditis typically follows a triphasic course: a thyrotoxic phase (weeks), a hypothyroid phase (weeks to months) as the gland recovers, and then return to normal function in most patients. Temporary levothyroxine may be needed during the hypothyroid phase if symptomatic. About 5–15% develop permanent hypothyroidism, so TSH should be monitored. Postpartum and silent thyroiditis follow a similar but painless pattern."}]},{"no":284,"batch":12,"title":"Mr. Petrossian: Heartburn Most Nights","setting":"Primary care clinic • Middle adult • Gastrointestinal","scenario":"Mr. Petrossian is a 50-year-old white man with a BMI of 33 who smokes. He has had burning chest discomfort after meals and a sour taste in his mouth at night several times a week for 7 years. Antacids help briefly. He has no trouble swallowing, weight loss, vomiting, black stools or anemia. His cardiac evaluation last year was normal.","qs":[{"n":850,"t":"mc","visit":"Visit 1","s":"What is the **most appropriate** initial treatment for his GERD?","opts":["An H. pylori eradication regimen as first step","Surgical fundoplication as the initial therapy","A PPI before breakfast for 8 weeks with lifestyle change","An urgent upper endoscopy before any treatment"],"correctIdx":[2],"answer":"C","c":"Typical GERD symptoms without alarm features are treated empirically with an 8-week trial of a proton pump inhibitor taken 30–60 minutes before breakfast, plus lifestyle changes: weight loss, smoking cessation, raising the head of the bed, avoiding meals 2–3 hours before lying down and avoiding personal trigger foods. After a response, the PPI is reduced to the lowest effective dose or stopped."},{"n":851,"t":"sata","visit":"Visit 1 (continued)","s":"Which features would make **upper endoscopy** indicated? **Select all that apply.**","opts":["Heartburn that responds well to a PPI","Occasional heartburn after spicy food","Difficulty swallowing or painful swallowing","Unintentional weight loss or GI bleeding","Iron-deficiency anemia"],"correctIdx":[2,3,4],"answer":"C, D, E","c":"Alarm features requiring endoscopy include dysphagia, odynophagia, weight loss, GI bleeding, iron-deficiency anemia, persistent vomiting and a mass on imaging. Endoscopy is also indicated when symptoms do not respond to a PPI trial. Heartburn that resolves with a PPI and occasional food-triggered symptoms do not require endoscopy."},{"n":852,"t":"mc","visit":"Visit 1 (continued)","s":"Why should Mr. Petrossian be considered for **Barrett esophagus screening**?","opts":["Because he has dysphagia and weight loss already","Because every patient with heartburn needs yearly screening","Chronic GERD plus male sex, white race, obesity and smoking","Because his cardiac evaluation was normal last year"],"correctIdx":[2],"answer":"C","c":"Screening endoscopy for Barrett esophagus may be considered in patients with chronic GERD (5 years or more of frequent symptoms) plus additional risk factors: male sex, age over 50, white race, central obesity, smoking, or a first-degree relative with Barrett esophagus or esophageal adenocarcinoma. Barrett esophagus is a precursor of esophageal adenocarcinoma."}]},{"no":285,"batch":12,"title":"Mrs. Kowalski-Brandt: Pain When Lying on Her Side","setting":"Primary care clinic • Middle adult • Musculoskeletal","scenario":"Mrs. Kowalski-Brandt is a 56-year-old woman who recently started a walking program. For 2 months she has had aching pain over the outer side of her right hip, worse when lying on that side at night, climbing stairs and getting out of a car. There is point tenderness over the greater trochanter. Hip range of motion is full and painless, and she has no groin pain.","qs":[{"n":853,"t":"mc","visit":"Visit 1","s":"What is the **most likely** diagnosis?","opts":["Greater trochanteric pain syndrome","Osteoarthritis of the right hip joint","Lumbar radiculopathy at L5–S1","Avascular necrosis of the femoral head"],"correctIdx":[0],"answer":"A","c":"Greater trochanteric pain syndrome (formerly trochanteric bursitis, now understood mainly as gluteus medius and minimus tendinopathy) causes lateral hip pain worse with lying on the affected side, stairs, prolonged standing and rising from a chair, with point tenderness over the greater trochanter. It is common in middle-aged women. Hip osteoarthritis typically causes groin pain with limited, painful internal rotation."},{"n":854,"t":"mc","visit":"Visit 1 (continued)","s":"What is the **first-line** management?","opts":["Oral antibiotics for a deep hip infection","Immediate total hip replacement surgery","Strict bed rest for 6 weeks without moving","Activity modification and gluteal strengthening"],"correctIdx":[3],"answer":"D","c":"First-line management includes education, activity modification (avoiding lying on the affected side, crossing the legs and prolonged stair climbing), weight loss if needed, NSAIDs and physical therapy focused on progressive gluteal strengthening. Corticosteroid injection gives short-term relief, but exercise therapy gives better long-term outcomes."},{"n":855,"t":"mc","visit":"Visit 1 (continued)","s":"Which finding would suggest **hip osteoarthritis** rather than her current diagnosis?","opts":["Tenderness right over the greater trochanter","Groin pain with limited internal rotation","Lateral hip pain lying on that side at night","Pain when climbing stairs in the outer hip"],"correctIdx":[1],"answer":"B","c":"Hip osteoarthritis usually causes groin or anterior thigh pain, morning stiffness under an hour, and painful, reduced internal rotation and flexion; x-rays show joint space narrowing and osteophytes. Lateral hip pain with trochanteric tenderness and full hip motion points to greater trochanteric pain syndrome."}]},{"no":286,"batch":12,"title":"Mrs. Afolayan: Blood From One Nipple","setting":"Women's health visit • Middle adult • Breast health","scenario":"Mrs. Afolayan is a 47-year-old woman who has noticed spontaneous bloody discharge staining her bra from a single duct of her left nipple for 3 weeks. She has no breast pain, palpable mass or skin changes. She is not breastfeeding or pregnant and takes no medications that affect prolactin. Her last mammogram 10 months ago was normal.","qs":[{"n":856,"t":"mc","visit":"Visit 1","s":"Which feature makes her nipple discharge **pathologic**?","opts":["It has been present for less than 2 months","It was found by the patient on her clothing","It occurs in a woman who is not breastfeeding","It is spontaneous, bloody and from a single duct"],"correctIdx":[3],"answer":"D","c":"Pathologic nipple discharge is spontaneous, unilateral, from a single duct, and bloody or serous; it requires evaluation. Physiologic discharge is usually bilateral, from multiple ducts, expressed only with squeezing, and milky, green or yellow. The most common cause of pathologic discharge is an intraductal papilloma, but ductal carcinoma must be excluded."},{"n":857,"t":"mc","visit":"Visit 1 (continued)","s":"Which evaluation is **most appropriate**?","opts":["Diagnostic mammogram and breast ultrasound","Antibiotics for a presumed duct infection","A prolactin level and a brain MRI only","Reassurance and a recheck in one year"],"correctIdx":[0],"answer":"A","c":"Pathologic nipple discharge is evaluated with diagnostic mammography and retroareolar ultrasound (ultrasound alone for women under 30), followed by referral to a breast surgeon. Breast MRI or ductography may be used when initial imaging is negative, and excision of the involved duct is often needed for diagnosis. Cytology of the discharge is not recommended. Prolactin testing is for bilateral milky discharge (galactorrhea)."},{"n":858,"t":"sata","visit":"Visit 1 (continued)","s":"Which nipple discharge features are **usually physiologic**? **Select all that apply.**","opts":["Discharge only when the nipple is squeezed","Spontaneous bloody discharge from one duct","Discharge from both breasts","Green or milky color from several ducts","Discharge with a palpable breast mass"],"correctIdx":[0,2,3],"answer":"A, C, D","c":"Physiologic or benign discharge is typically bilateral, multi-ductal, produced only with expression, and milky, green, yellow or gray (as with duct ectasia or fibrocystic change). Spontaneous, unilateral, single-duct bloody or clear discharge, discharge with a mass, skin changes or lymphadenopathy, and any discharge in men warrant imaging and specialist evaluation."}]},{"no":287,"batch":12,"title":"Mr. Antonelli: A Groin Bulge That Won't Go Back","setting":"Urgent visit • Middle adult • Surgery","scenario":"Mr. Antonelli is a 58-year-old man with a right groin bulge for 2 years that appears when he lifts and disappears when he lies down. Since this morning the bulge has become firm, painful and cannot be pushed back, and he has nausea and has vomited twice. The skin over it is red and warm. HR is 108 and temperature 38.2 °C. He has not passed gas since morning.","qs":[{"n":859,"t":"mc","visit":"Visit 1","s":"What is the **most likely** diagnosis?","opts":["Strangulated inguinal hernia","A reducible inguinal hernia","An inguinal lymph node infection","A simple hydrocele of the testis"],"correctIdx":[0],"answer":"A","c":"An incarcerated hernia cannot be reduced; a strangulated hernia also has compromised blood supply to the trapped bowel. Signs of strangulation include severe pain, tenderness, redness and warmth of the overlying skin, fever, tachycardia and signs of bowel obstruction (vomiting, distension, no flatus). Strangulation is a surgical emergency because the bowel can become gangrenous within hours."},{"n":860,"t":"mc","visit":"Visit 1 (continued)","s":"What is the **most appropriate** action?","opts":["Forceful manual reduction in the clinic","Emergency surgical referral for repair","A truss and a recheck in two weeks","Oral antibiotics and pain relief at home"],"correctIdx":[1],"answer":"B","c":"A suspected strangulated hernia requires emergency surgical evaluation and repair with IV fluids, nothing by mouth and analgesia. Manual reduction should not be attempted when strangulation is suspected because it can push dead bowel back into the abdomen. An incarcerated hernia without signs of strangulation may be gently reduced by an experienced clinician, followed by early elective repair."},{"n":861,"t":"sata","visit":"Visit 2 (teaching another patient)","s":"For a patient with an uncomplicated reducible inguinal hernia, which statements are **correct**? **Select all that apply.**","opts":["Inguinal hernias always resolve on their own","Elective repair is advised for symptomatic hernias","A painful, irreducible bulge needs urgent care","Minimally symptomatic men may choose watchful waiting","All groin hernias in men are femoral hernias"],"correctIdx":[1,2,3],"answer":"B, C, D","c":"Inguinal hernias are the most common type of hernia, especially in men. Men with minimally symptomatic inguinal hernias may choose watchful waiting, although many eventually need repair; symptomatic hernias are repaired electively. Femoral hernias are more common in women and have a high risk of strangulation, so they are repaired promptly. Hernias do not resolve on their own. Patients should seek urgent care for a painful, irreducible bulge."}]},{"no":288,"batch":12,"title":"Ms. Lindgren-Obi: Droopy Eyelids by Evening","setting":"Primary care clinic • Middle adult • Neurology","scenario":"Ms. Lindgren-Obi is a 41-year-old woman with 3 months of drooping eyelids and double vision that are mild in the morning and worsen by evening or after reading. Her jaw tires when chewing a steak, and her arms tire when brushing her hair, improving after rest. Sensation and reflexes are normal. Holding an ice pack over her eyelid for 2 minutes improves the ptosis.","qs":[{"n":862,"t":"mc","visit":"Visit 1","s":"What is the **most likely** diagnosis?","opts":["Lambert–Eaton syndrome","Bell palsy on both sides","Myasthenia gravis","Multiple sclerosis"],"correctIdx":[2],"answer":"C","c":"Myasthenia gravis is an autoimmune disease with antibodies against the acetylcholine receptor at the neuromuscular junction. It causes fluctuating, fatigable weakness that worsens with use and improves with rest, most often affecting ocular muscles (ptosis, diplopia), then bulbar and limb muscles, with normal sensation and reflexes. The ice pack test improves ptosis. Lambert–Eaton syndrome causes proximal weakness that improves with repeated use and reduced reflexes."},{"n":863,"t":"sata","visit":"Visit 1 (continued)","s":"Which medications can **worsen** her condition? **Select all that apply.**","opts":["Fluoroquinolone antibiotics","IV magnesium","Pyridostigmine","Aminoglycoside antibiotics","Acetaminophen"],"correctIdx":[0,1,3],"answer":"A, B, D","c":"Many drugs can worsen myasthenia gravis or trigger a crisis, including fluoroquinolones, aminoglycosides, macrolides (telithromycin), magnesium, beta-blockers, botulinum toxin, some anesthetic agents and immune checkpoint inhibitors. Pyridostigmine, an acetylcholinesterase inhibitor, is the first-line symptomatic treatment. A CT of the chest is done to look for a thymoma."},{"n":864,"t":"mc","visit":"Visit 2 (3 months later)","s":"Which symptom would suggest a **myasthenic crisis** needing emergency care?","opts":["Double vision after reading for an hour","Tired jaw after chewing a large meal","Shortness of breath or difficulty swallowing","Mild eyelid droop late in the evening"],"correctIdx":[2],"answer":"C","c":"Myasthenic crisis is respiratory failure from weakness of the respiratory or bulbar muscles, often triggered by infection, surgery or medications. Warning signs include shortness of breath, weak cough, difficulty swallowing or handling secretions and a weak voice. It requires emergency care, often ICU monitoring of vital capacity, and treatment with IVIG or plasma exchange."}]},{"no":289,"batch":12,"title":"Mr. Svoboda: Always Losing Track","setting":"Primary care clinic • Middle adult • Mental health","scenario":"Mr. Svoboda is a 40-year-old accountant who has always struggled to stay organized and focused. He misses deadlines, loses his keys and phone daily, interrupts others and feels restless in meetings. His mother says he was \"always in trouble for daydreaming\" as a child, and his report cards noted inattention. He has no depression, substance use or sleep apnea. His BP is 128/80, and he has no heart disease.","qs":[{"n":865,"t":"mc","visit":"Visit 1","s":"Which feature is **required** for a diagnosis of ADHD in an adult?","opts":["Symptoms started only after age 35 years","Symptoms occur in just one setting only","A brain MRI showing a frontal lobe lesion","Several symptoms were present before age 12"],"correctIdx":[3],"answer":"D","c":"DSM-5 criteria for ADHD require several symptoms of inattention and/or hyperactivity–impulsivity to have been present before age 12, to occur in two or more settings (such as work and home) and to impair functioning. Adults need five or more symptoms in a domain (six for children). Collateral information, such as childhood report cards, helps establish childhood onset. ADHD is a clinical diagnosis; imaging is not used."},{"n":866,"t":"mc","visit":"Visit 1 (continued)","s":"Which medication class is **first-line** for adult ADHD?","opts":["Stimulants such as methylphenidate","Antipsychotics such as quetiapine","Sedating antihistamines at bedtime","Benzodiazepines such as clonazepam"],"correctIdx":[0],"answer":"A","c":"Stimulants (methylphenidate and amphetamine formulations) are first-line for adult ADHD and are highly effective. Long-acting formulations reduce misuse potential. Non-stimulants (atomoxetine, viloxazine, bupropion, guanfacine) are alternatives for patients with substance use disorders, intolerance or other concerns. Benzodiazepines and antipsychotics do not treat ADHD."},{"n":867,"t":"sata","visit":"Visit 1 (continued)","s":"Which monitoring or precautions apply to stimulant therapy? **Select all that apply.**","opts":["Take the dose at bedtime for best results","Monitor for insomnia and decreased appetite","Combine with an MAO inhibitor to boost effect","Check blood pressure and heart rate regularly","Screen for substance use and misuse risk"],"correctIdx":[1,3,4],"answer":"B, D, E","c":"Stimulants can raise BP and heart rate, so these are checked at baseline and during treatment; a cardiac history should be taken. Common side effects include insomnia, decreased appetite, weight loss, headache and anxiety, so doses are taken in the morning. Stimulants are Schedule II controlled substances; misuse and diversion should be monitored with prescripti

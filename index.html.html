r-old man with 1 year of aching, numbness and heaviness in both buttocks and thighs that comes on after walking or standing for 10 minutes. The pain eases when he sits or bends forward, and he can walk farther when leaning on a shopping cart. He has no bladder or bowel changes. Pedal pulses are strong, the feet are warm, and straight-leg raising is negative.","qs":[{"n":385,"t":"mc","visit":"Visit 1","s":"What is the **most likely** diagnosis?","opts":["Osteoarthritis of both hips","Peripheral artery disease","Acute lumbar disc herniation","Lumbar spinal stenosis"],"correctIdx":[3],"answer":"D","c":"Lumbar spinal stenosis causes neurogenic claudication: bilateral buttock, thigh or leg pain, numbness or weakness with walking or prolonged standing, relieved by sitting or flexing forward (the \"shopping cart sign\"), because flexion widens the spinal canal. It is common in older adults from degenerative changes. Straight-leg raising is usually negative."},{"n":386,"t":"sata","visit":"Visit 1 (continued)","s":"Which findings **distinguish** his neurogenic claudication from vascular claudication? **Select all that apply.**","opts":["Normal pedal pulses","Pain brought on by standing still","Cool, shiny, hairless skin on the legs","Relief with sitting or bending forward","Relief by simply stopping and standing"],"correctIdx":[0,1,3],"answer":"A, B, D","c":"Neurogenic claudication is relieved by sitting or flexing forward, can be triggered by standing alone, and occurs with normal pulses. Vascular claudication (PAD) causes calf pain with walking that is relieved within minutes by standing still, with diminished pulses, a low ABI and signs such as cool, shiny, hairless skin."},{"n":387,"t":"mc","visit":"Visit 1 (continued)","s":"What is the **most appropriate** initial management?","opts":["A spinal fusion before any other treatment","Urgent lumbar laminectomy within the week","Physical therapy with flexion exercises and analgesics","Strict bed rest for a month with opioids"],"correctIdx":[2],"answer":"C","c":"Initial management of lumbar spinal stenosis is conservative: physical therapy emphasizing flexion-based exercises and core strengthening, activity modification, and acetaminophen or NSAIDs as appropriate; epidural steroid injections may help some patients. MRI is obtained if symptoms are severe or surgery is being considered. Decompressive surgery is for progressive neurological deficits or failed conservative care, and cauda equina signs need emergency care."}]},{"no":130,"batch":6,"title":"Mr. Wallace: Painless Blood in the Urine","setting":"Primary care clinic • Older adult • Genitourinary / Oncology","scenario":"Mr. Wallace is a 68-year-old man who has smoked a pack a day for 45 years and worked for 30 years in a factory making textile dyes. He saw bright red urine twice last week with no pain, fever or urinary symptoms. Urinalysis shows many red blood cells, no white cells or nitrites, and urine culture is negative. He does not take anticoagulants.","qs":[{"n":388,"t":"mc","visit":"Visit 1","s":"Which diagnosis is the **most important** concern?","opts":["Benign prostatic hyperplasia","Urothelial (bladder) carcinoma","Acute bacterial cystitis","An uncomplicated kidney stone"],"correctIdx":[1],"answer":"B","c":"Painless gross hematuria in an older adult, especially a smoker, is bladder cancer until proven otherwise. Urothelial carcinoma is the most common type of bladder cancer. Even a single episode of gross hematuria warrants full evaluation, and hematuria in a patient taking anticoagulants still needs a workup."},{"n":389,"t":"mc","visit":"Visit 1 (continued)","s":"Which evaluation is **recommended** for Mr. Wallace?","opts":["Cystoscopy with CT urography","A PSA test and digital rectal exam only","A course of antibiotics and a recheck","Repeat urinalysis in 1 year"],"correctIdx":[0],"answer":"A","c":"Gross hematuria, or microhematuria in a high-risk patient, is evaluated with cystoscopy (to examine the bladder lining) and upper tract imaging, usually CT urography, along with kidney function testing. Urine cytology may be added. Referral to urology is appropriate. Treating with antibiotics without infection delays diagnosis."},{"n":390,"t":"sata","visit":"Visit 1 (continued)","s":"Which are **risk factors** for bladder cancer? **Select all that apply.**","opts":["Prior cyclophosphamide chemotherapy","Cigarette smoking","A high-fiber diet","Occupational exposure to aromatic amine dyes","Drinking cranberry juice"],"correctIdx":[0,1,3],"answer":"A, B, D","c":"Smoking is the strongest risk factor for bladder cancer. Others include occupational exposure to aromatic amines (dye, rubber, leather and paint industries), cyclophosphamide, pelvic radiation, chronic bladder irritation (long-term catheters, Schistosoma haematobium infection) and male sex. Diet and cranberry juice are not risk factors."}]},{"no":131,"batch":6,"title":"Mrs. Freeman: A Positive Stool Test","setting":"Primary care clinic • Older adult • Gastrointestinal / Health promotion","scenario":"Mrs. Freeman is a 70-year-old woman in good health who has used a yearly fecal immunochemical test (FIT) for colorectal cancer screening since age 60. This year's FIT is positive. She has no rectal bleeding, weight loss or change in bowel habits, and her hemoglobin is normal. She asks whether she can just repeat the stool test.","qs":[{"n":391,"t":"mc","visit":"Visit 1","s":"What is the **most appropriate** next step?","opts":["A diagnostic colonoscopy","A CT of the abdomen only","Repeat the FIT next month","A stool culture for infection"],"correctIdx":[0],"answer":"A","c":"Any positive stool-based screening test (FIT, guaiac test or multitarget stool DNA test) must be followed by a timely diagnostic colonoscopy, ideally within a few months. Repeating the stool test is not appropriate, because a negative repeat does not cancel the positive result. Delays beyond 6–9 months are associated with more advanced cancers."},{"n":392,"t":"mc","visit":"Visit 1 (continued)","s":"What does the USPSTF recommend for colorectal cancer screening by age?","opts":["Screen only adults with symptoms after age 60","Screen 50–85 for all adults at average risk","Screen 40–70 and stop for everyone after 70","Screen 45–75; individualize 76–85; not after 85"],"correctIdx":[3],"answer":"D","c":"The USPSTF recommends colorectal cancer screening for average-risk adults aged 45–75 (grade A for 50–75, grade B for 45–49). For ages 76–85, the decision is individualized based on health, life expectancy and prior screening (grade C). Screening is not recommended after 85."},{"n":393,"t":"sata","visit":"Visit 2 (after a normal colonoscopy)","s":"Which screening tests are paired with the **correct** interval for average-risk adults? **Select all that apply.**","opts":["FIT every 5 years","Colonoscopy every 10 years","Multitarget stool DNA test every 1–3 years","FIT every year","CT colonography every 10 years"],"correctIdx":[1,2,3],"answer":"B, C, D","c":"USPSTF-recommended options include FIT yearly, guaiac-based fecal occult blood test yearly, multitarget stool DNA (FIT-DNA) every 1–3 years, colonoscopy every 10 years, CT colonography every 5 years, and flexible sigmoidoscopy every 5 years (or every 10 years with yearly FIT). After a normal colonoscopy, her next screening would be due in 10 years if still appropriate."}]},{"no":132,"batch":6,"title":"Mrs. Liang: Electric Shocks in the Cheek","setting":"Primary care clinic • Older adult • Neurology","scenario":"Mrs. Liang is a 72-year-old woman of Han Chinese ancestry with 2 months of sudden, severe, electric-shock-like pains in her right cheek and jaw, each lasting a few seconds and occurring many times a day. Brushing her teeth, chewing, talking or a cool breeze triggers them. Between attacks she is pain-free. Her neurological examination, including facial sensation, is normal. Her dentist found no dental cause.","qs":[{"n":394,"t":"mc","visit":"Visit 1","s":"What is the **most likely** diagnosis?","opts":["Temporal arteritis","Trigeminal neuralgia","Acute maxillary sinusitis","Temporomandibular disorder"],"correctIdx":[1],"answer":"B","c":"Trigeminal neuralgia causes recurrent, brief (seconds to 2 minutes), severe, electric-shock-like pain in the distribution of one or more branches of the trigeminal nerve, usually the maxillary or mandibular branch, triggered by light touch, chewing, talking, brushing teeth or wind. It is most common in women over 50. MRI is recommended to look for a compressing vessel, tumor or multiple sclerosis."},{"n":395,"t":"mc","visit":"Visit 1 (continued)","s":"What is the **first-line** medication?","opts":["Oxycodone","Sumatriptan","Carbamazepine","Prednisone"],"correctIdx":[2],"answer":"C","c":"Carbamazepine is the first-line drug for trigeminal neuralgia, with oxcarbazepine as an alternative that has fewer side effects. Gabapentin, baclofen and lamotrigine are second-line options. Microvascular decompression or ablative procedures are considered when medication fails. Triptans, opioids and steroids are not effective."},{"n":396,"t":"sata","visit":"Visit 1 (continued)","s":"Which precautions or monitoring apply to carbamazepine for Mrs. Liang? **Select all that apply.**","opts":["HLA-B*15:02 testing before starting","Checking sodium for hyponatremia","Checking serum lipase every week","Avoiding all green vegetables","Monitoring the CBC for blood dyscrasias"],"correctIdx":[0,1,4],"answer":"A, B, E","c":"Patients of Asian ancestry (especially Han Chinese) should be tested for HLA-B*15:02 before carbamazepine because carriers have a high risk of Stevens–Johnson syndrome and toxic epidermal necrolysis. Carbamazepine can cause aplastic anemia and agranulocytosis (CBC monitoring), hyponatremia from SIADH (especially in older adults), hepatotoxicity and many drug interactions, as it induces CYP3A4."}]},{"no":133,"batch":6,"title":"Ms. Okafor: Tender Red Bumps and a Cough","setting":"Primary care clinic • Middle adult • Respiratory / Immunology","scenario":"Ms. Okafor is a 42-year-old Black woman with 2 months of dry cough, mild shortness of breath and fatigue. She has tender, red nodules on both shins and painful swollen ankles. She does not smoke. A chest x-ray shows bilateral hilar lymphadenopathy. Serum calcium is mildly elevated and angiotensin-converting enzyme (ACE) level is high. IGRA is negative.","qs":[{"n":397,"t":"mc","visit":"Visit 1","s":"What is the **most likely** diagnosis?","opts":["Pulmonary sarcoidosis","Hodgkin lymphoma","Asbestosis of the lung","Pulmonary tuberculosis"],"correctIdx":[0],"answer":"A","c":"Sarcoidosis is a multisystem granulomatous disease that is more common and often more severe in Black women. It typically presents with bilateral hilar lymphadenopathy, cough and dyspnea, and can involve the skin, eyes, joints, heart and nervous system. Hypercalcemia and a raised ACE level are common. The combination of erythema nodosum, bilateral hilar lymphadenopathy and arthritis (Löfgren syndrome) carries a good prognosis."},{"n":398,"t":"mc","visit":"Visit 1 (continued)","s":"Which finding **confirms** the diagnosis?","opts":["A positive tuberculin skin test result","Biopsy showing noncaseating granulomas","Biopsy showing caseating granulomas","An elevated ACE level by itself alone"],"correctIdx":[1],"answer":"B","c":"Sarcoidosis is confirmed by tissue biopsy (often of a lymph node via bronchoscopy, or of a skin lesion) showing noncaseating granulomas, after other causes such as TB and fungal infection are excluded. Caseating granulomas suggest tuberculosis. ACE levels are neither sensitive nor specific enough to diagnose sarcoidosis. Löfgren syndrome may be diagnosed clinically."},{"n":399,"t":"sata","visit":"Visit 2 (follow-up plan)","s":"Which evaluations are **recommended** for Ms. Okafor? **Select all that apply.**","opts":["An ECG to screen for cardiac involvement","Pulmonary function tests","A yearly colonoscopy from now on","An eye examination for uveitis","A lumbar puncture for all patients"],"correctIdx":[0,1,3],"answer":"A, B, D","c":"People with sarcoidosis should have baseline pulmonary function tests, an ophthalmology exam (uveitis can cause vision loss even without symptoms), an ECG to screen for cardiac sarcoidosis (heart block, arrhythmias), calcium and kidney and liver tests. Many cases resolve spontaneously; systemic corticosteroids are used for significant organ involvement. Lumbar puncture is only for suspected neurosarcoidosis."}]},{"no":134,"batch":6,"title":"Ms. Davies: Purple Stretch Marks","setting":"Primary care clinic • Middle adult • Endocrine","scenario":"Ms. Davies is a 44-year-old woman who has gained 30 lb over a year, mainly around her abdomen, with a rounded red face and a fat pad on the upper back. She has wide purple stretch marks on her abdomen, bruises easily, and has difficulty climbing stairs because of thigh weakness. She has new hypertension and a fasting glucose of 132 mg/dL. She does not take steroids in any form.","qs":[{"n":400,"t":"mc","visit":"Visit 1","s":"What is the **most likely** diagnosis?","opts":["Addison disease","Hypothyroidism","Cushing syndrome","Simple obesity"],"correctIdx":[2],"answer":"C","c":"Cushing syndrome (excess cortisol) causes central obesity, moon face, a dorsocervical fat pad (\"buffalo hump\"), wide purple striae (wider than 1 cm), easy bruising, proximal muscle weakness, hypertension, hyperglycemia, osteoporosis and mood changes. Wide purple striae, easy bruising and proximal weakness are the most specific features that distinguish it from simple obesity."},{"n":401,"t":"sata","visit":"Visit 1 (continued)","s":"Which are **appropriate** initial screening tests for Ms. Davies? **Select all that apply.**","opts":["An ACTH (cosyntropin) stimulation test","1-mg overnight dexamethasone suppression test","Late-night salivary cortisol","24-hour urine free cortisol","A single random afternoon cortisol"],"correctIdx":[1,2,3],"answer":"B, C, D","c":"Initial tests for Cushing syndrome are late-night salivary cortisol, 24-hour urine free cortisol and the 1-mg overnight dexamethasone suppression test (failure to suppress morning cortisol is abnormal); two abnormal tests support the diagnosis. A random cortisol is unreliable because of diurnal variation, and the ACTH stimulation test is used to diagnose adrenal insufficiency."},{"n":402,"t":"mc","visit":"Visit 2 (endocrinology results)","s":"Which is the **most common** cause of endogenous Cushing syndrome?","opts":["Bilateral adrenal hyperplasia at birth","An ACTH-secreting pituitary adenoma","Ectopic ACTH from small cell lung cancer","A cortisol-secreting adrenal adenoma"],"correctIdx":[1],"answer":"B","c":"The most common cause of Cushing syndrome overall is exogenous glucocorticoids. Among endogenous causes, an ACTH-secreting pituitary adenoma (Cushing disease) accounts for about 70%, followed by adrenal adenoma or carcinoma and ectopic ACTH production, such as from small cell lung cancer. Endocrinology determines the source with ACTH levels and imaging."}]},{"no":135,"batch":6,"title":"Mrs. Ruiz: Hurting All Over","setting":"Primary care clinic • Middle adult • Rheumatology / Chronic pain","scenario":"Mrs. Ruiz is a 46-year-old woman with 8 months of widespread pain in her neck, shoulders, back, arms and legs, with fatigue, unrefreshing sleep, trouble concentrating (\"fibro fog\") and headaches. Her joints have no swelling. CBC, ESR, CRP, TSH, CK, vitamin D and metabolic panel are normal. She is frustrated after seeing several clinicians.","qs":[{"n":403,"t":"mc","visit":"Visit 1","s":"What is the **most likely** diagnosis?","opts":["Polymyalgia rheumatica","Rheumatoid arthritis","Idiopathic polymyositis","Fibromyalgia syndrome"],"correctIdx":[3],"answer":"D","c":"Fibromyalgia is a chronic pain disorder of central pain sensitization, most common in women aged 30–55. It causes widespread pain for at least 3 months with fatigue, unrefreshing sleep and cognitive symptoms, with normal laboratory tests and no joint inflammation. It is a positive clinical diagnosis based on the widespread pain index and symptom severity scale, not a diagnosis of exclusion. Polymyositis raises CK, and PMR raises ESR."},{"n":404,"t":"mc","visit":"Visit 1 (continued)","s":"What is the **most effective** first-line management?","opts":["Daily oral prednisone for 3 months","Strict rest to avoid triggering pain","Education and graded aerobic exercise","Long-term opioid therapy for pain"],"correctIdx":[2],"answer":"C","c":"Validating the patient's symptoms, education and a graded aerobic exercise program are the most effective first-line treatments for fibromyalgia. Cognitive behavioral therapy, sleep hygiene, tai chi, yoga and aquatic therapy also help. Opioids are ineffective and harmful, and steroids do not help because there is no inflammation."},{"n":405,"t":"mc","visit":"Visit 2 (2 months later)","s":"Which medication is **FDA approved** for fibromyalgia?","opts":["Tramadol","Naproxen","Alprazolam","Duloxetine"],"correctIdx":[3],"answer":"D","c":"Duloxetine, milnacipran (SNRIs) and pregabalin are FDA approved for fibromyalgia. Low-dose amitriptyline at bedtime and cyclobenzaprine are also commonly used. NSAIDs have little benefit because the pain is not inflammatory, benzodiazepines are not recommended, and opioids, including tramadol, are discouraged."}]},{"no":136,"batch":6,"title":"Mr. Castillo: A Swollen Belly","setting":"Primary care clinic • Middle adult • Hepatic","scenario":"Mr. Castillo is a 56-year-old man with alcohol-related cirrhosis who stopped drinking 6 months ago. He has increasing abdominal swelling, shifting dullness, spider angiomas on his chest, palmar erythema and dilated veins radiating from his navel. His wife says he has been more forgetful and sleepy during the day. Platelets are 82,000/mm³ and albumin is 2.9 g/dL.","qs":[{"n":406,"t":"hot","visit":"Visit 1","s":"The FNP documents caput medusae. **Click the region where caput medusae is seen.**","answer":"C","c":"Caput medusae is a pattern of dilated superficial veins radiating from the umbilicus. It results from portal hypertension, which reopens the paraumbilical veins as a collateral route. Other signs of portal hypertension include ascites, splenomegaly with thrombocytopenia and esophageal varices. Spider angiomas, palmar erythema and gynecomastia reflect impaired estrogen metabolism.","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 400 320\" width=\"100%\" height=\"auto\"><rect width=\"400\" height=\"320\" fill=\"none\"/><path d=\"M 90 30 Q 200 10 310 30 Q 330 160 310 300 L 90 300 Q 70 160 90 30 Z\" fill=\"var(--skin)\" stroke=\"var(--diagram-ink)\" stroke-width=\"2.5\"/>\n<path d=\"M 90 70 Q 200 120 310 70\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-width=\"2\" stroke-opacity=\"0.5\"/>\n<line x1=\"200\" y1=\"40\" x2=\"200\" y2=\"296\" stroke=\"var(--diagram-ink)\" stroke-width=\"1.5\" stroke-dasharray=\"6 5\" stroke-opacity=\"0.55\"/>\n<line x1=\"84\" y1=\"170\" x2=\"316\" y2=\"170\" stroke=\"var(--diagram-ink)\" stroke-width=\"1.5\" stroke-dasharray=\"6 5\" stroke-opacity=\"0.55\"/>\n<circle cx=\"200\" cy=\"170\" r=\"6\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-width=\"2\"/>\n<path d=\"M 108 262 Q 150 285 196 296\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-width=\"2\" stroke-opacity=\"0.5\"/>\n<path d=\"M 292 262 Q 250 285 204 296\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-width=\"2\" stroke-opacity=\"0.5\"/>\n<text x=\"40\" y=\"20\" font-family=\"Arial, sans-serif\" font-size=\"12\" font-weight=\"700\" fill=\"var(--diagram-ink)\" text-anchor=\"start\">Patient's RIGHT</text><text x=\"268\" y=\"20\" font-family=\"Arial, sans-serif\" font-size=\"12\" font-weight=\"700\" fill=\"var(--diagram-ink)\" text-anchor=\"start\">Patient's LEFT</text><text x=\"206\" y=\"186\" font-family=\"Arial, sans-serif\" font-size=\"10\" font-weight=\"400\" fill=\"var(--diagram-ink)\" text-anchor=\"start\">umbilicus</text><g class=\"zone\" data-id=\"A\" tabindex=\"0\" role=\"button\" aria-label=\"Area A\">\n<circle cx=\"140\" cy=\"112\" r=\"15\" fill=\"var(--zone-fill)\" stroke=\"var(--zone-ink)\" stroke-width=\"2.5\"/>\n<text x=\"140\" y=\"117.5\" text-anchor=\"middle\" font-family=\"Georgia, 'Times New Roman', serif\" font-size=\"16\" font-weight=\"700\" fill=\"var(--zone-ink)\">A</text></g><g class=\"zone\" data-id=\"B\" tabindex=\"0\" role=\"button\" aria-label=\"Area B\">\n<circle cx=\"262\" cy=\"112\" r=\"15\" fill=\"var(--zone-fill)\" stroke=\"var(--zone-ink)\" stroke-width=\"2.5\"/>\n<text x=\"262\" y=\"117.5\" text-anchor=\"middle\" font-family=\"Georgia, 'Times New Roman', serif\" font-size=\"16\" font-weight=\"700\" fill=\"var(--zone-ink)\">B</text></g><g class=\"zone\" data-id=\"C\" tabindex=\"0\" role=\"button\" aria-label=\"Area C\">\n<circle cx=\"168\" cy=\"150\" r=\"15\" fill=\"var(--zone-fill)\" stroke=\"var(--zone-ink)\" stroke-width=\"2.5\"/>\n<text x=\"168\" y=\"155.5\" text-anchor=\"middle\" font-family=\"Georgia, 'Times New Roman', serif\" font-size=\"16\" font-weight=\"700\" fill=\"var(--zone-ink)\">C</text></g><g class=\"zone\" data-id=\"D\" tabindex=\"0\" role=\"button\" aria-label=\"Area D\">\n<circle cx=\"200\" cy=\"262\" r=\"15\" fill=\"var(--zone-fill)\" stroke=\"var(--zone-ink)\" stroke-width=\"2.5\"/>\n<text x=\"200\" y=\"267.5\" text-anchor=\"middle\" font-family=\"Georgia, 'Times New Roman', serif\" font-size=\"16\" font-weight=\"700\" fill=\"var(--zone-ink)\">D</text></g><g class=\"zone\" data-id=\"E\" tabindex=\"0\" role=\"button\" aria-label=\"Area E\">\n<circle cx=\"264\" cy=\"228\" r=\"15\" fill=\"var(--zone-fill)\" stroke=\"var(--zone-ink)\" stroke-width=\"2.5\"/>\n<text x=\"264\" y=\"233.5\" text-anchor=\"middle\" font-family=\"Georgia, 'Times New Roman', serif\" font-size=\"16\" font-weight=\"700\" fill=\"var(--zone-ink)\">E</text></g></svg>"},{"n":407,"t":"match","visit":"Visit 1 (continued)","s":"**Drag each cirrhosis complication to its first-line management.** One option will not be used.","items":["Ascites","Hepatic encephalopathy","Large esophageal varices (no bleeding yet)"],"tgts":["A nonselective beta-blocker such as carvedilol, or banding","Lactulose, with rifaximin added if needed","Ibuprofen for abdominal pain with a high-protein diet","Sodium restriction with spironolactone and furosemide"],"map":[3,1,0],"answer":"1–D, 2–B, 3–A","c":"Ascites is treated with sodium restriction (about 2 g/day) and diuretics (spironolactone with furosemide), with paracentesis for tense ascites. Hepatic encephalopathy is treated with lactulose titrated to 2–3 soft stools daily, with rifaximin added to prevent recurrence. Large varices are treated to prevent bleeding with a nonselective beta-blocker (carvedilol, propranolol or nadolol) or endoscopic band ligation. NSAIDs are avoided in cirrhosis."},{"n":408,"t":"sata","visit":"Visit 2 (health maintenance)","s":"Which recommendations are **appropriate** for Mr. Castillo? **Select all that apply.**","opts":["Avoiding acetaminophen completely in any dose","Hepatitis A and B vaccination if not immune","Severely restricting protein in his diet","Avoiding NSAIDs","Liver ultrasound every 6 months for liver cancer"],"correctIdx":[1,3,4],"answer":"B, D, E","c":"People with cirrhosis need ultrasound (with or without AFP) every 6 months for hepatocellular carcinoma surveillance, endoscopic screening for varices, hepatitis A and B vaccination, pneumococcal and influenza vaccines, and alcohol abstinence. NSAIDs are avoided because they can cause kidney injury, worsen ascites and cause bleeding. Acetaminophen up to about 2 g/day is the preferred analgesic, and adequate protein is needed to prevent sarcopenia."}]},{"no":137,"batch":6,"title":"Mr. Brennan: A Bull's-Eye After a Hike","setting":"Urgent visit • Middle adult • Infectious disease","scenario":"Mr. Brennan is a 39-year-old man from Connecticut who went hiking 9 days ago. He now has a 10-cm expanding red patch with central clearing on the back of his thigh, mild fatigue, headache and aching muscles. He does not remember a tick bite. He has no facial weakness, palpitations or joint swelling. He has no drug allergies.","qs":[{"n":409,"t":"mc","visit":"Visit 1","s":"What is the **most appropriate** next step?","opts":["Observe; treat only if joint pain develops","Order Lyme serology and wait for the results","Start treatment based on the clinical diagnosis","Biopsy the rash and send it for a culture"],"correctIdx":[2],"answer":"C","c":"Erythema migrans (an expanding red rash of 5 cm or more, often with central clearing) in a person with possible tick exposure in an endemic area is diagnostic of early Lyme disease. Treatment is started on clinical grounds without serology, which is often negative in the first weeks. Many patients do not recall the tick bite."},{"n":410,"t":"mc","visit":"Visit 1 (continued)","s":"What is the **recommended** treatment?","opts":["Topical mupirocin to the rash","Oral doxycycline for 10 days","IV ceftriaxone for 28 days","Oral azithromycin for 1 day"],"correctIdx":[1],"answer":"B","c":"Early localized Lyme disease is treated with oral doxycycline for 10 days (or amoxicillin or cefuroxime for 14 days). Doxycycline is also acceptable for short courses in young children and covers co-infection with anaplasmosis. IV ceftriaxone is reserved for some neurological or cardiac manifestations, such as meningitis or high-grade heart block. Azithromycin is a less effective alternative."},{"n":411,"t":"sata","visit":"Visit 1 (continued)","s":"Which findings could indicate **later** (disseminated) Lyme disease? **Select all that apply.**","opts":["A honey-colored crusted rash","Facial nerve palsy","Hearing loss present since birth","Heart block with palpitations or fainting","Swelling of one knee"],"correctIdx":[1,3,4],"answer":"B, D, E","c":"Early disseminated Lyme disease can cause multiple erythema migrans lesions, facial nerve palsy (sometimes bilateral), meningitis, radiculopathy and carditis with AV block. Late Lyme disease typically causes intermittent arthritis of large joints, especially the knee. Honey-colored crusts suggest impetigo, and congenital hearing loss is unrelated."}]},{"no":138,"batch":6,"title":"Ms. Yamamoto: A Lump in the Neck","setting":"Primary care clinic • Middle adult • Endocrine","scenario":"Ms. Yamamoto is a 48-year-old woman who noticed a painless lump in the front of her neck while looking in the mirror. The FNP palpates a 1.8-cm firm nodule in the right lobe of the thyroid that moves with swallowing. She has no hoarseness, trouble swallowing, or symptoms of hyper- or hypothyroidism. She had radiation to her neck for Hodgkin lymphoma at age 16.","qs":[{"n":412,"t":"ord","visit":"Visit 1","s":"**Place the steps of thyroid nodule evaluation in the correct order** (assuming a normal TSH).","items":["Step 1","Step 2","Step 3","Step 4"],"tgts":["Review the cytology (Bethesda category) and plan follow-up","Perform fine-needle aspiration if size and features meet criteria","Obtain a thyroid ultrasound","Measure the serum TSH"],"map":[3,2,1,0],"answer":"D, C, B, A","c":"A thyroid nodule is evaluated first with a TSH. If TSH is low, a radionuclide uptake scan is done because a hyperfunctioning (\"hot\") nodule is rarely malignant. If TSH is normal or high, a thyroid ultrasound assesses size and features (such as TI-RADS), which guide whether fine-needle aspiration is needed. The cytology result, reported in Bethesda categories, determines whether the nodule is observed, re-biopsied, tested molecularly or removed."},{"n":413,"t":"sata","visit":"Visit 1 (continued)","s":"Which features **increase** the risk that a thyroid nodule is malignant? **Select all that apply.**","opts":["Microcalcifications on ultrasound","A low TSH with a \"hot\" nodule on scan","A purely cystic nodule on ultrasound","A history of head or neck radiation in childhood","A hard, fixed nodule with enlarged neck lymph nodes"],"correctIdx":[0,3,4],"answer":"A, D, E","c":"Features that raise the risk of thyroid cancer include childhood head and neck radiation, family history of thyroid cancer, age under 20 or over 70, male sex, rapid growth, hoarseness, a hard fixed nodule and cervical lymphadenopathy. Suspicious ultrasound features include microcalcifications, hypoechogenicity, irregular margins and being taller than wide. Purely cystic nodules and hyperfunctioning nodules are rarely malignant."},{"n":414,"t":"mc","visit":"Visit 2 (results)","s":"A different patient's nodule work-up shows a **low TSH**. What is the **next** step?","opts":["Immediate total thyroidectomy","Start levothyroxine to shrink it","A radionuclide thyroid uptake scan","Fine-needle aspiration right away"],"correctIdx":[2],"answer":"C","c":"A low TSH suggests a hyperfunctioning nodule, so a radioiodine (or technetium) uptake scan is done next. A \"hot\" nodule that takes up tracer is rarely cancerous and usually does not need biopsy; it is treated as hyperthyroidism if needed. A \"cold\" nodule is evaluated with ultrasound and possible FNA. Levothyroxine suppression is not recommended."}]},{"no":139,"batch":6,"title":"Mr. Nwosu: A Cough That Won't Go Away","setting":"Primary care clinic • Middle adult • Respiratory / Pharmacology","scenario":"Mr. Nwosu is a 50-year-old non-smoking man with a dry, tickling cough for 10 weeks. He started lisinopril for hypertension 4 months ago. He has no fever, weight loss, hemoptysis, wheeze, heartburn or postnasal drip. His lung examination and chest x-ray are normal.","qs":[{"n":415,"t":"mc","visit":"Visit 1","s":"What is the **most likely** cause of his cough?","opts":["ACE inhibitor-induced cough","Community-acquired pneumonia","Pertussis (whooping cough)","Lung cancer in a non-smoker"],"correctIdx":[0],"answer":"A","c":"ACE inhibitors cause a dry, persistent cough in about 5–20% of patients because they block the breakdown of bradykinin and substance P. The cough can begin from days to months after starting the drug. A chronic cough (over 8 weeks) with a normal chest x-ray in a patient taking an ACE inhibitor should prompt a trial of stopping the drug."},{"n":416,"t":"mc","visit":"Visit 1 (continued)","s":"What is the **most appropriate** management?","opts":["Continue lisinopril and add a cough suppressant","Switch to a different ACE inhibitor such as enalapril","Add an inhaled corticosteroid and keep lisinopril","Stop lisinopril and switch to an ARB such as losartan"],"correctIdx":[3],"answer":"D","c":"The ACE inhibitor should be stopped and replaced with an angiotensin receptor blocker, which does not raise bradykinin and rarely causes cough. The cough usually resolves within 1–4 weeks but can take up to 3 months. Switching to another ACE inhibitor will not help because cough is a class effect."},{"n":417,"t":"match","visit":"Visit 2 (teaching)","s":"The FNP reviews other common causes of chronic cough. **Drag each cause to its typical clue.** One option will not be used.","items":["Upper airway cough syndrome","Gastroesophageal reflux disease","Cough-variant asthma"],"tgts":["Cough after meals or when lying down, with heartburn","Hemoptysis and weight loss in a heavy smoker","Postnasal drip with frequent throat clearing","Night cough triggered by cold air or exercise"],"map":[2,0,3],"answer":"1–C, 2–A, 3–D","c":"In non-smokers with a normal chest x-ray who are not taking ACE inhibitors, the most common causes of chronic cough are upper airway cough syndrome (postnasal drip), asthma (including cough-variant asthma) and GERD. Each is treated empirically: an antihistamine–decongestant or nasal steroid, asthma therapy, or a PPI. Hemoptysis and weight loss in a smoker are red flags for lung cancer and need imaging."}]},{"no":140,"batch":6,"title":"Mrs. Akande: The Glucose Test in Pregnancy","setting":"Prenatal visit • Young adult • Women's health / Endocrine","scenario":"Mrs. Akande is a 29-year-old woman, G2P1, at 26 weeks of gestation. Her BMI before pregnancy was 32 and her mother has type 2 diabetes. Her first baby weighed 9 lb 10 oz. Her early pregnancy A1c was 5.6%. Today her 1-hour 50-g glucose challenge test is 168 mg/dL, and a follow-up 3-hour 100-g oral glucose tolerance test shows two abnormal values.","qs":[{"n":418,"t":"mc","visit":"Visit 1","s":"When is routine screening for gestational diabetes **usually** done?","opts":["Only after 36 weeks of gestation","Only if glucose is seen in urine","At 24–28 weeks of gestation","At the first postpartum visit"],"correctIdx":[2],"answer":"C","c":"All pregnant people are screened for gestational diabetes at 24–28 weeks (USPSTF grade B), with either the two-step approach (50-g challenge then 100-g OGTT) or the one-step 75-g OGTT. People with risk factors such as obesity, prior GDM, a prior large baby or strong family history should also be tested early in pregnancy for pre-existing diabetes."},{"n":419,"t":"mc","visit":"Visit 1 (continued)","s":"What is the **first-line** management of her gestational diabetes?","opts":["Medical nutrition therapy and physical activity","Strict fasting to avoid any glucose rise","Oral glipizide started on the first day","Immediate delivery by cesarean section"],"correctIdx":[0],"answer":"A","c":"Gestational diabetes is first managed with medical nutrition therapy, physical activity and self-monitoring of blood glucose. If targets are not met (fasting under 95 mg/dL; 1-hour under 140 or 2-hour under 120 mg/dL after meals), insulin is the preferred medication because it does not cross the placenta. Metformin and glyburide cross the placenta and are second-line."},{"n":420,"t":"sata","visit":"Visit 2 (postpartum planning)","s":"Which statements about her care **after delivery** are correct? **Select all that apply.**","opts":["Her diabetes risk ends once the baby is born","She has a higher risk of type 2 diabetes later in life","She should have lifelong diabetes screening every 1–3 years","She needs a 75-g OGTT at 4–12 weeks postpartum","She should take metformin for the rest of her life"],"correctIdx":[1,2,3],"answer":"B, C, D","c":"Gestational diabetes greatly increases the lifetime risk of type 2 diabetes (up to about half within 10 years). A 75-g OGTT is recommended 4–12 weeks postpartum, followed by screening every 1–3 years for life. Breastfeeding, weight management and physical activity reduce risk. Lifelong metformin is not routinely prescribed."}]},{"no":141,"batch":6,"title":"Ms. Kim: Painful Blisters","setting":"Urgent visit • Young adult • Sexual health","scenario":"Ms. Kim is a 23-year-old woman with 3 days of painful clusters of small blisters and shallow ulcers on her vulva, burning with urination, fever, aching muscles and tender, enlarged lymph nodes in both groins. She has a new sexual partner. She has never had similar symptoms.","qs":[{"n":421,"t":"mc","visit":"Visit 1","s":"What is the **most likely** diagnosis?","opts":["Primary syphilis with a single chancre","Vulvovaginal candidiasis with fissures","First-episode genital herpes simplex","Genital warts from HPV infection"],"correctIdx":[2],"answer":"C","c":"Primary genital herpes (HSV-2 or increasingly HSV-1) causes painful grouped vesicles that break into shallow ulcers, often with dysuria, fever, malaise and tender bilateral inguinal lymphadenopathy. The first episode is usually the most severe. Primary syphilis causes a single painless chancre, and genital warts are painless flesh-colored growths. PCR testing of a lesion confirms HSV."},{"n":422,"t":"mc","visit":"Visit 1 (continued)","s":"What is the **most appropriate** treatment?","opts":["A single dose of IM benzathine penicillin","Wait for PCR results before any treatment","Valacyclovir for 7–10 days started today","Topical acyclovir cream applied once daily"],"correctIdx":[2],"answer":"C","c":"A first episode of genital herpes is treated with an oral antiviral (valacyclovir, acyclovir or famciclovir) for 7–10 days, started on clinical suspicion without waiting for results. Treatment shortens the episode but does not eradicate the virus. Topical acyclovir is not effective. Testing for other STIs, including HIV and syphilis, is recommended."},{"n":423,"t":"sata","visit":"Visit 2 (counseling)","s":"Which counseling points are **correct**? **Select all that apply.**","opts":["Treatment cures the infection permanently","Daily suppressive therapy reduces transmission to partners","HSV can be transmitted when no sores are present","Condoms lower but do not remove the risk of spread","Transmission happens only during an outbreak"],"correctIdx":[1,2,3],"answer":"B, C, D","c":"HSV establishes lifelong latency in sensory ganglia, and recurrences are usually milder. Asymptomatic viral shedding means transmission can occur without lesions. Daily suppressive therapy reduces recurrences and transmission to partners, and condoms reduce but do not eliminate risk. Patients should avoid sex during outbreaks and tell partners. Genital herpes near delivery requires obstetric planning to prevent neonatal herpes."}]},{"no":142,"batch":6,"title":"Mr. Diallo: Keeping Lithium Safe","setting":"Primary care clinic • Young adult • Mental health / Pharmacology","scenario":"Mr. Diallo is a 26-year-old man with bipolar I disorder who has been stable on lithium for 2 years. His psychiatrist has moved away and he now sees the FNP. He recently sprained his wrist and has been taking ibuprofen 600 mg three times daily for a week. He now has nausea, diarrhea, a coarse tremor of both hands and is unsteady when walking.","qs":[{"n":424,"t":"mc","visit":"Visit 1","s":"What is the **usual** therapeutic maintenance range for serum lithium?","opts":["10–20 mEq/L","2.0–3.0 mEq/L","0.01–0.05 mEq/L","0.6–1.2 mEq/L"],"correctIdx":[3],"answer":"D","c":"The usual maintenance range for lithium is about 0.6–1.2 mEq/L (slightly higher for acute mania, lower in older adults). Lithium has a narrow therapeutic index, so levels are drawn 12 hours after the last dose. Toxicity becomes more likely above 1.5 mEq/L, and levels above 2.0–2.5 mEq/L can be life-threatening."},{"n":425,"t":"sata","visit":"Visit 1 (continued)","s":"Which medications can **raise** lithium levels? **Select all that apply.**","opts":["Acetaminophen for pain","ACE inhibitors such as lisinopril","Large amounts of caffeine","Ibuprofen and other NSAIDs","Thiazide diuretics"],"correctIdx":[1,3,4],"answer":"B, D, E","c":"Lithium is cleared by the kidneys. NSAIDs (except aspirin), ACE inhibitors, ARBs and thiazide diuretics reduce lithium clearance and can cause toxicity, as can dehydration, sodium restriction and kidney disease. Acetaminophen is the preferred analgesic. Caffeine and theophylline lower lithium levels."},{"n":426,"t":"mc","visit":"Visit 1 (continued)","s":"His symptoms suggest lithium toxicity. What is the **most appropriate** action?","opts":["Hold lithium and send him for an urgent level and evaluation","Continue lithium and ibuprofen and recheck in 3 months","Increase the lithium dose because his tremor is worse","Add propranolol for tremor and keep all doses the same"],"correctIdx":[0],"answer":"A","c":"GI symptoms, coarse tremor, ataxia, confusion or slurred speech suggest lithium toxicity, which needs urgent evaluation: hold lithium and obtain a lithium level, electrolytes, kidney function and an ECG. Severe toxicity may need hemodialysis. Ibuprofen should be stopped. Long-term lithium also requires monitoring of TSH (hypothyroidism), calcium (hyperparathyroidism) and kidney function."}]},{"no":143,"batch":6,"title":"Ms. Svensson: Hives and a Tight Throat","setting":"Primary care clinic (walk-in) • Young adult • Allergy / Emergency","scenario":"Ms. Svensson is a 30-year-old woman with a known peanut allergy who walks into the clinic 15 minutes after eating a dessert at a nearby restaurant. She has widespread hives, swollen lips, a tight throat, hoarse voice, wheezing and nausea. BP is 84/50, HR 124, SpO₂ 93%. She left her epinephrine autoinjector at home.","qs":[{"n":427,"t":"ord","visit":"Visit 1","s":"**Place the FNP's actions in the correct order of priority.**","items":["Step 1","Step 2","Step 3","Step 4"],"tgts":["Give oxygen and repeat epinephrine in 5–15 minutes if needed","Inject IM epinephrine into the anterolateral thigh","Call EMS and lay her supine with the legs raised","Give adjuncts such as an antihistamine once she is stable"],"map":[1,2,0,3],"answer":"B, C, A, D","c":"Epinephrine 0.3–0.5 mg IM (1 mg/mL) into the anterolateral thigh is the first and most important treatment for anaphylaxis and should never be delayed. EMS is called, and the patient is placed supine with the legs elevated (or sitting if breathing is difficult) to support blood pressure. Oxygen and IV fluids are given, and epinephrine is repeated every 5–15 minutes if symptoms persist. Antihistamines, albuterol and steroids are adjuncts only."},{"n":428,"t":"mc","visit":"Visit 1 (continued)","s":"Ms. Svensson improves after epinephrine. Why does she still need **observation** in the emergency department?","opts":["Symptoms can return hours later in a biphasic reaction","Observation is needed only to arrange an allergy test","Epinephrine always causes dangerous heart rhythms later","She must stay until the hives have completely faded"],"correctIdx":[0],"answer":"A","c":"A biphasic reaction is a recurrence of anaphylaxis symptoms hours after the initial episode resolves (usually within 1–72 hours) without new exposure. Patients with severe reactions, those who needed more than one dose of epinephrine, or those with poor access to care need extended observation, typically at least 4–6 hours or longer."},{"n":429,"t":"sata","visit":"Visit 2 (follow-up)","s":"Which discharge instructions are **appropriate**? **Select all that apply.**","opts":["Carry two epinephrine autoinjectors at all times","Avoid epinephrine because her heart rate went up","Use diphenhydramine first and epinephrine only if it fails","See an allergist for further evaluation","Follow a written anaphylaxis action plan"],"correctIdx":[0,3,4],"answer":"A, D, E","c":"Patients at risk of anaphylaxis should carry two epinephrine autoinjectors, follow a written emergency action plan, wear medical identification, read food labels and see an allergist. Epinephrine is used at the first sign of anaphylaxis; antihistamines do not treat airway swelling or shock and should never delay epinephrine. Tachycardia after epinephrine is expected."}]},{"no":144,"batch":6,"title":"Ms. Moreno: Pelvic Pain and Fever","setting":"Urgent visit • Young adult • Sexual health / Gynecology","scenario":"Ms. Moreno is a 21-year-old woman with 4 days of lower abdominal pain, abnormal vaginal discharge, pain with intercourse and a temperature of 38.3 °C. She has had two sexual partners in the last 3 months and uses condoms inconsistently. Her pregnancy test is negative. On pelvic examination she has cervical motion tenderness, uterine tenderness and mucopurulent cervical discharge, with no adnexal mass.","qs":[{"n":430,"t":"mc","visit":"Visit 1","s":"When should empiric treatment for pelvic inflammatory disease be **started**?","opts":["Only after gonorrhea and chlamydia results return","Only after a pelvic ultrasound confirms an abscess","Only if her temperature goes above 39 °C","Now, because she meets the minimum clinical criteria"],"correctIdx":[3],"answer":"D","c":"CDC guidelines recommend empiric PID treatment for sexually active young women with pelvic or lower abdominal pain when cervical motion, uterine or adnexal tenderness is present and no other cause is found. Fever, mucopurulent discharge, WBCs on saline microscopy and raised inflammatory markers support the diagnosis. Treatment should not wait for test results because delays raise the risk of infertility and ectopic pregnancy."},{"n":431,"t":"mc","visit":"Visit 1 (continued)","s":"Which outpatient regimen is **recommended**?","opts":["Azithromycin 1 g orally once as the only treatment","Fluconazole 150 mg orally once with a recheck","Nitrofurantoin by mouth twice daily for 5 days","Ceftriaxone IM, then doxycycline and metronidazole"],"correctIdx":[3],"answer":"D","c":"The CDC-recommended outpatient regimen for PID is ceftriaxone 500 mg IM once plus doxycycline 100 mg twice daily for 14 days, with metronidazole 500 mg twice daily for 14 days to cover anaerobes and bacterial vaginosis. Patients are re-examined within 72 hours, partners from the past 60 days are treated, and she should be retested in 3 months."},{"n":432,"t":"sata","visit":"Visit 1 (continued)","s":"Which situations call for **hospitalization** for PID? **Select all that apply.**","opts":["A suspected tubo-ovarian abscess","Pregnancy","Being under 25 years of age","Inability to tolerate oral medication","Having an IUD in place"],"correctIdx":[0,1,3],"answer":"A, B, D","c":"Hospitalization for PID is recommended when surgical emergencies such as appendicitis cannot be excluded, with tubo-ovarian abscess, pregnancy, severe illness with nausea, vomiting or high fever, inability to tolerate or follow oral therapy, or no response to oral therapy within 72 hours. An IUD does not need to be removed, and age alone is not an indication."}]},{"no":145,"batch":6,"title":"Grace: Missing School Every Month","setting":"Primary care clinic • Adolescent • Gynecology","scenario":"Grace is a 16-year-old girl who started her periods at 12 and has had regular cycles since 13. She has crampy lower abdominal pain that begins with each period and lasts 1–2 days, with nausea and back pain, causing her to miss a day of school each month. She is not sexually active. Her physical examination, including an external genital examination, is normal.","qs":[{"n":433,"t":"mc","visit":"Visit 1","s":"What is the **first-line** treatment for Grace's primary dysmenorrhea?","opts":["An NSAID started 1–2 days before or at onset","Diagnostic laparoscopy to look for disease","Daily antibiotics for a presumed infection","Oral opioids for the first 2 days of bleeding"],"correctIdx":[0],"answer":"A","c":"Primary dysmenorrhea is caused by excess prostaglandins in the endometrium. NSAIDs such as ibuprofen or naproxen are first-line, ideally started 1–2 days before menses or at the onset of pain and taken on a schedule for 2–3 days. Heat, exercise and hormonal contraceptives also help. Opioids and antibiotics are not indicated."},{"n":434,"t":"sata","visit":"Visit 1 (continued)","s":"Which features would suggest **secondary** dysmenorrhea, such as endometriosis? **Select all that apply.**","opts":["Pain with intercourse or with bowel movements","Pain that starts with bleeding and lasts 1–2 days","Onset within 6–12 months after menarche","Pain that worsens over time despite NSAIDs and hormones","Pelvic pain between periods"],"correctIdx":[0,3,4],"answer":"A, D, E","c":"Secondary dysmenorrhea is suggested by onset after age 25 or long after menarche, worsening pain, pain not relieved by NSAIDs and hormonal therapy, dyspareunia, dyschezia, non-cyclic pelvic pain, heavy or irregular bleeding, infertility or abnormal pelvic findings. Primary dysmenorrhea begins within 6–12 months of menarche, once cycles become ovulatory, and lasts 1–3 days."},{"n":435,"t":"mc","visit":"Visit 2 (3 months later)","s":"NSAIDs have helped only partly. What is the **next** appropriate option?","opts":["A combined hormonal contraceptive","A daily oral corticosteroid","Referral for a hysterectomy","Daily scheduled oral opioids"],"correctIdx":[0],"answer":"A","c":"If NSAIDs alone are not enough, hormonal therapy is added: combined hormonal contraceptives (including continuous use), a progestin-only method or the levonorgestrel IUD. These reduce endometrial prostaglandin production. If symptoms persist despite these, evaluation for secondary causes such as endometriosis is needed."}]},{"no":146,"batch":6,"title":"Daniel: Headache, Stiff Neck and a Rash","setting":"Student health clinic • Adolescent • Infectious disease / Emergency","scenario":"Daniel is an 18-year-old college freshman living in a dormitory. He woke this morning with a fever of 39.8 °C, a severe headache, neck stiffness, vomiting and sensitivity to light. He is drowsy and confused. A non-blanching petechial rash is spreading on his legs. His roommate brought him in. His records show he received MenACWY at 11 years but no booster.","qs":[{"n":436,"t":"mc","visit":"Visit 1","s":"What is the **most appropriate** immediate action?","opts":["Order a lumbar puncture for next week as an outpatient","Prescribe oral amoxicillin and send him to his dorm","Give acetaminophen and recheck him tomorrow","Call 911 and give a parenteral antibiotic if available"],"correctIdx":[3],"answer":"D","c":"Fever, severe headache, neck stiffness, altered mental status and a non-blanching petechial or purpuric rash strongly suggest meningococcal disease, a medical emergency that can kill within hours. He needs emergency transfer, and if there is any delay, a parenteral antibiotic such as ceftriaxone should be given immediately. Hospital management includes blood cultures, lumbar puncture if safe, and IV antibiotics."},{"n":437,"t":"sata","visit":"Visit 1 (continued)","s":"Which signs suggest **meningeal irritation**? **Select all that apply.**","opts":["Nuchal rigidity","Kernig sign","Rovsing sign","Brudzinski sign","Murphy sign"],"correctIdx":[0,1,3],"answer":"A, B, D","c":"Signs of meningeal irritation include nuchal rigidity, Kernig sign (pain or resistance when extending the knee with the hip flexed at 90°) and Brudzinski sign (neck flexion causes involuntary hip and knee flexion). These signs are specific but not sensitive, so their absence does not rule out meningitis. Murphy sign suggests cholecystitis, and Rovsing sign suggests appendicitis."},{"n":438,"t":"mc","visit":"Visit 2 (next day)","s":"Meningococcal meningitis is confirmed. What is **recommended** for Daniel's roommate?","opts":["A single dose of ciprofloxacin as prophylaxis","No action unless the roommate develops symptoms","Only a MenACWY booster dose in 6 months","A full 14-day course of oral amoxicillin"],"correctIdx":[0],"answer":"A","c":"Close contacts of a person with meningococcal disease (household members, roommates, intimate partners and those exposed to oral secretions) should receive chemoprophylaxis as soon as possible, ideally within 24 hours: ciprofloxacin as a single oral dose, rifampin for 2 days or ceftriaxone as a single IM dose. Vaccination may also be offered in outbreaks. MenACWY is routinely given at 11–12 years with a booster at 16."}]},{"no":147,"batch":6,"title":"Noah: A Sore Throat Without a Cough","setting":"Primary care clinic • School-age child • Infectious disease / ENT","scenario":"Noah is a 7-year-old boy with 2 days of sore throat, fever of 38.9 °C, headache and abdominal pain. He has no cough, runny nose or hoarseness. His tonsils are enlarged with white exudate, there are petechiae on the palate, and his anterior cervical lymph nodes are tender and swollen. He has no drug allergies.","qs":[{"n":439,"t":"mc","visit":"Visit 1","s":"What is the **most appropriate** next step?","opts":["Empiric antibiotics without testing","A monospot test for all children","A throat x-ray to look for swelling","A rapid strep antigen test"],"correctIdx":[3],"answer":"D","c":"Children with sore throat and features suggesting group A strep (fever, tonsillar exudate, tender anterior cervical nodes, palatal petechiae, absence of cough) should be tested with a rapid antigen detection test. In children and adolescents, a negative rapid test should be confirmed with a throat culture. Empiric antibiotics without testing are not recommended. Testing is usually not needed with clear viral features such as cough, rhinorrhea or hoarseness, or in children under 3."},{"n":440,"t":"mc","visit":"Visit 1 (continued)","s":"His rapid strep test is positive. What is the **first-line** treatment?","opts":["Doxycycline for 10 days","Amoxicillin for 10 days","Ciprofloxacin for 7 days","Azithromycin for 5 days"],"correctIdx":[1],"answer":"B","c":"Penicillin V or amoxicillin for 10 days (or a single IM dose of benzathine penicillin G) is first-line for group A strep pharyngitis; amoxicillin is often preferred in children for taste and once-daily dosing. For penicillin allergy, options include cephalexin (if not anaphylactic), azithromycin or clindamycin. Children can return to school after 12–24 hours of antibiotics once fever-free."},{"n":441,"t":"sata","visit":"Visit 1 (continued)","s":"Which are **complications** of group A streptococcal pharyngitis? **Select all that apply.**","opts":["Peritonsillar abscess","Post-streptococcal glomerulonephritis","Kawasaki disease","Acute rheumatic fever","Pyloric stenosis"],"correctIdx":[0,1,3],"answer":"A, B, D","c":"Suppurative complications of strep pharyngitis include peritonsillar abscess (muffled \"hot potato\" voice, trismus, uvular deviation), retropharyngeal abscess and cervical lymphadenitis. Non-suppurative complications include acute rheumatic fever, which antibiotics prevent, and post-streptococcal glomerulonephritis, which they do not reliably prevent. Kawasaki disease and pyloric stenosis are not caused by strep."}]},{"no":148,"batch":6,"title":"Ethan: Crying Spells and Jelly-Like Stool","setting":"Urgent visit • Infant • Gastrointestinal","scenario":"Ethan is a 9-month-old boy who has had episodes of sudden, severe crying every 15–20 minutes since this morning, pulling his knees to his chest, with vomiting. Between episodes he is quiet and unusually sleepy. His last diaper contained stool mixed with blood and mucus. He had a cold last week. On examination, a sausage-shaped mass is palpable in his abdomen.","qs":[{"n":442,"t":"mc","visit":"Visit 1","s":"What is the **most likely** diagnosis?","opts":["Intussusception","Infant colic only","Pyloric stenosis","Acute gastroenteritis"],"correctIdx":[0],"answer":"A","c":"Intussusception, the telescoping of one segment of bowel into another (usually ileocolic), is the most common cause of bowel obstruction in children aged 6 months to 3 years. It causes intermittent, severe colicky pain with knees drawn up, vomiting, lethargy between episodes, a sausage-shaped mass and \"currant jelly\" stool (a late sign). A recent viral illness can cause lymphoid hyperplasia that acts as a lead point."},{"n":443,"t":"hot","visit":"Visit 1 (continued)","s":"**Click the region where the sausage-shaped mass is classically felt.**","answer":"A","c":"In ileocolic intussusception, the sausage-shaped mass is classically palpated in the right upper quadrant, along the course of the ascending and transverse colon, and the right lower quadrant may feel empty (Dance sign). Abdominal ultrasound, showing a \"target\" or \"doughnut\" sign, is the diagnostic test of choice.","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 400 320\" width=\"100%\" height=\"auto\"><rect width=\"400\" height=\"320\" fill=\"none\"/><path d=\"M 90 30 Q 200 10 310 30 Q 330 160 310 300 L 90 300 Q 70 160 90 30 Z\" fill=\"var(--skin)\" stroke=\"var(--diagram-ink)\" stroke-width=\"2.5\"/>\n<path d=\"M 90 70 Q 200 120 310 70\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-width=\"2\" stroke-opacity=\"0.5\"/>\n<line x1=\"200\" y1=\"40\" x2=\"200\" y2=\"296\" stroke=\"var(--diagram-ink)\" stroke-width=\"1.5\" stroke-dasharray=\"6 5\" stroke-opacity=\"0.55\"/>\n<line x1=\"84\" y1=\"170\" x2=\"316\" y2=\"170\" stroke=\"var(--diagram-ink)\" stroke-width=\"1.5\" stroke-dasharray=\"6 5\" stroke-opacity=\"0.55\"/>\n<circle cx=\"200\" cy=\"170\" r=\"6\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-width=\"2\"/>\n<path d=\"M 108 262 Q 150 285 196 296\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-width=\"2\" stroke-opacity=\"0.5\"/>\n<path d=\"M 292 262 Q 250 285 204 296\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-width=\"2\" stroke-opacity=\"0.5\"/>\n<text x=\"40\" y=\"20\" font-family=\"Arial, sans-serif\" font-size=\"12\" font-weight=\"700\" fill=\"var(--diagram-ink)\" text-anchor=\"start\">Patient's RIGHT</text><text x=\"268\" y=\"20\" font-family=\"Arial, sans-serif\" font-size=\"12\" font-weight=\"700\" fill=\"var(--diagram-ink)\" text-anchor=\"start\">Patient's LEFT</text><text x=\"206\" y=\"186\" font-family=\"Arial, sans-serif\" font-size=\"10\" font-weight=\"400\" fill=\"var(--diagram-ink)\" text-anchor=\"start\">umbilicus</text><g class=\"zone\" data-id=\"A\" tabindex=\"0\" role=\"button\" aria-label=\"Area A\">\n<circle cx=\"140\" cy=\"112\" r=\"15\" fill=\"var(--zone-fill)\" stroke=\"var(--zone-ink)\" stroke-width=\"2.5\"/>\n<text x=\"140\" y=\"117.5\" text-anchor=\"middle\" font-family=\"Georgia, 'Times New Roman', serif\" font-size=\"16\" font-weight=\"700\" fill=\"var(--zone-ink)\">A</text></g><g class=\"zone\" data-id=\"B\" tabindex=\"0\" role=\"button\" aria-label=\"Area B\">\n<circle cx=\"200\" cy=\"92\" r=\"15\" fill=\"var(--zone-fill)\" stroke=\"var(--zone-ink)\" stroke-width=\"2.5\"/>\n<text x=\"200\" y=\"97.5\" text-anchor=\"middle\" font-family=\"Georgia, 'Times New Roman', serif\" font-size=\"16\" font-weight=\"700\" fill=\"var(--zone-ink)\">B</text></g><g class=\"zone\" data-id=\"C\" tabindex=\"0\" role=\"button\" aria-label=\"Area C\">\n<circle cx=\"262\" cy=\"112\" r=\"15\" fill=\"var(--zone-fill)\" stroke=\"var(--zone-ink)\" stroke-width=\"2.5\"/>\n<text x=\"262\" y=\"117.5\" text-anchor=\"middle\" font-family=\"Georgia, 'Times New Roman', serif\" font-size=\"16\" font-weight=\"700\" fill=\"var(--zone-ink)\">C</text></g><g class=\"zone\" data-id=\"D\" tabindex=\"0\" role=\"button\" aria-label=\"Area D\">\n<circle cx=\"136\" cy=\"228\" r=\"15\" fill=\"var(--zone-fill)\" stroke=\"var(--zone-ink)\" stroke-width=\"2.5\"/>\n<text x=\"136\" y=\"233.5\" text-anchor=\"middle\" font-family=\"Georgia, 'Times New Roman', serif\" font-size=\"16\" font-weight=\"700\" fill=\"var(--zone-ink)\">D</text></g><g class=\"zone\" data-id=\"E\" tabindex=\"0\" role=\"button\" aria-label=\"Area E\">\n<circle cx=\"264\" cy=\"228\" r=\"15\" fill=\"var(--zone-fill)\" stroke=\"var(--zone-ink)\" stroke-width=\"2.5\"/>\n<text x=\"264\" y=\"233.5\" text-anchor=\"middle\" font-family=\"Georgia, 'Times New Roman', serif\" font-size=\"16\" font-weight=\"700\" fill=\"var(--zone-ink)\">E</text></g></svg>"},{"n":444,"t":"mc","visit":"Visit 1 (continued)","s":"Ultrasound confirms the diagnosis and he has no signs of perforation. What is the **usual** treatment?","opts":["Observation for 2 days without care","An air or contrast enema to reduce it","A course of IV antibiotics only","Oral rehydration and discharge home"],"correctIdx":[1],"answer":"B","c":"Ultrasound-confirmed intussusception without peritonitis or perforation is treated by a pneumatic (air) or hydrostatic (contrast) enema under imaging guidance, which reduces most cases, with surgical backup available. Surgery is needed for perforation, peritonitis, shock or failed enema reduction. Intussusception can recur, most often within the first 24–72 hours."}]},{"no":149,"batch":6,"title":"Baby Ayo: An Empty Scrotum","setting":"Well-child visit • Infant • Genitourinary","scenario":"Ayo is a 6-month-old boy born at term. At his newborn examination his left testis could not be felt in the scrotum. At this visit the left testis is still not palpable in the scrotum or inguinal canal, even with the child relaxed and in a frog-leg position. The right testis is normal, and the penis and urethral opening are normal.","qs":[{"n":445,"t":"mc","visit":"Visit 1","s":"What is the **most appropriate** next step?","opts":["Order a scrotal ultrasound before referral","Give testosterone injections every month","Refer to pediatric urology for orchiopexy","Wait until age 5 to see if it descends"],"correctIdx":[2],"answer":"C","c":"Testes that remain undescended at 6 months (corrected for prematurity) rarely descend on their own. The AUA recommends referral to a pediatric urologist or surgeon by 6 months so that orchiopexy can be done, ideally by 18 months. Ultrasound or other imaging before referral is not recommended because it rarely changes management; nonpalpable testes are found by surgical exploration. Hormonal therapy is not recommended."},{"n":446,"t":"sata","visit":"Visit 1 (continued)","s":"Why is early treatment of an undescended testis **important**? **Select all that apply.**","opts":["It allows easier exam for testicular cancer","It is needed for any puberty to occur at all","It prevents the development of hypospadias","It reduces the risk of infertility","It reduces the risk of torsion and hernia"],"correctIdx":[0,3,4],"answer":"A, D, E","c":"Undescended testes are exposed to higher body temperature, which impairs sperm production; early orchiopexy improves fertility potential. The risk of testicular cancer remains somewhat increased, but placing the testis in the scrotum allows self-examination and early detection. Cryptorchidism is also associated with inguinal hernia and torsion. Hypospadias is a separate condition, and one normal testis supports normal puberty."},{"n":447,"t":"mc","visit":"Visit 1 (continued)","s":"Which finding with cryptorchidism should prompt **urgent** evaluation for a disorder of sex development?","opts":["A small hydrocele that resolves by 12 months","Bilateral nonpalpable testes or hypospadias","A retractile testis that comes into the scrotum","A single undescended testis on the left side"],"correctIdx":[1],"answer":"B","c":"A newborn with bilateral nonpalpable testes, or cryptorchidism with hypospadias or ambiguous genitalia, needs urgent evaluation for a disorder of sex development, such as congenital adrenal hyperplasia in a virilized genetic female, which can cause life-threatening salt-wasting. A retractile testis that can be brought into the scrotum is normal but should be followed."}]},{"no":150,"batch":6,"title":"Zuri: The 4-Year Well-Child Visit","setting":"Well-child visit • Preschool child • Development / Health promotion","scenario":"Zuri is a 4-year-old girl at her well-child visit. She hops on one foot, draws a person with three parts, tells stories, and plays cooperatively with other children. Her parents ask what vaccines she needs before starting school. During the vision screen, the FNP notices her left eye occasionally turns inward.","qs":[{"n":448,"t":"ord","visit":"Visit 1","s":"The FNP reviews Zuri's development. **Place these gross motor milestones in the order they typically appear.**","items":["Step 1","Step 2","Step 3","Step 4","Step 5"],"tgts":["Hops on one foot","Walks independently","Rolls from front to back","Rides a tricycle","Sits without support"],"map":[2,4,1,3,0],"answer":"C, E, B, D, A","c":"Typical gross motor milestones are: rolling front to back at about 4 months, sitting without support at about 6 months, walking independently at about 12 months, pedaling a tricycle at about 3 years, and hopping on one foot at about 4 years. A child who has not reached a milestone by the upper limit of normal, or who loses skills, should have further developmental evaluation."},{"n":449,"t":"mc","visit":"Visit 1 (continued)","s":"Which vaccines are **routinely** due at 4–6 years?","opts":["Tdap, HPV and MenACWY vaccines","PCV15 and Hib vaccines only","Hepatitis B and rotavirus","DTaP, IPV, MMR and varicella"],"correctIdx":[3],"answer":"D","c":"At 4–6 years, children routinely receive the fifth DTaP dose, the fourth IPV dose, the second MMR dose and the second varicella dose (combination vaccines may be used), plus yearly influenza vaccine. Tdap, HPV and MenACWY are given at 11–12 years. Rotavirus, Hib and PCV series are completed in infancy and early childhood."},{"n":450,"t":"mc","visit":"Visit 1 (continued)","s":"What is the **most appropriate** action about Zuri's eye turning inward?","opts":["Recheck her vision at age 10","Reassure that she will outgrow it","Refer to pediatric ophthalmology","Prescribe reading glasses now"],"correctIdx":[2],"answer":"C","c":"Persistent or intermittent strabismus after 4–6 months of age needs referral to pediatric ophthalmology, because it can cause amblyopia (\"lazy eye\"), which is most successfully treated early in childhood with glasses, patching or atropine drops. Other referral findings include an abnormal or asymmetric red reflex, failed vision screening and a difference of two lines or more between the eyes."}]},{"no":151,"batch":7,"title":"Mr. Hargrove: Confused Weeks After a Fall","setting":"Primary care clinic • Older adult • Neurology","scenario":"Mr. Hargrove is an 80-year-old man with atrial fibrillation who takes apixaban. He slipped and hit his head on a kitchen cabinet 3 weeks ago without losing consciousness. Over the past week his daughter has noticed increasing confusion, drowsiness, headaches and new clumsiness of his right hand. He drinks 3–4 glasses of wine nightly. BP is 146/84.","qs":[{"n":451,"t":"mc","visit":"Visit 1","s":"What is the **most likely** diagnosis?","opts":["Chronic subdural hematoma","Alzheimer disease progression","Acute epidural hematoma","Normal-pressure hydrocephalus"],"correctIdx":[0],"answer":"A","c":"A chronic subdural hematoma results from tearing of bridging veins and typically presents days to weeks after a minor head injury with headache, fluctuating confusion, drowsiness, personality change or focal weakness. Older adults, people taking anticoagulants or antiplatelets and people who drink heavily are at highest risk. An epidural hematoma follows arterial bleeding with a lucid interval of hours, not weeks."},{"n":452,"t":"mc","visit":"Visit 1 (continued)","s":"Which test is **most appropriate** now?","opts":["An EEG to look for seizure activity","Urgent non-contrast CT of the head","Routine MRI of the brain in 2 months","Cognitive testing with a recheck in 6 months"],"correctIdx":[1],"answer":"B","c":"New confusion or focal deficits after head trauma, especially in an older adult taking an anticoagulant, require urgent non-contrast head CT. A chronic subdural hematoma appears as a crescent-shaped collection that may cross suture lines. Management may include reversal of anticoagulation and neurosurgical drainage."},{"n":453,"t":"sata","visit":"Visit 1 (continued)","s":"Which factors **increase** Mr. Hargrove's risk of this condition? **Select all that apply.**","opts":["Older age with brain atrophy","Taking a statin each night","Regular aerobic exercise","Heavy alcohol use","Anticoagulant therapy"],"correctIdx":[0,3,4],"answer":"A, D, E","c":"Brain atrophy in older adults and in people with chronic alcohol use stretches the bridging veins, making them more likely to tear with minor trauma. Anticoagulants and antiplatelets increase bleeding, and alcohol also increases falls. Even minor head injuries in anticoagulated older adults warrant a low threshold for imaging."}]},{"no":152,"batch":7,"title":"Mrs. Bauer: Diarrhea That Is Really Constipation","setting":"Home visit • Older adult • Gastrointestinal","scenario":"Mrs. Bauer is an 84-year-old woman who had hip surgery 3 weeks ago and takes oxycodone 5 mg three times daily. She has not had a formed bowel movement for 6 days and has abdominal fullness and poor appetite. For the past 2 days she has leaked small amounts of watery stool. A firm mass is palpable in the left lower abdomen, and rectal examination shows hard stool in the rectum.","qs":[{"n":454,"t":"hot","visit":"Visit 1","s":"**Click the region where stool in the sigmoid colon is typically palpated.**","answer":"E","c":"The sigmoid and descending colon lie in the left lower quadrant, where retained stool can often be felt as a firm, sometimes indentable mass. A rectal examination confirms fecal impaction. The cecum and ascending colon lie on the right side.","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 400 320\" width=\"100%\" height=\"auto\"><rect width=\"400\" height=\"320\" fill=\"none\"/><path d=\"M 90 30 Q 200 10 310 30 Q 330 160 310 300 L 90 300 Q 70 160 90 30 Z\" fill=\"var(--skin)\" stroke=\"var(--diagram-ink)\" stroke-width=\"2.5\"/>\n<path d=\"M 90 70 Q 200 120 310 70\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-width=\"2\" stroke-opacity=\"0.5\"/>\n<line x1=\"200\" y1=\"40\" x2=\"200\" y2=\"296\" stroke=\"var(--diagram-ink)\" stroke-width=\"1.5\" stroke-dasharray=\"6 5\" stroke-opacity=\"0.55\"/>\n<line x1=\"84\" y1=\"170\" x2=\"316\" y2=\"170\" stroke=\"var(--diagram-ink)\" stroke-width=\"1.5\" stroke-dasharray=\"6 5\" stroke-opacity=\"0.55\"/>\n<circle cx=\"200\" cy=\"170\" r=\"6\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-width=\"2\"/>\n<path d=\"M 108 262 Q 150 285 196 296\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-width=\"2\" stroke-opacity=\"0.5\"/>\n<path d=\"M 292 262 Q 250 285 204 296\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-width=\"2\" stroke-opacity=\"0.5\"/>\n<text x=\"40\" y=\"20\" font-family=\"Arial, sans-serif\" font-size=\"12\" font-weight=\"700\" fill=\"var(--diagram-ink)\" text-anchor=\"start\">Patient's RIGHT</text><text x=\"268\" y=\"20\" font-family=\"Arial, sans-serif\" font-size=\"12\" font-weight=\"700\" fill=\"var(--diagram-ink)\" text-anchor=\"start\">Patient's LEFT</text><text x=\"206\" y=\"186\" font-family=\"Arial, sans-serif\" font-size=\"10\" font-weight=\"400\" fill=\"var(--diagram-ink)\" text-anchor=\"start\">umbilicus</text><g class=\"zone\" data-id=\"A\" tabindex=\"0\" role=\"button\" aria-label=\"Area A\">\n<circle cx=\"140\" cy=\"112\" r=\"15\" fill=\"var(--zone-fill)\" stroke=\"var(--zone-ink)\" stroke-width=\"2.5\"/>\n<text x=\"140\" y=\"117.5\" text-anchor=\"middle\" font-family=\"Georgia, 'Times New Roman', serif\" font-size=\"16\" font-weight=\"700\" fill=\"var(--zone-ink)\">A</text></g><g class=\"zone\" data-id=\"B\" tabindex=\"0\" role=\"button\" aria-label=\"Area B\">\n<circle cx=\"262\" cy=\"112\" r=\"15\" fill=\"var(--zone-fill)\" stroke=\"var(--zone-ink)\" stroke-width=\"2.5\"/>\n<text x=\"262\" y=\"117.5\" text-anchor=\"middle\" font-family=\"Georgia, 'Times New Roman', serif\" font-size=\"16\" font-weight=\"700\" fill=\"var(--zone-ink)\">B</text></g><g class=\"zone\" data-id=\"C\" tabindex=\"0\" role=\"button\" aria-label=\"Area C\">\n<circle cx=\"168\" cy=\"150\" r=\"15\" fill=\"var(--zone-fill)\" stroke=\"var(--zone-ink)\" stroke-width=\"2.5\"/>\n<text x=\"168\" y=\"155.5\" text-anchor=\"middle\" font-family=\"Georgia, 'Times New Roman', serif\" font-size=\"16\" font-weight=\"700\" fill=\"var(--zone-ink)\">C</text></g><g class=\"zone\" data-id=\"D\" tabindex=\"0\" role=\"button\" aria-label=\"Area D\">\n<circle cx=\"136\" cy=\"228\" r=\"15\" fill=\"var(--zone-fill)\" stroke=\"var(--zone-ink)\" stroke-width=\"2.5\"/>\n<text x=\"136\" y=\"233.5\" text-anchor=\"middle\" font-family=\"Georgia, 'Times New Roman', serif\" font-size=\"16\" font-weight=\"700\" fill=\"var(--zone-ink)\">D</text></g><g class=\"zone\" data-id=\"E\" tabindex=\"0\" role=\"button\" aria-label=\"Area E\">\n<circle cx=\"264\" cy=\"228\" r=\"15\" fill=\"var(--zone-fill)\" stroke=\"var(--zone-ink)\" stroke-width=\"2.5\"/>\n<text x=\"264\" y=\"233.5\" text-anchor=\"middle\" font-family=\"Georgia, 'Times New Roman', serif\" font-size=\"16\" font-weight=\"700\" fill=\"var(--zone-ink)\">E</text></g></svg>"},{"n":455,"t":"mc","visit":"Visit 1 (continued)","s":"What is the **most likely** explanation for her watery stools?","opts":["Overflow of liquid stool around a fecal impaction","A side effect of oxycodone speeding the bowel","A new infection with Clostridioides difficile","Early ulcerative colitis in an older adult"],"correctIdx":[0],"answer":"A","c":"Fecal impaction can cause paradoxical \"overflow\" diarrhea, in which liquid stool from higher in the colon leaks around the hard mass. Giving antidiarrheal drugs would worsen the problem. Treatment is disimpaction (manual, suppository or enema) followed by a regular bowel regimen. Opioids slow, rather than speed, bowel transit."},{"n":456,"t":"mc","visit":"Visit 1 (continued)","s":"Which bowel regimen is **most appropriate** while she continues oxycodone?","opts":["No regimen until the next impaction","Loperamide after each loose stool","Psyllium fiber alone with little fluid","Senna with polyethylene glycol daily"],"correctIdx":[3],"answer":"D","c":"Opioid-induced constipation should be prevented with a scheduled stimulant laxative (senna or bisacodyl), often with an osmotic laxative (polyethylene glycol), started with the opioid. Bulk-forming fiber without enough fluid can worsen impaction in immobile older adults. Peripherally acting mu-opioid receptor antagonists such as methylnaltrexone are used when laxatives fail."}]},{"no":153,"batch":7,"title":"Mrs. Ndukwe: Painful Intimacy and Repeat UTIs","setting":"Primary care clinic • Older adult • Women's health","scenario":"Mrs. Ndukwe is a 63-year-old woman, 12 years after menopause, with vaginal dryness, burning, pain with intercourse and urinary urgency. She has had three culture-proven bladder infections in the past year. On examination the vaginal mucosa is pale, thin and dry with loss of folds. She has no history of breast or uterine cancer and no abnormal bleeding.","qs":[{"n":457,"t":"mc","visit":"Visit 1","s":"What is the **most likely** diagnosis?","opts":["Genitourinary syndrome of menopause","Bacterial vaginosis with discharge","Vulvovaginal candidiasis (yeast)","Lichen sclerosus of the vulva"],"correctIdx":[0],"answer":"A","c":"Genitourinary syndrome of menopause (formerly vulvovaginal atrophy) results from low estrogen and causes vaginal dryness, burning, dyspareunia, urinary urgency, dysuria and recurrent UTIs, with pale, thin, dry mucosa and loss of rugae. Unlike hot flashes, it tends to worsen over time without treatment. Lichen sclerosus causes white, crinkled vulvar plaques with intense itching."},{"n":458,"t":"mc","visit":"Visit 1 (continued)","s":"Moisturizers and lubricants have not helped enough. What is the **most effective** treatment?","opts":["Daily oral nitrofurantoin for life","Oral combined estrogen and progestin","Low-dose vaginal estrogen","Oral fluconazole once each week"],"correctIdx":[2],"answer":"C","c":"Vaginal moisturizers and lubricants are first-line for mild symptoms. For moderate to severe symptoms, low-dose vaginal estrogen (cream, tablet or ring) is the most effective treatment and restores the vaginal and urethral lining. Vaginal DHEA and oral ospemifene are alternatives. Systemic hormone therapy is not needed for genitourinary symptoms alone."},{"n":459,"t":"sata","visit":"Visit 2 (3 months later)","s":"Which statements about low-dose vaginal estrogen are **correct**? **Select all that apply.**","opts":["It carries the same risks as systemic therapy","It can be continued long term","Systemic absorption is minimal","It requires an added oral progestin","It reduces recurrent urinary tract infections"],"correctIdx":[1,2,4],"answer":"B, C, E","c":"Vaginal estrogen restores vaginal lactobacilli and acidity and reduces recurrent UTIs in postmenopausal women. Because systemic absorption is minimal, a progestin is not needed for endometrial protection, and it does not carry the boxed-warning risks of systemic estrogen. It can be used long term. Any postmenopausal bleeding still needs evaluation."}]},{"no":154,"batch":7,"title":"Mr. Gallo: A High White Count on Routine Labs","setting":"Primary care clinic • Older adult • Hematology / Oncology","scenario":"Mr. Gallo is a 72-year-old man who feels well. A routine CBC shows a white blood cell count of 28,000/mm³ with 80% small, mature-appearing lymphocytes and smudge cells on the blood smear. Hemoglobin and platelets are normal. He has small, painless, rubbery lymph nodes in his neck and armpits. He has no fever, night sweats or weight loss.","qs":[{"n":460,"t":"mc","visit":"Visit 1","s":"What is the **most likely** diagnosis?","opts":["Chronic myeloid leukemia","Acute myeloid leukemia","Chronic lymphocytic leukemia","Infectious mononucleosis"],"correctIdx":[2],"answer":"C","c":"Chronic lymphocytic leukemia (CLL) is the most common leukemia in adults in Western countries, usually diagnosed in older adults on a routine CBC. It shows an absolute lymphocytosis of mature-appearing small lymphocytes with smudge cells, often with painless lymphadenopathy. Acute leukemias show blasts with cytopenias, and CML shows a high neutrophil count with left shift and basophilia."},{"n":461,"t":"mc","visit":"Visit 1 (continued)","s":"Which test **confirms** the diagnosis?","opts":["Flow cytometry of the peripheral blood","An excisional biopsy of a neck lymph node","A heterophile antibody (monospot) test","A bone marrow biopsy in every patient"],"correctIdx":[0],"answer":"A","c":"CLL is confirmed by peripheral blood flow cytometry showing a clonal B-cell population (at least 5,000/mm³) with the characteristic markers (CD5, CD19, CD23). Bone marrow and lymph node biopsy are not usually needed for diagnosis. Hematology referral is appropriate."},{"n":462,"t":"mc","visit":"Visit 2 (hematology plan)","s":"Mr. Gallo has early-stage disease without symptoms. What is the **usual** management?","opts":["An allogeneic stem cell transplant right away","Immediate intensive chemotherapy for 6 months","Splenectomy within the next few weeks","Observation with regular monitoring and vaccines"],"correctIdx":[3],"answer":"D","c":"Asymptomatic early-stage CLL is managed with \"watch and wait\" monitoring because early treatment does not improve survival. Treatment (such as BTK inhibitors or venetoclax-based therapy) begins with symptoms, progressive cytopenias, bulky nodes or rapid lymphocyte doubling. Patients have impaired immunity and need inactivated vaccines (pneumococcal, influenza, recombinant zoster), while live vaccines are avoided."}]},{"no":155,"batch":7,"title":"Mrs. Haddad: The Flu at 76","setting":"Urgent visit • Older adult • Respiratory / Infectious disease","scenario":"Mrs. Haddad is a 76-year-old woman with type 2 diabetes who developed a fever of 38.9 °C, body aches, headache, dry cough and exhaustion 24 hours ago. Influenza is circulating locally and her rapid molecular influenza test is positive. SpO₂ is 96%, RR 18, and her lungs are clear. She did not get a flu vaccine this season.","qs":[{"n":463,"t":"mc","visit":"Visit 1","s":"What is the **most appropriate** treatment?","opts":["Oseltamivir for 5 days","Prednisone for 5 days","Supportive care only","Amoxicillin for 7 days"],"correctIdx":[0],"answer":"A","c":"Antiviral treatment is recommended for anyone with suspected or confirmed influenza at high risk of complications, including adults aged 65 and older and people with diabetes, regardless of vaccination status. Oseltamivir for 5 days is most effective when started within 48 hours of onset, but high-risk or hospitalized patients benefit even when it is started later. Antibiotics do not treat influenza."},{"n":464,"t":"hot","visit":"Visit 2 (3 days later)","s":"She returns with a new productive cough and a chest x-ray showing a right middle lobe infiltrate. **Click the area where the right middle lobe is best auscultated.**","answer":"C","c":"The right middle lobe is heard best on the anterior chest, between the fourth and sixth ribs on the right, and in the right axilla. It is poorly heard from the back, where the lower lobes predominate. Worsening after initial improvement in influenza suggests secondary bacterial pneumonia, often caused by Streptococcus pneumoniae or Staphylococcus aureus.","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 400 320\" width=\"100%\" height=\"auto\"><rect width=\"400\" height=\"320\" fill=\"none\"/><path d=\"M 120 40 Q 200 20 280 40 L 330 70 Q 352 160 330 300 L 70 300 Q 48 160 70 70 Z\" fill=\"var(--skin)\" stroke=\"var(--diagram-ink)\" stroke-width=\"2.5\"/>\n<path d=\"M 172 40 Q 200 58 228 40\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-width=\"2\"/>\n<path d=\"M 196 62 Q 150 64 86 74\" fill=\"none\" stroke=\"var(--diag

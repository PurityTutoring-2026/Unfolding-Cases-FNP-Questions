ram-ink)\" stroke-width=\"5\" stroke-linecap=\"round\"/>\n<path d=\"M 204 62 Q 250 64 314 74\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-width=\"5\" stroke-linecap=\"round\"/>\n<rect x=\"186\" y=\"66\" width=\"28\" height=\"170\" rx=\"10\" fill=\"var(--diagram-ink)\" fill-opacity=\"0.14\" stroke=\"var(--diagram-ink)\" stroke-width=\"2\"/>\n<path d=\"M 184 96 Q 120 102 86 126\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-opacity=\"0.35\" stroke-width=\"2\"/><path d=\"M 216 96 Q 280 102 314 126\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-opacity=\"0.35\" stroke-width=\"2\"/><path d=\"M 184 122 Q 120 128 90 152\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-opacity=\"0.35\" stroke-width=\"2\"/><path d=\"M 216 122 Q 280 128 310 152\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-opacity=\"0.35\" stroke-width=\"2\"/><path d=\"M 184 148 Q 120 154 94 178\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-opacity=\"0.35\" stroke-width=\"2\"/><path d=\"M 216 148 Q 280 154 306 178\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-opacity=\"0.35\" stroke-width=\"2\"/><path d=\"M 184 174 Q 120 180 98 204\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-opacity=\"0.35\" stroke-width=\"2\"/><path d=\"M 216 174 Q 280 180 302 204\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-opacity=\"0.35\" stroke-width=\"2\"/><path d=\"M 184 200 Q 120 206 102 230\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-opacity=\"0.35\" stroke-width=\"2\"/><path d=\"M 216 200 Q 280 206 298 230\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-opacity=\"0.35\" stroke-width=\"2\"/><path d=\"M 184 226 Q 120 232 106 256\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-opacity=\"0.35\" stroke-width=\"2\"/><path d=\"M 216 226 Q 280 232 294 256\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-opacity=\"0.35\" stroke-width=\"2\"/>\n<line x1=\"288\" y1=\"70\" x2=\"288\" y2=\"290\" stroke=\"var(--diagram-ink)\" stroke-width=\"1.5\" stroke-dasharray=\"5 5\" stroke-opacity=\"0.6\"/>\n<text x=\"292\" y=\"286\" font-family=\"Arial, sans-serif\" font-size=\"11\" font-weight=\"400\" fill=\"var(--diagram-ink)\" text-anchor=\"start\">MCL</text><text x=\"40\" y=\"20\" font-family=\"Arial, sans-serif\" font-size=\"12\" font-weight=\"700\" fill=\"var(--diagram-ink)\" text-anchor=\"start\">Patient's RIGHT</text><text x=\"268\" y=\"20\" font-family=\"Arial, sans-serif\" font-size=\"12\" font-weight=\"700\" fill=\"var(--diagram-ink)\" text-anchor=\"start\">Patient's LEFT</text><g class=\"zone\" data-id=\"A\" tabindex=\"0\" role=\"button\" aria-label=\"Area A\">\n<circle cx=\"120\" cy=\"112\" r=\"15\" fill=\"var(--zone-fill)\" stroke=\"var(--zone-ink)\" stroke-width=\"2.5\"/>\n<text x=\"120\" y=\"117.5\" text-anchor=\"middle\" font-family=\"Georgia, 'Times New Roman', serif\" font-size=\"16\" font-weight=\"700\" fill=\"var(--zone-ink)\">A</text></g><g class=\"zone\" data-id=\"B\" tabindex=\"0\" role=\"button\" aria-label=\"Area B\">\n<circle cx=\"280\" cy=\"104\" r=\"15\" fill=\"var(--zone-fill)\" stroke=\"var(--zone-ink)\" stroke-width=\"2.5\"/>\n<text x=\"280\" y=\"109.5\" text-anchor=\"middle\" font-family=\"Georgia, 'Times New Roman', serif\" font-size=\"16\" font-weight=\"700\" fill=\"var(--zone-ink)\">B</text></g><g class=\"zone\" data-id=\"C\" tabindex=\"0\" role=\"button\" aria-label=\"Area C\">\n<circle cx=\"120\" cy=\"190\" r=\"15\" fill=\"var(--zone-fill)\" stroke=\"var(--zone-ink)\" stroke-width=\"2.5\"/>\n<text x=\"120\" y=\"195.5\" text-anchor=\"middle\" font-family=\"Georgia, 'Times New Roman', serif\" font-size=\"16\" font-weight=\"700\" fill=\"var(--zone-ink)\">C</text></g><g class=\"zone\" data-id=\"D\" tabindex=\"0\" role=\"button\" aria-label=\"Area D\">\n<circle cx=\"300\" cy=\"260\" r=\"15\" fill=\"var(--zone-fill)\" stroke=\"var(--zone-ink)\" stroke-width=\"2.5\"/>\n<text x=\"300\" y=\"265.5\" text-anchor=\"middle\" font-family=\"Georgia, 'Times New Roman', serif\" font-size=\"16\" font-weight=\"700\" fill=\"var(--zone-ink)\">D</text></g><g class=\"zone\" data-id=\"E\" tabindex=\"0\" role=\"button\" aria-label=\"Area E\">\n<circle cx=\"100\" cy=\"260\" r=\"15\" fill=\"var(--zone-fill)\" stroke=\"var(--zone-ink)\" stroke-width=\"2.5\"/>\n<text x=\"100\" y=\"265.5\" text-anchor=\"middle\" font-family=\"Georgia, 'Times New Roman', serif\" font-size=\"16\" font-weight=\"700\" fill=\"var(--zone-ink)\">E</text></g></svg>"},{"n":465,"t":"sata","visit":"Visit 3 (after recovery)","s":"Which vaccine recommendations apply to Mrs. Haddad? **Select all that apply.**","opts":["A tetanus–diphtheria booster every 10 years","A pneumococcal vaccine every single year","High-dose, adjuvanted or recombinant flu vaccine each year","Live nasal spray influenza vaccine","A single dose of RSV vaccine"],"correctIdx":[0,2,4],"answer":"A, C, E","c":"Adults aged 65 and older should receive a high-dose, adjuvanted or recombinant influenza vaccine each year. A single dose of RSV vaccine is recommended for all adults aged 75 and older (and for those 50–74 at increased risk). Td or Tdap boosters are given every 10 years, and recombinant zoster vaccine and pneumococcal vaccination are recommended if not completed. Live nasal spray vaccine is approved only up to age 49."}]},{"no":156,"batch":7,"title":"Mr. Abebe: Lying Awake for Hours","setting":"Primary care clinic • Older adult • Sleep","scenario":"Mr. Abebe is a 78-year-old retired teacher who has had trouble falling asleep and staying asleep at least four nights a week for 6 months. He goes to bed at 8 p.m., naps for 2 hours most afternoons, drinks coffee until 4 p.m. and watches television in bed when he cannot sleep. He has no snoring, leg discomfort or depressed mood. He asks for zolpidem, which helped his friend.","qs":[{"n":466,"t":"mc","visit":"Visit 1","s":"What is the **first-line** treatment for Mr. Abebe's chronic insomnia?","opts":["Cognitive behavioral therapy for insomnia","Zolpidem 10 mg nightly for long-term use","Diphenhydramine 50 mg every bedtime","Lorazepam 1 mg at bedtime as needed"],"correctIdx":[0],"answer":"A","c":"Cognitive behavioral therapy for insomnia (CBT-I) is the first-line treatment for chronic insomnia in adults of all ages. It includes stimulus control, sleep restriction, sleep hygiene, relaxation and cognitive restructuring, and its benefits last longer than medication. Digital CBT-I programs are an option when therapists are not available."},{"n":467,"t":"sata","visit":"Visit 1 (continued)","s":"Which recommendations are part of **stimulus control** and sleep hygiene for him? **Select all that apply.**","opts":["Take long afternoon naps to catch up","Avoid caffeine after late morning","Watch television in bed to relax","Keep the same wake-up time every day","Get out of bed if awake for about 20 minutes"],"correctIdx":[1,3,4],"answer":"B, D, E","c":"Stimulus control re-links the bed with sleep: go to bed only when sleepy, use the bed only for sleep and sex, get up if unable to sleep after about 20 minutes, and keep a fixed wake time. Limiting caffeine (it lasts many hours), avoiding long daytime naps and avoiding screens in bed also help. Going to bed at 8 p.m. may be too early for his sleep need."},{"n":468,"t":"mc","visit":"Visit 1 (continued)","s":"Why should zolpidem and other sedative-hypnotics be **avoided** in Mr. Abebe?","opts":["They work only for people under the age of 50","They cause high blood sugar in older adults","They increase falls, fractures and confusion","They are illegal for adults over 75 years old"],"correctIdx":[2],"answer":"C","c":"The Beers Criteria advise avoiding benzodiazepines and \"Z-drugs\" (zolpidem, eszopiclone, zaleszopiclone) in older adults because they increase the risk of falls, fractures, delirium, cognitive impairment and motor vehicle crashes, with only small improvements in sleep. Sedating antihistamines such as diphenhydramine are anticholinergic and also avoided. Low-dose doxepin or a melatonin receptor agonist may be considered if medication is necessary."}]},{"no":157,"batch":7,"title":"Mrs. Patel: A Red, Hot Leg","setting":"Urgent visit • Older adult • Dermatology / Infectious disease","scenario":"Mrs. Patel is a 70-year-old woman with type 2 diabetes who has had 2 days of a spreading, red, warm, tender area on her right shin with a temperature of 38.2 °C. There is no pus, abscess or fluctuance. She has cracked, scaly skin between her right toes. Her left leg is normal. She has no drug allergies.","qs":[{"n":469,"t":"mc","visit":"Visit 1","s":"What is the **most likely** diagnosis?","opts":["Acute gout of the ankle","Bilateral stasis dermatitis","Nonpurulent cellulitis","Contact dermatitis from soap"],"correctIdx":[2],"answer":"C","c":"Cellulitis is a bacterial infection of the dermis and subcutaneous tissue that causes a unilateral, spreading area of redness, warmth, swelling and tenderness, often with fever. Nonpurulent cellulitis is usually caused by beta-hemolytic streptococci. Tinea pedis, skin cracks, edema and obesity are common entry points or risk factors. Stasis dermatitis is usually bilateral and not hot or tender."},{"n":470,"t":"mc","visit":"Visit 1 (continued)","s":"What is the **most appropriate** antibiotic?","opts":["IV vancomycin as an outpatient","Oral ciprofloxacin for 14 days","Topical mupirocin three times daily","Oral cephalexin for about 5 days"],"correctIdx":[3],"answer":"D","c":"Mild nonpurulent cellulitis is treated with an oral agent active against streptococci, such as cephalexin, penicillin or dicloxacillin, usually for 5 days, extended if not improving. MRSA coverage (for example TMP-SMX or doxycycline added) is considered for purulent infection, penetrating trauma, MRSA colonization or injection drug use. Signs of systemic toxicity or rapid spread need IV therapy."},{"n":471,"t":"sata","visit":"Visit 1 (continued)","s":"Which instructions are **appropriate** for Mrs. Patel? **Select all that apply.**","opts":["Keep the leg hanging down when seated","Stop the antibiotic once the redness fades","Mark the edge of the redness to track spread","Elevate the affected leg","Treat the athlete's foot between her toes"],"correctIdx":[2,3,4],"answer":"C, D, E","c":"Elevating the leg reduces swelling and speeds healing. Treating predisposing conditions such as tinea pedis, edema and skin cracks reduces recurrence. Marking the border helps monitor progression; redness may appear to spread slightly in the first 24–48 hours. The full antibiotic course should be completed. Rapid spread, severe pain out of proportion, blistering or crepitus suggest necrotizing infection and need emergency care."}]},{"no":158,"batch":7,"title":"Mr. Okoro: Sweaty and Confused","setting":"Primary care clinic • Older adult • Endocrine / Pharmacology","scenario":"Mr. Okoro is a 79-year-old man with type 2 diabetes, CKD (eGFR 42), mild cognitive impairment and two falls this year. He takes glyburide 10 mg twice daily and metformin. His A1c is 6.2%. In the waiting room he becomes sweaty, shaky and confused. His fingerstick glucose is 48 mg/dL. He is awake and able to swallow.","qs":[{"n":472,"t":"ord","visit":"Visit 1","s":"**Place the steps for treating his hypoglycemia in the correct order** (the \"rule of 15\").","items":["Step 1","Step 2","Step 3","Step 4"],"tgts":["Recheck the blood glucose after 15 minutes","Give a snack or meal with protein once glucose has normalized","Give 15–20 g of fast-acting glucose, such as juice or glucose tablets","Repeat 15 g of glucose if the reading is still below 70 mg/dL"],"map":[2,0,3,1],"answer":"C, A, D, B","c":"For a conscious patient who can swallow, hypoglycemia (glucose below 70 mg/dL) is treated with 15–20 g of fast-acting carbohydrate, glucose is rechecked in 15 minutes, and treatment is repeated until glucose is above 70 mg/dL. A snack or meal containing protein then prevents recurrence. An unconscious patient needs glucagon (intranasal or injection) or IV dextrose. Hypoglycemia from sulfonylureas can recur for many hours."},{"n":473,"t":"mc","visit":"Visit 1 (continued)","s":"What is the **most important** medication change?","opts":["Keep glyburide and add a bedtime snack","Stop glyburide and choose a lower-risk agent","Add insulin glargine at bedtime each night","Double the metformin to replace glyburide"],"correctIdx":[1],"answer":"B","c":"Glyburide is a long-acting sulfonylurea that is cleared by the kidneys and carries a high risk of prolonged hypoglycemia in older adults, especially with CKD; the Beers Criteria advise avoiding sulfonylureas as first- or second-line agents. Lower-risk choices include a DPP-4 inhibitor (dose-adjusted for kidney function), a GLP-1 receptor agonist or an SGLT2 inhibitor. Metformin is limited when eGFR is below 45."},{"n":474,"t":"mc","visit":"Visit 1 (continued)","s":"What is a **reasonable** A1c goal for Mr. Okoro, given his frailty and hypoglycemia?","opts":["Below about 6.0%","Below about 11.0%","Below about 5.5%","Below about 8.0%"],"correctIdx":[3],"answer":"D","c":"The ADA recommends an A1c goal below 7.0–7.5% for healthy older adults, and a less stringent goal of below 8.0% (or 8.5% in some guidance) for older adults with multiple chronic illnesses, cognitive impairment, functional dependence or hypoglycemia risk. Avoiding hypoglycemia is the priority. His A1c of 6.2% on glyburide indicates overtreatment."}]},{"no":159,"batch":7,"title":"Ms. Fischer: White, Blue, Then Red","setting":"Primary care clinic • Middle adult • Rheumatology","scenario":"Ms. Fischer is a 49-year-old woman whose fingers turn white, then blue, then red and painful when she is cold or stressed. Over the past year the skin of her fingers has become tight and shiny, she has small white hard bumps on her fingertips, heartburn and difficulty swallowing, and small red spots on her face and palms. She smokes half a pack a day.","qs":[{"n":475,"t":"mc","visit":"Visit 1","s":"What is the **most likely** diagnosis?","opts":["Systemic lupus erythematosus","Rheumatoid arthritis with nodules","Limited systemic sclerosis (CREST)","Primary Raynaud phenomenon only"],"correctIdx":[2],"answer":"C","c":"Limited cutaneous systemic sclerosis (CREST syndrome) features Calcinosis, Raynaud phenomenon, Esophageal dysmotility, Sclerodactyly and Telangiectasias. Secondary Raynaud phenomenon is suggested by onset after age 30, digital ulcers, abnormal nailfold capillaries, positive autoantibodies and features of connective tissue disease. Primary Raynaud is milder, starts younger and has no underlying disease."},{"n":476,"t":"mc","visit":"Visit 1 (continued)","s":"Which antibody is **most associated** with her condition?","opts":["Anticentromere antibody","Anti-cyclic citrullinated peptide","Antimitochondrial antibody","Anti-double-stranded DNA"],"correctIdx":[0],"answer":"A","c":"Anticentromere antibodies are characteristic of limited cutaneous systemic sclerosis (CREST), which carries a risk of pulmonary arterial hypertension. Anti-topoisomerase I (Scl-70) is associated with diffuse systemic sclerosis and interstitial lung disease. Anti-dsDNA suggests lupus, anti-CCP rheumatoid arthritis, and antimitochondrial antibody primary biliary cholangitis."},{"n":477,"t":"mc","visit":"Visit 1 (continued)","s":"Which treatment is **first-line** for her Raynaud phenomenon?","opts":["Sumatriptan taken at each attack","Propranolol with cold-water hand soaks","Pseudoephedrine taken twice daily","Nifedipine with warmth and stopping smoking"],"correctIdx":[3],"answer":"D","c":"Raynaud phenomenon is managed by keeping the whole body and hands warm, avoiding cold and stress, stopping smoking, and avoiding vasoconstrictors such as decongestants, triptans and nonselective beta-blockers. A dihydropyridine calcium channel blocker such as nifedipine or amlodipine is first-line drug therapy. Digital ulcers need specialist care, and she needs screening for pulmonary hypertension and interstitial lung disease."}]},{"no":160,"batch":7,"title":"Mr. Fofana: Short of Breath After a Long Flight","setting":"Urgent visit • Middle adult • Respiratory / Hematology","scenario":"Mr. Fofana is a 44-year-old man who arrived yesterday from a 14-hour flight. This morning he developed sudden shortness of breath and sharp right-sided chest pain that worsens with deep breaths. HR is 112, RR 24, BP 128/80, SpO₂ 92% on room air and temperature 37.4 °C. His right calf is swollen and tender. His lungs are clear.","qs":[{"n":478,"t":"mc","visit":"Visit 1","s":"Pulmonary embolism is **likely** by clinical criteria. What is the **most appropriate** diagnostic test?","opts":["An outpatient exercise stress test","CT pulmonary angiography","A D-dimer test before any imaging","A plain chest x-ray alone"],"correctIdx":[1],"answer":"B","c":"When PE is clinically likely (Wells score above 4), the next step is CT pulmonary angiography in an emergency setting; a ventilation–perfusion scan is used if CT contrast is contraindicated. D-dimer is useful only to rule out PE in low- or intermediate-probability patients. The PERC rule cannot be used here because he is tachycardic, hypoxic and has leg swelling."},{"n":479,"t":"mc","visit":"Visit 1 (continued)","s":"What is the **most common** ECG finding in pulmonary embolism?","opts":["An S1Q3T3 pattern","Complete heart block","ST elevation in V1–V4","Sinus tachycardia"],"correctIdx":[3],"answer":"D","c":"Sinus tachycardia is the most common ECG finding in PE. The S1Q3T3 pattern (deep S in lead I, Q wave and inverted T in lead III), right bundle branch block, right axis deviation and T-wave inversion in V1–V4 suggest right heart strain but are uncommon and insensitive. A normal ECG does not exclude PE."},{"n":480,"t":"mc","visit":"Visit 2 (after diagnosis)","s":"CT confirms a PE. He is hemodynamically stable with no right heart strain. Which treatment is **preferred**?","opts":["Systemic thrombolysis with alteplase today","A direct oral anticoagulant such as apixaban","Aspirin 81 mg alone for 3 months","An IVC filter without any anticoagulant"],"correctIdx":[1],"answer":"B","c":"For hemodynamically stable, low-risk PE, a direct oral anticoagulant (apixaban or rivaroxaban, which need no heparin lead-in) is preferred, and selected low-risk patients can be treated as outpatients. Thrombolysis is reserved for massive PE with hypotension. IVC filters are used only when anticoagulation is contraindicated. A PE provoked by a transient factor such as travel is usually treated for at least 3 months."}]},{"no":161,"batch":7,"title":"Mr. Sato: Chest Pressure on the Stairs","setting":"Primary care clinic • Middle adult • Cardiovascular","scenario":"Mr. Sato is a 57-year-old man with hypertension and hyperlipidemia who smoked until 5 years ago. For 2 months he has had a predictable pressure-like chest discomfort when climbing two flights of stairs or walking fast in the cold, relieved within 5 minutes by rest. The pattern has not changed. His resting ECG is normal, and he can walk on a treadmill.","qs":[{"n":481,"t":"mc","visit":"Visit 1","s":"Which test is an **appropriate** initial evaluation for his stable chest pain?","opts":["A D-dimer and chest CT angiography","An immediate cardiac catheterization","An exercise ECG stress test","An upper GI endoscopy this month"],"correctIdx":[2],"answer":"C","c":"Stable angina is predictable chest discomfort with exertion or emotional stress that is relieved by rest or nitroglycerin. In a patient with an interpretable resting ECG who can exercise, exercise ECG testing (or stress imaging, or coronary CT angiography depending on risk) is appropriate. New, worsening or rest angina is unstable angina and needs emergency evaluation."},{"n":482,"t":"sata","visit":"Visit 1 (continued)","s":"He is prescribed sublingual nitroglycerin. Which teaching is **correct**? **Select all that apply.**","opts":["Sit down before taking a dose","Store the tablets in a plastic pill box in the car","It is safe to take with sildenafil the same day","Take 1 tablet every 5 minutes, up to 3 doses","Call 911 if pain is not better 5 minutes after the first dose"],"correctIdx":[0,3,4],"answer":"A, D, E","c":"Nitroglycerin can cause hypotension, so the patient should sit first. One tablet is taken under the tongue every 5 minutes for up to 3 doses, and 911 is called if pain is not improved 5 minutes after the first dose. Nitrates are contraindicated within 24–48 hours of PDE-5 inhibitors (sildenafil, tadalafil) because of severe hypotension. Tablets are stored in the original dark glass bottle away from heat, light and moisture."},{"n":483,"t":"mc","visit":"Visit 1 (continued)","s":"Which medications **reduce** his risk of heart attack and death?","opts":["Nitroglycerin and ranolazine only","A calcium supplement and vitamin E","Sublingual nitroglycerin alone","Aspirin and a high-intensity statin"],"correctIdx":[3],"answer":"D","c":"In chronic coronary disease, low-dose aspirin and high-intensity statin therapy reduce the risk of myocardial infarction and death, along with BP control and lifestyle changes. Beta-blockers or calcium channel blockers and long-acting nitrates or ranolazine relieve angina but mainly treat symptoms. Calcium and vitamin E supplements do not reduce cardiovascular risk."}]},{"no":162,"batch":7,"title":"Ms. Brown: Very High Triglycerides","setting":"Primary care clinic • Middle adult • Metabolic / Cardiovascular","scenario":"Ms. Brown is a 51-year-old woman with type 2 diabetes (A1c 9.4%), obesity and hypothyroidism who drinks 3–4 glasses of wine most evenings. Her fasting lipid panel shows triglycerides of 780 mg/dL, HDL 34 mg/dL and LDL that cannot be calculated. TSH is normal. She has no abdominal pain.","qs":[{"n":484,"t":"mc","visit":"Visit 1","s":"What is the **main** immediate risk of a triglyceride level this high?","opts":["Hepatitis C infection","Aortic valve stenosis","Acute kidney stones","Acute pancreatitis"],"correctIdx":[3],"answer":"D","c":"Triglycerides of 500 mg/dL or more (severe hypertriglyceridemia) increase the risk of acute pancreatitis, which becomes substantial above 1,000 mg/dL. The immediate goal is to lower triglycerides below 500 mg/dL. Secondary causes include uncontrolled diabetes, alcohol, obesity, hypothyroidism, kidney disease and medications such as estrogen, steroids and some antipsychotics."},{"n":485,"t":"mc","visit":"Visit 1 (continued)","s":"Which medication is **most appropriate** to lower her triglycerides?","opts":["Ezetimibe","Fenofibrate","Niacin cream","Colesevelam"],"correctIdx":[1],"answer":"B","c":"Fibrates such as fenofibrate are first-line drugs for triglycerides of 500 mg/dL or more to reduce pancreatitis risk, along with lifestyle changes and control of secondary causes. Prescription omega-3 fatty acids (icosapent ethyl) are another option. Bile acid sequestrants such as colesevelam can raise triglycerides, and ezetimibe mainly lowers LDL. A statin is still indicated for her cardiovascular risk."},{"n":486,"t":"sata","visit":"Visit 1 (continued)","s":"Which lifestyle changes will help **lower** her triglycerides? **Select all that apply.**","opts":["Improving her blood glucose control","Drinking more fruit juice daily","Cutting sugar and refined carbohydrates","Eating a very high-fat diet","Stopping alcohol"],"correctIdx":[0,2,4],"answer":"A, C, E","c":"Triglycerides respond strongly to stopping alcohol, reducing added sugars and refined carbohydrates (including sweetened drinks and fruit juice), weight loss, regular exercise and improving glycemic control. With triglycerides above 1,000 mg/dL, a very low-fat diet may also be needed. Fruit juice and a very high-fat diet would worsen her levels."}]},{"no":163,"batch":7,"title":"Mr. Mensah: Back Pain That Improves With Exercise","setting":"Primary care clinic • Middle adult • Rheumatology / Musculoskeletal","scenario":"Mr. Mensah is a 41-year-old man with low back and buttock pain that began gradually when he was 25. He has morning stiffness lasting more than an hour, wakes in the second half of the night with pain, and feels better after exercise and worse with rest. He had an episode of a painful red eye treated as anterior uveitis last year. Chest expansion is reduced.","qs":[{"n":487,"t":"mc","visit":"Visit 1","s":"What is the **most likely** diagnosis?","opts":["Lumbar disc herniation","Ankylosing spondylitis","Lumbar spinal stenosis","Mechanical back strain"],"correctIdx":[1],"answer":"B","c":"Ankylosing spondylitis (axial spondyloarthritis) causes inflammatory back pain: onset before 45, gradual onset, morning stiffness longer than 30 minutes, improvement with exercise but not rest, and night pain in the second half of the night. Associated features include anterior uveitis, enthesitis, reduced chest expansion and sacroiliitis on imaging. Most patients are HLA-B27 positive."},{"n":488,"t":"mc","visit":"Visit 1 (continued)","s":"Which examination finding **supports** the diagnosis?","opts":["Limited lumbar flexion on the modified Schober test","A positive straight-leg raise on the right side","A positive Phalen maneuver in both wrists","A positive Thompson test on the left calf"],"correctIdx":[0],"answer":"A","c":"The modified Schober test measures lumbar flexion: marks 10 cm above and 5 cm below the lumbosacral junction should separate by at least 5 cm with forward bending; less suggests reduced spinal mobility, as in ankylosing spondylitis. Reduced chest expansion, increased occiput-to-wall distance and sacroiliac tenderness are other findings. MRI of the sacroiliac joints detects early sacroiliitis."},{"n":489,"t":"mc","visit":"Visit 1 (continued)","s":"What is the **first-line** treatment?","opts":["Opioids and avoiding all physical activity","Long-term oral prednisone with strict bed rest","Methotrexate alone for spinal disease","NSAIDs with regular exercise and physical therapy"],"correctIdx":[3],"answer":"D","c":"First-line treatment for axial spondyloarthritis is NSAIDs at full dose with regular exercise and physical therapy to maintain posture and mobility. If symptoms persist despite at least two NSAIDs, TNF inhibitors or IL-17 inhibitors are used. Systemic steroids and conventional DMARDs such as methotrexate are not effective for axial disease. Smoking cessation is important."}]},{"no":164,"batch":7,"title":"Mrs. Ogun: When to Start Mammograms","setting":"Annual exam • Middle adult • Women's health / Health promotion","scenario":"Mrs. Ogun is a 45-year-old woman at average risk for breast cancer who has never had a mammogram because she heard screening starts at 50. She has no breast symptoms, no personal history of breast disease or chest radiation, and no family history of breast or ovarian cancer. A friend told her she has \"dense breasts\" and wonders whether she does too.","qs":[{"n":490,"t":"mc","visit":"Visit 1","s":"What does the USPSTF recommend for breast cancer screening in average-risk women?","opts":["Clinical breast exam only until 50","Breast MRI every year from age 30","Mammography every 2 years from 40 to 74","Mammography every year from 50 to 85"],"correctIdx":[2],"answer":"C","c":"The USPSTF (2024) recommends biennial screening mammography for women aged 40–74 (grade B). Evidence is insufficient for women 75 and older and for supplemental screening in dense breasts. Other organizations, such as ACOG and ACS, support offering annual screening starting at 40 to 45. Women at high risk (for example BRCA carriers or prior chest radiation) need earlier screening, often with MRI."},{"n":491,"t":"mc","visit":"Visit 2 (after mammogram)","s":"Her report says she has **dense breast tissue**. What does this mean?","opts":["It is rare and requires a yearly breast MRI for all","It means mammograms no longer need to be done","It lowers mammogram sensitivity and slightly raises risk","It means she has breast cancer and needs a biopsy"],"correctIdx":[2],"answer":"C","c":"Dense breast tissue is common (about half of women aged 40–74). It makes mammograms less sensitive because dense tissue and tumors both appear white, and it modestly increases breast cancer risk. Federal rules require that patients be told about breast density. Supplemental imaging (ultrasound or MRI) may be discussed, but evidence for routine use is insufficient; regular mammography continues."},{"n":492,"t":"sata","visit":"Visit 2 (continued)","s":"Which statements about screening mammography are **correct**? **Select all that apply.**","opts":["Ultrasound can replace mammography for routine screening","Screening after 75 is an individualized decision","Digital breast tomosynthesis (3D) is an acceptable option","False-positive results that need more imaging are common","Monthly self-exams have been proven to lower mortality"],"correctIdx":[1,2,3],"answer":"B, C, D","c":"Over 10 years of screening, many women experience at least one false-positive result needing more imaging or biopsy. Both 2D digital mammography and tomosynthesis are acceptable. Screening beyond 75 depends on health and life expectancy. Breast self-awareness is encouraged, but structured self-examination has not been shown to lower mortality, and ultrasound is not a substitute for mammography."}]},{"no":165,"batch":7,"title":"Ms. Lopez: A Christmas-Tree Rash","setting":"Primary care clinic • Young adult • Dermatology","scenario":"Ms. Lopez is a 22-year-old woman who noticed a single 3-cm oval, pink, scaly patch on her chest 10 days ago. Over the past week many smaller oval pink patches with fine scale have appeared on her trunk, lined up along skin creases in a \"Christmas tree\" pattern. They itch mildly. She had a mild cold before the rash. She is sexually active with a new partner. Her palms and soles are clear.","qs":[{"n":493,"t":"mc","visit":"Visit 1","s":"What is the **most likely** diagnosis?","opts":["Pityriasis rosea","Tinea versicolor","Drug eruption","Guttate psoriasis"],"correctIdx":[0],"answer":"A","c":"Pityriasis rosea begins with a single larger \"herald patch,\" followed 1–2 weeks later by smaller oval, salmon-pink patches with a fine collarette of scale along skin cleavage lines on the trunk (\"Christmas tree\" pattern). It is thought to be linked to HHV-6 and HHV-7 reactivation, is self-limited over 6–8 weeks, and needs only symptomatic treatment."},{"n":494,"t":"mc","visit":"Visit 1 (continued)","s":"Which test should be **considered** because she is sexually active?","opts":["A KOH prep for a dermatophyte","An RPR to exclude secondary syphilis","A skin biopsy for every patient","A patch test for contact allergy"],"correctIdx":[1],"answer":"B","c":"Secondary syphilis can mimic pityriasis rosea with a widespread papulosquamous rash; it often involves the palms and soles and lacks a herald patch. A nontreponemal test (RPR or VDRL) should be considered in sexually active patients with an atypical rash. A KOH prep helps exclude tinea when there is an annular lesion."},{"n":495,"t":"match","visit":"Visit 2 (teaching)","s":"The FNP reviews other common rashes. **Drag each condition to its classic description.** One option will not be used.","items":["Tinea versicolor","Tinea corporis","Scabies"],"tgts":["Intensely itchy burrows in the finger webs, worse at night","Salmon-pink plaques with thick silvery scale on the elbows","Ring-shaped scaly plaque with central clearing and a raised edge","Light or dark scaly patches on the trunk; KOH shows \"spaghetti and meatballs\""],"map":[3,2,0],"answer":"1–D, 2–C, 3–A","c":"Tinea versicolor (Malassezia) causes hypo- or hyperpigmented, finely scaly macules on the trunk; KOH shows short hyphae and spores (\"spaghetti and meatballs\"); it is treated with selenium sulfide or topical azoles. Tinea corporis forms an annular plaque with central clearing and a scaly advancing edge, treated with topical terbinafine or azoles. Scabies causes intense nocturnal itching with burrows in finger webs and wrists and is treated with permethrin for the patient and close contacts. The unused option describes psoriasis."}]},{"no":166,"batch":7,"title":"Mr. Kowal: Ready to Quit Smoking","setting":"Primary care clinic • Young adult • Health promotion / Substance use","scenario":"Mr. Kowal is a 28-year-old man who smokes a pack a day and has his first cigarette within 10 minutes of waking. He says his daughter was just born and he wants to quit. He has tried quitting \"cold turkey\" twice. He has a history of an eating disorder (bulimia) in his teens and no seizures. He takes no other medications.","qs":[{"n":496,"t":"ord","visit":"Visit 1","s":"**Place the \"5 A's\" of tobacco cessation counseling in the correct order.**","items":["Step 1","Step 2","Step 3","Step 4","Step 5"],"tgts":["Advise every tobacco user to quit","Ask about tobacco use at every visit","Arrange follow-up contact","Assist with counseling and medication","Assess readiness to make a quit attempt"],"map":[1,0,4,3,2],"answer":"B, A, E, D, C","c":"The 5 A's framework is Ask, Advise, Assess, Assist and Arrange. For patients not yet ready to quit, the 5 R's (Relevance, Risks, Rewards, Roadblocks, Repetition) build motivation. Combining counseling with medication is more effective than either alone, and referral to a quitline (1-800-QUIT-NOW) adds support."},{"n":497,"t":"mc","visit":"Visit 1 (continued)","s":"Which single medication is the **most effective** for smoking cessation?","opts":["Clonidine","Varenicline","Gum alone","Bupropion"],"correctIdx":[1],"answer":"B","c":"Varenicline, a partial nicotine receptor agonist, is the most effective single agent for smoking cessation, and combination nicotine replacement therapy (a long-acting patch plus a short-acting gum, lozenge or inhaler) is similarly effective. Varenicline is started 1 week before the quit date and continued for 12 weeks. Nausea and vivid dreams are common side effects; the boxed warning for neuropsychiatric effects was removed in 2016."},{"n":498,"t":"sata","visit":"Visit 1 (continued)","s":"Which conditions are **contraindications** to bupropion? **Select all that apply.**","opts":["Mild depression","Controlled hypertension","A current or past eating disorder","A seizure disorder","Use of an MAO inhibitor in the past 14 days"],"correctIdx":[2,3,4],"answer":"C, D, E","c":"Bupropion lowers the seizure threshold, so it is contraindicated in seizure disorders, bulimia or anorexia nervosa (electrolyte shifts raise seizure risk), abrupt alcohol or sedative withdrawal, and within 14 days of an MAO inhibitor. It is a useful option for smokers with depression. BP should be monitored, especially when combined with nicotine replacement."}]},{"no":167,"batch":7,"title":"Mr. Rossi: A Swollen, Painful Testicle","setting":"Urgent visit • Young adult • Genitourinary / Sexual health","scenario":"Mr. Rossi is a 24-year-old man with 3 days of gradually increasing pain and swelling of the right side of his scrotum, burning with urination and a temperature of 38.1 °C. He has had a new female partner for a month and uses condoms inconsistently. The right epididymis is tender and swollen. Lifting the scrotum eases the pain, and the cremasteric reflex is present on both sides.","qs":[{"n":499,"t":"mc","visit":"Visit 1","s":"What is the **most likely** diagnosis?","opts":["Testicular torsion","Testicular cancer","Acute epididymitis","Inguinal hernia"],"correctIdx":[2],"answer":"C","c":"Acute epididymitis causes gradual onset of unilateral scrotal pain and swelling with a tender epididymis, often with urinary symptoms and fever. Pain may ease with scrotal elevation (positive Prehn sign) and the cremasteric reflex is preserved. In sexually active men under 35, the usual causes are Chlamydia trachomatis and Neisseria gonorrhoeae; in older men, enteric organisms are more common."},{"n":500,"t":"mc","visit":"Visit 1 (continued)","s":"What is the **recommended** treatment for Mr. Rossi?","opts":["Ceftriaxone 500 mg IM once plus doxycycline for 10 days","Oral amoxicillin for 5 days with no partner testing","Nitrofurantoin twice daily for 7 days only","Topical antifungal cream twice a day for 2 weeks"],"correctIdx":[0],"answer":"A","c":"For acute epididymitis likely caused by chlamydia or gonorrhea, the CDC recommends ceftriaxone 500 mg IM once plus doxycycline 100 mg twice daily for 10 days. If enteric organisms are also likely (for example, insertive anal sex), levofloxacin replaces doxycycline. Scrotal elevation, ice and NSAIDs help symptoms. Recent partners should be evaluated and treated."},{"n":501,"t":"mc","visit":"Visit 1 (continued)","s":"Which finding would suggest **testicular torsion** instead and require emergency surgery?","opts":["Sudden severe pain with an absent cremasteric reflex","A tender epididymis with a normal testicle position","Gradual pain over 3 days with a fever and dysuria","Pain that improves when the scrotum is lifted up"],"correctIdx":[0],"answer":"A","c":"Testicular torsion causes sudden, severe scrotal pain, often with nausea and vomiting, a high-riding testis with a horizontal lie, and an absent cremasteric reflex. It is a surgical emergency, because the testis is best saved within 6 hours. Doppler ultrasound shows reduced flow, but surgery should not be delayed when suspicion is high."}]},{"no":168,"batch":7,"title":"Ms. Ito: A Painful Red Eye in a Contact Lens Wearer","setting":"Urgent visit • Young adult • Eye","scenario":"Ms. Ito is a 25-year-old woman who wears soft contact lenses and sometimes sleeps in them. She has 1 day of increasing pain, redness, tearing, light sensitivity and blurred vision in her right eye. On examination there is a white spot on the cornea with redness concentrated around the cornea. Visual acuity is reduced in that eye.","qs":[{"n":502,"t":"mc","visit":"Visit 1","s":"What is the **most appropriate** action?","opts":["Warm compresses with lubricating drops only","Same-day ophthalmology referral for possible keratitis","Topical steroid drops and a recheck in 2 weeks","Patch the eye and let her keep wearing lenses"],"correctIdx":[1],"answer":"B","c":"A painful red eye with photophobia, reduced vision and a corneal opacity in a contact lens wearer suggests bacterial keratitis, often caused by Pseudomonas aeruginosa, which can perforate the cornea within days. It needs same-day ophthalmology evaluation, corneal cultures and intensive topical antibiotics such as a fluoroquinolone. Steroids and patching are contraindicated."},{"n":503,"t":"match","visit":"Visit 2 (teaching)","s":"**Drag each type of conjunctivitis to its typical features.** One option will not be used.","items":["Bacterial","Viral","Allergic"],"tgts":["Severe pain, halos around lights and a fixed mid-dilated pupil","Bilateral itching and watery eyes during pollen season","Thick purulent discharge with lids stuck together in the morning","Watery discharge, a tender preauricular node and a recent cold"],"map":[2,3,1],"answer":"1–C, 2–D, 3–B","c":"Bacterial conjunctivitis causes thick purulent discharge and morning crusting and is treated with topical antibiotics (fluoroquinolones for contact lens wearers). Viral conjunctivitis (often adenovirus) causes watery discharge, a preauricular node and often follows an upper respiratory infection; it is very contagious and treated supportively. Allergic conjunctivitis causes bilateral itching and is treated with antihistamine–mast cell stabilizer drops. Severe pain, halos and a fixed mid-dilated pupil suggest acute angle-closure glaucoma."},{"n":504,"t":"sata","visit":"Visit 2 (continued)","s":"Which contact lens instructions are **correct**? **Select all that apply.**","opts":["Never sleep in lenses unless they are approved for it","Rinse lenses and cases with tap water to clean them","Do not wear lenses until the eye has fully healed","Remove lenses at the first sign of a red, painful eye","Patch the eye if it becomes red while wearing lenses"],"correctIdx":[0,2,3],"answer":"A, C, D","c":"Contact lens wearers should remove lenses at the first sign of redness, pain or blurred vision and seek prompt care, should not resume wearing them until healed, and should avoid sleeping in lenses, swimming or showering in them. Tap water can contain Acanthamoeba, which causes a severe keratitis, so only proper solutions should be used. Eye patching in lens wearers increases the risk of Pseudomonas infection."}]},{"no":169,"batch":7,"title":"Mrs. Usman: The First Prenatal Visit","setting":"Prenatal visit • Young adult • Women's health / Pharmacology","scenario":"Mrs. Usman is a 27-year-old woman at 8 weeks of gestation with her first pregnancy, which was unplanned. She has chronic hypertension treated with lisinopril and hypothyroidism treated with levothyroxine. She takes acetaminophen occasionally for headaches. She has not been taking any vitamins. Her previous child did not have any birth defects.","qs":[{"n":505,"t":"mc","visit":"Visit 1","s":"What dose of folic acid is **recommended** for her?","opts":["4 mg once daily","10 mg once daily","None is needed now","0.4–0.8 mg daily"],"correctIdx":[3],"answer":"D","c":"All people who could become pregnant should take 0.4–0.8 mg (400–800 mcg) of folic acid daily, starting at least 1 month before conception and continuing through early pregnancy, to reduce the risk of neural tube defects (USPSTF grade A). A higher dose of 4 mg daily is recommended for those with a previous pregnancy affected by a neural tube defect."},{"n":506,"t":"mc","visit":"Visit 1 (continued)","s":"Which of her medications must be **changed** because it is teratogenic?","opts":["Levothyroxine tablets","Prenatal vitamin","Lisinopril tablets","Acetaminophen tablets"],"correctIdx":[2],"answer":"C","c":"ACE inhibitors and ARBs are contraindicated in pregnancy because they cause fetal kidney damage, oligohydramnios, skull hypoplasia and death, mainly in the second and third trimesters. They should be switched to labetalol, nifedipine or methyldopa. Levothyroxine is continued, and the dose usually needs to increase by about 25–30% in pregnancy. Acetaminophen is the preferred analgesic."},{"n":507,"t":"mc","visit":"Visit 1 (continued)","s":"Which vaccine is **recommended during each pregnancy**?","opts":["Tdap at 27–36 weeks of gestation","Varicella in the second trimester","Live nasal spray influenza vaccine","MMR in the first trimester"],"correctIdx":[0],"answer":"A","c":"Tdap is recommended during each pregnancy at 27–36 weeks so that maternal antibodies protect the newborn from pertussis. Inactivated influenza vaccine is recommended in any trimester during flu season, and COVID-19 and seasonal RSV vaccine (at 32–36 weeks) are also recommended. Live vaccines such as MMR, varicella and nasal spray influenza are contraindicated in pregnancy."}]},{"no":170,"batch":7,"title":"Mr. Hill: Hearing Voices","setting":"Primary care clinic • Young adult • Mental health","scenario":"Mr. Hill is a 22-year-old man brought by his mother. For 8 months he has heard voices commenting on his actions, believes neighbors are monitoring him through the television, has withdrawn from friends, stopped attending classes and neglects his hygiene. He does not use drugs and his urine drug screen is negative. He has no manic symptoms. A psychiatrist starts risperidone and the FNP co-manages his physical health.","qs":[{"n":508,"t":"mc","visit":"Visit 1","s":"How long must symptoms be present for a diagnosis of **schizophrenia**?","opts":["At least 2 weeks","At least 5 years","At least 1 week","At least 6 months"],"correctIdx":[3],"answer":"D","c":"Schizophrenia requires two or more of delusions, hallucinations, disorganized speech, grossly disorganized or catatonic behavior and negative symptoms for at least 1 month, with continuous signs of disturbance for at least 6 months and a decline in functioning. Brief psychotic disorder lasts less than 1 month, and schizophreniform disorder lasts 1–6 months."},{"n":509,"t":"match","visit":"Visit 2 (2 weeks later)","s":"The FNP teaches the family about antipsychotic adverse effects. **Drag each effect to its description.** One option will not be used.","items":["Acute dystonia","Akathisia","Neuroleptic malignant syndrome"],"tgts":["High fever, \"lead-pipe\" rigidity, confusion and a high CK","Sudden painful spasm of the neck, jaw or eyes within days","An inner restlessness and inability to sit still","Clonus and hyperreflexia soon after adding an SSRI"],"map":[1,2,0],"answer":"1–B, 2–C, 3–A","c":"Acute dystonia (torticollis, oculogyric crisis) occurs within days and is treated with benztropine or diphenhydramine. Akathisia is inner restlessness, managed by dose reduction or propranolol. Neuroleptic malignant syndrome is a life-threatening emergency with fever, lead-pipe rigidity, altered mental status, autonomic instability and raised CK. Tardive dyskinesia (involuntary orofacial movements) develops after long-term use. Clonus and hyperreflexia after adding an SSRI describe serotonin syndrome."},{"n":510,"t":"sata","visit":"Visit 2 (continued)","s":"Which monitoring is **recommended** for patients taking second-generation antipsychotics? **Select all that apply.**","opts":["Weekly serum amylase","Fasting lipid panel","Fasting glucose or A1c","Weight, BMI and waist circumference","Monthly bone density scans"],"correctIdx":[1,2,3],"answer":"B, C, D","c":"Second-generation antipsychotics (especially olanzapine and clozapine) cause weight gain, diabetes and dyslipidemia. Recommended monitoring includes weight and BMI at each visit early on, waist circumference, BP, fasting glucose or A1c and lipids at baseline, 12 weeks and yearly, and checks for movement disorders. Risperidone can also raise prolactin. Clozapine requires absolute neutrophil count monitoring."}]},{"no":171,"batch":7,"title":"Tyler: Tender Lumps Under the Nipples","setting":"Primary care clinic • Adolescent • Endocrine / Development","scenario":"Tyler is a 14-year-old boy, Tanner stage 3, who is embarrassed about tender, rubbery, 2-cm disks of tissue under both nipples that appeared 4 months ago. He has no nipple discharge. He does not use anabolic steroids, marijuana or other drugs and takes no medications. His testicular examination is normal and his BMI is normal.","qs":[{"n":511,"t":"mc","visit":"Visit 1","s":"What is the **most likely** diagnosis?","opts":["Male breast cancer","Pseudogynecomastia","Klinefelter syndrome","Pubertal gynecomastia"],"correctIdx":[3],"answer":"D","c":"Pubertal gynecomastia affects up to two-thirds of adolescent boys, usually at Tanner stages 2–4, from a temporary imbalance between estrogen and testosterone. It presents as a tender, rubbery, mobile disk of glandular tissue directly under the areola, often bilateral. Pseudogynecomastia is fat without glandular tissue in obese boys. Klinefelter syndrome causes small, firm testes."},{"n":512,"t":"mc","visit":"Visit 1 (continued)","s":"What is the **most appropriate** management?","opts":["An urgent mammogram and core biopsy","Reassurance and follow-up in 3–6 months","Immediate surgical removal of the tissue","Daily testosterone injections for a year"],"correctIdx":[1],"answer":"B","c":"Pubertal gynecomastia usually resolves on its own within 6 months to 2 years, so reassurance and periodic re-examination are appropriate. Medications such as tamoxifen are occasionally used for persistent, painful cases, and surgery is considered for gynecomastia that persists after puberty. Testosterone would worsen it."},{"n":513,"t":"sata","visit":"Visit 1 (continued)","s":"Which findings would prompt **further evaluation**? **Select all that apply.**","opts":["Bilateral tender rubbery disks at Tanner 3","A testicular mass","Breast enlargement before puberty begins","Tissue that is shrinking over 6 months","A hard, fixed, eccentric breast mass"],"correctIdx":[1,2,4],"answer":"B, C, E","c":"Red flags include a testicular mass (a hormone-secreting tumor), a hard, fixed or eccentric mass with skin changes or nipple discharge, gynecomastia before puberty or after it ends, rapid growth, very large breasts, small testes and signs of other endocrine disorders. A medication and substance history (anabolic steroids, marijuana, spironolactone, antipsychotics) is important."}]},{"no":172,"batch":7,"title":"Aisha: A Runner With a Stress Fracture","setting":"Sports clinic • Adolescent • Women's health / Musculoskeletal","scenario":"Aisha is a 17-year-old cross-country runner who runs 60 miles a week. She has a stress fracture of the second metatarsal. She has not had a period in 7 months, although her cycles were regular before. She has lost 10 lb this season, eats \"clean\" and avoids most fats and carbohydrates. Her BMI is 17.5.","qs":[{"n":514,"t":"sata","visit":"Visit 1","s":"Which conditions make up the **female athlete triad**? **Select all that apply.**","opts":["High blood pressure","Low bone mineral density","Low energy availability","Menstrual dysfunction","Iron overload"],"correctIdx":[1,2,3],"answer":"B, C, D","c":"The female athlete triad consists of low energy availability (with or without disordered eating), menstrual dysfunction (functional hypothalamic amenorrhea) and low bone mineral density, which raises the risk of stress fractures. The broader concept of Relative Energy Deficiency in Sport (RED-S) includes effects on many body systems in athletes of any gender."},{"n":515,"t":"mc","visit":"Visit 1 (continued)","s":"What is the **first** test to order for her secondary amenorrhea?","opts":["A karyotype test","A pregnancy test","A pelvic MRI scan","A brain MRI scan"],"correctIdx":[1],"answer":"B","c":"Pregnancy is the most common cause of secondary amenorrhea and must be excluded first, even when another cause seems likely. Further evaluation includes TSH, prolactin and FSH; in functional hypothalamic amenorrhea, FSH and LH are low or normal with low estradiol. A DEXA scan is considered for amenorrhea lasting 6 months or more or after stress fractures."},{"n":516,"t":"mc","visit":"Visit 1 (continued)","s":"What is the **most important** treatment for Aisha?","opts":["Increase her mileage to build bone density faster","Take calcium alone and keep her current eating plan","Increase energy intake and adjust her training load","Start a combined oral contraceptive to restore bone"],"correctIdx":[2],"answer":"C","c":"The primary treatment is restoring energy availability by increasing caloric intake and reducing training, with a multidisciplinary team including a sports dietitian and mental health professional. This restores menses and protects bone. Combined oral contraceptives produce withdrawal bleeding but do not restore bone density and can mask recovery. Adequate calcium and vitamin D are supportive."}]},{"no":173,"batch":7,"title":"Baby Leo: The Happy Spitter","setting":"Well-child visit • Infant • Gastrointestinal","scenario":"Leo is a 3-month-old boy who is formula-fed. His mother is worried because he spits up small amounts of milk after most feeds, sometimes through his nose. He is otherwise content, feeds eagerly, has plenty of wet diapers and has gained weight along the 50th percentile. The spit-up is milky, not green or bloody, and is not forceful.","qs":[{"n":517,"t":"mc","visit":"Visit 1","s":"What is the **most likely** diagnosis?","opts":["Hypertrophic pyloric stenosis","Physiologic gastroesophageal reflux","Cow's milk protein allergy","Gastroesophageal reflux disease"],"correctIdx":[1],"answer":"B","c":"Physiologic gastroesophageal reflux (\"happy spitter\") is common, peaks around 4 months, and resolves in most infants by 12–18 months. The infant is thriving, feeds well and is not distressed. GERD is reflux causing troublesome symptoms or complications such as poor weight gain, feeding refusal or respiratory problems. Pyloric stenosis causes forceful, projectile vomiting."},{"n":518,"t":"mc","visit":"Visit 1 (continued)","s":"What is the **most appropriate** management?","opts":["Reassurance and avoiding overfeeding","A daily proton pump inhibitor","Switching to a soy formula now","An upper GI series this week"],"correctIdx":[0],"answer":"A","c":"Thriving infants with physiologic reflux need only reassurance and simple measures: avoiding overfeeding, smaller and more frequent feeds, frequent burping and holding the infant upright after feeds. Infants should still sleep on their backs. Acid-suppressing drugs are not recommended for uncomplicated reflux because they do not reduce spitting and increase infection risk. A 2–4 week trial of hydrolyzed formula may be considered if cow's milk protein allergy is suspected."},{"n":519,"t":"sata","visit":"Visit 1 (continued)","s":"Which signs would be **red flags** needing further evaluation? **Select all that apply.**","opts":["Green (bilious) vomiting","Spit-up that is milky white","Spitting up during burping","Poor weight gain or weight loss","Forceful projectile vomiting"],"correctIdx":[0,3,4],"answer":"A, D, E","c":"Red flags in a vomiting infant include bilious vomiting (malrotation with volvulus is a surgical emergency), projectile vomiting (pyloric stenosis), blood in vomit or stool, poor weight gain, lethargy, fever, a bulging fontanelle, onset after 6 months, and persistence beyond 12–18 months. Spitting up milky feeds, especially with burping, is typical of physiologic reflux."}]},{"no":174,"batch":7,"title":"Sam: Still Wetting the Bed","setting":"Primary care clinic • School-age child • Genitourinary / Development","scenario":"Sam is a 7-year-old boy who has never been dry at night and wets the bed about five nights a week. He is dry during the day, with no urgency, painful urination, constipation, snoring or excessive thirst. His father wet the bed until age 9. His physical examination is normal. Sam is upset because he wants to go to a sleepover.","qs":[{"n":520,"t":"mc","visit":"Visit 1","s":"Which test is **recommended** in the initial evaluation?","opts":["A spinal cord MRI","A bladder VCUG study","A renal ultrasound","A routine urinalysis"],"correctIdx":[3],"answer":"D","c":"Primary nocturnal enuresis (never achieved night-time dryness) in a child over 5 without daytime symptoms is usually caused by nocturnal polyuria, reduced bladder capacity and difficulty waking, often with a family history. A urinalysis is recommended to screen for diabetes (glucosuria), infection or concentrating defects. Imaging is not needed unless daytime symptoms, UTIs or neurological findings are present."},{"n":521,"t":"mc","visit":"Visit 1 (continued)","s":"Which treatment has the **best long-term** success for motivated families?","opts":["Punishment after each wet night","Imipramine nightly as first choice","An enuresis (bed-wetting) alarm","Desmopressin taken every single night"],"correctIdx":[2],"answer":"C","c":"The enuresis alarm has the highest long-term cure rate, conditioning the child to wake to bladder fullness, but it requires 2–3 months of consistent use and family commitment. Desmopressin works quickly and is useful for short-term needs such as sleepovers or camp, but relapse after stopping is common. Punishment is harmful, and imipramine is rarely used because of cardiac toxicity in overdose."},{"n":522,"t":"mc","visit":"Visit 1 (continued)","s":"Sam's parents choose desmopressin for the sleepover. Which teaching is **most important**?","opts":["Limit fluids from 1 hour before to 8 hours after the dose","Double the dose on any night he has a wet bed","Encourage large drinks at bedtime to flush the bladder","Take the dose in the morning with breakfast each day"],"correctIdx":[0],"answer":"A","c":"Desmopressin reduces urine production overnight. Fluid intake must be limited from 1 hour before to 8 hours after the bedtime dose to prevent water intoxication and hyponatremia, which can cause headache, vomiting and seizures. It should be held during illnesses with vomiting or diarrhea or with fever. Intranasal desmopressin is no longer used for enuresis."}]},{"no":175,"batch":7,"title":"Baby Amara: Before Going Home","setting":"Newborn nursery • Newborn • Health promotion","scenario":"Amara is a 26-hour-old girl born at 39 weeks after an uncomplicated pregnancy. She is breastfeeding well. Before discharge, the FNP reviews routine newborn care. Her parents ask why so many tests and shots are needed. On her screening pulse oximetry, her right hand reads 93% and her foot reads 89%. She appears comfortable and pink.","qs":[{"n":523,"t":"sata","visit":"Visit 1","s":"Which screenings are **routinely** recommended for all newborns before discharge? **Select all that apply.**","opts":["Hearing screening","Heel-stick blood test for metabolic disorders","A routine head ultrasound","A routine chest x-ray","Pulse oximetry for critical congenital heart disease"],"correctIdx":[0,1,4],"answer":"A, B, E","c":"Universal newborn screening includes pulse oximetry for critical congenital heart disease after 24 hours of age, hearing screening (with follow-up by 3 months if failed and intervention by 6 months), and a heel-stick dried blood spot for conditions such as PKU, congenital hypothyroidism, sickle cell disease and cystic fibrosis. Bilirubin risk assessment is also done before discharge. Routine imaging is not recommended."},{"n":524,"t":"mc","visit":"Visit 1 (continued)","s":"Her parents ask why she received vitamin K. What is the **correct** explanation?","opts":["It protects her against hepatitis B","It prevents jaundice in the first week","It prevents vitamin K deficiency bleeding","It prevents eye infection from gonorrhea"],"correctIdx":[2],"answer":"C","c":"Newborns have low vitamin K stores, and breast milk contains little vitamin K, so a single IM dose at birth prevents vitamin K deficiency bleeding, which can cause intracranial hemorrhage. Erythromycin eye ointment prevents gonococcal eye infection, and the hepatitis B vaccine is given within 24 hours of birth. Vitamin K does not prevent jaundice."},{"n":525,"t":"mc","visit":"Visit 1 (continued)","s":"Amara's pulse oximetry is 93% in the right hand and 89% in the foot. What is the **next** step?","opts":["Discharge home with reassurance","An echocardiogram before discharge","Start breastfeeding more often","Repeat the screen in 1 month"],"correctIdx":[1],"answer":"B","c":"A CCHD screen fails if any reading is below 90%. It passes if either the right hand or foot is 95% or more with a difference of 3% or less. Readings of 90–94% or a difference above 3% require repeat testing. A reading below 90%, as in Amara's foot, is an immediate failure requiring evaluation for hypoxemia, including an echocardiogram and cardiology consultation before discharge."}]},{"no":176,"batch":8,"title":"Mrs. Owusu: Glare From the Headlights","setting":"Primary care clinic • Older adult • Eye","scenario":"Mrs. Owusu is a 75-year-old woman with type 2 diabetes who has had gradually blurred vision in both eyes for 2 years. She sees halos and glare around headlights at night and has stopped driving after dark. Colors look faded and she keeps changing her glasses prescription. She took prednisone for asthma flares many times. The red reflex is dull in both eyes.","qs":[{"n":526,"t":"mc","visit":"Visit 1","s":"What is the **most likely** diagnosis?","opts":["Diabetic retinopathy","Retinal detachment","Age-related cataracts","Open-angle glaucoma"],"correctIdx":[2],"answer":"C","c":"Cataracts (clouding of the lens) cause gradual, painless blurring, glare and halos at night, faded colors, frequent prescription changes and a diminished or absent red reflex. Glaucoma causes painless peripheral vision loss, diabetic retinopathy causes retinal hemorrhages and exudates, and retinal detachment causes sudden floaters, flashes and a curtain-like vision loss."},{"n":527,"t":"mc","visit":"Visit 1 (continued)","s":"When is cataract surgery **indicated**?","opts":["As soon as any lens clouding is seen","When vision loss limits daily activities","Only after she becomes completely blind","Only once she reaches age 85 or older"],"correctIdx":[1],"answer":"B","c":"Cataract surgery (lens extraction with intraocular lens implant) is indicated when reduced vision interferes with the patient's daily activities, such as driving, reading or safety, rather than at a specific stage. It is one of the most successful surgeries and can also reduce fall and crash risk. Updated glasses and better lighting help in early stages."},{"n":528,"t":"sata","visit":"Visit 1 (continued)","s":"Which are **risk factors** for cataracts? **Select all that apply.**","opts":["Daily low-dose aspirin","Cigarette smoking","Reading for many hours","Long-term corticosteroid use","Diabetes mellitus"],"correctIdx":[1,3,4],"answer":"B, D, E","c":"Cataract risk factors include aging, smoking, diabetes, long-term corticosteroid use (systemic, inhaled or topical), ultraviolet light exposure, eye trauma, heavy alcohol use and prior eye surgery. Sunglasses and smoking cessation reduce risk. Aspirin and reading do not cause cataracts."}]},{"no":177,"batch":8,"title":"Mrs. Bianchi: Breathless With a Normal Pump","setting":"Primary care clinic • Older adult • Cardiovascular","scenario":"Mrs. Bianchi is a 78-year-old woman with long-standing hypertension, obesity and type 2 diabetes who has had 3 months of shortness of breath on exertion, swelling of both ankles and a 6-lb weight gain. She sleeps on two pillows. Her echocardiogram shows an ejection fraction of 60% with a thick, stiff left ventricle. BNP is elevated. An extra heart sound is heard just before S1.","qs":[{"n":529,"t":"mc","visit":"Visit 1","s":"How is Mrs. Bianchi's heart failure **classified**?","opts":["Isolated right heart failure from the lungs","Heart failure with mildly reduced fraction","Heart failure with reduced ejection fraction","Heart failure with preserved ejection fraction"],"correctIdx":[3],"answer":"D","c":"Heart failure with preserved ejection fraction (HFpEF) is heart failure with an EF of 50% or more, caused by a stiff ventricle that does not relax and fill well. It is common in older women with hypertension, obesity, diabetes and atrial fibrillation. HFrEF is an EF of 40% or less, and HF with mildly reduced EF is 41–49%."},{"n":530,"t":"hot","visit":"Visit 1 (continued)","s":"The extra sound is an S4. **Click where an S4 is best heard** (with the bell, patient turned to the left side).","answer":"E","c":"An S4 is a low-pitched sound just before S1, produced when the atrium contracts against a stiff, non-compliant ventricle, as in hypertensive heart disease, HFpEF and aortic stenosis. It is heard best at the apex (mitral area) with the bell and the patient in the left lateral decubitus position. An S4 is never heard in atrial fibrillation because there is no atrial contraction.","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 400 320\" width=\"100%\" height=\"auto\"><rect width=\"400\" height=\"320\" fill=\"none\"/><path d=\"M 120 40 Q 200 20 280 40 L 330 70 Q 352 160 330 300 L 70 300 Q 48 160 70 70 Z\" fill=\"var(--skin)\" stroke=\"var(--diagram-ink)\" stroke-width=\"2.5\"/>\n<path d=\"M 172 40 Q 200 58 228 40\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-width=\"2\"/>\n<path d=\"M 196 62 Q 150 64 86 74\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-width=\"5\" stroke-linecap=\"round\"/>\n<path d=\"M 204 62 Q 250 64 314 74\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-width=\"5\" stroke-linecap=\"round\"/>\n<rect x=\"186\" y=\"66\" width=\"28\" height=\"170\" rx=\"10\" fill=\"var(--diagram-ink)\" fill-opacity=\"0.14\" stroke=\"var(--diagram-ink)\" stroke-width=\"2\"/>\n<path d=\"M 184 96 Q 120 102 86 126\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-opacity=\"0.35\" stroke-width=\"2\"/><path d=\"M 216 96 Q 280 102 314 126\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-opacity=\"0.35\" stroke-width=\"2\"/><path d=\"M 184 122 Q 120 128 90 152\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-opacity=\"0.35\" stroke-width=\"2\"/><path d=\"M 216 122 Q 280 128 310 152\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-opacity=\"0.35\" stroke-width=\"2\"/><path d=\"M 184 148 Q 120 154 94 178\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-opacity=\"0.35\" stroke-width=\"2\"/><path d=\"M 216 148 Q 280 154 306 178\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-opacity=\"0.35\" stroke-width=\"2\"/><path d=\"M 184 174 Q 120 180 98 204\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-opacity=\"0.35\" stroke-width=\"2\"/><path d=\"M 216 174 Q 280 180 302 204\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-opacity=\"0.35\" stroke-width=\"2\"/><path d=\"M 184 200 Q 120 206 102 230\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-opacity=\"0.35\" stroke-width=\"2\"/><path d=\"M 216 200 Q 280 206 298 230\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-opacity=\"0.35\" stroke-width=\"2\"/><path d=\"M 184 226 Q 120 232 106 256\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-opacity=\"0.35\" stroke-width=\"2\"/><path d=\"M 216 226 Q 280 232 294 256\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-opacity=\"0.35\" stroke-width=\"2\"/>\n<line x1=\"288\" y1=\"70\" x2=\"288\" y2=\"290\" stroke=\"var(--diagram-ink)\" stroke-width=\"1.5\" stroke-dasharray=\"5 5\" stroke-opacity=\"0.6\"/>\n<text x=\"292\" y=\"286\" font-family=\"Arial, sans-serif\" font-size=\"11\" font-weight=\"400\" fill=\"var(--diagram-ink)\" text-anchor=\"start\">MCL</text><text x=\"40\" y=\"20\" font-family=\"Arial, sans-serif\" font-size=\"12\" font-weight=\"700\" fill=\"var(--diagram-ink)\" text-anchor=\"start\">Patient's RIGHT</text><text x=\"268\" y=\"20\" font-family=\"Arial, sans-serif\" font-size=\"12\" font-weight=\"700\" fill=\"var(--diagram-ink)\" text-anchor=\"start\">Patient's LEFT</text><g class=\"zone\" data-id=\"A\" tabindex=\"0\" role=\"button\" aria-label=\"Area A\">\n<circle cx=\"168\" cy=\"118\" r=\"15\" fill=\"var(--zone-fill)\" stroke=\"var(--zone-ink)\" stroke-width=\"2.5\"/>\n<text x=\"168\" y=\"123.5\" text-anchor=\"middle\" font-family=\"Georgia, 'Times New Roman', serif\" font-size=\"16\" font-weight=\"700\" fill=\"var(--zone-ink)\">A</text></g><g class=\"zone\" data-id=\"B\" tabindex=\"0\" role=\"button\" aria-label=\"Area B\">\n<circle cx=\"232\" cy=\"118\" r=\"15\" fill=\"var(--zone-fill)\" stroke=\"var(--zone-ink)\" stroke-width=\"2.5\"/>\n<text x=\"232\" y=\"123.5\" text-anchor=\"middle\" font-family=\"Georgia, 'Times New Roman', serif\" font-size=\"16\" font-weight=\"700\" fill=\"var(--zone-ink)\">B</text></g><g class=\"zone\" data-id=\"C\" tabindex=\"0\" role=\"button\" aria-label=\"Area C\">\n<circle cx=\"236\" cy=\"160\" r=\"15\" fill=\"var(--zone-fill)\" stroke=\"var(--zone-ink)\" stroke-width=\"2.5\"/>\n<text x=\"236\" y=\"165.5\" text-anchor=\"middle\" font-family=\"Georgia, 'Times New Roman', serif\" font-size=\"16\" font-weight=\"700\" fill=\"var(--zone-ink)\">C</text></g><g class=\"zone\" data-id=\"D\" tabindex=\"0\" role=\"button\" aria-label=\"Area D\">\n<circle cx=\"234\" cy=\"206\" r=\"15\" fill=\"var(--zone-fill)\" stroke=\"var(--zone-ink)\" stroke-width=\"2.5\"/>\n<text x=\"234\" y=\"211.5\" text-anchor=\"middle\" font-family=\"Georgia, 'Times New Roman', serif\" font-size=\"16\" font-weight=\"700\" fill=\"var(--zone-ink)\">D</text></g><g class=\"zone\" data-id=\"E\" tabindex=\"0\" role=\"button\" aria-label=\"Area E\">\n<circle cx=\"288\" cy=\"222\" r=\"15\" fill=\"var(--zone-fill)\" stroke=\"var(--zone-ink)\" stroke-width=\"2.5\"/>\n<text x=\"288\" y=\"227.5\" text-anchor=\"middle\" font-family=\"Georgia, 'Times New Roman', serif\" font-size=\"16\" font-weight=\"700\" fill=\"var(--zone-ink)\">E</text></g></svg>"},{"n":531,"t":"mc","visit":"Visit 1 (continued)","s":"Which medication class has been shown to **reduce** heart failure hospitalizations in HFpEF?","opts":["Nondihydropyridine calcium blockers","Digoxin for rate and contraction","SGLT2 inhibitors such as empagliflozin","Daily NSAIDs for joint pain"],"correctIdx":[2],"answer":"C","c":"SGLT2 inhibitors (empagliflozin, dapagliflozin) reduce heart failure hospitalizations and cardiovascular death in HFpEF and are recommended. Loop diuretics relieve congestion, and BP control, weight loss (GLP-1 receptor agonists help in obese HFpEF) and treatment of atrial fibrillation are also important. NSAIDs worsen fluid retention and should be avoided."}]},{"no":178,"batch":8,"title":"Mr. Edwards: Tense, Itchy Blisters","setting":"Primary care clinic • Older adult • Dermatology","scenario":"Mr. Edwards is an 82-year-old man with Parkinson disease who has had 2 months of intense itching, followed by large, tense, fluid-filled blisters on red, hive-like patches on his abdomen, inner thighs and arms. The blisters do not break easily. His mouth is not affected. Gentle rubbing of normal skin does not cause it to peel away.","qs":[{"n":532,"t":"mc","visit":"Visit 1","s":"What is the **most likely** diagnosis?","opts":["Bullous pemphigoid","Herpes zoster rash","Pemphigus vulgaris","Contact dermatitis"],"correctIdx":[0],"answer":"A","c":"Bullous pemphigoid is the most common autoimmune blistering disease and mainly affects adults over 70. It causes intense itching and tense, durable bullae on urticarial plaques, usually on the trunk, flexures and thighs, with rare mucosal involvement and a negative Nikolsky sign. It is associated with neurological diseases such as Parkinson disease and dementia and with some drugs, such as DPP-4 inhibitors."},{"n":533,"t":"match","visit":"Visit 1 (continued)","s":"**Drag each blistering disease to its typical features.** One option will not be used.","items":["Bullous pemphigoid","Pemphigus vulgaris","Dermatitis herpetiformis"],"tgts":["Very itchy grouped vesicles on elbows and knees, linked to celiac disease","Fragile, flaccid blisters with painful mouth erosions and a positive Nikolsky sign","Tense blisters in an older adult, with the mouth usually spared","Painful vesicles in a band along one dermatome"],"map":[2,1,0],"answer":"1–C, 2–B, 3–A","c":"Bullous pemphigoid has antibodies against the basement membrane, producing tense subepidermal blisters. Pemphigus vulgaris has antibodies against desmogleins between keratinocytes, producing fragile intraepidermal blisters that rupture easily, prominent oral erosions and a positive Nikolsky sign; it can be life-threatening. Dermatitis herpetiformis is the skin form of celiac disease and responds to a gluten-free diet and dapsone. The unused option describes herpes zoster."},{"n":534,"t":"mc","visit":"Visit 1 (continued)","s":"The diagnosis is confirmed by biopsy with direct immunofluorescence. What is the **first-line** treatment for his widespread disease?","opts":["Popping the blisters and leaving them open","Oral acyclovir three times daily","A potent topical steroid such as clobetasol","Topical antifungal cream twice daily"],"correctIdx":[2],"answer":"C","c":"Potent topical corticosteroids such as clobetasol applied to the whole body are first-line for bullous pemphigoid, even when widespread, and cause fewer side effects than systemic steroids in older adults. Doxycycline, systemic steroids, methotrexate or dupilumab are used for refractory disease. Large blisters may be drained with a sterile needle while leaving the roof as a natural dressing."}]},{"no":179,"batch":8,"title":"Mrs. Kim: Drowsy in the Nursing Home","setting":"Nursing home visit • Older adult • Renal / Geriatric syndromes","scenario":"Mrs. Kim is an 88-year-old nursing home resident with advanced dementia who needs help with eating and drinking. During a hot week she became more drowsy and confused. Her mucous membranes are dry, and HR is 102 and BP 104/62. Serum sodium is 156 mEq/L, BUN 48 mg/dL and creatinine 1.4 mg/dL (baseline 0.9). Glucose is normal.","qs":[{"n":535,"t":"mc","visit":"Visit 1","s":"What is the **most likely** cause of her hypernatremia?","opts":["Inadequate free water intake","Hypothyroidism with fluid retention","Excess intake of plain water","SIADH from her medications"],"correctIdx":[0],"answer":"A","c":"Hypernatremia in older adults is usually caused by inadequate free water intake combined with water losses (fever, heat, diarrhea). Risk is highest in frail older adults with an impaired thirst response, dementia, and dependence on others for fluids. It causes lethargy, confusion, weakness and, when severe, seizures and coma. SIADH and hypothyroidism cause hyponatremia."},{"n":536,"t":"mc","visit":"Visit 1 (continued)","s":"Why should her sodium be lowered **gradually**?","opts":["Slow correction prevents high blood glucose","Rapid correction can cause cerebral edema","Rapid correction can cause a kidney stone","Rapid correction causes severe hyperkalemia"],"correctIdx":[1],"answer":"B","c":"In chronic hypernatremia, brain cells adapt by producing osmoles to keep their volume. Lowering sodium too quickly causes water to move into brain cells, leading to cerebral edema and seizures. Sodium is generally lowered by no more than about 10–12 mEq/L in 24 hours using hypotonic fluids (oral water, enteral free water or IV 5% dextrose or 0.45% saline)."},{"n":537,"t":"sata","visit":"Visit 2 (prevention plan)","s":"Which measures help **prevent** recurrence? **Select all that apply.**","opts":["Give salt tablets with each meal","Assist her with drinking at each offer","Offer fluids on a regular schedule","Restrict fluids in the evening completely","Track her daily fluid intake"],"correctIdx":[1,2,4],"answer":"B, C, E","c":"Prevention of dehydration and hypernatremia in dependent older adults includes offering fluids regularly throughout the day (not waiting for thirst), helping the resident drink, offering preferred drinks and water-rich foods, monitoring intake and weight, and increasing fluids during hot weather or illness. Complete evening fluid restriction and salt tablets would increase the risk."}]},{"no":180,"batch":8,"title":"Mr. Dube: A Positive Urine Culture Without Symptoms","setting":"Nursing home visit • Older adult • Infectious disease / Antibiotic stewardship","scenario":"Mr. Dube is an 83-year-old nursing home resident with diabetes and mild cognitive impairment. Staff sent a urine sample because his urine looked cloudy and smelled strong. The culture grew more than 100,000 CFU/mL of E. coli. He has no fever, dysuria, urgency, suprapubic or flank pain, or change in mental status. He is eating and drinking well.","qs":[{"n":538,"t":"mc","visit":"Visit 1","s":"What is the **most appropriate** management?","opts":["Oral ciprofloxacin for 7 days today","Long-term daily antibiotic prophylaxis","IV ceftriaxone for possible pyelonephritis","No antibiotics: this is asymptomatic bacteriuria"],"correctIdx":[3],"answer":"D","c":"Asymptomatic bacteriuria (bacteria in the urine without urinary symptoms) is very common in older adults, especially in nursing homes and in people with diabetes. Treating it does not improve outcomes and increases adverse drug effects, C. difficile infection and antibiotic resistance. Cloudy or foul-smelling urine alone is not an indication for testing or treatment."},{"n":539,"t":"sata","visit":"Visit 1 (continued)","s":"In which situations **should** asymptomatic bacteriuria be screened for and treated? **Select all that apply.**","opts":["Before a urologic procedure with expected mucosal bleeding","Pregnancy","Older adults living in nursing homes","People with a long-term urinary catheter","People with diabetes mellitus"],"correctIdx":[0,1],"answer":"A, B","c":"IDSA guidelines recommend screening for and treating asymptomatic bacteriuria only in pregnancy (to prevent pyelonephritis and preterm birth) and before urologic procedures expected to cause mucosal bleeding, such as transurethral resection of the prostate. Screening and treatment are not recommended for older adults, nursing home residents, people with diabetes, spinal cord injury or indwelling catheters."},{"n":540,"t":"mc","visit":"Visit 2 (2 weeks later)","s":"Which finding would **justify** evaluating Mr. Dube for a urinary tract infection?","opts":["Cloudy urine in his drainage container","A strong odor to his urine in the morning","A repeat culture that still grows E. coli","Fever with new suprapubic or flank pain"],"correctIdx":[3],"answer":"D","c":"In long-term care residents, a UTI should be suspected when there are localizing urinary signs (new dysuria, urgency, frequency, suprapubic pain, flank pain or CVA tenderness) or fever or rigors without another source. Changes in urine odor or color, or a positive culture alone, do not indicate infection. Nonspecific confusion alone should prompt a broader evaluation for other causes."}]},{"no":181,"batch":8,"title":"Mrs. Russo: Bloating That Won't Go Away","setting":"Primary care clinic • Older adult • Women's health / Oncology","scenario":"Mrs. Russo is a 66-year-old woman who has had 3 months of persistent abdominal bloating, feeling full quickly, pelvic pressure and urinary frequency almost every day. She has never been pregnant. Her sister had breast cancer at 42. On pelvic examination there is a firm, irregular, fixed right adnexal mass.","qs":[{"n":541,"t":"mc","visit":"Visit 1","s":"Which diagnosis is the **most important** concern?","opts":["Overactive bladder syndrome","Uncomplicated constipation","Ovarian epithelial cancer","Irritable bowel syndrome"],"correctIdx":[2],"answer":"C","c":"Persistent, new and frequent bloating, early satiety, pelvic or abdominal pain and urinary urgency or frequency in women over 50 are warning symptoms of ovarian cancer, which is often diagnosed at an advanced stage. Any adnexal mass in a postmenopausal woman, especially if firm, irregular or fixed, needs prompt evaluation. New IBS symptoms are unusual after age 50."},{"n":542,"t":"mc","visit":"Visit 1 (continued)","s":"Which tests are **most appropriate** next?","opts":["Transvaginal ultrasound and a CA-125 level","A Pap test with HPV co-testing only","A colonoscopy and a repeat exam in a year","An abdominal x-ray and a stool softener"],"correctIdx":[0],"answer":"A","c":"A suspected adnexal mass is evaluated with transvaginal (and pelvic) ultrasound and a CA-125 level. A complex postmenopausal mass with an elevated CA-125 warrants referral to a gynecologic oncologist, which improves survival. Routine screening of average-risk women with CA-125 or ultrasound is not recommended because it does not reduce mortality. The Pap test does not detect ovarian cancer."},{"n":543,"t":"sata","visit":"Visit 1 (continued)","s":"Which factors **increase** the risk of ovarian cancer? **Select all that apply.**","opts":["Having several pregnancies","BRCA1 or BRCA2 mutations","Never having been pregnant","Lynch syndrome","Past oral contraceptive use"],"correctIdx":[1,2,3],"answer":"B, C, D","c":"Risk factors for ovarian cancer include older age, BRCA1/2 mutations, Lynch syndrome, family history, nulliparity, infertility, endometriosis, early menarche and late menopause. Combined oral contraceptives, pregnancy, breastfeeding and tubal ligation or salpingectomy reduce risk. Women with high-risk mutations are offered risk-reducing salpingo-oophorectomy."}]},{"no":182,"batch":8,"title":"Mr. Hollis: Feet Stuck to the Floor","setting":"Primary care clinic • Older adult • Neurology","scenario":"Mr. Hollis is a 76-year-old man whose wife reports 8 months of a slow, shuffling, wide-based gait in which his feet seem \"stuck to the floor,\" urinary urgency with incontinence, and slowed thinking and forgetfulness. He has no resting tremor or rigidity. He had a subarachnoid hemorrhage 5 years ago.","qs":[{"n":544,"t":"mc","visit":"Visit 1","s":"What is the **most likely** diagnosis?","opts":["Normal-pressure hydrocephalus","Alzheimer disease alone","Parkinson disease with dementia","Cervical spinal cord tumor"],"correctIdx":[0],"answer":"A","c":"Normal-pressure hydrocephalus (NPH) classically presents with the triad of gait disturbance (magnetic, wide-based, shuffling gait), urinary incontinence and cognitive decline (\"wet, wobbly and wacky\"), with gait problems usually appearing first. It may follow subar

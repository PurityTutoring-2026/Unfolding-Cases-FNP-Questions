weight=\"400\" fill=\"var(--diagram-ink)\" text-anchor=\"start\">MCL</text><text x=\"40\" y=\"20\" font-family=\"Arial, sans-serif\" font-size=\"12\" font-weight=\"700\" fill=\"var(--diagram-ink)\" text-anchor=\"start\">Patient's RIGHT</text><text x=\"268\" y=\"20\" font-family=\"Arial, sans-serif\" font-size=\"12\" font-weight=\"700\" fill=\"var(--diagram-ink)\" text-anchor=\"start\">Patient's LEFT</text><g class=\"zone\" data-id=\"A\" tabindex=\"0\" role=\"button\" aria-label=\"Area A\">\n<circle cx=\"168\" cy=\"118\" r=\"15\" fill=\"var(--zone-fill)\" stroke=\"var(--zone-ink)\" stroke-width=\"2.5\"/>\n<text x=\"168\" y=\"123.5\" text-anchor=\"middle\" font-family=\"Georgia, 'Times New Roman', serif\" font-size=\"16\" font-weight=\"700\" fill=\"var(--zone-ink)\">A</text></g><g class=\"zone\" data-id=\"B\" tabindex=\"0\" role=\"button\" aria-label=\"Area B\">\n<circle cx=\"232\" cy=\"118\" r=\"15\" fill=\"var(--zone-fill)\" stroke=\"var(--zone-ink)\" stroke-width=\"2.5\"/>\n<text x=\"232\" y=\"123.5\" text-anchor=\"middle\" font-family=\"Georgia, 'Times New Roman', serif\" font-size=\"16\" font-weight=\"700\" fill=\"var(--zone-ink)\">B</text></g><g class=\"zone\" data-id=\"C\" tabindex=\"0\" role=\"button\" aria-label=\"Area C\">\n<circle cx=\"236\" cy=\"160\" r=\"15\" fill=\"var(--zone-fill)\" stroke=\"var(--zone-ink)\" stroke-width=\"2.5\"/>\n<text x=\"236\" y=\"165.5\" text-anchor=\"middle\" font-family=\"Georgia, 'Times New Roman', serif\" font-size=\"16\" font-weight=\"700\" fill=\"var(--zone-ink)\">C</text></g><g class=\"zone\" data-id=\"D\" tabindex=\"0\" role=\"button\" aria-label=\"Area D\">\n<circle cx=\"234\" cy=\"206\" r=\"15\" fill=\"var(--zone-fill)\" stroke=\"var(--zone-ink)\" stroke-width=\"2.5\"/>\n<text x=\"234\" y=\"211.5\" text-anchor=\"middle\" font-family=\"Georgia, 'Times New Roman', serif\" font-size=\"16\" font-weight=\"700\" fill=\"var(--zone-ink)\">D</text></g><g class=\"zone\" data-id=\"E\" tabindex=\"0\" role=\"button\" aria-label=\"Area E\">\n<circle cx=\"288\" cy=\"222\" r=\"15\" fill=\"var(--zone-fill)\" stroke=\"var(--zone-ink)\" stroke-width=\"2.5\"/>\n<text x=\"288\" y=\"227.5\" text-anchor=\"middle\" font-family=\"Georgia, 'Times New Roman', serif\" font-size=\"16\" font-weight=\"700\" fill=\"var(--zone-ink)\">E</text></g></svg>"},{"n":305,"t":"mc","visit":"Visit 1 (continued)","s":"Which test is **most appropriate** to evaluate Mr. Delgado's murmur?","opts":["A transthoracic echocardiogram","A 24-hour Holter monitor recording","A coronary artery calcium CT scan","A cardiac stress test on a treadmill"],"correctIdx":[0],"answer":"A","c":"A new murmur with symptoms such as dyspnea, fatigue or edema should be evaluated with a transthoracic echocardiogram, which shows the valve lesion, its severity, chamber size and ejection fraction. Severe symptomatic mitral regurgitation is referred to cardiology for possible surgical or transcatheter repair. Stress tests, calcium scores and Holter monitors do not assess valve disease."},{"n":306,"t":"match","visit":"Visit 2 (teaching)","s":"The FNP reviews other valve murmurs with a student. **Drag each lesion to its classic murmur.** One option will not be used.","items":["Aortic stenosis","Aortic regurgitation","Mitral stenosis"],"tgts":["Blowing early diastolic decrescendo murmur at the left sternal border","Continuous machinery murmur below the left clavicle","Low-pitched diastolic rumble at the apex after an opening snap","Harsh systolic crescendo–decrescendo murmur radiating to the carotids"],"map":[3,0,2],"answer":"1–D, 2–A, 3–C","c":"Aortic stenosis causes a harsh crescendo–decrescendo systolic murmur at the right upper sternal border radiating to the carotids, with syncope, angina and heart failure as late symptoms. Aortic regurgitation causes a blowing early diastolic decrescendo murmur at the left sternal border with a wide pulse pressure. Mitral stenosis causes a low-pitched diastolic rumble at the apex after an opening snap, often after rheumatic fever. A continuous machinery murmur is typical of patent ductus arteriosus."}]},{"no":103,"batch":5,"title":"Mrs. Nakamura: The Room Spins When She Rolls Over","setting":"Primary care clinic • Older adult • Neurology / ENT","scenario":"Mrs. Nakamura is a 70-year-old woman with 1 week of brief episodes of spinning vertigo lasting less than a minute when she rolls over in bed to the right, looks up or bends down. She has nausea during episodes but no hearing loss, tinnitus, headache, double vision, weakness or trouble speaking. Neurological examination is normal and she walks normally between episodes.","qs":[{"n":307,"t":"mc","visit":"Visit 1","s":"Which test **confirms** the most likely diagnosis?","opts":["The Romberg balance test","The Weber tuning-fork test","The Dix–Hallpike maneuver","The Rinne tuning-fork test"],"correctIdx":[2],"answer":"C","c":"Benign paroxysmal positional vertigo (BPPV) causes brief vertigo (under 1 minute) triggered by head position changes, without hearing loss. The Dix–Hallpike maneuver reproduces vertigo with a delayed, fatigable, torsional upbeating nystagmus when the affected ear is down, confirming posterior canal BPPV. Weber and Rinne tests assess hearing loss, and Romberg assesses proprioception."},{"n":308,"t":"ord","visit":"Visit 1 (continued)","s":"The Dix–Hallpike is positive on the right. **Place the steps of the Epley canalith repositioning maneuver in the correct order.**","items":["Step 1","Step 2","Step 3","Step 4","Step 5"],"tgts":["Seated, turn the head 45° toward the right (affected) side","Turn the head 90° to the left and hold 30 seconds","Lie back quickly with the head slightly extended; hold 30 seconds","Sit up slowly on the left side","Roll onto the left side with the face toward the floor; hold 30 seconds"],"map":[0,2,1,4,3],"answer":"A, C, B, E, D","c":"The Epley maneuver moves displaced otoconia out of the posterior semicircular canal back into the utricle. Starting seated with the head turned 45° toward the affected ear, the patient lies back into the Dix–Hallpike position, the head is turned 90° to the opposite side, the patient rolls onto that side with the face down, and then sits up. It is first-line treatment for BPPV; vestibular suppressants such as meclizine are not recommended for routine use."},{"n":309,"t":"sata","visit":"Visit 2 (2 months later)","s":"Which findings in a patient with vertigo would suggest a **central** cause such as stroke? **Select all that apply.**","opts":["Vertical nystagmus that does not fatigue","Fatigable torsional nystagmus on Dix–Hallpike","Inability to stand or walk unaided","Brief vertigo triggered by rolling over in bed","New headache, double vision or slurred speech"],"correctIdx":[0,2,4],"answer":"A, C, E","c":"Central vertigo (cerebellar or brainstem stroke) is suggested by pure vertical or direction-changing nystagmus that does not fatigue, severe gait ataxia, and other neurological signs such as headache, diplopia, dysarthria, dysphagia or weakness. These need emergency evaluation. Brief positional vertigo and fatigable torsional nystagmus are typical of peripheral BPPV."}]},{"no":104,"batch":5,"title":"Mr. Fitzgerald: A High INR","setting":"Anticoagulation follow-up • Older adult • Hematology / Pharmacology","scenario":"Mr. Fitzgerald is an 81-year-old man with atrial fibrillation who has taken warfarin with a stable INR of 2–3 for 3 years. An urgent care clinic started trimethoprim–sulfamethoxazole for a urinary tract infection 5 days ago. Today his INR is 5.8. He has no bleeding, bruising, black stools or blood in his urine.","qs":[{"n":310,"t":"mc","visit":"Visit 1","s":"What is the **most appropriate** management of Mr. Fitzgerald's INR?","opts":["Give IV vitamin K 10 mg with fresh frozen plasma now","Hold 1–2 doses, recheck the INR and resume at a lower dose","Stop warfarin permanently and switch to aspirin","Continue the same dose and recheck in one month"],"correctIdx":[1],"answer":"B","c":"For an INR between 4.5 and 10 without bleeding, guidelines recommend holding warfarin for 1–2 doses, rechecking the INR frequently and resuming at a lower dose once it is therapeutic; routine vitamin K is not needed. Oral vitamin K may be given for an INR above 10 without bleeding. IV vitamin K with prothrombin complex concentrate (or plasma) is reserved for major bleeding. Aspirin does not adequately prevent stroke in AF."},{"n":311,"t":"sata","visit":"Visit 1 (continued)","s":"Which medications can **raise** the INR in a patient taking warfarin? **Select all that apply.**","opts":["Trimethoprim–sulfamethoxazole","Carbamazepine","Amiodarone","Rifampin","Fluconazole"],"correctIdx":[0,2,4],"answer":"A, C, E","c":"Warfarin is metabolized by CYP2C9 and CYP3A4. Inhibitors such as TMP-SMX, metronidazole, fluconazole, amiodarone, fluoroquinolones and macrolides raise the INR and bleeding risk. Inducers such as rifampin, carbamazepine and phenytoin lower the INR and increase clot risk. Any new medication in a warfarin patient should prompt a closer INR check."},{"n":312,"t":"mc","visit":"Visit 2 (2 weeks later)","s":"Mr. Fitzgerald's INR is back in range. Which dietary teaching is **correct**?","opts":["Eat extra leafy greens whenever the INR is low","Keep vitamin K intake consistent from week to week","Avoid all green vegetables for as long as he lives","Diet has no effect on warfarin or the INR"],"correctIdx":[1],"answer":"B","c":"Vitamin K in foods such as leafy greens counteracts warfarin. Patients do not need to avoid these foods but should keep intake consistent so the dose can be adjusted to a stable diet. Large sudden changes, alcohol binges and herbal products (such as ginkgo or St. John's wort) can change the INR. Direct oral anticoagulants are an alternative with no dietary restrictions."}]},{"no":105,"batch":5,"title":"Mr. Banda: Back Pain and Anemia","setting":"Primary care clinic • Older adult • Hematology / Oncology","scenario":"Mr. Banda is a 72-year-old Black man with 3 months of low back pain that is worse at night, fatigue and two recent episodes of pneumonia. Labs show hemoglobin 9.8 g/dL (normocytic), calcium 11.8 mg/dL, creatinine 1.9 mg/dL (it was 1.0 last year) and total protein 9.2 g/dL with albumin 3.2 g/dL. A spine x-ray shows a lytic lesion in a lumbar vertebra.","qs":[{"n":313,"t":"mc","visit":"Visit 1","s":"What is the **most likely** diagnosis?","opts":["Primary hyperparathyroidism","Iron-deficiency anemia","Plasma cell multiple myeloma","Osteoarthritis of the spine"],"correctIdx":[2],"answer":"C","c":"Multiple myeloma is a malignancy of plasma cells, most common in older adults and twice as common in Black people. The classic CRAB features are hypercalcemia, renal insufficiency, anemia and lytic bone lesions, often with bone pain, recurrent infections and a high total protein with a large gap between total protein and albumin (from monoclonal protein)."},{"n":314,"t":"mc","visit":"Visit 1 (continued)","s":"Which tests should the FNP order **next**?","opts":["Serum protein electrophoresis and free light chains","Serum ferritin and a stool occult blood test","A bone density scan and vitamin D level","A PSA test and a digital rectal exam"],"correctIdx":[0],"answer":"A","c":"Suspected myeloma is evaluated with serum protein electrophoresis with immunofixation, serum free light chains (kappa/lambda ratio) and urine protein electrophoresis, which detect the monoclonal (M) protein. Bone marrow biopsy by hematology confirms the diagnosis. Prompt referral is needed, along with treatment of hypercalcemia and kidney injury."},{"n":315,"t":"sata","visit":"Visit 1 (continued)","s":"Which findings make up the **CRAB** criteria for myeloma-related organ damage? **Select all that apply.**","opts":["Anemia","Hypoglycemia","Renal insufficiency","Hypercalcemia","Polycythemia"],"correctIdx":[0,2,3],"answer":"A, C, D","c":"CRAB stands for hyperCalcemia, Renal insufficiency, Anemia and Bone lesions (lytic lesions, osteoporosis or fractures). These signs of end-organ damage distinguish active myeloma from monoclonal gammopathy of undetermined significance (MGUS) and smoldering myeloma. Myeloma causes anemia, not polycythemia, and does not cause hypoglycemia."}]},{"no":106,"batch":5,"title":"Mr. Sorensen: A Pearly Bump on the Nose","setting":"Primary care clinic • Older adult • Dermatology","scenario":"Mr. Sorensen is a 69-year-old fair-skinned retired farmer with a slowly growing, painless bump on the side of his nose for 8 months. It is a pearly, translucent papule with rolled borders, fine surface blood vessels and a small central crust that bleeds occasionally. His wife has also noticed a dark, irregular mole on his back that has changed recently.","qs":[{"n":316,"t":"mc","visit":"Visit 1","s":"What is the **most likely** diagnosis of the lesion on his nose?","opts":["Seborrheic keratosis","Squamous cell carcinoma","Nodular melanoma","Basal cell carcinoma"],"correctIdx":[3],"answer":"D","c":"Basal cell carcinoma, the most common skin cancer, typically appears on sun-exposed skin of the head and neck as a pearly, translucent papule with rolled borders and telangiectasias, sometimes with central ulceration (\"rodent ulcer\"). It grows slowly, rarely metastasizes, but can be locally destructive. Risk factors are UV exposure, fair skin and older age."},{"n":317,"t":"match","visit":"Visit 1 (continued)","s":"**Drag each skin lesion to its typical appearance.** One option will not be used.","items":["Basal cell carcinoma","Squamous cell carcinoma","Melanoma"],"tgts":["Pearly papule with rolled borders and telangiectasias","Firm, scaly, crusted nodule that may ulcerate","Waxy, \"stuck-on\" brown plaque that is benign","Asymmetric lesion with irregular border and varied color"],"map":[0,1,3],"answer":"1–A, 2–B, 3–D","c":"Basal cell carcinoma is a pearly papule with rolled borders and telangiectasias. Squamous cell carcinoma is a firm, scaly, hyperkeratotic or crusted nodule on sun-exposed skin that may ulcerate and can arise from actinic keratoses. Melanoma is identified by the ABCDEs: Asymmetry, Border irregularity, Color variation, Diameter over 6 mm and Evolving. The waxy \"stuck-on\" plaque describes a benign seborrheic keratosis."},{"n":318,"t":"mc","visit":"Visit 1 (continued)","s":"Which biopsy is **preferred** for the changing, irregular mole on his back?","opts":["Excisional biopsy with narrow margins","Cryotherapy without any tissue sample","Topical fluorouracil cream for 4 weeks","Superficial shave of the top layer only"],"correctIdx":[0],"answer":"A","c":"A lesion suspicious for melanoma should be removed by excisional biopsy with 1–3 mm margins down to the subcutaneous fat, so the pathologist can measure the full Breslow depth, the most important prognostic factor. A superficial shave can cut through the lesion and prevent accurate staging. Cryotherapy and topical fluorouracil destroy tissue without diagnosis and are used for actinic keratoses."}]},{"no":107,"batch":5,"title":"Mrs. Oyelaran: A Dangerous Potassium Level","setting":"Primary care clinic • Older adult • Renal / Cardiovascular","scenario":"Mrs. Oyelaran is a 76-year-old woman with heart failure with reduced ejection fraction and CKD (eGFR 38). She takes lisinopril, spironolactone, carvedilol and furosemide, and she began taking ibuprofen daily for knee pain 2 weeks ago. She reports weakness. Routine labs show potassium 6.4 mEq/L; an office ECG shows peaked T waves.","qs":[{"n":319,"t":"mc","visit":"Visit 1","s":"What is the **most appropriate** immediate action?","opts":["Advise her to eat fewer bananas and recheck","Repeat the potassium level in one week","Send her to the emergency department now","Add a potassium supplement to her regimen"],"correctIdx":[2],"answer":"C","c":"A potassium above 6.0 mEq/L, or any hyperkalemia with ECG changes (peaked T waves, prolonged PR, widened QRS, sine wave pattern), is a medical emergency because of the risk of fatal arrhythmias. She needs emergency department care with cardiac monitoring. Dietary change alone is far too slow, and adding potassium would be dangerous."},{"n":320,"t":"ord","visit":"Visit 1 (continued)","s":"The FNP explains the emergency treatment to the family. **Place the steps of treatment in the usual order.**","items":["Step 1","Step 2","Step 3","Step 4"],"tgts":["Recheck potassium and glucose and review medications","Give IV calcium gluconate to stabilize the heart muscle","Give IV insulin with glucose to shift potassium into cells","Remove potassium with a binder, a loop diuretic or dialysis"],"map":[1,2,3,0],"answer":"B, C, D, A","c":"IV calcium is given first because it stabilizes the cardiac membrane within minutes, although it does not lower potassium. Insulin with glucose (and often nebulized albuterol) shifts potassium into cells. Potassium is then removed from the body with a binder such as sodium zirconium cyclosilicate or patiromer, a loop diuretic or dialysis. Potassium and glucose are rechecked (insulin can cause hypoglycemia), and the causes are corrected."},{"n":321,"t":"sata","visit":"Visit 2 (after discharge)","s":"Which of her medications **contributed** to the hyperkalemia? **Select all that apply.**","opts":["Carvedilol taken for blood pressure","Furosemide","Ibuprofen","Lisinopril","Spironolactone"],"correctIdx":[2,3,4],"answer":"C, D, E","c":"Spironolactone (a potassium-sparing aldosterone antagonist), ACE inhibitors such as lisinopril, and NSAIDs such as ibuprofen all raise potassium, and CKD increases the risk further. Other causes include ARBs, trimethoprim, heparin and potassium supplements. Loop diuretics such as furosemide lower potassium. Beta-blockers can raise potassium slightly but are not a major cause. NSAIDs should be avoided in heart failure and CKD."}]},{"no":108,"batch":5,"title":"Mrs. Kowalski: A High Calcium on Routine Labs","setting":"Primary care clinic • Older adult • Endocrine","scenario":"Mrs. Kowalski is a 66-year-old woman whose routine labs show a calcium of 11.0 mg/dL on two occasions. Her parathyroid hormone (PTH) is elevated and her vitamin D is normal. She had a kidney stone 2 years ago, and a recent DEXA scan showed osteoporosis of the forearm. She reports mild fatigue and constipation. She takes hydrochlorothiazide for blood pressure.","qs":[{"n":322,"t":"mc","visit":"Visit 1","s":"What is the **most likely** diagnosis?","opts":["Hypercalcemia of malignancy","Secondary hyperparathyroidism","Primary hyperparathyroidism","Vitamin D deficiency alone"],"correctIdx":[2],"answer":"C","c":"A high calcium with a high or inappropriately normal PTH indicates primary hyperparathyroidism, most often from a single parathyroid adenoma. It is the most common cause of hypercalcemia in outpatients. In hypercalcemia of malignancy, PTH is suppressed (often with a high PTH-related peptide). Secondary hyperparathyroidism from CKD or vitamin D deficiency has a high PTH with low or normal calcium."},{"n":323,"t":"mc","visit":"Visit 1 (continued)","s":"Which medication in her list should be **replaced** because it raises serum calcium?","opts":["Losartan (an ARB drug)","Furosemide (loop diuretic)","Amlodipine (calcium blocker)","Hydrochlorothiazide (thiazide)"],"correctIdx":[3],"answer":"D","c":"Thiazide diuretics decrease urinary calcium excretion and can raise serum calcium, worsening hypercalcemia; they can also unmask hyperparathyroidism. Another antihypertensive should be chosen. Loop diuretics increase calcium excretion. Calcium channel blockers and ARBs do not affect serum calcium. Lithium can also cause hypercalcemia."},{"n":324,"t":"mc","visit":"Visit 1 (continued)","s":"Mrs. Kowalski has a kidney stone history and osteoporosis. What is the **most appropriate** next step?","opts":["Observation with yearly calcium checks only","Referral for parathyroidectomy evaluation","Start high-dose calcium supplements daily","Begin a low-calcium diet with no follow-up"],"correctIdx":[1],"answer":"B","c":"Parathyroidectomy is indicated in primary hyperparathyroidism with symptoms or with end-organ effects such as kidney stones, osteoporosis (T-score −2.5 or less or fragility fracture), reduced eGFR, high urinary calcium, calcium more than 1 mg/dL above normal, or age under 50. Surgery by an experienced surgeon is curative. Classic symptoms are \"stones, bones, abdominal groans and psychiatric moans.\""}]},{"no":109,"batch":5,"title":"Mr. Ekwueme: A Drooping Face","setting":"Urgent visit • Middle adult • Neurology","scenario":"Mr. Ekwueme is a 45-year-old man who woke this morning with weakness of the right side of his face. He cannot wrinkle his right forehead, close his right eye fully or smile on the right. He noticed pain behind his right ear yesterday and food tastes different. His arms, legs and speech are normal. There is no rash in the ear. Symptoms began about 8 hours ago.","qs":[{"n":325,"t":"mc","visit":"Visit 1","s":"Which finding **best** distinguishes Bell palsy from a stroke?","opts":["Drooping at the corner of the mouth","Weakness of the forehead on the affected side","A sudden onset of the facial weakness","Weakness of the lower face on one side only"],"correctIdx":[1],"answer":"B","c":"Bell palsy is a peripheral (lower motor neuron) facial nerve palsy that affects the whole side of the face, including the forehead. In a stroke (upper motor neuron lesion), the forehead is usually spared because it receives input from both cerebral hemispheres. Any other neurological deficit, such as limb weakness or speech changes, suggests stroke and needs emergency care."},{"n":326,"t":"mc","visit":"Visit 1 (continued)","s":"What is the **recommended** treatment for Mr. Ekwueme?","opts":["No treatment, just observation","Oral amoxicillin for 10 days","Immediate facial nerve surgery","Oral prednisone started within 72 hours"],"correctIdx":[3],"answer":"D","c":"Oral corticosteroids (such as prednisone for 7–10 days) started within 72 hours of onset improve recovery from Bell palsy. An antiviral such as valacyclovir may be added for severe palsy but is not recommended alone. Most patients recover within weeks to months. A vesicular rash in the ear with facial palsy suggests Ramsay Hunt syndrome (herpes zoster), which needs antivirals."},{"n":327,"t":"sata","visit":"Visit 1 (continued)","s":"Which **eye care** instructions are appropriate for Mr. Ekwueme? **Select all that apply.**","opts":["Wear contact lenses overnight for protection","Apply lubricating ointment at bedtime","Tape the eyelid closed or use a patch at night","Avoid all eye drops until the palsy resolves","Use artificial tears during the day"],"correctIdx":[1,2,4],"answer":"B, C, E","c":"Incomplete eye closure puts the cornea at risk of drying and abrasion. Patients should use artificial tears during the day, lubricating ointment at night, and tape or patch the eyelid closed at night, along with sunglasses outdoors. Eye pain, redness or vision change needs prompt ophthalmology review. Overnight contact lenses increase corneal risk."}]},{"no":110,"batch":5,"title":"Mr. Duarte: Pain That Goes Through to the Back","setting":"Urgent visit • Middle adult • Gastrointestinal","scenario":"Mr. Duarte is a 48-year-old man who drinks 8–10 beers daily. He has had 12 hours of severe, constant upper abdominal pain that radiates straight through to his back, with nausea and vomiting. He is more comfortable leaning forward. HR is 108, BP 128/78, temperature 37.8 °C. Serum lipase is 5 times the upper limit of normal.","qs":[{"n":328,"t":"hot","visit":"Visit 1","s":"**Click the region where pain from Mr. Duarte's condition is classically located.**","answer":"B","c":"Acute pancreatitis classically causes severe, constant epigastric pain radiating to the back, eased by leaning forward and worsened by lying flat, with nausea and vomiting. Diagnosis requires two of three: characteristic pain, lipase (or amylase) at least 3 times the upper limit of normal, and characteristic imaging findings. Mr. Duarte meets the first two.","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 400 320\" width=\"100%\" height=\"auto\"><rect width=\"400\" height=\"320\" fill=\"none\"/><path d=\"M 90 30 Q 200 10 310 30 Q 330 160 310 300 L 90 300 Q 70 160 90 30 Z\" fill=\"var(--skin)\" stroke=\"var(--diagram-ink)\" stroke-width=\"2.5\"/>\n<path d=\"M 90 70 Q 200 120 310 70\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-width=\"2\" stroke-opacity=\"0.5\"/>\n<line x1=\"200\" y1=\"40\" x2=\"200\" y2=\"296\" stroke=\"var(--diagram-ink)\" stroke-width=\"1.5\" stroke-dasharray=\"6 5\" stroke-opacity=\"0.55\"/>\n<line x1=\"84\" y1=\"170\" x2=\"316\" y2=\"170\" stroke=\"var(--diagram-ink)\" stroke-width=\"1.5\" stroke-dasharray=\"6 5\" stroke-opacity=\"0.55\"/>\n<circle cx=\"200\" cy=\"170\" r=\"6\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-width=\"2\"/>\n<path d=\"M 108 262 Q 150 285 196 296\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-width=\"2\" stroke-opacity=\"0.5\"/>\n<path d=\"M 292 262 Q 250 285 204 296\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-width=\"2\" stroke-opacity=\"0.5\"/>\n<text x=\"40\" y=\"20\" font-family=\"Arial, sans-serif\" font-size=\"12\" font-weight=\"700\" fill=\"var(--diagram-ink)\" text-anchor=\"start\">Patient's RIGHT</text><text x=\"268\" y=\"20\" font-family=\"Arial, sans-serif\" font-size=\"12\" font-weight=\"700\" fill=\"var(--diagram-ink)\" text-anchor=\"start\">Patient's LEFT</text><text x=\"206\" y=\"186\" font-family=\"Arial, sans-serif\" font-size=\"10\" font-weight=\"400\" fill=\"var(--diagram-ink)\" text-anchor=\"start\">umbilicus</text><g class=\"zone\" data-id=\"A\" tabindex=\"0\" role=\"button\" aria-label=\"Area A\">\n<circle cx=\"140\" cy=\"112\" r=\"15\" fill=\"var(--zone-fill)\" stroke=\"var(--zone-ink)\" stroke-width=\"2.5\"/>\n<text x=\"140\" y=\"117.5\" text-anchor=\"middle\" font-family=\"Georgia, 'Times New Roman', serif\" font-size=\"16\" font-weight=\"700\" fill=\"var(--zone-ink)\">A</text></g><g class=\"zone\" data-id=\"B\" tabindex=\"0\" role=\"button\" aria-label=\"Area B\">\n<circle cx=\"200\" cy=\"92\" r=\"15\" fill=\"var(--zone-fill)\" stroke=\"var(--zone-ink)\" stroke-width=\"2.5\"/>\n<text x=\"200\" y=\"97.5\" text-anchor=\"middle\" font-family=\"Georgia, 'Times New Roman', serif\" font-size=\"16\" font-weight=\"700\" fill=\"var(--zone-ink)\">B</text></g><g class=\"zone\" data-id=\"C\" tabindex=\"0\" role=\"button\" aria-label=\"Area C\">\n<circle cx=\"262\" cy=\"112\" r=\"15\" fill=\"var(--zone-fill)\" stroke=\"var(--zone-ink)\" stroke-width=\"2.5\"/>\n<text x=\"262\" y=\"117.5\" text-anchor=\"middle\" font-family=\"Georgia, 'Times New Roman', serif\" font-size=\"16\" font-weight=\"700\" fill=\"var(--zone-ink)\">C</text></g><g class=\"zone\" data-id=\"D\" tabindex=\"0\" role=\"button\" aria-label=\"Area D\">\n<circle cx=\"168\" cy=\"150\" r=\"15\" fill=\"var(--zone-fill)\" stroke=\"var(--zone-ink)\" stroke-width=\"2.5\"/>\n<text x=\"168\" y=\"155.5\" text-anchor=\"middle\" font-family=\"Georgia, 'Times New Roman', serif\" font-size=\"16\" font-weight=\"700\" fill=\"var(--zone-ink)\">D</text></g><g class=\"zone\" data-id=\"E\" tabindex=\"0\" role=\"button\" aria-label=\"Area E\">\n<circle cx=\"264\" cy=\"228\" r=\"15\" fill=\"var(--zone-fill)\" stroke=\"var(--zone-ink)\" stroke-width=\"2.5\"/>\n<text x=\"264\" y=\"233.5\" text-anchor=\"middle\" font-family=\"Georgia, 'Times New Roman', serif\" font-size=\"16\" font-weight=\"700\" fill=\"var(--zone-ink)\">E</text></g></svg>"},{"n":329,"t":"mc","visit":"Visit 1 (continued)","s":"What are the **two most common** causes of acute pancreatitis?","opts":["Abdominal trauma and recent ERCP","Mumps infection and scorpion stings","Hypertriglyceridemia and hypercalcemia","Gallstones and heavy alcohol use"],"correctIdx":[3],"answer":"D","c":"Gallstones and heavy alcohol use together cause most cases of acute pancreatitis. Other causes include very high triglycerides (usually above 1,000 mg/dL), hypercalcemia, medications (such as azathioprine and valproate), ERCP, trauma and infections. An abdominal ultrasound is obtained to look for gallstones, and triglycerides and calcium are checked."},{"n":330,"t":"mc","visit":"Visit 1 (continued)","s":"What is the **most appropriate** initial management for Mr. Duarte?","opts":["Outpatient oral antibiotics and a bland diet","Hospital admission for IV fluids and pain control","Immediate surgery to remove the pancreas","Discharge home with an antacid and a recheck"],"correctIdx":[1],"answer":"B","c":"Acute pancreatitis is managed in hospital with early goal-directed IV fluids (lactated Ringer solution), pain control, monitoring for organ failure and early oral feeding as tolerated. Antibiotics are not given routinely, only for infected necrosis. Alcohol cessation, thiamine and alcohol withdrawal monitoring are important for Mr. Duarte, and cholecystectomy is recommended for gallstone pancreatitis."}]},{"no":111,"batch":5,"title":"Mr. Lindqvist: Tired, Achy and Bronze","setting":"Primary care clinic • Middle adult • Hepatic / Hematology","scenario":"Mr. Lindqvist is a 52-year-old man of Northern European descent with fatigue, pain in the second and third knuckles of both hands, decreased libido and a darkened skin tone. He was recently diagnosed with type 2 diabetes. ALT is mildly elevated. Ferritin is 1,250 ng/mL and transferrin saturation is 68%.","qs":[{"n":331,"t":"mc","visit":"Visit 1","s":"What is the **most likely** diagnosis?","opts":["Primary adrenal insufficiency","Iron-deficiency anemia","Hereditary hemochromatosis","Rheumatoid arthritis flare"],"correctIdx":[2],"answer":"C","c":"Hereditary hemochromatosis is an autosomal recessive disorder of excess iron absorption, most common in people of Northern European descent. Iron deposits in the liver, pancreas (diabetes), heart (cardiomyopathy), joints (second and third MCP arthropathy), pituitary and gonads (hypogonadism) and skin (\"bronze diabetes\"). A transferrin saturation above 45% with a high ferritin is the key finding."},{"n":332,"t":"mc","visit":"Visit 1 (continued)","s":"Which test **confirms** the diagnosis?","opts":["A bone marrow iron stain","Serum B12 and folate levels","Hemoglobin electrophoresis","HFE gene testing for C282Y"],"correctIdx":[3],"answer":"D","c":"HFE genetic testing confirms hereditary hemochromatosis; homozygosity for the C282Y mutation is the most common genotype. Liver biopsy or MRI may assess iron load and fibrosis, especially when ferritin exceeds 1,000 ng/mL, which raises the risk of cirrhosis. First-degree relatives should be screened."},{"n":333,"t":"sata","visit":"Visit 2 (after confirmation)","s":"Which instructions are **appropriate** for Mr. Lindqvist? **Select all that apply.**","opts":["Take an iron-fortified multivitamin","Avoid eating raw shellfish","Avoid iron and vitamin C supplements","Drink red wine daily to protect the liver","Have regular therapeutic phlebotomy"],"correctIdx":[1,2,4],"answer":"B, C, E","c":"Therapeutic phlebotomy (usually weekly at first) is the main treatment, aiming for a ferritin of 50–100 ng/mL. Patients should avoid iron supplements and vitamin C supplements (which increase iron absorption), limit alcohol, and avoid raw shellfish because of the risk of Vibrio vulnificus infection. Patients with cirrhosis need surveillance for hepatocellular carcinoma."}]},{"no":112,"batch":5,"title":"Ms. Hernandez: On the Edge of Diabetes","setting":"Annual exam • Middle adult • Metabolic / Health promotion","scenario":"Ms. Hernandez is a 47-year-old woman with a BMI of 31. Her waist circumference is 38 inches, BP 134/86, fasting glucose 112 mg/dL, A1c 6.1%, triglycerides 210 mg/dL, HDL 42 mg/dL and LDL 128 mg/dL. Her mother has type 2 diabetes. She walks rarely and works long hours at a desk.","qs":[{"n":334,"t":"sata","visit":"Visit 1","s":"Which of her findings meet the criteria for **metabolic syndrome**? **Select all that apply.**","opts":["Waist circumference of 38 inches","HDL of 42 mg/dL","LDL of 128 mg/dL","Blood pressure of 134/86","Triglycerides of 210 mg/dL"],"correctIdx":[0,1,3,4],"answer":"A, B, D, E","c":"Metabolic syndrome is diagnosed with three or more of: waist circumference above 35 inches in women (40 in men), triglycerides of 150 mg/dL or more, HDL below 50 mg/dL in women (40 in men), BP of 130/85 or more, and fasting glucose of 100 mg/dL or more. She meets all five criteria. LDL is not part of the definition."},{"n":335,"t":"mc","visit":"Visit 1 (continued)","s":"How should her **A1c of 6.1%** be interpreted?","opts":["Type 2 diabetes","Prediabetes","Type 1 diabetes","Normal glucose"],"correctIdx":[1],"answer":"B","c":"An A1c of 5.7–6.4% indicates prediabetes, as do a fasting glucose of 100–125 mg/dL and a 2-hour glucose of 140–199 mg/dL on an oral glucose tolerance test. Diabetes is an A1c of 6.5% or more, fasting glucose of 126 mg/dL or more, 2-hour glucose of 200 mg/dL or more, or a random glucose of 200 mg/dL or more with symptoms."},{"n":336,"t":"mc","visit":"Visit 1 (continued)","s":"Which intervention **most effectively** reduces her risk of developing type 2 diabetes?","opts":["A daily multivitamin and fish oil supplement","Metformin alone without any lifestyle change","An intensive lifestyle program with 7% weight loss","Repeating the A1c test every 3 months"],"correctIdx":[2],"answer":"C","c":"In the Diabetes Prevention Program, intensive lifestyle change (7% weight loss and 150 minutes of moderate activity a week) reduced progression to diabetes by 58%, compared with 31% for metformin. Referral to a CDC-recognized diabetes prevention program is recommended. Metformin can be considered for high-risk patients, such as those with a BMI of 35 or more, age under 60 or prior gestational diabetes."}]},{"no":113,"batch":5,"title":"Ms. Abara: A Rash Across the Cheeks","setting":"Primary care clinic • Middle adult • Rheumatology","scenario":"Ms. Abara is a 38-year-old Black woman with 3 months of fatigue, joint pain in her hands and wrists, painless mouth sores and a red rash over her cheeks and nose that spares the nasolabial folds and gets worse in the sun. CBC shows mild leukopenia. Urinalysis shows 1+ protein. Her ANA is positive at a high titer.","qs":[{"n":337,"t":"mc","visit":"Visit 1","s":"What is the **most likely** diagnosis?","opts":["Systemic lupus erythematosus","Rosacea with sun sensitivity","Seborrheic dermatitis of the face","Rheumatoid arthritis with rash"],"correctIdx":[0],"answer":"A","c":"Systemic lupus erythematosus (SLE) is most common in women of childbearing age, especially Black women. Features include a malar (butterfly) rash sparing the nasolabial folds, photosensitivity, painless oral ulcers, non-erosive arthritis, cytopenias, serositis and kidney involvement. A positive ANA is the entry criterion for classification."},{"n":338,"t":"mc","visit":"Visit 1 (continued)","s":"Which antibody is the **most specific** for systemic lupus erythematosus?","opts":["Rheumatoid factor","Anti-CCP antibody","Anti-Smith antibody","Antinuclear antibody"],"correctIdx":[2],"answer":"C","c":"ANA is very sensitive for SLE (positive in about 98%), making it a good screening test, but it is not specific. Anti-Smith and anti-double-stranded DNA antibodies are highly specific; anti-dsDNA levels also track disease activity and lupus nephritis, along with low complement (C3, C4). Rheumatoid factor and anti-CCP are associated with rheumatoid arthritis."},{"n":339,"t":"sata","visit":"Visit 2 (rheumatology plan)","s":"Ms. Abara starts hydroxychloroquine. Which teaching is **correct**? **Select all that apply.**","opts":["She should use daily sun protection","Foamy urine or leg swelling should be reported","She must avoid all vaccines during treatment","She can stop the drug once the rash clears","She needs a baseline and regular retinal eye exam"],"correctIdx":[0,1,4],"answer":"A, B, E","c":"Hydroxychloroquine is the foundation of SLE therapy and is continued long term because it reduces flares and improves survival. It can cause retinal toxicity, so a baseline eye exam and annual screening after 5 years (sooner with risk factors) are needed. Sun protection reduces flares. Foamy urine, edema or high BP may signal lupus nephritis. Inactivated vaccines are recommended; live vaccines are avoided only with strong immunosuppression."}]},{"no":114,"batch":5,"title":"Mrs. Kamara: Wrist Pain From Lifting the Baby","setting":"Primary care clinic • Middle adult • Musculoskeletal","scenario":"Mrs. Kamara is a 50-year-old woman caring for her new grandchild. For 4 weeks she has had pain on the thumb side of her right wrist, worse when lifting the baby, gripping or turning a doorknob. There was no fall or injury. There is mild swelling over the thumb side of the wrist.","qs":[{"n":340,"t":"mc","visit":"Visit 1","s":"Which test is used to diagnose the **most likely** condition?","opts":["Finkelstein test","Tinel sign test","Thompson test","Phalen maneuver"],"correctIdx":[0],"answer":"A","c":"De Quervain tenosynovitis is inflammation of the abductor pollicis longus and extensor pollicis brevis tendons in the first dorsal compartment. It is common in new mothers and caregivers who repeatedly lift infants. In the Finkelstein test, the patient tucks the thumb into a fist and the wrist is deviated toward the ulna, reproducing pain over the radial styloid. Tinel and Phalen assess carpal tunnel syndrome."},{"n":341,"t":"hot","visit":"Visit 1 (continued)","s":"**Click the area where tenderness is expected in Mrs. Kamara's condition.**","answer":"A","c":"In de Quervain tenosynovitis, tenderness and swelling are over the first dorsal compartment at the radial styloid. Tenderness in the anatomical snuffbox, just distal to it, suggests a scaphoid fracture after a fall on an outstretched hand. Tenderness at the base of the thumb (first CMC joint) suggests osteoarthritis.","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 400 320\" width=\"100%\" height=\"auto\"><rect width=\"400\" height=\"320\" fill=\"none\"/><rect x=\"112\" y=\"64\" width=\"30\" height=\"132\" rx=\"14\" fill=\"var(--skin)\" stroke=\"var(--diagram-ink)\" stroke-width=\"2.2\"/><rect x=\"152\" y=\"38\" width=\"30\" height=\"158\" rx=\"14\" fill=\"var(--skin)\" stroke=\"var(--diagram-ink)\" stroke-width=\"2.2\"/><rect x=\"192\" y=\"46\" width=\"30\" height=\"150\" rx=\"14\" fill=\"var(--skin)\" stroke=\"var(--diagram-ink)\" stroke-width=\"2.2\"/><rect x=\"232\" y=\"76\" width=\"30\" height=\"120\" rx=\"14\" fill=\"var(--skin)\" stroke=\"var(--diagram-ink)\" stroke-width=\"2.2\"/><path d=\"M 104 180 L 270 180 Q 282 250 262 300 L 128 300 Q 100 250 104 180 Z\" fill=\"var(--skin)\" stroke=\"var(--diagram-ink)\" stroke-width=\"2.2\"/>\n<line x1=\"116\" y1=\"98\" x2=\"138\" y2=\"98\" stroke=\"var(--diagram-ink)\" stroke-width=\"1.5\" stroke-opacity=\"0.6\"/><line x1=\"116\" y1=\"140\" x2=\"138\" y2=\"140\" stroke=\"var(--diagram-ink)\" stroke-width=\"1.5\" stroke-opacity=\"0.6\"/><line x1=\"156\" y1=\"72\" x2=\"178\" y2=\"72\" stroke=\"var(--diagram-ink)\" stroke-width=\"1.5\" stroke-opacity=\"0.6\"/><line x1=\"156\" y1=\"114\" x2=\"178\" y2=\"114\" stroke=\"var(--diagram-ink)\" stroke-width=\"1.5\" stroke-opacity=\"0.6\"/><line x1=\"196\" y1=\"80\" x2=\"218\" y2=\"80\" stroke=\"var(--diagram-ink)\" stroke-width=\"1.5\" stroke-opacity=\"0.6\"/><line x1=\"196\" y1=\"122\" x2=\"218\" y2=\"122\" stroke=\"var(--diagram-ink)\" stroke-width=\"1.5\" stroke-opacity=\"0.6\"/><line x1=\"236\" y1=\"110\" x2=\"258\" y2=\"110\" stroke=\"var(--diagram-ink)\" stroke-width=\"1.5\" stroke-opacity=\"0.6\"/><line x1=\"236\" y1=\"152\" x2=\"258\" y2=\"152\" stroke=\"var(--diagram-ink)\" stroke-width=\"1.5\" stroke-opacity=\"0.6\"/>\n<path d=\"M 106 214 Q 70 196 52 150 Q 44 128 62 122 Q 80 120 92 150 Q 100 170 114 186\" fill=\"var(--skin)\" stroke=\"var(--diagram-ink)\" stroke-width=\"2.2\"/>\n<line x1=\"134\" y1=\"300\" x2=\"132\" y2=\"316\" stroke=\"var(--diagram-ink)\" stroke-width=\"2\"/><line x1=\"258\" y1=\"300\" x2=\"262\" y2=\"316\" stroke=\"var(--diagram-ink)\" stroke-width=\"2\"/>\n<text x=\"200\" y=\"22\" font-family=\"Arial, sans-serif\" font-size=\"12\" font-weight=\"700\" fill=\"var(--diagram-ink)\" text-anchor=\"middle\">Right hand — dorsal (back) view</text><g class=\"zone\" data-id=\"A\" tabindex=\"0\" role=\"button\" aria-label=\"Area A\">\n<circle cx=\"132\" cy=\"292\" r=\"15\" fill=\"var(--zone-fill)\" stroke=\"var(--zone-ink)\" stroke-width=\"2.5\"/>\n<text x=\"132\" y=\"297.5\" text-anchor=\"middle\" font-family=\"Georgia, 'Times New Roman', serif\" font-size=\"16\" font-weight=\"700\" fill=\"var(--zone-ink)\">A</text></g><g class=\"zone\" data-id=\"B\" tabindex=\"0\" role=\"button\" aria-label=\"Area B\">\n<circle cx=\"120\" cy=\"262\" r=\"15\" fill=\"var(--zone-fill)\" stroke=\"var(--zone-ink)\" stroke-width=\"2.5\"/>\n<text x=\"120\" y=\"267.5\" text-anchor=\"middle\" font-family=\"Georgia, 'Times New Roman', serif\" font-size=\"16\" font-weight=\"700\" fill=\"var(--zone-ink)\">B</text></g><g class=\"zone\" data-id=\"C\" tabindex=\"0\" role=\"button\" aria-label=\"Area C\">\n<circle cx=\"196\" cy=\"288\" r=\"15\" fill=\"var(--zone-fill)\" stroke=\"var(--zone-ink)\" stroke-width=\"2.5\"/>\n<text x=\"196\" y=\"293.5\" text-anchor=\"middle\" font-family=\"Georgia, 'Times New Roman', serif\" font-size=\"16\" font-weight=\"700\" fill=\"var(--zone-ink)\">C</text></g><g class=\"zone\" data-id=\"D\" tabindex=\"0\" role=\"button\" aria-label=\"Area D\">\n<circle cx=\"252\" cy=\"230\" r=\"15\" fill=\"var(--zone-fill)\" stroke=\"var(--zone-ink)\" stroke-width=\"2.5\"/>\n<text x=\"252\" y=\"235.5\" text-anchor=\"middle\" font-family=\"Georgia, 'Times New Roman', serif\" font-size=\"16\" font-weight=\"700\" fill=\"var(--zone-ink)\">D</text></g><g class=\"zone\" data-id=\"E\" tabindex=\"0\" role=\"button\" aria-label=\"Area E\">\n<circle cx=\"207\" cy=\"184\" r=\"15\" fill=\"var(--zone-fill)\" stroke=\"var(--zone-ink)\" stroke-width=\"2.5\"/>\n<text x=\"207\" y=\"189.5\" text-anchor=\"middle\" font-family=\"Georgia, 'Times New Roman', serif\" font-size=\"16\" font-weight=\"700\" fill=\"var(--zone-ink)\">E</text></g></svg>"},{"n":342,"t":"mc","visit":"Visit 1 (continued)","s":"What is the **most appropriate** initial treatment?","opts":["Immediate surgical release of the tendons","A thumb spica splint, NSAIDs and activity changes","Oral antibiotics for a tendon infection","A long arm cast worn for 12 weeks or more"],"correctIdx":[1],"answer":"B","c":"Initial treatment is a thumb spica splint, NSAIDs, ice and changing how she lifts the baby (keeping the wrist neutral and lifting with the palms up). A corticosteroid injection into the tendon sheath is very effective if symptoms persist. Surgical release is reserved for cases that fail conservative care."}]},{"no":115,"batch":5,"title":"Mr. Tembo: A New HIV Diagnosis","setting":"Primary care clinic • Young adult • Infectious disease","scenario":"Mr. Tembo is a 29-year-old man who has sex with men. His routine fourth-generation HIV antigen/antibody test was positive, and the HIV-1/HIV-2 differentiation assay confirmed HIV-1 infection. He feels well. He is anxious and asks whether he can still live a normal life and protect his partner.","qs":[{"n":343,"t":"mc","visit":"Visit 1","s":"When should Mr. Tembo **start** antiretroviral therapy?","opts":["Only after he develops symptoms of AIDS","After waiting one year to see his trend","Only once his CD4 count falls below 200","As soon as possible after diagnosis"],"correctIdx":[3],"answer":"D","c":"Antiretroviral therapy (ART) is recommended for everyone with HIV, regardless of CD4 count, as soon as possible after diagnosis, ideally the same day or within days (\"rapid start\"). Early ART reduces illness and death, and an undetectable viral load prevents sexual transmission (\"undetectable = untransmittable,\" U=U). Preferred regimens are usually based on an integrase inhibitor such as bictegravir or dolutegravir."},{"n":344,"t":"sata","visit":"Visit 1 (continued)","s":"Which **baseline** tests are recommended for Mr. Tembo? **Select all that apply.**","opts":["HIV RNA viral load","A bone marrow biopsy","HIV genotype resistance testing","A routine brain MRI","CD4 count"],"correctIdx":[0,2,4],"answer":"A, C, E","c":"Baseline evaluation includes CD4 count, HIV viral load, genotypic resistance testing, hepatitis A, B and C serologies, syphilis and other STI testing, TB screening, CBC, metabolic panel, lipids, glucose and urinalysis, plus HLA-B*5701 if abacavir is considered. Bone marrow biopsy and brain imaging are not routine."},{"n":345,"t":"mc","visit":"Visit 2 (2 weeks later)","s":"Mr. Tembo's CD4 count is 160 cells/mm³. Which prophylaxis is **indicated**?","opts":["No prophylaxis at this CD4 count at all","Azithromycin for Mycobacterium avium complex","Trimethoprim–sulfamethoxazole for Pneumocystis","Oral fluconazole for cryptococcal disease"],"correctIdx":[2],"answer":"C","c":"A CD4 count below 200 cells/mm³ (or oral thrush) is the indication for Pneumocystis jirovecii pneumonia prophylaxis with TMP-SMX, which also protects against toxoplasmosis when CD4 is below 100 and the patient is Toxoplasma IgG positive. MAC prophylaxis is no longer recommended for patients who start ART promptly. Prophylaxis can stop when CD4 stays above 200 on ART."}]},{"no":116,"batch":5,"title":"Ms. Park: Worried About Everything","setting":"Primary care clinic • Young adult • Mental health","scenario":"Ms. Park is a 24-year-old graduate student who has worried excessively most days for 8 months about school, money, her family's health and minor daily matters. She finds it hard to control the worry and has muscle tension, irritability, fatigue, poor concentration and trouble falling asleep. She does not have panic attacks. TSH is normal. She drinks 4 cups of coffee daily.","qs":[{"n":346,"t":"mc","visit":"Visit 1","s":"Which screening tool is **most appropriate** for her symptoms?","opts":["MDQ for bipolar disorder","CRAFFT questionnaire","Mini-Cog assessment","GAD-7 questionnaire"],"correctIdx":[3],"answer":"D","c":"The GAD-7 is a validated 7-item screen for generalized anxiety disorder; scores of 5, 10 and 15 indicate mild, moderate and severe anxiety. GAD involves excessive, hard-to-control worry most days for at least 6 months with three or more of restlessness, fatigue, poor concentration, irritability, muscle tension and sleep disturbance. The USPSTF recommends anxiety screening in adults under 65."},{"n":347,"t":"mc","visit":"Visit 1 (continued)","s":"What is the **first-line** pharmacologic treatment for her generalized anxiety disorder?","opts":["Propranolol taken every day","Daily alprazolam long term","Quetiapine at bedtime daily","An SSRI such as escitalopram"],"correctIdx":[3],"answer":"D","c":"SSRIs (escitalopram, sertraline) and SNRIs (venlafaxine, duloxetine) are first-line drugs for GAD, combined with cognitive behavioral therapy. Benzodiazepines are not recommended for long-term use because of dependence, cognitive effects and misuse. Propranolol is used for performance anxiety, and antipsychotics are not first-line. Reducing caffeine and improving sleep also help."},{"n":348,"t":"mc","visit":"Visit 2 (6 weeks later)","s":"Ms. Park asks about buspirone. Which statement is **correct**?","opts":["It takes 2–4 weeks to work and has no dependence","It is a benzodiazepine with high misuse potential","It must be taken only as needed for anxiety","It works within an hour for acute panic attacks"],"correctIdx":[0],"answer":"A","c":"Buspirone is a non-benzodiazepine anxiolytic for GAD. It takes 2–4 weeks for full effect, must be taken regularly (not as needed), and has no dependence, withdrawal or significant sedation. It is not effective for panic disorder. Side effects include dizziness, headache and nausea."}]},{"no":117,"batch":5,"title":"Mr. Reyes: Silvery Patches on the Elbows","setting":"Primary care clinic • Young adult • Dermatology","scenario":"Mr. Reyes is a 31-year-old man with well-defined, red plaques covered by thick silvery scales on both elbows, knees and scalp for 2 years. Scratching a plaque causes pinpoint bleeding. He has small pits in several fingernails. His left knee and two toes have been swollen and stiff in the mornings. He smokes and his BMI is 32.","qs":[{"n":349,"t":"mc","visit":"Visit 1","s":"What is the **most likely** diagnosis of his skin condition?","opts":["Atopic dermatitis","Lichen planus","Plaque psoriasis","Tinea corporis"],"correctIdx":[2],"answer":"C","c":"Plaque psoriasis causes well-demarcated, red plaques with thick silvery scale on the extensor surfaces (elbows, knees), scalp and lower back. Removing scale causes pinpoint bleeding (Auspitz sign), and lesions can appear at sites of skin injury (Koebner phenomenon). Nail pitting is common. Atopic dermatitis affects flexural areas, and tinea forms annular lesions with central clearing."},{"n":350,"t":"sata","visit":"Visit 1 (continued)","s":"Which conditions are **associated** with psoriasis? **Select all that apply.**","opts":["Depression","Hypothyroidism caused by the plaques","Sensorineural hearing loss","Metabolic syndrome and cardiovascular disease","Psoriatic arthritis"],"correctIdx":[0,3,4],"answer":"A, D, E","c":"Psoriasis is a systemic inflammatory disease. Up to 30% of patients develop psoriatic arthritis, often with nail changes, dactylitis (\"sausage digits\"), enthesitis and DIP involvement; his swollen knee and toes need rheumatology evaluation. Psoriasis is also associated with obesity, metabolic syndrome, cardiovascular disease, depression and IBD."},{"n":351,"t":"mc","visit":"Visit 1 (continued)","s":"Which treatment should be **avoided** because it can cause a severe flare when stopped?","opts":["Narrowband UVB phototherapy","Topical calcipotriene cream","Topical clobetasol ointment","A course of oral prednisone"],"correctIdx":[3],"answer":"D","c":"Systemic corticosteroids can cause a severe rebound flare, including pustular or erythrodermic psoriasis, when they are tapered or stopped, so they are avoided. Mild to moderate psoriasis is treated with topical corticosteroids and vitamin D analogs such as calcipotriene; phototherapy, methotrexate and biologics are used for moderate to severe disease. Lithium, beta-blockers and antimalarials can also worsen psoriasis."}]},{"no":118,"batch":5,"title":"Ms. Fontaine: A Rolled Ankle on the Court","setting":"Urgent visit • Young adult • Musculoskeletal","scenario":"Ms. Fontaine is a 22-year-old volleyball player who landed on another player's foot 2 hours ago, rolling her right ankle inward. She has swelling and bruising over the outside of the ankle. She took four steps into the clinic with a limp.","qs":[{"n":352,"t":"sata","visit":"Visit 1","s":"According to the **Ottawa ankle rules**, which findings would require an x-ray? **Select all that apply.**","opts":["Inability to bear weight for four steps","Bruising on the outer side of the foot","Bone tenderness at the base of the fifth metatarsal","Bone tenderness at the posterior edge of the lateral malleolus","Swelling over the anterior talofibular ligament"],"correctIdx":[0,2,3],"answer":"A, C, D","c":"The Ottawa ankle rules call for ankle x-rays with pain in the malleolar zone plus bone tenderness at the posterior edge or tip of the lateral or medial malleolus, or inability to bear weight for four steps both immediately and in the clinic. Foot x-rays are needed with tenderness at the base of the fifth metatarsal or the navicular. Swelling and bruising alone do not require imaging."},{"n":353,"t":"mc","visit":"Visit 1 (continued)","s":"Which ligament is **most commonly** injured in an inversion ankle sprain?","opts":["Anterior talofibular ligament","Posterior talofibular ligament","Anterior cruciate ligament","Deltoid ligament of the ankle"],"correctIdx":[0],"answer":"A","c":"Inversion sprains account for most ankle sprains, and the anterior talofibular ligament (ATFL) is the most commonly injured, followed by the calcaneofibular ligament. The anterior drawer test assesses ATFL laxity. The deltoid ligament on the medial side is injured in eversion injuries, and the ACL is a knee ligament."},{"n":354,"t":"mc","visit":"Visit 1 (continued)","s":"Her x-rays are not needed and she has a grade II sprain. What is the **best** management?","opts":["Early weight-bearing with a brace and rehabilitation","Strict bed rest for 2 weeks with elevation","Immediate surgical repair of the ligament","A non-weight-bearing cast for 6 weeks"],"correctIdx":[0],"answer":"A","c":"Most ankle sprains are treated with short-term rest, ice, compression and elevation, then early functional mobilization with a semi-rigid brace or lace-up support, weight-bearing as tolerated, and rehabilitation focusing on range of motion, strength and proprioception (balance training) to prevent recurrence. Prolonged immobilization delays recovery, and surgery is rarely needed."}]},{"no":119,"batch":5,"title":"Ms. Bello: An Abnormal Pap Result","setting":"Women's health visit • Young adult • Gynecology / Health promotion","scenario":"Ms. Bello is a 27-year-old woman who had her first cervical cytology at age 24, which was normal. Her cytology this year shows atypical squamous cells of undetermined significance (ASC-US), and reflex HPV testing is positive for high-risk HPV. She has never received the HPV vaccine. She is not pregnant.","qs":[{"n":355,"t":"mc","visit":"Visit 1","s":"What is the **recommended** cervical cancer screening for average-risk women aged 21–29?","opts":["Cytology with HPV co-testing every year","No screening until she turns 30","Cytology alone every year from age 18","Cervical cytology alone every 3 years"],"correctIdx":[3],"answer":"D","c":"The USPSTF recommends cervical cytology every 3 years for women aged 21–29. From 30 to 65, options are cytology every 3 years, primary high-risk HPV testing every 5 years, or co-testing every 5 years. Screening is not recommended before age 21 or after 65 with adequate negative prior screening, or after hysterectomy for benign disease."},{"n":356,"t":"mc","visit":"Visit 1 (continued)","s":"What is the **most appropriate** next step for her ASC-US result with positive high-risk HPV?","opts":["Refer for colposcopy","Repeat cytology in 3 years","Treat with a 7-day antibiotic","Perform a hysterectomy"],"correctIdx":[0],"answer":"A","c":"Under ASCCP risk-based guidelines, ASC-US with positive high-risk HPV in a patient 25 or older generally carries enough risk of CIN 3 to warrant colposcopy. ASC-US with negative HPV can return to routine screening in 3–5 years. Abnormal Pap results are not treated with antibiotics."},{"n":357,"t":"sata","visit":"Visit 1 (continued)","s":"Ms. Bello asks about the HPV vaccine. Which statements are **correct**? **Select all that apply.**","opts":["It is recommended for everyone through age 26","It requires a negative HPV test before the first dose","It can still protect against HPV types she has not had","It is unsafe after an abnormal Pap result","It is not given during pregnancy"],"correctIdx":[0,2,4],"answer":"A, C, E","c":"The HPV vaccine is routinely recommended at 11–12 years (can start at 9) and catch-up through age 26; shared decision-making applies for ages 27–45. People with prior HPV infection or abnormal cytology can still benefit because the vaccine protects against types not yet acquired. HPV testing is not needed before vaccination, and the vaccine is deferred during pregnancy. Vaccinated people still need routine screening."}]},{"no":120,"batch":5,"title":"Mr. Asante: Fever and Bone Pain","setting":"Urgent visit • Young adult • Hematology","scenario":"Mr. Asante is a 25-year-old man with sickle cell anemia (HbSS) who has had pain in his lower back and thighs for 1 day, similar to previous pain crises, and a temperature of 38.8 °C since this morning. He has had several pain crises a year, two of which needed hospitalization. He takes folic acid only.","qs":[{"n":358,"t":"mc","visit":"Visit 1","s":"What is the **most important** concern about his fever?","opts":["Dehydration from not drinking enough","Fever is part of every pain crisis only","Risk of overwhelming bacterial infection","Likely a mild viral cold that needs rest"],"correctIdx":[2],"answer":"C","c":"People with sickle cell disease have functional asplenia from repeated splenic infarction and are at high risk of overwhelming infection with encapsulated organisms such as Streptococcus pneumoniae, Haemophilus influenzae and Neisseria meningitidis. A temperature of 38.5 °C or higher requires urgent evaluation (CBC, reticulocytes, blood cultures, chest x-ray as indicated) and prompt IV antibiotics. Chest pain, cough or hypoxia suggest acute chest syndrome."},{"n":359,"t":"sata","visit":"Visit 1 (continued)","s":"Which vaccines are **especially important** for Mr. Asante? **Select all that apply.**","opts":["Annual influenza vaccine","Pneumococcal vaccine","BCG vaccine for tuberculosis","Yellow fever vaccine for all","Meningococcal vaccines"],"correctIdx":[0,1,4],"answer":"A, B, E","c":"Because of functional asplenia, people with sickle cell disease need pneumococcal vaccination, meningococcal ACWY and B vaccines, Hib if not previously vaccinated, and annual influenza vaccine. Children also receive daily penicillin prophylaxis until at least age 5. Yellow fever and BCG are not routinely indicated."},{"n":360,"t":"mc","visit":"Visit 2 (after recovery)","s":"Which medication **reduces** the frequency of his pain crises and acute chest syndrome?","opts":["Daily oral prednisone","Daily oral hydroxyurea","Daily oral warfarin","Daily oral iron sulfate"],"correctIdx":[1],"answer":"B","c":"Hydroxyurea increases fetal hemoglobin (HbF), which reduces sickling, and lowers the frequency of pain crises, acute chest syndrome and transfusions, and improves survival. It requires CBC monitoring for myelosuppression and is teratogenic. Iron supplements are usually avoided because of transfusion iron overload. L-glutamine and crizanlizumab are other options."}]},{"no":121,"batch":5,"title":"Emma: Never Thin Enough","setting":"Primary care clinic • Adolescent • Mental health / Nutrition","scenario":"Emma is a 15-year-old girl brought in by her parents for weight loss of 18 lb over 5 months and no periods for 4 months. She runs daily, eats very little and says she feels fat although her BMI is 15.8 (below 75% of median BMI for age). HR is 42 lying down and 70 standing, BP 86/52, and temperature 35.8 °C. She has fine body hair on her arms. Phosphate is low.","qs":[{"n":361,"t":"mc","visit":"Visit 1","s":"What is the **most likely** diagnosis?","opts":["Hyperthyroidism with weight loss","Bulimia nervosa with normal weight","Anorexia nervosa, restricting type","Type 1 diabetes with weight loss"],"correctIdx":[2],"answer":"C","c":"Anorexia nervosa involves restriction of energy intake leading to significantly low body weight, intense fear of gaining weight and a disturbed body image. The restricting type uses dieting, fasting or excessive exercise. Signs include bradycardia, hypotension, hypothermia, orthostatic changes, lanugo, amenorrhea and electrolyte abnormalities. Bulimia occurs at normal weight with bingeing and purging."},{"n":362,"t":"sata","visit":"Visit 1 (continued)","s":"Which of Emma's findings meet criteria for **hospital admission**? **Select all that apply.**","opts":["Orthostatic rise in heart rate above 20","Wanting to lose two more pounds","Heart rate below 50 beats per minute while awake","BMI below 75% of the median for age","Missing one menstrual period"],"correctIdx":[0,2,3],"answer":"A, C, D","c":"Criteria for hospitalizing adolescents with eating disorders include daytime HR below 50, BP below 90/45, temperature below 35.6 °C, orthostatic HR increase above 20 (or BP drop above 20 systolic), BMI below 75% of median, electrolyte disturbances (low phosphate, potassium or magnesium), acute food refusal, arrhythmias and failure of outpatient treatment. Family-based treatment is first-line for medically stable adolescents."},{"n":363,"t":"mc","visit":"Visit 2 (hospital)","s":"During nutritional rehabilitation, which electrolyte must be **closely monitored** to prevent refeeding syndrome?","opts":["Serum phosphate","Serum sodium","Serum calcium","Serum chloride"],"correctIdx":[0],"answer":"A","c":"Refeeding syndrome occurs when nutrition is restarted in malnourished patients: insulin release drives phosphate, potassium and magnesium into cells, causing hypophosphatemia, which can lead to heart failure, arrhythmias, respiratory failure, seizures and death. Phosphate, potassium, magnesium and glucose are monitored closely, especially in the first week, and supplemented as needed."}]},{"no":122,"batch":5,"title":"Jamal: A Bump Below the Kneecap","setting":"Sports clinic • Adolescent • Musculoskeletal","scenario":"Jamal is a 13-year-old basketball player in a growth spurt who has had pain and a tender bump just below both kneecaps for 2 months. The pain worsens with jumping, running and kneeling and eases with rest. The tibial tubercles are prominent and tender. The knees are stable with no effusion, and the hips examine normally.","qs":[{"n":364,"t":"mc","visit":"Visit 1","s":"What is the **most likely** diagnosis?","opts":["Anterior cruciate ligament tear","Osgood–Schlatter disease","Septic arthritis of the knee","Slipped capital femoral epiphysis"],"correctIdx":[1],"answer":"B","c":"Osgood–Schlatter disease is a traction apophysitis of the tibial tubercle where the patellar tendon inserts. It occurs in active adolescents during growth spurts, especially with jumping and running sports, and causes pain, swelling and tenderness over a prominent tibial tubercle. It is often bilateral. Normal hip examination excludes SCFE."},{"n":365,"t":"match","visit":"Visit 1 (continued)","s":"The FNP reviews adolescent knee problems. **Drag each condition to its typical presentation.** One option will not be used.","items":["Patellofemoral pain syndrome","ACL tear","Meniscal tear"],"tgts":["Anterior knee pain with stairs, squatting and prolonged sitting","Tender, swollen tibial tubercle in a growing athlete","Joint-line pain with locking or catching and a positive McMurray test","A \"pop\" with pivoting, rapid swelling and a positive Lachman test"],"map":[0,3,2],"answer":"1–A, 2–D, 3–C","c":"Patellofemoral pain syndrome causes diffuse anterior knee pain worse with stairs, squatting and prolonged sitting (the \"theater sign\"). An ACL tear follows a non-contact pivot with a pop, rapid hemarthrosis and a positive Lachman test. A meniscal tear causes joint-line tenderness, locking or catching, and a positive McMurray test. The unused option describes Osgood–Schlatter disease, the case diagnosis."},{"n":366,"t":"mc","visit":"Visit 1 (continued)","s":"What is the **most appropriate** management for Jamal?","opts":["Surgical removal of the tibial tubercle now","A long leg cast for 8 weeks without exercise","Stopping all sports until he turns 18 years old","Activity changes, ice, NSAIDs and quadriceps stretching"],"correctIdx":[3],"answer":"D","c":"Osgood–Schlatter disease is self-limited and resolves when the growth plate closes. Management includes relative rest and activity modification guided by pain, ice, NSAIDs, quadriceps and hamstring stretching, and a patellar tendon strap or knee pads. He can usually continue sports as tolerated. Surgery is rarely needed after skeletal maturity, and the bump may persist."}]},{"no":123,"batch":5,"title":"Baby Lily: Wheezing and Working Hard to Breathe","setting":"Urgent visit • Infant • Respiratory","scenario":"Lily is a 4-month-old girl born at term with 3 days of runny nose and cough, now with wheezing and fast breathing. She has a temperature of 38.1 °C, RR 56, SpO₂ 95% on room air, mild subcostal retractions and diffuse wheezes and crackles. She is feeding about two-thirds of her usual amount and has had 4 wet diapers today. Her 3-year-old brother has a cold.","qs":[{"n":367,"t":"mc","visit":"Visit 1","s":"What is the **most appropriate** management of Lily's bronchiolitis?","opts":["Oral amoxicillin twice daily for 10 days","Supportive care with nasal suctioning and fluids","Nebulized albuterol every 4 hours at home","Oral prednisolone once daily for 5 days"],"correctIdx":[1],"answer":"B","c":"Bronchiolitis, most often caused by RSV, peaks at days 3–5 in infants under 2 years. AAP guidelines recommend supportive care: nasal suctioning, hydration, and oxygen if SpO₂ is persistently below 90%. Albuterol, epinephrine, systemic corticosteroids, antibiotics and chest physiotherapy are not recommended routinely. Parents need clear return precautions."},{"n":368,"t":"sata","visit":"Visit 1 (continued)","s":"Which signs should prompt the parents to **return immediately** or call 911? **Select all that apply.**","opts":["Pauses in breathing or turning blue","Feeding less than half of usual or few wet diapers","Clear runny nose that continues for a week","Severe retractions, grunting or nasal flaring","A cough that lasts 2 to 3 weeks"],"correctIdx":[0,1,3],"answer":"A, B, D","c":"Infants with bronchiolitis need urgent care for apnea or cyanosis, increased work of breathing (severe retractions, grunting, nasal flaring, RR above 70), SpO₂ persistently below 90%, poor feeding or dehydration, lethargy, and age under 12 weeks or prematurity with worsening symptoms. Rhinorrhea and cough commonly persist for 2–3 weeks."},{"n":369,"t":"mc","visit":"Visit 2 (well-child visit, next autumn)","s":"Lily's mother is pregnant again. Which measure helps **prevent** severe RSV in the new baby?","opts":["Maternal RSV vaccine at 32–36 weeks or infant nirsevimab","Daily antibiotics for the newborn during winter","Monthly oral steroids for the baby until age 2","Avoiding all vaccines during the pregnancy"],"correctIdx":[0],"answer":"A","c":"Severe RSV in infants can be prevented with either the maternal RSVpreF vaccine at 32–36 weeks of gestation during RSV season, or the long-acting monoclonal antibody nirsevimab (or clesrovimab) given to infants under 8 months entering their first RSV season if the mother was not vaccinated. Hand hygiene and avoiding sick contacts also help. Antibiotics and steroids do not prevent RSV."}]},{"no":124,"batch":5,"title":"Baby Zara: A Hip Clunk","setting":"Newborn exam • Newborn • Musculoskeletal","scenario":"Zara is a 2-day-old firstborn girl delivered by cesarean section for breech presentation. Her mother had hip dysplasia as a child. During the newborn examination, the FNP gently abducts the flexed left hip while lifting the greater trochanter and feels a \"clunk\" as the femoral head moves.","qs":[{"n":370,"t":"mc","visit":"Visit 1","s":"Which maneuver did the FNP perform to **reduce** a dislocated hip?","opts":["Ortolani maneuver","Barlow maneuver","Galeazzi test only","Trendelenburg test"],"correctIdx":[0],"answer":"A","c":"The Ortolani maneuver relocates a dislocated hip: the flexed hip is abducted while the greater trochanter is lifted, producing a palpable clunk as the femoral head returns to the acetabulum. The Barlow maneuver adducts the hip and pushes posteriorly to dislocate an unstable hip. The Galeazzi sign (unequal knee heights) and limited abduction are later signs, and Trendelenburg is assessed in walking children."},{"n":371,"t":"sata","visit":"Visit 1 (continued)","s":"Which factors increase Zara's risk of **developmental dysplasia of the hip**? **Select all that apply.**","opts":["Family history of hip dysplasia","Delivery by cesarean section","Breech presentation","Female sex","Being born at term"],"correctIdx":[0,2,3],"answer":"A, C, D","c":"Major risk factors for developmental dysplasia of the hip (DDH) are female sex, breech presentation in the third trimester (regardless of delivery method), family history, firstborn status and oligohydramnios. Tight swaddling with the legs straight also increases risk. Cesarean delivery itself is not a risk factor; it is the breech position that matters."},{"n":372,"t":"mc","visit":"Visit 1 (continued)","s":"Zara's hip is confirmed unstable on ultrasound. What is the **usual** treatment?","opts":["Swaddling with the legs straight","A Pavlik harness worn full-time","Waiting until she starts walking","Immediate hip replacement surgery"],"correctIdx":[1],"answer":"B","c":"An unstable or dislocated hip in an infant under 6 months is treated with a Pavlik harness, which holds the hips flexed and abducted so the femoral head stays in the acetabulum. Ultrasound is the imaging test before 4–6 months of age; x-rays are used after that. Closed or open reduction with casting is needed if the harness fails or diagnosis is late. Hip-healthy swaddling allows the legs to bend up and out."}]},{"no":125,"batch":5,"title":"Mia: A Rash After the Fever Broke","setting":"Primary care clinic • Toddler • Infectious disease / Dermatology","scenario":"Mia is a 14-month-old girl who had 3 days of high fever up to 40 °C but otherwise seemed fairly well. Yesterday the fever ended and a pink, blanching rash of small spots appeared on her trunk and spread to her neck and arms. She is now playful and eating well. Her daycare teacher is pregnant and asks whether she is at risk from the children's rashes.","qs":[{"n":373,"t":"mc","visit":"Visit 1","s":"What is the **most likely** diagnosis?","opts":["Scarlet fever (group A strep)","Kawasaki disease (vasculitis)","Roseola infantum (HHV-6)","Measles (rubeola virus)"],"correctIdx":[2],"answer":"C","c":"Roseola (exanthem subitum), caused by human herpesvirus 6 (or 7), affects children aged 6 months to 2 years. It causes 3–5 days of high fever in a child who looks relatively well, followed by a pink maculopapular rash on the trunk that appears as the fever breaks. Febrile seizures can occur during the fever. Measles rash appears while the fever is high."},{"n":374,"t":"match","visit":"Visit 1 (continued)","s":"The FNP teaches the daycare staff. **Drag each childhood illness to its classic presentation.** One option will not be used.","items":["Fifth disease (parvovirus B19)","Measles","Varicella"],"tgts":["Itchy vesicles in crops at different stages of healing","\"Slapped cheek\" face rash, then a lacy rash on the limbs","Sandpaper-like rash with a strawberry tongue after sore throat","Cough, coryza, conjunctivitis, Koplik spots, then a head-to-toe rash"],"map":[1,3,0],"answer":"1–B, 2–D, 3–A","c":"Fifth disease begins with a bright red \"slapped cheek\" rash followed by a lacy, reticular rash on the limbs. Measles begins with high fever, the \"3 Cs\" (cough, coryza, conjunctivitis) and Koplik spots, then a maculopapular rash spreading from the head down. Varicella causes itchy vesicles (\"dewdrops on a rose petal\") in crops at different stages. The sandpaper rash with strawberry tongue is scarlet fever from group A strep."},{"n":375,"t":"mc","visit":"Visit 1 (continued)","s":"Which childhood infection poses a **specific risk** to the pregnant teacher's fetus?","opts":["Parvovirus B19, which can cause fetal anemia and hydrops","The common cold, which causes neural tube defects","Roseola, which causes most fetal heart defects","Hand-foot-and-mouth disease, which causes deafness"],"correctIdx":[0],"answer":"A","c":"Parvovirus B19 (fifth disease) infects red cell precursors and can cause fetal anemia, hydrops fetalis and fetal loss, especially in the first 20 weeks. Children are contagious before the rash appears. An exposed pregnant person should have parvovirus IgG and IgM testing and, if infected, fetal ultrasound monitoring. Other important infections in pregnancy include rubella, varicella, CMV and toxoplasmosis."}]},{"no":126,"batch":6,"title":"Mrs. Thornton: A Wound That Will Not Heal","setting":"Primary care clinic • Older adult • Vascular / Wound care","scenario":"Mrs. Thornton is a 74-year-old woman with obesity and a history of a DVT in her left leg 10 years ago. She has a shallow, irregular, moist ulcer just above the left medial malleolus that has been present for 2 months. The surrounding skin has brown discoloration and is thickened, and she has pitting edema of the lower leg that worsens by evening. The pain eases when she raises her legs. Pedal pulses are palpable, and her ankle-brachial index (ABI) is 0.95.","qs":[{"n":376,"t":"mc","visit":"Visit 1","s":"What type of ulcer does Mrs. Thornton **most likely** have?","opts":["Diabetic neuropathic ulcer","Venous stasis ulcer","Stage 2 pressure injury","Arterial ischemic ulcer"],"correctIdx":[1],"answer":"B","c":"Venous ulcers are shallow, irregular and moist and usually occur over the medial malleolus (the \"gaiter area\"), with edema, hemosiderin (brown) staining, lipodermatosclerosis and pain that improves with leg elevation. Chronic venous insufficiency often follows DVT (post-thrombotic syndrome). Arterial ulcers are painful, punched-out and distal, with weak pulses and pain that worsens with elevation."},{"n":377,"t":"mc","visit":"Visit 1 (continued)","s":"Her ABI is 0.95. What is the **cornerstone** of treatment for her ulcer?","opts":["Surgical amputation below the knee","Oral antibiotics for at least 6 weeks","Keeping the leg dependent while seated","Compression therapy with leg elevation"],"correctIdx":[3],"answer":"D","c":"Compression therapy (multilayer bandages, then compression stockings) with leg elevation and moist wound care is the cornerstone of venous ulcer treatment. An ABI is checked first because compression is unsafe with significant arterial disease (generally ABI below about 0.8 needs modified compression and vascular review). Antibiotics are used only for clinical infection. Lifelong compression helps prevent recurrence."},{"n":378,"t":"match","visit":"Visit 2 (teaching)","s":"The FNP teaches a student about leg ulcers. **Drag each ulcer type to its typical features.** One option will not be used.","items":["Arterial ulcer","Venous ulcer","Neuropathic (diabetic) ulcer"],"tgts":["Shallow, irregular ulcer at the medial ankle with brown staining","Painless ulcer under a metatarsal head with surrounding callus","Honey-colored crusted erosions around the nose and mouth","Painful, punched-out ulcer on the toes with absent pulses"],"map":[3,0,1],"answer":"1–D, 2–A, 3–B","c":"Arterial ulcers are painful, dry, punched-out lesions on the toes, heels or lateral malleolus with pale, hairless, cool skin and weak or absent pulses. Venous ulcers are shallow and irregular at the medial ankle with edema and brown staining. Neuropathic ulcers occur at pressure points such as the metatarsal heads, are painless because of neuropathy, and are surrounded by callus. Honey-colored crusts describe impetigo."}]},{"no":127,"batch":6,"title":"Mr. Ivanov: Yellow Halos and a Slow Pulse","setting":"Primary care clinic • Older adult • Cardiovascular / Pharmacology","scenario":"Mr. Ivanov is an 82-year-old man with heart failure and atrial fibrillation who takes digoxin 0.25 mg daily, furosemide, metoprolol and apixaban. His cardiologist added amiodarone 3 weeks ago. He now has nausea, poor appetite, confusion and sees yellow-green halos around lights. HR is 48 and irregular. Potassium is 3.1 mEq/L and creatinine has risen from 1.1 to 1.6 mg/dL.","qs":[{"n":379,"t":"mc","visit":"Visit 1","s":"What is the **most likely** cause of Mr. Ivanov's symptoms?","opts":["Acute angle-closure glaucoma","Viral gastroenteritis","Toxicity from his digoxin","Early Alzheimer disease"],"correctIdx":[2],"answer":"C","c":"Digoxin toxicity causes GI symptoms (anorexia, nausea, vomiting), neurological symptoms (confusion, fatigue) and visual changes (yellow-green vision, halos, blurred vision), along with bradycardia and arrhythmias such as AV block or ventricular ectopy. Digoxin has a narrow therapeutic range, and older adults are especially susceptible."},{"n":380,"t":"sata","visit":"Visit 1 (continued)","s":"Which factors in his history **increased** the risk of digoxin toxicity? **Select all that apply.**","opts":["Worsening kidney function","Hypokalemia from furosemide","Daily walking for exercise","Taking apixaban for AF","Starting amiodarone"],"correctIdx":[0,1,4],"answer":"A, B, E","c":"Hypokalemia (often from loop or thiazide diuretics), hypomagnesemia and hypercalcemia increase digoxin's effect on the heart. Digoxin is cleared by the kidneys, so reduced kidney function raises levels. Amiodarone, verapamil, diltiazem, quinidine, clarithromycin and some other drugs raise digoxin levels; the digoxin dose is usually halved when amiodarone is started. Apixaban does not interact significantly."},{"n":381,"t":"mc","visit":"Visit 1 (continued)","s":"What is the **most appropriate** next step?","opts":["Stop amiodarone and keep digoxin unchanged","Hold digoxin and send him for urgent ECG and levels","Give an antiemetic and recheck in one month","Increase digoxin to control the slow heart rate"],"correctIdx":[1],"answer":"B","c":"Suspected digoxin toxicity with bradycardia and confusion needs urgent evaluation: hold digoxin and obtain an ECG, a digoxin level, potassium, magnesium and kidney function, with cardiac monitoring. Potassium is corrected cautiously. Digoxin immune Fab is given for life-threatening arrhythmias, severe hyperkalemia or end-organ effects."}]},{"no":128,"batch":6,"title":"Mr. Ochieng: His Hat No Longer Fits","setting":"Primary care clinic • Older adult • Musculoskeletal / Endocrine","scenario":"Mr. Ochieng is a 71-year-old man with deep, aching pain in his right shin and lower back for a year. His wife says his hats no longer fit, and he has had gradual hearing loss. His right tibia is bowed and warm. Labs show alkaline phosphatase of 410 U/L, with normal calcium, phosphate, GGT and liver enzymes. A skull x-ray shows thickened bone with areas of lysis and sclerosis.","qs":[{"n":382,"t":"mc","visit":"Visit 1","s":"What is the **most likely** diagnosis?","opts":["Paget disease of the bone","Multiple myeloma with lysis","Osteomalacia from low vitamin D","Primary hyperparathyroidism"],"correctIdx":[0],"answer":"A","c":"Paget disease of bone is a disorder of excessive, disorganized bone remodeling in older adults. It causes bone pain, deformities (bowed tibia, enlarged skull), warmth over affected bone, hearing loss from skull involvement and nerve compression, and fractures. Calcium and phosphate are usually normal. Myeloma causes lytic lesions with anemia and hypercalcemia, and osteomalacia causes low calcium or phosphate."},{"n":383,"t":"mc","visit":"Visit 1 (continued)","s":"Which laboratory pattern is **typical** of his condition?","opts":["A high calcium with a high PTH level","An isolated high alkaline phosphatase","A high GGT with a high bilirubin","A low calcium with a low phosphate"],"correctIdx":[1],"answer":"B","c":"Paget disease typically causes an isolated rise in alkaline phosphatase (reflecting increased bone turnover) with normal calcium, phosphate and liver tests. A normal GGT confirms the ALP is from bone rather than liver. Diagnosis is confirmed with plain x-rays, and a bone scan shows the extent of disease."},{"n":384,"t":"mc","visit":"Visit 1 (continued)","s":"What is the **treatment of choice** for his symptomatic disease?","opts":["A high-dose loop diuretic daily","A bisphosphonate such as zoledronic acid","Oral calcium supplements alone","Long-term oral prednisone therapy"],"correctIdx":[1],"answer":"B","c":"Bisphosphonates, especially a single IV dose of zoledronic acid, are the treatment of choice for symptomatic Paget disease or disease in high-risk sites (skull, spine, weight-bearing bones). They suppress bone turnover, relieve pain and normalize ALP. Adequate calcium and vitamin D are given to prevent hypocalcemia. Rarely, osteosarcoma develops in affected bone."}]},{"no":129,"batch":6,"title":"Mr. Garrison: Leaning on the Shopping Cart","setting":"Primary care clinic • Older adult • Musculoskeletal / Neurology","scenario":"Mr. Garrison is a 73-yea

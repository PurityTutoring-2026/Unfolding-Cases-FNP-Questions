 first-born boy who has had forceful, projectile, non-bilious vomiting after almost every feeding for 4 days. He seems hungry right after vomiting and wants to feed again. He has fewer wet diapers. On examination he has dry mucous membranes, visible waves of peristalsis across the upper abdomen and a firm, olive-sized mass in the epigastrium.","qs":[{"n":145,"t":"mc","visit":"Visit 1","s":"What is the **most likely** diagnosis?","opts":["Intestinal malrotation with volvulus","Cow's milk protein allergy","Physiologic gastroesophageal reflux","Hypertrophic pyloric stenosis"],"correctIdx":[3],"answer":"D","c":"Hypertrophic pyloric stenosis typically presents at 2–8 weeks, most often in first-born males, with projectile non-bilious vomiting after feeds, a hungry infant, visible peristalsis and a palpable olive-shaped pyloric mass. Reflux is effortless spitting up in a growing infant, malrotation with volvulus causes bilious vomiting, and milk protein allergy causes blood-streaked stools."},{"n":146,"t":"mc","visit":"Visit 1 (continued)","s":"Which electrolyte pattern is **expected** in Noah's condition?","opts":["Hyperkalemic, high-gap metabolic acidosis","Hypochloremic, hypokalemic metabolic alkalosis","Entirely normal electrolytes in all infants","Hyperchloremic, normal-gap metabolic acidosis"],"correctIdx":[1],"answer":"B","c":"Repeated vomiting of gastric contents loses hydrochloric acid, producing hypochloremic metabolic alkalosis, and volume depletion activates aldosterone, causing potassium loss (hypokalemia). These abnormalities are corrected with IV fluids before surgery."},{"n":147,"t":"mc","visit":"Visit 1 (continued)","s":"Which test **confirms** the diagnosis?","opts":["Abdominal ultrasound of the pylorus","Upright chest x-ray for free air","Barium enema of the large bowel","A stool culture with sensitivity testing"],"correctIdx":[0],"answer":"A","c":"Abdominal ultrasound is the test of choice for pyloric stenosis, showing a thickened, elongated pyloric muscle. Treatment is surgical pyloromyotomy after fluid and electrolyte correction. A barium enema diagnoses and treats intussusception, not pyloric stenosis. Erythromycin exposure in early infancy is a known risk factor."}]},{"no":50,"batch":2,"title":"Zara: Pale and Tired at Two","setting":"Primary care clinic • Toddler • Hematology / Environmental health","scenario":"Zara is a 2-year-old who drinks about 40 oz of whole cow's milk a day and is a picky eater. She lives in an apartment built in 1955 that is being renovated. She is pale and eats ice and paint chips. Hemoglobin is 9.1 g/dL with an MCV of 64 fL and a high RDW. A confirmed venous blood lead level is 16 µg/dL.","qs":[{"n":148,"t":"mc","visit":"Visit 1","s":"What is the **most likely** main cause of Zara's anemia?","opts":["Beta-thalassemia trait inherited from parents","Iron deficiency from excess cow's milk","Anemia of chronic kidney disease","Vitamin B12 deficiency from a vegan diet"],"correctIdx":[1],"answer":"B","c":"Excess cow's milk (more than 16–24 oz a day) causes iron-deficiency anemia because milk is low in iron, inhibits iron absorption, displaces iron-rich foods and can cause occult intestinal blood loss. Microcytosis with a high RDW and pica support iron deficiency. Thalassemia trait has a normal RDW, and B12 deficiency causes macrocytosis."},{"n":149,"t":"sata","visit":"Visit 1 (continued)","s":"With a confirmed blood lead level of 16 µg/dL, which actions are **appropriate**? **Select all that apply.**","opts":["Repeat a venous lead level within 1–3 months","Reassure the family that this level is harmless","Start chelation therapy with succimer today","Treat her iron deficiency","Report to the health department for an environmental investigation"],"correctIdx":[0,3,4],"answer":"A, D, E","c":"For a confirmed blood lead level of 3.5–19 µg/dL, CDC recommends an environmental history and investigation through the health department, education on hygiene and nutrition (iron, calcium, vitamin C), treating iron deficiency (which increases lead absorption), developmental monitoring and repeat venous testing within 1–3 months. Chelation is reserved for levels of 45 µg/dL or higher. There is no safe lead level."},{"n":150,"t":"mc","visit":"Visit 1 (continued)","s":"Which nutrition advice is **most appropriate** for Zara's family?","opts":["Give her apple juice in place of all meals","Limit cow's milk to 16–24 oz a day and add iron-rich foods","Increase cow's milk to help her gain weight","Switch her to goat's milk with no other change"],"correctIdx":[1],"answer":"B","c":"Toddlers 12–24 months should drink no more than 16–24 oz of milk a day, with iron-rich foods such as meats, beans and iron-fortified cereals. Vitamin C helps absorption. Oral iron (3 mg/kg/day of elemental iron) is given, with response expected as a reticulocyte rise in 7–10 days. Juice should be limited to 4 oz a day at this age."}]},{"no":51,"batch":3,"title":"Mr. Harrington: Tired and Pale","setting":"Primary care clinic • Older adult • Hematology / Gastrointestinal","scenario":"Mr. Harrington is a 71-year-old man with 3 months of fatigue and shortness of breath on exertion. He takes low-dose aspirin and ibuprofen most days for arthritis. He has no visible bleeding and his bowel habits are unchanged. Hemoglobin is 9.8 g/dL, MCV 72 fL and RDW 17.5%. He has never had a colonoscopy.","qs":[{"n":151,"t":"mc","visit":"Visit 1","s":"Which test **best confirms** the type of anemia suggested by these results?","opts":["Hemoglobin electrophoresis study","Serum folate concentration","Serum vitamin B12 concentration","Serum ferritin concentration"],"correctIdx":[3],"answer":"D","c":"A microcytic anemia with a high RDW suggests iron deficiency. A low serum ferritin (below about 30 ng/mL) is the most specific test for iron deficiency; TIBC is typically high and transferrin saturation low. B12 and folate deficiency cause macrocytosis, and electrophoresis evaluates thalassemia, which usually has a normal RDW."},{"n":152,"t":"mc","visit":"Visit 2 (1 week later)","s":"Ferritin is 8 ng/mL. What is the **most important** next step?","opts":["Colonoscopy and upper endoscopy","A transfusion of two units today","Stool guaiac testing only once","Oral iron and recheck in a year"],"correctIdx":[0],"answer":"A","c":"Iron-deficiency anemia in a man or a postmenopausal woman is gastrointestinal blood loss, including colorectal or gastric cancer, until proven otherwise. Both colonoscopy and upper endoscopy are needed even if fecal occult blood testing is negative. His daily NSAID and aspirin use also raise the risk of peptic ulcer bleeding. Iron is started, but treating without finding the source is inadequate."},{"n":153,"t":"sata","visit":"Visit 2 (continued)","s":"The FNP starts oral ferrous sulfate. Which teaching points are correct? **Select all that apply.**","opts":["Taking it every other day can improve absorption","Stop it once the hemoglobin first normalizes","Vitamin C or orange juice helps absorption","Take it with milk or tea to settle the stomach","Stools may turn dark green or black"],"correctIdx":[0,2,4],"answer":"A, C, E","c":"Oral iron is best absorbed on an empty stomach with vitamin C, and alternate-day dosing can improve absorption and tolerability. Dark stools are expected and harmless (iron stools are guaiac negative). Milk, tea, coffee, calcium, antacids and PPIs reduce absorption. Treatment continues for about 3 months after the hemoglobin normalizes to replete iron stores."}]},{"no":52,"batch":3,"title":"Mrs. Novak: Tingling Feet and Unsteadiness","setting":"Primary care clinic • Older adult • Hematology / Neurology","scenario":"Mrs. Novak is a 76-year-old woman with type 2 diabetes treated with metformin for 12 years and omeprazole for 8 years. She reports numbness and tingling in both feet, unsteadiness in the dark and forgetfulness. She has reduced vibration and position sense in her toes and a positive Romberg test. Hemoglobin is 10.4 g/dL with an MCV of 108 fL.","qs":[{"n":154,"t":"mc","visit":"Visit 1","s":"Which test result would **best confirm** vitamin B12 deficiency when the serum B12 is borderline?","opts":["Elevated methylmalonic acid","Low serum ferritin level","Low reticulocyte count only","Elevated serum folate level"],"correctIdx":[0],"answer":"A","c":"When serum B12 is low-normal or borderline (about 200–300 pg/mL), an elevated methylmalonic acid confirms tissue B12 deficiency; homocysteine is also raised. In folate deficiency, homocysteine rises but methylmalonic acid is normal. Long-term metformin and PPI use, older age and atrophic gastritis all reduce B12 absorption."},{"n":155,"t":"mc","visit":"Visit 1 (continued)","s":"Which finding in Mrs. Novak is **explained by B12 deficiency but not by folate deficiency**?","opts":["Macrocytic red blood cells on the CBC","Hypersegmented neutrophils on smear","Loss of vibration and position sense","Fatigue and pale skin with exertion"],"correctIdx":[2],"answer":"C","c":"Both B12 and folate deficiency cause megaloblastic anemia with macrocytosis, hypersegmented neutrophils and fatigue. Only B12 deficiency causes neurological damage: peripheral neuropathy, dorsal column loss of vibration and position sense with a positive Romberg test, ataxia, and cognitive or mood changes, which may become irreversible if treatment is delayed."},{"n":156,"t":"mc","visit":"Visit 1 (continued)","s":"Mrs. Novak's daughter asks whether she could just take folic acid. What is the **correct** response?","opts":["Folic acid alone can let nerve damage worsen","Folic acid protects the nerves from harm","Folic acid fully treats all B12 deficiency","Folic acid is the preferred first treatment"],"correctIdx":[0],"answer":"A","c":"Giving folic acid alone in B12 deficiency can correct the anemia while the neurological damage continues to progress, masking the diagnosis. B12 must be replaced with intramuscular cyanocobalamin or high-dose oral B12 (1,000–2,000 mcg daily, effective even in pernicious anemia). Metformin can be continued with periodic B12 monitoring."}]},{"no":53,"batch":3,"title":"Mr. Ansah: Changes in His Vision","setting":"Primary care clinic • Older adult • HEENT","scenario":"Mr. Ansah is a 68-year-old Black man with asthma and hypertension who has not had an eye examination in 6 years. He says he keeps bumping into door frames on his left side and has trouble seeing at night. Visual acuity is 20/30 in both eyes. Fundoscopy shows a cup-to-disc ratio of 0.7 in both eyes. Intraocular pressure measured by the optometrist is 25 mm Hg.","qs":[{"n":157,"t":"mc","visit":"Visit 1","s":"What is the **most likely** diagnosis?","opts":["Central retinal artery occlusion","Age-related macular degeneration","Primary open-angle glaucoma","Acute angle-closure glaucoma"],"correctIdx":[2],"answer":"C","c":"Primary open-angle glaucoma causes painless, gradual loss of peripheral vision (\"tunnel vision\") with an increased cup-to-disc ratio (above 0.5 or asymmetric), often with raised intraocular pressure. It is a leading cause of irreversible blindness in Black adults. Macular degeneration causes central vision loss, and angle closure and artery occlusion are sudden and painful or abrupt."},{"n":158,"t":"mc","visit":"Visit 1 (continued)","s":"The ophthalmologist plans eye drops. Which drop should be **avoided** in Mr. Ansah?","opts":["Timolol, a beta-blocker eye drop","Dorzolamide, a carbonic anhydrase drop","Brimonidine, an alpha-2 agonist drop","Latanoprost, a prostaglandin analog"],"correctIdx":[0],"answer":"A","c":"Timolol is a non-selective beta-blocker that is absorbed systemically through the nasolacrimal duct and can cause bronchospasm, bradycardia and heart block. It should be avoided in asthma, COPD and bradycardia. Latanoprost is often first-line; it can darken the iris and lengthen eyelashes."},{"n":159,"t":"match","visit":"Visit 2 (education session)","s":"Mr. Ansah's wife asks about other eye problems in older adults. **Drag each condition to its typical presentation.** One presentation will not be used.","items":["Acute angle-closure glaucoma","Age-related macular degeneration","Retinal detachment","Cataract"],"tgts":["Painless gradual blurring with glare at night","Central vision loss and wavy lines on an Amsler grid","Flashes, floaters and a curtain over the vision","Itchy, watery eyes in both eyes each spring","Sudden severe eye pain, halos and a mid-dilated pupil"],"map":[4,1,2,0],"answer":"1–E, 2–B, 3–C, 4–A","c":"Acute angle-closure glaucoma causes sudden severe eye pain, headache, nausea, halos, a cloudy cornea and a fixed mid-dilated pupil; it is an emergency. Macular degeneration affects central vision, with distortion on the Amsler grid. Retinal detachment causes flashes, floaters and a curtain-like shadow and needs emergency referral. Cataract causes painless, gradual clouding with glare and halos at night. Seasonal itchy, watery eyes describe allergic conjunctivitis."}]},{"no":54,"batch":3,"title":"Mrs. Fletcher: \"Everyone Mumbles\"","setting":"Primary care clinic • Older adult • HEENT","scenario":"Mrs. Fletcher is a 74-year-old woman whose family says she turns the television up loud and often asks people to repeat themselves, especially in restaurants. She has trouble understanding women's and children's voices. Both ear canals are clear. The Weber test does not lateralize, and the Rinne test shows air conduction greater than bone conduction in both ears.","qs":[{"n":160,"t":"mc","visit":"Visit 1","s":"What is the **most likely** cause of Mrs. Fletcher's hearing loss?","opts":["Bilateral otitis media with effusion","Cerumen impaction blocking both ear canals","Presbycusis (age-related sensorineural loss)","Otosclerosis causing conductive hearing loss"],"correctIdx":[2],"answer":"C","c":"Presbycusis is bilateral, symmetric, high-frequency sensorineural hearing loss that makes consonants and speech in noisy settings hard to understand. With symmetric sensorineural loss, the Weber does not lateralize and Rinne remains AC > BC. Cerumen, otosclerosis and effusion are conductive causes, which make bone conduction exceed air conduction on the Rinne test."},{"n":161,"t":"mc","visit":"Visit 1 (continued)","s":"Why is it **important** to address Mrs. Fletcher's hearing loss?","opts":["It causes falls only in patients with diabetes","It is linked to isolation, depression and dementia","It is an early sign of a brain tumor","It always progresses to complete deafness"],"correctIdx":[1],"answer":"B","c":"Untreated hearing loss in older adults is associated with social isolation, depression, reduced quality of life and cognitive decline, and it is a modifiable risk factor for dementia. Referral for audiology and hearing aids (including over-the-counter hearing aids for mild to moderate loss) is recommended. Presbycusis does not usually progress to complete deafness."},{"n":162,"t":"mc","visit":"Visit 2 (1 year later)","s":"Mrs. Fletcher now reports new hearing loss and ringing in the **right ear only**, with mild unsteadiness. The Weber lateralizes to the left. What is the **best** next step?","opts":["A course of oral amoxicillin for 10 days","Reassurance that this is part of normal aging","MRI of the internal auditory canals with gadolinium","Ear irrigation to remove wax from the right ear"],"correctIdx":[2],"answer":"C","c":"Asymmetric (unilateral) sensorineural hearing loss with tinnitus raises concern for a vestibular schwannoma (acoustic neuroma). In sensorineural loss the Weber lateralizes to the better ear, here the left. Gadolinium-enhanced MRI of the internal auditory canals is the test of choice, with audiometry and ENT referral. Asymmetric loss is not a normal part of aging."}]},{"no":55,"batch":3,"title":"Mr. Mbeki: Choosing Comfort","setting":"Home visit • Frail older adult • Palliative care / Ethics","scenario":"Mr. Mbeki is an 82-year-old man with metastatic lung cancer who has decided, after discussion with his oncologist, to stop chemotherapy. He has decision-making capacity. His expected survival is a few months. He is short of breath at rest despite oxygen at 2 L/min (SpO₂ 93%) and is anxious. His son wants him to \"keep fighting\" and asks the FNP to change his father's mind.","qs":[{"n":163,"t":"mc","visit":"Visit 1","s":"How should the FNP respond to the son's request?","opts":["Ask a court to decide what treatment is best","Let the son make the decision as next of kin","Persuade Mr. Mbeki to restart chemotherapy for his son","Respect Mr. Mbeki's informed decision and support the family"],"correctIdx":[3],"answer":"D","c":"A competent adult with decision-making capacity has the right to refuse or stop treatment (autonomy), and family members cannot override that decision. The FNP should ensure the decision is informed, explore the son's fears and grief, and support the family while honoring the patient's wishes. Court involvement is not appropriate when the patient has capacity."},{"n":164,"t":"mc","visit":"Visit 1 (continued)","s":"Mr. Mbeki chooses hospice. Which medication is **first-line** for his dyspnea?","opts":["Oral prednisone 60 mg daily","Low-dose oral morphine","Increasing oxygen to 10 L/min","Intravenous furosemide daily"],"correctIdx":[1],"answer":"B","c":"Low-dose opioids, such as oral morphine, are first-line for dyspnea in advanced illness because they reduce the sensation of breathlessness. A fan blowing on the face, positioning and treating anxiety also help. Supplemental oxygen helps only when the patient is hypoxemic, and higher flows add little when saturation is adequate."},{"n":165,"t":"sata","visit":"Visit 2 (2 months later)","s":"Mr. Mbeki is now in his final days with noisy, gurgling breathing. His family is distressed. Which interventions are **appropriate**? **Select all that apply.**","opts":["Explain to the family that he is not choking","Reposition him on his side","Start IV fluids to clear the secretions","Give an anticholinergic such as glycopyrrolate","Perform deep suctioning every hour"],"correctIdx":[0,1,3],"answer":"A, B, D","c":"Terminal secretions (\"death rattle\") are common in the last days of life and usually do not distress the patient. Management includes repositioning, reducing fluids, anticholinergic drugs (glycopyrrolate, scopolamine patch, atropine drops) and reassuring the family. IV fluids increase secretions, and deep suctioning is uncomfortable and rarely helpful."}]},{"no":56,"batch":3,"title":"Mr. Silva: A Brief Loss of Vision","setting":"Urgent visit • Older adult • Neurology / Cardiovascular","scenario":"Mr. Silva is a 69-year-old man with hypertension, hyperlipidemia and a 40 pack-year smoking history. This morning he had a sudden painless loss of vision in his right eye \"like a shade coming down,\" lasting 5 minutes, and then 10 minutes of weakness and clumsiness of his left hand. All symptoms have resolved. His neurological examination is now normal. He has a bruit over the right carotid artery.","qs":[{"n":166,"t":"mc","visit":"Visit 1","s":"How should the FNP **manage** this episode?","opts":["As anxiety needing reassurance only today","As a migraine aura treated with sumatriptan","As a medical emergency needing same-day evaluation","As a benign event needing follow-up in 6 weeks"],"correctIdx":[2],"answer":"C","c":"Transient monocular blindness (amaurosis fugax) and transient hand weakness are transient ischemic attacks, most likely from carotid emboli. The risk of stroke is highest in the first 48 hours after a TIA, so all TIAs need urgent, ideally same-day, evaluation with brain imaging, carotid imaging, ECG and cardiac monitoring, labs and prompt secondary prevention."},{"n":167,"t":"mc","visit":"Visit 1 (continued)","s":"Which test **best evaluates** the most likely source of Mr. Silva's symptoms?","opts":["Lumbar puncture for CSF","Plain x-ray of the skull","Carotid duplex ultrasound","Electroencephalogram"],"correctIdx":[2],"answer":"C","c":"Amaurosis fugax and contralateral hand weakness with a carotid bruit point to atherosclerotic disease of the right internal carotid artery. Carotid duplex ultrasound (or CT or MR angiography) is the key test. Carotid endarterectomy is recommended for symptomatic stenosis of 70–99% and considered for 50–69%."},{"n":168,"t":"sata","visit":"Visit 2 (after evaluation)","s":"Mr. Silva had a high-risk TIA without hemorrhage. Which secondary prevention measures are **recommended**? **Select all that apply.**","opts":["A high-intensity statin","Warfarin for life with no other therapy","Smoking cessation support","Stopping all of his blood pressure medicines","Aspirin plus clopidogrel for 21 days, then one antiplatelet"],"correctIdx":[0,2,4],"answer":"A, C, E","c":"After a minor stroke or high-risk TIA, short-term dual antiplatelet therapy (aspirin plus clopidogrel for 21 days) followed by a single antiplatelet reduces early stroke risk. A high-intensity statin, BP control to below 130/80, diabetes control and smoking cessation are essential. Anticoagulation is used for cardioembolic sources such as atrial fibrillation, not for carotid disease."}]},{"no":57,"batch":3,"title":"Mrs. Dube: Left Lower Abdominal Pain","setting":"Urgent visit • Older adult • Gastrointestinal","scenario":"Mrs. Dube is a 66-year-old woman with 2 days of steady left lower abdominal pain, low-grade fever (38.2 °C), loss of appetite and constipation. She is tender in the left lower quadrant without rebound or guarding. WBC is 13,400/µL. She is otherwise healthy, immunocompetent and able to drink fluids. Her last colonoscopy was 9 years ago and was normal apart from diverticulosis.","qs":[{"n":169,"t":"hot","visit":"Visit 1","s":"**Click the area of the abdomen** where tenderness is most typical of Mrs. Dube's likely diagnosis.","answer":"E","c":"Diverticulitis most often involves the sigmoid colon, so it typically causes left lower quadrant pain and tenderness, often with fever, leukocytosis and a change in bowel habits, in an older adult. It is sometimes called \"left-sided appendicitis.\" Right lower quadrant pain suggests appendicitis, and RUQ pain suggests gallbladder disease.","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 400 320\" width=\"100%\" height=\"auto\"><rect width=\"400\" height=\"320\" fill=\"none\"/><path d=\"M 90 30 Q 200 10 310 30 Q 330 160 310 300 L 90 300 Q 70 160 90 30 Z\" fill=\"var(--skin)\" stroke=\"var(--diagram-ink)\" stroke-width=\"2.5\"/>\n<path d=\"M 90 70 Q 200 120 310 70\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-width=\"2\" stroke-opacity=\"0.5\"/>\n<line x1=\"200\" y1=\"40\" x2=\"200\" y2=\"296\" stroke=\"var(--diagram-ink)\" stroke-width=\"1.5\" stroke-dasharray=\"6 5\" stroke-opacity=\"0.55\"/>\n<line x1=\"84\" y1=\"170\" x2=\"316\" y2=\"170\" stroke=\"var(--diagram-ink)\" stroke-width=\"1.5\" stroke-dasharray=\"6 5\" stroke-opacity=\"0.55\"/>\n<circle cx=\"200\" cy=\"170\" r=\"6\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-width=\"2\"/>\n<path d=\"M 108 262 Q 150 285 196 296\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-width=\"2\" stroke-opacity=\"0.5\"/>\n<path d=\"M 292 262 Q 250 285 204 296\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-width=\"2\" stroke-opacity=\"0.5\"/>\n<text x=\"40\" y=\"20\" font-family=\"Arial, sans-serif\" font-size=\"12\" font-weight=\"700\" fill=\"var(--diagram-ink)\" text-anchor=\"start\">Patient's RIGHT</text><text x=\"268\" y=\"20\" font-family=\"Arial, sans-serif\" font-size=\"12\" font-weight=\"700\" fill=\"var(--diagram-ink)\" text-anchor=\"start\">Patient's LEFT</text><text x=\"206\" y=\"186\" font-family=\"Arial, sans-serif\" font-size=\"10\" font-weight=\"400\" fill=\"var(--diagram-ink)\" text-anchor=\"start\">umbilicus</text><g class=\"zone\" data-id=\"A\" tabindex=\"0\" role=\"button\" aria-label=\"Area A\">\n<circle cx=\"140\" cy=\"112\" r=\"15\" fill=\"var(--zone-fill)\" stroke=\"var(--zone-ink)\" stroke-width=\"2.5\"/>\n<text x=\"140\" y=\"117.5\" text-anchor=\"middle\" font-family=\"Georgia, 'Times New Roman', serif\" font-size=\"16\" font-weight=\"700\" fill=\"var(--zone-ink)\">A</text></g><g class=\"zone\" data-id=\"B\" tabindex=\"0\" role=\"button\" aria-label=\"Area B\">\n<circle cx=\"200\" cy=\"92\" r=\"15\" fill=\"var(--zone-fill)\" stroke=\"var(--zone-ink)\" stroke-width=\"2.5\"/>\n<text x=\"200\" y=\"97.5\" text-anchor=\"middle\" font-family=\"Georgia, 'Times New Roman', serif\" font-size=\"16\" font-weight=\"700\" fill=\"var(--zone-ink)\">B</text></g><g class=\"zone\" data-id=\"C\" tabindex=\"0\" role=\"button\" aria-label=\"Area C\">\n<circle cx=\"168\" cy=\"150\" r=\"15\" fill=\"var(--zone-fill)\" stroke=\"var(--zone-ink)\" stroke-width=\"2.5\"/>\n<text x=\"168\" y=\"155.5\" text-anchor=\"middle\" font-family=\"Georgia, 'Times New Roman', serif\" font-size=\"16\" font-weight=\"700\" fill=\"var(--zone-ink)\">C</text></g><g class=\"zone\" data-id=\"D\" tabindex=\"0\" role=\"button\" aria-label=\"Area D\">\n<circle cx=\"136\" cy=\"228\" r=\"15\" fill=\"var(--zone-fill)\" stroke=\"var(--zone-ink)\" stroke-width=\"2.5\"/>\n<text x=\"136\" y=\"233.5\" text-anchor=\"middle\" font-family=\"Georgia, 'Times New Roman', serif\" font-size=\"16\" font-weight=\"700\" fill=\"var(--zone-ink)\">D</text></g><g class=\"zone\" data-id=\"E\" tabindex=\"0\" role=\"button\" aria-label=\"Area E\">\n<circle cx=\"264\" cy=\"228\" r=\"15\" fill=\"var(--zone-fill)\" stroke=\"var(--zone-ink)\" stroke-width=\"2.5\"/>\n<text x=\"264\" y=\"233.5\" text-anchor=\"middle\" font-family=\"Georgia, 'Times New Roman', serif\" font-size=\"16\" font-weight=\"700\" fill=\"var(--zone-ink)\">E</text></g></svg>"},{"n":170,"t":"mc","visit":"Visit 1 (continued)","s":"Which imaging study is **preferred** to confirm the diagnosis and exclude complications?","opts":["CT of the abdomen and pelvis with contrast","A plain abdominal x-ray series only","Colonoscopy performed the same day","A barium enema of the colon today"],"correctIdx":[0],"answer":"A","c":"CT of the abdomen and pelvis with contrast confirms diverticulitis and identifies complications such as abscess, perforation, fistula or obstruction. Colonoscopy and barium enema are avoided during acute inflammation because of the risk of perforation. Plain films show only free air or obstruction."},{"n":171,"t":"mc","visit":"Visit 2 (8 weeks later)","s":"Mrs. Dube's uncomplicated diverticulitis resolved with outpatient care. What follow-up is **recommended**?","opts":["Colonoscopy to exclude colorectal cancer","Long-term daily antibiotics to prevent it","No further care is needed after recovery","Avoid nuts, seeds and popcorn for life"],"correctIdx":[0],"answer":"A","c":"After an episode of diverticulitis, colonoscopy is recommended about 6–8 weeks after recovery if one has not been done recently, to exclude a colorectal cancer that can mimic diverticulitis. A high-fiber diet is encouraged; nuts, seeds and popcorn do not need to be avoided. Long-term antibiotics are not recommended."}]},{"no":58,"batch":3,"title":"Mr. Yusuf: Blood Pressure That Won't Come Down","setting":"Primary care clinic • Middle adult • Cardiovascular / Endocrine","scenario":"Mr. Yusuf is a 49-year-old man whose BP remains 156/98 despite good adherence to full doses of lisinopril, amlodipine and chlorthalidone. Home readings are similar. He takes no NSAIDs, decongestants or supplements and drinks little alcohol. Serum potassium is 3.1 mEq/L before any supplement. He has no symptoms of sleep apnea.","qs":[{"n":172,"t":"mc","visit":"Visit 1","s":"Which term **best describes** Mr. Yusuf's blood pressure?","opts":["Hypertensive emergency","White-coat hypertension","Resistant hypertension","Masked hypertension"],"correctIdx":[2],"answer":"C","c":"Resistant hypertension is BP above goal despite three antihypertensives of different classes, including a diuretic, at optimal doses, or BP controlled only with four or more drugs. White-coat hypertension is high only in the office, masked hypertension is high only outside the office, and an emergency involves acute target-organ damage."},{"n":173,"t":"mc","visit":"Visit 1 (continued)","s":"Given his low potassium, which secondary cause should the FNP screen for **first**?","opts":["Coarctation of the aorta with a chest x-ray","Cushing syndrome with a random cortisol level","Pheochromocytoma with a CT of the adrenal glands","Primary aldosteronism with an aldosterone/renin ratio"],"correctIdx":[3],"answer":"D","c":"Resistant hypertension with spontaneous or easily provoked hypokalemia suggests primary aldosteronism (Conn syndrome), the most common endocrine cause of secondary hypertension. Screening uses the plasma aldosterone-to-renin ratio. Pheochromocytoma is screened with plasma metanephrines, not CT first, and Cushing with late-night salivary cortisol, 24-hour urine cortisol or dexamethasone suppression."},{"n":174,"t":"mc","visit":"Visit 2 (3 weeks later)","s":"Which medication is the **preferred fourth agent** for Mr. Yusuf's resistant hypertension?","opts":["Doxazosin, an alpha-1 adrenergic blocker","Spironolactone, an aldosterone antagonist","Clonidine, a central alpha-2 agonist","Hydralazine, a direct arterial vasodilator"],"correctIdx":[1],"answer":"B","c":"Spironolactone, a mineralocorticoid receptor antagonist, is the preferred fourth-line drug for resistant hypertension and is especially effective when aldosterone excess is present. It also corrects hypokalemia. Potassium and creatinine are monitored, and gynecomastia may occur (eplerenone is an alternative). Hydralazine, clonidine and doxazosin are later options with more side effects."}]},{"no":59,"batch":3,"title":"Mr. Kaplan: Loud Snoring and Daytime Sleepiness","setting":"Primary care clinic • Middle adult • Respiratory / Sleep","scenario":"Mr. Kaplan is a 53-year-old truck driver with a BMI of 37 and a neck circumference of 18 inches. His wife says he snores loudly and stops breathing for several seconds at night. He wakes with headaches and nearly fell asleep while driving last week. He has hypertension that is hard to control and recently diagnosed atrial fibrillation.","qs":[{"n":175,"t":"sata","visit":"Visit 1","s":"Which findings in Mr. Kaplan's history are part of the **STOP-BANG** screening tool? **Select all that apply.**","opts":["A history of migraine headaches","Frequent nighttime heartburn","Neck circumference above 16 inches","Loud snoring","Observed pauses in breathing"],"correctIdx":[2,3,4],"answer":"C, D, E","c":"STOP-BANG asks about Snoring, Tiredness, Observed apneas, high blood Pressure, BMI above 35, Age over 50, Neck circumference above 16 inches (40 cm) and male Gender. Mr. Kaplan scores very high. Obstructive sleep apnea is also linked to resistant hypertension and atrial fibrillation. Heartburn and migraine are not STOP-BANG items."},{"n":176,"t":"mc","visit":"Visit 1 (continued)","s":"Which test **confirms** obstructive sleep apnea?","opts":["Overnight pulse oximetry alone","Chest x-ray and echocardiogram","Pulmonary function testing","Polysomnography (sleep study)"],"correctIdx":[3],"answer":"D","c":"Polysomnography in a sleep laboratory, or home sleep apnea testing in uncomplicated adults with a high pretest probability, confirms obstructive sleep apnea by measuring the apnea–hypopnea index. An AHI of 5 or more with symptoms, or 15 or more regardless of symptoms, is diagnostic. Oximetry alone is not sufficient."},{"n":177,"t":"mc","visit":"Visit 2 (1 month later)","s":"Mr. Kaplan has moderate–severe OSA. What is the **most effective** first-line treatment?","opts":["A sedative hypnotic to improve his sleep","Continuous positive airway pressure (CPAP)","Drinking alcohol in the evening to relax","Sleeping in the supine position at night"],"correctIdx":[1],"answer":"B","c":"CPAP is the most effective first-line treatment for moderate to severe OSA. It reduces daytime sleepiness and drowsy-driving risk and can improve BP. Weight loss is strongly encouraged, and tirzepatide is approved for OSA with obesity. Sedatives and alcohol relax the upper airway and worsen apnea, and sleeping supine makes obstruction worse."}]},{"no":60,"batch":3,"title":"Mrs. Rahman: Bloating and Low Iron","setting":"Primary care clinic • Middle adult • Gastrointestinal","scenario":"Mrs. Rahman is a 41-year-old woman with type 1 diabetes and hypothyroidism who reports 1 year of bloating, loose greasy stools and fatigue. She has iron-deficiency anemia that has not improved with oral iron despite good adherence. She has an itchy rash of small blisters on her elbows and knees. She currently eats a normal diet that includes bread and pasta.","qs":[{"n":178,"t":"mc","visit":"Visit 1","s":"Which test is the **best initial** screen for Mrs. Rahman's most likely diagnosis?","opts":["Hydrogen breath test after lactose intake","Stool culture for bacterial pathogens","Tissue transglutaminase IgA with total IgA","Fecal calprotectin as the only test"],"correctIdx":[2],"answer":"C","c":"Celiac disease is suggested by malabsorption, iron deficiency unresponsive to oral iron, dermatitis herpetiformis and other autoimmune conditions such as type 1 diabetes and autoimmune thyroid disease. The best initial test is tissue transglutaminase IgA with a total IgA level (to detect IgA deficiency, which causes false negatives)."},{"n":179,"t":"mc","visit":"Visit 1 (continued)","s":"What instruction must Mrs. Rahman follow **before** testing?","opts":["Stop all of her diabetes medications","Keep eating gluten-containing foods","Fast for 24 hours before the test","Start a strict gluten-free diet now"],"correctIdx":[1],"answer":"B","c":"Celiac serology and the confirmatory small-bowel biopsy can become falsely negative if the patient has already reduced or stopped gluten, because the immune response and villous atrophy improve. Patients should continue eating gluten until the evaluation is complete. A gluten-free diet is started only after the diagnosis is confirmed."},{"n":180,"t":"sata","visit":"Visit 2 (after confirmation)","s":"Celiac disease is confirmed by biopsy. Which statements about her care are **correct**? **Select all that apply.**","opts":["Small amounts of wheat are fine once she feels well","A lifelong strict gluten-free diet is the treatment","Bone density assessment is appropriate","Wheat, barley and rye must be avoided","Iron should never be given to celiac patients"],"correctIdx":[1,2,3],"answer":"B, C, D","c":"Celiac disease is treated with a lifelong strict gluten-free diet that excludes wheat, barley and rye; even small amounts cause intestinal damage. Malabsorption of calcium and vitamin D causes osteoporosis, so bone density assessment is appropriate. Iron and other deficiencies are corrected, and absorption improves as the intestine heals. Dietitian referral is recommended."}]},{"no":61,"batch":3,"title":"Mrs. Ortega: A Stiff, Painful Shoulder","setting":"Primary care clinic • Middle adult • Musculoskeletal","scenario":"Mrs. Ortega is a 54-year-old woman with type 2 diabetes who has had gradually increasing pain in her left shoulder for 4 months, now with marked stiffness. She cannot reach behind her back or comb her hair. On examination both active and passive range of motion are severely limited in all directions, especially external rotation. Strength is normal within the available range. X-rays are normal.","qs":[{"n":181,"t":"mc","visit":"Visit 1","s":"What is the **most likely** diagnosis?","opts":["Full-thickness rotator cuff tear","Acute anterior shoulder dislocation","Lateral epicondylitis of the elbow","Adhesive capsulitis (frozen shoulder)"],"correctIdx":[3],"answer":"D","c":"Adhesive capsulitis causes progressive pain followed by loss of both active and passive range of motion, especially external rotation, with normal x-rays. It is more common in women 40–60 and in people with diabetes or hypothyroidism. A rotator cuff tear limits active but not passive motion and causes weakness."},{"n":182,"t":"match","visit":"Visit 1 (continued)","s":"The FNP reviews shoulder and upper-limb examination tests with a student. **Drag each test to the condition it suggests when positive.** One condition will not be used.","items":["Drop-arm test","Neer and Hawkins tests","Empty-can (Jobe) test","Finkelstein test"],"tgts":["Supraspinatus pathology","Rotator cuff tear","De Quervain tenosynovitis","Carpal tunnel syndrome","Subacromial impingement"],"map":[1,4,0,2],"answer":"1–B, 2–E, 3–A, 4–C","c":"A positive drop-arm test (the arm cannot be lowered slowly from 90° of abduction) suggests a rotator cuff tear. Pain with the Neer (passive forward flexion) and Hawkins (internal rotation) tests indicates subacromial impingement. Weakness or pain with the empty-can test suggests supraspinatus pathology. Pain over the radial styloid with the Finkelstein maneuver indicates de Quervain tenosynovitis. Carpal tunnel syndrome is assessed with the Phalen and Tinel tests."},{"n":183,"t":"mc","visit":"Visit 1 (continued)","s":"What is the **most appropriate** management for Mrs. Ortega?","opts":["Strict rest with no shoulder movement at all","Immediate surgical repair of the rotator cuff","Physical therapy and NSAIDs, possibly a steroid injection","Immobilize the shoulder in a sling for 6 weeks"],"correctIdx":[2],"answer":"C","c":"Adhesive capsulitis is managed with physical therapy focused on range of motion, NSAIDs for pain and, if needed, an intra-articular corticosteroid injection. It usually resolves over 1–3 years. Immobilization worsens stiffness, and surgery or manipulation is reserved for refractory cases. Good glucose control is also encouraged."}]},{"no":62,"batch":3,"title":"Mr. Andersen: Problems With Erections","setting":"Primary care clinic • Middle adult • Men's health / Cardiovascular","scenario":"Mr. Andersen is a 57-year-old man with 1 year of difficulty maintaining erections. He has hypertension, type 2 diabetes, hyperlipidemia and smokes. He takes metformin, atorvastatin and amlodipine, and he occasionally uses sublingual nitroglycerin for chest discomfort when he mows the lawn. He has normal libido and morning erections are less frequent.","qs":[{"n":184,"t":"mc","visit":"Visit 1","s":"Why should Mr. Andersen's erectile dysfunction prompt a **cardiovascular** evaluation?","opts":["ED is a side effect of metformin therapy","ED never relates to heart disease risk","ED is always caused by low testosterone","ED is often an early sign of vascular disease"],"correctIdx":[3],"answer":"D","c":"Erectile dysfunction often reflects endothelial dysfunction and may precede coronary artery disease by several years. Mr. Andersen has multiple vascular risk factors and exertional chest discomfort, so his cardiovascular risk and possible angina need evaluation. Risk-factor control, smoking cessation and exercise can also improve erectile function."},{"n":185,"t":"mc","visit":"Visit 1 (continued)","s":"Mr. Andersen asks for sildenafil. What is the **most important** safety issue?","opts":["Sildenafil interacts with metformin and causes lows","Sildenafil must be taken with a high-fat meal","Sildenafil is unsafe for anyone with diabetes","PDE-5 inhibitors must never be combined with nitrates"],"correctIdx":[3],"answer":"D","c":"PDE-5 inhibitors (sildenafil, tadalafil, vardenafil, avanafil) combined with any nitrate, including sublingual nitroglycerin or recreational amyl nitrite, can cause severe, life-threatening hypotension. Because he uses nitroglycerin, a PDE-5 inhibitor is contraindicated, and his chest discomfort needs cardiac evaluation. Sildenafil is best absorbed on an empty stomach."},{"n":186,"t":"sata","visit":"Visit 2 (2 months later)","s":"Two morning total testosterone levels are low and Mr. Andersen has symptoms of hypogonadism. If testosterone therapy is started, what should be **monitored**? **Select all that apply.**","opts":["Thyroid antibodies","Hematocrit","Serum amylase","Blood pressure and lipids","PSA and prostate symptoms"],"correctIdx":[1,3,4],"answer":"B, D, E","c":"Testosterone therapy can raise the hematocrit (therapy is held if it exceeds about 54%), may affect the prostate, and can influence BP and lipids, so these are monitored. It is contraindicated in prostate or breast cancer, untreated severe OSA and uncontrolled heart failure, and in men who want to father children because it suppresses sperm production. Gels can transfer to women and children."}]},{"no":63,"batch":3,"title":"Ms. Goldberg: A Lump in the Breast","setting":"Primary care clinic • Middle adult • Women's health / Oncology","scenario":"Ms. Goldberg is a 45-year-old Ashkenazi Jewish woman who found a lump in her left breast. It is 2 cm, hard, irregular, non-tender and fixed, in the upper outer quadrant, with slight skin dimpling. Her mother had breast cancer at 42 and her maternal aunt had ovarian cancer. Her last screening mammogram 2 years ago was normal.","qs":[{"n":187,"t":"mc","visit":"Visit 1","s":"What is the **most appropriate** imaging for Ms. Goldberg's breast mass?","opts":["A routine screening mammogram next year","Breast ultrasound alone because she is young","Diagnostic mammogram plus breast ultrasound","Breast MRI as the only imaging study"],"correctIdx":[2],"answer":"C","c":"For a palpable breast mass in a woman 30 or older, the first imaging is a diagnostic mammogram plus targeted ultrasound. Ultrasound alone is the first test for women under 30. A suspicious mass (hard, irregular, fixed, skin dimpling) needs tissue diagnosis by core needle biopsy even if imaging is negative."},{"n":188,"t":"mc","visit":"Visit 1 (continued)","s":"Imaging shows a suspicious mass. What is the **next** step?","opts":["Image-guided core needle biopsy","Warm compresses and evening primrose oil","Reassurance because it is non-tender","Repeat the imaging in 6 months"],"correctIdx":[0],"answer":"A","c":"A suspicious breast mass requires tissue diagnosis, usually by image-guided core needle biopsy, which provides histology and receptor status. Short-interval follow-up is only for probably benign findings. Painless, hard, fixed masses are more worrisome than tender, mobile ones."},{"n":189,"t":"sata","visit":"Visit 1 (continued)","s":"Which features of Ms. Goldberg's history suggest a possible **hereditary BRCA** mutation and warrant genetic counseling? **Select all that apply.**","opts":["Having her first period at age 13","Ashkenazi Jewish ancestry","A relative with ovarian cancer","A normal mammogram 2 years ago","A mother with breast cancer before 50"],"correctIdx":[1,2,4],"answer":"B, C, E","c":"Ashkenazi Jewish ancestry, breast cancer diagnosed before 50 in a close relative, and a family history of ovarian cancer are features that raise the likelihood of a BRCA1/2 mutation. The USPSTF recommends using a familial risk tool and referring for genetic counseling and possible testing when such features are present. A prior normal mammogram and menarche at 13 do not suggest a hereditary syndrome."}]},{"no":64,"batch":3,"title":"Mr. Popescu: Chest Pressure in the Waiting Room","setting":"Primary care clinic (office emergency) • Middle adult • Cardiovascular","scenario":"Mr. Popescu is a 59-year-old man with diabetes and hyperlipidemia who develops crushing substernal chest pressure radiating to his left jaw while waiting for a routine visit. He is sweating and nauseated. BP is 146/88, HR 98, SpO₂ 95%. He is not allergic to aspirin and has not taken any erectile dysfunction medicine.","qs":[{"n":190,"t":"ord","visit":"Visit 1","s":"The FNP suspects acute coronary syndrome. **Place the immediate office actions in priority order.**","items":["Step 1","Step 2","Step 3","Step 4"],"tgts":["Obtain a 12-lead ECG","Give 162–325 mg of non-enteric-coated aspirin to chew","Give sublingual nitroglycerin, as BP is above 90 systolic","Call 911 to activate emergency medical services"],"map":[3,1,0,2],"answer":"D, B, A, C","c":"For suspected ACS in the office, EMS is activated immediately because definitive reperfusion is time-critical. Chewed non-enteric-coated aspirin is given next because it reduces mortality and acts quickly. A 12-lead ECG should be obtained within 10 minutes to identify STEMI. Sublingual nitroglycerin is given for ongoing pain if systolic BP is above 90, there is no right ventricular infarction and no recent PDE-5 inhibitor use. Oxygen is given only if SpO₂ is below 90%."},{"n":191,"t":"mc","visit":"Visit 1 (continued)","s":"The ECG shows ST elevation in leads II, III and aVF. Which coronary artery is **most likely** involved?","opts":["Right coronary artery (RCA)","Left main coronary artery","Left anterior descending artery","Left circumflex artery"],"correctIdx":[0],"answer":"A","c":"ST elevation in the inferior leads (II, III and aVF) indicates an inferior myocardial infarction, most often from occlusion of the right coronary artery. Anterior leads V1–V4 reflect the left anterior descending artery, and lateral leads I, aVL, V5 and V6 reflect the circumflex. Inferior MIs may involve the right ventricle, which makes patients sensitive to nitrates."},{"n":192,"t":"sata","visit":"Visit 2 (after hospital discharge)","s":"Mr. Popescu had a stent placed. Which therapies are part of his **secondary prevention**? **Select all that apply.**","opts":["A beta-blocker and an ACE inhibitor","Cardiac rehabilitation referral","Aspirin plus a P2Y12 inhibitor for 12 months","Stopping his statin once his LDL is normal","A high-intensity statin"],"correctIdx":[0,1,2,4],"answer":"A, B, C, E","c":"Post-MI care follows ABCDE: Aspirin and ACE inhibitor (with a P2Y12 inhibitor such as clopidogrel or ticagrelor for about 12 months after ACS or stenting), Beta-blocker and BP control, Cholesterol (high-intensity statin, continued indefinitely) and cigarette cessation, Diet and diabetes control, and Exercise through cardiac rehabilitation with education. Statins are not stopped when LDL improves."}]},{"no":65,"batch":3,"title":"Ms. Ade: Missed Pills","setting":"Phone and clinic visit • Young adult • Women's health","scenario":"Ms. Ade is a 22-year-old woman taking a combined oral contraceptive. She calls on Thursday morning: she forgot her pills on Tuesday and Wednesday of the second week of her pack (it has now been more than 48 hours since her last pill). She had unprotected intercourse on Wednesday night. She is otherwise healthy.","qs":[{"n":193,"t":"mc","visit":"Phone call","s":"What is the **correct** missed-pill advice for Ms. Ade?","opts":["Take no more pills until her next period starts","Take all the missed pills at once and need no backup","Start a brand-new pack today and skip this one","Take the most recent missed pill now and use backup for 7 days"],"correctIdx":[3],"answer":"D","c":"When two or more combined pills are missed (48 hours or more late), CDC guidance is to take the most recent missed pill as soon as possible, continue the remaining pills at the usual time (even if that means two pills in one day), and use condoms or abstain until 7 consecutive hormonal pills have been taken. If the missed pills were in the last hormonal week, the hormone-free interval is skipped."},{"n":194,"t":"mc","visit":"Phone call (continued)","s":"Ms. Ade had unprotected sex 12 hours ago. Which emergency contraception option is **most effective**?","opts":["Levonorgestrel 1.5 mg taken within 3 days","Taking two extra combined pills tonight","Ulipristal acetate taken within 5 days","A copper IUD inserted within 5 days"],"correctIdx":[3],"answer":"D","c":"The copper IUD is the most effective form of emergency contraception when inserted within 5 days of unprotected intercourse, and it also provides ongoing contraception. Ulipristal is more effective than levonorgestrel, especially later in the 5-day window and in people with a BMI of 30 or more. Doubling combined pills is not a recommended emergency contraceptive method."},{"n":195,"t":"mc","visit":"Visit 1 (1 month later)","s":"Ms. Ade chooses DMPA injections. What should the FNP tell her about **fertility** after stopping DMPA?","opts":["Fertility returns within 48 hours of the last shot","Return of fertility may be delayed for up to 18 months","She must have a pregnancy test before every meal","DMPA causes permanent infertility in most women"],"correctIdx":[1],"answer":"B","c":"After the last DMPA injection, return to fertility can be delayed, typically 10 months on average and sometimes up to 18 months, so it is less suitable for someone planning pregnancy soon. DMPA does not cause permanent infertility. It is given every 13 weeks (up to 15), often causes amenorrhea and weight gain, and carries a boxed warning about reversible bone density loss."}]},{"no":66,"batch":3,"title":"Ms. Tran: Burning and Frequency","setting":"Primary care clinic • Young adult • Genitourinary","scenario":"Ms. Tran is a 25-year-old sexually active woman with 2 days of dysuria, urinary frequency, urgency and suprapubic discomfort. She has no fever, flank pain, vaginal discharge or nausea, and she is not pregnant. Urine dipstick shows leukocyte esterase and nitrites. She has normal kidney function and no drug allergies. Local E. coli resistance to TMP-SMX is 25%.","qs":[{"n":196,"t":"mc","visit":"Visit 1","s":"Which regimen is **most appropriate** for Ms. Tran?","opts":["Amoxicillin 500 mg three times daily for 10 days","TMP-SMX double strength twice daily for 3 days","Nitrofurantoin 100 mg twice daily for 5 days","Ciprofloxacin 500 mg twice daily for 14 days"],"correctIdx":[2],"answer":"C","c":"Acute uncomplicated cystitis in a healthy, non-pregnant woman is treated first-line with nitrofurantoin for 5 days, fosfomycin as a single dose, or TMP-SMX for 3 days when local resistance is below 20%. With 25% resistance, TMP-SMX should be avoided. Fluoroquinolones are reserved for other infections because of adverse effects, and amoxicillin has high E. coli resistance."},{"n":197,"t":"sata","visit":"Visit 1 (continued)","s":"Which symptoms should prompt Ms. Tran to return because they suggest **pyelonephritis**? **Select all that apply.**","opts":["Flank pain","Mild burning on the first day of treatment","Nausea and vomiting","Orange urine from phenazopyridine","Fever and chills"],"correctIdx":[0,2,4],"answer":"A, C, E","c":"Fever, chills, flank pain, costovertebral angle tenderness, nausea and vomiting suggest upper urinary tract infection (pyelonephritis), which needs a urine culture and a longer course of an agent with tissue penetration such as a fluoroquinolone. Nitrofurantoin does not reach adequate kidney tissue levels. Mild early burning is expected, and phenazopyridine turns urine orange."},{"n":198,"t":"sata","visit":"Visit 2 (6 months later)","s":"Ms. Tran has had three cystitis episodes in a year. Which preventive measures can the FNP **recommend**? **Select all that apply.**","opts":["Post-coital or continuous antibiotic prophylaxis if needed","Increase daily water intake","Daily long-term ciprofloxacin as first choice","Avoid spermicide-containing contraceptives","Urinate soon after intercourse"],"correctIdx":[0,1,3,4],"answer":"A, B, D, E","c":"Recurrent UTI (two or more in 6 months or three or more in 12 months) can be reduced by increasing fluids, voiding after intercourse and avoiding spermicides, which alter vaginal flora. Post-coital or continuous low-dose prophylaxis with nitrofurantoin, TMP-SMX or cephalexin is an option. Fluoroquinolones are not preferred for prophylaxis. Vaginal estrogen helps postmenopausal women."}]},{"no":67,"batch":3,"title":"Ms. Moyo: Vaginal Discharge","setting":"Primary care clinic • Young adult • Women's health / Sexual health","scenario":"Ms. Moyo is a 28-year-old woman with 1 week of increased vaginal discharge and vulvar irritation. She has a new male partner. On examination there is a frothy yellow-green malodorous discharge and punctate hemorrhages on the cervix. Vaginal pH is 6.0. Motile flagellated organisms are seen on wet mount.","qs":[{"n":199,"t":"mc","visit":"Visit 1","s":"What is the **most likely** diagnosis?","opts":["Atrophic vaginitis (estrogen loss)","Trichomoniasis (Trichomonas vaginalis)","Bacterial vaginosis (Gardnerella)","Vulvovaginal candidiasis (Candida)"],"correctIdx":[1],"answer":"B","c":"Trichomoniasis, caused by the protozoan Trichomonas vaginalis, causes a frothy yellow-green malodorous discharge, vulvar irritation, a \"strawberry cervix\" (punctate hemorrhages) and pH above 4.5, with motile trichomonads on wet mount. NAAT is the most sensitive test. It is sexually transmitted."},{"n":200,"t":"mc","visit":"Visit 1 (continued)","s":"What is the **recommended** treatment plan?","opts":["Metronidazole 500 mg twice daily for 7 days and treat her partner","A single dose of fluconazole 150 mg orally for her alone","No treatment because it resolves without therapy","Clindamycin cream nightly for 7 days for her alone"],"correctIdx":[0],"answer":"A","c":"CDC recommends metronidazole 500 mg twice daily for 7 days for women with trichomoniasis (a single 2-g dose for men). Sex partners must be treated, and both should abstain until treatment is complete and symptoms resolve. Women are retested within 3 months because reinfection is common, and testing for other STIs is recommended."},{"n":201,"t":"match","visit":"Visit 2 (teaching)","s":"The FNP reviews vaginal discharge with a student. **Drag each condition to its characteristic finding.** One finding will not be used.","items":["Bacterial vaginosis","Vulvovaginal candidiasis","Atrophic vaginitis"],"tgts":["Thick white curd-like discharge with normal pH","Thin dry mucosa and parabasal cells after menopause","Painless chancre on the labia","Clue cells, fishy odor and pH above 4.5"],"map":[3,0,1],"answer":"1–D, 2–A, 3–B","c":"Bacterial vaginosis has a thin gray discharge with a fishy odor, pH above 4.5, a positive whiff test and clue cells, and partners do not need treatment. Candidiasis causes intense itching and a thick white \"cottage cheese\" discharge with a normal pH (4.5 or less) and hyphae on KOH. Atrophic vaginitis follows estrogen loss and shows thin mucosa and parabasal cells; it is treated with vaginal estrogen. A painless chancre is primary syphilis."}]},{"no":68,"batch":3,"title":"Mr. Gupta: A Positive Skin Test","setting":"Occupational health visit • Young adult • Infectious disease / Respiratory","scenario":"Mr. Gupta is a 29-year-old nurse who moved from India 3 years ago and received BCG vaccine as a child. A two-step tuberculin skin test for his new job shows 13 mm of induration. He has no cough, fever, night sweats or weight loss, and he is HIV-negative. His chest x-ray is normal.","qs":[{"n":202,"t":"mc","visit":"Visit 1","s":"Which test is **preferred** to confirm TB infection in a person who received BCG?","opts":["A CT scan of the chest with contrast","An interferon-gamma release assay (IGRA)","A sputum culture for acid-fast bacilli","A repeat TST with a larger dose"],"correctIdx":[1],"answer":"B","c":"Interferon-gamma release assays (QuantiFERON, T-SPOT) are preferred in people who received BCG vaccine because, unlike the TST, they are not affected by BCG. They also need only one visit. For a health-care worker, a TST of 10 mm or more is positive. Sputum testing is for suspected active TB."},{"n":203,"t":"mc","visit":"Visit 2 (1 week later)","s":"The IGRA is positive and he has no symptoms with a normal chest x-ray. What is the **diagnosis and plan**?","opts":["Active TB; place him in airborne isolation","Latent TB infection; offer a short preventive regimen","A false-positive test; no treatment is needed","Active TB; start four-drug RIPE therapy today"],"correctIdx":[1],"answer":"B","c":"A positive IGRA with no symptoms and a normal chest x-ray means latent TB infection, which is not contagious. Treatment prevents progression to active disease. Preferred regimens are 3 months of weekly isoniazid plus rifapentine (3HP), 4 months of daily rifampin, or 3 months of isoniazid plus rifampin. RIPE therapy and isolation are for active TB."},{"n":204,"t":"hot","visit":"Visit 2 (teaching)","s":"Mr. Gupta asks where TB usually appears if it reactivates. **Click the area of the lung where reactivation (post-primary) TB most typically causes cavitary lesions.**","answer":"A","c":"Reactivation (post-primary) tuberculosis characteristically affects the apical and posterior segments of the upper lobes, where high oxygen tension favors the organism, producing cavitary lesions. Symptoms include cough for more than 2–3 weeks, hemoptysis, night sweats, fever and weight loss. Primary TB more often affects the middle or lower lobes with hilar lymphadenopathy.","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 400 320\" width=\"100%\" height=\"auto\"><rect width=\"400\" height=\"320\" fill=\"none\"/><path d=\"M 120 40 Q 200 20 280 40 L 330 70 Q 352 160 330 300 L 70 300 Q 48 160 70 70 Z\" fill=\"var(--skin)\" stroke=\"var(--diagram-ink)\" stroke-width=\"2.5\"/>\n<path d=\"M 172 40 Q 200 58 228 40\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-width=\"2\"/>\n<path d=\"M 196 62 Q 150 64 86 74\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-width=\"5\" stroke-linecap=\"round\"/>\n<path d=\"M 204 62 Q 250 64 314 74\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-width=\"5\" stroke-linecap=\"round\"/>\n<rect x=\"186\" y=\"66\" width=\"28\" height=\"170\" rx=\"10\" fill=\"var(--diagram-ink)\" fill-opacity=\"0.14\" stroke=\"var(--diagram-ink)\" stroke-width=\"2\"/>\n<path d=\"M 184 96 Q 120 102 86 126\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-opacity=\"0.35\" stroke-width=\"2\"/><path d=\"M 216 96 Q 280 102 314 126\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-opacity=\"0.35\" stroke-width=\"2\"/><path d=\"M 184 122 Q 120 128 90 152\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-opacity=\"0.35\" stroke-width=\"2\"/><path d=\"M 216 122 Q 280 128 310 152\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-opacity=\"0.35\" stroke-width=\"2\"/><path d=\"M 184 148 Q 120 154 94 178\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-opacity=\"0.35\" stroke-width=\"2\"/><path d=\"M 216 148 Q 280 154 306 178\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-opacity=\"0.35\" stroke-width=\"2\"/><path d=\"M 184 174 Q 120 180 98 204\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-opacity=\"0.35\" stroke-width=\"2\"/><path d=\"M 216 174 Q 280 180 302 204\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-opacity=\"0.35\" stroke-width=\"2\"/><path d=\"M 184 200 Q 120 206 102 230\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-opacity=\"0.35\" stroke-width=\"2\"/><path d=\"M 216 200 Q 280 206 298 230\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-opacity=\"0.35\" stroke-width=\"2\"/><path d=\"M 184 226 Q 120 232 106 256\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-opacity=\"0.35\" stroke-width=\"2\"/><path d=\"M 216 226 Q 280 232 294 256\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-opacity=\"0.35\" stroke-width=\"2\"/>\n<line x1=\"288\" y1=\"70\" x2=\"288\" y2=\"290\" stroke=\"var(--diagram-ink)\" stroke-width=\"1.5\" stroke-dasharray=\"5 5\" stroke-opacity=\"0.6\"/>\n<text x=\"292\" y=\"286\" font-family=\"Arial, sans-serif\" font-size=\"11\" font-weight=\"400\" fill=\"var(--diagram-ink)\" text-anchor=\"start\">MCL</text><text x=\"40\" y=\"20\" font-family=\"Arial, sans-serif\" font-size=\"12\" font-weight=\"700\" fill=\"var(--diagram-ink)\" text-anchor=\"start\">Patient's RIGHT</text><text x=\"268\" y=\"20\" font-family=\"Arial, sans-serif\" font-size=\"12\" font-weight=\"700\" fill=\"var(--diagram-ink)\" text-anchor=\"start\">Patient's LEFT</text><g class=\"zone\" data-id=\"A\" tabindex=\"0\" role=\"button\" aria-label=\"Area A\">\n<circle cx=\"120\" cy=\"112\" r=\"15\" fill=\"var(--zone-fill)\" stroke=\"var(--zone-ink)\" stroke-width=\"2.5\"/>\n<text x=\"120\" y=\"117.5\" text-anchor=\"middle\" font-family=\"Georgia, 'Times New Roman', serif\" font-size=\"16\" font-weight=\"700\" fill=\"var(--zone-ink)\">A</text></g><g class=\"zone\" data-id=\"B\" tabindex=\"0\" role=\"button\" aria-label=\"Area B\">\n<circle cx=\"120\" cy=\"190\" r=\"15\" fill=\"var(--zone-fill)\" stroke=\"var(--zone-ink)\" stroke-width=\"2.5\"/>\n<text x=\"120\" y=\"195.5\" text-anchor=\"middle\" font-family=\"Georgia, 'Times New Roman', serif\" font-size=\"16\" font-weight=\"700\" fill=\"var(--zone-ink)\">B</text></g><g class=\"zone\" data-id=\"C\" tabindex=\"0\" role=\"button\" aria-label=\"Area C\">\n<circle cx=\"100\" cy=\"260\" r=\"15\" fill=\"var(--zone-fill)\" stroke=\"var(--zone-ink)\" stroke-width=\"2.5\"/>\n<text x=\"100\" y=\"265.5\" text-anchor=\"middle\" font-family=\"Georgia, 'Times New Roman', serif\" font-size=\"16\" font-weight=\"700\" fill=\"var(--zone-ink)\">C</text></g><g class=\"zone\" data-id=\"D\" tabindex=\"0\" role=\"button\" aria-label=\"Area D\">\n<circle cx=\"300\" cy=\"260\" r=\"15\" fill=\"var(--zone-fill)\" stroke=\"var(--zone-ink)\" stroke-width=\"2.5\"/>\n<text x=\"300\" y=\"265.5\" text-anchor=\"middle\" font-family=\"Georgia, 'Times New Roman', serif\" font-size=\"16\" font-weight=\"700\" fill=\"var(--zone-ink)\">D</text></g><g class=\"zone\" data-id=\"E\" tabindex=\"0\" role=\"button\" aria-label=\"Area E\">\n<circle cx=\"288\" cy=\"222\" r=\"15\" fill=\"var(--zone-fill)\" stroke=\"var(--zone-ink)\" stroke-width=\"2.5\"/>\n<text x=\"288\" y=\"227.5\" text-anchor=\"middle\" font-family=\"Georgia, 'Times New Roman', serif\" font-size=\"16\" font-weight=\"700\" fill=\"var(--zone-ink)\">E</text></g></svg>"}]},{"no":69,"batch":3,"title":"Ms. Kariuki: A Blow to the Head","setting":"Primary care clinic • Young adult • Neurology / Sports medicine","scenario":"Ms. Kariuki is a 20-year-old college soccer player who collided heads with an opponent yesterday. She did not lose consciousness but felt dazed, had a headache and was confused for about 10 minutes. Today she has a mild headache, mild dizziness and trouble concentrating. Her neurological examination is normal. She takes no anticoagulants.","qs":[{"n":205,"t":"sata","visit":"Visit 1","s":"Which findings would require **immediate** emergency evaluation and imaging? **Select all that apply.**","opts":["Repeated vomiting","Worsening headache with increasing drowsiness","A brief dazed feeling at the time of injury","A seizure","Mild difficulty concentrating"],"correctIdx":[0,1,3],"answer":"A, B, D","c":"Red flags after head injury include worsening headache, repeated vomiting, seizure, increasing confusion or drowsiness, unequal pupils, focal weakness or numbness, slurred speech, a lucid interval followed by decline (epidural hematoma), CSF leak, and Battle sign or raccoon eyes. Mild concentration problems and a brief dazed feeling are typical concussion symptoms."},{"n":206,"t":"ord","visit":"Visit 1 (continued)","s":"Ms. Kariuki wants to return to soccer. **Place the steps of a graduated return-to-play protocol in order.** Each step lasts at least 24 hours without symptoms.","items":["Step 1","Step 2","Step 3","Step 4","Step 5","Step 6"],"tgts":["Relative rest and light daily activities","Full-contact practice after medical clearance","Return to competitive games","Non-contact training drills with more intensity","Light aerobic exercise such as walking or a stationary bike","Sport-specific drills without head impact"],"map":[0,4,5,3,1,2],"answer":"A, E, F, D, B, C","c":"After an initial 24–48 hours of relative rest, a concussed athlete progresses through light aerobic exercise, sport-specific exercise, non-contact training drills, full-contact practice after written medical clearance, and then return to competition. Each step takes at least 24 hours, and if symptoms recur the athlete drops back to the previous step. Same-day return to play is never allowed."},{"n":207,"t":"mc","visit":"Visit 1 (continued)","s":"Why is returning to play **before** full recovery dangerous?","opts":["It always causes a skull fracture at once","It speeds up recovery from the first injury","There is no added risk if she wears a helmet","A second impact can cause fatal brain swelling"],"correctIdx":[3],"answer":"D","c":"Second impact syndrome is rapid, potentially fatal brain swelling that can occur if a second concussion happens before the brain has recovered from the first. Young athletes are most at risk. Athletes must be symptom-free and medically cleared before return, and \"return to learn\" (school accommodations) usually precedes full return to sport."}]},{"no":70,"batch":3,"title":"Mr. Okafor-Grant: A Rash on the Palms","setting":"Primary care clinic • Young adult • Sexual health / Dermatology","scenario":"Mr. Okafor-Grant is a 26-year-old man who has sex with men. He has a non-itchy rash of copper-colored macules and papules on his trunk, palms and soles, with fever, sore throat and swollen lymph nodes. Two months ago he had a painless sore on his penis that healed by itself. RPR is reactive at 1:64 and a treponemal test is positive. He has no penicillin allergy.","qs":[{"n":208,"t":"mc","visit":"Visit 1","s":"What is the **most likely** stage of infection?","opts":["Primary syphilis","Secondary syphilis","Tertiary syphilis","Late latent syphilis"],"correctIdx":[1],"answer":"B","c":"Secondary syphilis appears weeks to months after the painless primary chancre, with a diffuse rash that typically involves the palms and soles, fever, generalized lymphadenopathy, mucous patches and condylomata lata. Primary syphilis is the chancre itself, latent syphilis has no symptoms, and tertiary disease causes gummas, cardiovascular or neurological disease years later."},{"n":209,"t":"mc","visit":"Visit 1 (continued)","s":"Which treatment is **recommended**?","opts":["Azithromycin 1 g orally as a single dose","Benzathine penicillin G 2.4 million units IM once","Ceftriaxone 500 mg IM as a single dose","Doxycycline 100 mg twice daily for 7 days only"],"correctIdx":[1],"answer":"B","c":"Primary, secondary and early latent syphilis are treated with a single IM dose of benzathine penicillin G 2.4 million units. Late latent syphilis needs three weekly doses, and neurosyphilis needs IV aqueous penicillin. Doxycycline for 14 days is an alternative only for non-pregnant patients with penicillin allergy. Azithromycin resistance makes it unsuitable."},{"n":210,"t":"sata","visit":"Visit 1 (continued)","s":"Which statements about his treatment and follow-up are **correct**? **Select all that apply.**","opts":["Partners need no evaluation or testing","A fourfold drop in RPR titer shows response","Fever and aches within 24 hours may be a Jarisch–Herxheimer reaction","The treponemal test should become negative","Repeat RPR titers at 6 and 12 months"],"correctIdx":[1,2,4],"answer":"B, C, E","c":"The Jarisch–Herxheimer reaction (fever, headache, myalgia within 24 hours of treatment, common in secondary syphilis) is managed supportively and is not an allergy. Response is followed with non-treponemal titers (RPR or VDRL) at 6 and 12 months; a fourfold (two-dilution) decline indicates adequate response. Treponemal tests usually stay positive for life. Partners must be evaluated, and HIV testing and PrEP should be offered."}]},{"no":71,"batch":3,"title":"Maya: Thoughts of Not Being Here","setting":"Primary care clinic • Adolescent • Mental health / Safety","scenario":"Maya is a 16-year-old girl at a well visit whose PHQ-A score is 19. When seen alone, she says she has felt hopeless for 2 months since her parents' divorce and sometimes thinks everyone would be better off without her. She has thought about taking pills but has no specific plan, no intent and no prior attempts. Her father keeps a handgun at home. She says she would talk to her aunt if things got worse.","qs":[{"n":211,"t":"mc","visit":"Visit 1","s":"What is the **most appropriate** immediate action?","opts":["Schedule a routine follow-up visit in 3 months","Promise Maya that you will keep this secret","Complete a safety plan with Maya and involve a parent","Prescribe medicine and end the visit right away"],"correctIdx":[2],"answer":"C","c":"Maya has suicidal ideation without a plan or intent, which places her at moderate risk. The FNP should complete a collaborative safety plan (warning signs, coping strategies, people and places for support, crisis lines such as 988, and making the environment safe), arrange urgent mental health follow-up and involve a parent, since confidentiality does not cover risk of serious self-harm. A promise of secrecy would be unsafe."},{"n":212,"t":"mc","visit":"Visit 1 (continued)","s":"Which counseling point is **most important** for Maya's parents?","opts":["Remove or lock up the firearm and medicines","Check on her only at bedtime each night","Take away her phone for the next month","Avoid talking about suicide with her at all"],"correctIdx":[0],"answer":"A","c":"Lethal-means counseling is one of the most effective suicide-prevention steps. Firearms are the most common method of suicide in the U.S., and access to a firearm greatly increases the risk of death. Parents should remove firearms from the home or store them locked and unloaded with ammunition separate, and lock up medications. Asking directly about suicide does not increase risk."},{"n":213,"t":"sata","visit":"Visit 2 (1 week later)","s":"Maya starts fluoxetine with therapy. Which statements are **correct**? **Select all that apply.**","opts":["She needs close follow-up in the first weeks of treatment","Benefit is expected within the first 2 days","CBT alone is never useful for teenagers","Antidepressants carry a boxed warning for suicidality under 25","Fluoxetine is FDA approved for adolescent depression"],"correctIdx":[0,3,4],"answer":"A, D, E","c":"Fluoxetine (age 8 and older) and escitalopram (12 and older) are FDA approved for adolescent depression and work best with cognitive behavioral or interpersonal therapy. All antidepressants carry a boxed warning for increased suicidal thoughts and behavior in people under 25, especially early in treatment and after dose changes, so close follow-up is essential. Full benefit takes several weeks."}]},{"no":72,"batch":3,"title":"Jordan: Sudden Scrotal Pain","setting":"Urgent phone call and visit • Adolescent • Genitourinary","scenario":"Jordan is a 14-year-old boy who woke 2 hours ago with sudden, severe pain in his left testicle and vomited twice. He denies trauma and sexual activity. The left testis is high-riding with a horizontal lie, swollen and exquisitely tender. The cremasteric reflex is absent on the left, and lifting the testis does not relieve the pain.","qs":[{"n":214,"t":"mc","visit":"Visit 1","s":"What is the **most likely** diagnosis?","opts":["Testicular (spermatic cord) torsion","A communicating hydrocele in the scrotum","Acute bacterial epididymitis","Torsion of the appendix testis"],"correctIdx":[0],"answer":"A","c":"Testicular torsion causes sudden, severe unilateral scrotal pain with nausea and vomiting in adolescents, a high-riding testis with a horizontal lie, an absent cremasteric reflex and no relief with elevation (negative Prehn sign). Epididymitis develops gradually with a present cremasteric reflex and relief with elevation, and appendix testis torsion causes localized upper-pole tenderness and a \"blue dot.\""},{"n":215,"t":"mc","visit":"Visit 1 (continued)","s":"What is the **most appropriate** action?","opts":["Advise ice packs and recheck in 24 hours","Immediate surgical referral; do not delay for imaging","Order an outpatient ultrasound for next week","Prescribe ceftriaxone and doxycycline today"],"correctIdx":[1],"answer":"B","c":"Testicular torsion is a surgical emergency. Testicular salvage is highest when detorsion occurs within about 6 hours of symptom onset, so the patient goes directly to surgical evaluation. Doppler ultrasound can help when the diagnosis is uncertain but must never delay surgery when clinical suspicion is high. Antibiotics treat epididymitis."},{"n":216,"t":"match","visit":"Visit 2 (teaching)","s":"Jordan's father asks about other scrotal problems. **Drag each condition to its typical finding.** One finding will not be used.","items":["Hydrocele","Varicocele","Testicular cancer"],"tgts":["Painless swelling that transilluminates","A painless, firm mass that does not transilluminate","A \"bag of worms\" that shrinks when lying down","Sudden severe pain with an absent cremasteric reflex"],"map":[0,2,1],"answer":"1–A, 2–C, 3–B","c":"A hydrocele is a painless, fluctuant collection of fluid that transilluminates. A varicocele is a dilated pampiniform plexus felt as a \"bag of worms,\" usually on the left, more prominent when standing and smaller when lying down; it can impair fertility. Testicular cancer, the most common solid tumor in men 15–35, presents as a painless, firm mass that does not transilluminate. Sudden pain with an absent cremasteric reflex is torsion, which was this case."}]},{"no":73,"batch":3,"title":"Kenji: Five Days of Fever","setting":"Primary care clinic • Preschool child • Cardiovascular / Infectious disease","scenario":"Kenji is a 3-year-old boy with fever above 39 °C for 6 days despite antipyretics. He has bilateral red eyes without discharge, cracked red lips, a \"strawberry\" tongue, a widespread rash on his trunk, swollen red hands and feet, and a single 2-cm tender lymph node on the right side of his neck. He is very irritable.","qs":[{"n":217,"t":"mc","visit":"Visit 1","s":"What is the **most likely** diagnosis?","opts":["Kawasaki disease, a vasculitis","Roseola infantum from HHV-6","Scarlet fever from group A strep","Measles (rubeola) virus infection"],"correctIdx":[0],"answer":"A","c":"Kawasaki disease is diagnosed with fever for 5 days or more plus at least four of five features: bilateral non-exudative conjunctivitis, oral changes (strawberry tongue, cracked red lips), polymorphous rash, extremity changes (edema and redness, later peeling around the nails) and unilateral cervical lymphadenopathy of 1.5 cm or more. Kenji has all five."},{"n":218,"t":"mc","visit":"Visit 1 (continued)","s":"What is the **most serious** complication the FNP is trying to prevent?","opts":["Subacute sclerosing panencephalitis","Post-streptococcal glomerulonephritis","Aneurysms of the coronary arteries","Splenic rupture from splenomegaly"],"correctIdx":[2],"answer":"C","c":"Kawasaki disease is a medium-vessel vasculitis and the leading cause of acquired heart disease in children in developed countries. Without treatment, about a quarter of children develop coronary artery aneurysms, which can cause thrombosis, myocardial infarction and sudden death. Echocardiography is performed at diagnosis and during follow-up."},{"n":219,"t":"mc","visit":"Visit 1 (continued)","s":"Which treatment is **indicated** after urgent referral?","opts":["IV immunoglobulin plus high-dose aspirin","Oral prednisone alone for 7 days","Acetaminophen only until the fever ends","Oral amoxicillin for 10 days at home"],"correctIdx":[0],"answer":"A","c":"Kawasaki disease is treated with IV immunoglobulin, ideally within 10 days of fever onset, which markedly reduces the risk of coronary aneurysms, along with aspirin. This is an exception to the usual rule of avoiding aspirin in children; families should know about Reye syndrome risk with influenza or varicella, and influenza vaccination is recommended."}]},{"no":74,"batch":3,"title":"Amara: Itchy, Dry Skin","setting":"Primary care clinic • Preschool child • Dermatology","scenario":"Amara is a 3-year-old with itchy, dry, red patches in the creases of her elbows and behind her knees and mild redness on her cheeks for several months. She scratches at night and the elbow skin is thickened. Her father has asthma and hay fever. There is no oozing or crusting.","qs":[{"n":220,"t":"mc","visit":"Visit 1","s":"What is the **cornerstone** of treatment for Amara's condition?","opts":["Long hot baths with fragranced soap","Oral prednisone for every flare","Oral antibiotics for 2 weeks","Daily thick emollients applied liberally"],"correctIdx":[3],"answer":"D","c":"Atopic dermatitis is a chronic, relapsing, itchy dermatitis linked to asthma and allergic rhinitis (the atopic triad). Daily liberal use of thick creams or ointments to restore the skin barrier is the cornerstone of care, along with short lukewarm baths and mild fragrance-free cleansers. Systemic steroids cause rebound flares and are avoided."},{"n":221,"t":"mc","visit":"Visit 1 (continued)","s":"Which topical steroid is **most appropriate** for the patches on Amara's cheeks?","opts":["Hydrocortisone 2.5% ointment, a low-potency steroid","Clobetasol 0.05% ointment, a super-high-potency steroid","Fluocinonide 0.05% cream, a high-potency steroid","Betamethasone dipropionate, a high-potency steroid"],"correctIdx":[0],"answer":"A","c":"Low-potency steroids such as hydrocortisone or desonide are used on the face, eyelids, skin folds and in infants because the skin is thin and absorbs more drug, increasing the risk of atrophy, striae and telangiectasia. Higher-potency agents may be used briefly on thickened limb lesions. Topical calcineurin inhibitors are steroid-sparing options for the face from age 2."},{"n":222,"t":"mc","visit":"Visit 2 (2 months later)","s":"Amara has new honey-colored crusted lesions in the eczema patches on her arm. What is the **most likely** cause?","opts":["Contact dermatitis from her emollient","Normal healing of her eczema patches","A new outbreak of plaque psoriasis","Secondary bacterial infection (impetigo)"],"correctIdx":[3],"answer":"D","c":"Honey-colored crusts are the hallmark of impetigo, a superficial infection caused by Staphylococcus aureus or group A Streptococcus that often complicates atopic dermatitis. Limited lesions are treated with topical mupirocin, and extensive lesions with oral cephalexin. Eczema herpeticum (punched-out erosions with fever) is an emergency to distinguish from this."}]},{"no":75,"batch":3,"title":"Baby Leo: The Two-Month Visit","setting":"Well-child visit • Infant • Health promotion / Immunizations","scenario":"Leo is a healthy 2-month-old full-term boy who is exclusively breastfed and growing well. He received hepatitis B vaccine at birth. Today he has a mild cold with a temperature of 37.8 °C and is feeding normally. His mother asks whether he should get his shots today. She sleeps with him in her bed because it is easier for breastfeeding.","qs":[{"n":223,"t":"sata","visit":"Visit 1","s":"Which vaccines are **routinely recommended** at Leo's 2-month visit? **Select all that apply.**","opts":["Measles, mumps and rubella","Rotavirus vaccine","Pneumococcal conjugate vaccine","Inactivated poliovirus (IPV)","Haemophilus influenzae type b (Hib)","DTaP"],"correctIdx":[1,2,3,4,5],"answer":"B, C, D, E, F","c":"At 2, 4 and 6 months, infants routinely receive DTaP, Hib, IPV, pneumococcal conjugate vaccine and oral rotavirus vaccine, with the second hepatitis B dose given between 1 and 2 months. MMR is a live vaccine first given at 12–15 months; an early dose is given only at 6–11 months before international travel."},{"n":224,"t":"mc","visit":"Visit 1 (continued)","s":"Leo has a mild cold with a low-grade fever. What is the **correct** decision about vaccination?","opts":["Give only half doses of each vaccine today","Restart the entire series at his next visit","Delay all vaccines until he is completely well","Vaccinate today; mild illness is not a contraindication"],"correctIdx":[3],"answer":"D","c":"Mild illness with or without low-grade fever, antibiotic use and breastfeeding are not contraindications to vaccination. The only true contraindication to a vaccine is a severe allergic reaction to a previous dose or component; moderate or severe illness is a precaution. Delaying vaccines unnecessarily leaves infants unprotected, and series are never restarted."},{"n":225,"t":"mc","visit":"Visit 1 (continued)","s":"How should the FNP respond about Leo's sleeping arrangement?","opts":["Agree that bed-sharing is safest when breastfeeding","Advise room-sharing on a separate firm flat

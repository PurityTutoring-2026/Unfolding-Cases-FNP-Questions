poglycemia and hyperpigmentation from high ACTH. Secondary insufficiency lacks hyperpigmentation and hyperkalemia because aldosterone is preserved. It is associated with other autoimmune diseases such as Hashimoto thyroiditis."},{"n":632,"t":"match","visit":"Visit 1 (continued)","s":"**Drag each adrenal disorder to its typical laboratory pattern.** One option will not be used.","items":["Primary adrenal insufficiency","Primary hyperaldosteronism","Cushing syndrome"],"tgts":["Low TSH with a high free T4","High aldosterone with low renin and low potassium","Low morning cortisol with high ACTH, low sodium and high potassium","Cortisol that fails to suppress after 1 mg of dexamethasone"],"map":[2,1,3],"answer":"1–C, 2–B, 3–D","c":"Primary adrenal insufficiency shows a low morning cortisol, high ACTH, hyponatremia and hyperkalemia; the cosyntropin (ACTH) stimulation test confirms it when cortisol fails to rise. Primary hyperaldosteronism shows a high aldosterone-to-renin ratio with hypertension and often hypokalemia. Cushing syndrome shows cortisol that fails to suppress on the overnight dexamethasone test. A low TSH with high free T4 indicates hyperthyroidism."},{"n":633,"t":"sata","visit":"Visit 2 (on treatment)","s":"She starts hydrocortisone and fludrocortisone. Which teaching is **correct**? **Select all that apply.**","opts":["Double or triple the hydrocortisone dose during illness","Stop hydrocortisone when she feels better","Carry an emergency hydrocortisone injection kit","Skip doses on days she has vomiting","Wear medical alert identification"],"correctIdx":[0,2,4],"answer":"A, C, E","c":"Patients with adrenal insufficiency need lifelong glucocorticoid (and, in primary disease, mineralocorticoid) replacement. \"Sick day rules\" call for doubling or tripling the oral hydrocortisone dose during fever or illness and using injectable hydrocortisone if vomiting prevents oral intake, then seeking emergency care. Stopping or missing doses can cause adrenal crisis, with shock, severe abdominal pain and confusion. Medical alert ID is essential."}]},{"no":212,"batch":9,"title":"Mr. Kasprzak: Chest Pain That Eases Leaning Forward","setting":"Urgent visit • Middle adult • Cardiovascular","scenario":"Mr. Kasprzak is a 42-year-old man who had a cold 10 days ago. For 2 days he has had sharp central chest pain that worsens when he lies flat or breathes deeply and improves when he sits up and leans forward. Temperature is 37.9 °C, HR 96, BP 126/80. A scratchy, high-pitched sound is heard at the left lower sternal border. His ECG shows diffuse concave ST elevation with PR depression. Troponin is normal.","qs":[{"n":634,"t":"mc","visit":"Visit 1","s":"What is the **most likely** diagnosis?","opts":["Acute myocardial infarction","Acute pulmonary embolism","Acute aortic dissection","Acute fibrinous pericarditis"],"correctIdx":[3],"answer":"D","c":"Acute pericarditis, often viral or idiopathic, causes sharp pleuritic chest pain that improves when sitting up and leaning forward, a pericardial friction rub, and an ECG with widespread concave ST elevation and PR depression. Diagnosis requires two of four: typical pain, friction rub, typical ECG changes and a new or worsening pericardial effusion. An echocardiogram is recommended."},{"n":635,"t":"mc","visit":"Visit 1 (continued)","s":"What is the **first-line** treatment?","opts":["IV heparin for 5 days in hospital","Oral prednisone as the initial choice","An NSAID with colchicine for 3 months","Oral antibiotics for 14 days"],"correctIdx":[2],"answer":"C","c":"First-line treatment for acute pericarditis is a high-dose NSAID (ibuprofen) or aspirin, tapered over weeks, plus colchicine for about 3 months, which reduces the risk of recurrence by about half. Exercise restriction is advised until symptoms resolve (longer for athletes). Corticosteroids are second-line because they increase recurrence. Anticoagulants are avoided because of the risk of bleeding into the pericardium."},{"n":636,"t":"sata","visit":"Visit 1 (continued)","s":"Which findings would suggest **cardiac tamponade**? **Select all that apply.**","opts":["A slow heart rate of 50","A loud pericardial friction rub","Hypotension","Jugular venous distension","Muffled heart sounds"],"correctIdx":[2,3,4],"answer":"C, D, E","c":"Cardiac tamponade occurs when pericardial fluid compresses the heart. Beck triad is hypotension, jugular venous distension and muffled heart sounds, often with tachycardia, pulsus paradoxus (a fall in systolic BP of more than 10 mmHg with inspiration) and low-voltage ECG or electrical alternans. It requires emergency pericardiocentesis. A friction rub may disappear as fluid accumulates."}]},{"no":213,"batch":9,"title":"Mr. Harris: Elbow Pain From Gripping","setting":"Primary care clinic • Middle adult • Musculoskeletal","scenario":"Mr. Harris is a 46-year-old carpenter who has had 2 months of pain on the outer side of his right elbow, worse when gripping a hammer, lifting a coffee cup or shaking hands. He does not play tennis. The pain is reproduced by resisted wrist extension with the elbow straight. He has tenderness just below the bony prominence on the outer elbow. Range of motion is full.","qs":[{"n":637,"t":"mc","visit":"Visit 1","s":"What is the **most likely** diagnosis?","opts":["Medial epicondylitis","Cubital tunnel syndrome","Olecranon bursitis","Lateral epicondylitis"],"correctIdx":[3],"answer":"D","c":"Lateral epicondylitis (\"tennis elbow\") is an overuse tendinopathy of the common extensor origin, especially the extensor carpi radialis brevis, caused by repetitive gripping and wrist extension. It causes pain over the lateral epicondyle reproduced by resisted wrist or middle-finger extension. Medial epicondylitis (\"golfer's elbow\") involves the flexor origin, and cubital tunnel syndrome causes ulnar nerve symptoms in the ring and little fingers."},{"n":638,"t":"mc","visit":"Visit 1 (continued)","s":"What is the **first-line** management?","opts":["Immediate surgical release of the tendon","Repeated monthly steroid injections for a year","Activity changes, a brace and eccentric exercise","A long arm cast worn for 8 weeks or longer"],"correctIdx":[2],"answer":"C","c":"Lateral epicondylitis is usually self-limited, resolving in most patients within a year. First-line management includes modifying activities, a counterforce brace, ice, short-term NSAIDs and physical therapy with eccentric strengthening. Corticosteroid injections give short-term relief but are associated with worse outcomes and more recurrence long term. Surgery is for symptoms persisting 6–12 months."},{"n":639,"t":"mc","visit":"Visit 2 (2 months later)","s":"His co-worker has swelling over the **tip** of the elbow after leaning on it. Which finding would raise concern for **infection**?","opts":["Full painless range of elbow motion","Warmth, redness, fever and a skin break","A painless, soft, fluctuant swelling","Swelling that appeared after leaning on it"],"correctIdx":[1],"answer":"B","c":"Olecranon bursitis causes swelling over the point of the elbow, often from repeated pressure. Aseptic bursitis is usually painless or mildly tender and is treated with protection, compression and NSAIDs. Septic bursitis, usually from Staphylococcus aureus, is suggested by warmth, redness, marked tenderness, fever and a skin break; it requires aspiration for culture and antibiotics."}]},{"no":214,"batch":9,"title":"Mr. Ferreira: Crackles Like Velcro","setting":"Primary care clinic • Middle adult • Respiratory","scenario":"Mr. Ferreira is a 63-year-old former smoker with 1 year of progressive shortness of breath on exertion and a dry cough. He has fine \"Velcro-like\" crackles at both lung bases and clubbing of the fingers. Chest x-ray shows reticular opacities at the lung bases. Pulmonary function tests show a reduced FVC, a normal FEV1/FVC ratio and a reduced DLCO.","qs":[{"n":640,"t":"mc","visit":"Visit 1","s":"What pattern do Mr. Ferreira's pulmonary function tests show?","opts":["A restrictive pattern with low diffusion","An obstructive pattern like COPD","A reversible obstructive pattern","A normal pattern with low diffusion"],"correctIdx":[0],"answer":"A","c":"Restrictive lung disease shows reduced lung volumes (low FVC and total lung capacity) with a normal or high FEV1/FVC ratio. A reduced DLCO indicates impaired gas exchange from interstitial disease. Obstructive disease such as COPD or asthma has a reduced FEV1/FVC ratio (below 0.70). His findings suggest interstitial lung disease."},{"n":641,"t":"mc","visit":"Visit 1 (continued)","s":"Which test is **most useful** next to evaluate his interstitial lung disease?","opts":["A sputum culture for bacteria","A ventilation–perfusion lung scan","A repeat chest x-ray in a year","High-resolution CT of the chest"],"correctIdx":[3],"answer":"D","c":"High-resolution CT of the chest is the key test for interstitial lung disease. A usual interstitial pneumonia pattern (basal, subpleural reticulation with honeycombing) supports idiopathic pulmonary fibrosis (IPF) after excluding other causes such as connective tissue disease, occupational exposures and drugs (amiodarone, nitrofurantoin, methotrexate). Referral to pulmonology is appropriate."},{"n":642,"t":"sata","visit":"Visit 2 (pulmonology plan)","s":"He is diagnosed with idiopathic pulmonary fibrosis. Which treatments are **appropriate**? **Select all that apply.**","opts":["Supplemental oxygen if he is hypoxemic","A beta-agonist inhaler alone as therapy","Pulmonary rehabilitation","High-dose prednisone long term","An antifibrotic such as nintedanib or pirfenidone"],"correctIdx":[0,2,4],"answer":"A, C, E","c":"The antifibrotic drugs nintedanib and pirfenidone slow the decline in lung function in IPF. Supportive care includes pulmonary rehabilitation, oxygen for hypoxemia, vaccinations, treatment of GERD and evaluation for lung transplant. Long-term corticosteroids (with or without immunosuppressants) are harmful in IPF. Bronchodilators do not treat fibrosis."}]},{"no":215,"batch":9,"title":"Ms. Ogbonna: A Rash After a New Seizure Medicine","setting":"Urgent visit • Young adult • Dermatology / Pharmacology","scenario":"Ms. Ogbonna is a 26-year-old woman who started lamotrigine 3 weeks ago for epilepsy. For 2 days she has had fever, sore throat and burning eyes, followed by painful red-purple patches on her face and trunk that are starting to blister. She has painful erosions on her lips and inside her mouth. Gentle pressure on the skin causes it to slough. About 8% of her body surface is involved.","qs":[{"n":643,"t":"mc","visit":"Visit 1","s":"What is the **most likely** diagnosis?","opts":["Staph scalded skin syndrome","Allergic contact dermatitis","Stevens–Johnson syndrome","Erythema multiforme minor"],"correctIdx":[2],"answer":"C","c":"Stevens–Johnson syndrome (SJS) is a severe mucocutaneous reaction, usually to a drug, that begins with fever and flu-like symptoms followed by painful dusky macules, blisters and epidermal detachment with mucosal involvement (eyes, mouth, genitals). SJS involves less than 10% of body surface area, SJS–TEN overlap 10–30%, and toxic epidermal necrolysis more than 30%. Erythema multiforme minor causes target lesions with little mucosal involvement."},{"n":644,"t":"sata","visit":"Visit 1 (continued)","s":"Which medications are **common** causes of this reaction? **Select all that apply.**","opts":["Lamotrigine","Levothyroxine","Allopurinol","Trimethoprim–sulfamethoxazole","Acetaminophen at normal doses"],"correctIdx":[0,2,3],"answer":"A, C, D","c":"Common causes of SJS/TEN include anticonvulsants (lamotrigine, carbamazepine, phenytoin, phenobarbital), allopurinol, sulfonamide antibiotics (TMP-SMX), nevirapine and NSAIDs of the oxicam type. Risk is highest in the first 8 weeks of treatment. With lamotrigine, risk rises with rapid dose escalation or combination with valproate."},{"n":645,"t":"mc","visit":"Visit 1 (continued)","s":"What is the **most important** immediate action?","opts":["Continue lamotrigine and apply a topical steroid","Stop lamotrigine and send her to a burn or ICU unit","Give oral antibiotics and recheck in one week","Lower the lamotrigine dose and add an antihistamine"],"correctIdx":[1],"answer":"B","c":"The suspected drug must be stopped immediately; early withdrawal improves survival. Patients need emergency care, ideally in a burn unit or ICU, with wound care, fluid and electrolyte management, pain control, nutrition, and ophthalmology review to prevent scarring and vision loss. The drug and related drugs must never be taken again, and this should be recorded as a serious allergy."}]},{"no":216,"batch":9,"title":"Mr. and Mrs. Asante: Trying to Conceive","setting":"Primary care clinic • Young adult • Reproductive health","scenario":"Mrs. Asante is a 31-year-old woman and her husband is 33. They have had regular unprotected intercourse for 14 months without pregnancy. Her periods are regular every 28 days. She has no history of pelvic infection or surgery. He smokes and uses a hot tub several times a week. Neither has children.","qs":[{"n":646,"t":"mc","visit":"Visit 1","s":"When is an infertility evaluation **recommended** for a woman of Mrs. Asante's age?","opts":["Only after 3 years of trying to conceive","After only 3 months of trying to conceive","Only once she is over the age of 40","After 12 months of trying to conceive"],"correctIdx":[3],"answer":"D","c":"Infertility is defined as no pregnancy after 12 months of regular unprotected intercourse in women under 35, or after 6 months in women 35 and older; evaluation begins immediately for women over 40 or with known risk factors such as irregular cycles, prior PID or endometriosis. Both partners are evaluated at the same time because male factors contribute to about half of cases."},{"n":647,"t":"sata","visit":"Visit 1 (continued)","s":"Which tests are part of the **initial** infertility evaluation for this couple? **Select all that apply.**","opts":["Confirmation of ovulation, such as mid-luteal progesterone","A brain MRI for both partners","Genetic testing of all relatives","Semen analysis for Mr. Asante","Assessment of tubal patency (hysterosalpingogram)"],"correctIdx":[0,3,4],"answer":"A, D, E","c":"The initial infertility evaluation includes semen analysis, confirmation of ovulation (cycle history, mid-luteal progesterone or ovulation kits), assessment of tubal patency and the uterine cavity (hysterosalpingogram or saline sonography) and often ovarian reserve testing (AMH, day-3 FSH). TSH and prolactin are checked when indicated. Brain MRI is only for specific findings such as high prolactin."},{"n":648,"t":"mc","visit":"Visit 1 (continued)","s":"Which change could **improve** Mr. Asante's fertility?","opts":["Wearing tight underwear every day","Taking testosterone injections weekly","Using a hot tub every day instead","Stopping smoking and avoiding hot tubs"],"correctIdx":[3],"answer":"D","c":"Smoking, heat exposure (hot tubs, saunas, laptops on the lap), obesity, heavy alcohol and cannabis use can impair sperm quality. Exogenous testosterone suppresses sperm production and should be avoided in men trying to conceive. Because sperm take about 3 months to develop, improvements may take that long to appear."}]},{"no":217,"batch":9,"title":"Mr. Vega: Washing Until His Hands Crack","setting":"Primary care clinic • Young adult • Mental health","scenario":"Mr. Vega is a 23-year-old man with red, cracked hands. He admits to intrusive, unwanted thoughts that he will catch or spread germs, which cause him intense anxiety. He washes his hands 50 times a day and checks that the door is locked many times before leaving, which takes up 3 hours daily. He knows the fears are excessive but cannot stop. He has no psychotic symptoms.","qs":[{"n":649,"t":"mc","visit":"Visit 1","s":"What is the **most likely** diagnosis?","opts":["Delusional disorder, somatic","Generalized anxiety disorder","Obsessive-compulsive disorder","Obsessive-compulsive personality"],"correctIdx":[2],"answer":"C","c":"Obsessive-compulsive disorder (OCD) involves obsessions (intrusive, unwanted thoughts, urges or images that cause distress) and/or compulsions (repetitive behaviors or mental acts done to reduce distress) that take more than 1 hour a day or cause significant impairment. Most patients recognize the fears are excessive. Obsessive-compulsive personality disorder involves perfectionism and rigidity without true obsessions and compulsions."},{"n":650,"t":"mc","visit":"Visit 1 (continued)","s":"What is the **first-line** psychotherapy for OCD?","opts":["Psychodynamic therapy focused on childhood","Hypnotherapy for the intrusive thoughts","Supportive counseling with reassurance","Exposure and response prevention therapy"],"correctIdx":[3],"answer":"D","c":"Cognitive behavioral therapy with exposure and response prevention (ERP), in which the patient is gradually exposed to feared situations while resisting compulsions, is the most effective psychotherapy for OCD. Repeated reassurance can act as a compulsion and maintain symptoms."},{"n":651,"t":"mc","visit":"Visit 1 (continued)","s":"Which statement about **SSRI** treatment for OCD is correct?","opts":["Higher doses and longer trials are usually needed","They should be stopped after 2 weeks if no change","Low doses work within 1 week for most patients","SSRIs are not effective for OCD at any dose"],"correctIdx":[0],"answer":"A","c":"SSRIs (fluoxetine, fluvoxamine, sertraline, paroxetine) are first-line medications for OCD, alone or combined with ERP. OCD usually requires higher doses than depression and longer trials (8–12 weeks at an adequate dose) before judging response. Clomipramine is an effective alternative, and augmentation with an antipsychotic may help in refractory cases."}]},{"no":218,"batch":9,"title":"Mr. Bassey: Punched a Wall","setting":"Urgent visit • Young adult • Musculoskeletal","scenario":"Mr. Bassey is a 24-year-old man who punched a wall in anger last night. He has pain, swelling and bruising over the outer side of the back of his right hand. The knuckle of his little finger looks sunken. When he makes a fist, his little finger overlaps his ring finger. There is a small cut over the fourth knuckle.","qs":[{"n":652,"t":"hot","visit":"Visit 1","s":"The FNP suspects a boxer's fracture. **Click the bone most likely fractured.**","answer":"A","c":"A boxer's fracture is a fracture of the neck of the fifth metacarpal, caused by punching a hard object with a closed fist. It causes swelling and tenderness over the fifth metacarpal, loss of the knuckle prominence, and sometimes rotational deformity. Hand x-rays (AP, lateral and oblique views) confirm the diagnosis and degree of angulation.","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 400 320\" width=\"100%\" height=\"auto\"><rect width=\"400\" height=\"320\" fill=\"none\"/><rect x=\"112\" y=\"64\" width=\"30\" height=\"132\" rx=\"14\" fill=\"var(--skin)\" stroke=\"var(--diagram-ink)\" stroke-width=\"2.2\"/><rect x=\"152\" y=\"38\" width=\"30\" height=\"158\" rx=\"14\" fill=\"var(--skin)\" stroke=\"var(--diagram-ink)\" stroke-width=\"2.2\"/><rect x=\"192\" y=\"46\" width=\"30\" height=\"150\" rx=\"14\" fill=\"var(--skin)\" stroke=\"var(--diagram-ink)\" stroke-width=\"2.2\"/><rect x=\"232\" y=\"76\" width=\"30\" height=\"120\" rx=\"14\" fill=\"var(--skin)\" stroke=\"var(--diagram-ink)\" stroke-width=\"2.2\"/><path d=\"M 104 180 L 270 180 Q 282 250 262 300 L 128 300 Q 100 250 104 180 Z\" fill=\"var(--skin)\" stroke=\"var(--diagram-ink)\" stroke-width=\"2.2\"/>\n<line x1=\"116\" y1=\"98\" x2=\"138\" y2=\"98\" stroke=\"var(--diagram-ink)\" stroke-width=\"1.5\" stroke-opacity=\"0.6\"/><line x1=\"116\" y1=\"140\" x2=\"138\" y2=\"140\" stroke=\"var(--diagram-ink)\" stroke-width=\"1.5\" stroke-opacity=\"0.6\"/><line x1=\"156\" y1=\"72\" x2=\"178\" y2=\"72\" stroke=\"var(--diagram-ink)\" stroke-width=\"1.5\" stroke-opacity=\"0.6\"/><line x1=\"156\" y1=\"114\" x2=\"178\" y2=\"114\" stroke=\"var(--diagram-ink)\" stroke-width=\"1.5\" stroke-opacity=\"0.6\"/><line x1=\"196\" y1=\"80\" x2=\"218\" y2=\"80\" stroke=\"var(--diagram-ink)\" stroke-width=\"1.5\" stroke-opacity=\"0.6\"/><line x1=\"196\" y1=\"122\" x2=\"218\" y2=\"122\" stroke=\"var(--diagram-ink)\" stroke-width=\"1.5\" stroke-opacity=\"0.6\"/><line x1=\"236\" y1=\"110\" x2=\"258\" y2=\"110\" stroke=\"var(--diagram-ink)\" stroke-width=\"1.5\" stroke-opacity=\"0.6\"/><line x1=\"236\" y1=\"152\" x2=\"258\" y2=\"152\" stroke=\"var(--diagram-ink)\" stroke-width=\"1.5\" stroke-opacity=\"0.6\"/>\n<path d=\"M 106 214 Q 70 196 52 150 Q 44 128 62 122 Q 80 120 92 150 Q 100 170 114 186\" fill=\"var(--skin)\" stroke=\"var(--diagram-ink)\" stroke-width=\"2.2\"/>\n<line x1=\"134\" y1=\"300\" x2=\"132\" y2=\"316\" stroke=\"var(--diagram-ink)\" stroke-width=\"2\"/><line x1=\"258\" y1=\"300\" x2=\"262\" y2=\"316\" stroke=\"var(--diagram-ink)\" stroke-width=\"2\"/>\n<text x=\"200\" y=\"22\" font-family=\"Arial, sans-serif\" font-size=\"12\" font-weight=\"700\" fill=\"var(--diagram-ink)\" text-anchor=\"middle\">Right hand — dorsal (back) view</text><g class=\"zone\" data-id=\"A\" tabindex=\"0\" role=\"button\" aria-label=\"Area A\">\n<circle cx=\"252\" cy=\"230\" r=\"15\" fill=\"var(--zone-fill)\" stroke=\"var(--zone-ink)\" stroke-width=\"2.5\"/>\n<text x=\"252\" y=\"235.5\" text-anchor=\"middle\" font-family=\"Georgia, 'Times New Roman', serif\" font-size=\"16\" font-weight=\"700\" fill=\"var(--zone-ink)\">A</text></g><g class=\"zone\" data-id=\"B\" tabindex=\"0\" role=\"button\" aria-label=\"Area B\">\n<circle cx=\"207\" cy=\"184\" r=\"15\" fill=\"var(--zone-fill)\" stroke=\"var(--zone-ink)\" stroke-width=\"2.5\"/>\n<text x=\"207\" y=\"189.5\" text-anchor=\"middle\" font-family=\"Georgia, 'Times New Roman', serif\" font-size=\"16\" font-weight=\"700\" fill=\"var(--zone-ink)\">B</text></g><g class=\"zone\" data-id=\"C\" tabindex=\"0\" role=\"button\" aria-label=\"Area C\">\n<circle cx=\"167\" cy=\"116\" r=\"15\" fill=\"var(--zone-fill)\" stroke=\"var(--zone-ink)\" stroke-width=\"2.5\"/>\n<text x=\"167\" y=\"121.5\" text-anchor=\"middle\" font-family=\"Georgia, 'Times New Roman', serif\" font-size=\"16\" font-weight=\"700\" fill=\"var(--zone-ink)\">C</text></g><g class=\"zone\" data-id=\"D\" tabindex=\"0\" role=\"button\" aria-label=\"Area D\">\n<circle cx=\"120\" cy=\"262\" r=\"15\" fill=\"var(--zone-fill)\" stroke=\"var(--zone-ink)\" stroke-width=\"2.5\"/>\n<text x=\"120\" y=\"267.5\" text-anchor=\"middle\" font-family=\"Georgia, 'Times New Roman', serif\" font-size=\"16\" font-weight=\"700\" fill=\"var(--zone-ink)\">D</text></g><g class=\"zone\" data-id=\"E\" tabindex=\"0\" role=\"button\" aria-label=\"Area E\">\n<circle cx=\"196\" cy=\"288\" r=\"15\" fill=\"var(--zone-fill)\" stroke=\"var(--zone-ink)\" stroke-width=\"2.5\"/>\n<text x=\"196\" y=\"293.5\" text-anchor=\"middle\" font-family=\"Georgia, 'Times New Roman', serif\" font-size=\"16\" font-weight=\"700\" fill=\"var(--zone-ink)\">E</text></g></svg>"},{"n":653,"t":"mc","visit":"Visit 1 (continued)","s":"His little finger **overlaps** the ring finger when he makes a fist. What does this indicate?","opts":["A nerve injury that needs an urgent nerve study","A normal finding that needs no special attention","A rotational deformity that needs orthopedic referral","A tendon rupture that needs a tetanus shot only"],"correctIdx":[2],"answer":"C","c":"Scissoring (overlapping) of a finger when making a fist indicates rotational malalignment, which does not remodel and will impair grip. It requires reduction and often surgical fixation by a hand surgeon. Uncomplicated boxer's fractures with acceptable angulation and no rotation can be treated with buddy taping or an ulnar gutter splint."},{"n":654,"t":"mc","visit":"Visit 1 (continued)","s":"What is the **most important** concern about the cut over his fourth knuckle?","opts":["A \"fight bite\" that needs irrigation and antibiotics","A minor cut that can be closed with sutures now","A cut that needs no care because it is small","A burn from the wall that needs silver cream"],"correctIdx":[0],"answer":"A","c":"A laceration over a knuckle after punching someone's mouth (a \"fight bite\") must be assumed to be a human bite, even if the patient says he hit a wall. These wounds can seed the joint or tendon sheath with oral bacteria (including Eikenella corrodens) and cause serious infection. They need thorough irrigation, should not be sutured, require prophylactic amoxicillin–clavulanate and tetanus update, and need evaluation for joint involvement."}]},{"no":219,"batch":9,"title":"Ms. Dlamini: A Sore Throat That Got Worse","setting":"Urgent visit • Young adult • ENT / Infectious disease","scenario":"Ms. Dlamini is a 21-year-old woman who had a sore throat a week ago that improved, but for 2 days she has had severe left-sided throat pain, painful swallowing, drooling, fever of 39 °C and pain radiating to her left ear. Her voice sounds muffled, like she has a \"hot potato\" in her mouth, and she has trouble opening her mouth fully. The left tonsil bulges toward the midline and the uvula is pushed to the right.","qs":[{"n":655,"t":"mc","visit":"Visit 1","s":"What is the **most likely** diagnosis?","opts":["Peritonsillar abscess","Viral pharyngitis","Acute epiglottitis","Infectious mononucleosis"],"correctIdx":[0],"answer":"A","c":"Peritonsillar abscess is the most common deep neck infection in young adults, usually a complication of tonsillitis. It causes severe unilateral sore throat, fever, odynophagia, drooling, a muffled \"hot potato\" voice, trismus (difficulty opening the mouth), ear pain, and a bulging tonsil with deviation of the uvula to the opposite side. Epiglottitis causes drooling and stridor without tonsillar bulging."},{"n":656,"t":"mc","visit":"Visit 1 (continued)","s":"What is the **most appropriate** management?","opts":["Oral penicillin and a recheck in two weeks","Same-day ENT referral for drainage and antibiotics","Throat lozenges and warm salt-water gargles","Oral prednisone alone for 5 days at home"],"correctIdx":[1],"answer":"B","c":"Peritonsillar abscess requires drainage (needle aspiration or incision and drainage), usually by ENT or an experienced emergency clinician, plus antibiotics active against streptococci and oral anaerobes, such as amoxicillin–clavulanate or clindamycin, and pain control and hydration. Tonsillectomy is considered for recurrent abscesses."},{"n":657,"t":"sata","visit":"Visit 1 (continued)","s":"Which signs would suggest **airway compromise** needing emergency care? **Select all that apply.**","opts":["Sitting forward in a tripod position to breathe","A slightly hoarse voice after a cold","Stridor","Inability to swallow saliva","A mild sore throat that eases with ibuprofen"],"correctIdx":[0,2,3],"answer":"A, C, D","c":"Stridor, inability to handle secretions (drooling), respiratory distress, tripod positioning and a toxic appearance suggest airway compromise from a deep neck infection such as an abscess or epiglottitis. These patients need emergency airway management and should not have the throat examined forcefully. Mild sore throat and slight hoarseness after a cold are not signs of airway compromise."}]},{"no":220,"batch":9,"title":"Mrs. Mensah: Bleeding at 32 Weeks","setting":"Prenatal phone triage → obstetric unit • Young adult • Women's health","scenario":"Mrs. Mensah is a 29-year-old woman, G2P1, at 32 weeks of gestation. She calls to report bright red vaginal bleeding that started suddenly while she was resting, without abdominal pain or contractions. A 20-week ultrasound noted a low-lying placenta, but she missed her follow-up scan. She feels the baby moving normally.","qs":[{"n":658,"t":"mc","visit":"Visit 1","s":"Which diagnosis is **most likely**?","opts":["Placenta previa","Preterm labor alone","Uterine rupture","Placental abruption"],"correctIdx":[0],"answer":"A","c":"Placenta previa (placenta covering or near the cervical os) classically causes sudden, painless, bright red vaginal bleeding in the second half of pregnancy. Risk factors include prior cesarean delivery, multiparity, advanced maternal age, smoking and multiple gestation. Placental abruption causes painful bleeding with a tender, rigid uterus and frequent contractions."},{"n":659,"t":"mc","visit":"Visit 1 (continued)","s":"What must be **avoided** until placenta previa has been excluded by ultrasound?","opts":["Asking about fetal movements","Measuring her blood pressure","Checking the fetal heart rate","A digital vaginal examination"],"correctIdx":[3],"answer":"D","c":"A digital vaginal (cervical) examination must not be done in a pregnant patient with bleeding after about 20 weeks until placenta previa is excluded by ultrasound, because it can cause catastrophic hemorrhage. She should go to the obstetric unit immediately for assessment, fetal monitoring, IV access, blood type and crossmatch, and anti-D immune globulin if Rh negative."},{"n":660,"t":"match","visit":"Visit 2 (teaching)","s":"The FNP reviews third-trimester bleeding with a student. **Drag each condition to its typical presentation.** One option will not be used.","items":["Placenta previa","Placental abruption","Uterine rupture"],"tgts":["Painless bright red bleeding with a soft, non-tender uterus","Painful bleeding with a tender, rigid uterus and frequent contractions","Light pink spotting after intercourse in the first trimester","Sudden severe pain and loss of fetal station during labor after a prior cesarean"],"map":[0,1,3],"answer":"1–A, 2–B, 3–D","c":"Placenta previa causes painless bleeding with a soft uterus. Placental abruption (separation of the placenta before delivery) causes painful bleeding, a tender, firm uterus, contractions and fetal distress, and is associated with hypertension, cocaine use, smoking and trauma; bleeding may be concealed. Uterine rupture, a risk with a prior uterine scar, causes sudden pain, loss of fetal station, fetal distress and shock. Light spotting after intercourse in early pregnancy is usually cervical."}]},{"no":221,"batch":9,"title":"Hannah: No Period at Sixteen","setting":"Primary care clinic • Adolescent • Endocrine / Gynecology","scenario":"Hannah is a 16-year-old girl who has never had a menstrual period. She is 4 ft 8 in tall (below the 3rd percentile), with a broad chest, widely spaced nipples, a low posterior hairline and a webbed neck. Breast development is Tanner stage 1. She had surgery for coarctation of the aorta as an infant. FSH and LH are markedly elevated.","qs":[{"n":661,"t":"mc","visit":"Visit 1","s":"When should **primary amenorrhea** be evaluated?","opts":["No menses by 15, or 3 years after breast budding","No menses by age 20 in a healthy young woman","Only if pregnancy has been ruled out at 18","No menses by 12, even with no breast growth"],"correctIdx":[0],"answer":"A","c":"Primary amenorrhea should be evaluated if menses have not begun by age 15 in the presence of normal secondary sexual characteristics, or within 3 years of thelarche (breast budding), or by 13 if there is no breast development. Pregnancy should be excluded first in all cases."},{"n":662,"t":"mc","visit":"Visit 1 (continued)","s":"What is the **most likely** diagnosis?","opts":["Klinefelter syndrome (47,XXY)","Turner syndrome (45,X)","Constitutional delay of puberty","Androgen insensitivity syndrome"],"correctIdx":[1],"answer":"B","c":"Turner syndrome (45,X) is the most common cause of primary ovarian insufficiency in girls. Features include short stature, absent or delayed puberty with high FSH and LH (hypergonadotropic hypogonadism), webbed neck, low hairline, broad chest, lymphedema at birth, and cardiac defects such as coarctation of the aorta and bicuspid aortic valve. A karyotype confirms the diagnosis."},{"n":663,"t":"sata","visit":"Visit 2 (management plan)","s":"Which care is **recommended** for Hannah? **Select all that apply.**","opts":["Screening for hearing loss and thyroid disease","No follow-up once puberty is induced","Testosterone therapy to increase height","Regular cardiac and blood pressure monitoring","Estrogen therapy to induce puberty"],"correctIdx":[0,3,4],"answer":"A, D, E","c":"Girls with Turner syndrome need estrogen replacement to induce puberty and protect bone, growth hormone (ideally started earlier in childhood) for height, and lifelong monitoring for aortic dilation and dissection, hypertension, hearing loss, autoimmune thyroid disease, celiac disease, kidney anomalies and diabetes. Most have infertility, and fertility counseling is important."}]},{"no":222,"batch":9,"title":"Diego: A Bag of Worms in the Scrotum","setting":"Sports physical • Adolescent • Genitourinary","scenario":"Diego is a 15-year-old boy at a sports physical. The FNP feels a soft, non-tender mass above his left testis that feels like a \"bag of worms\" while he stands and becomes larger with the Valsalva maneuver. It disappears when he lies down. He reports a mild dull ache after long practices. Both testes are the same size.","qs":[{"n":664,"t":"mc","visit":"Visit 1","s":"What is the **most likely** diagnosis?","opts":["Inguinal hernia","Testicular cancer","Hydrocele only","Left varicocele"],"correctIdx":[3],"answer":"D","c":"A varicocele is dilation of the pampiniform venous plexus, felt as a \"bag of worms\" above the testis that enlarges when standing or with Valsalva and decompresses when lying down. About 90% occur on the left because the left testicular vein drains at a right angle into the left renal vein. It is common in adolescents and can affect testicular growth and fertility."},{"n":665,"t":"mc","visit":"Visit 1 (continued)","s":"Which finding would **require** imaging to look for a mass?","opts":["A left varicocele that shrinks when he lies down","A small left varicocele found on routine examination","A right-sided varicocele that does not decompress lying down","Equal testicular size on both sides at this visit"],"correctIdx":[2],"answer":"C","c":"An isolated right-sided varicocele, a varicocele that does not decompress when lying down, or one of sudden onset may indicate obstruction of venous drainage by an abdominal or retroperitoneal mass (such as a renal tumor) and needs imaging. Typical left varicoceles that decompress do not."},{"n":666,"t":"mc","visit":"Visit 1 (continued)","s":"What is the **most appropriate** plan for Diego?","opts":["Restrict him from all sports until he is 18","Monitor testicular size yearly and refer if it shrinks","Immediate surgery for every varicocele found","Prescribe testosterone to keep the testes equal"],"correctIdx":[1],"answer":"B","c":"Most adolescent varicoceles are managed with observation, including yearly examination and ultrasound measurement of testicular volume. Referral for surgical repair is recommended for a persistent testicular size difference (usually above 20%), pain, or abnormal semen analysis in older adolescents. Sports participation is not restricted."}]},{"no":223,"batch":9,"title":"Tomás: Sudden Coughing After Peanuts","setting":"Urgent visit • Toddler • Respiratory / Emergency","scenario":"Tomás is a 2-year-old boy who was eating peanuts at a party yesterday when he suddenly started choking and coughing. The coughing settled, but since then he has had a persistent cough and noisy breathing. He has no fever. He is breathing comfortably at rest and talking. Breath sounds are decreased on the right with a localized wheeze over the right lower chest.","qs":[{"n":667,"t":"mc","visit":"Visit 1","s":"What is the **most likely** diagnosis?","opts":["New-onset childhood asthma","Viral croup (laryngotracheitis)","Foreign body aspiration","Community-acquired pneumonia"],"correctIdx":[2],"answer":"C","c":"Foreign body aspiration is most common in children aged 1–3 years, often with nuts, seeds, small toys or food. A witnessed choking episode followed by cough and new unilateral wheeze or decreased breath sounds is highly suggestive. Symptoms may lessen after the initial event, which can delay diagnosis. Asthma typically causes bilateral, diffuse wheezing."},{"n":668,"t":"hot","visit":"Visit 1 (continued)","s":"Inhaled objects most often lodge in the right main bronchus. **Click the lung lobe most often affected.**","answer":"E","c":"The right main bronchus is wider, shorter and more vertical than the left, so aspirated foreign bodies most often enter the right lung, commonly the right lower lobe when upright. This causes localized wheeze, decreased breath sounds and, later, air trapping, atelectasis or pneumonia in that area.","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 400 320\" width=\"100%\" height=\"auto\"><rect width=\"400\" height=\"320\" fill=\"none\"/><path d=\"M 120 40 Q 200 20 280 40 L 330 70 Q 352 160 330 300 L 70 300 Q 48 160 70 70 Z\" fill=\"var(--skin)\" stroke=\"var(--diagram-ink)\" stroke-width=\"2.5\"/>\n<path d=\"M 172 40 Q 200 58 228 40\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-width=\"2\"/>\n<path d=\"M 196 62 Q 150 64 86 74\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-width=\"5\" stroke-linecap=\"round\"/>\n<path d=\"M 204 62 Q 250 64 314 74\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-width=\"5\" stroke-linecap=\"round\"/>\n<rect x=\"186\" y=\"66\" width=\"28\" height=\"170\" rx=\"10\" fill=\"var(--diagram-ink)\" fill-opacity=\"0.14\" stroke=\"var(--diagram-ink)\" stroke-width=\"2\"/>\n<path d=\"M 184 96 Q 120 102 86 126\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-opacity=\"0.35\" stroke-width=\"2\"/><path d=\"M 216 96 Q 280 102 314 126\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-opacity=\"0.35\" stroke-width=\"2\"/><path d=\"M 184 122 Q 120 128 90 152\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-opacity=\"0.35\" stroke-width=\"2\"/><path d=\"M 216 122 Q 280 128 310 152\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-opacity=\"0.35\" stroke-width=\"2\"/><path d=\"M 184 148 Q 120 154 94 178\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-opacity=\"0.35\" stroke-width=\"2\"/><path d=\"M 216 148 Q 280 154 306 178\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-opacity=\"0.35\" stroke-width=\"2\"/><path d=\"M 184 174 Q 120 180 98 204\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-opacity=\"0.35\" stroke-width=\"2\"/><path d=\"M 216 174 Q 280 180 302 204\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-opacity=\"0.35\" stroke-width=\"2\"/><path d=\"M 184 200 Q 120 206 102 230\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-opacity=\"0.35\" stroke-width=\"2\"/><path d=\"M 216 200 Q 280 206 298 230\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-opacity=\"0.35\" stroke-width=\"2\"/><path d=\"M 184 226 Q 120 232 106 256\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-opacity=\"0.35\" stroke-width=\"2\"/><path d=\"M 216 226 Q 280 232 294 256\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-opacity=\"0.35\" stroke-width=\"2\"/>\n<line x1=\"288\" y1=\"70\" x2=\"288\" y2=\"290\" stroke=\"var(--diagram-ink)\" stroke-width=\"1.5\" stroke-dasharray=\"5 5\" stroke-opacity=\"0.6\"/>\n<text x=\"292\" y=\"286\" font-family=\"Arial, sans-serif\" font-size=\"11\" font-weight=\"400\" fill=\"var(--diagram-ink)\" text-anchor=\"start\">MCL</text><text x=\"40\" y=\"20\" font-family=\"Arial, sans-serif\" font-size=\"12\" font-weight=\"700\" fill=\"var(--diagram-ink)\" text-anchor=\"start\">Patient's RIGHT</text><text x=\"268\" y=\"20\" font-family=\"Arial, sans-serif\" font-size=\"12\" font-weight=\"700\" fill=\"var(--diagram-ink)\" text-anchor=\"start\">Patient's LEFT</text><g class=\"zone\" data-id=\"A\" tabindex=\"0\" role=\"button\" aria-label=\"Area A\">\n<circle cx=\"120\" cy=\"112\" r=\"15\" fill=\"var(--zone-fill)\" stroke=\"var(--zone-ink)\" stroke-width=\"2.5\"/>\n<text x=\"120\" y=\"117.5\" text-anchor=\"middle\" font-family=\"Georgia, 'Times New Roman', serif\" font-size=\"16\" font-weight=\"700\" fill=\"var(--zone-ink)\">A</text></g><g class=\"zone\" data-id=\"B\" tabindex=\"0\" role=\"button\" aria-label=\"Area B\">\n<circle cx=\"280\" cy=\"104\" r=\"15\" fill=\"var(--zone-fill)\" stroke=\"var(--zone-ink)\" stroke-width=\"2.5\"/>\n<text x=\"280\" y=\"109.5\" text-anchor=\"middle\" font-family=\"Georgia, 'Times New Roman', serif\" font-size=\"16\" font-weight=\"700\" fill=\"var(--zone-ink)\">B</text></g><g class=\"zone\" data-id=\"C\" tabindex=\"0\" role=\"button\" aria-label=\"Area C\">\n<circle cx=\"120\" cy=\"190\" r=\"15\" fill=\"var(--zone-fill)\" stroke=\"var(--zone-ink)\" stroke-width=\"2.5\"/>\n<text x=\"120\" y=\"195.5\" text-anchor=\"middle\" font-family=\"Georgia, 'Times New Roman', serif\" font-size=\"16\" font-weight=\"700\" fill=\"var(--zone-ink)\">C</text></g><g class=\"zone\" data-id=\"D\" tabindex=\"0\" role=\"button\" aria-label=\"Area D\">\n<circle cx=\"300\" cy=\"260\" r=\"15\" fill=\"var(--zone-fill)\" stroke=\"var(--zone-ink)\" stroke-width=\"2.5\"/>\n<text x=\"300\" y=\"265.5\" text-anchor=\"middle\" font-family=\"Georgia, 'Times New Roman', serif\" font-size=\"16\" font-weight=\"700\" fill=\"var(--zone-ink)\">D</text></g><g class=\"zone\" data-id=\"E\" tabindex=\"0\" role=\"button\" aria-label=\"Area E\">\n<circle cx=\"100\" cy=\"260\" r=\"15\" fill=\"var(--zone-fill)\" stroke=\"var(--zone-ink)\" stroke-width=\"2.5\"/>\n<text x=\"100\" y=\"265.5\" text-anchor=\"middle\" font-family=\"Georgia, 'Times New Roman', serif\" font-size=\"16\" font-weight=\"700\" fill=\"var(--zone-ink)\">E</text></g></svg>"},{"n":669,"t":"mc","visit":"Visit 1 (continued)","s":"What is the **definitive** management?","opts":["Oral antibiotics and a recheck in 1 week","Back blows now while he is breathing well","Rigid bronchoscopy to remove the object","Inhaled albuterol every 4 hours at home"],"correctIdx":[2],"answer":"C","c":"Suspected foreign body aspiration needs rigid bronchoscopy for diagnosis and removal, even if x-rays are normal, because most objects such as peanuts are radiolucent; inspiratory and expiratory films may show air trapping on the affected side. Back blows and chest or abdominal thrusts are for complete airway obstruction in a child who cannot cough, cry or speak. Whole nuts should be avoided in children under 4."}]},{"no":224,"batch":9,"title":"Amelia: An Itchy Scalp","setting":"Primary care clinic • School-age child • Dermatology","scenario":"Amelia is a 7-year-old girl whose school nurse found live lice and nits in her hair. She has been scratching the back of her head and behind her ears for 2 weeks. Small white specks are firmly attached to hair shafts within a quarter inch of the scalp, and a few live lice are seen. She has a 4-year-old brother and a 6-month-old sister.","qs":[{"n":670,"t":"mc","visit":"Visit 1","s":"What is the **usual** first-line treatment for head lice?","opts":["Oral ivermectin for the whole family","Permethrin 1% lotion, repeated on day 9","Lindane shampoo as the first choice","Shaving the head of the affected child"],"correctIdx":[1],"answer":"B","c":"Over-the-counter permethrin 1% (or pyrethrins) is commonly used first-line, applied to dry hair and rinsed after 10 minutes, then repeated on day 9 because it does not kill all eggs. Where resistance is common, prescription options such as ivermectin lotion, spinosad or malathion are used. Lindane is neurotoxic and not recommended. Wet combing with a fine-tooth comb is a useful adjunct."},{"n":671,"t":"sata","visit":"Visit 1 (continued)","s":"Which statements about head lice are **correct**? **Select all that apply.**","opts":["Household members should be checked and treated if infested","Lice show that the family has poor hygiene","Pets must be treated because they carry head lice","Lice spread mainly through direct head-to-head contact","Children can return to school after treatment starts"],"correctIdx":[0,3,4],"answer":"A, D, E","c":"Head lice spread mainly through direct head-to-head contact and less often through shared hats, combs or bedding. Household contacts should be checked and those with live lice treated at the same time. The AAP recommends that children not be excluded from school (\"no-nit\" policies are discouraged). Lice are not a sign of poor hygiene and are not spread by pets."},{"n":672,"t":"mc","visit":"Visit 1 (continued)","s":"Which household measure is **appropriate**?","opts":["Throw away all of the child's stuffed toys","Have the whole family shave their heads","Wash recently used bedding and hats in hot water","Spray the entire house with an insecticide"],"correctIdx":[2],"answer":"C","c":"Lice do not survive long off the scalp, so extensive cleaning is not needed. Bedding, hats and clothing used in the previous 2 days can be machine-washed and dried on high heat, and items that cannot be washed can be sealed in a bag for 2 weeks. Combs and brushes can be soaked in hot water. Insecticide sprays are unnecessary and potentially harmful."}]},{"no":225,"batch":9,"title":"Baby Jonah: A Flat Spot and a Head Tilt","setting":"Well-child visit • Infant • Musculoskeletal / Development","scenario":"Jonah is a 2-month-old boy who always turns his head to the left and tilts it to the right. His mother says he prefers feeding from one side. The FNP notes flattening of the back of his skull on the left, with the left ear pushed slightly forward. A small, firm, non-tender mass is felt in the right sternocleidomastoid muscle. His hips are normal. He sleeps on his back.","qs":[{"n":673,"t":"mc","visit":"Visit 1","s":"What is the **most likely** cause of his head position?","opts":["Craniosynostosis of the lambdoid suture","Congenital muscular torticollis","Infantile spasms from epilepsy","Cervical spine fracture at birth"],"correctIdx":[1],"answer":"B","c":"Congenital muscular torticollis is caused by a tight or shortened sternocleidomastoid muscle, sometimes with a palpable fibrous \"tumor,\" and causes the head to tilt toward the affected side and turn the chin away. It is associated with positional plagiocephaly and developmental dysplasia of the hip. Lambdoid craniosynostosis causes a trapezoid head shape with the ear pushed backward, not forward."},{"n":674,"t":"mc","visit":"Visit 1 (continued)","s":"What is the **first-line** treatment?","opts":["Stretching exercises and repositioning with physical therapy","A rigid cervical collar worn day and night","Surgical release of the neck muscle this month","Placing him to sleep on his stomach to help"],"correctIdx":[0],"answer":"A","c":"Most infants with congenital muscular torticollis improve with early physical therapy: gentle stretching, positioning to encourage turning toward the opposite side, supervised tummy time while awake and changing feeding and crib positions. Surgery is rarely needed for cases that persist past 12–18 months. Infants must always be placed on their backs to sleep."},{"n":675,"t":"sata","visit":"Visit 1 (continued)","s":"Which measures help **prevent and treat** positional plagiocephaly? **Select all that apply.**","opts":["Supervised tummy time while awake","Placing him prone to sleep at night","Using a pillow to support his head in bed","Limiting time in car seats and swings","Alternating head position at bedtime"],"correctIdx":[0,3,4],"answer":"A, D, E","c":"Positional plagiocephaly is common since the Back to Sleep campaign. Prevention and treatment include supervised tummy time while awake, alternating the direction the head faces in the crib, changing holding and feeding positions and limiting time in car seats, bouncers and swings. Back sleeping remains essential, and pillows and positioners should not be used. A cranial helmet may be considered for moderate to severe cases that persist."}]},{"no":226,"batch":10,"title":"Mr. Quinn: Shaky Hands at the Coffee Cup","setting":"Primary care clinic • Older adult • Neurology","scenario":"Mr. Quinn is a 72-year-old man with a tremor of both hands for 10 years that has slowly worsened. It is most noticeable when he holds a cup, writes or buttons his shirt, and it disappears at rest. His head also shakes slightly \"no-no.\" A glass of wine improves it. His father had the same tremor. He has no rigidity, slowness or shuffling gait. He has asthma.","qs":[{"n":676,"t":"mc","visit":"Visit 1","s":"What is the **most likely** diagnosis?","opts":["Cerebellar tremor","Hyperthyroid tremor","Parkinson disease","Essential tremor"],"correctIdx":[3],"answer":"D","c":"Essential tremor is the most common movement disorder. It causes a bilateral postural and action tremor of the hands (holding, writing, drinking), often with head or voice tremor, and is frequently familial (autosomal dominant). It often improves with alcohol. Parkinson disease causes an asymmetric resting tremor with bradykinesia and rigidity, and cerebellar tremor is an intention tremor with ataxia."},{"n":677,"t":"mc","visit":"Visit 1 (continued)","s":"His tremor interferes with eating. Which medication is **most appropriate** given his asthma?","opts":["Primidone at a low bedtime dose","Carbidopa–levodopa three times a day","Propranolol, a nonselective beta-blocker","Haloperidol for movement control"],"correctIdx":[0],"answer":"A","c":"Propranolol and primidone are first-line drugs for essential tremor. Propranolol is a nonselective beta-blocker and is contraindicated in asthma because it can cause bronchospasm, so primidone is preferred for Mr. Quinn; it is started at a low dose at bedtime because of sedation and dizziness. Levodopa does not help essential tremor, and antipsychotics can cause drug-induced parkinsonism."},{"n":678,"t":"sata","visit":"Visit 2 (6 months later)","s":"Which non-drug strategies or options can help his tremor? **Select all that apply.**","opts":["Weighted utensils and cups with lids","Drinking alcohol daily to control it","Occupational therapy","Deep brain stimulation for severe, refractory tremor","Extra caffeine each morning"],"correctIdx":[0,2,3],"answer":"A, C, D","c":"Adaptive devices (weighted utensils, lidded cups, wrist weights) and occupational therapy help with daily activities. For severe tremor that does not respond to medication, deep brain stimulation of the thalamus or focused ultrasound thalamotomy are effective. Caffeine, stress and fatigue worsen tremor, and regular alcohol use is not a safe treatment."}]},{"no":227,"batch":10,"title":"Mr. Lombardi: Yellow Without Pain","setting":"Primary care clinic • Older adult • Gastrointestinal / Oncology","scenario":"Mr. Lombardi is a 74-year-old man who smoked for 40 years and was diagnosed with diabetes 6 months ago. His wife noticed his eyes are yellow. He has dark urine, pale stools, generalized itching, poor appetite and a 20-lb weight loss over 3 months, but no abdominal pain or fever. On examination he is jaundiced and has a non-tender, palpable gallbladder.","qs":[{"n":679,"t":"mc","visit":"Visit 1","s":"Which diagnosis is the **most important** concern?","opts":["Acute cholecystitis from gallstones","Cancer of the head of the pancreas","Gilbert syndrome under stress","Acute viral hepatitis A infection"],"correctIdx":[1],"answer":"B","c":"Painless obstructive jaundice with weight loss in an older adult is pancreatic cancer (head of pancreas) until proven otherwise. A palpable, non-tender gallbladder with jaundice (Courvoisier sign) suggests malignant obstruction of the common bile duct rather than stones. Smoking, new-onset diabetes after 50, chronic pancreatitis, obesity and family history are risk factors."},{"n":680,"t":"hot","visit":"Visit 1 (continued)","s":"**Click the region where the enlarged gallbladder is palpated.**","answer":"A","c":"The gallbladder lies in the right upper quadrant beneath the liver edge, at the tip of the ninth costal cartilage in the midclavicular line. A distended gallbladder from distal bile duct obstruction can be felt there as a smooth, non-tender mass. Murphy sign (inspiratory arrest with palpation) in the same area suggests acute cholecystitis.","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 400 320\" width=\"100%\" height=\"auto\"><rect width=\"400\" height=\"320\" fill=\"none\"/><path d=\"M 90 30 Q 200 10 310 30 Q 330 160 310 300 L 90 300 Q 70 160 90 30 Z\" fill=\"var(--skin)\" stroke=\"var(--diagram-ink)\" stroke-width=\"2.5\"/>\n<path d=\"M 90 70 Q 200 120 310 70\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-width=\"2\" stroke-opacity=\"0.5\"/>\n<line x1=\"200\" y1=\"40\" x2=\"200\" y2=\"296\" stroke=\"var(--diagram-ink)\" stroke-width=\"1.5\" stroke-dasharray=\"6 5\" stroke-opacity=\"0.55\"/>\n<line x1=\"84\" y1=\"170\" x2=\"316\" y2=\"170\" stroke=\"var(--diagram-ink)\" stroke-width=\"1.5\" stroke-dasharray=\"6 5\" stroke-opacity=\"0.55\"/>\n<circle cx=\"200\" cy=\"170\" r=\"6\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-width=\"2\"/>\n<path d=\"M 108 262 Q 150 285 196 296\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-width=\"2\" stroke-opacity=\"0.5\"/>\n<path d=\"M 292 262 Q 250 285 204 296\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-width=\"2\" stroke-opacity=\"0.5\"/>\n<text x=\"40\" y=\"20\" font-family=\"Arial, sans-serif\" font-size=\"12\" font-weight=\"700\" fill=\"var(--diagram-ink)\" text-anchor=\"start\">Patient's RIGHT</text><text x=\"268\" y=\"20\" font-family=\"Arial, sans-serif\" font-size=\"12\" font-weight=\"700\" fill=\"var(--diagram-ink)\" text-anchor=\"start\">Patient's LEFT</text><text x=\"206\" y=\"186\" font-family=\"Arial, sans-serif\" font-size=\"10\" font-weight=\"400\" fill=\"var(--diagram-ink)\" text-anchor=\"start\">umbilicus</text><g class=\"zone\" data-id=\"A\" tabindex=\"0\" role=\"button\" aria-label=\"Area A\">\n<circle cx=\"140\" cy=\"112\" r=\"15\" fill=\"var(--zone-fill)\" stroke=\"var(--zone-ink)\" stroke-width=\"2.5\"/>\n<text x=\"140\" y=\"117.5\" text-anchor=\"middle\" font-family=\"Georgia, 'Times New Roman', serif\" font-size=\"16\" font-weight=\"700\" fill=\"var(--zone-ink)\">A</text></g><g class=\"zone\" data-id=\"B\" tabindex=\"0\" role=\"button\" aria-label=\"Area B\">\n<circle cx=\"200\" cy=\"92\" r=\"15\" fill=\"var(--zone-fill)\" stroke=\"var(--zone-ink)\" stroke-width=\"2.5\"/>\n<text x=\"200\" y=\"97.5\" text-anchor=\"middle\" font-family=\"Georgia, 'Times New Roman', serif\" font-size=\"16\" font-weight=\"700\" fill=\"var(--zone-ink)\">B</text></g><g class=\"zone\" data-id=\"C\" tabindex=\"0\" role=\"button\" aria-label=\"Area C\">\n<circle cx=\"262\" cy=\"112\" r=\"15\" fill=\"var(--zone-fill)\" stroke=\"var(--zone-ink)\" stroke-width=\"2.5\"/>\n<text x=\"262\" y=\"117.5\" text-anchor=\"middle\" font-family=\"Georgia, 'Times New Roman', serif\" font-size=\"16\" font-weight=\"700\" fill=\"var(--zone-ink)\">C</text></g><g class=\"zone\" data-id=\"D\" tabindex=\"0\" role=\"button\" aria-label=\"Area D\">\n<circle cx=\"168\" cy=\"150\" r=\"15\" fill=\"var(--zone-fill)\" stroke=\"var(--zone-ink)\" stroke-width=\"2.5\"/>\n<text x=\"168\" y=\"155.5\" text-anchor=\"middle\" font-family=\"Georgia, 'Times New Roman', serif\" font-size=\"16\" font-weight=\"700\" fill=\"var(--zone-ink)\">D</text></g><g class=\"zone\" data-id=\"E\" tabindex=\"0\" role=\"button\" aria-label=\"Area E\">\n<circle cx=\"264\" cy=\"228\" r=\"15\" fill=\"var(--zone-fill)\" stroke=\"var(--zone-ink)\" stroke-width=\"2.5\"/>\n<text x=\"264\" y=\"233.5\" text-anchor=\"middle\" font-family=\"Georgia, 'Times New Roman', serif\" font-size=\"16\" font-weight=\"700\" fill=\"var(--zone-ink)\">E</text></g></svg>"},{"n":681,"t":"mc","visit":"Visit 1 (continued)","s":"Which imaging test is **preferred** to evaluate suspected pancreatic cancer?","opts":["Plain abdominal x-ray in two views","Nuclear medicine HIDA scan alone","Pancreas-protocol CT of the abdomen","Upper GI series with barium contrast"],"correctIdx":[2],"answer":"C","c":"A multiphase pancreas-protocol CT is the preferred test to detect pancreatic cancer and assess resectability; endoscopic ultrasound with biopsy is used for tissue diagnosis, and ERCP can place a stent to relieve biliary obstruction. CA 19-9 is used for monitoring, not screening. A HIDA scan evaluates acute cholecystitis."}]},{"no":228,"batch":10,"title":"Mr. Vos: Itching After a Hot Shower","setting":"Primary care clinic • Older adult • Hematology","scenario":"Mr. Vos is a 68-year-old non-smoking man with headaches, dizziness and intense itching after warm showers. He has a ruddy face and burning, red fingers and toes. His spleen tip is palpable. Hemoglobin is 19.2 g/dL, hematocrit 58%, platelets 620,000/mm³ and WBC 13,500/mm³. Oxygen saturation is 98% and he has no sleep apnea.","qs":[{"n":682,"t":"mc","visit":"Visit 1","s":"What is the **most likely** diagnosis?","opts":["Polycythemia vera (PV)","Chronic myeloid leukemia","Simple dehydration only","Secondary polycythemia"],"correctIdx":[0],"answer":"A","c":"Polycythemia vera is a myeloproliferative neoplasm with an increased red cell mass, often with raised WBC and platelets and splenomegaly. Symptoms include headache, dizziness, aquagenic pruritus (itching after warm water), facial plethora, erythromelalgia (burning red hands and feet) and thrombosis. Secondary polycythemia from hypoxia (smoking, COPD, sleep apnea) or EPO-secreting tumors raises only red cells."},{"n":683,"t":"mc","visit":"Visit 1 (continued)","s":"Which test **confirms** the diagnosis in most patients?","opts":["Serum ferritin and iron levels","JAK2 V617F mutation testing","Direct antiglobulin (Coombs) test","Hemoglobin electrophoresis"],"correctIdx":[1],"answer":"B","c":"More than 95% of patients with polycythemia vera have a JAK2 mutation (V617F or exon 12), and serum erythropoietin is usually low. In secondary polycythemia, erythropoietin is normal or high. Bone marrow biopsy can support the diagnosis. Hematology referral is needed."},{"n":684,"t":"sata","visit":"Visit 2 (hematology plan)","s":"Which treatments are **standard** for his condition? **Select all that apply.**","opts":["Therapeutic phlebotomy to a hematocrit below 45%","Testosterone to boost energy","Iron supplements to replace losses","Hydroxyurea because he is over 60","Low-dose aspirin"],"correctIdx":[0,3,4],"answer":"A, D, E","c":"Polycythemia vera is managed with phlebotomy to keep the hematocrit below 45%, low-dose aspirin to reduce thrombosis, and cytoreductive therapy (hydroxyurea or interferon) for high-risk patients, defined as age 60 or older or prior thrombosis. Iron supplements would stimulate red cell production, and testosterone raises hematocrit. Cardiovascular risk factors should be controlled."}]},{"no":229,"batch":10,"title":"Mrs. Afolabi: An Overdue Eye Check","setting":"Diabetes follow-up • Older adult • Eye / Endocrine","scenario":"Mrs. Afolabi is a 66-year-old woman who has had type 2 diabetes for 15 years, with hypertension and an A1c of 9.2%. She has not had an eye examination in 4 years. She reports no vision changes. A retinal photo taken in clinic shows dot-and-blot hemorrhages, microaneurysms, hard exudates and new fragile vessels growing on the optic disc.","qs":[{"n":685,"t":"mc","visit":"Visit 1","s":"Her retinal photo shows new vessels on the optic disc. What does this indicate?","opts":["Proliferative diabetic retinopathy","Hypertensive retinopathy only","Normal age-related retinal change","Mild nonproliferative retinopathy"],"correctIdx":[0],"answer":"A","c":"Diabetic retinopathy is classified as nonproliferative (microaneurysms, dot-and-blot hemorrhages, hard exudates, cotton-wool spots) or proliferative, defined by neovascularization of the disc or retina. New vessels are fragile and can bleed (vitreous hemorrhage) or cause tractional retinal detachment. Retinopathy can be advanced with no symptoms."},{"n":686,"t":"mc","visit":"Visit 1 (continued)","s":"What is the **most appropriate** action?","opts":["Prompt ophthalmology referral for treatment","Start eye drops for glaucoma today","Repeat the retinal photo in 2 years","Reassure her since her vision is normal"],"correctIdx":[0],"answer":"A","c":"Proliferative diabetic retinopathy and diabetic macular edema need prompt referral to an ophthalmologist for treatment such as anti-VEGF injections or panretinal laser photocoagulation, which greatly reduce the risk of vision loss. Improving glucose, BP and lipid control also slows progression."},{"n":687,"t":"mc","visit":"Visit 1 (continued)","s":"How often should a person with type 2 diabetes and **no** retinopathy have eye screening?","opts":["Only when vision becomes blurry","Only once at diagnosis and never again","Every 1–2 years after a normal exam","Every 10 years if the A1c stays normal"],"correctIdx":[2],"answer":"C","c":"People with type 2 diabetes should have a dilated eye exam or retinal imaging at diagnosis, because retinopathy may already be present. If there is no retinopathy and glycemia is well controlled, screening every 1–2 years is reasonable; any retinopathy requires at least yearly exams. Type 1 diabetes screening starts within 5 years of diagnosis. Pregnancy requires closer monitoring."}]},{"no":230,"batch":10,"title":"Mrs. Clarke-Owen: Fluid Around the Lung","setting":"Primary care clinic • Older adult • Respiratory / Cardiovascular","scenario":"Mrs. Clarke-Owen is a 77-year-old woman with heart failure who has increasing shortness of breath. Breath sounds are absent and percussion is dull over the right lower chest, with decreased tactile fremitus. Chest x-ray shows a moderate right pleural effusion with blunting of the costophrenic angle. A diagnostic thoracentesis is planned.","qs":[{"n":688,"t":"mc","visit":"Visit 1","s":"Which physical findings are **typical** of a pleural effusion?","opts":["Normal percussion with diffuse expiratory wheeze","Dullness with decreased fremitus and breath sounds","Dullness with increased fremitus and egophony","Hyperresonance with decreased breath sounds"],"correctIdx":[1],"answer":"B","c":"A pleural effusion causes dullness to percussion, decreased or absent breath sounds and decreased tactile fremitus over the fluid. Consolidation (pneumonia) causes dullness with increased fremitus, bronchial breath sounds and egophony. Pneumothorax causes hyperresonance with decreased breath sounds, and asthma causes diffuse wheezing."},{"n":689,"t":"mc","visit":"Visit 2 (fluid results)","s":"Which criteria are used to classify the fluid as a **transudate or exudate**?","opts":["Wells criteria for pulmonary embolism","Light's criteria comparing protein and LDH","Centor criteria for strep pharyngitis","CURB-65 criteria for pneumonia"],"correctIdx":[1],"answer":"B","c":"Light's criteria identify an exudate if any one is met: pleural fluid protein to serum protein ratio above 0.5, pleural fluid LDH to serum LDH ratio above 0.6, or pleural fluid LDH above two-thirds of the upper limit of normal serum LDH. Transudates result from altered pressures (heart failure, cirrhosis, nephrotic syndrome), and exudates from inflammation or malignancy."},{"n":690,"t":"match","visit":"Visit 2 (teaching)","s":"**Drag each pleural fluid result to the most likely cause.** One option will not be used.","items":["Transudate in a patient with an S3 and edema","Exudate with low pH, low glucose and pus","Bloody exudate with weight loss in a smoker"],"tgts":["Heart failure","Empyema from pneumonia","Primary spontaneous pneumothorax","Malignant pleural effusion"],"map":[0,1,3],"answer":"1–A, 2–B, 3–D","c":"Heart failure is the most common cause of a transudative effusion, often bilateral, and is treated with diuresis. An exudate with low pH, low glucose, positive Gram stain or frank pus indicates empyema, which requires chest tube drainage and antibiotics. A bloody exudate with weight loss in a smoker suggests malignancy (lung cancer, metastases or mesothelioma), and cytology is sent. A pneumothorax is air, not fluid."}]},{"no":231,"batch":10,"title":"Mr. Agbaje: Muffled Hearing in One Ear","setting":"Primary care clinic • Older adult • ENT","scenario":"Mr. Agbaje is an 80-year-old man who uses hearing aids. For 2 weeks the hearing in his left ear has been muffled, and the ear feels full and itchy. He uses cotton swabs daily to clean his ears. Otoscopy of the left ear shows the canal completely blocked by hard, dark brown wax; the eardrum cannot be seen. He has no ear pain, discharge, fever or history of eardrum perforation or ear surgery.","qs":[{"n":691,"t":"mc","visit":"Visit 1","s":"What is the **most likely** cause of his symptoms?","opts":["Acute otitis externa","Ménière disease","Cerumen impaction","Acoustic neuroma"],"correctIdx":[2],"answer":"C","c":"Cerumen impaction is common in older adults, especially those who use hearing aids or cotton swabs, which push wax deeper. It causes conductive hearing loss, fullness, itching, tinnitus, dizziness or cough. Otoscopy shows wax blocking the canal. Otitis externa causes ear pain with tragal tenderness and canal swelling."},{"n":692,"t":"mc","visit":"Visit 1 (continued)","s":"Which treatment is **appropriate** for Mr. Agbaje?","opts":["Oral antibiotics for 10 days to clear the wax","Softening drops, then irrigation or manual removal","Pushing the wax deeper with a cotton swab","Ear candling performed at home by his family"],"correctIdx":[1],"answer":"B","c":"Cerumen impaction is treated with cerumenolytic drops (water, saline, carbamide peroxide or docusate) for several days, followed by irrigation with body-temperature water or manual removal with a curette or suction. Irrigation is avoided with a known perforation, tympanostomy tubes, prior ear surgery, diabetes with risk of otitis externa or immunosuppression. Ear candling is ineffective and dangerous."},{"n":693,"t":"sata","visit":"Visit 1 (continued)","s":"Which prevention advice is **correct**? **Select all that apply.**","opts":["Stop using cotton swabs in the ear canal","Use softening drops periodically if wax builds up","Clean the ear canal daily with a hairpin","Use ear candles each month to draw wax out","Have regular ear checks because he uses hearing aids"],"correctIdx":[0,1,4],"answer":"A, B, E","c":"Cotton swabs and other objects push wax deeper and can injure the canal or eardrum, so they should be avoided. Hearing aid users should have their ears checked regularly (often every 3–6 months) because aids block normal wax migration. Periodic cerumenolytic drops can help prevent impaction. Ear candles do not work and can cause burns and canal obstruction."}]},{"no":232,"batch":10,"title":"Mrs. Szabo: Pain Out of Proportion","setting":"Urgent visit • Older adult • Gastrointestinal / Vascular","scenario":"Mrs. Szabo is an 81-year-old woman with atrial fibrillation who stopped taking her apixaban a month ago because of cost. Three hours ago she developed sudden, severe, poorly localized abdominal pain with vomiting and one loose stool. She is writhing in pain, but her abdomen is soft with only mild tenderness. HR is 116 and irregular. Lactate is elevated.","qs":[{"n":694,"t":"mc","visit":"Visit 1","s":"What is the **most likely** diagnosis?","opts":["Uncomplicated diverticulosis","Irritable bowel syndrome flare","Acute viral gastroenteritis","Acute mesenteric ischemia"],"correctIdx":[3],"answer":"D","c":"Acute mesenteric ischemia, most often from an embolus to the superior mesenteric artery in a patient with atrial fibrillation, classically causes sudden severe abdominal pain out of proportion to the examination findings, often with vomiting and an urge to defecate. Lactate may be elevated. Without prompt treatment, bowel infarction, peritonitis and death follow; mortality is high."},{"n":695,"t":"hot","visit":"Visit 1 (continued)","s":"Embolic mesenteric ischemia most often affects the small bowel supplied by the superior mesenteric artery. **Click the region where pain is typically felt early.**","answer":"C","c":"Pain from the small bowel and midgut (supplied by the superior mesenteric artery) is typically felt in the periumbilical region early on, because visceral pain is poorly localized to the midline. As ischemia progresses to transmural infarction and peritonitis, the abdomen becomes tender, rigid and distended.","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 400 320\" width=\"100%\" height=\"auto\"><rect width=\"400\" height=\"320\" fill=\"none\"/><path d=\"M 90 30 Q 200 10 310 30 Q 330 160 310 300 L 90 300 Q 70 160 90 30 Z\" fill=\"var(--skin)\" stroke=\"var(--diagram-ink)\" stroke-width=\"2.5\"/>\n<path d=\"M 90 70 Q 200 120 310 70\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-width=\"2\" stroke-opacity=\"0.5\"/>\n<line x1=\"200\" y1=\"40\" x2=\"200\" y2=\"296\" stroke=\"var(--diagram-ink)\" stroke-width=\"1.5\" stroke-dasharray=\"6 5\" stroke-opacity=\"0.55\"/>\n<line x1=\"84\" y1=\"170\" x2=\"316\" y2=\"170\" stroke=\"var(--diagram-ink)\" stroke-width=\"1.5\" stroke-dasharray=\"6 5\" stroke-opacity=\"0.55\"/>\n<circle cx=\"200\" cy=\"170\" r=\"6\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-width=\"2\"/>\n<path d=\"M 108 262 Q 150 285 196 296\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-width=\"2\" stroke-opacity=\"0.5\"/>\n<path d=\"M 292 262 Q 250 285 204 296\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-width=\"2\" stroke-opacity=\"0.5\"/>\n<text x=\"40\" y=\"20\" font-family=\"Arial, sans-serif\" font-size=\"12\" font-weight=\"700\" fill=\"var(--diagram-ink)\" text-anchor=\"start\">Patient's RIGHT</text><text x=\"268\" y=\"20\" font-family=\"Arial, sans-serif\" font-size=\"12\" font-weight=\"700\" fill=\"var(--diagram-ink)\" text-anchor=\"start\">Patient's LEFT</text><text x=\"206\" y=\"186\" font-family=\"Arial, sans-serif\" font-size=\"10\" font-weight=\"400\" fill=\"var(--diagram-ink)\" text-anchor=\"start\">umbilicus</text><g class=\"zone\" data-id=\"A\" tabindex=\"0\" role=\"button\" aria-label=\"Area A\">\n<circle cx=\"140\" cy=\"112\" r=\"15\" fill=\"var(--zone-fill)\" stroke=\"var(--zone-ink)\" stroke-width=\"2.5\"/>\n<text x=\"140\" y=\"117.5\" text-anchor=\"middle\" font-family=\"Georgia, 'Times New Roman', serif\" font-size=\"16\" font-weight=\"700\" fill=\"var(--zone-ink)\">A</text></g><g class=\"zone\" data-id=\"B\" tabindex=\"0\" role=\"button\" aria-label=\"Area B\">\n<circle cx=\"262\" cy=\"112\" r=\"15\" fill=\"var(--zone-fill)\" stroke=\"var(--zone-ink)\" stroke-width=\"2.5\"/>\n<text x=\"262\" y=\"117.5\" text-anchor=\"middle\" font-family=\"Georgia, 'Times New Roman', serif\" font-size=\"16\" font-weight=\"700\" fill=\"var(--zone-ink)\">B</text></g><g class=\"zone\" data-id=\"C\" tabindex=\"0\" role=\"button\" aria-label=\"Area C\">\n<circle cx=\"168\" cy=\"150\" r=\"15\" fill=\"var(--zone-fill)\" stroke=\"var(--zone-ink)\" stroke-width=\"2.5\"/>\n<text x=\"168\" y=\"155.5\" text-anchor=\"middle\" font-family=\"Georgia, 'Times New Roman', serif\" font-size=\"16\" font-weight=\"700\" fill=\"var(--zone-ink)\">C</text></g><g class=\"zone\" data-id=\"D\" tabindex=\"0\" role=\"button\" aria-label=\"Area D\">\n<circle cx=\"136\" cy=\"228\" r=\"15\" fill=\"var(--zone-fill)\" stroke=\"var(--zone-ink)\" stroke-width=\"2.5\"/>\n<text x=\"136\" y=\"233.5\" text-anchor=\"middle\" font-family=\"Georgia, 'Times New Roman', serif\" font-size=\"16\" font-weight=\"700\" fill=\"var(--zone-ink)\">D</text></g><g class=\"zone\" data-id=\"E\" tabindex=\"0\" role=\"button\" aria-label=\"Area E\">\n<circle cx=\"264\" cy=\"228\" r=\"15\" fill=\"var(--zone-fill)\" stroke=\"var(--zone-ink)\" stroke-width=\"2.5\"/>\n<text x=\"264\" y=\"233.5\" text-anchor=\"middle\" font-family=\"Georgia, 'Times New Roman', serif\" font-size=\"16\" font-weight=\"700\" fill=\"var(--zone-ink)\">E</text></g></svg>"},{"n":696,"t":"mc","visit":"Visit 1 (continued)","s":"What is the **most appropriate** action?","opts":["Restart apixaban and see her in a week","Bowel rest at home and a recheck tomorrow","Emergency transfer for CT angiography and surgery","An oral laxative and a fiber supplement"],"correctIdx":[2],"answer":"C","c":"Suspected acute mesenteric ischemia is a surgical emergency. She needs emergency transfer for CT angiography, IV fluids, anticoagulation with heparin, broad-spectrum antibiotics and urgent vascular or surgical intervention (embolectomy, endovascular therapy or resection of dead bowel). Medication cost barriers to anticoagulation should be addressed afterward."}]},{"no":233,"batch":10,"title":"Mr. Abiodun: Foamy Urine and Swollen Legs","setting":"Primary care clinic • Middle adult • Renal","scenario":"Mr. Abiodun is a 55-year-old man with 6 weeks of swelling of his legs and around his eyes in the morning and foamy urine. He has gained 15 lb. BP is 132/84. Urinalysis shows 4+ protein without blood. His urine protein-to-creatinine ratio is 6.2 g/g, serum albumin 2.4 g/dL, and total cholesterol 340 mg/dL. Creatinine is normal. He does not have diabetes.","qs":[{"n":697,"t":"mc","visit":"Visit 1","s":"Which syndrome does Mr. Abiodun have?","opts":["Nephritic syndrome","Nephrotic syndrome","Prerenal kidney injury","Acute pyelonephritis"],"correctIdx":[1],"answer":"B","c":"Nephrotic syndrome is defined by proteinuria above 3.5 g/day (or a protein-to-creatinine ratio above 3.5 g/g), hypoalbuminemia, edema and hyperlipidemia, usually without hematuria. In adults, membranous nephropathy and focal segmental glomerulosclerosis are common primary causes, and diabetes is the most common secondary cause. A kidney biopsy and nephrology referral are usually needed."},{"n":698,"t":"sata","visit":"Visit 1 (continued)","s":"Which complications is he at **increased risk** of? **Select all that apply.**","opts":["Polycythemia from high erythropoietin","Accelerated atherosclerosis from high lipids","Hypercalcemia from vitamin D excess","Infections from loss of immunoglobulins","Venous thromboembolism, including renal vein thrombosis"],"correctIdx":[1,3,4],"answer":"B, D, E","c":"Nephrotic syndrome causes loss of anticoagulant proteins such as antithrombin III, increasing venous and arterial thrombosis (especially in membranous nephropathy). Urinary loss of immunoglobulins raises infection risk, and hyperlipidemia accelerates atherosclerosis. Vitamin D–binding protein is also lost, which tends to lower, not raise, calcium."},{"n":699,"t":"mc","visit":"Visit 1 (continued)","s":"Which medication **reduces** his proteinuria?","opts":["A thiazide diuretic alone","A potassium supplement","A daily NSAID for edema","An ACE inhibitor or ARB"],"correctIdx":[3],"answer":"D","c":"ACE inhibitors or ARBs reduce intraglomerular pressure and proteinuria and slow progression of kidney disease, even when BP is near normal. Edema is treated with sodium restriction and loop diuretics, and a statin treats hyperlipidemia. Specific therapy (such as immunosuppression) depends on the biopsy findings. NSAIDs reduce kidney blood flow and should be avoided."}]},{"no":234,"batch":10,"title":"Ms. Moreau: Milk Without a Baby","setting":"Primary care clinic • Middle adult • Endocrine","scenario":"Ms. Moreau is a 41-year-old woman with 8 months of irregular, then absent, periods and a milky discharge from both nipples. She has had headaches and has noticed she bumps into door frames on both sides. She is not pregnant and takes no medications. Her prolactin is 210 ng/mL (normal under 25). TSH is normal.","qs":[{"n":700,"t":"mc","visit":"Visit 1","s":"Her visual problem is **most likely** which field defect?","opts":["Central scotoma in one eye","Right homonymous hemianopia","Complete blindness in one eye","Bitemporal hemianopia"],"correctIdx":[3],"answer":"D","c":"A pituitary macroadenoma growing upward compresses the optic chiasm, where the nasal retinal fibers cross, causing bitemporal hemianopia (loss of the outer visual fields on both sides). Patients may bump into objects on either side. Formal visual field testing is needed. Homonymous hemianopia results from lesions behind the chiasm, such as a stroke."},{"n":701,"t":"mc","visit":"Visit 1 (continued)","s":"Which test is **next** to evaluate her very high prolactin?","opts":["MRI of the pituitary with contrast","A CT scan of the chest and abdomen","Mammogram with breast ultrasound","A 24-hour urine cortisol collection"],"correctIdx":[0],"answer":"A","c":"After excluding pregnancy, hypothyroidism, medications (antipsychotics, metoclopramide, some antidepressants) and kidney disease, a markedly elevated prolactin warrants pituitary MRI. A prolactin above about 200 ng/mL usually indicates a prolactinoma. Other pituitary hormones are also checked because a macroadenoma can cause hypopituitarism."},{"n":702,"t":"mc","visit":"Visit 2 (results)","s":"MRI shows a 1.6-cm prolactinoma. What is the **first-line** treatment?","opts":["Immediate transsphenoidal surgery","Radiation therapy to the pituitary","An antipsychotic such as risperidone","A dopamine agonist such as cabergoline"],"correctIdx":[3],"answer":"D","c":"Dopamine agonists, especially cabergoline (or bromocriptine), are first-line treatment for prolactinomas, even large ones with visual field defects; they lower prolactin, shrink the tumor and often restore vision and menses. Surgery is for patients who do not respond or cannot tolerate medication. Antipsychotics raise prolactin because they block dopamine."}]},{"no":235,"batch":10,"title":"Mr. Hendricks: Stabbing Pain Behind One Eye","setting":"Primary care clinic • Middle adult • Neurology","scenario":"Mr. Hendricks is a 44-year-old man who smokes. For 3 weeks he has had attacks of excruciating, stabbing pain behind his right eye, lasting 45–90 minutes, once or twice a day, often waking him at the same time at night. During attacks his right eye waters and turns red, his right nostril runs, his right eyelid droops, and he paces the room. He had similar episodes for a month 2 years ago.","qs":[{"n":703,"t":"mc","visit":"Visit 1","s":"What is the **most likely** diagnosis?","opts":["Cluster headache","Tension-type headache","Trigeminal neuralgia","Migraine without aura"],"correctIdx":[0],"answer":"A","c":"Cluster headache causes severe unilateral orbital or temporal pain lasting 15–180 minutes, occurring up to eight times a day in \"clusters\" lasting weeks to months, often at the same time of day or night. It is accompanied by ipsilateral autonomic features (tearing, conjunctival redness, rhinorrhea, ptosis, miosis) and restlessness. It is more common in men and smokers. Trigeminal neuralgia attacks last only seconds."},{"n":704,"t":"mc","visit":"Visit 1 (continued)","s":"What is the **first-line** acute treatment for a cluster attack?","opts":["Oral ibuprofen at the start of each attack","Oral acetaminophen with caffeine as needed","High-flow 100% oxygen via a non-rebreather mask","Oral oxycodone at the first sign of pain"],"correctIdx":[2],"answer":"C","c":"High-flow 100% oxygen (12–15 L/min by non-rebreather mask for 15–20 minutes) and subcutaneous or intranasal sumatriptan are first-line acute treatments for cluster headache. Oral analgesics act too slowly. Preventive treatment with verapamil (with ECG monitoring) is started during a cluster period, often with a short steroid course as bridging therapy."},{"n":705,"t":"match","visit":"Visit 2 (teaching)","s":"**Drag each primary headache type to its classic description.** One option will not be used.","items":["Tension-type headache","Migraine","Cluster headache"],"tgts":["Unilateral throbbing pain with nausea and light sensitivity, better lying still in the dark","Worst headache of life reaching peak intensity within a minute","Bilateral band-like pressure without nausea or light sensitivity","Unilateral orbital pain with tearing and restlessness, in daily clusters"],"map":[2,0,3],"answer":"1–C, 2–A, 3–D","c":"Tension-type headache is bilateral, pressing or band-like, mild to moderate, and not worsened by activity, without nausea. Migraine is typically unilateral, throbbing, moderate to severe, worsened by activity, and accompanied by nausea, photophobia and phonophobia; patients prefer to lie still in a dark room. Cluster headache causes restlessness. A thunderclap \"worst heada

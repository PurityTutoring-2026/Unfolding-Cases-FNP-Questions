 surface","Suggest placing him to sleep on his tummy instead","Recommend soft pillows to keep him from rolling"],"correctIdx":[1],"answer":"B","c":"The AAP recommends that infants sleep alone, on their back, in a crib or bassinet with a firm, flat, non-inclined surface and fitted sheet, in the parents' room without bed-sharing for at least the first 6 months. Bed-sharing, prone sleeping and soft bedding increase the risk of SIDS and suffocation. Breastfeeding and pacifier use at sleep time are protective."}]},{"no":76,"batch":4,"title":"Mr. Whitaker: Slowed Down and Cold","setting":"Primary care clinic • Older adult • Endocrine / Cardiovascular","scenario":"Mr. Whitaker is a 77-year-old man with stable coronary artery disease (stent 4 years ago) who reports fatigue, constipation and feeling cold for several months. His TSH is 16.8 mIU/L and free T4 is low. He takes aspirin, atorvastatin, metoprolol and calcium carbonate with breakfast.","qs":[{"n":226,"t":"mc","visit":"Visit 1","s":"What is the **most appropriate** starting dose of levothyroxine for Mr. Whitaker?","opts":["A loading dose of 500 mcg on the first day","No therapy until his TSH rises above 20 mIU/L","A low dose, such as 25 mcg daily, increased slowly","The full replacement dose of about 1.6 mcg/kg"],"correctIdx":[2],"answer":"C","c":"In older adults and patients with coronary artery disease, levothyroxine is started at a low dose (12.5–25 mcg daily) and increased by 12.5–25 mcg every 6–8 weeks, because a rapid rise in thyroid hormone increases myocardial oxygen demand and can provoke angina, myocardial infarction or atrial fibrillation. Full weight-based replacement is used for healthy younger adults."},{"n":227,"t":"mc","visit":"Visit 1 (continued)","s":"Which part of Mr. Whitaker's routine will **reduce** levothyroxine absorption?","opts":["Taking aspirin after his lunch","Taking atorvastatin in the evening","Taking calcium carbonate at breakfast","Taking metoprolol in the morning"],"correctIdx":[2],"answer":"C","c":"Calcium, iron, antacids, PPIs, bile acid sequestrants, soy and food reduce levothyroxine absorption. Levothyroxine should be taken on an empty stomach 30–60 minutes before breakfast, and calcium should be separated from it by about 4 hours. Statins, metoprolol and aspirin do not meaningfully affect absorption."},{"n":228,"t":"mc","visit":"Visit 2 (1 year later)","s":"Mr. Whitaker's 84-year-old neighbor has a TSH of 7.2 mIU/L, a normal free T4 and no symptoms. What is the **most appropriate** plan for her?","opts":["Observe and repeat TSH in a few months","Start methimazole for thyroid control","Order a thyroid uptake scan this week","Start full-dose levothyroxine right away"],"correctIdx":[0],"answer":"A","c":"A mildly raised TSH with a normal free T4 is subclinical hypothyroidism. In older adults with TSH below 10 mIU/L and no symptoms, observation with repeat testing is usually preferred, because TSH rises naturally with age and treatment offers little benefit while risking over-replacement (atrial fibrillation, bone loss). Treatment is considered for TSH above 10, pregnancy or symptoms in younger patients."}]},{"no":77,"batch":4,"title":"Mrs. Gonzalez: Knobby Fingers and Sore Knees","setting":"Primary care clinic • Older adult • Musculoskeletal","scenario":"Mrs. Gonzalez is a 70-year-old woman with obesity and hypertension who has had aching in both knees for 3 years, worse after walking and at the end of the day, with stiffness lasting about 15 minutes after rising. She has hard, bony enlargements of several finger joints. The knees have crepitus and bony enlargement without warmth. ESR is normal. She takes lisinopril and has CKD with an eGFR of 48.","qs":[{"n":229,"t":"hot","visit":"Visit 1","s":"The FNP notes Heberden nodes. **Click the joint where Heberden nodes occur.**","answer":"A","c":"Heberden nodes are bony enlargements of the distal interphalangeal (DIP) joints and are a hallmark of osteoarthritis; Bouchard nodes affect the proximal interphalangeal (PIP) joints (\"Heberden = Higher, Bouchard = Below\"). Osteoarthritis also commonly affects the first carpometacarpal joint at the base of the thumb. Rheumatoid arthritis involves the MCP and PIP joints and spares the DIP joints.","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 400 320\" width=\"100%\" height=\"auto\"><rect width=\"400\" height=\"320\" fill=\"none\"/><rect x=\"112\" y=\"64\" width=\"30\" height=\"132\" rx=\"14\" fill=\"var(--skin)\" stroke=\"var(--diagram-ink)\" stroke-width=\"2.2\"/><rect x=\"152\" y=\"38\" width=\"30\" height=\"158\" rx=\"14\" fill=\"var(--skin)\" stroke=\"var(--diagram-ink)\" stroke-width=\"2.2\"/><rect x=\"192\" y=\"46\" width=\"30\" height=\"150\" rx=\"14\" fill=\"var(--skin)\" stroke=\"var(--diagram-ink)\" stroke-width=\"2.2\"/><rect x=\"232\" y=\"76\" width=\"30\" height=\"120\" rx=\"14\" fill=\"var(--skin)\" stroke=\"var(--diagram-ink)\" stroke-width=\"2.2\"/><path d=\"M 104 180 L 270 180 Q 282 250 262 300 L 128 300 Q 100 250 104 180 Z\" fill=\"var(--skin)\" stroke=\"var(--diagram-ink)\" stroke-width=\"2.2\"/>\n<line x1=\"116\" y1=\"98\" x2=\"138\" y2=\"98\" stroke=\"var(--diagram-ink)\" stroke-width=\"1.5\" stroke-opacity=\"0.6\"/><line x1=\"116\" y1=\"140\" x2=\"138\" y2=\"140\" stroke=\"var(--diagram-ink)\" stroke-width=\"1.5\" stroke-opacity=\"0.6\"/><line x1=\"156\" y1=\"72\" x2=\"178\" y2=\"72\" stroke=\"var(--diagram-ink)\" stroke-width=\"1.5\" stroke-opacity=\"0.6\"/><line x1=\"156\" y1=\"114\" x2=\"178\" y2=\"114\" stroke=\"var(--diagram-ink)\" stroke-width=\"1.5\" stroke-opacity=\"0.6\"/><line x1=\"196\" y1=\"80\" x2=\"218\" y2=\"80\" stroke=\"var(--diagram-ink)\" stroke-width=\"1.5\" stroke-opacity=\"0.6\"/><line x1=\"196\" y1=\"122\" x2=\"218\" y2=\"122\" stroke=\"var(--diagram-ink)\" stroke-width=\"1.5\" stroke-opacity=\"0.6\"/><line x1=\"236\" y1=\"110\" x2=\"258\" y2=\"110\" stroke=\"var(--diagram-ink)\" stroke-width=\"1.5\" stroke-opacity=\"0.6\"/><line x1=\"236\" y1=\"152\" x2=\"258\" y2=\"152\" stroke=\"var(--diagram-ink)\" stroke-width=\"1.5\" stroke-opacity=\"0.6\"/>\n<path d=\"M 106 214 Q 70 196 52 150 Q 44 128 62 122 Q 80 120 92 150 Q 100 170 114 186\" fill=\"var(--skin)\" stroke=\"var(--diagram-ink)\" stroke-width=\"2.2\"/>\n<line x1=\"134\" y1=\"300\" x2=\"132\" y2=\"316\" stroke=\"var(--diagram-ink)\" stroke-width=\"2\"/><line x1=\"258\" y1=\"300\" x2=\"262\" y2=\"316\" stroke=\"var(--diagram-ink)\" stroke-width=\"2\"/>\n<text x=\"200\" y=\"22\" font-family=\"Arial, sans-serif\" font-size=\"12\" font-weight=\"700\" fill=\"var(--diagram-ink)\" text-anchor=\"middle\">Right hand — dorsal (back) view</text><g class=\"zone\" data-id=\"A\" tabindex=\"0\" role=\"button\" aria-label=\"Area A\">\n<circle cx=\"167\" cy=\"72\" r=\"15\" fill=\"var(--zone-fill)\" stroke=\"var(--zone-ink)\" stroke-width=\"2.5\"/>\n<text x=\"167\" y=\"77.5\" text-anchor=\"middle\" font-family=\"Georgia, 'Times New Roman', serif\" font-size=\"16\" font-weight=\"700\" fill=\"var(--zone-ink)\">A</text></g><g class=\"zone\" data-id=\"B\" tabindex=\"0\" role=\"button\" aria-label=\"Area B\">\n<circle cx=\"167\" cy=\"116\" r=\"15\" fill=\"var(--zone-fill)\" stroke=\"var(--zone-ink)\" stroke-width=\"2.5\"/>\n<text x=\"167\" y=\"121.5\" text-anchor=\"middle\" font-family=\"Georgia, 'Times New Roman', serif\" font-size=\"16\" font-weight=\"700\" fill=\"var(--zone-ink)\">B</text></g><g class=\"zone\" data-id=\"C\" tabindex=\"0\" role=\"button\" aria-label=\"Area C\">\n<circle cx=\"207\" cy=\"184\" r=\"15\" fill=\"var(--zone-fill)\" stroke=\"var(--zone-ink)\" stroke-width=\"2.5\"/>\n<text x=\"207\" y=\"189.5\" text-anchor=\"middle\" font-family=\"Georgia, 'Times New Roman', serif\" font-size=\"16\" font-weight=\"700\" fill=\"var(--zone-ink)\">C</text></g><g class=\"zone\" data-id=\"D\" tabindex=\"0\" role=\"button\" aria-label=\"Area D\">\n<circle cx=\"108\" cy=\"230\" r=\"15\" fill=\"var(--zone-fill)\" stroke=\"var(--zone-ink)\" stroke-width=\"2.5\"/>\n<text x=\"108\" y=\"235.5\" text-anchor=\"middle\" font-family=\"Georgia, 'Times New Roman', serif\" font-size=\"16\" font-weight=\"700\" fill=\"var(--zone-ink)\">D</text></g><g class=\"zone\" data-id=\"E\" tabindex=\"0\" role=\"button\" aria-label=\"Area E\">\n<circle cx=\"196\" cy=\"288\" r=\"15\" fill=\"var(--zone-fill)\" stroke=\"var(--zone-ink)\" stroke-width=\"2.5\"/>\n<text x=\"196\" y=\"293.5\" text-anchor=\"middle\" font-family=\"Georgia, 'Times New Roman', serif\" font-size=\"16\" font-weight=\"700\" fill=\"var(--zone-ink)\">E</text></g></svg>"},{"n":230,"t":"mc","visit":"Visit 1 (continued)","s":"Which pain treatment is **most appropriate** for Mrs. Gonzalez's knee osteoarthritis?","opts":["Oral prednisone 10 mg daily for 3 months","Oral naproxen 500 mg twice daily long term","Daily oral oxycodone for ongoing knee pain","Topical diclofenac gel plus exercise and weight loss"],"correctIdx":[3],"answer":"D","c":"Exercise, weight loss and physical therapy are core treatments for knee osteoarthritis. Topical NSAIDs such as diclofenac gel are preferred in older adults because they provide pain relief with much less systemic exposure than oral NSAIDs. Oral NSAIDs are risky with her CKD, hypertension and ACE inhibitor, opioids are avoided, and systemic steroids are not used for osteoarthritis."},{"n":231,"t":"sata","visit":"Visit 2 (6 months later)","s":"Which findings **distinguish** Mrs. Gonzalez's condition from rheumatoid arthritis? **Select all that apply.**","opts":["A normal ESR","Symmetric MCP swelling with warmth","Morning stiffness shorter than 30 minutes","Positive anti-CCP antibodies","Bony rather than boggy joint enlargement"],"correctIdx":[0,2,4],"answer":"A, C, E","c":"Osteoarthritis is non-inflammatory: morning stiffness lasts under 30 minutes, joints are bony and firm without warmth, pain worsens with use, and inflammatory markers are normal. Rheumatoid arthritis causes prolonged morning stiffness, symmetric warm, boggy swelling of the MCP and PIP joints, raised ESR and CRP, and positive rheumatoid factor and anti-CCP antibodies."}]},{"no":78,"batch":4,"title":"Mrs. Petersen: Confused and Unsteady","setting":"Primary care clinic • Older adult • Renal / Pharmacology","scenario":"Mrs. Petersen is an 80-year-old woman started on sertraline 6 weeks ago for depression. She also takes hydrochlorothiazide for hypertension. Her daughter reports new mild confusion and two near-falls. She appears euvolemic, with normal vital signs and no edema. Serum sodium is 126 mEq/L (it was 138 three months ago); glucose and kidney function are normal.","qs":[{"n":232,"t":"sata","visit":"Visit 1","s":"Which medications in her history **can cause** hyponatremia? **Select all that apply.**","opts":["Acetaminophen as needed","Sertraline","Carbamazepine, if it were added","Hydrochlorothiazide","Amlodipine, if it were added"],"correctIdx":[1,2,3],"answer":"B, C, D","c":"SSRIs such as sertraline can cause SIADH, particularly in older adults in the first weeks of treatment. Thiazide diuretics impair urine dilution and are a common cause of hyponatremia in older women. Carbamazepine (and oxcarbazepine) also cause SIADH. Amlodipine and acetaminophen do not typically cause hyponatremia."},{"n":233,"t":"mc","visit":"Visit 1 (continued)","s":"Why must Mrs. Petersen's sodium be corrected **slowly**?","opts":["Rapid correction causes severe hyperkalemia","Slow correction is needed only in children","Rapid correction can cause osmotic demyelination","Rapid correction causes acute kidney stones"],"correctIdx":[2],"answer":"C","c":"In chronic hyponatremia, brain cells adapt to the low osmolality. Raising sodium too quickly (more than about 8–10 mEq/L in 24 hours) can cause osmotic demyelination syndrome, with dysarthria, dysphagia, paralysis and sometimes death. Mild to moderate chronic hyponatremia is corrected gradually by stopping the cause and restricting fluid if SIADH is present."},{"n":234,"t":"mc","visit":"Visit 2 (2 weeks later)","s":"Sertraline and the thiazide were stopped and sodium has normalized. Her depression returns. Which antidepressant is a **reasonable** alternative for her?","opts":["Mirtazapine, with sodium rechecked","Amitriptyline at a moderate dose","Paroxetine because it is calming","Lithium with no laboratory checks"],"correctIdx":[0],"answer":"A","c":"Mirtazapine has a lower risk of hyponatremia than SSRIs, and its sedating and appetite-stimulating effects can help older adults with insomnia and poor appetite; sodium should still be checked. Amitriptyline and paroxetine are strongly anticholinergic and on the Beers list, and lithium needs close level and kidney monitoring."}]},{"no":79,"batch":4,"title":"Mr. Kwarteng: A Screening Question","setting":"Annual wellness visit • Older adult • Cardiovascular / Health promotion","scenario":"Mr. Kwarteng is a 67-year-old man who smoked a pack a day for 25 years and quit 8 years ago. He has hypertension and a brother who had an abdominal aortic aneurysm repaired. He has never had an abdominal aortic aneurysm screening. He feels well and has no abdominal or back pain.","qs":[{"n":235,"t":"mc","visit":"Visit 1","s":"What **AAA screening** does the USPSTF recommend for Mr. Kwarteng?","opts":["Yearly CT scans of the abdomen","Screening only if he develops pain","A one-time abdominal ultrasound","No screening because he quit smoking"],"correctIdx":[2],"answer":"C","c":"The USPSTF recommends a one-time abdominal ultrasound for men aged 65–75 who have ever smoked (grade B). Former smokers are included. Smoking is the strongest risk factor for AAA, and male sex, age and family history also increase risk. Ultrasound is safe, inexpensive and accurate; CT is not used for screening."},{"n":236,"t":"mc","visit":"Visit 2 (after ultrasound)","s":"The ultrasound shows a 4.2-cm infrarenal AAA. What is the **most appropriate** management?","opts":["Ultrasound surveillance and risk-factor control","No follow-up at all because it is under 5 cm","A single repeat ultrasound scan in 20 years","Immediate open surgical repair within a week"],"correctIdx":[0],"answer":"A","c":"Asymptomatic AAAs of 3.0–5.4 cm are monitored with periodic ultrasound surveillance (more often as size increases), along with smoking avoidance, BP control and statin therapy. Repair is recommended at 5.5 cm or larger (5.0 cm in women), with growth of more than 0.5 cm in 6 months, or with symptoms."},{"n":237,"t":"sata","visit":"Visit 2 (continued)","s":"Which symptoms should prompt Mr. Kwarteng to **call 911** because they suggest rupture? **Select all that apply.**","opts":["Sudden severe abdominal or back pain","Mild heartburn after a large meal","Fainting or light-headedness","A pulsating mass with new pain","Gradual knee pain after walking"],"correctIdx":[0,2,3],"answer":"A, C, D","c":"A ruptured or expanding AAA classically presents with sudden severe abdominal, flank or back pain, hypotension or syncope, and a pulsatile abdominal mass. It is a surgical emergency with high mortality. Mild heartburn and knee pain are unrelated."}]},{"no":80,"batch":4,"title":"Mrs. Mwangi: Leaking Urine","setting":"Primary care clinic • Older adult • Genitourinary / Geriatric syndromes","scenario":"Mrs. Mwangi is a 72-year-old woman with four vaginal deliveries who leaks small amounts of urine when she coughs, sneezes, laughs or lifts her grandchildren. She has no urgency or nocturia. Urinalysis is normal and post-void residual is 40 mL. She has vaginal dryness. She is embarrassed and has stopped going to her exercise class.","qs":[{"n":238,"t":"mc","visit":"Visit 1","s":"What type of incontinence does Mrs. Mwangi have?","opts":["Functional incontinence","Overflow incontinence","Stress incontinence","Urge incontinence"],"correctIdx":[2],"answer":"C","c":"Stress incontinence is leakage with increased abdominal pressure (coughing, sneezing, laughing, lifting) due to weak pelvic floor support or urethral sphincter, often after vaginal births. Urge incontinence causes sudden urgency, overflow causes dribbling with a high post-void residual, and functional incontinence is caused by physical or cognitive barriers to reaching the toilet."},{"n":239,"t":"mc","visit":"Visit 1 (continued)","s":"What is the **first-line** treatment for Mrs. Mwangi?","opts":["Oxybutynin 5 mg twice daily","An indwelling urinary catheter","Restricting all fluids after noon","Pelvic floor muscle (Kegel) exercises"],"correctIdx":[3],"answer":"D","c":"Pelvic floor muscle training (Kegel exercises), ideally guided by a pelvic floor physical therapist, is first-line for stress incontinence, along with weight loss if needed. Vaginal pessaries and surgery (mid-urethral sling) are options if conservative treatment fails. Antimuscarinics treat urge incontinence, and severe fluid restriction can cause dehydration and concentrated urine that irritates the bladder."},{"n":240,"t":"match","visit":"Visit 2 (teaching)","s":"The FNP teaches a student about incontinence. **Drag each type to its most appropriate first-line management.** One option will not be used.","items":["Urge (overactive bladder)","Overflow from BPH","Functional from dementia and arthritis"],"tgts":["Treat the obstruction; consider an alpha-blocker","Prompted voiding and a bedside commode","Kegel exercises for detrusor overactivity","Bladder training with mirabegron if needed"],"map":[3,0,1],"answer":"1–D, 2–A, 3–B","c":"Urge incontinence is treated with bladder training, timed voiding and caffeine reduction, then a beta-3 agonist such as mirabegron (preferred over antimuscarinics in older adults). Overflow incontinence requires treating the cause, such as an alpha-blocker for BPH or intermittent catheterization. Functional incontinence is managed with prompted voiding and environmental changes such as a bedside commode. Kegel exercises treat stress incontinence, not detrusor overactivity."}]},{"no":81,"batch":4,"title":"Mr. Lindgren: Not Interested Anymore","setting":"Primary care clinic • Older adult • Mental health","scenario":"Mr. Lindgren is a 79-year-old white widower whose wife died 8 months ago. He has lost 12 lb, sleeps poorly, no longer sees friends, and says he feels like a burden. His Geriatric Depression Scale score is 11/15. He owns a hunting rifle. He has hypertension and mild CKD and is otherwise healthy.","qs":[{"n":241,"t":"mc","visit":"Visit 1","s":"Which group has the **highest** suicide rate in the United States?","opts":["Middle-aged women","Older white men","Adolescent girls","Young children"],"correctIdx":[1],"answer":"B","c":"Older white men have the highest suicide rates in the United States, and they often use firearms, the most lethal method. Risk factors in Mr. Lindgren include depression, recent bereavement, social isolation, feeling like a burden, weight loss and access to a firearm. Depression in older adults is common but not a normal part of aging."},{"n":242,"t":"mc","visit":"Visit 1 (continued)","s":"What is the **most important** immediate step?","opts":["Avoid the topic so he does not get the idea","Refer him to a grief group in 6 months","Ask him directly about suicidal thoughts and plans","Prescribe a sleeping pill and see him in a year"],"correctIdx":[2],"answer":"C","c":"Asking directly about suicidal ideation, plans, intent and access to means does not increase risk and is essential with these risk factors. If ideation is present, the FNP assesses severity, creates a safety plan, counsels about removing or securing the rifle, and arranges urgent mental health care. Sedative hypnotics are risky in older adults and in overdose."},{"n":243,"t":"mc","visit":"Visit 1 (continued)","s":"He has no suicidal intent and agrees to treatment. Which antidepressant is a **good first choice** for him?","opts":["Sertraline, starting low with sodium monitoring","Paroxetine because it reduces anxiety quickly","Doxepin 75 mg at bedtime for depression","Amitriptyline because it helps sleep and pain"],"correctIdx":[0],"answer":"A","c":"SSRIs such as sertraline or escitalopram are first-line for late-life depression, started at a low dose and titrated. Sodium is monitored because of SIADH risk, and falls and bleeding risk are considered. Tricyclic antidepressants, high-dose doxepin and paroxetine are strongly anticholinergic (Beers Criteria) and dangerous in overdose. Psychotherapy and social support are also important."}]},{"no":82,"batch":4,"title":"Mr. Robinson: Should I Get a PSA?","setting":"Annual wellness visit • Older adult • Men's health / Health promotion","scenario":"Mr. Robinson is a 72-year-old man in good health who asks whether he should have a PSA blood test because a friend was just diagnosed with prostate cancer. He has no urinary symptoms. He has never had prostate cancer screening. His father had prostate cancer at age 80. He takes finasteride for hair loss.","qs":[{"n":244,"t":"mc","visit":"Visit 1","s":"What does the USPSTF recommend about PSA screening for Mr. Robinson's age group?","opts":["Recommends yearly PSA screening for all men","Recommends screening only with a CT of the pelvis","Recommends against routine PSA screening at 70 and older","Recommends screening every 6 months after 70"],"correctIdx":[2],"answer":"C","c":"The USPSTF recommends individual shared decision-making about PSA screening for men 55–69 (grade C) and recommends against PSA-based screening for men 70 and older (grade D), because the harms of overdiagnosis and treatment outweigh the benefits at this age. Discussion of his concerns and of symptoms that would warrant evaluation is still appropriate."},{"n":245,"t":"mc","visit":"Visit 1 (continued)","s":"Mr. Robinson takes finasteride. How does this affect a PSA result?","opts":["It lowers PSA by about 50%, so the value is doubled","It raises PSA, so the value is cut in half","It has no effect on the PSA level at all","It makes the PSA test impossible to perform"],"correctIdx":[0],"answer":"A","c":"5-alpha-reductase inhibitors (finasteride and dutasteride) lower PSA by about 50% after 6–12 months of use. To interpret a PSA, the measured value is doubled. Failing to adjust can falsely reassure. A rising PSA on a 5-ARI warrants evaluation."},{"n":246,"t":"sata","visit":"Visit 1 (continued)","s":"For men who **do** choose screening at the appropriate age, which conditions can raise PSA besides cancer? **Select all that apply.**","opts":["Taking finasteride daily","Recent ejaculation or vigorous cycling","Benign prostatic hyperplasia","Prostatitis","Recent hair loss treatment with minoxidil"],"correctIdx":[1,2,3],"answer":"B, C, D","c":"PSA is prostate-specific, not cancer-specific. It can be raised by BPH, prostatitis, urinary retention, recent ejaculation, vigorous cycling, and recent instrumentation or biopsy. Finasteride lowers rather than raises PSA, and minoxidil has no effect on it. Black men and men with a strong family history may begin discussions at 40–45."}]},{"no":83,"batch":4,"title":"Mrs. Hall: A Swollen Calf After Surgery","setting":"Primary care clinic • Older adult • Cardiovascular / Hematology","scenario":"Mrs. Hall is a 68-year-old woman who had a right total knee replacement 3 weeks ago and has been less mobile since. She now has swelling, warmth and tenderness of the left calf, which is 4 cm larger in circumference than the right. She has no chest pain or shortness of breath. Vital signs are normal. Her eGFR is 70 and she has no bleeding history.","qs":[{"n":247,"t":"mc","visit":"Visit 1","s":"Mrs. Hall's Wells score indicates that DVT is **likely**. What is the **next** step?","opts":["A D-dimer test and discharge if normal","Compression ultrasound of the left leg","A plain x-ray of the left calf and knee","Reassurance that swelling follows surgery"],"correctIdx":[1],"answer":"B","c":"When the clinical probability of DVT is likely (high Wells score), compression ultrasound is the next step. D-dimer is useful to rule out DVT only when probability is low, because a normal result then excludes DVT; in high-probability patients it cannot safely exclude it. Recent surgery and immobility are classic risk factors (Virchow triad)."},{"n":248,"t":"mc","visit":"Visit 2 (same day)","s":"Ultrasound confirms a proximal left leg DVT. Which treatment is **most appropriate**?","opts":["Apixaban, a direct oral anticoagulant","Compression stockings with no anticoagulant","Aspirin 81 mg alone for 6 weeks","Warfarin started alone without bridging"],"correctIdx":[0],"answer":"A","c":"Direct oral anticoagulants such as apixaban or rivaroxaban can be started immediately without parenteral heparin and are preferred for most patients with DVT. Warfarin requires overlap with heparin until the INR is therapeutic. Aspirin and stockings alone do not treat DVT."},{"n":249,"t":"mc","visit":"Visit 2 (continued)","s":"How long should Mrs. Hall's anticoagulation **usually** last?","opts":["Lifelong therapy for every DVT patient","At least 3 months for a surgery-provoked DVT","Only until the leg swelling goes down","Exactly 10 days for every patient"],"correctIdx":[1],"answer":"B","c":"A DVT provoked by a major transient risk factor such as surgery is usually treated for 3 months. Unprovoked DVT, recurrent VTE or cancer-associated thrombosis may need extended therapy. She should be taught to seek emergency care for chest pain, shortness of breath or hemoptysis (possible pulmonary embolism) and for bleeding."}]},{"no":84,"batch":4,"title":"Mr. Vasquez: A Positive Hepatitis C Screen","setting":"Primary care clinic • Middle adult • Hepatic / Infectious disease","scenario":"Mr. Vasquez is a 51-year-old man who injected drugs in his twenties and has been in recovery for 20 years. Routine one-time screening shows a positive hepatitis C antibody. He feels well. ALT is mildly elevated, and platelets and albumin are normal.","qs":[{"n":250,"t":"ord","visit":"Visit 1","s":"**Place the steps of Mr. Vasquez's hepatitis C evaluation and treatment in the correct order.**","items":["Step 1","Step 2","Step 3","Step 4"],"tgts":["Confirm active infection with HCV RNA testing","Treat with an 8–12-week direct-acting antiviral regimen","Assess liver fibrosis (for example FIB-4 or elastography)","Check HCV RNA 12 weeks after treatment to confirm cure"],"map":[0,2,1,3],"answer":"A, C, B, D","c":"A positive HCV antibody shows exposure but not necessarily current infection; about 15–25% of people clear the virus. HCV RNA confirms active infection. Fibrosis is then assessed to identify cirrhosis, which changes monitoring. Pan-genotypic direct-acting antivirals such as sofosbuvir–velpatasvir or glecaprevir–pibrentasvir for 8–12 weeks cure more than 95% of patients. Cure (sustained virologic response) is an undetectable HCV RNA 12 weeks after therapy."},{"n":251,"t":"mc","visit":"Visit 1 (continued)","s":"Who should be screened for hepatitis C according to the USPSTF?","opts":["All adults aged 18–79 at least once","Only adults born between 1945 and 1965","Only adults with jaundice or abnormal LFTs","Only adults who currently inject drugs"],"correctIdx":[0],"answer":"A","c":"The USPSTF recommends one-time hepatitis C screening for all adults aged 18–79 (grade B), with periodic testing for people with ongoing risk such as injection drug use. All pregnant people are also screened during each pregnancy. Birth-cohort-only screening has been replaced."},{"n":252,"t":"sata","visit":"Visit 2 (after cure)","s":"Mr. Vasquez has been cured. Which statements are **correct**? **Select all that apply.**","opts":["There is an effective hepatitis C vaccine for him","He should be vaccinated against hepatitis A and B if not immune","His HCV antibody will usually remain positive","He can be reinfected if exposed again","He is now immune to hepatitis C for life"],"correctIdx":[1,2,3],"answer":"B, C, D","c":"Cure of hepatitis C does not provide immunity, so reinfection is possible with new exposure, and future testing uses HCV RNA because the antibody usually stays positive for life. People with chronic liver disease should be vaccinated against hepatitis A and B if not immune. There is no vaccine for hepatitis C."}]},{"no":85,"batch":4,"title":"Mrs. Chen: Mildly Abnormal Liver Tests","setting":"Primary care clinic • Middle adult • Hepatic / Metabolic","scenario":"Mrs. Chen is a 52-year-old woman with type 2 diabetes, hypertension and a BMI of 33 whose ALT is 62 U/L and AST 41 U/L on two occasions. She drinks alcohol rarely. Hepatitis B and C tests are negative. Ultrasound shows hepatic steatosis. Platelets and albumin are normal.","qs":[{"n":253,"t":"mc","visit":"Visit 1","s":"What is the **most likely** diagnosis?","opts":["Alcohol-related hepatitis with cirrhosis","Metabolic dysfunction-associated steatotic liver disease","Acute hepatitis A from contaminated food","Hereditary hemochromatosis with iron overload"],"correctIdx":[1],"answer":"B","c":"MASLD (formerly NAFLD) is the most common chronic liver disease in the U.S. and is linked to obesity, type 2 diabetes, dyslipidemia and hypertension. It is usually asymptomatic with mildly raised transaminases (ALT typically greater than AST) and steatosis on ultrasound. Alcohol-related disease shows AST:ALT of 2:1 or more."},{"n":254,"t":"mc","visit":"Visit 1 (continued)","s":"Which tool is recommended to assess Mrs. Chen's **risk of advanced fibrosis**?","opts":["The Wells score for DVT","The FIB-4 fibrosis index","The CURB-65 pneumonia score","The CHA₂DS₂-VASc score"],"correctIdx":[1],"answer":"B","c":"The FIB-4 index, based on age, AST, ALT and platelet count, is the recommended first step to estimate the risk of advanced liver fibrosis in MASLD. Indeterminate or high scores are followed by elastography and possible hepatology referral. The other scores assess pneumonia severity, stroke risk in AF and pretest probability of VTE."},{"n":255,"t":"sata","visit":"Visit 1 (continued)","s":"Which interventions are **recommended** for Mrs. Chen? **Select all that apply.**","opts":["Regular aerobic and resistance exercise","Daily high-dose vitamin A supplements","Weight loss of about 7–10%","A GLP-1 receptor agonist for her diabetes and weight","Two glasses of wine daily for heart health"],"correctIdx":[0,2,3],"answer":"A, C, D","c":"Weight loss of 7–10% through diet (such as a Mediterranean pattern) and exercise reduces steatosis, inflammation and fibrosis. GLP-1 receptor agonists such as semaglutide improve glucose, weight and steatohepatitis, and pioglitazone and resmetirom are other options. Alcohol should be minimized, and high-dose vitamin A is hepatotoxic."}]},{"no":86,"batch":4,"title":"Ms. Ivanova: Hot Flashes After Breast Cancer","setting":"Primary care clinic • Middle adult • Women's health / Oncology","scenario":"Ms. Ivanova is a 53-year-old woman who had estrogen receptor-positive breast cancer 3 years ago treated with surgery and radiation. She now takes tamoxifen. She has 10–12 hot flashes a day that wake her at night and disrupt her work. She asks about hormone therapy.","qs":[{"n":256,"t":"mc","visit":"Visit 1","s":"What is the **correct** response about systemic hormone therapy?","opts":["It is contraindicated after estrogen-sensitive breast cancer","It is safe after 2 years without recurrence","It is recommended for all women with hot flashes","It is safe if she uses only a low-dose patch"],"correctIdx":[0],"answer":"A","c":"A history of breast cancer, especially estrogen receptor-positive disease, is a contraindication to systemic menopausal hormone therapy because estrogen may stimulate recurrence. Non-hormonal options should be offered. Other contraindications include unexplained vaginal bleeding, VTE, stroke, CAD and active liver disease."},{"n":257,"t":"mc","visit":"Visit 1 (continued)","s":"Ms. Ivanova takes tamoxifen. Which non-hormonal option should be **avoided** because it reduces tamoxifen's effectiveness?","opts":["Paroxetine, a strong CYP2D6 inhibitor","Gabapentin taken at bedtime","Cognitive behavioral therapy sessions","Venlafaxine, an SNRI antidepressant"],"correctIdx":[0],"answer":"A","c":"Tamoxifen is converted by CYP2D6 to its active metabolite endoxifen. Strong CYP2D6 inhibitors such as paroxetine and fluoxetine reduce tamoxifen's effectiveness and should be avoided. Venlafaxine, gabapentin, CBT, clonidine and fezolinetant are reasonable options for hot flashes in women taking tamoxifen."},{"n":258,"t":"mc","visit":"Visit 2 (3 months later)","s":"Which symptom while taking tamoxifen should prompt **prompt evaluation**?","opts":["Occasional joint stiffness","Mild hot flashes at night","Slight weight gain of 2 lb","Abnormal vaginal bleeding"],"correctIdx":[3],"answer":"D","c":"Tamoxifen acts as an estrogen agonist on the endometrium and increases the risk of endometrial hyperplasia and cancer. Any abnormal or postmenopausal vaginal bleeding needs prompt evaluation with transvaginal ultrasound or endometrial biopsy. Tamoxifen also increases the risk of VTE, so leg swelling or chest symptoms need urgent assessment."}]},{"no":87,"batch":4,"title":"Mr. Obi: A Pop in the Heel","setting":"Urgent visit • Middle adult • Musculoskeletal / Pharmacology","scenario":"Mr. Obi is a 58-year-old man who felt a sudden \"pop,\" as if he had been kicked in the back of his left heel, while playing tennis. He now has difficulty walking and cannot stand on his toes on that side. Ten days ago he finished a course of levofloxacin for pneumonia, and he takes prednisone for COPD. There is a palpable gap above the left heel.","qs":[{"n":259,"t":"mc","visit":"Visit 1","s":"Which test **best supports** the most likely diagnosis?","opts":["Thompson test (calf squeeze)","Lachman test of the knee","Phalen test of the wrists","McMurray test of the knee"],"correctIdx":[0],"answer":"A","c":"Achilles tendon rupture causes a sudden pop at the back of the heel, inability to stand on the toes and a palpable gap. In the Thompson test, squeezing the calf normally causes plantar flexion; absent plantar flexion indicates a complete rupture. Lachman and McMurray tests assess the ACL and meniscus, and Phalen assesses carpal tunnel syndrome."},{"n":260,"t":"sata","visit":"Visit 1 (continued)","s":"Which factors in Mr. Obi's history **increased** his risk of this injury? **Select all that apply.**","opts":["Taking an ACE inhibitor","Wearing compression socks","Systemic corticosteroid therapy","Age over 60 approaching","Recent fluoroquinolone use"],"correctIdx":[2,3,4],"answer":"C, D, E","c":"Fluoroquinolones carry a boxed warning for tendinitis and tendon rupture, a risk that increases with age over 60, concurrent corticosteroid use, and kidney, heart or lung transplant. The rupture can occur during or weeks after treatment. Fluoroquinolones also carry boxed warnings for peripheral neuropathy, CNS effects and myasthenia gravis exacerbation. ACE inhibitors and compression socks do not raise risk."},{"n":261,"t":"mc","visit":"Visit 2 (1 year later)","s":"Mr. Obi recovered. He now has heel pain that is worst with his **first steps in the morning** and tenderness at the medial calcaneal tubercle. What is the **most likely** diagnosis?","opts":["Gouty arthritis","Morton neuroma","Plantar fasciitis","Stress fracture"],"correctIdx":[2],"answer":"C","c":"Plantar fasciitis causes heel pain that is worst with the first steps in the morning or after rest, with tenderness at the medial calcaneal tubercle. It is treated with calf and plantar fascia stretching, supportive footwear, heel cups, NSAIDs and night splints. Morton neuroma causes burning between the third and fourth toes."}]},{"no":88,"batch":4,"title":"Ms. Robinson-Ayo: Bloody Diarrhea","setting":"Primary care clinic • Middle adult • Gastrointestinal","scenario":"Ms. Robinson-Ayo is a 36-year-old non-smoking woman with 6 weeks of bloody diarrhea with mucus, urgency, tenesmus and crampy lower abdominal pain. She has lost 6 lb. Stool cultures and C. difficile testing are negative. Fecal calprotectin is markedly elevated. Colonoscopy shows continuous inflammation from the rectum extending to the sigmoid colon with friable mucosa.","qs":[{"n":262,"t":"mc","visit":"Visit 1","s":"What is the **most likely** diagnosis?","opts":["Irritable bowel syndrome","Ulcerative colitis","Acute diverticulitis","Crohn disease of the ileum"],"correctIdx":[1],"answer":"B","c":"Ulcerative colitis involves only the colon, starting in the rectum and extending proximally in a continuous pattern, with mucosal inflammation causing bloody diarrhea, urgency and tenesmus. Crohn disease can affect any part of the GI tract with skip lesions and transmural inflammation and often causes non-bloody diarrhea, RLQ pain and fistulas. A high calprotectin indicates inflammation, which excludes IBS."},{"n":263,"t":"sata","visit":"Visit 1 (continued)","s":"Which **extra-intestinal** manifestations are associated with her condition? **Select all that apply.**","opts":["Pancreatic calcifications","Tophi on the ears","Primary sclerosing cholangitis","Uveitis or episcleritis","Erythema nodosum"],"correctIdx":[2,3,4],"answer":"C, D, E","c":"Inflammatory bowel disease is associated with arthritis and ankylosing spondylitis, uveitis and episcleritis, erythema nodosum, pyoderma gangrenosum and aphthous ulcers. Primary sclerosing cholangitis is particularly associated with ulcerative colitis. Pancreatic calcifications occur in chronic pancreatitis, and tophi in gout."},{"n":264,"t":"mc","visit":"Visit 2 (8 years later)","s":"Ms. Robinson-Ayo now has extensive colitis. What colorectal cancer screening does she need?","opts":["A FIT test once every 10 years","Surveillance colonoscopy every 1–3 years","No screening because she is under 50","Routine screening starting at age 45 only"],"correctIdx":[1],"answer":"B","c":"Long-standing extensive ulcerative colitis (and Crohn colitis) increases colorectal cancer risk. Surveillance colonoscopy with biopsies begins about 8 years after diagnosis and is repeated every 1–3 years depending on risk factors such as primary sclerosing cholangitis. Average-risk screening does not apply."}]},{"no":89,"batch":4,"title":"Mr. Clarke: Lung Cancer Screening","setting":"Primary care clinic • Middle adult • Respiratory / Health promotion","scenario":"Mr. Clarke is a 56-year-old man who smoked one and a half packs a day for 20 years (30 pack-years) and quit 9 years ago. He has no symptoms and is in good health. He has never had lung cancer screening.","qs":[{"n":265,"t":"mc","visit":"Visit 1","s":"Is Mr. Clarke **eligible** for lung cancer screening under the USPSTF recommendation?","opts":["No: he must currently be smoking to qualify","No: he quit smoking more than 5 years ago","No: screening starts only at age 65 for men","Yes: aged 50–80, 20+ pack-years, quit < 15 years"],"correctIdx":[3],"answer":"D","c":"The USPSTF recommends annual low-dose CT for adults aged 50–80 with at least a 20 pack-year history who currently smoke or quit within the past 15 years (grade B). Mr. Clarke meets all three criteria. Screening stops once a person has not smoked for 15 years or develops a condition that limits life expectancy or ability to have surgery."},{"n":266,"t":"mc","visit":"Visit 1 (continued)","s":"Which test is used for lung cancer screening?","opts":["Annual low-dose chest CT","A tumor marker blood test","Annual plain chest x-ray","Sputum cytology twice a year"],"correctIdx":[0],"answer":"A","c":"Annual low-dose CT is the only lung cancer screening test shown to reduce lung cancer mortality. Chest x-ray and sputum cytology do not reduce mortality, and tumor markers are not screening tests. For Medicare patients, a shared decision-making visit using a decision aid is required before the first screening CT."},{"n":267,"t":"sata","visit":"Visit 1 (continued)","s":"Which topics belong in the **shared decision-making** visit before screening? **Select all that apply.**","opts":["A guarantee that CT finds every cancer","False-positive results and follow-up testing","Overdiagnosis and radiation exposure","Importance of staying smoke-free","Need to stop all other cancer screening"],"correctIdx":[1,2,3],"answer":"B, C, D","c":"Shared decision-making for lung cancer screening covers the benefits, the harms (false positives, invasive follow-up procedures, overdiagnosis and radiation exposure), the need for annual screening and willingness to undergo treatment, and counseling to remain abstinent from smoking. No test finds every cancer, and other age-appropriate screening continues."}]},{"no":90,"batch":4,"title":"Mrs. Adewale: Tearful After Delivery","setting":"Postpartum visit • Young adult • Mental health / Women's health","scenario":"Mrs. Adewale is a 30-year-old woman 5 weeks after the birth of her first baby. She is breastfeeding. For the past 3 weeks she has felt sad most of the day, cannot enjoy her baby, sleeps poorly even when the baby sleeps, feels guilty and worthless, and has trouble concentrating. Her Edinburgh Postnatal Depression Scale score is 16. She has no thoughts of harming herself or the baby and no hallucinations.","qs":[{"n":268,"t":"mc","visit":"Visit 1","s":"What is the **most likely** diagnosis?","opts":["Postpartum psychosis with mania","Normal postpartum \"baby blues\"","Postpartum (perinatal) depression","Postpartum thyroiditis only"],"correctIdx":[2],"answer":"C","c":"Postpartum depression causes depressed mood, anhedonia, sleep and appetite changes, guilt and poor concentration lasting more than 2 weeks, beginning within weeks to a year after delivery; an EPDS of 10–13 or more is positive. \"Baby blues\" begin on days 2–3 and resolve by 2 weeks, and psychosis involves hallucinations, delusions and confusion. Thyroid function should still be checked."},{"n":269,"t":"mc","visit":"Visit 1 (continued)","s":"Mrs. Adewale wants medication and to continue breastfeeding. Which antidepressant is **preferred**?","opts":["Bupropion","Lithium","Paroxetine","Sertraline"],"correctIdx":[3],"answer":"D","c":"Sertraline is often preferred during breastfeeding because very little passes into breast milk and infant levels are usually undetectable. It is combined with psychotherapy and support. Zuranolone (oral) and brexanolone (IV) are FDA approved for postpartum depression. Lithium requires caution in breastfeeding, and paroxetine is more anticholinergic."},{"n":270,"t":"match","visit":"Visit 2 (teaching)","s":"The FNP teaches the family about postpartum mood conditions. **Drag each condition to its typical description.** One description will not be used.","items":["Baby blues","Postpartum depression","Postpartum psychosis"],"tgts":["Hot flashes and night sweats from estrogen excess","Tearfulness from day 2–3 that resolves by 2 weeks","Low mood and anhedonia lasting more than 2 weeks","Hallucinations and confusion in the first weeks; an emergency"],"map":[1,2,3],"answer":"1–B, 2–C, 3–D","c":"Baby blues affect up to 80% of mothers, start on days 2–3 and resolve within 2 weeks with support. Postpartum depression affects 10–15% and lasts longer than 2 weeks with impairment. Postpartum psychosis is rare, usually begins in the first 2 weeks, is associated with bipolar disorder, and carries a risk of suicide and infanticide, so it requires emergency hospitalization. The unused option does not describe a postpartum mood disorder."}]},{"no":91,"batch":4,"title":"Mr. Haruna: Congestion That Won't Quit","setting":"Primary care clinic • Young adult • HEENT","scenario":"Mr. Haruna is a 27-year-old man with seasonal sneezing, itchy eyes and clear rhinorrhea every spring. On examination his nasal turbinates are pale, boggy and bluish, and he has dark circles under his eyes. This year he developed a cold 12 days ago with nasal congestion, purulent discharge and facial pressure that has not improved. He has no fever, eye swelling or vision changes, and he has no drug allergies.","qs":[{"n":271,"t":"mc","visit":"Visit 1","s":"For Mr. Haruna's seasonal allergic rhinitis, which medication is the **most effective** first-line therapy?","opts":["An oral antibiotic during each allergy season","An intranasal corticosteroid such as fluticasone","An oral decongestant taken every day","Oxymetazoline nasal spray used daily"],"correctIdx":[1],"answer":"B","c":"Intranasal corticosteroids are the most effective first-line treatment for allergic rhinitis and reduce congestion, sneezing, itching and rhinorrhea. Second-generation oral antihistamines and intranasal antihistamines are alternatives or add-ons. Topical decongestants used more than 3 days cause rebound congestion (rhinitis medicamentosa), and antibiotics have no role in allergy."},{"n":272,"t":"mc","visit":"Visit 1 (continued)","s":"His current symptoms have lasted 12 days without improvement. What is the **most appropriate** treatment?","opts":["A sinus CT scan before any treatment","Supportive care only for another month","Amoxicillin–clavulanate for 5–7 days","Azithromycin for 3 days as first choice"],"correctIdx":[2],"answer":"C","c":"Acute bacterial rhinosinusitis is suspected when symptoms persist 10 days or more without improvement, are severe (fever of 39 °C with purulent discharge for 3–4 days) or worsen after initial improvement (\"double sickening\"). IDSA recommends amoxicillin–clavulanate for 5–7 days in adults, with saline irrigation and intranasal steroids. Macrolides have high pneumococcal resistance, and imaging is not needed for uncomplicated sinusitis."},{"n":273,"t":"sata","visit":"Visit 1 (continued)","s":"Which signs would suggest a **complication** of sinusitis that needs emergency referral? **Select all that apply.**","opts":["Double vision or decreased vision","Pressure over the cheeks when bending forward","Yellow-green nasal discharge","Swelling and redness around the eye","Severe headache with confusion or a stiff neck"],"correctIdx":[0,3,4],"answer":"A, D, E","c":"Periorbital edema, pain with eye movement, proptosis, diplopia or vision loss suggest orbital cellulitis, and severe headache, altered mental status or meningeal signs suggest intracranial spread such as meningitis, abscess or cavernous sinus thrombosis. These need emergency evaluation. Colored discharge and facial pressure are typical of uncomplicated sinusitis."}]},{"no":92,"batch":4,"title":"Ms. Laurent: Cramping and Changing Bowel Habits","setting":"Primary care clinic • Young adult • Gastrointestinal","scenario":"Ms. Laurent is a 28-year-old woman with 8 months of crampy lower abdominal pain about twice a week that improves after a bowel movement, alternating with loose and hard stools and bloating. Symptoms worsen with stress. She has no rectal bleeding, weight loss, fever, nocturnal symptoms or family history of colon cancer or IBD. CBC, CRP and celiac serology are normal.","qs":[{"n":274,"t":"mc","visit":"Visit 1","s":"What is the **most likely** diagnosis?","opts":["Ulcerative colitis limited to the rectum","Irritable bowel syndrome with mixed bowel habits","Colorectal cancer of the sigmoid colon","Lactose intolerance alone without IBS"],"correctIdx":[1],"answer":"B","c":"By the Rome IV criteria, IBS is recurrent abdominal pain at least 1 day a week for 3 months, associated with two or more of: relation to defecation, change in stool frequency and change in stool form, with onset at least 6 months before diagnosis. She has alternating stools (IBS-M), normal inflammatory markers and celiac serology, and no alarm features."},{"n":275,"t":"sata","visit":"Visit 1 (continued)","s":"Which findings would be **alarm features** requiring further evaluation such as colonoscopy? **Select all that apply.**","opts":["Symptoms that worsen with stress","Unintentional weight loss","Rectal bleeding","Symptoms that wake her from sleep","Bloating that improves after defecation"],"correctIdx":[1,2,3],"answer":"B, C, D","c":"Alarm features that suggest organic disease include onset after age 50, rectal bleeding, unexplained weight loss, nocturnal symptoms, iron-deficiency anemia, fever, and family history of colorectal cancer or IBD. Bloating, pain relief with defecation and stress-related worsening are typical of IBS."},{"n":276,"t":"mc","visit":"Visit 1 (continued)","s":"Which management approach is **recommended** first?","opts":["Exploratory surgery to find the hidden cause","Repeat colonoscopy every 6 months for life","Long-term oral opioids for abdominal pain","Reassurance, a low-FODMAP diet and soluble fiber"],"correctIdx":[3],"answer":"D","c":"IBS is managed with reassurance and a strong therapeutic relationship, dietary changes such as a low-FODMAP diet, soluble fiber (psyllium), exercise, stress management and CBT or gut-directed hypnotherapy. Antispasmodics or peppermint oil help pain, and subtype-specific drugs are added as needed. Opioids worsen bowel symptoms and are avoided."}]},{"no":93,"batch":4,"title":"Ms. Brooks: Calloused Knuckles","setting":"Primary care clinic • Young adult • Mental health / Metabolic","scenario":"Ms. Brooks is a 20-year-old college student of normal weight who comes in for fatigue. On examination she has calluses on the backs of two knuckles, swollen parotid glands and erosion of the inner surfaces of her teeth. When asked gently, she admits to eating large amounts of food in short periods several times a week, then making herself vomit. Serum potassium is 3.0 mEq/L and bicarbonate is 32 mEq/L.","qs":[{"n":277,"t":"mc","visit":"Visit 1","s":"What is the **most likely** diagnosis?","opts":["Anorexia nervosa","Rumination disorder","Binge-eating disorder","Bulimia nervosa"],"correctIdx":[3],"answer":"D","c":"Bulimia nervosa involves recurrent binge eating with compensatory behaviors such as self-induced vomiting, laxatives or excessive exercise at least weekly for 3 months, usually at a normal weight. Signs include calluses on the knuckles (Russell sign), parotid enlargement, dental enamel erosion, hypokalemia and metabolic alkalosis from vomiting. Binge-eating disorder lacks compensatory behaviors."},{"n":278,"t":"mc","visit":"Visit 1 (continued)","s":"Which medication is **FDA approved** for bulimia nervosa when combined with psychotherapy?","opts":["Lorazepam","Topiramate","Fluoxetine","Bupropion"],"correctIdx":[2],"answer":"C","c":"Fluoxetine is FDA approved for bulimia nervosa and is used with cognitive behavioral therapy, the first-line psychological treatment. Bupropion is contraindicated in bulimia and anorexia because of an increased seizure risk, particularly with electrolyte disturbances. Lisdexamfetamine is approved for binge-eating disorder."},{"n":279,"t":"hot","visit":"Visit 1 (continued)","s":"The FNP documents Russell sign. **Click the area where these calluses typically form.**","answer":"B","c":"Russell sign is calluses, abrasions or scars over the dorsal knuckles (metacarpophalangeal joints) caused by repeated contact with the incisors during self-induced vomiting. Together with parotid enlargement and dental erosion, it is a physical clue to bulimia nervosa. Her potassium of 3.0 mEq/L and bicarbonate of 32 mEq/L reflect vomiting-induced hypokalemic metabolic alkalosis, which can cause dangerous arrhythmias and needs an ECG, correction and monitoring.","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 400 320\" width=\"100%\" height=\"auto\"><rect width=\"400\" height=\"320\" fill=\"none\"/><rect x=\"112\" y=\"64\" width=\"30\" height=\"132\" rx=\"14\" fill=\"var(--skin)\" stroke=\"var(--diagram-ink)\" stroke-width=\"2.2\"/><rect x=\"152\" y=\"38\" width=\"30\" height=\"158\" rx=\"14\" fill=\"var(--skin)\" stroke=\"var(--diagram-ink)\" stroke-width=\"2.2\"/><rect x=\"192\" y=\"46\" width=\"30\" height=\"150\" rx=\"14\" fill=\"var(--skin)\" stroke=\"var(--diagram-ink)\" stroke-width=\"2.2\"/><rect x=\"232\" y=\"76\" width=\"30\" height=\"120\" rx=\"14\" fill=\"var(--skin)\" stroke=\"var(--diagram-ink)\" stroke-width=\"2.2\"/><path d=\"M 104 180 L 270 180 Q 282 250 262 300 L 128 300 Q 100 250 104 180 Z\" fill=\"var(--skin)\" stroke=\"var(--diagram-ink)\" stroke-width=\"2.2\"/>\n<line x1=\"116\" y1=\"98\" x2=\"138\" y2=\"98\" stroke=\"var(--diagram-ink)\" stroke-width=\"1.5\" stroke-opacity=\"0.6\"/><line x1=\"116\" y1=\"140\" x2=\"138\" y2=\"140\" stroke=\"var(--diagram-ink)\" stroke-width=\"1.5\" stroke-opacity=\"0.6\"/><line x1=\"156\" y1=\"72\" x2=\"178\" y2=\"72\" stroke=\"var(--diagram-ink)\" stroke-width=\"1.5\" stroke-opacity=\"0.6\"/><line x1=\"156\" y1=\"114\" x2=\"178\" y2=\"114\" stroke=\"var(--diagram-ink)\" stroke-width=\"1.5\" stroke-opacity=\"0.6\"/><line x1=\"196\" y1=\"80\" x2=\"218\" y2=\"80\" stroke=\"var(--diagram-ink)\" stroke-width=\"1.5\" stroke-opacity=\"0.6\"/><line x1=\"196\" y1=\"122\" x2=\"218\" y2=\"122\" stroke=\"var(--diagram-ink)\" stroke-width=\"1.5\" stroke-opacity=\"0.6\"/><line x1=\"236\" y1=\"110\" x2=\"258\" y2=\"110\" stroke=\"var(--diagram-ink)\" stroke-width=\"1.5\" stroke-opacity=\"0.6\"/><line x1=\"236\" y1=\"152\" x2=\"258\" y2=\"152\" stroke=\"var(--diagram-ink)\" stroke-width=\"1.5\" stroke-opacity=\"0.6\"/>\n<path d=\"M 106 214 Q 70 196 52 150 Q 44 128 62 122 Q 80 120 92 150 Q 100 170 114 186\" fill=\"var(--skin)\" stroke=\"var(--diagram-ink)\" stroke-width=\"2.2\"/>\n<line x1=\"134\" y1=\"300\" x2=\"132\" y2=\"316\" stroke=\"var(--diagram-ink)\" stroke-width=\"2\"/><line x1=\"258\" y1=\"300\" x2=\"262\" y2=\"316\" stroke=\"var(--diagram-ink)\" stroke-width=\"2\"/>\n<text x=\"200\" y=\"22\" font-family=\"Arial, sans-serif\" font-size=\"12\" font-weight=\"700\" fill=\"var(--diagram-ink)\" text-anchor=\"middle\">Right hand — dorsal (back) view</text><g class=\"zone\" data-id=\"A\" tabindex=\"0\" role=\"button\" aria-label=\"Area A\">\n<circle cx=\"167\" cy=\"72\" r=\"15\" fill=\"var(--zone-fill)\" stroke=\"var(--zone-ink)\" stroke-width=\"2.5\"/>\n<text x=\"167\" y=\"77.5\" text-anchor=\"middle\" font-family=\"Georgia, 'Times New Roman', serif\" font-size=\"16\" font-weight=\"700\" fill=\"var(--zone-ink)\">A</text></g><g class=\"zone\" data-id=\"B\" tabindex=\"0\" role=\"button\" aria-label=\"Area B\">\n<circle cx=\"207\" cy=\"184\" r=\"15\" fill=\"var(--zone-fill)\" stroke=\"var(--zone-ink)\" stroke-width=\"2.5\"/>\n<text x=\"207\" y=\"189.5\" text-anchor=\"middle\" font-family=\"Georgia, 'Times New Roman', serif\" font-size=\"16\" font-weight=\"700\" fill=\"var(--zone-ink)\">B</text></g><g class=\"zone\" data-id=\"C\" tabindex=\"0\" role=\"button\" aria-label=\"Area C\">\n<circle cx=\"120\" cy=\"262\" r=\"15\" fill=\"var(--zone-fill)\" stroke=\"var(--zone-ink)\" stroke-width=\"2.5\"/>\n<text x=\"120\" y=\"267.5\" text-anchor=\"middle\" font-family=\"Georgia, 'Times New Roman', serif\" font-size=\"16\" font-weight=\"700\" fill=\"var(--zone-ink)\">C</text></g><g class=\"zone\" data-id=\"D\" tabindex=\"0\" role=\"button\" aria-label=\"Area D\">\n<circle cx=\"196\" cy=\"288\" r=\"15\" fill=\"var(--zone-fill)\" stroke=\"var(--zone-ink)\" stroke-width=\"2.5\"/>\n<text x=\"196\" y=\"293.5\" text-anchor=\"middle\" font-family=\"Georgia, 'Times New Roman', serif\" font-size=\"16\" font-weight=\"700\" fill=\"var(--zone-ink)\">D</text></g><g class=\"zone\" data-id=\"E\" tabindex=\"0\" role=\"button\" aria-label=\"Area E\">\n<circle cx=\"252\" cy=\"230\" r=\"15\" fill=\"var(--zone-fill)\" stroke=\"var(--zone-ink)\" stroke-width=\"2.5\"/>\n<text x=\"252\" y=\"235.5\" text-anchor=\"middle\" font-family=\"Georgia, 'Times New Roman', serif\" font-size=\"16\" font-weight=\"700\" fill=\"var(--zone-ink)\">E</text></g></svg>"}]},{"no":94,"batch":4,"title":"Ms. Agyeman: Pain and Spotting in Early Pregnancy","setting":"Urgent visit • Young adult • Women's health","scenario":"Ms. Agyeman is a 26-year-old woman whose last menstrual period was 7 weeks ago. She has a positive home pregnancy test and 1 day of left-sided lower abdominal pain with light vaginal spotting. She had pelvic inflammatory disease 3 years ago. BP is 112/70, HR 92. She has left adnexal tenderness. Her blood type is O negative.","qs":[{"n":280,"t":"mc","visit":"Visit 1","s":"Which diagnosis must be **excluded first**?","opts":["Urinary tract infection","Normal intrauterine pregnancy","Irritable bowel syndrome","Ectopic tubal pregnancy"],"correctIdx":[3],"answer":"D","c":"Amenorrhea, a positive pregnancy test, unilateral pelvic pain and vaginal spotting are the classic triad of ectopic pregnancy, a leading cause of first-trimester maternal death. Prior PID damages the fallopian tubes and is a major risk factor, along with prior ectopic pregnancy, tubal surgery, IUD in place, IVF and smoking."},{"n":281,"t":"mc","visit":"Visit 1 (continued)","s":"Which evaluation is **most appropriate**?","opts":["A repeat home pregnancy test in 1 week","Reassurance and routine prenatal care","A pelvic CT scan with IV contrast today","Serum hCG and transvaginal ultrasound today"],"correctIdx":[3],"answer":"D","c":"Suspected ectopic pregnancy is evaluated urgently with a quantitative serum hCG and transvaginal ultrasound. An intrauterine pregnancy should be visible when hCG is above the discriminatory zone (about 1,500–3,500 mIU/mL); an empty uterus at that level suggests ectopic pregnancy. Signs of rupture (severe pain, peritoneal signs, shoulder pain, hypotension) require emergency care."},{"n":282,"t":"mc","visit":"Visit 1 (continued)","s":"Ms. Agyeman is Rh(D)-negative and is bleeding in pregnancy. What should she receive?","opts":["Anti-D (Rh) immune globulin","Vitamin K injection","Intravenous iron infusion","Hepatitis B immune globulin"],"correctIdx":[0],"answer":"A","c":"Rh(D)-negative people who bleed during pregnancy, or who have an ectopic pregnancy, miscarriage, abortion, abdominal trauma or invasive procedures, should receive anti-D immune globulin to prevent alloimmunization, which could cause hemolytic disease in future Rh-positive pregnancies. It is also given routinely at 28 weeks and within 72 hours after delivery of an Rh-positive infant."}]},{"no":95,"batch":4,"title":"Tobi: Acne That Leaves Scars","setting":"Primary care clinic • Adolescent • Dermatology","scenario":"Tobi is a 16-year-old girl with acne on her face, chest and back for 2 years. She has many comedones, inflamed papules and pustules, and several deep painful nodules, with early scarring. She used over-the-counter benzoyl peroxide wash with little benefit. She is sexually active and uses condoms. She feels self-conscious and avoids social events.","qs":[{"n":283,"t":"mc","visit":"Visit 1","s":"Which regimen is **appropriate** for Tobi's moderate-to-severe inflammatory acne while she is evaluated for further therapy?","opts":["Topical retinoid, benzoyl peroxide and oral doxycycline","A high-potency topical steroid applied daily","Oral doxycycline alone for 2 years continuously","Topical clindamycin alone applied twice daily"],"correctIdx":[0],"answer":"A","c":"Moderate to severe inflammatory acne is treated with a topical retinoid plus benzoyl peroxide and an oral antibiotic such as doxycycline for about 3–4 months. Topical or oral antibiotics are never used alone because of resistance, and benzoyl peroxide reduces resistance. Steroids worsen acne. Hormonal therapy is an option for women."},{"n":284,"t":"mc","visit":"Visit 2 (4 months later)","s":"Tobi has nodular acne with scarring despite therapy. Which treatment is **indicated**?","opts":["Long-term oral minocycline for years","Oral isotretinoin through dermatology","Oral prednisone for 6 months","Topical tretinoin alone at night"],"correctIdx":[1],"answer":"B","c":"Oral isotretinoin is indicated for severe nodulocystic acne, scarring acne or acne that fails adequate conventional therapy. It is usually managed through dermatology. Long-term antibiotics promote resistance, and systemic steroids are not used for acne maintenance."},{"n":285,"t":"sata","visit":"Visit 2 (continued)","s":"Which requirements and precautions apply to isotretinoin? **Select all that apply.**","opts":["Two forms of contraception and monthly pregnancy tests","Monitoring lipids and liver tests","Taking it with doxycycline for faster results","Enrollment in the iPLEDGE program","Donating blood freely during therapy"],"correctIdx":[0,1,3],"answer":"A, B, D","c":"Isotretinoin is highly teratogenic, so patients who can become pregnant must enroll in iPLEDGE, use two forms of contraception and have monthly pregnancy tests. Lipids (hypertriglyceridemia) and liver tests are monitored, and mood changes are watched for. Tetracyclines are avoided because both cause idiopathic intracranial hypertension, and blood donation is prohibited during therapy."}]},{"no":96,"batch":4,"title":"Marcus: Knee Pain and a Limp","setting":"Primary care clinic • Adolescent • Musculoskeletal","scenario":"Marcus is a 13-year-old boy with obesity (BMI above the 97th percentile) who has had 3 weeks of a limp and aching pain in his left knee and thigh, with no injury. On examination the knee is normal, but internal rotation of the left hip is limited and painful, and when the hip is flexed the leg rotates outward.","qs":[{"n":286,"t":"mc","visit":"Visit 1","s":"What is the **most likely** diagnosis?","opts":["Patellofemoral pain syndrome","Transient synovitis of the hip","Osgood–Schlatter disease of the knee","Slipped capital femoral epiphysis"],"correctIdx":[3],"answer":"D","c":"Slipped capital femoral epiphysis occurs in adolescents, especially obese boys aged 10–16, during the growth spurt. It presents with hip, thigh or knee pain (referred pain), a limp, limited and painful internal rotation and obligatory external rotation when the hip is flexed. Knee pain with a normal knee examination should always prompt a hip examination."},{"n":287,"t":"mc","visit":"Visit 1 (continued)","s":"What is the **most appropriate** action?","opts":["NSAIDs alone and a recheck in 3 months","A knee brace and continued full activity","Non-weight-bearing and urgent orthopedic referral","Physical therapy and return to sports today"],"correctIdx":[2],"answer":"C","c":"Suspected SCFE requires immediate non-weight-bearing (crutches) and urgent orthopedic referral for surgical pinning, because further slippage can cause avascular necrosis of the femoral head and long-term arthritis. Bilateral AP and frog-leg lateral hip x-rays confirm the diagnosis, and the other hip is assessed because SCFE is often bilateral."},{"n":288,"t":"mc","visit":"Visit 2 (school physical, 1 year later)","s":"During Marcus's school physical, which test **screens** for scoliosis?","opts":["Adams forward-bend test","Trendelenburg hip test","Thompson calf-squeeze test","Ortolani hip maneuver"],"correctIdx":[0],"answer":"A","c":"In the Adams forward-bend test, the patient bends forward at the waist and the examiner looks for asymmetry or a rib hump, which suggests structural scoliosis. A scoliometer reading above about 7° prompts x-rays. The Trendelenburg test assesses hip abductor weakness, Ortolani screens infants for hip dysplasia, and Thompson assesses the Achilles tendon."}]},{"no":97,"batch":4,"title":"Riley: Vaping and Weekend Parties","setting":"Primary care clinic • Adolescent • Substance use","scenario":"Riley is a 17-year-old who comes for a sports physical. When interviewed alone, Riley reports vaping nicotine daily for a year and drinking alcohol at weekend parties. Riley sometimes drinks to relax and has ridden home with a friend who had been drinking. Two weeks ago Riley developed a cough, shortness of breath, nausea and fatigue after vaping a THC cartridge bought from a friend.","qs":[{"n":289,"t":"mc","visit":"Visit 1","s":"Which validated tool is **recommended** to screen adolescents for substance use?","opts":["The CAGE questionnaire","The AUDIT-C questionnaire","The PHQ-9 questionnaire","The CRAFFT questionnaire"],"correctIdx":[3],"answer":"D","c":"CRAFFT is validated for adolescents aged 12–21. It asks about riding in a Car with someone high or drinking, using to Relax, using Alone, Forgetting things, Family or Friends telling you to cut down, and getting into Trouble. Two or more \"yes\" answers indicate high risk. CAGE and AUDIT-C are adult alcohol screens, and PHQ-9 screens for depression."},{"n":290,"t":"mc","visit":"Visit 1 (continued)","s":"Riley has a CRAFFT score of 2 and admits riding with an impaired driver. What is the **most appropriate** response?","opts":["Call the police about the underage drinking","Ignore it because experimenting is normal","Brief motivational counseling and a safety plan","Tell the coach so Riley is removed from the team"],"correctIdx":[2],"answer":"C","c":"Adolescents with a positive CRAFFT screen should receive a brief intervention using motivational interviewing, with discussion of risks and safety planning (such as a \"contract\" to call a parent for a ride with no questions asked), and follow-up or referral as needed. Confidentiality is maintained unless there is a serious safety risk. Reporting to police or coaches would breach confidential care."},{"n":291,"t":"mc","visit":"Visit 1 (continued)","s":"Riley's respiratory symptoms after vaping a THC product raise concern for which condition?","opts":["Spontaneous pneumothorax alone","Vaping-associated lung injury (EVALI)","Infectious mononucleosis with cough","Exercise-induced bronchoconstriction"],"correctIdx":[1],"answer":"B","c":"EVALI presents with respiratory symptoms (cough, dyspnea, chest pain), GI symptoms (nausea, vomiting, abdominal pain) and constitutional symptoms after vaping, especially THC products from informal sources containing vitamin E acetate. Chest imaging shows bilateral infiltrates. Patients need evaluation of oxygenation and imaging, and severe cases need hospitalization. Vaping cessation should be advised."}]},{"no":98,"batch":4,"title":"Aiden: A Seizure With Fever","setting":"Primary care follow-up • Toddler • Neurology","scenario":"Aiden is a 20-month-old who had a generalized tonic–clonic seizure lasting 2 minutes at home yesterday during a fever of 39.6 °C from a viral cold. He had one seizure in 24 hours and returned to normal within an hour. Today he is alert, playful and interactive, with no neck stiffness, a normal neurological examination and up-to-date immunizations. His father had febrile seizures as a child.","qs":[{"n":292,"t":"mc","visit":"Visit 1","s":"How should this seizure be **classified**?","opts":["A complex febrile seizure","Status epilepticus","A simple febrile seizure","An absence seizure"],"correctIdx":[2],"answer":"C","c":"A simple febrile seizure is a generalized seizure lasting less than 15 minutes that occurs once in 24 hours in a child aged 6 months to 5 years with fever and no CNS infection. A complex febrile seizure is focal, lasts 15 minutes or more, or recurs within 24 hours. Status epilepticus is a seizure lasting 5 minutes or more."},{"n":293,"t":"mc","visit":"Visit 1 (continued)","s":"Which evaluation is **recommended** for Aiden?","opts":["An EEG and brain MRI this week","A lumbar puncture for every child","Starting daily antiseizure medicine","No routine EEG, imaging or blood tests"],"correctIdx":[3],"answer":"D","c":"For a well-appearing, fully immunized child after a simple febrile seizure, the AAP recommends no routine EEG, neuroimaging or blood tests; evaluation focuses on finding the source of fever. Lumbar puncture is considered if there are meningeal signs or if immunization against Hib and pneumococcus is incomplete. Daily antiseizure drugs are not recommended."},{"n":294,"t":"sata","visit":"Visit 1 (continued)","s":"Which statements should the FNP share with Aiden's parents? **Select all that apply.**","opts":["Antipyretics do not prevent febrile seizures","Place him on his side and time the seizure if it recurs","Put something in his mouth to protect his tongue","Febrile seizures usually cause brain damage","About one-third of children have another febrile seizure"],"correctIdx":[0,1,4],"answer":"A, B, E","c":"Simple febrile seizures are benign. About 30% of children have a recurrence, with higher risk at a younger age and with a family history. Antipyretics improve comfort but do not prevent seizures. During a seizure, parents should place the child on the side, keep the area safe, put nothing in the mouth, time the seizure and call 911 if it lasts 5 minutes or more. Febrile seizures do not cause brain damage, and later epilepsy risk is only slightly increased."}]},{"no":99,"batch":4,"title":"Sophia: Not Pointing Yet","setting":"Well-child visit • Toddler • Development","scenario":"Sophia is an 18-month-old girl at a well-child visit. Her parents say she does not point to show them things, rarely looks at them when they call her name, and says no words, although she babbled at 9 months. She lines up her toys and becomes very upset when routines change. She walks well. Hearing at birth was normal.","qs":[{"n":295,"t":"mc","visit":"Visit 1","s":"Which screening tool does the AAP recommend at this visit for these concerns?","opts":["The CRAFFT questionnaire","The M-CHAT-R/F checklist","The Vanderbilt rating scale","The PHQ-A questionnaire"],"correctIdx":[1],"answer":"B","c":"The AAP recommends autism-specific screening with the M-CHAT-R/F at the 18- and 24-month visits, alongside general developmental screening at 9, 18 and 30 months. PHQ-A screens adolescent depression, CRAFFT adolescent substance use, and Vanderbilt scales assess ADHD in school-aged children."},{"n":296,"t":"sata","visit":"Visit 1 (continued)","s":"Which findings in Sophia are **red flags** for autism spectrum disorder? **Select all that apply.**","opts":["Walking independently at 13 months","Not responding to her name","Babbling at 9 months","No pointing to show interest by 12–18 months","No single words by 16 months"],"correctIdx":[1,3,4],"answer":"B, D, E","c":"Red flags for autism include no babbling, pointing or gestures by 12 months, no single words by 16 months, no two-word phrases by 24 months, any loss of language or social skills, poor eye contact, lack of joint attention, not responding to name, and restricted, repetitive behaviors. Walking at 13 months and babbling at 9 months are typical milestones."},{"n":297,"t":"mc","visit":"Visit 1 (continued)","s":"The M-CHAT-R/F is positive. What is the **most appropriate** next step?","opts":["Wait until age 3 to see if she catches up","Repeat the same screening again in 1 year","Reassure the parents that girls speak later","Refer now for diagnosis and early intervention"],"correctIdx":[3],"answer":"D","c":"A positive autism screen requires prompt referral for a comprehensive diagnostic evaluation and to early intervention services (IDEA Part C), without waiting for a formal diagnosis, because early intervention such as applied behavior analysis improves outcomes. An audiology evaluation is also obtained to exclude hearing loss. \"Wait and see\" delays effective treatment. Vaccines do not cause autism."}]},{"no":100,"batch":4,"title":"Isaac: Cola-Colored Urine","setting":"Primary care clinic • School-age child • Renal","scenario":"Isaac is a 7-year-old boy with 2 days of dark \"cola-colored\" urine, puffy eyes in the morning, decreased urine output and headache. He had a sore throat treated at an urgent care clinic about 2 weeks ago. BP is 138/88 (above the 95th percentile for his age). Urinalysis shows blood, red blood cell casts and 1+ protein. Serum C3 is low.","qs":[{"n":298,"t":"mc","visit":"Visit 1","s":"What is the **most likely** diagnosis?","opts":["Minimal change nephrotic syndrome","Post-streptococcal glomerulonephritis","Acute uncomplicated cystitis","IgA nephropathy after a cold"],"correctIdx":[1],"answer":"B","c":"Post-streptococcal glomerulonephritis typically follows group A strep pharyngitis by 1–3 weeks (or impetigo by 3–6 weeks). It is a nephritic syndrome with cola-colored hematuria, RBC casts, edema, hypertension, oliguria and low C3. IgA nephropathy causes hematuria within 1–2 days of an upper respiratory infection, and minimal change disease causes heavy proteinuria without hematuria."},{"n":299,"t":"match","visit":"Visit 1 (continued)","s":"**Drag each glomerular syndrome to its hallmark findings.** One option will not be used.","items":["Nephritic syndrome","Nephrotic syndrome"],"tgts":["White blood cell casts with fever and flank pain","Protein above 3.5 g/day, low albumin, edema and high lipids","Hematuria with RBC casts, hypertension and oliguria"],"map":[2,1],"answer":"1–C, 2–B","c":"Nephritic syndrome (post-streptococcal GN, IgA nephropathy, lupus nephritis) features hematuria with RBC casts, hypertension, oliguria and mild proteinuria. Nephrotic syndrome (minimal change disease in children, FSGS, membranous nephropathy, diabetic nephropathy) features heavy proteinuria above 3.5 g/day, hypoalbuminemia, edema and hyperlipidemia, with a thrombosis risk. WBC casts with fever and flank pain indicate pyelonephritis."},{"n":300,"t":"mc","visit":"Visit 1 (continued)","s":"Isaac's mother asks whether the antibiotics for his sore throat should have prevented this. What is **correct**?","opts":["This shows that the antibiotics caused his kidney problem","They prevent rheumatic fever, not reliably glomerulonephritis","Antibiotics fully prevent all complications of strep throat","Strep throat never causes any kidney complications in children"],"correctIdx":[1],"answer":"B","c":"Treating group A strep pharyngitis within 9 days prevents acute rheumatic fever, but it does not reliably prevent post-streptococcal glomerulonephritis. Management of PSGN is supportive: control of BP and fluid overload with sodium restriction and diuretics, and monitoring. Most children recover fully, with C3 normalizing in 6–8 weeks."}]},{"no":101,"batch":5,"title":"Mrs. Albright: Wavy Lines on the Page","setting":"Primary care clinic • Older adult • Eye","scenario":"Mrs. Albright is a 78-year-old white woman who smoked for 40 years and quit 5 years ago. Over the past year she has had gradually blurred central vision, difficulty reading and recognizing faces, and straight lines on door frames sometimes look wavy. Her peripheral vision is intact and she has no eye pain or redness. Fundoscopy shows drusen in the macula of both eyes.","qs":[{"n":301,"t":"mc","visit":"Visit 1","s":"What is the **most likely** diagnosis?","opts":["Primary open-angle glaucoma","Age-related nuclear cataract","Central retinal artery occlusion","Age-related macular degeneration"],"correctIdx":[3],"answer":"D","c":"Age-related macular degeneration (AMD) is the leading cause of central vision loss in older adults. It causes blurred central vision, difficulty reading and recognizing faces, and metamorphopsia (straight lines appearing wavy), with drusen in the macula. Risk factors include age, smoking, white race and family history. Glaucoma causes peripheral vision loss first, cataracts cause glare and generalized blurring, and retinal artery occlusion causes sudden painless loss of vision."},{"n":302,"t":"mc","visit":"Visit 1 (continued)","s":"Which tool should Mrs. Albright use at home to **monitor** her central vision?","opts":["A tonometer to measure eye pressure","An Amsler grid checked each day","A Snellen chart checked yearly","A color-vision plate book weekly"],"correctIdx":[1],"answer":"B","c":"An Amsler grid is a simple square grid that patients view with one eye at a time. New wavy, missing or distorted lines can signal progression from dry to wet (neovascular) AMD, which needs urgent ophthalmology care. Snellen charts measure visual acuity, tonometry measures intraocular pressure for glaucoma, and color plates test color vision."},{"n":303,"t":"sata","visit":"Visit 2 (ophthalmology follow-up)","s":"Mrs. Albright has intermediate dry AMD. Which recommendations are **appropriate**? **Select all that apply.**","opts":["Report sudden new distortion or vision loss promptly","Choose the original formula with beta-carotene","Stay smoke-free and eat leafy green vegetables","Use laser trabeculoplasty to slow the disease","Take an AREDS2 formula supplement"],"correctIdx":[0,2,4],"answer":"A, C, E","c":"For intermediate AMD, the AREDS2 formula (vitamins C and E, zinc, copper, lutein and zeaxanthin) slows progression. Not smoking and a diet rich in leafy greens and fish are recommended. Sudden distortion or vision loss suggests wet AMD, which is treated with intravitreal anti-VEGF injections. Beta-carotene was removed from AREDS2 because it raised lung cancer risk in smokers and former smokers, and laser trabeculoplasty treats glaucoma."}]},{"no":102,"batch":5,"title":"Mr. Delgado: A Murmur That Travels to the Armpit","setting":"Primary care clinic • Older adult • Cardiovascular","scenario":"Mr. Delgado is a 74-year-old man with hypertension who has had increasing exertional shortness of breath and fatigue for 4 months. On examination there is a grade 3/6 high-pitched, blowing holosystolic murmur that radiates to the left axilla. He has mild bilateral ankle edema. BP is 138/82 and HR 84 and regular.","qs":[{"n":304,"t":"hot","visit":"Visit 1","s":"The murmur suggests mitral regurgitation. **Click the area where this murmur is heard best.**","answer":"E","c":"Mitral regurgitation produces a high-pitched, blowing holosystolic murmur heard best at the cardiac apex (the mitral area, fifth intercostal space at the midclavicular line), radiating to the left axilla. The aortic area is the second right intercostal space, the pulmonic area the second left, Erb point the third left, and the tricuspid area the fourth or fifth left intercostal space at the sternal border.","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 400 320\" width=\"100%\" height=\"auto\"><rect width=\"400\" height=\"320\" fill=\"none\"/><path d=\"M 120 40 Q 200 20 280 40 L 330 70 Q 352 160 330 300 L 70 300 Q 48 160 70 70 Z\" fill=\"var(--skin)\" stroke=\"var(--diagram-ink)\" stroke-width=\"2.5\"/>\n<path d=\"M 172 40 Q 200 58 228 40\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-width=\"2\"/>\n<path d=\"M 196 62 Q 150 64 86 74\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-width=\"5\" stroke-linecap=\"round\"/>\n<path d=\"M 204 62 Q 250 64 314 74\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-width=\"5\" stroke-linecap=\"round\"/>\n<rect x=\"186\" y=\"66\" width=\"28\" height=\"170\" rx=\"10\" fill=\"var(--diagram-ink)\" fill-opacity=\"0.14\" stroke=\"var(--diagram-ink)\" stroke-width=\"2\"/>\n<path d=\"M 184 96 Q 120 102 86 126\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-opacity=\"0.35\" stroke-width=\"2\"/><path d=\"M 216 96 Q 280 102 314 126\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-opacity=\"0.35\" stroke-width=\"2\"/><path d=\"M 184 122 Q 120 128 90 152\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-opacity=\"0.35\" stroke-width=\"2\"/><path d=\"M 216 122 Q 280 128 310 152\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-opacity=\"0.35\" stroke-width=\"2\"/><path d=\"M 184 148 Q 120 154 94 178\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-opacity=\"0.35\" stroke-width=\"2\"/><path d=\"M 216 148 Q 280 154 306 178\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-opacity=\"0.35\" stroke-width=\"2\"/><path d=\"M 184 174 Q 120 180 98 204\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-opacity=\"0.35\" stroke-width=\"2\"/><path d=\"M 216 174 Q 280 180 302 204\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-opacity=\"0.35\" stroke-width=\"2\"/><path d=\"M 184 200 Q 120 206 102 230\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-opacity=\"0.35\" stroke-width=\"2\"/><path d=\"M 216 200 Q 280 206 298 230\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-opacity=\"0.35\" stroke-width=\"2\"/><path d=\"M 184 226 Q 120 232 106 256\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-opacity=\"0.35\" stroke-width=\"2\"/><path d=\"M 216 226 Q 280 232 294 256\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-opacity=\"0.35\" stroke-width=\"2\"/>\n<line x1=\"288\" y1=\"70\" x2=\"288\" y2=\"290\" stroke=\"var(--diagram-ink)\" stroke-width=\"1.5\" stroke-dasharray=\"5 5\" stroke-opacity=\"0.6\"/>\n<text x=\"292\" y=\"286\" font-family=\"Arial, sans-serif\" font-size=\"11\" font-

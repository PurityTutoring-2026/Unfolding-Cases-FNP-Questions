che of life\" suggests subarachnoid hemorrhage and needs emergency evaluation."}]},{"no":236,"batch":10,"title":"Mr. Owens: A Very High Blood Pressure Reading","setting":"Primary care clinic • Middle adult • Cardiovascular","scenario":"Mr. Owens is a 56-year-old man with hypertension who ran out of his amlodipine and lisinopril 2 weeks ago. At a routine visit his BP is 192/116 on repeated readings. He feels well, with no chest pain, shortness of breath, headache, vision changes, confusion or weakness. His examination, ECG, urinalysis and creatinine are unchanged from baseline.","qs":[{"n":706,"t":"ord","visit":"Visit 1","s":"Before repeating his BP, the FNP reviews proper technique. **Place the steps in the correct order.**","items":["Step 1","Step 2","Step 3","Step 4"],"tgts":["Have him avoid caffeine and smoking for 30 minutes and empty his bladder","Seat him with back supported and feet flat for 5 minutes of rest","Take two or more readings 1–2 minutes apart and average them","Support the bare arm at heart level with the correct cuff size"],"map":[0,1,3,2],"answer":"A, B, D, C","c":"Accurate BP measurement requires avoiding caffeine, exercise and smoking for 30 minutes, emptying the bladder, and resting quietly for at least 5 minutes, seated with the back supported, legs uncrossed and feet flat. The cuff is placed on a bare upper arm supported at heart level, with the bladder encircling 80% of the arm. At least two readings 1–2 minutes apart are averaged. A cuff that is too small gives falsely high readings."},{"n":707,"t":"mc","visit":"Visit 1 (continued)","s":"How should Mr. Owens's situation be **classified**?","opts":["Normal BP for a man of his age group","White-coat hypertension needing no change","Hypertensive emergency needing ICU admission","Severe hypertension without target-organ damage"],"correctIdx":[3],"answer":"D","c":"Severely elevated BP (often 180/120 or higher) without signs of acute target-organ damage (no chest pain, neurological deficits, acute kidney injury, pulmonary edema or retinal hemorrhage) is severe hypertension, sometimes called hypertensive urgency. A hypertensive emergency is severe hypertension with acute target-organ damage and needs ICU care with IV drugs."},{"n":708,"t":"mc","visit":"Visit 1 (continued)","s":"What is the **most appropriate** management?","opts":["Give sublingual nifedipine in the office now","Restart his oral medications with close follow-up","Give IV labetalol to drop his BP rapidly today","Send him to the ICU for a nitroprusside drip"],"correctIdx":[1],"answer":"B","c":"Severe asymptomatic hypertension is managed by restarting or adjusting oral antihypertensives, reinforcing adherence and arranging follow-up within days, lowering BP gradually over days to weeks. Rapid lowering can cause cerebral, coronary or kidney ischemia. Immediate-release sublingual nifedipine is dangerous. Cost or access barriers that led to running out of medication should be addressed."}]},{"no":237,"batch":10,"title":"Mrs. Ibe: Kidneys After a Stomach Bug","setting":"Urgent visit • Middle adult • Renal / Pharmacology","scenario":"Mrs. Ibe is a 58-year-old woman with hypertension treated with lisinopril and hydrochlorothiazide. For 3 days she has had vomiting and diarrhea and has taken ibuprofen 800 mg three times daily for cramps. She feels dizzy on standing. BP is 98/60 lying down. Her creatinine is 2.4 mg/dL (baseline 0.9), BUN 62 mg/dL, and urine sodium is low.","qs":[{"n":709,"t":"mc","visit":"Visit 1","s":"What type of acute kidney injury is **most likely**?","opts":["Acute glomerulonephritis from strep throat","Postrenal injury from a urinary blockage","Prerenal injury from volume loss and medications","Contrast-induced kidney injury after CT"],"correctIdx":[2],"answer":"C","c":"Prerenal acute kidney injury results from reduced kidney perfusion. Volume loss from vomiting and diarrhea, combined with the \"triple whammy\" of an ACE inhibitor (reduces efferent arteriole constriction), a diuretic (volume depletion) and an NSAID (afferent arteriole constriction), sharply lowers glomerular filtration. A BUN-to-creatinine ratio above 20 and low urine sodium (FENa below 1%) support a prerenal cause."},{"n":710,"t":"match","visit":"Visit 1 (continued)","s":"**Drag each type of acute kidney injury to a typical cause.** One option will not be used.","items":["Prerenal","Intrinsic (acute tubular necrosis)","Postrenal"],"tgts":["Bladder outlet obstruction from an enlarged prostate","Excess salt intake with high blood pressure","Prolonged hypotension or aminoglycoside toxicity, with muddy brown casts","Dehydration with an ACE inhibitor and NSAID"],"map":[3,2,0],"answer":"1–D, 2–C, 3–A","c":"Prerenal AKI is caused by reduced perfusion (dehydration, heart failure, NSAIDs or ACE inhibitors) and reverses quickly with restored perfusion. Intrinsic AKI, most often acute tubular necrosis from prolonged ischemia or nephrotoxins (aminoglycosides, contrast, rhabdomyolysis), shows muddy brown granular casts and a FENa above 2%. Postrenal AKI results from obstruction (BPH, stones, tumors) and is diagnosed with a bladder scan and renal ultrasound showing hydronephrosis."},{"n":711,"t":"sata","visit":"Visit 1 (continued)","s":"Which actions are **appropriate** now? **Select all that apply.**","opts":["Double the lisinopril to protect the kidneys","Add a second NSAID for the cramps","Stop ibuprofen and use acetaminophen","Give fluids and recheck creatinine and potassium","Hold lisinopril and hydrochlorothiazide"],"correctIdx":[2,3,4],"answer":"C, D, E","c":"\"Sick day\" guidance advises temporarily holding ACE inhibitors, ARBs, diuretics, NSAIDs, metformin and SGLT2 inhibitors during dehydrating illnesses. Treatment of prerenal AKI includes fluid replacement and stopping nephrotoxins, with monitoring of creatinine, electrolytes (especially potassium) and urine output. Medications are restarted once she is well and kidney function recovers."}]},{"no":238,"batch":10,"title":"Mrs. Halvorsen: Full After a Few Bites","setting":"Primary care clinic • Middle adult • Gastrointestinal / Endocrine","scenario":"Mrs. Halvorsen is a 52-year-old woman with type 1 diabetes for 30 years, with retinopathy and peripheral neuropathy. For 6 months she has had early fullness, bloating, nausea and vomiting of undigested food eaten hours earlier. Her glucose readings swing unpredictably, with unexplained lows after meals. Upper endoscopy is normal.","qs":[{"n":712,"t":"mc","visit":"Visit 1","s":"What is the **most likely** diagnosis?","opts":["Diabetic gastroparesis","Celiac disease relapse","Small bowel obstruction","Peptic ulcer disease"],"correctIdx":[0],"answer":"A","c":"Diabetic gastroparesis is delayed gastric emptying without mechanical obstruction, caused by autonomic neuropathy of the vagus nerve. It causes early satiety, fullness, bloating, nausea and vomiting of undigested food, and erratic glucose control, including postprandial hypoglycemia because food is absorbed unpredictably. It is more common with long-standing diabetes and other microvascular complications."},{"n":713,"t":"mc","visit":"Visit 1 (continued)","s":"Which test **confirms** the diagnosis?","opts":["An abdominal x-ray in two views","A colonoscopy with random biopsies","A gastric emptying scintigraphy study","A hydrogen breath test for lactose"],"correctIdx":[2],"answer":"C","c":"A 4-hour solid-meal gastric emptying scintigraphy study confirms gastroparesis after mechanical obstruction is excluded by endoscopy or imaging. Medications that slow gastric emptying, such as opioids and GLP-1 receptor agonists, should be stopped beforehand, and glucose should be controlled on the test day because hyperglycemia itself slows emptying."},{"n":714,"t":"sata","visit":"Visit 2 (management)","s":"Which management strategies are **appropriate**? **Select all that apply.**","opts":["Metoclopramide for a limited time with monitoring","Large high-fiber meals twice a day","Optimizing glucose control","Small, frequent, low-fat, low-fiber meals","Starting a GLP-1 receptor agonist to help"],"correctIdx":[0,2,3],"answer":"A, C, D","c":"Gastroparesis is managed with small, frequent meals that are low in fat and insoluble fiber (which slow emptying), liquid or pureed calories when needed, and good glucose control. Metoclopramide is the only FDA-approved drug but carries a boxed warning for tardive dyskinesia and should be limited to 12 weeks. Antiemetics may help. GLP-1 receptor agonists and opioids slow gastric emptying and worsen symptoms."}]},{"no":239,"batch":10,"title":"Mr. Chen: A Seizure at Work","setting":"Primary care follow-up • Young adult • Neurology","scenario":"Mr. Chen is a 28-year-old software engineer who had a generalized tonic–clonic seizure at work 3 days ago after several nights with little sleep. Co-workers saw him stiffen and jerk for about 2 minutes, followed by 20 minutes of confusion. He bit the side of his tongue. ED evaluation including glucose, electrolytes, toxicology and head CT was normal. He drives to work daily.","qs":[{"n":715,"t":"ord","visit":"Visit 1","s":"The FNP teaches his co-workers seizure first aid. **Place the steps in the correct order.**","items":["Step 1","Step 2","Step 3","Step 4"],"tgts":["Call 911 if it lasts 5 minutes or more and stay until he is alert","Cushion his head and loosen anything around his neck","Turn him onto his side once the jerking allows","Stay calm, note the time and move hard objects away"],"map":[3,1,2,0],"answer":"D, B, C, A","c":"During a seizure, bystanders should stay calm, time the seizure and clear the area, cushion the head and loosen tight clothing, and turn the person onto the side to keep the airway clear and let saliva drain. Nothing should be put in the mouth, and the person should not be restrained. 911 is called for seizures lasting 5 minutes or more, repeated seizures, injury, pregnancy, breathing difficulty or a first seizure."},{"n":716,"t":"mc","visit":"Visit 1 (continued)","s":"Which further evaluation is **recommended** after a first unprovoked seizure in an adult?","opts":["No further evaluation now","Cardiac catheterization","A lumbar puncture for all","An EEG and a brain MRI"],"correctIdx":[3],"answer":"D","c":"After a first unprovoked seizure, adults should have an EEG and brain MRI (which is more sensitive than CT), because abnormal results raise the risk of recurrence and may change management. Lumbar puncture is done only if infection or subarachnoid hemorrhage is suspected. About one-third to one-half of adults have a recurrence, most within 2 years."},{"n":717,"t":"mc","visit":"Visit 1 (continued)","s":"What should the FNP advise about **driving**?","opts":["Drive as usual because it was only one seizure","Drive as usual if he gets more sleep each night","Drive only at night when the traffic is lighter","Stop driving and follow state seizure-free rules"],"correctIdx":[3],"answer":"D","c":"People who have had a seizure should not drive until they meet their state's or country's seizure-free interval (often 3–12 months) and reporting requirements. Clinicians should document the advice given. Other safety advice includes avoiding swimming or bathing alone, heights and operating dangerous machinery, and getting regular sleep, since sleep deprivation lowers the seizure threshold."}]},{"no":240,"batch":10,"title":"Mr. Haddad: A Painless Lump in the Testicle","setting":"Primary care clinic • Young adult • Genitourinary / Oncology","scenario":"Mr. Haddad is a 27-year-old man who noticed a painless, hard lump on his right testicle while showering 3 weeks ago. He has a dull ache in his lower abdomen. He had surgery as a baby for an undescended right testicle. On examination there is a firm, non-tender, irregular mass within the right testis that does not transilluminate. The epididymis is normal.","qs":[{"n":718,"t":"mc","visit":"Visit 1","s":"What is the **most appropriate** next step?","opts":["Scrotal ultrasound","Needle biopsy of the mass","Recheck in 3 months","A course of antibiotics"],"correctIdx":[0],"answer":"A","c":"A painless, firm mass within the testis in a young man is testicular cancer until proven otherwise. The next step is scrotal ultrasound, which shows a solid intratesticular mass. Testicular cancer is the most common solid cancer in men aged 15–35, and cryptorchidism is a major risk factor. Antibiotic trials delay diagnosis, and transscrotal biopsy is avoided because it can spread tumor."},{"n":719,"t":"sata","visit":"Visit 1 (continued)","s":"Which serum tumor markers are checked for testicular cancer? **Select all that apply.**","opts":["Prostate-specific antigen (PSA)","Lactate dehydrogenase (LDH)","Beta-hCG","Alpha-fetoprotein (AFP)","CA-125"],"correctIdx":[1,2,3],"answer":"B, C, D","c":"AFP, beta-hCG and LDH are measured before and after orchiectomy for diagnosis, staging and follow-up. A raised AFP indicates a nonseminomatous component (pure seminomas do not produce AFP). PSA is a prostate marker and CA-125 an ovarian cancer marker."},{"n":720,"t":"mc","visit":"Visit 2 (urology plan)","s":"What is the **standard** initial treatment once a testicular tumor is confirmed?","opts":["Watchful waiting for 6 months","Radical inguinal orchiectomy","Oral hormone therapy alone","Transscrotal partial excision"],"correctIdx":[1],"answer":"B","c":"Radical inguinal orchiectomy (removal of the testis and spermatic cord through an inguinal incision) is the standard diagnostic and therapeutic procedure. A transscrotal approach is avoided because it can alter lymphatic spread. Sperm banking should be discussed before treatment. Testicular cancer has a very high cure rate, even when it has spread."}]},{"no":241,"batch":10,"title":"Mrs. Ndlovu: A Hot, Painful Breast","setting":"Postpartum visit • Young adult • Women's health","scenario":"Mrs. Ndlovu is a 28-year-old woman 3 weeks after delivery who is breastfeeding. For 24 hours she has had a red, hot, tender, wedge-shaped area on the outer part of her left breast with fever of 38.8 °C, chills and body aches. Her nipple is cracked. There is no fluctuant mass. She is not allergic to any medications.","qs":[{"n":721,"t":"mc","visit":"Visit 1","s":"What is the **most likely** diagnosis?","opts":["Inflammatory breast cancer","Lactational breast abscess","Simple breast engorgement","Lactational mastitis"],"correctIdx":[3],"answer":"D","c":"Lactational mastitis causes a red, hot, tender, often wedge-shaped area of one breast with fever and flu-like symptoms, usually in the first 6 weeks postpartum. It often starts with milk stasis and inflammation, sometimes with bacterial infection (usually Staphylococcus aureus) entering through cracked nipples. A breast abscess presents as a fluctuant, tender mass. Engorgement is bilateral without high fever."},{"n":722,"t":"mc","visit":"Visit 1 (continued)","s":"What should the FNP advise about **breastfeeding**?","opts":["Stop breastfeeding from both breasts until it heals","Continue breastfeeding, including from the affected breast","Breastfeed only from the unaffected breast now","Pump and discard all of the milk for 2 weeks"],"correctIdx":[1],"answer":"B","c":"Breastfeeding should continue, including from the affected side, because the milk is safe for the baby and stopping suddenly can worsen inflammation and lead to an abscess. Current guidance also recommends feeding on demand without over-pumping, ice, NSAIDs, a supportive bra and lymphatic drainage massage rather than deep massage. Latch should be assessed."},{"n":723,"t":"mc","visit":"Visit 1 (continued)","s":"She has a high fever and has not improved after 24 hours of supportive care. Which antibiotic is **appropriate**?","opts":["Dicloxacillin or cephalexin for 10–14 days","Oral fluconazole as a single dose","Oral nitrofurantoin for 5 days","Oral metronidazole for 7 days"],"correctIdx":[0],"answer":"A","c":"If symptoms are severe or do not improve within 12–24 hours, antibiotics covering S. aureus are given, such as dicloxacillin or cephalexin (compatible with breastfeeding); clindamycin or TMP-SMX may be used if MRSA is suspected. A fluctuant mass or failure to improve after 48 hours needs ultrasound to look for an abscess. Inflammatory breast cancer should be considered if symptoms persist despite treatment."}]},{"no":242,"batch":10,"title":"Ms. Okeke: Painful Lumps in the Armpits","setting":"Primary care clinic • Young adult • Dermatology","scenario":"Ms. Okeke is a 25-year-old woman who smokes and has a BMI of 34. For 4 years she has had recurring, painful, deep nodules in both armpits and groin that sometimes drain foul-smelling pus and heal with rope-like scars. Some areas have connected draining tunnels. She has been treated for \"boils\" many times. She is embarrassed and avoids swimming.","qs":[{"n":724,"t":"mc","visit":"Visit 1","s":"What is the **most likely** diagnosis?","opts":["Hidradenitis suppurativa","Epidermoid cyst infection","Cutaneous Crohn disease","Recurrent MRSA furunculosis"],"correctIdx":[0],"answer":"A","c":"Hidradenitis suppurativa is a chronic inflammatory disease of hair follicles in skin folds (axillae, groin, buttocks, under the breasts), causing recurrent painful nodules, abscesses, sinus tracts (tunnels) and rope-like scars. It usually begins after puberty, is more common in women, and is associated with smoking and obesity. It is often misdiagnosed as recurrent boils, delaying treatment."},{"n":725,"t":"sata","visit":"Visit 1 (continued)","s":"Which measures are **appropriate** for Ms. Okeke? **Select all that apply.**","opts":["Tight synthetic clothing to protect the skin","Topical clindamycin or oral tetracyclines","Repeated incision and drainage as the only treatment","Weight loss support","Smoking cessation"],"correctIdx":[1,3,4],"answer":"B, D, E","c":"Management includes smoking cessation, weight loss, loose clothing, pain control and antiseptic washes. Mild disease is treated with topical clindamycin; moderate disease with oral tetracyclines or clindamycin with rifampin, and hormonal therapy (such as spironolactone) in women. Biologics such as adalimumab, secukinumab or bimekizumab treat moderate to severe disease, and surgical deroofing or excision treats tunnels. Repeated incision and drainage alone has high recurrence."},{"n":726,"t":"mc","visit":"Visit 1 (continued)","s":"Which screening is **important** because of her condition?","opts":["Routine bone marrow biopsies yearly","Screening for depression and metabolic disease","Screening for colon cancer starting now","A yearly brain MRI for complications"],"correctIdx":[1],"answer":"B","c":"Hidradenitis suppurativa significantly affects quality of life and is associated with depression, anxiety and suicide risk, as well as obesity, metabolic syndrome, diabetes, PCOS and inflammatory bowel disease. Clinicians should screen for depression and cardiometabolic risk factors and refer to dermatology for moderate to severe disease."}]},{"no":243,"batch":10,"title":"Ms. Petrakis: Bloody Diarrhea After a Barbecue","setting":"Urgent visit • Young adult • Gastrointestinal / Infectious disease","scenario":"Ms. Petrakis is a 24-year-old woman who ate undercooked hamburgers at a barbecue 4 days ago. For 2 days she has had severe abdominal cramps and watery diarrhea that turned grossly bloody today. She has little or no fever. She is drinking fluids. Several other guests are also sick. A stool test for Shiga toxin is positive.","qs":[{"n":727,"t":"mc","visit":"Visit 1","s":"Which organism is **most likely**?","opts":["Shiga toxin–producing E. coli (O157:H7)","Enterotoxigenic E. coli from travel","Norovirus from contaminated surfaces","Clostridioides difficile after antibiotics"],"correctIdx":[0],"answer":"A","c":"Shiga toxin–producing E. coli, especially O157:H7, is classically linked to undercooked ground beef, unpasteurized milk or juice, and contaminated produce. It causes severe cramps and watery diarrhea that becomes bloody, often with little or no fever. Norovirus causes vomiting and non-bloody diarrhea, and enterotoxigenic E. coli causes watery traveler's diarrhea."},{"n":728,"t":"mc","visit":"Visit 1 (continued)","s":"Why should antibiotics and antimotility drugs be **avoided** in this infection?","opts":["They cause the bacteria to spread to the lungs","They make the stool test result falsely negative","They raise the risk of hemolytic uremic syndrome","They are only harmful in children under age 2"],"correctIdx":[2],"answer":"C","c":"Antibiotics (and possibly antimotility agents such as loperamide) in STEC infection can increase toxin release and the risk of hemolytic uremic syndrome (HUS), a triad of microangiopathic hemolytic anemia, thrombocytopenia and acute kidney injury that occurs mainly in children and older adults. Treatment is supportive with fluids, and CBC and kidney function are monitored. Cases are reported to public health."},{"n":729,"t":"match","visit":"Visit 2 (teaching)","s":"**Drag each cause of diarrhea to its classic setting.** One option will not be used.","items":["Norovirus","Clostridioides difficile","Giardia lamblia"],"tgts":["Foul-smelling, greasy diarrhea after drinking stream water while camping","Diarrhea after recent clindamycin or other antibiotics","Sudden vomiting and diarrhea in a cruise ship outbreak","Rice-water diarrhea after eating raw oysters"],"map":[2,1,0],"answer":"1–C, 2–B, 3–A","c":"Norovirus causes outbreaks of sudden vomiting and watery diarrhea in closed settings such as cruise ships, schools and nursing homes. C. difficile causes diarrhea after antibiotic exposure, especially clindamycin, fluoroquinolones and cephalosporins, and is treated with oral vancomycin or fidaxomicin. Giardia causes foul-smelling, greasy diarrhea, bloating and flatulence after drinking untreated water. Rice-water diarrhea from shellfish suggests Vibrio cholerae."}]},{"no":244,"batch":10,"title":"Mr. Kowalczyk: Dark Urine After a Workout","setting":"Urgent visit • Young adult • Renal / Musculoskeletal","scenario":"Mr. Kowalczyk is a 23-year-old man who did an extremely intense, unaccustomed CrossFit workout in the heat 2 days ago. He now has severe muscle pain, swelling and weakness in both thighs and arms, and his urine is dark brown. Urine dipstick is strongly positive for blood, but microscopy shows no red blood cells. CK is 48,000 U/L and creatinine is 1.6 mg/dL.","qs":[{"n":730,"t":"mc","visit":"Visit 1","s":"What is the **most likely** diagnosis?","opts":["Acute glomerulonephritis","Exertional rhabdomyolysis","Delayed-onset muscle soreness","Kidney stone with hematuria"],"correctIdx":[1],"answer":"B","c":"Exertional rhabdomyolysis is muscle breakdown after intense or unaccustomed exercise, especially in heat or with dehydration. Myoglobin released into the blood causes dark \"tea-colored\" urine and a urine dipstick positive for blood without red cells on microscopy. CK is markedly elevated (often more than 5 times normal). Myoglobin can cause acute kidney injury."},{"n":731,"t":"mc","visit":"Visit 1 (continued)","s":"What is the **most important** treatment?","opts":["Aggressive IV fluids with close lab monitoring","Oral potassium supplements twice daily","Strenuous exercise to help clear the muscle","Oral NSAIDs for the muscle pain at home"],"correctIdx":[0],"answer":"A","c":"The key treatment is early aggressive IV fluid (isotonic crystalloid) to maintain high urine output and prevent kidney injury, with close monitoring of CK, creatinine and electrolytes. Rhabdomyolysis releases potassium and phosphate and can cause hyperkalemia and arrhythmias, so potassium supplements are dangerous. NSAIDs should be avoided because they can worsen kidney injury."},{"n":732,"t":"sata","visit":"Visit 1 (continued)","s":"Which complications must be **monitored** in rhabdomyolysis? **Select all that apply.**","opts":["Hypernatremia from muscle salt","Compartment syndrome","Hyperkalemia","Acute kidney injury","Polycythemia from dehydration"],"correctIdx":[1,2,3],"answer":"B, C, D","c":"Complications of rhabdomyolysis include hyperkalemia, hyperphosphatemia, early hypocalcemia, acute kidney injury, compartment syndrome (pain out of proportion, tense swollen compartments), metabolic acidosis and, rarely, disseminated intravascular coagulation. Return to exercise should be gradual once CK normalizes and symptoms resolve."}]},{"no":245,"batch":10,"title":"Olivia: Heavy Periods Since the Start","setting":"Primary care clinic • Adolescent • Hematology / Gynecology","scenario":"Olivia is a 14-year-old girl who started her periods a year ago. Each period lasts 8–9 days with soaking of a pad every 1–2 hours and passing large clots, and she has missed school because of it. She has frequent nosebleeds lasting more than 10 minutes and bruises easily. Her mother also has heavy periods and bled heavily after a tooth extraction. Hemoglobin is 9.8 g/dL with low ferritin.","qs":[{"n":733,"t":"mc","visit":"Visit 1","s":"Which underlying condition should be **evaluated** in Olivia?","opts":["Hypothyroidism only","Von Willebrand disease","Uterine fibroids","Endometrial cancer"],"correctIdx":[1],"answer":"B","c":"Heavy menstrual bleeding since menarche, prolonged nosebleeds, easy bruising and a family history of bleeding should prompt evaluation for a bleeding disorder, most commonly von Willebrand disease, which is often autosomal dominant. Up to 20% of adolescents with heavy menstrual bleeding have a bleeding disorder. Testing includes CBC, PT/PTT, fibrinogen, von Willebrand antigen and activity, and factor VIII."},{"n":734,"t":"mc","visit":"Visit 1 (continued)","s":"Which medication should Olivia **avoid** for her menstrual pain?","opts":["Acetaminophen when needed","Oral iron supplements daily","Ibuprofen and other NSAIDs","Tranexamic acid during menses"],"correctIdx":[2],"answer":"C","c":"NSAIDs and aspirin impair platelet function and should be avoided in patients with known or suspected bleeding disorders. Acetaminophen is safer for pain. Treatment for heavy menstrual bleeding with von Willebrand disease may include hormonal therapy (combined hormonal contraceptives or the levonorgestrel IUD), tranexamic acid or desmopressin, along with iron replacement."},{"n":735,"t":"sata","visit":"Visit 1 (continued)","s":"Which findings define **heavy menstrual bleeding** that warrants evaluation in adolescents? **Select all that apply.**","opts":["Bleeding lasting more than 7 days","Changing a pad or tampon every 1–2 hours","Mild cramps on the first day only","Clots larger than about 1 inch","Cycles every 28 days with 5 days of flow"],"correctIdx":[0,1,3],"answer":"A, B, D","c":"In adolescents, heavy menstrual bleeding is suggested by periods lasting more than 7 days, soaking a pad or tampon every 1–2 hours, passing clots larger than about 1 inch, flooding, needing to change products overnight, iron deficiency or anemia, and missing activities. Normal adolescent cycles are 21–45 days with 7 or fewer days of bleeding."}]},{"no":246,"batch":10,"title":"Ethan: Fainted in Church","setting":"Primary care clinic • Adolescent • Cardiovascular","scenario":"Ethan is a 15-year-old boy who fainted while standing for a long time in a hot church. Before fainting he felt warm, nauseated and light-headed and his vision went gray. He was unconscious for less than 30 seconds and recovered fully without confusion. He has never fainted during exercise. There is no family history of sudden death. His examination and ECG are normal.","qs":[{"n":736,"t":"mc","visit":"Visit 1","s":"What is the **most likely** cause of Ethan's syncope?","opts":["A generalized seizure disorder","Long QT syndrome arrhythmia","Hypertrophic cardiomyopathy","Vasovagal (reflex) syncope"],"correctIdx":[3],"answer":"D","c":"Vasovagal syncope is the most common cause of fainting in adolescents. It is triggered by prolonged standing, heat, pain, fear or the sight of blood, and is preceded by prodromal symptoms (warmth, nausea, sweating, light-headedness, tunnel vision), with brief loss of consciousness and rapid full recovery. A normal examination and ECG are reassuring."},{"n":737,"t":"sata","visit":"Visit 1 (continued)","s":"Which features would be **red flags** for a cardiac cause of syncope? **Select all that apply.**","opts":["Family history of sudden death before age 50","Feeling warm and nauseated before fainting","Fainting preceded by palpitations or chest pain","Fainting after standing in a hot room","Fainting during exercise"],"correctIdx":[0,2,4],"answer":"A, C, E","c":"Red flags for cardiac syncope include syncope during exertion, syncope while lying down, palpitations or chest pain beforehand, no prodrome, a family history of sudden cardiac death, cardiomyopathy or inherited arrhythmia, an abnormal cardiac examination (murmur) or an abnormal ECG (long QT, pre-excitation, Brugada pattern, hypertrophy). These require cardiology evaluation before further sports participation."},{"n":738,"t":"mc","visit":"Visit 1 (continued)","s":"Which advice is **most appropriate** for Ethan?","opts":["Restrict salt and fluids to avoid fainting again","Hydrate well and sit or lie down when warning signs start","Start a daily beta-blocker to prevent the fainting","Stop all physical activity and sports permanently"],"correctIdx":[1],"answer":"B","c":"Vasovagal syncope is managed with education and reassurance: maintain good fluid (and, if appropriate, salt) intake, avoid triggers, and at the first warning symptoms lie down with legs raised or sit, or use counter-pressure maneuvers (leg crossing, hand gripping). Medications are rarely needed. Sports are not restricted for typical vasovagal syncope."}]},{"no":247,"batch":10,"title":"Baby Malik: An Opening in the Wrong Place","setting":"Newborn exam • Newborn • Genitourinary","scenario":"Malik is a 1-day-old term boy. On examination, the urethral opening is on the underside of the penis, partway along the shaft, and the foreskin is incomplete on the underside, forming a \"hood.\" There is mild downward curvature of the penis. Both testes are descended and palpable. His parents want him circumcised before going home.","qs":[{"n":739,"t":"mc","visit":"Visit 1","s":"What is the **most likely** diagnosis?","opts":["Epispadias","Phimosis","Hypospadias","Micropenis"],"correctIdx":[2],"answer":"C","c":"Hypospadias is a congenital condition in which the urethral opening is on the ventral (under) side of the penis, anywhere from the glans to the perineum, often with a dorsal hooded foreskin and ventral curvature (chordee). Epispadias is a rare dorsal opening associated with bladder exstrophy. Phimosis is a non-retractable foreskin, normal in newborns."},{"n":740,"t":"mc","visit":"Visit 1 (continued)","s":"What should the FNP tell the parents about **circumcision**?","opts":["It must be done to prevent urinary tract infections","It will correct the position of the urethral opening","It should be done today before he is discharged home","It should be delayed because the foreskin may be used in repair"],"correctIdx":[3],"answer":"D","c":"Newborns with hypospadias should not be circumcised, because the foreskin is often used in surgical repair. Repair is usually done by a pediatric urologist between 6 and 18 months of age to allow normal urination standing up, straight erections and normal appearance."},{"n":741,"t":"mc","visit":"Visit 1 (continued)","s":"Which finding would require **urgent** further evaluation in a newborn with hypospadias?","opts":["Normal urine stream at the first void","A distal opening near the tip of the penis","A hooded foreskin on the top side only","One or both testes that cannot be felt"],"correctIdx":[3],"answer":"D","c":"Hypospadias combined with one or both undescended testes, or severe (proximal) hypospadias, can indicate a disorder of sex development, such as congenital adrenal hyperplasia in a virilized genetic female, and needs urgent evaluation including karyotype and electrolytes. Isolated distal hypospadias with descended testes is the most common form and is managed electively."}]},{"no":248,"batch":10,"title":"Leila: Mouth Sores and Spots on the Hands","setting":"Primary care clinic • Toddler • Infectious disease","scenario":"Leila is a 2-year-old girl in daycare who has had a fever of 38.6 °C for 2 days, is refusing to eat and is drooling. She has small painful ulcers on her tongue, gums and inside her cheeks, and small red spots and gray oval blisters on her palms, soles and diaper area. Several children at her daycare have similar rashes. She is drinking small amounts and had three wet diapers today.","qs":[{"n":742,"t":"mc","visit":"Visit 1","s":"What is the **most likely** diagnosis?","opts":["Kawasaki disease (vasculitis)","Hand, foot and mouth disease","Varicella (chickenpox)","Herpetic gingivostomatitis"],"correctIdx":[1],"answer":"B","c":"Hand, foot and mouth disease, usually caused by coxsackievirus A16 or enterovirus 71, causes fever and painful oral ulcers with vesicles or papules on the palms, soles and often the buttocks. It spreads easily in daycare settings in summer and fall. Herpetic gingivostomatitis causes swollen, bleeding gums and lip lesions without hand and foot lesions. Varicella causes generalized itchy vesicles in different stages."},{"n":743,"t":"mc","visit":"Visit 1 (continued)","s":"What is the **most important** part of her care?","opts":["Keep her hydrated and control pain and fever","Admit her to hospital for IV antivirals","Start oral acyclovir within 24 hours","Give oral amoxicillin for 10 days"],"correctIdx":[0],"answer":"A","c":"Hand, foot and mouth disease is self-limited, resolving in 7–10 days. The main risk is dehydration from painful mouth sores. Care focuses on fluids (cold drinks, popsicles), acetaminophen or ibuprofen for pain and fever, and avoiding acidic foods. There is no specific antiviral. Signs of dehydration or neurological symptoms (lethargy, myoclonus, weakness) need urgent evaluation."},{"n":744,"t":"sata","visit":"Visit 1 (continued)","s":"Which statements are **correct** for her parents? **Select all that apply.**","opts":["Antibiotics will shorten the illness","Handwashing after diaper changes reduces spread","The virus can be shed in stool for weeks after recovery","Fingernail shedding can occur weeks later","She is no longer contagious once the fever starts"],"correctIdx":[1,2,3],"answer":"B, C, D","c":"Enteroviruses are shed in respiratory secretions for 1–3 weeks and in stool for weeks after symptoms resolve, so careful handwashing (especially after diaper changes) and cleaning shared toys reduce spread. Nail shedding (onychomadesis) or peeling of the palms and soles may occur weeks later and resolves on its own. Children can usually return to daycare when fever-free and able to manage drooling."}]},{"no":249,"batch":10,"title":"Noah: The Shortest in His Class","setting":"Well-child visit • School-age child • Growth / Endocrine","scenario":"Noah is a 10-year-old boy whose parents are worried he is the shortest in his class. His height has consistently tracked along the 3rd percentile since age 2, and he grows about 2 inches a year. His weight is at the 25th percentile. His father is 5 ft 5 in and his mother 5 ft 0 in. His bone age matches his chronological age. He is healthy, with no chronic symptoms.","qs":[{"n":745,"t":"mc","visit":"Visit 1","s":"What is the **most likely** explanation for his height?","opts":["Constitutional delay of growth","Untreated celiac disease","Familial (genetic) short stature","Growth hormone deficiency"],"correctIdx":[2],"answer":"C","c":"Familial short stature is a normal variant: the child grows at a normal rate along a low percentile consistent with short parents, with a bone age equal to chronological age and normal timing of puberty, reaching a short adult height in line with the mid-parental target. Constitutional delay shows a delayed bone age and late puberty with normal final height. Pathologic causes show slowing growth velocity."},{"n":746,"t":"match","visit":"Visit 1 (continued)","s":"**Drag each growth pattern to its typical features.** One option will not be used.","items":["Familial short stature","Constitutional delay of growth and puberty","Growth hormone deficiency"],"tgts":["Normal growth rate on a low percentile, bone age equal to age, short parents","Falling across height percentiles with increased weight for height","Weight falls first, before height, with diarrhea and anemia","Delayed bone age and late puberty, with catch-up to normal adult height"],"map":[0,3,1],"answer":"1–A, 2–D, 3–B","c":"Familial short stature shows normal growth velocity and a bone age equal to chronological age. Constitutional delay shows a delayed bone age, late puberty and often a family history of \"late bloomers,\" with normal adult height. Endocrine causes such as growth hormone deficiency or hypothyroidism cause slowing growth velocity with height crossing percentiles downward while weight is relatively preserved. When weight falls first, nutritional or GI causes such as celiac disease or IBD are more likely."},{"n":747,"t":"mc","visit":"Visit 1 (continued)","s":"Which finding would **most** warrant further evaluation for a pathologic cause?","opts":["Height on the 3rd percentile like his short parents","A bone age matching his chronological age","Height crossing downward through two major percentiles","A steady growth rate of 2 inches each year"],"correctIdx":[2],"answer":"C","c":"A decline in growth velocity, with height crossing two or more major percentile lines, is the most important red flag for pathologic short stature (endocrine, genetic, chronic disease or malnutrition). Other red flags include height far below the mid-parental target, disproportionate body proportions, dysmorphic features and chronic symptoms. Evaluation may include bone age, CBC, metabolic panel, celiac serology, TSH, IGF-1 and a karyotype in girls."}]},{"no":250,"batch":10,"title":"Baby Zainab: Fever Without a Source","setting":"Urgent visit • Infant • Genitourinary / Infectious disease","scenario":"Zainab is a 7-month-old girl with 2 days of fever up to 39.5 °C, irritability and decreased feeding. She has no cough, runny nose, diarrhea or rash. Her examination shows no source of fever, and she appears well hydrated and non-toxic. A catheterized urine sample shows positive leukocyte esterase and nitrites with many white blood cells. She has had all her vaccines.","qs":[{"n":748,"t":"mc","visit":"Visit 1","s":"Which method of urine collection is **appropriate** for culture in an infant who is not toilet trained?","opts":["Waiting until she can give a clean catch","Squeezing a wet diaper into a sterile cup","A sterile bag taped over the perineum","Catheterization or suprapubic aspiration"],"correctIdx":[3],"answer":"D","c":"In infants and children who are not toilet trained, urine for culture should be obtained by catheterization or suprapubic aspiration. Bag specimens have high contamination rates and are useful only to screen if negative. Febrile UTI is the most common serious bacterial infection in infants with fever and no source, especially girls under 2 and uncircumcised boys."},{"n":749,"t":"mc","visit":"Visit 1 (continued)","s":"She is well-appearing and taking fluids. What is the **most appropriate** treatment?","opts":["An oral antibiotic such as cephalexin for 7–10 days","A single dose of oral nitrofurantoin today","IV antibiotics in hospital for 4 weeks","No antibiotics until the culture grows bacteria"],"correctIdx":[0],"answer":"A","c":"Well-appearing infants over 2 months with febrile UTI who can take oral fluids can be treated with oral antibiotics such as cephalexin or another cephalosporin (chosen by local resistance) for 7–10 days, adjusted to culture results. Hospitalization and IV therapy are needed for toxic appearance, vomiting, dehydration or age under 2 months. Nitrofurantoin does not reach adequate kidney levels for pyelonephritis."},{"n":750,"t":"mc","visit":"Visit 2 (follow-up)","s":"After her first febrile UTI, which imaging is **recommended**?","opts":["CT scan of the abdomen and pelvis","Voiding cystourethrogram first","Renal and bladder ultrasound","No imaging at any point at all"],"correctIdx":[2],"answer":"C","c":"The AAP recommends a renal and bladder ultrasound for infants and young children aged 2–24 months after a first febrile UTI to detect anatomic abnormalities. A voiding cystourethrogram is not routinely done after the first UTI; it is recommended if the ultrasound shows hydronephrosis, scarring or other findings suggesting high-grade vesicoureteral reflux, or after a recurrent febrile UTI."}]},{"no":251,"batch":11,"title":"Mr. Stanislaw: Coughing at Every Meal","setting":"Primary care clinic • Older adult • Neurology / Respiratory","scenario":"Mr. Stanislaw is a 79-year-old man who had a left-hemisphere stroke 6 weeks ago with mild right-sided weakness and slurred speech. His wife says he coughs and clears his throat during most meals, his voice sounds \"wet\" after drinking, and food sometimes collects in his cheek. He now has a fever of 38.4 °C, a productive cough and crackles over the right lower back.","qs":[{"n":751,"t":"mc","visit":"Visit 1","s":"What is the **most likely** cause of his current illness?","opts":["Viral bronchitis caught from a family member","Pulmonary embolism from post-stroke immobility","Heart failure with pulmonary edema from fluids","Aspiration pneumonia from post-stroke dysphagia"],"correctIdx":[3],"answer":"D","c":"Oropharyngeal dysphagia is common after stroke and causes coughing or choking during meals, a wet or gurgly voice, food pocketing and recurrent chest infections. Aspiration of oral contents leads to aspiration pneumonia, which is a major cause of death after stroke. Silent aspiration without coughing is also common."},{"n":752,"t":"hot","visit":"Visit 1 (continued)","s":"He usually eats sitting upright. **Click the lobe most often affected by aspiration in an upright patient.**","answer":"E","c":"Because the right main bronchus is wider and more vertical, aspirated material usually enters the right lung. In upright patients, the right lower lobe (basal segments) is most often affected; in patients lying supine, the posterior segment of the right upper lobe and superior segment of the right lower lobe are commonly involved.","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 400 320\" width=\"100%\" height=\"auto\"><rect width=\"400\" height=\"320\" fill=\"none\"/><path d=\"M 120 40 Q 200 20 280 40 L 330 70 Q 352 160 330 300 L 70 300 Q 48 160 70 70 Z\" fill=\"var(--skin)\" stroke=\"var(--diagram-ink)\" stroke-width=\"2.5\"/>\n<path d=\"M 172 40 Q 200 58 228 40\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-width=\"2\"/>\n<path d=\"M 196 62 Q 150 64 86 74\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-width=\"5\" stroke-linecap=\"round\"/>\n<path d=\"M 204 62 Q 250 64 314 74\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-width=\"5\" stroke-linecap=\"round\"/>\n<rect x=\"186\" y=\"66\" width=\"28\" height=\"170\" rx=\"10\" fill=\"var(--diagram-ink)\" fill-opacity=\"0.14\" stroke=\"var(--diagram-ink)\" stroke-width=\"2\"/>\n<path d=\"M 184 96 Q 120 102 86 126\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-opacity=\"0.35\" stroke-width=\"2\"/><path d=\"M 216 96 Q 280 102 314 126\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-opacity=\"0.35\" stroke-width=\"2\"/><path d=\"M 184 122 Q 120 128 90 152\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-opacity=\"0.35\" stroke-width=\"2\"/><path d=\"M 216 122 Q 280 128 310 152\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-opacity=\"0.35\" stroke-width=\"2\"/><path d=\"M 184 148 Q 120 154 94 178\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-opacity=\"0.35\" stroke-width=\"2\"/><path d=\"M 216 148 Q 280 154 306 178\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-opacity=\"0.35\" stroke-width=\"2\"/><path d=\"M 184 174 Q 120 180 98 204\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-opacity=\"0.35\" stroke-width=\"2\"/><path d=\"M 216 174 Q 280 180 302 204\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-opacity=\"0.35\" stroke-width=\"2\"/><path d=\"M 184 200 Q 120 206 102 230\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-opacity=\"0.35\" stroke-width=\"2\"/><path d=\"M 216 200 Q 280 206 298 230\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-opacity=\"0.35\" stroke-width=\"2\"/><path d=\"M 184 226 Q 120 232 106 256\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-opacity=\"0.35\" stroke-width=\"2\"/><path d=\"M 216 226 Q 280 232 294 256\" fill=\"none\" stroke=\"var(--diagram-ink)\" stroke-opacity=\"0.35\" stroke-width=\"2\"/>\n<line x1=\"288\" y1=\"70\" x2=\"288\" y2=\"290\" stroke=\"var(--diagram-ink)\" stroke-width=\"1.5\" stroke-dasharray=\"5 5\" stroke-opacity=\"0.6\"/>\n<text x=\"292\" y=\"286\" font-family=\"Arial, sans-serif\" font-size=\"11\" font-weight=\"400\" fill=\"var(--diagram-ink)\" text-anchor=\"start\">MCL</text><text x=\"40\" y=\"20\" font-family=\"Arial, sans-serif\" font-size=\"12\" font-weight=\"700\" fill=\"var(--diagram-ink)\" text-anchor=\"start\">Patient's RIGHT</text><text x=\"268\" y=\"20\" font-family=\"Arial, sans-serif\" font-size=\"12\" font-weight=\"700\" fill=\"var(--diagram-ink)\" text-anchor=\"start\">Patient's LEFT</text><g class=\"zone\" data-id=\"A\" tabindex=\"0\" role=\"button\" aria-label=\"Area A\">\n<circle cx=\"120\" cy=\"112\" r=\"15\" fill=\"var(--zone-fill)\" stroke=\"var(--zone-ink)\" stroke-width=\"2.5\"/>\n<text x=\"120\" y=\"117.5\" text-anchor=\"middle\" font-family=\"Georgia, 'Times New Roman', serif\" font-size=\"16\" font-weight=\"700\" fill=\"var(--zone-ink)\">A</text></g><g class=\"zone\" data-id=\"B\" tabindex=\"0\" role=\"button\" aria-label=\"Area B\">\n<circle cx=\"280\" cy=\"104\" r=\"15\" fill=\"var(--zone-fill)\" stroke=\"var(--zone-ink)\" stroke-width=\"2.5\"/>\n<text x=\"280\" y=\"109.5\" text-anchor=\"middle\" font-family=\"Georgia, 'Times New Roman', serif\" font-size=\"16\" font-weight=\"700\" fill=\"var(--zone-ink)\">B</text></g><g class=\"zone\" data-id=\"C\" tabindex=\"0\" role=\"button\" aria-label=\"Area C\">\n<circle cx=\"120\" cy=\"190\" r=\"15\" fill=\"var(--zone-fill)\" stroke=\"var(--zone-ink)\" stroke-width=\"2.5\"/>\n<text x=\"120\" y=\"195.5\" text-anchor=\"middle\" font-family=\"Georgia, 'Times New Roman', serif\" font-size=\"16\" font-weight=\"700\" fill=\"var(--zone-ink)\">C</text></g><g class=\"zone\" data-id=\"D\" tabindex=\"0\" role=\"button\" aria-label=\"Area D\">\n<circle cx=\"300\" cy=\"260\" r=\"15\" fill=\"var(--zone-fill)\" stroke=\"var(--zone-ink)\" stroke-width=\"2.5\"/>\n<text x=\"300\" y=\"265.5\" text-anchor=\"middle\" font-family=\"Georgia, 'Times New Roman', serif\" font-size=\"16\" font-weight=\"700\" fill=\"var(--zone-ink)\">D</text></g><g class=\"zone\" data-id=\"E\" tabindex=\"0\" role=\"button\" aria-label=\"Area E\">\n<circle cx=\"100\" cy=\"260\" r=\"15\" fill=\"var(--zone-fill)\" stroke=\"var(--zone-ink)\" stroke-width=\"2.5\"/>\n<text x=\"100\" y=\"265.5\" text-anchor=\"middle\" font-family=\"Georgia, 'Times New Roman', serif\" font-size=\"16\" font-weight=\"700\" fill=\"var(--zone-ink)\">E</text></g></svg>"},{"n":753,"t":"sata","visit":"Visit 2 (after treatment)","s":"Which measures reduce his risk of **further aspiration**? **Select all that apply.**","opts":["Sitting fully upright during meals and for 30 minutes after","Thin liquids taken quickly through a straw","Lying flat right after meals to rest","Diet texture changes as recommended after testing","Referral for a speech-language pathology swallow evaluation"],"correctIdx":[0,3,4],"answer":"A, D, E","c":"Patients with suspected dysphagia need a formal swallow evaluation by a speech-language pathologist (often with a videofluoroscopic swallow study or endoscopic evaluation). Measures include upright positioning at 90° during meals and for 30 minutes after, texture-modified diets or thickened liquids if recommended, small bites, chin-tuck techniques, supervision and good oral hygiene, which lowers the bacterial load of aspirated secretions."}]},{"no":252,"batch":11,"title":"Mrs. Larkin: Legs That Will Not Stay Still","setting":"Primary care clinic • Older adult • Neurology / Sleep","scenario":"Mrs. Larkin is a 70-year-old woman with an uncomfortable \"creepy-crawly\" feeling deep in both legs every evening that creates an irresistible urge to move them. The sensation starts when she sits or lies down and is relieved by walking. It keeps her from falling asleep. She takes diphenhydramine at night for sleep. Her ferritin is 38 ng/mL, and kidney function is normal.","qs":[{"n":754,"t":"mc","visit":"Visit 1","s":"What is the **most likely** diagnosis?","opts":["Peripheral artery disease","Diabetic neuropathy","Restless legs syndrome","Nocturnal leg cramps"],"correctIdx":[2],"answer":"C","c":"Restless legs syndrome (Willis–Ekbom disease) is an urge to move the legs, usually with uncomfortable sensations, that begins or worsens with rest, is relieved by movement and is worse in the evening or at night. Nocturnal leg cramps are painful, palpable muscle contractions, and PAD causes exertional calf pain relieved by rest."},{"n":755,"t":"sata","visit":"Visit 1 (continued)","s":"Which factors can **worsen** restless legs syndrome? **Select all that apply.**","opts":["Regular moderate daytime exercise","Iron deficiency","Some antidepressants and antipsychotics","Daily iron supplementation","Sedating antihistamines such as diphenhydramine"],"correctIdx":[1,2,4],"answer":"B, C, E","c":"RLS can be worsened by iron deficiency (even with a normal hemoglobin), sedating antihistamines, dopamine antagonists (antipsychotics, metoclopramide), many antidepressants (SSRIs, SNRIs, mirtazapine), caffeine, alcohol and sleep deprivation. It is also associated with pregnancy, kidney failure and neuropathy. Moderate exercise and correcting iron deficiency help."},{"n":756,"t":"mc","visit":"Visit 1 (continued)","s":"What is the **most appropriate** first treatment for her?","opts":["Long-term nightly opioid therapy","Iron replacement to raise ferritin above 75","A higher dose of diphenhydramine","High-dose pramipexole started immediately"],"correctIdx":[1],"answer":"B","c":"In RLS, iron supplementation is recommended when ferritin is 75 ng/mL or below (or transferrin saturation below 20%), even without anemia, because brain iron deficiency plays a role. Stopping aggravating drugs (such as diphenhydramine) also helps. Alpha-2-delta ligands (gabapentin, pregabalin) are now preferred first-line drugs; dopamine agonists are used less because of augmentation (worsening symptoms over time)."}]},{"no":253,"batch":11,"title":"Mr. Bello: Numb Feet With Diabetes","setting":"Diabetes follow-up • Older adult • Endocrine / Neurology","scenario":"Mr. Bello is a 68-year-old man with type 2 diabetes for 18 years (A1c 8.6%). He has burning pain and numbness in both feet in a \"stocking\" pattern, worse at night, which interferes with his sleep. He cannot feel the 10-g monofilament at several sites on both feet, and ankle reflexes and vibration sense are reduced. His feet are intact without ulcers. His eGFR is 55.","qs":[{"n":757,"t":"mc","visit":"Visit 1","s":"What is the **main purpose** of the 10-g monofilament test?","opts":["To detect loss of protective sensation","To diagnose plantar fasciitis","To check for an active foot infection","To measure blood flow to the feet"],"correctIdx":[0],"answer":"A","c":"The 10-g Semmes–Weinstein monofilament test identifies loss of protective sensation, which greatly increases the risk of foot ulcers and amputation. Everyone with diabetes should have a comprehensive foot examination at least yearly (monofilament plus vibration, pinprick, temperature or reflexes, and a vascular check), and those with neuropathy should have their feet inspected at every visit."},{"n":758,"t":"mc","visit":"Visit 1 (continued)","s":"Which medication is a **first-line** option for his painful diabetic neuropathy?","opts":["Ibuprofen","Oxycodone","Lorazepam","Duloxetine"],"correctIdx":[3],"answer":"D","c":"First-line drugs for painful diabetic neuropathy include duloxetine (an SNRI), pregabalin or gabapentin (doses adjusted for kidney function), and tricyclic antidepressants in younger patients. Topical capsaicin is another option. Opioids, including tramadol, are not recommended as first-line therapy. Better glucose control helps prevent progression."},{"n":759,"t":"sata","visit":"Visit 1 (continued)","s":"Which **foot care** instructions are appropriate for Mr. Bello? **Select all that apply.**","opts":["Soak his feet in hot water every night","Inspect his feet daily, using a mirror if needed","Wear well-fitting shoes and never walk barefoot","Cut corns himself with a razor blade","Check bath water with his elbow or a thermometer"],"correctIdx":[1,2,4],"answer":"B, C, E","c":"People with neuropathy should inspect their feet daily, wash and dry them carefully (including between the toes), moisturize but not between the toes, wear proper footwear and socks, never walk barefoot, test water temperature with the elbow or a thermometer, and have corns, calluses and nails treated by a podiatrist. Soaking can macerate the skin, and self-treatment of corns risks ulcers."}]},{"no":254,"batch":11,"title":"Mr. Hayes: Fever With an Artificial Valve","setting":"Primary care clinic • Older adult • Cardiovascular / Infectious disease","scenario":"Mr. Hayes is a 73-year-old man with a mechanical aortic valve replaced 5 years ago. For 3 weeks he has had low-grade fevers, night sweats, fatigue and a 6-lb weight loss. He had extensive dental work 6 weeks ago and forgot to take antibiotics before it. He has a new diastolic murmur, small painless red spots on his palms and soles, and splinter hemorrhages under several nails.","qs":[{"n":760,"t":"mc","visit":"Visit 1","s":"Which diagnosis is the **most important** concern?","opts":["Rheumatic fever relapse","Viral influenza illness","Infective endocarditis","Lymphoma with B symptoms"],"correctIdx":[2],"answer":"C","c":"Infective endocarditis should be suspected in any patient with a prosthetic valve and fever. Subacute endocarditis, often caused by viridans streptococci after dental procedures, presents with weeks of fever, sweats, weight loss and fatigue, with a new or changed murmur and embolic or immunologic signs such as Janeway lesions (painless spots on palms and soles), Osler nodes (painful finger pads), splinter hemorrhages and Roth spots."},{"n":761,"t":"mc","visit":"Visit 1 (continued)","s":"What must be done **before** antibiotics are started?","opts":["Obtain at least 3 sets of blood cultures","Wait for the echocardiogram to be read","Obtain a urine culture only from a catheter","Obtain a single throat swab for culture"],"correctIdx":[0],"answer":"A","c":"At least three sets of blood cultures from separate venipunctures should be drawn before antibiotics in stable patients with suspected endocarditis, because they are essential for diagnosis and choosing therapy. Echocardiography (transesophageal for prosthetic valves) is then performed. The modified Duke criteria combine microbiology, imaging and clinical findings. He needs urgent hospital evaluation."},{"n":762,"t":"sata","visit":"Visit 2 (after recovery)","s":"Which patients **should** receive antibiotic prophylaxis before dental procedures that manipulate gums? **Select all that apply.**","opts":["Patients with prior infective endocarditis","Patients with a prosthetic heart valve","Patients with mitral valve prolapse alone","Cardiac transplant recipients with valve disease","Patients with a history of coronary stents"],"correctIdx":[0,1,3],"answer":"A, B, D","c":"AHA guidelines limit dental prophylaxis to patients at highest risk of adverse outcomes: prosthetic valves or valve repair material, prior infective endocarditis, certain congenital heart disease (unrepaired cyanotic disease or repaired defects with residual shunts), and cardiac transplant recipients with valvulopathy. Amoxicillin 2 g 30–60 minutes before the procedure is standard. Mitral valve prolapse and coronary stents alone do not require prophylaxis."}]},{"no":255,"batch":11,"title":"Mrs. Petrova: Sudden Back Pain Lifting a Pot","setting":"Primary care clinic • Older adult • Musculoskeletal","scenario":"Mrs. Petrova is a 77-year-old woman who felt sudden, sharp mid-back pain while lifting a heavy pot of soup 5 days ago. The pain is worse with standing and walking and better lying down. She has lost 2 inches of height over the years and has a rounded upper back. She has no fever, weight loss, leg weakness or bladder problems. She has never had a DEXA scan and takes prednisone for COPD.","qs":[{"n":763,"t":"mc","visit":"Visit 1","s":"What is the **most likely** diagnosis?","opts":["Metastatic cancer to the thoracic spine","Ankylosing spondylitis of the spine","Lumbar disc herniation with radiculopathy","Osteoporotic vertebral compression fracture"],"correctIdx":[3],"answer":"D","c":"Vertebral compression fractures are the most common osteoporotic fractures, often occurring with minimal trauma such as lifting, bending or coughing. They cause sudden localized mid or low back pain worse with standing, and repeated fractures cause height loss and kyphosis. Long-term glucocorticoids are a major risk factor. Many compression fractures are asymptomatic and found incidentally."},{"n":764,"t":"sata","visit":"Visit 1 (continued)","s":"Which findings would be **red flags** for a more serious cause such as cancer or infection? **Select all that apply.**","opts":["Fever or recent infection","Height loss over many years","Pain that improves when lying down","Unexplained weight loss or night pain","A history of cancer"],"correctIdx":[0,3,4],"answer":"A, D, E","c":"Red flags in back pain include a history of cancer, unexplained weight loss, night pain or pain at rest, fever, IV drug use, immunosuppression, and neurological deficits or bladder or bowel dysfunction (possible cord compression). These warrant MRI and laboratory evaluation. Gradual height loss and pain relieved by lying down are typical of osteoporotic fractures."},{"n":765,"t":"mc","visit":"Visit 1 (continued)","s":"After x-rays confirm a compression fracture, what is the **most important** long-term step?","opts":["Start osteoporosis treatment such as a bisphosphonate","Stop all physical activity for the rest of her life","A spinal fusion operation within the month","Strict bed rest for 6 weeks to let it heal"],"correctIdx":[0],"answer":"A","c":"A fragility vertebral fracture establishes a diagnosis of osteoporosis regardless of DEXA results and greatly increases the risk of further fractures. She should start osteoporosis therapy (such as a bisphosphonate or, with very high risk, an anabolic agent like teriparatide), with calcium, vitamin D, fall prevention and a review of glucocorticoid use. Acute pain is managed with analgesics, short-term bracing and early mobilization; calcitonin may help pain briefly."}]},{"no":256,"batch":11,"title":"Mr. Dimitrov: Unable to Pass Urine","setting":"Urgent visit • Older adult • Genitourinary / Pharmacology","scenario":"Mr. Dimitrov is a 76-year-old man with benign prostatic hyperplasia who took diphenhydramine and a pseudoephedrine decongestant for a cold for 3 days. Since last night he has been unable to urinate and has severe lower abdominal pain and an urge to void. His lower abdomen is distended, tender and dull to percussion above the pubic bone. A bladder scan shows 1,100 mL.","qs":[{"n":766,"t":"mc","visit":"Visit 1","s":"What is the **most likely** cause of his acute urinary retention?","opts":["Overactive bladder from drinking too much tea","Dehydration from not drinking enough fluids","An acute bacterial kidney infection of both sides","Anticholinergic and decongestant drugs with BPH"],"correctIdx":[3],"answer":"D","c":"Anticholinergic drugs (such as diphenhydramine) impair bladder detrusor contraction, and sympathomimetic decongestants (pseudoephedrine) increase smooth muscle tone at the bladder neck and prostate. In men with BPH, these drugs commonly precipitate acute urinary retention. Other triggers include opioids, constipation, alcohol, surgery and urinary tract infection."},{"n":767,"t":"mc","visit":"Visit 1 (continued)","s":"What is the **immediate** treatment?","opts":["Increase oral fluids and wait for urination","Oral oxybutynin to relax the bladder muscle","Schedule a prostate biopsy for next month","Bladder decompression with a urinary catheter"],"correctIdx":[3],"answer":"D","c":"Acute urinary retention is treated with immediate bladder decompression using a urethral catheter (or suprapubic catheter if urethral placement fails). Full, rapid drainage is generally safe. Kidney function is checked. Offending medications are stopped, and an alpha-blocker such as tamsulosin is started before a trial without the catheter, which improves the chance of successful voiding."},{"n":768,"t":"sata","visit":"Visit 2 (follow-up)","s":"Which **over-the-counter** products should Mr. Dimitrov avoid in the future? **Select all that apply.**","opts":["Sleep aids containing doxylamine","Sedating antihistamines such as diphenhydramine","Saline nasal spray for congestion","Acetaminophen for pain or fever","Oral decongestants such as pseudoephedrine"],"correctIdx":[0,1,4],"answer":"A, B, E","c":"Men with BPH should avoid anticholinergic antihistamines (diphenhydramine, chlorpheniramine), OTC sleep aids containing diphenhydramine or doxylamine, and oral decongestants (pseudoephedrine, phenylephrine), which can cause urinary retention. Saline sprays, nasal steroids and acetaminophen are safe alternatives for cold symptoms. These drugs are also on the Beers list for older adults."}]},{"no":257,"batch":11,"title":"Mrs. Whitfield: Slower and Weaker","setting":"Annual wellness visit • Older adult • Geriatric syndromes","scenario":"Mrs. Whitfield is an 83-year-old widow who lives alone. Over the past year she has unintentionally lost 12 lb, feels exhausted most days, has given up gardening, walks noticeably slower and has trouble opening jars. Her grip strength is low. Her cognition is intact. Labs, including CBC, TSH and metabolic panel, are normal.","qs":[{"n":769,"t":"sata","visit":"Visit 1","s":"Which of her findings are **Fried frailty phenotype** criteria? **Select all that apply.**","opts":["Normal cognitive function","Unintentional weight loss","Self-reported exhaustion","Living alone as a widow","Slow walking speed"],"correctIdx":[1,2,4],"answer":"B, C, E","c":"The Fried frailty phenotype includes five criteria: unintentional weight loss (10 lb or more in a year), self-reported exhaustion, weakness (low grip strength), slow walking speed and low physical activity. Three or more criteria indicate frailty, and one or two indicate pre-frailty. Mrs. Whitfield meets all five. Frailty increases the risk of falls, disability, hospitalization and death."},{"n":770,"t":"mc","visit":"Visit 1 (continued)","s":"Which intervention is **most effective** for frailty?","opts":["A low-protein diet to protect her kidneys","Strict bed rest to save her limited energy","Progressive resistance and balance exercise","Starting several new vitamin supplements"],"correctIdx":[2],"answer":"C","c":"Progressive resistance training with balance and aerobic exercise is the most effective intervention for frailty and sarcopenia, improving strength, function and mobility. It is combined with adequate protein (about 1.0–1.2 g/kg/day unless kidney disease limits it), vitamin D if deficient, a medication review and addressing social isolation. Bed rest accelerates muscle loss."},{"n":771,"t":"mc","visit":"Visit 1 (continued)","s":"Which referral would **best** support her living safely at home?","opts":["Physical therapy and a home safety evaluation","A neurology referral for cognitive testing","Immediate nursing home placement this week","Hospital admission for IV nutrition today"],"correctIdx":[0],"answer":"A","c":"A physical therapy referral for a strength, gait and balance program and an occupational therapy home safety evaluation help frail older adults remain independent. Social support, meal programs, community senior centers and a medical alert device may also help. Her cognition is intact, so neurology referral is not needed, and she does not require institutional care."}]},{"no":258,"batch":11,"title":"Mrs. Grünewald: Gritty Eyes and a Dry Mouth","setting":"Primary care clinic • Middle adult • Rheumatology","scenario":"Mrs. Grünewald is a 52-year-old woman with 1 year of gritty, burning eyes and a very dry mouth; she needs water to swallow dry food and has had several new dental cavities. She has fatigue, joint aches and intermittent swelling of both parotid glands. Anti-SSA (Ro) and anti-SSB (La) antibodies are positive. She takes no anticholinergic medications.","qs":[{"n":772,"t":"mc","visit":"Visit 1","s":"What is the **most likely** diagnosis?","opts":["Rheumatoid arthritis alone","Primary Sjögren syndrome","Bilateral mumps parotitis","Systemic lupus erythematosus"],"correctIdx":[1],"answer":"B","c":"Sjögren syndrome is an autoimmune disease of the exocrine glands, most common in women aged 40–60. It causes dry eyes (keratoconjunctivitis sicca), dry mouth (xerostomia) with dental caries, parotid enlargement, fatigue and arthralgia. Anti-SSA (Ro) and anti-SSB (La) antibodies support the diagnosis, along with a positive Schirmer test or minor salivary gland biopsy. It can be primary or secondary to RA or lupus."},{"n":773,"t":"mc","visit":"Visit 1 (continued)","s":"Which serious complication requires **ongoing** monitoring?","opts":["Hepatocellular cancer","Non-Hodgkin lymphoma","Multiple myeloma","Testicular cancer"],"correctIdx":[1],"answer":"B","c":"People with Sjögren syndrome have a significantly increased risk of non-Hodgkin lymphoma, especially MALT lymphoma of the salivary glands. Persistent parotid enlargement, lymphadenopathy, splenomegaly, low C4 and cryoglobulinemia are warning signs. Anti-SSA antibodies in pregnancy also increase the risk of neonatal lupus and congenital heart block."},{"n":774,"t":"sata","visit":"Visit 1 (continued)","s":"Which treatments help her **dryness symptoms**? **Select all that apply.**","opts":["An oral decongestant daily","A sedating antihistamine at night","Pilocarpine or cevimeline for dry mouth","Sugar-free gum and regular dental care","Preservative-free artificial tears"],"correctIdx":[2,3,4],"answer":"C, D, E","c":"Dry eyes are treated with preservative-free artificial tears, cyclosporine or lifitegrast drops and punctal plugs. Dry mouth is treated with frequent water, sugar-free gum or lozenges, saliva substitutes and muscarinic agonists (pilocarpine, cevimeline). Fluoride and frequent dental care prevent caries. Hydroxychloroquine may help joint symptoms. Anticholinergic medications such as antihistamines and decongestants worsen dryness."}]},{"no":259,"batch":11,"title":"Mr. MacLeod: Fingers That Won't Straighten","setting":"Primary care clinic • Middle adult • Musculoskeletal","scenario":"Mr. MacLeod is a 61-year-old man of Scottish descent with diabetes who drinks heavily. Over 2 years his right ring and little fingers have gradually bent toward his palm, and he can no longer lay his hand flat on a table. Firm, painless cords and nodules are felt in his palm. His other hand has an early nodule. He has no numbness.","qs":[{"n":775,"t":"mc","visit":"Visit 1","s":"What is the **most likely** diagnosis?","opts":["Trigger finger (flexor tendon)","Rheumatoid arthritis with ulnar drift","Dupuytren contracture of the palm","Ulnar nerve palsy with claw hand"],"correctIdx":[2],"answer":"C","c":"Dupuytren contracture is a progressive fibrosis of the palmar fascia forming nodules and cords that pull the fingers (most often the ring and little fingers) into flexion. It is more common in men of Northern European descent and is associated with diabetes, alcohol use, smoking and epilepsy. The tabletop test (inability to lay the hand flat) indicates the need for referral."},{"n":776,"t":"match","visit":"Visit 1 (continued)","s":"**Drag each hand condition to its typical description.** One option will not be used.","items":["Trigger finger","Ganglion cyst","Dupuytren contracture"],"tgts":["A smooth, rubbery lump on the back of the wrist that may change in size","Pain over the radial wrist reproduced by the Finkelstein test","Painless palmar cords pulling the ring and little fingers into flexion","A finger that catches or locks in flexion and snaps when straightened"],"map":[3,0,2],"answer":"1–D, 2–A, 3–C","c":"Trigger finger is stenosing tenosynovitis of the flexor tendon at the A1 pulley, causing catching, locking and a tender palmar nodule; it is common in diabetes and treated with splinting or a steroid injection. A ganglion cyst is a fluid-filled lump, usually on the dorsal wrist, that may transilluminate and often resolves without treatment. Dupuytren contracture causes palmar cords and flexion contractures. Finkelstein-positive radial wrist pain describes de Quervain tenosynovitis."},{"n":777,"t":"mc","visit":"Visit 1 (continued)","s":"What is the **most appropriate** management now?","opts":["Oral antibiotics for a hand infection","Referral to hand surgery for release options","Stretching alone for the rest of his life","Splinting with no follow-up planned"],"correctIdx":[1],"answer":"B","c":"When Dupuytren contracture causes functional limitation or a positive tabletop test (often a MCP contracture of about 30° or more, or any PIP contracture), referral to a hand surgeon is appropriate. Options include needle aponeurotomy, collagenase injection and surgical fasciectomy. Recurrence is common. Splinting and stretching alone do not prevent progression."}]},{"no":260,"batch":11,"title":"Ms. Zhou: Neck Pain Shooting Into the Thumb","setting":"Primary care clinic • Middle adult • Musculoskeletal / Neurology","scenario":"Ms. Zhou is a 48-year-old office worker with 3 weeks of neck pain that radiates down the outer side of her right arm into her thumb and index finger, with tingling in the same area. Her right biceps and wrist extensors are mildly weak and the right biceps and brachioradialis reflexes are reduced. Extending and rotating her neck to the right with downward pressure reproduces the arm pain. She has no gait or bladder problems.","qs":[{"n":778,"t":"mc","visit":"Visit 1","s":"Which nerve root is **most likely** affected?","opts":["C7","C6","C8","C5"],"correctIdx":[1],"answer":"B","c":"C6 radiculopathy (usually from a C5–C6 disc) causes pain and numbness along the lateral forearm into the thumb and index finger, weakness of biceps and wrist extensors, and reduced biceps and brachioradialis reflexes. C7 radiculopathy affects the middle finger, triceps and triceps reflex. C8 affects the ring and little fingers and hand intrinsic muscles. C5 affects the shoulder and deltoid."},{"n":779,"t":"mc","visit":"Visit 1 (continued)","s":"Which maneuver **reproduced** her radicular pain?","opts":["The Lachman test","The Thompson test","The Spurling test","The Phalen test"],"correctIdx":[2],"answer":"C","c":"The Spurling test (extension and rotation of the neck toward the symptomatic side with axial pressure) narrows the neural foramen and reproduces radicular arm pain in cervical radiculopathy; it is specific but not sensitive. The Phalen test assesses carpal tunnel syndrome, which may coexist and should be distinguished (median nerve symptoms with normal reflexes and neck exam)."},{"n":780,"t":"mc","visit":"Visit 1 (continued)","s":"What is the **most appropriate** initial management?","opts":["A rigid neck collar worn for 3 months","NSAIDs, activity modification and physical therapy","Strict bed rest until the pain is gone","Immediate cervical spine fusion surgery"],"correctIdx":[1],"answer":"B","c":"Most cervical radiculopathy improves within weeks to months with conservative care: NSAIDs or other analgesics, short-term activity modification, physical therapy and sometimes a short oral steroid course or epidural injection. MRI is obtained for progressive neurological deficits, symptoms persisting beyond 6 weeks or red flags. Signs of myelopathy (gait disturbance, hand clumsiness, hyperreflexia, bladder changes) need urgent evaluation."}]},{"no":261,"batch":11,"title":"Mrs. Adebayo: Tearing Pain With Bowel Movements","setting":"Primary care clinic • Middle adult • Gastrointestinal","scenario":"Mrs. Adebayo is a 45-year-old woman with chronic constipation who has had 5 weeks of severe, tearing anal pain during and for an hour after each bowel movement, with small amounts of bright red blood on the toilet paper. Gentle separation of the buttocks shows a linear tear in the posterior midline of the anal canal with a small skin tag at its edge. She has no weight loss or change in bowel habits.","qs":[{"n":781,"t":"mc","visit":"Visit 1","s":"What is the **most likely** diagnosis?","opts":["Thrombosed external hemorrhoid","Full-thickness rectal prolapse","Perianal abscess with pus","Chronic posterior anal fissure"],"correctIdx":[3],"answer":"D","c":"An anal fissure is a tear in the anoderm below the dentate line, most often in the posterior midline, caused by passage of hard stool and high internal sphincter tone. It causes severe, tearing pain during and after defecation with bright red bleeding. A fissure lasting more than 6–8 weeks, or with a sentinel skin tag or hypertrophied papilla, is chronic. Fissures off the midline suggest Crohn disease, infection, HIV or cancer."},{"n":782,"t":"mc","visit":"Visit 1 (continued)","s":"Which treatment is **appropriate** for her fissure?","opts":["Fiber, sitz baths and topical nifedipine or nitroglycerin","Long-term oral opioids for the pain after each stool","Oral antibiotics for 14 days to clear infection","Immediate surgical drainage of the anal area"],"correctIdx":[0],"answer":"A","c":"Anal fissures are treated with fiber and fluids to soften stool, sitz baths, topical anesthetics and topical smooth muscle relaxants (nifedipine or nitroglycerin ointment, which can cause headache) to reduce sphincter spasm. Botulinum toxin injection or lateral internal sphincterotomy is used for chronic fissures that do not heal. Opioids worsen constipation."},{"n":783,"t":"mc","visit":"Visit 2 (2 months later)","s":"A different patient has a fissure in the **lateral** position with perianal skin tags and diarrhea. What should be considered?","opts":["A typical fissure needing only more fiber","Irritable bowel syndrome as the only cause","Normal anatomy that needs no evaluation","Crohn disease or another underlying cause"],"correctIdx":[3],"answer":"D","c":"Fissures off the midline (lateral), multiple fissures, painless fissures or fissures with large skin tags, fistulas or diarrhea suggest a secondary cause such as Crohn disease, tuberculosis, syphilis, HIV, or anal cancer, and need further evaluation, including colonoscopy and possibly biopsy."}]},{"no":262,"batch":11,"title":"Ms. Ferraro: A Racing Heart Out of Nowhere","setting":"Urgent visit • Middle adult • Cardiovascular","scenario":"Ms. Ferraro is a 40-year-old woman who suddenly developed a pounding, racing heartbeat while sitting at her desk 30 minutes ago. She is anxious but alert, with no chest pain or fainting. HR is 190 and regular, BP 118/76 and SpO₂ 98%. Her ECG shows a narrow-complex regular tachycardia without visible P waves. She has had similar brief episodes that stopped on their own.","qs":[{"n":784,"t":"mc","visit":"Visit 1","s":"What is the **most likely** rhythm?","opts":["Atrial fibrillation with rapid response","Monomorphic ventricular tachycardia","Paroxysmal supraventricular tachycardia","Sinus tachycardia from anxiety"],"correctIdx":[2],"answer":"C","c":"Paroxysmal supraventricular tachycardia (most often AV nodal reentrant tachycardia) causes a sudden-onset, sudden-offset regular narrow-complex tachycardia, often 150–250 beats per minute, with P waves hidden in or just after the QRS. Atrial fibrillation is irregularly irregular, ventricular tachycardia is wide-complex, and sinus tachycardia has gradual onset with visible P waves before each QRS."},{"n":785,"t":"ord","visit":"Visit 1 (continued)","s":"She is hemodynamically stable. **Place the treatment steps in the correct order.**","items":["Step 1","Step 2","Step 3","Step 4"],"tgts":["Consider an IV beta-blocker or diltiazem if still not converted","Give adenosine 6 mg as a rapid IV push with a flush","Try a vagal maneuver such as the modified Valsalva","Give adenosine 12 mg if the rhythm persists"],"map":[2,1,3,0],"answer":"C, B, D, A","c":"For stable regular narrow-complex tachycardia, vagal maneuvers (the modified Valsalva, in which the patient strains and is then laid flat with legs raised, is most effective) are tried first. If unsuccessful, adenosine 6 mg is given by rapid IV push followed by a saline flush, then 12 mg if needed; patients should be warned about brief chest discomfort and a feeling of doom. IV beta-blockers or nondihydropyridine calcium blockers are next. Unstable patients need synchronized cardioversion."},{"n":786,"t":"mc","visit":"Visit 2 (follow-up)","s":"She has recurrent episodes. Which long-term option offers a **possible cure**?","opts":["Catheter ablation of the reentrant pathway","Avoiding all exercise for the rest of her life","Daily adenosine tablets taken by mouth","Daily aspirin to prevent further episodes"],"correctIdx":[0],"answer":"A","c":"Catheter ablation is highly effective (often over 95% success) and potentially curative for recurrent AVNRT or accessory pathway tachycardias, and is offered as first-line therapy for symptomatic recurrent SVT. Alternatives include daily or \"pill-in-the-pocket\" beta-blockers or calcium channel blockers. Patients should be taught vagal maneuvers. Adenosine is IV only."}]},{"no":263,"batch":11,"title":"Mrs. Osei-Bonsu: Heavy Periods and Pelvic Pressure","setting":"Women's health visit • Middle adult • Gynecology","scenario":"Mrs. Osei-Bonsu is a 42-year-old Black woman with 2 years of increasingly heavy, prolonged periods with clots, pelvic pressure and urinary frequency. She is fatigued. Her uterus is enlarged to the size of a 14-week pregnancy with an irregular, bumpy contour. Hemoglobin is 9.2 g/dL with low ferritin. Pregnancy test is negative. She hopes to keep her uterus.","qs":[{"n":787,"t":"mc","visit":"Visit 1","s":"What is the **most likely** diagnosis?","opts":["Epithelial ovarian cancer","Endometrial hyperplasia","Diffuse adenomyosis alone","Uterine leiomyomas (fibroids)"],"correctIdx":[3],"answer":"D","c":"Uterine leiomyomas (fibroids) are the most common benign pelvic tumors, especially in Black women, in whom they occur earlier and are larger and more numerous. They cause heavy menstrual bleeding, iron-deficiency anemia, pelvic pressure, urinary frequency and constipation, with an enlarged, irregular uterus. Adenomyosis causes a diffusely enlarged, boggy, tender uterus with painful heavy periods."},{"n":788,"t":"mc","visit":"Visit 1 (continued)","s":"Which test is **first-line** to confirm the diagnosis?","opts":["Diagnostic laparoscopy in the OR","A serum CA-125 tumor marker level","A CT scan of the abdomen and pelvis","Pelvic (transvaginal) ultrasound"],"correctIdx":[3],"answer":"D","c":"Pelvic ultrasound (transabdominal and transvaginal) is the first-line imaging test for fibroids, showing their number, size and location. Saline infusion sonography or MRI helps with submucosal fibroids or surgical planning. Endometrial biopsy is indicated for women 45 or older with abnormal bleeding, or younger women with risk factors for endometrial cancer."},{"n":789,"t":"sata","visit":"Visit 2 (treatment planning)","s":"Which treatments are **uterus-sparing** options fo
